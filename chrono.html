<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chrono">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="chrono.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="chrono-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="chrono-icon-180.png">
<meta name="theme-color" content="#0F172A">
<title>Chrono — Les Wonders</title>
<style>
/* ══ Chrono d'entraînement ══════════════════════════════════════════════
   Page à part de WonderStats : elle n'en partage que les jetons de design
   (mêmes valeurs, mêmes noms) et le service worker. Aucune donnée commune.

   Pensée pour une tablette posée au bord du terrain autant que pour un
   téléphone en main : cibles d'au moins 48 px, chiffres lisibles de loin,
   et sur grand écran le déroulé à côté du chrono plutôt que dessous.   */
:root{
  --bg:#0F172A; --surface:#1E293B; --surface-2:#162032; --sunken:#0B1220; --raised:#1E3A5F;
  --scrim:rgba(2,6,16,.78);
  --line:#334155; --line-strong:#475569; --focus:#93C5FD;
  --txt:#E2E8F0; --txt-strong:#F8FAFC; --txt-soft:#CBD5E1; --txt-dim:#94A3B8; --txt-faint:#8494AB;
  --on-dark:#0B1220; --on-light:#FFFFFF;
  --accent:#3B82F6; --accent-ink:#60A5FA; --accent-solid:#2563EB;
  --ok:#10B981; --ok-ink:#34D399;
  --warn:#F59E0B; --warn-ink:#FBBF24; --warn-solid:#F59E0B;
  --danger:#EF4444; --danger-ink:#F87171; --danger-solid:#DC2626;
  --tint-accent:rgba(59,130,246,.14); --tint-ok:rgba(16,185,129,.14);
  --tint-warn:rgba(245,158,11,.14); --tint-danger:rgba(239,68,68,.14);
  --r-sm:8px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --ff:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --fm:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 var(--ff);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface-2)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ── En-tête et onglets ─────────────────────────────── */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface-2);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.logo{width:36px;height:36px;border-radius:9px;flex:none}
.install{border-color:var(--accent)}
.install ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.brand b{font-size:17px;color:var(--txt-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12px;color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:var(--r-md)}
.tabs button{border:0;background:transparent;color:var(--txt-dim);font-weight:650;padding:10px 14px;min-height:44px;border-radius:var(--r-sm);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--txt-strong)}
.tabs .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:1px}
@media (max-width:560px){ header.top .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px} .tabs{grid-column:1 / -1} .tabs button{flex:1;padding-inline:6px} }
main{padding-block:16px 48px}

/* ── Éléments communs ──────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--txt);font-weight:650;padding:10px 14px;min-height:44px;border-radius:var(--r-sm);cursor:pointer;text-align:center}
.btn.primary{background:var(--accent-solid);border-color:var(--accent-solid);color:var(--on-light)}
.btn.go{background:var(--ok-solid,var(--ok));border-color:var(--ok);color:var(--on-dark)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-ink)}
.btn.danger{color:var(--danger-ink)}
.btn.armed{background:var(--danger-solid);border-color:var(--danger-solid);color:var(--on-light)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}
.ico{width:44px;height:44px;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--txt-dim);font-size:18px;cursor:pointer;display:inline-grid;place-items:center;flex:none}
.ico:hover,.ico[aria-expanded="true"]{background:var(--sunken);color:var(--txt-strong)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-faint);margin:4px 0 0}
.note{font-size:13px;color:var(--txt-dim);margin:0;max-width:70ch}
.warn{color:var(--warn-ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--txt-dim);font-weight:600}
input[type=text],input[type=time]{background:var(--sunken);border:1px solid var(--line);color:var(--txt-strong);border-radius:var(--r-sm);padding:10px;min-height:44px;min-width:0;font-size:16px}
input:invalid{border-color:var(--danger)}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
.empty{padding:24px;text-align:center;color:var(--txt-dim)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--raised);color:var(--txt-strong);
  border:1px solid var(--line-strong);border-radius:var(--r-md);padding:12px 16px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 4px 14px rgba(0,0,0,.42)}

/* ── Séances ───────────────────────────────────────── */
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.scard{display:flex;flex-direction:column;gap:10px}
.scard h3{margin:0;font-size:17px;color:var(--txt-strong);text-wrap:balance}
.scard .meta{font-size:13px;color:var(--txt-dim)}
.scard.cur{border-color:var(--accent)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill);background:var(--tint-accent);color:var(--accent-ink);vertical-align:2px}
.badge.ok{background:var(--tint-ok);color:var(--ok-ink)}

/* ── Préparer ──────────────────────────────────────── */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{background:var(--sunken);border-radius:var(--r-md);padding:8px 10px;min-width:0}
.summary b{display:block;font:700 19px var(--fm);font-variant-numeric:tabular-nums;color:var(--txt-strong)}
.summary span{font-size:12px;color:var(--txt-dim)}
.locked{border:1px solid var(--warn);background:var(--tint-warn);color:var(--warn-ink);border-radius:var(--r-md);padding:10px 12px;font-size:14px}
.tree{display:flex;flex-direction:column}
.node{--indent:22px;display:flex;flex-direction:column;gap:6px;padding:10px 0 10px calc(var(--d) * var(--indent));border-bottom:1px solid var(--line)}
@media (max-width:560px){ .node{--indent:12px} .node .l2{padding-left:0} .menu{padding-left:0} }
.node:last-child{border-bottom:0}
.node .l1{display:flex;align-items:center;gap:8px;min-width:0}
.node .l1 input{flex:1;font-weight:600}
.node.group > .l1 input{font-weight:750}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid var(--accent-ink)}
.node.leaf .dot{background:var(--warn);border-color:var(--warn)}
.node .l2{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-left:20px}
.fld{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--txt-dim);font-weight:600}
.fld input{width:76px;text-align:center;font-family:var(--fm);font-variant-numeric:tabular-nums;padding:8px 6px}
.step{display:inline-flex;align-items:center;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-sm)}
.step button{width:40px;height:40px;border:0;background:transparent;color:var(--txt);font-size:18px;cursor:pointer}
.step button:disabled{opacity:.35}
.step output{min-width:40px;text-align:center;font:700 15px var(--fm);color:var(--txt-strong)}
.calc{font:600 14px var(--fm);font-variant-numeric:tabular-nums;color:var(--txt-soft)}
.when{font:12px var(--fm);font-variant-numeric:tabular-nums;color:var(--txt-faint);margin-left:auto}
.menu{display:flex;flex-wrap:wrap;gap:6px;padding-left:20px}

/* ── Chrono ────────────────────────────────────────── */
.runwrap{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:900px){ .runwrap{grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr)} .runwrap .side{position:sticky;top:96px} .runwrap .side .card{max-height:calc(100vh - 170px);overflow:auto} }
.clockbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--txt-dim)}
.clockbar b{font:700 18px var(--fm);font-variant-numeric:tabular-nums;color:var(--txt-strong)}
.pill{font:650 13px var(--fm);padding:4px 10px;border-radius:var(--r-pill);background:var(--tint-ok);color:var(--ok-ink)}
.pill.late{background:var(--tint-warn);color:var(--warn-ink)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.stage.work{border-color:var(--accent)}
.stage.rest{border-color:var(--ok)}
.crumbs{font-size:14px;color:var(--txt-dim);min-height:20px}
.phase{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.stage.rest .phase{color:var(--ok-ink)}
.lname{font-size:clamp(22px,4vw,34px);font-weight:750;color:var(--txt-strong);text-wrap:balance;margin:0}
.rep{font-size:15px;color:var(--txt-soft)}
.count{font:700 clamp(72px,19vw,190px)/1 var(--fm);font-variant-numeric:tabular-nums;color:var(--txt-strong);letter-spacing:-.04em;margin:10px 0 4px}
.count.low{color:var(--warn-ink)}
.count.over{color:var(--danger-ink)}
.count.up{color:var(--txt-soft)}
.status{font-size:14px;color:var(--txt-dim);min-height:20px}
.levels{display:flex;flex-direction:column;gap:9px;text-align:left;margin-top:12px}
.lvl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;font-size:13px;color:var(--txt-dim)}
.lvl b{color:var(--txt);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl span{font-family:var(--fm);font-variant-numeric:tabular-nums}
.lvl .bar{grid-column:1 / -1;height:7px;background:var(--sunken);border-radius:var(--r-pill);overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill)}
.lvl.cur .bar i{background:var(--warn)}
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ctl .btn{min-height:56px;font-size:16px}
.ctl .main{grid-column:1 / -1;min-height:72px;font-size:19px}
.next{font-size:15px;color:var(--txt-dim);text-align:center}
.next b{color:var(--txt)}
.sound{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--txt-dim)}
.sound .state{font-weight:650}
.sound .state.on{color:var(--ok-ink)}
.sound .state.off{color:var(--warn-ink)}
.alertbar{display:flex;gap:10px;align-items:center;border-radius:var(--r-md);padding:12px 14px;background:var(--tint-warn);border:1px solid var(--warn);color:var(--txt-strong);cursor:pointer;width:100%;text-align:left;font-size:15px}
.plan{display:flex;flex-direction:column;max-height:none}
.plan > div{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.plan > div:last-child{border-bottom:0}
.plan .t{font:12px var(--fm);font-variant-numeric:tabular-nums;color:var(--txt-faint)}
.plan .d{font:13px var(--fm);font-variant-numeric:tabular-nums;color:var(--txt-dim);text-align:right}
.plan small{display:block;color:var(--txt-faint);font-size:12px}
.plan .p{font-size:13px;color:var(--ok-ink)}
.plan .p .d{color:var(--ok-ink)}
.plan .done{opacity:.55}
.plan .cur{color:var(--txt-strong);font-weight:650;opacity:1}
.plan .cur .t{color:var(--warn-ink)}
.real{color:var(--txt-soft)}
.real.late{color:var(--warn-ink)}
.bilan{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.bilan div{background:var(--sunken);border-radius:var(--r-md);padding:10px}
.bilan b{display:block;font:700 18px var(--fm);color:var(--txt-strong)}
.bilan span{font-size:12px;color:var(--txt-dim)}

/* ── Sonnerie : tout l'écran est le bouton d'arrêt ─── */
#ring{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));
  background:var(--warn-solid);color:var(--on-dark);cursor:pointer;border:0;width:100%;font:inherit}
#ring.reprise{background:var(--ok)}
#ring.seance{background:var(--accent-solid);color:var(--on-light)}
#ring .bell{font-size:72px;line-height:1;animation:shake .6s ease-in-out infinite}
#ring .what{font-size:clamp(26px,6vw,48px);font-weight:800;text-wrap:balance}
#ring .sub{font-size:clamp(16px,3vw,22px);font-weight:600;opacity:.85;text-wrap:balance}
#ring .stop{margin-top:10px;font-size:clamp(20px,4vw,28px);font-weight:800;padding:18px 34px;border-radius:var(--r-pill);background:var(--on-dark);color:var(--txt-strong)}
#ring .since{font:600 16px var(--fm);opacity:.8}
#ring.flash{animation:pulse 1s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes pulse{50%{filter:brightness(1.18)}}
@media (prefers-reduced-motion:reduce){ #ring .bell,#ring.flash{animation:none} }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <img class="logo" src="chrono-icon-192.png" alt="" width="36" height="36">
    <div class="brand"><b id="h-title">Chrono</b><span id="h-sub">Les Wonders · entraînement</span></div>
    <button class="btn sm" id="b-installer" hidden>📲 Installer</button>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-seances" data-tab="seances" aria-selected="false">Séances</button>
      <button role="tab" id="tab-preparer" data-tab="preparer" aria-selected="true">Préparer</button>
      <button role="tab" id="tab-chrono" data-tab="chrono" aria-selected="false">Chrono</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="v-seances" class="stack" hidden></section>
  <section id="v-preparer" class="stack" hidden></section>
  <section id="v-chrono" hidden></section>
</main>

<button id="ring" type="button" hidden aria-live="assertive">
  <span class="bell" aria-hidden="true">🔔</span>
  <span class="what" id="ring-what"></span>
  <span class="sub" id="ring-sub"></span>
  <span class="since num" id="ring-since"></span>
  <span class="stop">Arrêter la sonnerie</span>
</button>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
/* ══ Chrono d'entraînement ═══════════════════════════════════════════════
   Modèle (validé avec l'entraîneure sur maquette) :
   · une SÉANCE a un nom, une heure de début, et des exercices joués dans l'ordre ;
   · un EXERCICE peut contenir des sous-exercices, sans limite de profondeur ;
   · seul un exercice du DERNIER NIVEAU porte une durée ; un parent n'en a pas
     d'autre que celle de ses sous-exercices ;
   · tout exercice, parent compris, a un nombre de RÉPÉTITIONS (1 par défaut)
     et une PAUSE entre deux répétitions (0 : pause libre, chronométrée sans cible) ;
   · la fin d'un exercice du dernier niveau SONNE jusqu'à ce que l'entraîneure
     arrête la sonnerie ; la pause qui suit part seule, et sonne à son tour ;
   · l'exercice suivant ne démarre que sur un geste de l'entraîneure.          */
"use strict";
var CHRONO_VERSION = "1.1.1";
var CLE = "wonders-chrono", CLE_RUN = "wonders-chrono:en-cours", CLE_TAB = "wonders-chrono:onglet";
var $ = function (id) { return document.getElementById(id); };
var seq = 0;
function uid() { seq++; return Date.now().toString(36) + "-" + seq.toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

/* ── Temps ───────────────────────────────────────────── */
function fmt(sec) {
  sec = Math.max(0, Math.round(sec));
  var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" + (m < 10 ? "0" : "") + m : m) + ":" + (s < 10 ? "0" : "") + s;
}
function fmtLong(sec) {
  sec = Math.round(sec);
  if (sec < 3600) return Math.floor(sec / 60) + " min" + (sec % 60 ? " " + (sec % 60 < 10 ? "0" : "") + sec % 60 + " s" : "");
  var h = Math.floor(sec / 3600), m = Math.round(sec % 3600 / 60);
  if (m === 60) { h++; m = 0; }
  return h + " h " + (m < 10 ? "0" : "") + m;
}
/* « 5 » = 5 min, « 5:30 », « 0:45 », « 45s », « 1:05:00 ». null si illisible. */
function lireDuree(t) {
  t = String(t == null ? "" : t).trim().replace(",", ".").replace(/\s+/g, "");
  if (!t) return 0;
  var m;
  if ((m = t.match(/^(\d+(?:\.\d+)?)s$/i))) return Math.round(+m[1]);
  if ((m = t.match(/^(\d+(?:\.\d+)?)(min|mn|m)?$/i))) return Math.round(+m[1] * 60);
  var p = t.split(":");
  if (p.length > 3 || !p.every(function (x) { return /^\d+$/.test(x); })) return null;
  p = p.map(Number);
  if (p.length === 2 && p[1] > 59) return null;
  if (p.length === 3 && (p[1] > 59 || p[2] > 59)) return null;
  return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1];
}
function hhmm(ms, sec) {
  var d = new Date(ms), h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
  var r = (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
  return sec ? r + ":" + (s < 10 ? "0" : "") + s : r;
}
/* L'heure de début d'une séance, aujourd'hui. */
function debutPrevu(s, ref) {
  var p = String(s.debut || "00:00").split(":"), d = new Date(ref || Date.now());
  d.setHours(+p[0] || 0, +p[1] || 0, 0, 0);
  return d.getTime();
}

/* ── Données ─────────────────────────────────────────── */
function mkEx(nom, duree, opts) {
  opts = opts || {};
  var e = { id: uid(), nom: nom, repetitions: opts.rep || 1, pause: opts.pause || 0, enfants: opts.enfants || [] };
  if (!e.enfants.length) e.duree = duree || 0;
  return e;
}
function mn(m, s) { return m * 60 + (s || 0); }
function exemple() {
  return { id: uid(), nom: "U14 Bleues · exemple", debut: "18:00", exercices: [
    mkEx("Échauffement", 0, { enfants: [
      mkEx("Mobilité articulaire", mn(5)),
      mkEx("Gainage en circuit", 0, { rep: 3, pause: mn(1), enfants: [
        mkEx("Planche", mn(0, 40)),
        mkEx("Planche latérale", mn(0, 30), { rep: 2, pause: mn(0, 10) })
      ] }),
      mkEx("Touches en binôme", mn(6))
    ] }),
    mkEx("Réception", 0, { enfants: [

  h += '<div class="next" id="c-next"></div>' + sonHtml() + '</div>' +
    '<div class="side stack"><p class="sec">Déroulé' + (RS.recale ? " · recalé sur le départ réel" : "") + '</p><div class="card"><div class="plan" id="c-plan">' +
    planHtml(RS.items, RS.ancre, RS.journal, fini ? RS.items.length : RS.k, true) + '</div></div></div></div>';
  v.innerHTML = h;
  var cur = v.querySelector(".plan .cur"), box = $("c-plan");
  if (cur && box && window.innerWidth >= 900) box.parentNode.scrollTop = Math.max(0, cur.offsetTop - box.parentNode.offsetTop - 80);
}
function boutonArret() {
  return '<button class="btn danger' + (arme === "stop" ? " armed" : "") + '" data-a="arreter">' + (arme === "stop" ? "Arrêter la séance ?" : "■ Arrêter") + '</button>';
}
function sonHtml() {
  return '<div class="sound"><span>Son</span><span class="state" id="c-son"></span><button class="btn sm" data-a="tester">🔔 Tester</button><span id="c-ecran"></span></div>';
}
function planHtml(items, base, journal, k, run) {
  return items.map(function (it, i) {
    var j = journal[i] || {}, cls = (i < k ? "done" : i === k ? "cur" : "");
    if (it.t === "p") {
      return '<div class="p ' + cls + '"><span class="t"></span><span>Pause' + (it.groupe ? " entre deux tours" : "") + (it.dur ? "" : " libre") + '</span><span class="d">' +
        (it.dur ? fmt(it.dur) : "—") + (j.reel != null ? ' <span class="real' + (j.reel > it.dur + 5 && it.dur ? " late" : "") + '">→ ' + fmt(j.reel) + '</span>' : "") + '</span></div>';
    }
    var ch = cheminTexte(it), extra = j.saute ? " · sauté" : j.attente != null && j.attente >= 5 ? " · attente " + fmt(j.attente) : "";
    return '<div class="' + cls + '"><span class="t">' + hhmm(base + it.o * 1000) + '</span><span>' + esc(libelleTravail(it)) +
      ((ch || extra) ? '<small>' + esc(ch) + esc(extra) + '</small>' : "") + '</span><span class="d">' + fmt(it.dur) +
      (j.reel != null ? ' <span class="real' + (j.reel > it.dur + 5 ? " late" : "") + '">→ ' + fmt(j.reel) + '</span>' : "") + '</span></div>';
  }).join("");
}
function bilanHtml() {
  var tr = 0, pa = 0, at = 0;
  RS.items.forEach(function (it, i) {
    var j = RS.journal[i] || {};
    if (it.t === "w") { tr += j.reel || 0; at += j.attente || 0; } else pa += j.reel || 0;
  });
  var reel = ((RS.fin || Date.now()) - RS.lance) / 1000;
  return '<div class="bilan"><div><b class="num">' + fmt(RS.total) + '</b><span>durée prévue</span></div><div><b class="num">' + fmt(reel) + '</b><span>durée réelle</span></div>' +
    '<div><b class="num">' + fmt(tr) + '</b><span>exercices</span></div><div><b class="num">' + fmt(pa) + '</b><span>pauses entre répétitions</span></div>' +
    '<div><b class="num">' + fmt(at) + '</b><span>attentes entre exercices</span></div></div>';
}
function majChrono() {
  if (!RS) return;
  var n = Date.now(), it = RS.items[RS.k], e = ecoule(), fini = RS.phase === "fini";
  var set = function (id, t) { var el = $(id); if (el && el.textContent !== t) el.textContent = t; };
  set("c-now", hhmm(n, true));
  var pos = positionPlan(), ecart = fini ? 0 : (n - (RS.ancre + pos * 1000)) / 1000;
  set("c-fin", fini ? hhmm(RS.fin) : hhmm(n + (RS.total - pos) * 1000));
  var ec = $("c-ecart");
  if (ec) {
    var html = fini ? "" : Math.abs(ecart) < 30 ? '<span class="pill">à l\'heure</span>' : ecart > 0 ? '<span class="pill late">retard ' + fmt(ecart) + '</span>' : '<span class="pill">avance ' + fmt(-ecart) + '</span>';
    if (ec.innerHTML !== html) ec.innerHTML = html;
  }
  var c = $("c-count"); if (!c) return;
  var cls = "count num", txt, st = "", ph = "", nom = "", rep = "", crumbs = cheminTexte(it) || RS.nom;
  if (fini) {
    ph = "Bilan"; nom = RS.interrompue ? "Séance arrêtée" : "Séance terminée"; txt = fmt(((RS.fin) - RS.lance) / 1000); cls += " up";
    st = "Commencée à " + hhmm(RS.lance) + ", finie à " + hhmm(RS.fin) + ". Prévue en " + fmt(RS.total) + "."; crumbs = RS.nom;
  } else if (RS.phase === "travail") {
    var reste = it.dur - e;
    ph = "Exercice"; nom = it.nom; rep = it.reps > 1 ? "Répétition " + it.rep + " sur " + it.reps : "";
    txt = fmt(Math.ceil(reste - 0.001)); if (reste <= 10) cls += " low";
    st = RS.susp ? "Suspendu : le temps de l'exercice est arrêté, pas l'horloge." : "Sonne à " + hhmm(n + reste * 1000, true);
  } else if (RS.phase === "pause") {
    var nx = RS.items[RS.k + 1];
    ph = "Pause"; nom = it.groupe ? "Pause entre deux tours" : "Pause · " + it.nom;
    rep = it.groupe ? "Avant le tour " + (it.apres + 1) + " sur " + it.reps : "Avant la répétition " + (it.apres + 1) + " sur " + it.reps;
    if (!it.dur) { txt = fmt(e); cls += " up"; st = "Pause libre : chronométrée, sans sonnerie. Démarrez quand vous voulez."; }
    else if (e < it.dur) { txt = fmt(Math.ceil(it.dur - e - 0.001)); if (it.dur - e <= 10) cls += " low"; st = "Reprise prévue à " + hhmm(RS.debut + it.dur * 1000, true); }
    else { txt = "+" + fmt(e - it.dur); cls += " over"; st = "Pause de " + fmt(it.dur) + " dépassée : démarrez " + (nx ? libelleTravail(nx) : "la suite") + "."; }
  } else {
    ph = "En attente de votre signal"; nom = it.nom; rep = it.reps > 1 ? "Répétition " + it.rep + " sur " + it.reps : "";
    txt = fmt(e); cls += " up"; st = "Attente depuis " + hhmm(RS.debut, true) + " · " + fmt(it.dur) + " à faire";
  }
  set("c-crumbs", crumbs); set("c-phase", ph); set("c-nom", nom); set("c-rep", rep); set("c-status", st);
  if (c.textContent !== txt) c.textContent = txt;
  if (c.className !== cls) c.className = cls;
  var lv = $("c-levels");
  if (lv) {
    var bars = niveaux().map(function (l, i) {
      var p = l.t ? Math.max(0, Math.min(100, l.p / l.t * 100)) : 0;
      return '<div class="lvl' + (l.cur ? " cur" : "") + '"><b>' + esc(l.nom) + '</b><span>' + fmt(Math.max(0, Math.min(l.p, l.t))) + " / " + fmt(l.t) + '</span><div class="bar"><i style="width:' + p.toFixed(1) + '%"></i></div></div>';
    }).join("");
    if (lv.innerHTML !== bars) lv.innerHTML = bars;
  }
  var nxt = "";
  if (!fini) {
    var k = RS.phase === "travail" ? RS.k + 1 : RS.phase === "pause" ? RS.k + 2 : RS.k + 1, suiv = RS.items[k];
    var pre = RS.phase === "travail" ? "Ensuite : " : "Puis : ";
    if (suiv && suiv.t === "p") nxt = pre + "<b>pause " + (suiv.dur ? fmt(suiv.dur) : "libre") + "</b>" + (prochainTravail(k) ? ", puis " + esc(libelleTravail(prochainTravail(k))) : "");
    else if (suiv) nxt = pre + "<b>" + esc(libelleTravail(suiv)) + "</b> · " + fmt(suiv.dur);
    else nxt = "Dernier exercice de la séance.";
  }
  var ne = $("c-next"); if (ne && ne.innerHTML !== nxt) ne.innerHTML = nxt;
}
function rendreSon() {
  var on = sonActif(), t = on ? "activé" : AC ? "en veille — touchez l'écran" : "à activer — touchez l'écran";
  ["c-son", "s-etat"].forEach(function (id) { var el = $(id); if (el) { el.textContent = id === "s-etat" ? "Son " + t + "." : t; el.className = "state " + (on ? "on" : "off"); } });
  var ec = $("c-ecran");
  if (ec) ec.textContent = !RS || !enCours() ? "" : verrou ? "· écran maintenu allumé" : navigator.wakeLock && !verrouRefus ? "" : "· réglez le verrouillage automatique de l'écran sur « Jamais »";
}
$("v-chrono").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-a]"); if (!b) return;
  var a = b.dataset.a;
  if (a === "lancer") return lancerSeance();
  if (a === "tester") return testerSon();
  if (a === "son") { debloquerSon(); return; }
  if (!RS) return;
  if (a === "demarrer") return demarrer();
  if (a === "suspendre") return suspendre();
  if (a === "recommencer") return recommencer();
  if (a === "terminer") return terminerTot();
  if (a === "passer") return passer();
  if (a === "refaire") return refaire();
  if (a === "fermer") return fermerBilan();
  if (a === "arreter") { if (arme !== "stop") { armer("stop"); return rendre(); } arme = null; return arreterSeance(); }
});

/* ── Sonnerie plein écran ────────────────────────────── */
function rendreSonnerie() {
  var r = $("ring"), so = RS && RS.sonne;
  r.hidden = !so;
  if (!so) return;
  var it = RS.items[so.k] || {}, what = "", sub = "";
  if (so.type === "fin") {
    what = "Fin : " + libelleTravail(it);
    var nx = RS.items[so.k + 1];
    sub = nx && nx.t === "p" ? (nx.dur ? "La pause de " + fmt(nx.dur) + " a commencé." : "Pause libre : elle est chronométrée.") : nx ? "Prochain : " + libelleTravail(nx) + ". Il démarrera sur votre signal." : "";
  } else if (so.type === "reprise") {
    var w = RS.items[so.k + 1];
    what = "Fin de la pause"; sub = w ? "À vous de lancer : " + libelleTravail(w) + "." : "";
  } else { what = "Séance terminée"; sub = RS.nom; }
  if ($("ring-what").textContent !== what) $("ring-what").textContent = what;
  if ($("ring-sub").textContent !== sub) $("ring-sub").textContent = sub;
  $("ring-since").textContent = "sonne depuis " + fmt((Date.now() - so.depuis) / 1000);
  r.className = so.type + " flash";
}
$("ring").addEventListener("click", function () { arreterSonnerie(); });

/* ── Installation ────────────────────────────────────────
   Comme WonderStats : un manifeste, une icône à elle, le service worker.
   Chrome, Edge et Android proposent l'installation d'un geste
   (beforeinstallprompt), que la page reprend à son compte. Safari ne la
   propose que par Partager → Sur l'écran d'accueil : la page l'explique.
   Une fois l'application installée, plus rien ne s'affiche. */
var invite = null;
function installee() {
  try { return window.matchMedia("(display-mode: standalone)").matches || window.matchMedia("(display-mode: fullscreen)").matches || navigator.standalone === true; }
  catch (e) { return false; }
}
function modeInstallation() { return installee() ? null : invite ? "invite" : IOS ? "ios" : "menu"; }
function rendreInstallation() { var m = modeInstallation(); $("b-installer").hidden = m !== "invite" && m !== "ios"; }
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault(); invite = e; rendreInstallation(); if (onglet === "seances") rendreSeances();
});
window.addEventListener("appinstalled", function () {
  invite = null; rendreInstallation(); if (onglet === "seances") rendreSeances();
  toast("Chrono est installé : il s'ouvre depuis l'écran d'accueil.");
});
function installer() {
  /* L'invitation du navigateur ne sert qu'une fois ; refusée, il en
     renverra une autre plus tard. */
  if (invite) { var e = invite; invite = null; try { e.prompt(); } catch (x) {} rendreInstallation(); if (onglet === "seances") rendreSeances(); return; }
  montrer("seances");   /* la carte d'installation ouvre l'onglet, en haut */
}
$("b-installer").addEventListener("click", installer);
function installHtml() {
  var m = modeInstallation(); if (!m) return "";
  var h = '<div class="card stack install" id="installer-carte"><p class="sec">Installer Chrono</p>';
  if (m === "invite") h += '<p class="note">Chrono s\'installe comme une application : son icône sur l\'écran d\'accueil, en plein écran, et hors ligne.</p>' +
    '<div class="row"><button class="btn primary" data-a="installer">📲 Installer Chrono</button></div>';
  else if (m === "ios") h += '<ol class="note"><li>Ouvrez cette page dans <b>Safari</b>.</li><li>Touchez <b>Partager</b>, le carré d\'où sort une flèche.</li>' +
    '<li>Choisissez <b>Sur l\'écran d\'accueil</b>, puis <b>Ajouter</b>.</li></ol>' +
    '<p class="note">L\'application installée garde ses propres séances, à part de Safari : préparez-les dedans, ou faites-les passer par Exporter puis Importer.</p>';
  else h += '<p class="note">Dans le menu du navigateur, choisissez <b>Installer l\'application</b> ou <b>Ajouter à l\'écran d\'accueil</b>.</p>';
  return h + '</div>';
}

/* ── Démarrage ───────────────────────────────────────── */
document.querySelectorAll(".tabs button").forEach(function (b) { b.addEventListener("click", function () { montrer(b.dataset.tab); }); });
var cacheeDepuis = null;
document.addEventListener("visibilitychange", function () {
  if (document.hidden) { cacheeDepuis = Date.now(); return; }
  avancer(); synchroniserSon(); garderEcran(enCours()); rendre();
  /* Rien ne garantit qu'une page cachée ait pu sonner : on le dit. */
  if (cacheeDepuis && RS && RS.sonne && RS.sonne.depuis > cacheeDepuis)
    toast("La sonnerie de " + hhmm(RS.sonne.depuis, true) + " est tombée pendant que la page était cachée : elle a pu rester muette.");
  cacheeDepuis = null;
});
window.addEventListener("storage", function (e) {
  /* Deux onglets ouverts : l'autre a changé les séances ou la séance en cours. */
  if (e.key === CLE) { charger(); rendre(); }
  if (e.key === CLE_RUN) { chargerRun(); synchroniserSon(); rendre(); }
});
charger();
sessionAudio();
chargerRun();
try { onglet = localStorage.getItem(CLE_TAB) || "preparer"; } catch (e) {}
if (["seances", "preparer", "chrono"].indexOf(onglet) < 0) onglet = "preparer";
if (enCours()) onglet = "chrono";
avancer();
rendreInstallation();
montrer(onglet);
setInterval(function () {
  /* Pas de rendu complet ici : il reconstruirait l'éditeur sous les doigts
     de qui prépare une autre séance pendant que celle-ci tourne. */
  avancer(); entete();
  if (onglet === "chrono") rendreChrono();
  rendreSonnerie();
}, 250);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
