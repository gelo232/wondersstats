<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Chrono — Les Wonders. Le logo du club au cadran d'un chronomètre :
       fond bleu Wonders, couronne et poussoir, et sur la lunette l'arc ambre
       du temps qui passe — l'ambre des exercices qui sonnent.
       Le logo est lu dans icon.png (celui de WonderStats), cadré sur sa
       partie utile (x 42→470, y 110→401). Tout tient dans le cercle sûr
       d'une icône « maskable » : 80 % du côté.
       Rendu : chrono-icon-512/192/180.png, voir README → Développement. -->
  <defs>
    <radialGradient id="fond" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#0A5C9E"/>
      <stop offset="1" stop-color="#003A68"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#fond)"/>
  <rect x="446" y="140" width="132" height="60" rx="20" fill="#FFFFFF"/>
  <rect x="486" y="190" width="52" height="50" fill="#FFFFFF"/>
  <g transform="rotate(45 512 560)"><rect x="480" y="168" width="64" height="72" rx="16" fill="#B5C7D3"/></g>
  <circle cx="512" cy="560" r="340" fill="#FFFFFF"/>
  <circle cx="512" cy="560" r="316" fill="none" stroke="#DCE6EF" stroke-width="22"/>
  <path d="M512 244 A316 316 0 0 1 785.7 718.0" fill="none" stroke="#F59E0B" stroke-width="22" stroke-linecap="round"/>
  <svg x="277.0" y="394.0" width="470" height="320" viewBox="42 110 428 291" preserveAspectRatio="xMidYMid meet">
    <image href="icon.png" xlink:href="icon.png" width="512" height="512"/>
  </svg>
</svg>
