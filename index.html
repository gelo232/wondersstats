/* Intégration d'une soumission dans la saison — chemin commun au fichier
   et au relais réseau. Retourne null si elle est refusée. */
function integrateSubmission(squad,data){
  if(!data||!squad)return null;
  if(squad.submissions.some(function(s){return s.id===data.id}))return null;
  var known={};squad.roster.forEach(function(e){known[e.playerId]=true});
  var entries=(data.entries||[]).filter(function(e){return e&&known[e.playerId]});
  if(!entries.length)return null;
  var cid=campaignById(squad,data.campaignId)?data.campaignId:squad.activeCampaignId;
  var camp=campaignById(squad,cid);
  var sub={id:data.id||uid(),viewId:data.viewId||"",viewName:data.viewName||"Vue",
    selectorName:data.selectorName||"",selectorToken:data.selectorToken||"",
    campaignId:cid,campaignName:camp?camp.name:"",
    context:data.context||"",submittedAt:data.submittedAt||nowISO(),
    criteria:data.criteria||CRITERIA.map(function(c){return c.key}),
    entries:entries.map(function(e){return {playerId:e.playerId,number:cleanNum(e.number),
      stats:normStats(e.stats),ratings:e.ratings||{},reco:RECO_BY_KEY[e.reco]?e.reco:"",note:e.note||""}})};
  squad.submissions.push(sub);
  return sub;
}
function importSubmission(squad){
  pickJSON(function(data){
    if(!data||data.type!=="wonderstats-submission"){showToast("⚠️ Ce n'est pas une soumission");return}
    if(squad.submissions.some(function(s){return s.id===data.id})){showToast("⚠️ Soumission déjà importée");return}
    var sub=integrateSubmission(squad,data);
    if(!sub){showToast("⚠️ Aucune joueuse de cette saison dans le fichier");return}
    saveNow();showToast("📥 Soumission de "+(sub.selectorName||"—")+" intégrée");render();
  });
}

/* ══════════════════════════════════════════════════════════════
   SYNCHRONISATION RÉSEAU
   Le sélectionneur travaille sur SON appareil : l'entraîneur publie
   ses vues sur un relais, le sélectionneur les récupère et téléverse
   sa soumission. Le relais est choisi par l'entraîneur (voir server/) ;
   l'application ne parle qu'un contrat HTTP minimal :

     POST {url}?action=publish   corps {room, kind, id, payload}
     GET  {url}?action=list&room=…&kind=…&since=…  →  {ok, items:[…]}

   Les corps sont envoyés en text/plain : aucune requête préliminaire
   CORS, donc compatible aussi bien avec un Cloudflare Worker qu'avec
   un script Google Apps Script.
   ══════════════════════════════════════════════════════════════ */
var SYNC={url:"",room:"",token:"",identity:null,pulled:{packet:"",catalog:"",submission:""},lastSyncAt:null};
var SK_SYNC="wonderstats_sync_v4";
var syncBusy=false;

function saveSync(){try{localStorage.setItem(SK_SYNC,JSON.stringify(SYNC))}catch(e){}}
function loadSync(){
  try{
    var d=localStorage.getItem(SK_SYNC);
    if(d)SYNC=Object.assign({url:"",room:"",token:"",identity:null,
      pulled:{packet:"",catalog:"",submission:""},lastSyncAt:null},JSON.parse(d));
    if(!SYNC.pulled)SYNC.pulled={packet:"",catalog:"",submission:""};
  }catch(e){}
}
function syncReady(){return !!(SYNC.url&&SYNC.room&&SYNC.token)}
function mkRoomCode(){
  var abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",out="";
  for(var i=0;i<6;i++)out+=abc.charAt(Math.floor(Math.random()*abc.length));
  return "WNDR-"+out.slice(0,3)+"-"+out.slice(3);
}
/* Un jeton n'est pas un mot de passe : c'est un porte-clé opaque, émis
   par l'administrateur et révocable. Il identifie une personne auprès du
   relais et détermine ce qu'elle peut y lire. */
function mkToken(){
  var abc="abcdefghijklmnopqrstuvwxyz0123456789",out="";
  for(var i=0;i<32;i++)out+=abc.charAt(Math.floor(Math.random()*abc.length));
  return out;
}
function normUrl(u){
  u=(u||"").trim();
  if(!u)return "";
  if(!/^https?:\/\//i.test(u))u="https://"+u;
  return u.replace(/[?#].*$/,"").replace(/\/+$/,"");
}
function syncEndpoint(params){
  var q=[];
  for(var k in params)if(Object.prototype.hasOwnProperty.call(params,k)&&params[k]!=null)
    q.push(encodeURIComponent(k)+"="+encodeURIComponent(params[k]));
  return SYNC.url+(SYNC.url.indexOf("?")===-1?"?":"&")+q.join("&");
}
function syncFetch(url,opts){
  var ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
  var timer=setTimeout(function(){if(ctrl)ctrl.abort()},20000);
  var o=Object.assign({},opts||{});
  if(ctrl)o.signal=ctrl.signal;
  return fetch(url,o).then(function(r){
    clearTimeout(timer);
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.text();
  }).then(function(txt){
    var data;
    try{data=JSON.parse(txt)}catch(e){throw new Error("Réponse illisible du relais")}
    if(data&&data.ok===false)throw new Error(data.error||"Relais en erreur");
    return data;
  }).catch(function(err){
    clearTimeout(timer);
    if(err&&err.name==="AbortError")throw new Error("Relais injoignable (délai dépassé)");
    throw err;
  });
}
function syncPost(action,body){
  return syncFetch(syncEndpoint({action:action}),{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({room:SYNC.room,token:SYNC.token},body||{}))
  });
}
function syncPing(){return syncFetch(syncEndpoint({action:"ping",room:SYNC.room,token:SYNC.token}))}
function syncWhoami(){return syncFetch(syncEndpoint({action:"whoami",room:SYNC.room,token:SYNC.token}))}
function syncPublish(kind,id,payload,extra){
  if(!syncReady())return Promise.reject(new Error("Synchronisation non configurée"));
  return syncPost("publish",Object.assign({kind:kind,id:id,payload:payload},extra||{}));
}
function syncList(kind,since,teamId){
  if(!syncReady())return Promise.reject(new Error("Synchronisation non configurée"));
  return syncFetch(syncEndpoint({action:"list",room:SYNC.room,token:SYNC.token,
    kind:kind,since:since||"",teamId:teamId||""}));
}

/* ── Émission et révocation des jetons (administrateur) ────── */
function grantToken(person,teamId,role){
  if(!person.token)person.token=mkToken();
  var t=teamId?teamById(teamId):null;
  return syncPost("grant",{grant:{
    token:person.token,name:person.name,
    role:person.isAdmin?"admin":role,
    teamId:teamId||"",teamName:t?t.name:""
  }});
}
function revokeToken(person){
  if(!person||!person.token)return Promise.resolve();
  var tok=person.token;
  person.token="";
  if(!syncReady())return Promise.resolve();
  return syncPost("revoke",{target:tok}).catch(function(){});
}

/* ── Lien d'invitation : porte le jeton personnel ──────────── */
function b64urlEncode(str){
  var b=btoa(unescape(encodeURIComponent(str)));
  return b.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64urlDecode(str){
  str=String(str).replace(/-/g,"+").replace(/_/g,"/");
  while(str.length%4)str+="=";
  return decodeURIComponent(escape(atob(str)));
}
function inviteLink(person){
  if(!SYNC.url||!SYNC.room||!person||!person.token)return "";
  var base=location.href.replace(/[?#].*$/,"");
  return base+"#s="+b64urlEncode(JSON.stringify({u:SYNC.url,r:SYNC.room,t:person.token}));
}
function readShareLink(){
  var m=(location.hash||"").match(/[#&]s=([A-Za-z0-9_-]+)/);
  if(!m)return null;
  try{
    var o=JSON.parse(b64urlDecode(m[1]));
    if(o&&o.u&&o.r&&o.t)return {url:normUrl(o.u),room:String(o.r),token:String(o.t)};
  }catch(e){}
  return null;
}
function clearHash(){
  try{history.replaceState(null,"",location.href.replace(/#.*$/,""))}catch(e){location.hash=""}
}

/* ── Entraîneur : publier, relever ─────────────────────────── */
function publishView(squad,view){
  var bad=viewNumberIssues(squad,view);
  if(bad.length){showToast("⚠️ "+plural(bad.length,"numéro")+" à corriger avant publication");return}
  var target=view.selectorPersonId?personById(view.selectorPersonId):null;
  syncBusy=true;render();
  syncPublish("packet",view.id,buildPacket(squad,view),
      {teamId:squad.teamId,to:(target&&target.token)||""}).then(function(){
    view.published=true;SYNC.lastSyncAt=nowISO();
    syncBusy=false;saveNow();saveSync();
    showToast("📡 « "+view.name+" » publiée"+(target?" pour "+target.name:""));render();
  }).catch(function(err){
    syncBusy=false;showToast("⚠️ "+err.message);render();
  });
}
/* Catalogue d'équipe : ce qui permet à un sélectionneur de choisir
   lui-même ses athlètes. Numéros et positions uniquement. */
function buildCatalog(squad){
  var camp=curCampaign(squad),season=seasonById(squad.seasonId);
  return {
    type:"wonderstats-catalog",version:4,createdAt:nowISO(),
    teamId:squad.teamId,teamName:squad.name,category:squad.category,
    seasonId:squad.seasonId,seasonName:season?season.name:"",
    campaignId:camp?camp.id:null,campaignName:camp?camp.name:"",
    criteria:CRITERIA.map(function(c){return c.key}),groups:SG_KEYS.slice(),
    players:squad.roster.filter(function(e){return e.number&&isInSquad(e)}).map(function(e){
      return {playerId:e.playerId,number:e.number,position:e.position||""};
    })
  };
}
function publishCatalog(squad){
  var cat=buildCatalog(squad);
  if(!cat.players.length){showToast("⚠️ Aucune joueuse retenue avec un numéro");return}
  syncBusy=true;render();
  syncPublish("catalog",squad.teamId+"|"+squad.seasonId,cat,{teamId:squad.teamId}).then(function(){
    squad.catalogPublishedAt=nowISO();SYNC.lastSyncAt=nowISO();
    syncBusy=false;saveNow();saveSync();
    showToast("📡 Catalogue publié — "+plural(cat.players.length,"athlète"));render();
  }).catch(function(err){
    syncBusy=false;showToast("⚠️ "+err.message);render();
  });
}
function pullSubmissions(squad){
  syncBusy=true;render();
  syncList("submission",SYNC.pulled.submission,squad.teamId).then(function(data){
    var items=(data&&data.items)||[],added=0,latest=SYNC.pulled.submission;
    items.forEach(function(it){
      if(it.at&&it.at>latest)latest=it.at;
      var sub=it.payload;
      if(!sub||sub.type!=="wonderstats-submission")return;
      /* L'identité vient du jeton, estampillée par le relais — plus du
         texte libre saisi par le sélectionneur (constat R8). */
      if(it.by&&it.by.name)sub.selectorName=it.by.name;
      if(it.by&&it.by.token)sub.selectorToken=it.by.token;
      if(integrateSubmission(squad,sub))added++;
    });
    SYNC.pulled.submission=latest;SYNC.lastSyncAt=nowISO();
    syncBusy=false;saveNow();saveSync();
    showToast(added?("📥 "+plural(added,"soumission")+" intégrée(s)"):"Aucune nouvelle soumission");
    render();
  }).catch(function(err){
    syncBusy=false;showToast("⚠️ "+err.message);render();
  });
}

/* ── Sélectionneur : récupérer, téléverser ─────────────────── */
function pullForSelector(){
  syncBusy=true;render();
  Promise.all([syncList("catalog",""),syncList("packet","")]).then(function(res){
    var cats=(res[0]&&res[0].items)||[],packs=(res[1]&&res[1].items)||[];
    var nCat=0,added=0,updated=0;
    INBOX.catalogs=INBOX.catalogs||[];
    cats.forEach(function(it){
      var c=it.payload;
      if(!c||c.type!=="wonderstats-catalog")return;
      INBOX.catalogs=INBOX.catalogs.filter(function(x){return !(x.teamId===c.teamId&&x.seasonId===c.seasonId)});
      INBOX.catalogs.push(c);nCat++;
    });
    packs.forEach(function(it){
      var pk=it.payload;
      if(!pk||pk.type!=="wonderstats-selector-packet"||!pk.view)return;
      var existing=null;
      INBOX.views.forEach(function(v){if(v.id===pk.view.id)existing=v});
      var fresh=packetToView(pk);
      if(!existing){INBOX.views.push(fresh);added++}
      else{
        /* On ne réécrit jamais un travail en cours : seule la composition
           de la vue est rafraîchie, les évaluations déjà saisies restent. */
        existing.name=fresh.name;existing.criteria=fresh.criteria;existing.groups=fresh.groups;
        existing.anonymous=fresh.anonymous;existing.labels=fresh.labels;
        existing.campaignId=fresh.campaignId;existing.campaignName=fresh.campaignName;
        existing.context=fresh.context;existing.numbers=fresh.numbers;
        existing.playerIds=fresh.playerIds;
        fresh.playerIds.forEach(function(pid){if(!existing.data[pid])existing.data[pid]=mkEntryData()});
        updated++;
      }
    });
    SYNC.lastSyncAt=nowISO();
    syncBusy=false;saveNow();saveSync();
    showToast((nCat||added||updated)
      ?("📥 "+plural(nCat,"équipe")+" · "+added+" nouvelle(s) vue(s), "+updated+" mise(s) à jour")
      :"Rien de nouveau");
    render();
  }).catch(function(err){
    syncBusy=false;showToast("⚠️ "+err.message);render();
  });
}
function uploadSubmission(view){
  var sub=buildSubmission(view,function(pid){return (view.numbers||{})[pid]||""});
  syncBusy=true;render();
  syncPublish("submission",sub.id,sub,{teamId:view.teamId||""}).then(function(){
    view.submittedAt=sub.submittedAt;view.submissionCount=(view.submissionCount||0)+1;
    view.uploadedAt=sub.submittedAt;SYNC.lastSyncAt=nowISO();
    syncBusy=false;saveNow();saveSync();
    showToast("✅ Soumission téléversée");
    state.tab="sv_views";render();
  }).catch(function(err){
    syncBusy=false;
    showToast("⚠️ "+err.message+" — utilisez le fichier de secours");
    render();
  });
}

/* ══ DOM ═══════════════════════════════════════════════════════ */
var EVT={onclick:1,oninput:1,onchange:1,onkeydown:1,onblur:1,onfocus:1};
function h(tag,attrs){
  var el=document.createElement(tag),ch=Array.prototype.slice.call(arguments,2);
  if(attrs)for(var k in attrs){
    if(!Object.prototype.hasOwnProperty.call(attrs,k))continue;
    var v=attrs[k];
    if(v==null||v===false)continue;
    if(EVT[k])el[k]=v;
    else if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k==="className")el.className=v;
    else if(k==="value")el.value=v;
    else el.setAttribute(k,v===true?"":v);
  }
  (function add(list){
    list.forEach(function(c){
      if(c==null||c===false)return;
      if(Array.isArray(c))add(c);
      else if(typeof c==="string"||typeof c==="number")el.appendChild(document.createTextNode(String(c)));
      else el.appendChild(c);
    });
  })(ch);
  return el;
}
function bindInput(el,cb){["input","change"].forEach(function(evt){el.addEventListener(evt,cb)})}

/* Toast hors cycle de rendu : ne détruit pas le DOM (donc pas le focus) */
var toastTimer=null;
function showToast(msg){
  state.toast=msg;
  var app=document.getElementById("app");if(!app)return;
  var old=app.querySelector(".toast");if(old)old.remove();
  var el=h("div",{className:"toast"},msg);
  app.appendChild(el);
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){state.toast=null;var t=app.querySelector(".toast");if(t)t.remove();toastTimer=null},2600);
}
function confirmAct(msg){return window.confirm(msg)}

/* ── Tableau de sélection : retenir / recaller / couper ─────── */
function renderSelectionBoard(squad){
  var camp=curCampaign(squad);
  var compiled=compileSubmissions(squad,camp?camp.id:null);
  var dup=dupNumbers(squad);
  var counts={candidate:0,recalled:0,selected:0,cut:0};
  squad.roster.forEach(function(e){counts[e.status]=(counts[e.status]||0)+1});

  var filters=[{k:"all",l:"Toutes ("+squad.roster.length+")"}].concat(STATUS_ORDER.map(function(st){
    return {k:st,l:STATUSES[st].icon+" "+STATUSES[st].label+" ("+(counts[st]||0)+")"};
  }));
  var fRow=h("div",{className:"sub-pills",style:{marginBottom:"12px",paddingBottom:"2px"}},filters.map(function(f){
    var b=h("button",{className:"pill sm"+(state.statusFilter===f.k?" active":""),onclick:function(){state.statusFilter=f.k;render()}},f.l);
    if(state.statusFilter===f.k)b.style.background=f.k==="all"?"#3B82F6":STATUSES[f.k].color;
    return b;
  }));

  function visible(){
    var list=squad.roster.filter(function(e){return state.statusFilter==="all"||e.status===state.statusFilter});
    var q=(state.search||"").trim().toLowerCase();
    if(q)list=list.filter(function(e){
      var p=playerById(e.playerId);
      return (fullName(p).toLowerCase().indexOf(q)!==-1)||(e.number.indexOf(q)===0);
    });
    return list.slice().sort(function(a,b){
      var sa=(compiled[a.playerId]||{}).score||0,sb=(compiled[b.playerId]||{}).score||0;
      if(sb!==sa)return sb-sa;
      return (parseInt(a.number,10)||999)-(parseInt(b.number,10)||999);
    });
  }

  var searchInp=h("input",{className:"txt",placeholder:"Rechercher une joueuse ou un numéro…",value:state.search,style:{marginBottom:"10px"}});
  searchInp.addEventListener("input",function(e){state.search=e.target.value;refreshList()});

  var listWrap=h("div",{id:"selList"});
  function rowFor(e){
    var p=playerById(e.playerId);if(!p)return null;
    var c=compiled[e.playerId];
    var numI=h("input",{className:"num-badge"+(e.number&&dup[e.number]?" dup":"")+(e.number?"":" dup"),
      value:e.number,inputmode:"numeric",placeholder:"#",maxlength:"3"});
    numI.addEventListener("input",function(ev){
      e.number=cleanNum(ev.target.value);ev.target.value=e.number;scheduleAutoSave();
    });
    numI.addEventListener("blur",function(){refreshList()});

    var stBtns=h("div",{className:"status-btns"},RECOS.map(function(r){
      var target=RECO_TO_STATUS[r.key],on=e.status===target;
      var b=h("button",{className:"st-btn"+(on?" on":""),title:r.label,onclick:function(){
        setRosterStatus(squad,e,on?"candidate":target);render();
      }},r.icon);
      if(on){b.style.background=r.color;b.style.borderColor=r.color}
      return b;
    }));

    var meta=[posBadge(e.position),statusBadge(e.status)];
    if(isInSquad(e)===false&&e.status==="selected")meta.push(membershipBadge(e.membership));
    else if(e.status==="selected"&&e.membership!=="active")meta.push(membershipBadge(e.membership));
    if(c&&c.n){
      meta.push(h("span",{className:"badge",style:{background:scoreColor(c.score)+"22",color:scoreColor(c.score),borderColor:scoreColor(c.score)+"55"}},
        "★ "+c.score.toFixed(1)+" · "+plural(c.n,"éval")));
      if(c.topReco)meta.push(h("span",{className:"badge",style:{background:RECO_BY_KEY[c.topReco].color+"18",color:RECO_BY_KEY[c.topReco].color}},
        "Avis : "+RECO_BY_KEY[c.topReco].short));
    }
    if(!e.number)meta.push(h("span",{className:"badge",style:{background:"#EF444422",color:"#FCA5A5",borderColor:"#EF444455"}},"numéro à saisir"));

    var row=h("div",{className:"list-row"},numI,
      h("div",{className:"body",onclick:function(){state.expandedPlayerId=state.expandedPlayerId===e.playerId?null:e.playerId;render()}},
        h("div",{className:"pname"},fullName(p)),
        h("div",{style:{display:"flex",gap:"4px",flexWrap:"wrap",marginTop:"4px"}},meta)),
      stBtns);
    if(state.expandedPlayerId!==e.playerId)return row;
    return h("div",null,row,renderPlayerSheet(squad,e,p));
  }
  function refreshList(){
    var nl=h("div",{id:"selList"});
    var fresh=visible();
    if(!fresh.length)nl.appendChild(h("div",{className:"empty"},"Aucun résultat"));
    fresh.forEach(function(x){var r=rowFor(x);if(r)nl.appendChild(r)});
    var cur=document.getElementById("selList");
    if(cur&&cur.parentNode)cur.parentNode.replaceChild(nl,cur);
  }
  var list=visible();
  if(!list.length)listWrap.appendChild(h("div",{className:"empty"},squad.roster.length?"Aucun résultat":"Aucune joueuse convoquée. Onglet Joueuses → Convoquer."));
  list.forEach(function(e){var r=rowFor(e);if(r)listWrap.appendChild(r)});

  var miss=missingNumbers(squad).length,nDup=Object.keys(dup).length;
  var warn=(miss||nDup)?h("div",{className:"hint warn"},
    "⚠️ "+(miss?plural(miss,"joueuse")+" sans numéro. ":"")+(nDup?nDup+" numéro(s) en double. ":"")+
    "Les numéros se saisissent ici, directement dans la case de gauche. Chacun doit être unique : c'est la seule information que verront vos sélectionneurs."):null;

  var campChip=camp?h("div",{className:"card tight",style:{marginBottom:"12px"}},
    h("div",{className:"row-between"},
      h("div",{style:{minWidth:"0"}},
        h("div",{className:"muted"},"Scores affichés pour la campagne"),
        h("div",{style:{fontWeight:"700",color:"#F8FAFC",marginTop:"2px"}},campaignLabel(camp))),
      h("button",{className:"btn btn-ghost xs",onclick:function(){state.seasonPane="campaigns";render()}},"Changer"))):null;

  var nSub=campaignSubs(squad,camp?camp.id:null).length;
  var actions=h("div",{className:"btn-row",style:{marginTop:"14px"}},
    h("button",{className:"btn btn-primary sm",onclick:function(){state.tab="players";state.playersPane="db";render()}},"+ Convoquer des joueuses"),
    nSub?h("button",{className:"btn btn-warn sm",onclick:function(){openModal("applyreco")}},"⚡ Appliquer les avis ("+nSub+")"):null,
    h("button",{className:"btn btn-save sm",onclick:function(){promoteSelectedToTeam(squad)}},"👕 Composer l'équipe"));

  return h("div",null,
    h("div",{className:"hint"},"Convoquez vos joueuses, saisissez leur numéro, faites-les évaluer, puis tranchez : ",
      h("b",null,"✅ Retenir")," (entre dans l'équipe de la saison), ",h("b",null,"🔁 Recaller")," (rappelée pour la suite), ",h("b",null,"⛔ Non retenue"),"."),
    warn,campChip,searchInp,fRow,listWrap,actions);
}

/* ── Fiche joueuse de saison ────────────────────────────────
   Réunit ce que l'audit avait trouvé séparé : le cumul de match
   (quantitatif) et les évaluations par campagne (qualitatif). */
function renderPlayerSheet(squad,entry,p){
  var box=h("div",{className:"card",style:{marginTop:"-2px",marginBottom:"10px",borderTopLeftRadius:"0",borderTopRightRadius:"0"}});

  /* Position */
  box.appendChild(h("div",{className:"field"},h("label",null,"Position"),
    h("div",{className:"pos-btns"},POSITIONS.filter(function(x){return x.key!=="ALL"}).map(function(pos){
      var v=pos.key==="NONE"?"":pos.key;
      return h("button",{className:"pos-btn"+(entry.position===v?" active":""),onclick:function(){entry.position=v;scheduleAutoSave();render()}},pos.label);
    }))));

  /* Statut d'effectif — seulement une fois retenue */
  if(entry.status==="selected"){
    box.appendChild(h("div",{className:"field"},h("label",null,"Dans l'effectif"),
      h("div",{className:"reco-row"},MEMBERSHIP_ORDER.map(function(k){
        var m=MEMBERSHIPS[k],on=entry.membership===k;
        var b=h("button",{className:"reco-btn"+(on?" on":""),onclick:function(){
          entry.membership=k;scheduleAutoSave();render();
        }},m.icon+" "+m.label);
        if(on){b.style.background=m.color;b.style.borderColor=m.color}
        return b;
      })),
      h("div",{className:"muted",style:{marginTop:"6px"}},
        "Une joueuse blessée ou partie reste retenue et conserve ses matchs joués ; elle sort simplement du terrain.")));
  }

  /* Cumul de match sur la saison */
  var ms=playerSeasonStats(squad,entry.playerId);
  box.appendChild(h("div",{className:"section-title"},"Matchs de la saison"));
  if(ms.sessions){
    box.appendChild(h("div",{className:"muted",style:{marginBottom:"6px"}},
      plural(ms.sessions,"session")+" jouée(s) · "+ms.teams.map(function(t){return t.name+" ("+t.sessions+")"}).join(", ")));
    box.appendChild(renderStatMini(ms.stats));
  } else box.appendChild(h("div",{className:"muted"},"Aucun match enregistré."));

  /* Évaluations, campagne par campagne */
  var perCamp=squad.campaigns.map(function(c){
    return {campaign:c,c:compileSubmissions(squad,c.id)[entry.playerId]};
  }).filter(function(x){return x.c&&x.c.n});

  box.appendChild(h("div",{className:"section-title"},"Évaluations par campagne"));
  if(!perCamp.length)box.appendChild(h("div",{className:"muted"},"Aucune évaluation reçue pour cette joueuse."));
  perCamp.forEach(function(x,i){
    var prev=i>0?perCamp[i-1]:null;
    var delta=prev?(x.c.score-prev.c.score):null;
    box.appendChild(h("div",{style:{display:"flex",alignItems:"center",gap:"10px",margin:"10px 0 6px"}},
      h("span",{className:"score-pill",style:{background:scoreColor(x.c.score)+"22",color:scoreColor(x.c.score)}},x.c.score.toFixed(1)),
      h("div",{style:{flex:"1",minWidth:"0"}},
        h("div",{style:{fontSize:"13px",fontWeight:"700",color:"#F8FAFC"}},campaignLabel(x.campaign)),
        h("div",{className:"psub"},plural(x.c.n,"évaluation")+" · "+x.c.selectors.join(", "))),
      delta!=null?h("span",{className:"badge",style:{background:deltaColor(delta)+"20",color:deltaColor(delta)}},fmtDelta(delta)):null));
    box.appendChild(renderCritBars(x.c));
  });

  /* Commentaires, toutes campagnes */
  var allNotes=[];
  perCamp.forEach(function(x){x.c.notes.forEach(function(n){allNotes.push(Object.assign({camp:x.campaign.name},n))})});
  if(allNotes.length){
    box.appendChild(h("div",{className:"section-title"},"Commentaires des sélectionneurs"));
    allNotes.forEach(function(n){
      box.appendChild(h("div",{className:"note-item"},h("b",null,n.by+" · "+n.camp+" · "+fmtDay(n.at)),n.text));
    });
  }

  /* Note de l'entraîneur */
  var note=h("textarea",{className:"txt",placeholder:"Note de l'entraîneur…",rows:"2"});
  note.value=entry.note||"";
  note.addEventListener("input",function(e){entry.note=e.target.value;scheduleAutoSave()});
  box.appendChild(h("div",{className:"field",style:{marginTop:"14px"}},h("label",null,"Note entraîneur"),note));

  box.appendChild(h("div",{className:"btn-row",style:{marginTop:"6px"}},
    h("button",{className:"btn btn-ghost xs",onclick:function(){openModal("editplayer",p.id)}},"✏️ Fiche joueuse"),
    h("button",{className:"btn btn-danger-o xs",onclick:function(){
      if(!confirmAct("Retirer "+fullName(p)+" de la saison « "+squad.name+" » ?\n(La joueuse reste dans la base de données.)"))return;
      removeFromSquad(squad,p.id);render();
    }},"Retirer de la saison")));
  return box;
}

function renderCritBars(c){
  return h("div",null,CRITERIA.map(function(cr){
    var r=c.ratings[cr.key];
    var avg=r&&r.n?r.avg:0;
    return h("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"6px"}},
      h("span",{style:{fontSize:"12px",color:"#94A3B8",width:"104px",flexShrink:"0"}},cr.label),
      h("span",{className:"bar-mini",style:{flex:"1",width:"auto"}},h("i",{style:{width:(avg/RATING_MAX*100)+"%",background:scoreColor(avg)}})),
      h("span",{style:{fontSize:"12px",fontWeight:"800",color:scoreColor(avg),width:"58px",textAlign:"right"}},
        r&&r.n?(avg.toFixed(1)+(r.min!==r.max?" ("+r.min+"–"+r.max+")":"")):"—"));
  }));
}
function renderStatMini(stats){
  var wrap=h("div",{className:"stat-mini"});
  var any=false;
  SG_KEYS.forEach(function(k){
    var g=SG[k];
    g.stats.forEach(function(s){
      if(!stats[s.key])return;any=true;
      wrap.appendChild(h("span",{style:{color:g.color}},g.name.slice(0,3)+" "+s.label+" : "+stats[s.key]));
    });
  });
  if(!any)wrap.appendChild(h("span",null,"Aucune statistique"));

function setRosterStatus(squad,entry,status){
  entry.status=status;
  if(status==="selected"){
    if(!MEMBERSHIPS[entry.membership])entry.membership="active";
    if(squad.playerIds.indexOf(entry.playerId)===-1)squad.playerIds.push(entry.playerId);
  } else {
    /* Jamais retenue : elle n'a rien joué, on peut la détacher sans perte. */
    detachFromTeam(squad,entry.playerId);
  }
  scheduleAutoSave();
}
function detachFromTeam(team,pid){
  team.playerIds=team.playerIds.filter(function(x){return x!==pid});
  team.lineup=team.lineup.filter(function(x){return x!==pid});
  team.subteams.forEach(function(st){st.playerIds=st.playerIds.filter(function(x){return x!==pid})});
}
/* Retire une joueuse de l'équipe pour cette saison. Elle reste dans la
   base du club, et ses matchs déjà joués restent dans les sessions. */
function removeFromSquad(squad,pid){
  squad.roster=squad.roster.filter(function(e){return e.playerId!==pid});
  detachFromTeam(squad,pid);
  delete squad.stats[pid];
  squad.selectorViews.forEach(function(v){
    v.playerIds=v.playerIds.filter(function(x){return x!==pid});delete v.data[pid];
  });
  state.expandedPlayerId=null;
  scheduleAutoSave();
}
function promoteSelectedToTeam(squad){
  if(!squad){showToast("⚠️ Aucune équipe");return}
  var added=0;
  squad.roster.forEach(function(e){
    if(!isInSquad(e))return;
    if(squad.playerIds.indexOf(e.playerId)===-1){squad.playerIds.push(e.playerId);added++}
  });
  saveNow();
  showToast(added?("👕 "+plural(added,"joueuse")+" ajoutée(s) à "+squad.name):"Équipe déjà à jour");
  render();
}

/* Les numéros ne sont jamais attribués par l'application : l'entraîneur les

function numberTaken(season,num,exceptPid){
  num=cleanNum(num);
  if(!num)return false;
  return season.roster.some(function(e){return e.number===num&&e.playerId!==exceptPid});
}

var dragPid=null;
function renderRosterPane(squad){
  if(!squad)return h("div",{className:"empty"},"Aucune saison active");
  if(!squad.roster.length)return h("div",null,
    h("div",{className:"hint"},"Aucune joueuse convoquée pour « "+squad.name+" »."),
    h("button",{className:"btn btn-primary full",onclick:function(){state.playersPane="db";render()}},"Choisir dans la base de données"));
  var dup=dupNumbers(squad);
  var wrap=h("div",null,h("div",{className:"hint"},
    "Le ",h("b",null,"numéro d'athlète")," est la seule information transmise aux sélectionneurs. Il doit être unique dans la saison. Glissez ☰ pour réordonner."));
  squad.roster.forEach(function(e,i){
    var p=playerById(e.playerId);if(!p)return;
    var row=h("div",{className:"list-row","data-idx":String(i),draggable:"true"});
    var handle=h("span",{className:"drag-handle"},"☰");
    row.addEventListener("dragstart",function(ev){dragPid=e.playerId;row.classList.add("dragging");ev.dataTransfer.effectAllowed="move"});
    row.addEventListener("dragend",function(){dragPid=null;row.classList.remove("dragging");document.querySelectorAll(".list-row").forEach(function(r){r.classList.remove("drag-over")})});
    row.addEventListener("dragover",function(ev){ev.preventDefault();row.classList.add("drag-over")});
    row.addEventListener("dragleave",function(){row.classList.remove("drag-over")});
    row.addEventListener("drop",function(ev){ev.preventDefault();row.classList.remove("drag-over");moveRoster(squad,dragPid,e.playerId)});
    var touchPid=null;
    handle.addEventListener("touchstart",function(){touchPid=e.playerId;row.classList.add("dragging")},{passive:true});
    handle.addEventListener("touchmove",function(ev){
      ev.preventDefault();
      var t=ev.touches[0];
      document.querySelectorAll(".list-row").forEach(function(r){r.classList.remove("drag-over")});
      var el=document.elementFromPoint(t.clientX,t.clientY);
      var pr=el&&el.closest?el.closest(".list-row"):null;if(pr)pr.classList.add("drag-over");
    },{passive:false});
    handle.addEventListener("touchend",function(ev){
      row.classList.remove("dragging");
      document.querySelectorAll(".list-row").forEach(function(r){r.classList.remove("drag-over")});
      if(touchPid===null)return;
      var t=ev.changedTouches[0];
      var el=document.elementFromPoint(t.clientX,t.clientY);
      var pr=el&&el.closest?el.closest(".list-row"):null;
      if(pr){var ti=parseInt(pr.getAttribute("data-idx"),10);
        if(!isNaN(ti)&&squad.roster[ti])moveRoster(squad,touchPid,squad.roster[ti].playerId)}
      touchPid=null;
    });

    var numI=h("input",{className:"num-badge"+(e.number&&dup[e.number]?" dup":""),value:e.number,inputmode:"numeric",maxlength:"3",placeholder:"#"});
    numI.addEventListener("input",function(ev){e.number=cleanNum(ev.target.value);ev.target.value=e.number;scheduleAutoSave()});
    numI.addEventListener("blur",function(){render()});

    row.appendChild(handle);
    row.appendChild(numI);
    row.appendChild(h("div",{className:"body"},
      h("div",{className:"pname"},fullName(p)),
      h("div",{style:{marginTop:"5px"}},h("div",{className:"pos-btns"},POSITIONS.filter(function(x){return x.key!=="ALL"}).map(function(pos){
        var v=pos.key==="NONE"?"":pos.key;
        return h("button",{className:"pos-btn"+(e.position===v?" active":""),onclick:function(){e.position=v;scheduleAutoSave();render()}},pos.label);
      })))));
    row.appendChild(h("div",{style:{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"6px"}},
      statusBadge(e.status),
      h("button",{className:"icon-btn",onclick:function(){
        if(!confirmAct("Retirer "+fullName(p)+" de la saison ?"))return;
        removeFromSquad(squad,e.playerId);render();
      }},"✕")));
    wrap.appendChild(row);
  });
  return wrap;
}
function moveRoster(squad,fromPid,toPid){
  if(!fromPid||fromPid===toPid)return;
  var from=-1,to=-1;
  squad.roster.forEach(function(e,i){if(e.playerId===fromPid)from=i;if(e.playerId===toPid)to=i});
  if(from<0||to<0)return;
  var moved=squad.roster.splice(from,1)[0];
  squad.roster.splice(to,0,moved);
  scheduleAutoSave();render();
}

/* Enregistre la session courante puis remet les compteurs à zéro */
function saveSession(team,name){
  var season=team;
  var entries=team.playerIds.map(function(pid){
    var p=playerById(pid),e=rosterEntry(season,pid);
    return {playerId:pid,name:p?fullName(p):"",number:e?e.number:"",position:e?e.position:"",stats:clone(statsOf(team,pid))};
  }).filter(function(en){return hasStats(en.stats)});
  if(!entries.length){showToast("⚠️ Aucune statistique à enregistrer");return false}
  team.sessions.unshift({id:uid(),name:name,date:nowISO(),teamName:team.name,entries:entries});
  team.stats={};
  clearUndo();saveNow();
  return true;
}

/* ── Progression entre deux campagnes ───────────────────────── */
function renderProgressPane(squad,withSubs,wrap){
  if(!campaignById(squad,state.progressFrom)||!campaignSubs(squad,state.progressFrom).length)
    state.progressFrom=withSubs[0].id;
  if(!campaignById(squad,state.progressTo)||!campaignSubs(squad,state.progressTo).length||state.progressTo===state.progressFrom)
    state.progressTo=withSubs[withSubs.length-1].id;

  function picker(label,key){
    var sel=h("select",{className:"txt"},withSubs.map(function(c){return h("option",{value:c.id},campaignLabel(c))}));
    sel.value=state[key];
    sel.addEventListener("change",function(e){state[key]=e.target.value;render()});
    return h("div",{className:"field"},h("label",null,label),sel);
  }
  wrap.appendChild(h("div",{className:"hint"},"Comparaison de deux campagnes, critère par critère. Une joueuse n'apparaît avec un écart que si elle a été évaluée dans les deux."));
  wrap.appendChild(h("div",{className:"grid2"},picker("De","progressFrom"),picker("À","progressTo")));

  var from=campaignById(squad,state.progressFrom),to=campaignById(squad,state.progressTo);
  if(state.progressFrom===state.progressTo){
    wrap.appendChild(h("div",{className:"empty"},"Choisissez deux campagnes différentes"));
    return wrap;
  }
  var rows=compareCampaigns(squad,state.progressFrom,state.progressTo);
  if(!rows.length){wrap.appendChild(h("div",{className:"empty"},"Aucune donnée à comparer"));return wrap}

  wrap.appendChild(h("div",{className:"btn-row",style:{margin:"4px 0 12px"}},
    h("button",{className:"btn btn-export sm",onclick:function(){exportProgressCSV(squad,rows,from,to)}},"📤 Exporter (CSV)")));

  rows.forEach(function(r){
    var p=playerById(r.playerId),e=rosterEntry(squad,r.playerId);
    var open=state.expandedPlayerId===r.playerId;
    wrap.appendChild(h("div",{className:"compile-row",onclick:function(){
      state.expandedPlayerId=open?null:r.playerId;render();
    }},
      h("span",{className:"score-pill",style:{background:deltaColor(r.delta)+"22",color:deltaColor(r.delta)}},fmtDelta(r.delta)),
      h("div",{style:{flex:"1",minWidth:"0"}},
        h("div",{className:"pname"},(e&&e.number?"#"+e.number+" ":"")+fullName(p)),
        h("div",{className:"psub"},
          (r.from!=null?r.from.toFixed(1):"—")+" → "+(r.to!=null?r.to.toFixed(1):"—")+
          (r.delta==null?" · évaluée dans une seule campagne":""))),
      h("span",{style:{color:"#475569"}},open?"▲":"▼")));
    if(!open)return;
    var box=h("div",{className:"card"});
    CRITERIA.forEach(function(cr){
      var d=r.criteria[cr.key];
      box.appendChild(h("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"6px"}},
        h("span",{style:{fontSize:"12px",color:"#94A3B8",width:"104px",flexShrink:"0"}},cr.label),
        h("span",{style:{fontSize:"12px",color:"#64748B",flex:"1"}},
          (d.from!=null?d.from.toFixed(1):"—")+" → "+(d.to!=null?d.to.toFixed(1):"—")),
        h("span",{style:{fontSize:"12px",fontWeight:"800",color:deltaColor(d.delta),width:"48px",textAlign:"right"}},fmtDelta(d.delta))));
    });
    wrap.appendChild(box);
  });
  return wrap;
}
function exportProgressCSV(squad,rows,from,to){
  var head=["Numero","Joueuse",from.name+"_score",to.name+"_score","Delta"]
    .concat(CRITERIA.map(function(c){return "Delta_"+c.label}));
  var lines=[head.join(";")];
  rows.forEach(function(r){
    var p=playerById(r.playerId),e=rosterEntry(squad,r.playerId);
    lines.push([(e&&e.number)||"",fullName(p).replace(/;/g,","),
      r.from!=null?r.from.toFixed(2):"",r.to!=null?r.to.toFixed(2):"",
      r.delta!=null?r.delta.toFixed(2):""]
      .concat(CRITERIA.map(function(c){var d=r.criteria[c.key].delta;return d!=null?d.toFixed(2):""})).join(";"));
  });
  downloadCSV(lines,"Progression_"+safeName(squad.name)+"_"+stamp()+".csv");
}
function countSelectors(squad,campaignId){
  var m={};
  campaignSubs(squad,campaignId).forEach(function(sub){m[(sub.selectorName||sub.viewName||"?").trim()]=1});
  return Object.keys(m).length;
}
function downloadCSV(lines,filename){
  try{
    var blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
    var u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download=filename;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u)},1000);
    showToast("📤 CSV exporté");
  }catch(e){showToast("⚠️ Export impossible")}
}
function exportEvalsCSV(squad,rows,camp){
  var head=["Campagne","Numero","Joueuse","Position","Statut","Effectif","Evaluations","Score"]
    .concat(CRITERIA.map(function(c){return c.label}))
    .concat(["Retenir","Recaller","Non_retenue"])
    .concat(ALL_STATS.map(function(st){return st.key}));
  var lines=[head.join(";")];
  rows.forEach(function(c){
    var p=playerById(c.playerId),e=rosterEntry(squad,c.playerId);
    lines.push([camp?camp.name:"toutes",(e&&e.number)||"",fullName(p).replace(/;/g,","),
      (e&&e.position)||"",(e&&STATUSES[e.status].label)||"",
      (e&&e.status==="selected"&&MEMBERSHIPS[e.membership])?MEMBERSHIPS[e.membership].label:"",
      c.n,c.score.toFixed(2)]
      .concat(CRITERIA.map(function(cr){var x=c.ratings[cr.key];return x&&x.n?x.avg.toFixed(2):""}))
      .concat([c.reco.select||0,c.reco.recall||0,c.reco.cut||0])
      .concat(ALL_STATS.map(function(st){return c.stats[st.key]||0})).join(";"));
  });
  downloadCSV(lines,"Evaluations_"+safeName(squad.name)+"_"+safeName(camp?camp.name:"toutes")+"_"+stamp()+".csv");
}

/* ── Sessions enregistrées ─────────────────────────────────── */

  wrap.appendChild(h("div",{className:"sess-grid"},team.sessions.map(function(s){
    return h("div",{className:"sess-card"},
      h("div",{style:{minWidth:"0"}},
        h("div",{style:{color:"#F8FAFC",fontWeight:"600",fontSize:"14px"}},s.name),
        h("div",{style:{color:"#64748B",fontSize:"12px",marginTop:"2px"}},fmtDate(s.date)),

function renderSelectionTab(){

function renderViewsPane(squad){
  var wrap=h("div",null);
  var camp=curCampaign(squad);
  wrap.appendChild(h("div",{className:"hint"},
    "Une ",h("b",null,"vue sélectionneur")," regroupe les joueuses qu'un évaluateur doit observer, ",
    "au sein d'une ",h("b",null,"campagne")," donnée. Une même joueuse peut figurer dans plusieurs vues."));

  if(seasonClosed(squad))wrap.appendChild(h("div",{className:"hint warn"},
    "🔒 Saison clôturée — les vues ne sont plus distribuées et les soumissions sont refusées."));

  wrap.appendChild(renderSyncPanel(squad));

  var dup=dupNumbers(squad),miss=missingNumbers(squad).length;
  if(Object.keys(dup).length||miss)
    wrap.appendChild(h("div",{className:"hint warn"},"⚠️ Corrigez d'abord les numéros ("+
      (miss?plural(miss,"manquant"):"")+(miss&&Object.keys(dup).length?", ":"")+
      (Object.keys(dup).length?Object.keys(dup).length+" en double":"")+") — onglet 🗓️ Saison → Sélection."));

  wrap.appendChild(h("div",{className:"btn-row",style:{marginBottom:"12px"}},
    h("button",{className:"btn btn-primary sm",disabled:seasonClosed(squad),onclick:function(){
      if(!squad.roster.length){showToast("⚠️ Convoquez d'abord des joueuses");return}

    }},"+ Nouvelle vue"),
    h("button",{className:"btn btn-import sm",onclick:function(){importSubmission(squad)}},"📥 Importer une soumission")));

  /* Groupées par campagne : on ne mélange plus les moments */
  var byCamp={};

  });
  return wrap;

function renderViewCard(squad,camp,v){

  card.appendChild(h("div",{className:"row-between"},

/* ══════════════════════════════════════════════════════════════
   RÔLE SÉLECTIONNEUR
   ⚠️ ANONYMAT : aucune de ces fonctions ne lit fullName / shortName.
   L'unique identifiant affiché est le NUMÉRO D'ATHLÈTE.
   ══════════════════════════════════════════════════════════════ */

/* Une « source » = une vue + le moyen d'obtenir le numéro de chaque joueuse */
function svSources(){
  var out=[];
  /* Vues locales : seulement celles des équipes où je suis affecté comme
     sélectionneur (constat R7 — un appareil partagé n'expose plus tout). */
  DB.squads.forEach(function(sq){
    if(seasonClosed(sq))return;
    if(!canSelect(sq.teamId))return;
    sq.selectorViews.forEach(function(v){
      var c=campaignById(sq,v.campaignId);
      if(c&&c.closedAt)return;
      out.push({view:v,kind:"local",squad:sq,season:sq,seasonName:sq.name,campaign:c});
    });
  });
  INBOX.views.forEach(function(v){
    out.push({view:v,kind:"inbox",squad:null,season:null,seasonName:v.seasonName||v.teamName||"—",campaign:null});
  });
  return out;
}
/* Catalogues reçus : les équipes où je peux composer mes propres vues. */
function svCatalogs(){
  var out=(INBOX.catalogs||[]).slice();
  /* Sur l'appareil de l'entraîneur, une équipe en vue libre est aussi
     proposée sans passer par le relais. */
  DB.squads.forEach(function(sq){
    if(!sq.freeView||seasonClosed(sq)||!canSelect(sq.teamId))return;
    if(out.some(function(c){return c.teamId===sq.teamId&&c.seasonId===sq.seasonId}))return;
    var cat=buildCatalog(sq);
    if(cat.players.length)out.push(cat);
  });
  return out;
}
/* Libellé d'une athlète pour le sélectionneur. Par défaut : le numéro seul.
   Un nom n'apparaît que si l'entraîneur a explicitement levé l'anonymat. */
function svDisplay(src,pid){
  var num=numLabel(svNumber(src,pid));
  if(src.view.anonymous!==false)return num;
  var label=(src.kind==="local")?shortName(playerById(pid)):((src.view.labels||{})[pid]||"");
  return label?(num+" "+label):num;
}
function svCampaignLabel(src){
  if(src.kind==="local"&&src.campaign)return campaignLabel(src.campaign);
  return src.view.campaignName||"";
}
function svFind(id){
  var all=svSources();
  for(var i=0;i<all.length;i++)if(all[i].view.id===id)return all[i];
  return null;
}
function svNumber(src,pid){
  if(!src)return "";
  return src.kind==="local"?numOf(src.squad,pid):((src.view.numbers||{})[pid]||"");
}
function svEntry(view,pid){
  if(!view.data[pid])view.data[pid]=mkEntryData();
  var d=view.data[pid];
  if(!d.stats)d.stats=emptyS();
  if(!d.ratings)d.ratings={};
  return d;
}
function svProgress(src){
  var v=src.view;
  var done=v.playerIds.filter(function(pid){return entryFilled(v,pid)}).length;
  return {done:done,total:v.playerIds.length,pct:v.playerIds.length?Math.round(done/v.playerIds.length*100):0};
}
/* Numéros triés numériquement — l'ordre d'affichage du sélectionneur */
function svOrdered(src){
  return src.view.playerIds.slice().sort(function(a,b){
    var na=parseInt(svNumber(src,a),10),nb=parseInt(svNumber(src,b),10);
    if(isNaN(na))na=9999;if(isNaN(nb))nb=9999;
    return na-nb;
  });
}

/* ── Écran d'évaluation ────────────────────────────────────── */
function renderSvEval(){
  var src=state.svViewId?svFind(state.svViewId):null;
  if(!src){
    var all=svSources();
    if(!all.length)return emptyBlock("🎯","Aucune vue","Importez un paquet sélectionneur pour commencer.",

  }
  var v=src.view,ordered=svOrdered(src);

function renderSvPlayerPanel(src,pid,ordered){
  var v=src.view,d=svEntry(v,pid),num=svNumber(src,pid);
  var panel=h("div",{className:"quick-panel","data-scroll-key":"sv-panel"});

  /* En-tête : numéro seul */
  var idx=ordered.indexOf(pid);
  panel.appendChild(h("div",{className:"row-between",style:{marginBottom:"12px"}},
    h("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},
      h("span",{style:{fontSize:src.view.anonymous!==false?"30px":"20px",fontWeight:"800",color:"#FDE68A"}},svDisplay(src,pid)),
      h("span",{className:"muted"},"athlète "+(idx+1)+"/"+ordered.length)),
    h("div",{className:"btn-row"},
      h("button",{className:"btn btn-ghost xs",disabled:idx<=0,onclick:function(){state.svPlayerId=ordered[idx-1];render()}},"←"),
      h("button",{className:"btn btn-ghost xs",disabled:idx>=ordered.length-1,onclick:function(){state.svPlayerId=ordered[idx+1];render()}},"→"))));

  /* Critères notés 1–5 */
  var crits=v.criteria.filter(function(k){return CRIT_BY_KEY[k]});
  if(crits.length){
    panel.appendChild(h("div",{className:"section-title"},"Évaluation"));
    crits.forEach(function(k){
      var c=CRIT_BY_KEY[k];
      var valSpan=h("span",null,d.ratings[k]?(d.ratings[k]+"/"+RATING_MAX):c.desc);
      var scale=h("div",{className:"rate-scale"});
      for(var i=1;i<=RATING_MAX;i++)(function(n){
        var dot=h("button",{className:"rate-dot"+(d.ratings[k]===n?" on":""),onclick:function(){
          pushUndoView("Note "+c.label+" · "+numLabel(num),v);
          d.ratings[k]=(d.ratings[k]===n)?0:n;
          valSpan.textContent=d.ratings[k]?(d.ratings[k]+"/"+RATING_MAX):c.desc;
          Array.prototype.forEach.call(scale.children,function(el,j){
            el.className="rate-dot"+(d.ratings[k]===j+1?" on":"");
          });
          scheduleAutoSave();
        }},String(n));
        scale.appendChild(dot);
      })(i);
      panel.appendChild(h("div",{className:"crit-block"},
        h("div",{className:"ttl"},h("b",null,c.label),valSpan),scale));
    });
  }

  /* Statistiques observées */
  var groups=(v.groups&&v.groups.length?v.groups:SG_KEYS).filter(function(g){return SG[g]});
  if(groups.length){
    panel.appendChild(h("div",{className:"section-title"},"Statistiques observées"));
    groups.forEach(function(gk){
      var g=SG[gk];
      panel.appendChild(h("div",{className:"qp-group"},
        h("div",{className:"qp-group-title",style:{background:g.color+"20",color:g.color}},g.name),
        h("div",{className:"qp-stats-row"},g.stats.map(function(s){
          var countSpan=h("span",{className:"count"},String(d.stats[s.key]||0));
          var btn=h("button",{className:"qp-stat-btn",style:{borderColor:g.color,background:g.color+"15",color:"#F8FAFC"},onclick:function(){
            pushUndoView(numLabel(num)+" · "+s.label+" +1",v);
            d.stats[s.key]=(d.stats[s.key]||0)+1;
            countSpan.textContent=String(d.stats[s.key]);
            btn.style.background=g.color;btn.style.color="#fff";btn.style.transform="scale(1.05)";
            setTimeout(function(){btn.style.background=g.color+"15";btn.style.color="#F8FAFC";btn.style.transform="scale(1)"},180);
            scheduleAutoSave();
          }},countSpan,h("span",{className:"lbl"},s.label));

/* ── Écran de soumission ───────────────────────────────────── */
function renderSvSubmit(){
  var src=state.svViewId?svFind(state.svViewId):null;
  if(!src)return emptyBlock("📤","Aucune vue sélectionnée","Choisissez d'abord une vue à soumettre.",
    h("button",{className:"btn btn-primary",onclick:function(){state.tab="sv_views";render()}},"Voir mes vues"));
  var v=src.view,ordered=svOrdered(src),pr=svProgress(src);

  var nameInp=h("input",{className:"txt",placeholder:"Votre nom (ex. Marie T.)",value:v.selectorName||""});
  nameInp.addEventListener("input",function(e){v.selectorName=e.target.value;scheduleAutoSave()});

  var wrap=h("div",null);
  var canUpload=src.kind==="inbox"&&syncReady();
  wrap.appendChild(h("div",{className:"hint"},"Vérifiez votre saisie, indiquez votre nom, puis soumettez. ",
    src.kind==="local"?"La soumission est transmise directement à l'entraîneur sur cet appareil."
    :(canUpload?"Vos données seront téléversées vers l'entraîneur."
               :"Vous n'êtes pas connecté au salon : un fichier de soumission sera généré, à transmettre à l'entraîneur.")));
  wrap.appendChild(h("div",{className:"field"},h("label",null,"Sélectionneur"),nameInp));
  wrap.appendChild(h("div",{className:"card tight"},
    h("div",{className:"row-between"},
      h("div",null,h("div",{style:{color:"#F8FAFC",fontWeight:"700"}},v.name),
        h("div",{className:"muted",style:{marginTop:"2px"}},pr.done+"/"+pr.total+" athlètes évaluées")),
      h("span",{className:"score-pill",style:{background:(pr.pct===100?"#10B981":"#F59E0B")+"22",color:pr.pct===100?"#34D399":"#FBBF24"}},pr.pct+"%")),
    h("div",{className:"progress"},h("i",{style:{width:pr.pct+"%"}}))));

  wrap.appendChild(h("div",{className:"section-title"},"Récapitulatif"));
  ordered.forEach(function(pid){
    var d=v.data[pid]||mkEntryData();
    var crits=v.criteria.filter(function(k){return CRIT_BY_KEY[k]&&d.ratings[k]>0});
    var avg=crits.length?crits.reduce(function(s,k){return s+d.ratings[k]},0)/crits.length:0;
    var r=d.reco?RECO_BY_KEY[d.reco]:null;
    var nStats=sumStats(d.stats);
    wrap.appendChild(h("div",{className:"compile-row",onclick:function(){
      state.svPlayerId=pid;state.tab="sv_eval";render();
    }},
      h("span",{className:"score-pill",style:{background:scoreColor(avg)+"22",color:scoreColor(avg)}},avg?avg.toFixed(1):"—"),
      h("div",{style:{flex:"1",minWidth:"0"}},
        h("div",{className:"pname"},svDisplay(src,pid)),
        h("div",{className:"psub"},crits.length+"/"+v.criteria.length+" critères · "+plural(nStats,"action")+((d.note||"").trim()?" · 💬":""))),
      r?h("span",{className:"badge",style:{background:r.color+"20",color:r.color}},r.icon+" "+r.short):
        h("span",{className:"badge",style:{background:"#33415530",color:"#64748B"}},"sans avis")));
  });

  function guard(){
    if(!pr.done){showToast("⚠️ Aucune athlète évaluée");return false}
    if(!(v.selectorName||"").trim()){showToast("⚠️ Indiquez votre nom");nameInp.focus();return false}
    if(src.kind==="local"&&!campaignOpen(src.season,src.campaign)){showToast("⚠️ Campagne close");return false}
    if(pr.done<pr.total&&!confirmAct((pr.total-pr.done)+" athlète(s) non évaluée(s).\nSoumettre quand même ?"))return false;
    return true;
  }
  var submitBtn=h("button",{className:"btn btn-save full",style:{marginTop:"16px"},disabled:syncBusy,onclick:function(){
    if(!guard())return;
    if(src.kind==="local"){
      submitLocalView(src.season,v);
      showToast("✅ Statistiques soumises à l'entraîneur");
      state.tab="sv_views";render();
    } else if(canUpload){
      uploadSubmission(v);
    } else {
      exportSubmission(v);render();
    }
  }},syncBusy?"⏳ Téléversement…":(src.kind==="local"?"✅ Soumettre les statistiques"
      :(canUpload?"📡 Téléverser ma soumission":"📤 Générer le fichier de soumission")));
  wrap.appendChild(submitBtn);
  if(canUpload)wrap.appendChild(h("button",{className:"btn btn-ghost sm full",style:{marginTop:"8px"},onclick:function(){
    if(!guard())return;
    exportSubmission(v);render();
  }},"📤 Plutôt générer un fichier (secours hors-ligne)"));
  if(v.submittedAt)wrap.appendChild(h("div",{className:"muted",style:{textAlign:"center",marginTop:"8px"}},
    "Dernière soumission : "+fmtDate(v.submittedAt)+" · vous pouvez soumettre à nouveau après correction."));
  wrap.appendChild(h("div",{style:{height:"20px"}}));
  return h("div",{className:"content pad","data-scroll-key":"sv-submit"},wrap);
}

      textField("Ex. Match vs Lions, 12 nov.",draft2.context,function(x){draft2.context=x},"Contexte (optionnel)"),
      h("div",{className:"field"},h("label",null,"Anonymat"),anonBtn,
        h("div",{className:"muted",style:{marginTop:"5px"}},
          "Anonyme en sélection, pour un regard neutre. Nominative pour un bilan de fin de saison, où l'évaluateur connaît déjà l'équipe.")),
      h("div",{className:"field"},h("label",null,"Athlètes de la vue"),quick,selCount(),
        toggleGrid(items4,function(it){return state.modalSel.indexOf(it.id)!==-1},function(it){toggleSel(it.id)})),
      h("div",{className:"field"},h("label",null,"Critères d'évaluation"),
        toggleGrid(CRITERIA.map(function(c){return {id:c.key,label:c.label}}),
          function(it){return draft2.criteria.indexOf(it.id)!==-1},
          function(it){var i=draft2.criteria.indexOf(it.id);if(i!==-1)draft2.criteria.splice(i,1);else draft2.criteria.push(it.id)})),
      h("div",{className:"field"},h("label",null,"Groupes de statistiques"),
        toggleGrid(SG_KEYS.map(function(k){return {id:k,label:SG[k].name}}),
          function(it){return draft2.groups.indexOf(it.id)!==-1},
          function(it){var i=draft2.groups.indexOf(it.id);if(i!==-1)draft2.groups.splice(i,1);else draft2.groups.push(it.id)})),
      h("div",{className:"muted"},"Une joueuse peut appartenir à plusieurs vues, y compris dans la même campagne."));

    var btns4=[cancel,h("button",{id:"modalOk",className:"btn btn-save full",onclick:function(){
      var n=(draft2.name||"").trim();
      if(!n){showToast("⚠️ Entrez un nom");return}
      if(!state.modalSel.length){showToast("⚠️ Sélectionnez au moins une athlète");return}
      if(!draft2.criteria.length){showToast("⚠️ Gardez au moins un critère");return}
      var bad=state.modalSel.filter(function(pid){var num=numOf(season,pid);return !num||dupN[num]});
      if(bad.length&&!confirmAct(plural(bad.length,"athlète")+" sans numéro valide (manquant ou en double).\nLe sélectionneur ne pourra pas les distinguer. Continuer ?"))return;
      var camp=campaignById(season,draft2.campaignId)||curCampaign(season);
      var v=v0||mkSelectorView();
      v.name=n;v.selectorName=(draft2.selectorName||"").trim();
      v.context=(draft2.context||"").trim();
      v.anonymous=!!draft2.anonymous;
      v.criteria=draft2.criteria.slice();v.groups=draft2.groups.slice();
      v.playerIds=state.modalSel.slice();
      v.campaignId=camp?camp.id:null;v.campaignName=camp?camp.name:"";
      v.seasonId=season.id;v.seasonName=season.name;
      var dd={};v.playerIds.forEach(function(pid){dd[pid]=v.data[pid]||mkEntryData()});
      v.data=dd;
      if(!v0)season.selectorViews.push(v);
      state.modalDraft=null;state.editViewId=null;
      closeModal();saveNow();showToast("✅ Vue « "+n+" » enregistrée");
    }},v0?"Enregistrer":"Créer la vue")];
    return modalShell(v0?"Modifier la vue":"Nouvelle vue sélectionneur",body4,btns4,"480px");
  }

  /* ── Application des avis compilés au roster ── */
  if(T==="applyreco"){
    if(!season)return null;
    var applyCampId=(state.evalCampaignId&&state.evalCampaignId!=="__all")
      ?state.evalCampaignId:(curCampaign(season)||{}).id;
    var applyCamp=campaignById(season,applyCampId);
    var comp=compileSubmissions(season,applyCampId);
    var changes=[];
    Object.keys(comp).forEach(function(pid){
      var c=comp[pid],e=rosterEntry(season,pid);
      if(!c.topReco||!e)return;
      var target=RECO_TO_STATUS[c.topReco];
      if(e.status!==target)changes.push({entry:e,target:target,c:c});
    });
    var list=h("div",{style:{maxHeight:"40vh",overflowY:"auto",marginBottom:"10px"}});
    if(!changes.length)list.appendChild(h("div",{className:"muted"},"Aucun changement : les statuts correspondent déjà aux avis majoritaires."));
    changes.forEach(function(ch){
      var p=playerById(ch.entry.playerId);
      list.appendChild(h("div",{className:"list-row"},
        h("div",{className:"body"},h("div",{className:"pname"},numLabel(ch.entry.number)+" "+shortName(p)),
          h("div",{className:"psub"},STATUSES[ch.entry.status].label+" → "+STATUSES[ch.target].label+
            "  ("+ch.c.reco[ch.c.topReco]+"/"+ch.c.n+" avis)"))));
    });
    return modalShell("Appliquer les avis des sélectionneurs",
      h("div",null,h("div",{className:"muted",style:{marginBottom:"8px"}},
        "Le statut de chaque joueuse est aligné sur l'avis majoritaire reçu dans la campagne "+
        (applyCamp?"« "+applyCamp.name+" »":"active")+". Vous restez libre de le modifier ensuite."),list),
      [cancel,changes.length?h("button",{id:"modalOk",className:"btn btn-warn full",onclick:function(){
        changes.forEach(function(ch){setRosterStatus(season,ch.entry,ch.target)});
        closeModal();saveNow();showToast("⚡ "+plural(changes.length,"statut")+" mis à jour");
      }},"Appliquer ("+changes.length+")"):null],"440px");
  }
  return null;
}

/* ══════════════════════════════════════════════════════════════
   POSITION DE DÉFILEMENT
   ══════════════════════════════════════════════════════════════ */
var scrollPositions={};
function scrollKeyOf(el){return el.getAttribute("data-scroll-key")||el.className.split(" ")[0]}
function saveScrollPos(){
  var els=document.querySelectorAll(".content,.quick-panel,[data-scroll-key]");
  for(var i=0;i<els.length;i++){var k=scrollKeyOf(els[i]);if(k)scrollPositions[k]=els[i].scrollTop}
}
function restoreScrollPos(){
  requestAnimationFrame(function(){
    var els=document.querySelectorAll(".content,.quick-panel,[data-scroll-key]");
    for(var i=0;i<els.length;i++){
      var k=scrollKeyOf(els[i]);
      if(k&&scrollPositions[k]!=null)els[i].scrollTop=scrollPositions[k];
    }
  });
}

/* ══════════════════════════════════════════════════════════════
   RENDU PRINCIPAL
   ══════════════════════════════════════════════════════════════ */
var TITLES={
  season:"Saison 🗓️",players:"Joueuses 👥",summary:"Récapitulatif",selection:"Vues sélectionneur",
  sv_views:"Mes vues 🎯",sv_eval:"Évaluation",sv_submit:"Soumission",
  adm_people:"Personnes 👤",adm_teams:"Équipes 👕",adm_seasons:"Saisons 🗓️",
  adm_players:"Base de joueuses",adm_sync:"Relais 📡"
};
function render(){
  saveScrollPos();
  var app=document.getElementById("app");if(!app)return;
  app.innerHTML="";
  normalizeCtx();
  if(!tabsForCtx().some(function(t){return t.key===state.tab}))state.tab=(tabsForCtx()[0]||{}).key;

  var season=curSeason(),squad=isCoachCtx()?curSquad():null;
  var title=TITLES[state.tab]||"WonderStats";
  if(state.tab==="input")title=state.inputMode==="quick"?"Saisie rapide":"Saisie grille";

  /* Boutons d'en-tête */
  var leftEl=null,rightEl=null;
  if(isCoachCtx()&&state.tab==="input"&&squad){
    var undoBtn=h("button",{className:"btn btn-undo xs",disabled:!undoStack.length,onclick:doUndo},"↩");
    undoBtn.id="undoBtn";
    leftEl=h("div",{style:{display:"flex",gap:"4px"}},undoBtn,
      h("button",{className:"btn btn-danger-o xs",onclick:function(){
        if(!confirmAct("Réinitialiser toutes les statistiques de la saisie en cours ?"))return;
        pushUndoStats("Réinitialisation");squad.stats={};scheduleAutoSave();showToast("🔄 Réinitialisé");render();
      }},"Reset"));
    var isQuick=state.inputMode==="quick";
    rightEl=h("button",{className:"mode-toggle"+(isQuick?"":" active"),onclick:function(){
      state.inputMode=isQuick?"grid":"quick";state.quickPlayer=null;saveNow();render();
    }},isQuick?"Grille":"Rapide");
  } else if(isSelectorCtx()&&state.tab==="sv_eval"){
    var ub=h("button",{className:"btn btn-undo xs",disabled:!undoStack.length,onclick:doUndo},"↩");
    ub.id="undoBtn";leftEl=ub;
  }
  if(!rightEl)rightEl=ctxBadge();
  if(!leftEl&&isCoachCtx()&&state.tab==="summary"&&squad)
    leftEl=h("button",{className:"btn btn-save xs",onclick:function(){openModal("savesession")}},"💾");

  app.appendChild(renderHeader(title,leftEl,rightEl));
  app.appendChild(renderCtxBar());
  if(isCoachCtx()&&season)app.appendChild(renderSeasonBar());

  /* Contenu */
  var content;
  if(!state.ctx){
    content=emptyBlock("🔑","Aucun contexte",
      "Cet appareil n'est rattaché à aucune équipe. Demandez à votre administrateur une affectation, ou ouvrez le lien d'invitation qu'il vous a transmis.",
      DB.people.length?h("button",{className:"btn btn-primary",onclick:function(){openModal("whoami")}},"Choisir qui je suis"):null);
  } else if(isAdminCtx()){
    if(state.tab==="adm_people")content=renderAdminPeople();
    else if(state.tab==="adm_teams")content=renderAdminTeams();
    else if(state.tab==="adm_seasons")content=renderAdminSeasons();
    else if(state.tab==="adm_players")content=renderAdminPlayers();
    else content=renderAdminSync();
  } else if(isCoachCtx()){
    if(!season)content=emptyBlock("🏐","WonderStats","Créez votre première saison pour démarrer.",
      isAdmin()?h("button",{className:"btn btn-primary",onclick:function(){openModal("newseason")}},"+ Créer une saison"):null);
    else if(!squad)content=emptyBlock("👕","Équipe introuvable","Le contexte pointe vers une équipe qui n'existe plus.",null);
    else if(state.tab==="season")content=renderSeasonTab();
    else if(state.tab==="players")content=renderPlayersTab();
    else if(state.tab==="input")content=renderInputTab();
    else if(state.tab==="summary")content=renderSummaryTab();
    else if(state.tab==="selection")content=renderSelectionTab();
    else content=renderSeasonTab();
  } else {
    if(state.tab==="sv_eval")content=renderSvEval();
    else if(state.tab==="sv_submit")content=renderSvSubmit();
    else content=renderSvViews();
  }
  app.appendChild(content);
  app.appendChild(renderTabBar());

  var modal=renderModal();if(modal)app.appendChild(modal);
  if(state.toast)app.appendChild(h("div",{className:"toast"},state.toast));
  if(state.updateReady)app.appendChild(h("div",{className:"update-bar"},
    h("span",null,"Une nouvelle version est disponible."),
    h("button",{className:"btn btn-primary xs",onclick:function(){saveNow();location.reload()}},"Mettre à jour")));
  restoreScrollPos();
}

loadAll();

/* Lien d'invitation ouvert sur l'appareil d'un sélectionneur : il porte
   un jeton personnel. L'identité et le périmètre viennent du relais, pas
   du lien — c'est ce qui rend le jeton révocable. */
(function(){
  var cfg=readShareLink();
  if(!cfg)return;
  SYNC.url=cfg.url;SYNC.room=cfg.room;SYNC.token=cfg.token;
  SYNC.pulled={packet:"",catalog:"",submission:""};
  SYNC.identity=null;
  saveSync();clearHash();
  syncWhoami().then(function(data){
    var g=data&&data.grant;
    if(!g)throw new Error("Jeton inconnu du relais");
    SYNC.identity=g;saveSync();
    adoptRemoteIdentity(g);
    showToast("📡 Bonjour "+(g.name||"")+" — "+(g.teamName||"")); 
    render();
  }).catch(function(err){
    showToast("⚠️ "+err.message);render();
  });
})();

/* Reconstitue localement la personne, l'équipe et l'affectation décrites
   par le relais, pour que l'appareil du sélectionneur ait un contexte. */
function adoptRemoteIdentity(g){
  if(!g||!g.token)return;
  var person=null;
  DB.people.forEach(function(p){if(p.token===g.token)person=p});
  if(!person){person=mkPerson({name:g.name||"Sélectionneur",token:g.token});DB.people.push(person)}
  else person.name=g.name||person.name;
  person.revoked=false;
  state.meId=person.id;

  if(g.role==="admin"){person.isAdmin=true;normalizeCtx();saveAll();return}
  if(!g.teamId){normalizeCtx();saveAll();return}

  var team=teamById(g.teamId);
  if(!team){
    team=mkTeamRecord({id:g.teamId,name:g.teamName||"Équipe"});
    DB.teams.push(team);
  } else if(g.teamName)team.name=g.teamName;

  var role=ROLES[g.role]?g.role:"selector";
  var has=DB.assignments.some(function(a){
    return a.personId===person.id&&a.teamId===team.id&&a.role===role;
  });
  if(!has)DB.assignments.push(mkAssignment(person.id,team.id,role));
  state.ctx={role:role,teamId:team.id};
  state.tab=(tabsForCtx()[0]||{}).key;
  normalizeCtx();saveAll();
}

render();

/* Re-rendu au redimensionnement uniquement si aucun champ n'a le focus
   (le clavier virtuel déclenche « resize » et détruirait la saisie). */
var resizeTimer=null,lastW=window.innerWidth,lastH=window.innerHeight;
window.addEventListener("resize",function(){
  if(resizeTimer)clearTimeout(resizeTimer);
  resizeTimer=setTimeout(function(){
    resizeTimer=null;
    var a=document.activeElement;
    if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"))return;
    var w=window.innerWidth,h2=window.innerHeight;
    if(w===lastW&&Math.abs(h2-lastH)<120)return;   // simple apparition du clavier
    lastW=w;lastH=h2;render();
  },220);
});
window.addEventListener("beforeunload",function(){saveAll()});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")saveAll()});

/* Stockage persistant : évite l'éviction des données par le navigateur */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});

/* iOS standalone : empêche le rebond du body sans bloquer les zones défilables */
var SCROLLABLE=".content,.quick-panel,.court-panel,.player-strip,.court-toggle-grid,.modal,.pill-row,.sub-pills,.pos-row,.team-bar,.sess-grid,.subteam-row,.sum-table,.num-grid,textarea,[data-scroll-key]";
document.body.addEventListener("touchmove",function(e){
  if(!(e.target.closest&&e.target.closest(SCROLLABLE)))e.preventDefault();
},{passive:false});
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    reg.addEventListener("updatefound",function(){
      var w=reg.installing;if(!w)return;
      w.addEventListener("statechange",function(){
        // Ne jamais recharger en pleine saisie : on propose la mise à jour.
        if(w.state==="installed"&&navigator.serviceWorker.controller){
          state.updateReady=true;render();
        }
      });
    });
  }).catch(function(){});
}
</script>
