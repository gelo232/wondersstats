<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WonderStats">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon.png">
<meta name="theme-color" content="#1E3A5F">
<title>WonderStats</title>
<style>
/* ══ §01 JETONS DE DESIGN ══════════════════════════════════════════════
   Toute valeur d'apparence passe par une variable. Aucune règle de
   composant ne porte plus de couleur littérale : c'est la seule
   condition pour qu'un thème clair devienne un jour possible sans
   réécrire une seule règle (et la raison d'écrire ce bloc maintenant).

   Les ratios notés sont des mesures WCAG 2.1 sur les fonds réels de
   l'application. Ceux qui échouaient AA sont corrigés ici, à la
   source, et non contournés composant par composant : #64748B (3.75)
   et #475569 (2.36) en texte, blanc sur #10B981 (2.54), blanc sur
   #3B82F6 (3.68), blanc sur #6366F1 (4.47).                        */
:root{
  /* ── Fonds ──────────────────────────────────────────────── */
  --bg:#0F172A;             /* fond d'application, fond de liste       */
  --surface:#1E293B;        /* carte, modale, feuille, barre d'onglets */
  --surface-2:#162032;      /* barres de contexte, bandeaux, en-têtes  */
  --sunken:#0B1220;         /* creux : champ, puits de jauge, badge #  */
  --raised:#1E3A5F;         /* état « choisi » : bleu sourd            */
  --scrim:rgba(2,6,16,.78); /* voile derrière modale et feuille        */
  --skel:#243247;           /* crête du balayage de squelette          */

  /* ── Traits ─────────────────────────────────────────────── */
  --line:#334155;           /* séparateur discret, bord de carte       */
  --line-strong:#475569;    /* bord de contrôle inactif                */
  --focus:#93C5FD;          /* anneau de focus — 9.9:1 sur --bg        */

  /* ── Texte ──────────────────────────────────────────────── */
  --txt:#E2E8F0;            /* corps                        14.5:1     */
  --txt-strong:#F8FAFC;     /* titres, nombres              17.1:1     */
  --txt-soft:#CBD5E1;       /* texte long, notes            11.4:1     */
  --txt-dim:#94A3B8;        /* sous-ligne, métadonnée        7.0:1     */
  --txt-faint:#8494AB;      /* titre de section, légende     5.8:1     */
  --on-dark:#0B1220;        /* texte SUR un accent clair (vert, ambre) */
  --on-light:#FFFFFF;       /* texte SUR un accent profond (bleu…)     */

  /* ── Accents : trois rôles par teinte ───────────────────── */
  /*   *-ink   : texte / icône / bord, posé sur un fond sombre   */
  /*   *       : teinte de référence, bords et jauges            */
  /*   *-solid : fond plein, avec --on-dark ou --on-light        */
  --accent:#3B82F6;   --accent-ink:#60A5FA;   --accent-solid:#2563EB;
  --ok:#10B981;       --ok-ink:#34D399;       --ok-solid:#10B981;
  --warn:#F59E0B;     --warn-ink:#FBBF24;     --warn-solid:#F59E0B;
  --danger:#EF4444;   --danger-ink:#F87171;   --danger-solid:#DC2626;
  --eval:#8B5CF6;     --eval-ink:#A78BFA;     --eval-solid:#6D28D9;
  --neutral:#64748B;  --neutral-ink:#94A3B8;  --neutral-solid:#475569;

  /* ── Teintes froides catégorielles (nature d'événement) ─── */
  --kind-training:#94A3B8;    /* entraînement — ardoise  */
  --kind-friendly:#38BDF8;    /* amical       — ciel     */
  --kind-league:#818CF8;      /* championnat  — indigo   */
  --kind-tournament:#F472B6;  /* tournoi      — magenta  */

  /* ── Voiles (fonds de badge, de jeton, de bandeau) ──────── */
  --tint-accent:rgba(59,130,246,.14);
  --tint-ok:rgba(16,185,129,.14);
  --tint-warn:rgba(245,158,11,.14);
  --tint-danger:rgba(239,68,68,.14);
  --tint-eval:rgba(139,92,246,.14);
  --tint-neutral:rgba(148,163,184,.10);

  /* ── Rayons ─────────────────────────────────────────────── */
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:18px;
  --r-pill:999px;

  /* ── Ombres ─────────────────────────────────────────────── */
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 4px 14px rgba(0,0,0,.42);
  --sh-3:0 -6px 22px rgba(0,0,0,.45);

  /* ── Espacements — échelle de 4 px ──────────────────────── */
  --s1:4px;  --s2:8px;  --s3:12px; --s4:16px;
  --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  --gutter:12px;

  /* ── Typographie ────────────────────────────────────────── */
  --ff:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --fs-2xs:11px;  /* RÉSERVÉ aux titres de section en capitales */
  --fs-xs:12px;   /* métadonnée, légende — plancher du texte    */
  --fs-sm:13px;
  --fs-md:15px;   /* corps, nom d'athlète                      */
  --fs-lg:17px;   /* titre de carte                            */
  --fs-xl:20px;   /* titre d'écran vide, valeur de KPI         */
  --fs-2xl:26px;  /* grande mesure                             */
  --fs-input:16px;/* tout champ : sous 16 px, iOS zoome        */
  --lh:1.45;

  /* ── Tactile ────────────────────────────────────────────── */
  --tap:44px;     /* plancher absolu de toute cible            */
  --tap-lg:56px;  /* cible principale d'un écran de saisie     */
  --gap-tap:8px;

  /* ── Mouvement ──────────────────────────────────────────── */
  --dur-fast:.12s;
  --dur:.18s;
  --ease:cubic-bezier(.2,.7,.3,1);
}

@media (prefers-reduced-motion:reduce){
  :root{--dur-fast:0s;--dur:0s}
  *,*::before,*::after{animation-duration:.001s!important;
    animation-iteration-count:1!important;transition-duration:.001s!important}
}

/* Anneau de focus global : indispensable sur iPad avec clavier, et
   seule affordance qui reste là où le survol n'existe pas. */
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-xs)}
/* Safari ancien ignore :focus-visible — repli sur :focus pour les
   champs, où un anneau permanent ne gêne pas. */
input:focus,textarea:focus,select:focus{outline:2px solid var(--focus);outline-offset:1px}
/* ══ fin §01 ══════════════════════════════════════════════════════════ */

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--ff);background:var(--bg);
  color:var(--txt);font-size:var(--fs-md);line-height:var(--lh);-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
@media(min-width:600px){#app{max-width:700px}}
@media(min-width:900px){#app{max-width:1040px}}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── HEADER ───────────────────────────────────────── */
.header{background:linear-gradient(135deg,var(--raised),var(--bg));padding:var(--s3) var(--s3);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);flex-shrink:0;padding-top:max(12px,env(safe-area-inset-top));gap:var(--s2)}
@media(min-width:600px){.header{padding:var(--s4) var(--s6)}}
.header h1{margin:0;font-size:var(--fs-lg);font-weight:700;color:var(--txt-strong);letter-spacing:.3px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:600px){.header h1{font-size:var(--fs-xl)}}
.header .h-sub{display:block;font-size:var(--fs-2xs);font-weight:600;color:var(--txt-dim);letter-spacing:.2px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-side{min-width:84px;display:flex;gap:var(--s1);flex-shrink:0;align-items:center}
.header-side.right{justify-content:flex-end}
.role-badge{padding:var(--s1) 9px;border-radius:var(--r-pill);font-size:var(--fs-2xs);font-weight:800;border:1.5px solid;cursor:pointer;white-space:nowrap;background:transparent;letter-spacing:.4px}
.role-badge.coach{border-color:var(--accent-ink);color:var(--accent-ink)}
.role-badge.selector{border-color:var(--warn-ink);color:var(--warn-ink)}
.role-badge.admin{border-color:var(--danger-ink);color:var(--danger-ink)}
/* Flèche de retour : nommée quand le parent tient en douze caractères. */
.backBtn{display:inline-flex;align-items:center;gap:var(--s1);min-height:var(--tap);
  padding:0 var(--s2) 0 0;color:var(--accent-ink);font-size:var(--fs-sm);font-weight:700;
  max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backBtn .arw{font-size:var(--fs-lg);font-weight:800}

/* ── CONTEXT BARS ─────────────────────────────────── */
.ctx-bar{background:var(--surface-2);border-bottom:1px solid var(--surface);padding:7px var(--gutter);display:flex;align-items:center;gap:var(--s2);flex-shrink:0;font-size:var(--fs-xs);color:var(--txt-dim)}
.ctx-bar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-bar button{background:transparent;border:none;color:inherit;font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;min-width:0;min-height:var(--tap)}
.team-bar{background:var(--surface-2);border-bottom:1px solid var(--surface);padding:6px var(--gutter);display:flex;align-items:center;gap:var(--s2);flex-shrink:0;overflow-x:auto}
.team-chip{padding:0 var(--s3);min-height:var(--tap);border-radius:var(--r-pill);border:1.5px solid var(--line-strong);font-size:var(--fs-xs);font-weight:600;cursor:pointer;white-space:nowrap;background:transparent;color:var(--txt-dim);display:inline-flex;align-items:center;gap:var(--s1);transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.team-chip.active{background:var(--accent-solid);border-color:var(--accent-ink);color:var(--on-light)}
.team-chip.add{border-style:dashed;color:var(--txt-faint)}

/* ── TABS ─────────────────────────────────────────── */
.tab-bar{display:flex;background:var(--surface);border-top:1px solid var(--line);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;padding:var(--s2) 2px 6px;border:none;background:none;cursor:pointer;color:var(--txt-dim);font-weight:400;font-size:var(--fs-xs);display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid transparent;min-height:var(--tap);transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease);min-width:0}
.tab-btn.active{color:var(--accent-ink);font-weight:700;border-top-color:var(--accent-ink)}
.tab-btn.sel.active{color:var(--warn-ink);border-top-color:var(--warn-ink)}
.tab-btn .ico{font-size:19px}
.tab-btn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media(min-width:600px){.tab-btn{padding:var(--s3) var(--s1) var(--s3);font-size:var(--fs-sm)}.tab-btn .ico{font-size:22px}}

/* ── BUTTONS ──────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:0 var(--s5);border-radius:var(--r-sm);border:1.5px solid transparent;font-weight:700;font-size:var(--fs-md);cursor:pointer;white-space:nowrap;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease)}
.btn:active{transform:scale(.97)}
/* `xs` n'existe plus comme taille : 24 px de haut est intouchable au
   bord d'un terrain. Le nom reste, il vaut `sm`. */
.btn.sm,.btn.xs{min-height:var(--tap);padding:0 var(--s3);font-size:var(--fs-xs)}
.btn.full{width:100%}
.btn-primary{background:var(--accent-solid);color:var(--on-light)}
.btn-save,.btn-ok{background:var(--ok-solid);color:var(--on-dark)}
.btn-warn{background:var(--warn-solid);color:var(--on-dark)}
.btn-danger{background:var(--danger-solid);color:var(--on-light)}
.btn-danger-o{background:transparent;border-color:var(--danger);color:var(--danger-ink)}
.btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--txt)}
.btn-accent-o{background:transparent;border-color:var(--accent);color:var(--accent-ink)}
.btn-export{background:transparent;border-color:var(--warn);color:var(--warn-ink)}
.btn-import{background:transparent;border-color:var(--eval);color:var(--eval-ink)}
.btn-undo{background:transparent;border-color:var(--accent-ink);color:var(--accent-ink)}
/* Désactivé : un bouton gris FONCÉ, pas un bouton clair transparent,
   qui ressemblait à un bouton actif mal imprimé. */
.btn:disabled{background:var(--surface);color:var(--txt-faint);cursor:default;border-color:var(--line);opacity:1;transform:none}
.iconBtn{width:var(--tap);height:var(--tap);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--txt-dim);font-size:var(--fs-lg);background:none;border:none;cursor:pointer}
.iconBtn.danger{color:var(--danger-ink)}
.iconBtn:active{background:var(--tint-neutral)}
/* Agrandir la zone sans agrandir le dessin. */
.tapPad{position:relative}
.tapPad::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--tap);height:var(--tap)}

/* ── PILLS / FILTERS ──────────────────────────────── */
.pill-row{display:flex;gap:6px;padding:var(--s2) var(--gutter);overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--surface);flex-shrink:0}
/* Rangée d'onglets principale : quatre entrées doivent tenir sans
   défilement, sinon la dernière passe inaperçue. */
.pill-row.tight{gap:var(--s1);padding-left:var(--s2);padding-right:var(--s2)}
.pill-row.tight .pill{padding:0 var(--s2);font-size:var(--fs-xs)}
@media(min-width:430px){.pill-row.tight .pill{padding:0 var(--s3);font-size:var(--fs-sm)}}
@media(min-width:600px){.pill-row{padding:var(--s3) var(--s4);justify-content:center}}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:var(--tap);padding:0 var(--s3);border-radius:var(--r-pill);border:1.5px solid transparent;white-space:nowrap;font-weight:700;font-size:var(--fs-xs);cursor:pointer;background:var(--surface);color:var(--txt-dim);
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.pill.sm{padding:0 var(--s2);font-size:var(--fs-xs)}
@media(min-width:600px){.pill{padding:0 var(--s4);font-size:var(--fs-sm)}}
.pill.active{color:var(--on-light);border-color:var(--accent-ink)}
.filter-bar{padding:6px var(--gutter);background:var(--bg);border-bottom:1px solid var(--surface);flex-shrink:0;display:flex;flex-direction:column;gap:6px}
@media(min-width:600px){.filter-bar{padding:var(--s2) var(--s4);flex-direction:row;align-items:center;justify-content:center;flex-wrap:wrap}}
.pos-row{display:flex;gap:var(--s1);overflow-x:auto}
@media(min-width:600px){.pos-row{gap:6px}}
.sub-pills{display:flex;gap:5px;overflow-x:auto}
@media(min-width:600px){.sub-pills{justify-content:center}}

/* ── LAYOUT ───────────────────────────────────────── */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:var(--s3) var(--gutter)}
@media(min-width:600px){.pad{padding:var(--s5) var(--s6)}}
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--s4);border:1px solid var(--line);margin-bottom:var(--s3)}
.card.tight{padding:var(--s3)}
.card.flush{padding:0;overflow:hidden}
.card>.card-head{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.card>.card-head h3{font-size:var(--fs-lg);font-weight:700;color:var(--txt-strong);margin:0;min-width:0}
.card.is-accent{border-color:var(--accent);background:var(--tint-accent)}
.card.is-ok{border-color:var(--ok);background:var(--tint-ok)}
.card.is-warn{border-color:var(--warn);background:var(--tint-warn)}
.card.is-danger{border-color:var(--danger);background:var(--tint-danger)}
.card.is-eval{border-color:var(--eval);background:var(--tint-eval)}
.section-title{font-size:var(--fs-2xs);font-weight:800;color:var(--txt-faint);letter-spacing:.8px;text-transform:uppercase;margin:var(--s5) 0 var(--s2)}
.section-title:first-child{margin-top:0}
.muted{color:var(--txt-dim);font-size:var(--fs-xs)}
.err{color:var(--danger-ink);font-size:var(--fs-sm)}
/* Écran de garde : verrouillage et inscription */
.gate{display:flex;flex-direction:column;justify-content:center;min-height:100%;padding:var(--s8) var(--s5);gap:var(--s3);overflow-y:auto}
.gate-logo{font-size:44px;text-align:center;line-height:1}
.gate h1{font-size:var(--fs-xl);font-weight:700;color:var(--txt-strong);text-align:center;margin:0}
.gate .sub{font-size:var(--fs-sm);color:var(--txt-dim);text-align:center;line-height:1.5;margin:0}
.gate .card h2{font-size:var(--fs-md);font-weight:700;color:var(--txt);margin:0 0 var(--s1)}
.gate .card p{font-size:var(--fs-xs);color:var(--txt-dim);margin:0 0 var(--s3);line-height:1.5}
.gate input{width:100%;padding:var(--s3);font-size:var(--fs-input);border-radius:var(--r-sm);
  border:1.5px solid var(--line-strong);background:var(--sunken);color:var(--txt-strong);box-sizing:border-box}
.gate .err{text-align:center;min-height:16px}
.gate .note{background:var(--sunken);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:var(--r-sm);padding:11px var(--s3);font-size:var(--fs-xs);color:var(--txt-soft);line-height:1.55}
.gate .note b{color:var(--txt-strong)}
.gate .full{width:100%;min-height:var(--tap-lg);font-size:var(--fs-md)}
.linky{background:none;border:none;color:var(--accent-ink);font-size:var(--fs-sm);
  cursor:pointer;min-height:var(--tap);text-decoration:underline}
.strength{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:7px}
.strength i{display:block;height:100%;transition:width var(--dur) var(--ease),background var(--dur) var(--ease)}
/* Assistant de mise en place du relais */
.steps{counter-reset:st;margin:0;padding:0;list-style:none}
.steps li{counter-increment:st;position:relative;padding:0 0 var(--s3) var(--s8);font-size:var(--fs-xs);
  color:var(--txt-soft);line-height:1.55}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:20px;height:20px;
  border-radius:50%;background:var(--accent-solid);color:var(--on-light);font-size:var(--fs-2xs);font-weight:700;
  display:flex;align-items:center;justify-content:center}
.steps li b{color:var(--txt-strong)}
.steps code{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-xs);padding:1px 5px;
  font-size:var(--fs-2xs);word-break:break-all}
.warnbox{background:var(--tint-warn);border:1px solid var(--warn);border-radius:var(--r-sm);padding:var(--s2) var(--s3);
  font-size:var(--fs-xs);color:var(--warn-ink);line-height:1.5;margin-top:var(--s2)}
.warnbox b{color:var(--warn-ink)}
.okbox{background:var(--tint-ok);border:1px solid var(--ok);border-radius:var(--r-sm);padding:var(--s2) var(--s3);
  font-size:var(--fs-xs);color:var(--ok-ink);line-height:1.5}
.hint{background:var(--tint-accent);border:1px solid var(--accent);border-radius:var(--r-md);padding:var(--s2) var(--s3);font-size:var(--fs-xs);color:var(--focus);line-height:1.5;margin-bottom:var(--s3)}
.hint.warn{background:var(--tint-warn);border-color:var(--warn);color:var(--warn-ink)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.btn-row{display:flex;gap:var(--s2);flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr;gap:var(--s2)}
@media(min-width:600px){.grid2{grid-template-columns:1fr 1fr}}

/* ── FORM ─────────────────────────────────────────── */
.txt{width:100%;background:var(--sunken);border:1.5px solid var(--line-strong);border-radius:var(--r-sm);padding:var(--s3);color:var(--txt-strong);font-size:var(--fs-input);outline:none;min-height:var(--tap)}
.txt:focus{border-color:var(--focus)}
.txt.err{border-color:var(--danger)}
textarea.txt{resize:vertical;min-height:64px;line-height:1.5}
.field{margin-bottom:var(--s2)}

.fam-name{font-weight:700;min-width:82px;flex-shrink:0}
.fam-eff{font-weight:800;color:var(--txt-strong);min-width:46px;text-align:right}
.fam-vol{color:var(--txt-faint);font-size:var(--fs-2xs);flex:1;min-width:0}
.w-row{display:flex;align-items:center;gap:var(--s2);margin-bottom:7px}
.w-lbl{font-size:var(--fs-xs);color:var(--txt-soft);flex:1;min-width:0}
.w-btns{display:flex;gap:3px;flex-shrink:0}
.w-btn{min-width:var(--tap);height:var(--tap);border-radius:7px;border:1.5px solid var(--line-strong);background:var(--sunken);color:var(--txt-dim);font-size:var(--fs-xs);font-weight:700}
.w-btn.on{background:var(--eval-solid);border-color:var(--eval-ink);color:var(--on-light)}
.lien-doc{display:inline-block;color:var(--eval-ink);text-decoration:none;font-size:var(--fs-xs);font-weight:700;padding:7px 0;min-height:var(--tap)}
.lien-doc:active{opacity:.6}

/* ── MODAL / TOAST ────────────────────────────────── */
.modal-bg,.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:99;padding:var(--s5)}
.scrim.bottom{align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--surface);border-radius:var(--r-xl);padding:var(--s5);width:100%;max-width:420px;border:1px solid var(--line);max-height:86%;overflow-y:auto;box-shadow:var(--sh-2)}
.modal h3{margin:0 0 var(--s3);color:var(--txt-strong);font-size:18px}
.modal input,.modal textarea,.modal select{width:100%;background:var(--sunken);border:1.5px solid var(--line-strong);border-radius:var(--r-sm);padding:11px var(--s3);color:var(--txt-strong);font-size:var(--fs-input);outline:none;margin-bottom:var(--s3);min-height:var(--tap)}
.modal input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:var(--line);padding:0;border:0;min-height:0}
.modal input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--eval);border:2px solid var(--bg)}
.modal input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--eval);border:2px solid var(--bg)}
/* Feuille du bas : toute liste, tout contenu qui défile. Le pouce y est. */
.modal.sheet{max-width:none;max-height:92%;border-radius:var(--r-xl) var(--r-xl) 0 0;border-bottom:none;
  box-shadow:var(--sh-3);padding:0;display:flex;flex-direction:column;overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom);animation:sheetUp var(--dur) var(--ease)}
.modal.box{padding:0;display:flex;flex-direction:column;overflow:hidden}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
@media(min-width:600px){
  /* Sur iPad, la feuille redevient une boîte centrée : le pouce n'est
     plus en bas de l'écran quand la tablette est tenue à deux mains. */
  .scrim.bottom{align-items:center;padding:var(--s5)}
  .modal.sheet{max-width:560px;border-radius:var(--r-xl);border-bottom:1px solid var(--line)}
}
.modal .m-head{flex-shrink:0;padding:var(--s4) var(--s4) var(--s3);display:flex;align-items:center;gap:var(--s2);border-bottom:1px solid var(--line);position:relative}
.modal.sheet .m-head{padding-top:var(--s5)}
.modal.sheet .m-head::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:2px;background:var(--line-strong)}
.modal .m-head h3{flex:1;min-width:0;font-size:var(--fs-lg);font-weight:700;color:var(--txt-strong);margin:0}
.modal .m-close{width:var(--tap);height:var(--tap);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--txt-dim);font-size:var(--fs-lg);background:none;border:none;cursor:pointer;margin:calc(var(--s2) * -1)}
.modal .m-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--s4);min-height:60px}
.modal .m-foot{flex-shrink:0;display:flex;gap:var(--s2);padding:var(--s3) var(--s4);border-top:1px solid var(--line);background:var(--surface)}
.modal .m-foot .btn{flex:1;min-height:var(--tap)}
.modal.confirm .m-body{padding-top:var(--s4)}
.modal.confirm p{font-size:var(--fs-md);color:var(--txt);line-height:var(--lh);margin:0}
.modal.confirm p+p{margin-top:var(--s2);color:var(--txt-dim);font-size:var(--fs-sm)}
/* Le toast descend au pouce et perd son fond ardoise, qui interdisait
   tout texte coloré : la couleur passe dans un liseré de 4 px. */
.toast{position:absolute;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;max-width:calc(100% - 2 * var(--gutter));display:flex;align-items:center;gap:var(--s2);
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--r-md);padding:var(--s3) var(--s4);box-shadow:var(--sh-2);
  color:var(--txt-strong);font-size:var(--fs-sm);font-weight:600;animation:toastIn var(--dur) var(--ease)}
.toast.ok{border-left-color:var(--ok)}
.toast.warn{border-left-color:var(--warn)}
.toast.danger{border-left-color:var(--danger)}
.toast .t-act{flex-shrink:0;color:var(--accent-ink);font-weight:800;font-size:var(--fs-xs);text-decoration:underline;min-height:var(--tap);display:flex;align-items:center;padding:0 var(--s1);background:none;border:none;cursor:pointer}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.autosave-indicator{display:flex;align-items:center;gap:6px;font-size:var(--fs-2xs);color:var(--txt-faint);padding:var(--s1) 0}
.autosave-indicator .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0}
.autosave-indicator.saving .dot{background:var(--warn);animation:pulse .6s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.data-actions{display:flex;gap:var(--s2);margin-top:var(--s4);justify-content:center;flex-wrap:wrap}
.sets-row{display:flex;gap:var(--s2);flex-wrap:wrap}
.set-cell{display:flex;flex-direction:column;align-items:center;gap:var(--s1)}
.set-lbl{font-size:var(--fs-2xs);color:var(--txt-faint);font-weight:700;letter-spacing:.3px}
.set-pair{display:flex;align-items:center;gap:var(--s1)}
.set-in{width:44px;height:var(--tap);border-radius:var(--r-sm);background:var(--sunken);border:1.5px solid var(--line-strong);
  color:var(--txt-strong);font-size:var(--fs-input);font-weight:700;text-align:center;outline:none;margin:0}
.set-in:focus{border-color:var(--focus)}
.set-sep{color:var(--txt-dim);font-weight:700}
.ev-card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);margin-bottom:var(--s3);overflow:hidden}
.ev-head{padding:var(--s3) var(--s3);display:flex;align-items:center;gap:var(--s2);border-left:4px solid var(--line)}
.ev-head .grow{flex:1;min-width:0}
.ev-title{font-size:var(--fs-md);font-weight:700;color:var(--txt-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-sub{font-size:var(--fs-xs);color:var(--txt-dim);margin-top:3px}
.ev-match{display:flex;align-items:center;gap:var(--s2);padding:9px var(--s3);border-top:1px solid var(--bg);min-height:var(--tap)}
.ev-match .grow{flex:1;min-width:0}
.score{font-family:inherit;font-size:var(--fs-md);font-weight:800;padding:3px 9px;border-radius:7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.update-bar{position:absolute;bottom:0;left:0;right:0;background:var(--raised);border-top:1px solid var(--accent);padding:var(--s2) var(--s3);display:flex;align-items:center;justify-content:space-between;gap:var(--s2);z-index:90;font-size:var(--fs-xs);color:var(--txt)}

/* ══ §12 BIBLIOTHÈQUE DE COMPOSANTS ════════════════════════════════════
   Les six formes du §02 (décision, offre, appartenance, nature,
   issue, progression) et les briques que les six agents de partie
   appellent. Écrites une fois, ici, et nulle part ailleurs.        */

/* ── tok : jeton non cliquable, cinq formes ──────────────────── */
.tok{display:inline-flex;align-items:center;gap:var(--s1);flex-shrink:0;font-size:var(--fs-xs);font-weight:800;white-space:nowrap;line-height:1;padding:5px 9px;border:1.5px solid transparent}
.tok-pill{border-radius:var(--r-pill)}
.tok-box{border-radius:var(--r-xs);background:transparent!important}
.tok-score{border-radius:var(--r-sm);font-size:var(--fs-sm);padding:6px var(--s2);font-variant-numeric:tabular-nums}
.tok-dot{border:none;background:none;padding:5px 2px;color:var(--txt-dim);font-weight:700}
.tok-dot i{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:block}
.tok-bar{border-radius:var(--r-xs);background:var(--surface-2);border-left-width:3px;padding-left:7px;color:var(--txt)}
.tone-neutral{background:var(--tint-neutral);color:var(--txt-dim);border-color:var(--line-strong)}

/* ── chip : jeton CLIQUABLE (filtres, tris) ──────────────────── */
.chip{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex-shrink:0;min-height:var(--tap);padding:0 var(--s3);
  border-radius:var(--r-pill);border:1.5px solid var(--line-strong);background:var(--surface);color:var(--txt-dim);
  font-size:var(--fs-xs);font-weight:700;white-space:nowrap;cursor:pointer;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.chip.on{background:var(--raised);border-color:var(--accent);color:var(--txt-strong)}
.chip.on.tone-ok{background:var(--tint-ok);border-color:var(--ok);color:var(--ok-ink)}
.chip.on.tone-warn{background:var(--tint-warn);border-color:var(--warn);color:var(--warn-ink)}
.chip.on.tone-danger{background:var(--tint-danger);border-color:var(--danger);color:var(--danger-ink)}
.chip.on.tone-eval{background:var(--tint-eval);border-color:var(--eval);color:var(--eval-ink)}
.chip.add{border-style:dashed;color:var(--txt-faint)}
.chip:active{transform:scale(.97)}

/* ── listRow : l'athlète dans une liste, budgetée pour 375 px ── */
.listRow{position:relative;display:flex;align-items:center;gap:var(--s3);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3);margin-bottom:var(--s2);
  min-height:var(--tap);transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.listRow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:var(--r-md) 0 0 var(--r-md);background:transparent}
.listRow[data-decision="selected"]::before{background:var(--ok)}
.listRow[data-decision="recalled"]::before{background:var(--warn)}
.listRow[data-decision="cut"]::before{background:var(--danger)}
.listRow[data-decision="candidate"]::before{background:var(--line-strong)}
.listRow .lead{width:var(--tap);min-height:var(--tap);flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:var(--sunken);border:1.5px solid var(--line-strong);border-radius:var(--r-sm);color:var(--txt-strong);
  font-weight:800;font-size:var(--fs-lg);text-align:center;padding:0}
.listRow .lead.dup{border-color:var(--danger);color:var(--danger-ink)}
.listRow .lead:focus{border-color:var(--focus)}
.listRow .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;
  background:none;border:none;padding:0;min-height:var(--tap);justify-content:center;cursor:pointer;color:inherit}
.listRow .rname{font-size:var(--fs-md);font-weight:700;color:var(--txt-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listRow .rmeta{display:flex;align-items:center;gap:var(--s1);flex-wrap:nowrap;overflow:hidden}
.listRow .trail{flex-shrink:0;max-width:96px;display:flex;align-items:center;justify-content:flex-end;gap:var(--s1)}
.listRow .tval{font-size:var(--fs-lg);font-weight:800;color:var(--txt-strong);line-height:1.1;text-align:right}
.listRow .tlbl{font-size:var(--fs-2xs);color:var(--txt-faint);text-align:right}
.listRow.is-picked{background:var(--raised);border-color:var(--accent)}
.listRow.is-dim{opacity:.55}
@media(min-width:600px){
  .listRow{padding:var(--s3) var(--s4)}
  .listRow .rname{font-size:var(--fs-lg)}
  .listRow .trail{max-width:140px}
}

/* ── listToolbar : recherche + tris + filtres d'une liste ────── */
.listToolbar{background:var(--bg);flex-shrink:0}
.searchBar{position:relative;display:flex;align-items:center;padding:var(--s2) var(--gutter);background:var(--bg);flex-shrink:0}
.searchBar .ico{position:absolute;left:calc(var(--gutter) + 12px);font-size:var(--fs-md);pointer-events:none}
.searchBar input{width:100%;height:var(--tap);background:var(--sunken);border:1.5px solid var(--line-strong);
  border-radius:var(--r-sm);color:var(--txt-strong);font-size:var(--fs-input);padding:0 46px 0 40px;outline:none}
.searchBar input::placeholder{color:var(--txt-faint)}
.searchBar .clear{position:absolute;right:calc(var(--gutter) + 2px);width:var(--tap);height:var(--tap);
  display:flex;align-items:center;justify-content:center;color:var(--txt-dim);font-size:var(--fs-lg);background:none;border:none;cursor:pointer}
.lt-count{padding:0 var(--gutter) var(--s2);font-size:var(--fs-xs);color:var(--txt-faint)}
.sortBar{display:flex;align-items:center;gap:var(--s1);padding:var(--s1) var(--gutter) var(--s2);overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch}
.sortBar .sb-lead{font-size:var(--fs-2xs);font-weight:800;color:var(--txt-faint);letter-spacing:.6px;text-transform:uppercase;flex-shrink:0;padding-right:var(--s1)}
.sortBtn{display:inline-flex;align-items:center;gap:5px;flex-shrink:0;min-height:var(--tap);padding:0 var(--s3);
  border-radius:var(--r-pill);border:1.5px solid var(--line-strong);background:var(--surface);color:var(--txt-dim);
  font-size:var(--fs-xs);font-weight:700;white-space:nowrap;cursor:pointer;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.sortBtn.on{background:var(--raised);border-color:var(--accent);color:var(--txt-strong)}
.sortBtn .dir{font-size:var(--fs-sm);font-weight:800;color:var(--accent-ink)}
.filterBar{background:var(--bg);border-bottom:1px solid var(--line);flex-shrink:0}
.filterBar .fb-head{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:var(--tap);
  padding:0 var(--gutter);color:var(--txt-dim);font-size:var(--fs-xs);font-weight:700;text-align:left;background:none;border:none;cursor:pointer}
.filterBar .fb-head .grow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filterBar .fb-count{background:var(--accent-solid);color:var(--on-light);border-radius:var(--r-pill);
  font-size:var(--fs-2xs);font-weight:800;padding:2px var(--s2);flex-shrink:0}
.filterBar .fb-body{padding:0 var(--gutter) var(--s2);display:flex;flex-direction:column;gap:var(--s2)}
.filterBar .fb-group{display:flex;gap:var(--s1);overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.filterBar .fb-lbl{font-size:var(--fs-2xs);font-weight:800;color:var(--txt-faint);letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
.filterBar .fb-reset{align-self:flex-start;min-height:var(--tap);color:var(--accent-ink);font-size:var(--fs-xs);
  font-weight:700;text-decoration:underline;padding:0;background:none;border:none;cursor:pointer}

/* ── kpi : une mesure, sa valeur, sa tendance ────────────────── */
.kpiGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
@media(min-width:430px){.kpiGrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:600px){.kpiGrid{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3);
  min-height:76px;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left}
.kpi .k-lbl{font-size:var(--fs-2xs);font-weight:800;color:var(--txt-faint);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-val{font-size:var(--fs-2xl);font-weight:800;color:var(--txt-strong);line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .k-unit{font-size:var(--fs-xs);font-weight:700;color:var(--txt-dim);margin-left:3px}
.kpi .k-trend{display:inline-flex;align-items:center;gap:3px;font-size:var(--fs-xs);font-weight:800}
.kpi.up .k-trend{color:var(--ok-ink)}
.kpi.down .k-trend{color:var(--danger-ink)}
.kpi.flat .k-trend{color:var(--txt-dim)}
.kpi.is-tap{min-height:var(--tap-lg);cursor:pointer}
.kpiInline{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.kpiInline b{font-size:var(--fs-lg);font-weight:800;color:var(--txt-strong);font-variant-numeric:tabular-nums}
.kpiInline span{font-size:var(--fs-2xs);color:var(--txt-faint)}

/* ── bar : jauge de progression ──────────────────────────────── */
.bar{display:flex;align-items:center;gap:var(--s2)}
.bar .b-lbl{font-size:var(--fs-xs);color:var(--txt-dim);width:104px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .b-track{flex:1;min-width:40px;height:8px;border-radius:4px;background:var(--sunken);overflow:hidden;position:relative}
.bar .b-fill{display:block;height:100%;border-radius:4px;transition:width var(--dur) var(--ease)}
.bar .b-goal{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--txt-strong);opacity:.85}
.bar .b-val{font-size:var(--fs-xs);font-weight:800;width:62px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums;color:var(--txt-strong)}
.bar .b-trend{font-size:var(--fs-sm);font-weight:800;flex-shrink:0;width:16px;text-align:center}
.bar.st-reached .b-fill{background:var(--ok)}
.bar.st-reached .b-trend{color:var(--ok-ink)}
.bar.st-running .b-fill{background:var(--accent)}
.bar.st-running .b-trend{color:var(--txt-dim)}
.bar.st-down .b-fill{background:var(--danger)}
.bar.st-down .b-trend{color:var(--danger-ink)}
@media(min-width:600px){.bar .b-lbl{width:150px}}

/* ── segmented : 2 à 4 choix exclusifs ───────────────────────── */
.seg{display:flex;background:var(--sunken);border:1.5px solid var(--line-strong);border-radius:var(--r-sm);padding:3px;gap:3px;flex-shrink:0}
.seg button{position:relative;flex:1;min-width:0;min-height:38px;border-radius:calc(var(--r-sm) - 2px);
  font-size:var(--fs-xs);font-weight:700;color:var(--txt-dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding:0 var(--s2);background:none;border:none;cursor:pointer;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.seg button::after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}
.seg button.on{background:var(--accent-solid);color:var(--on-light)}
@media(min-width:600px){.seg button{min-height:var(--tap);font-size:var(--fs-sm)}}

/* ── emptyState : un seul écran vide, deux tailles ───────────── */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--s8) var(--s5);gap:var(--s2);color:var(--txt-dim);font-size:var(--fs-sm)}
.empty .e-ico{font-size:46px;line-height:1}
.empty h2{font-size:var(--fs-xl);font-weight:700;color:var(--txt-strong);margin:0}
.empty p{font-size:var(--fs-sm);color:var(--txt-dim);max-width:320px;line-height:var(--lh);margin:0}
.empty .e-act{margin-top:var(--s3);display:flex;gap:var(--s2);flex-wrap:wrap;justify-content:center}
.empty.sm{padding:var(--s6) var(--s4);flex:none}
.empty.sm .e-ico{font-size:28px}
.empty.sm h2{font-size:var(--fs-md)}

/* ── actionBar : l'action principale, à portée de pouce ──────── */
.actionBar{flex-shrink:0;background:var(--surface-2);border-top:1px solid var(--line);box-shadow:var(--sh-3);padding:var(--s2) var(--gutter)}
.actionBar .ab-note{font-size:var(--fs-xs);color:var(--txt-dim);margin-bottom:var(--s2);line-height:1.35}
.actionBar .ab-note.warn{color:var(--warn-ink)}
.actionBar .ab-row{display:flex;gap:var(--s2);align-items:center}
.actionBar .ab-row .btn{min-height:var(--tap-lg);font-size:var(--fs-md)}
.actionBar .ab-row .btn.primary{flex:1}
.actionBar .ab-count{flex-shrink:0;min-width:52px;text-align:center;font-size:var(--fs-xl);font-weight:800;color:var(--txt-strong);font-variant-numeric:tabular-nums}
@media(min-width:600px){.actionBar{padding:var(--s3) var(--s6)}}

/* ── états : squelette, hors-ligne ──────────────────────────── */
.skel{height:64px;border-radius:var(--r-md);margin-bottom:var(--s2);
  background:linear-gradient(90deg,var(--surface) 25%,var(--skel) 37%,var(--surface) 63%);
  background-size:400% 100%;animation:skel 1.3s ease infinite}
@keyframes skel{from{background-position:100% 50%}to{background-position:0 50%}}
.offline{display:flex;align-items:center;gap:var(--s2);flex-shrink:0;padding:var(--s2) var(--gutter);
  background:var(--tint-warn);border-bottom:1px solid var(--warn);color:var(--warn-ink);font-size:var(--fs-xs);font-weight:700}

/* ── hub : les six tuiles vivantes de la saison ──────────────── */
.hubGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);margin-bottom:var(--s3)}
@media(min-width:600px){.hubGrid{grid-template-columns:repeat(3,1fr)}}
.hubTile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--s3);min-height:92px;cursor:pointer;color:inherit;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.hubTile:active{background:var(--raised);border-color:var(--accent)}
.hubTile .ht-ico{font-size:22px;line-height:1}
.hubTile .ht-lbl{font-size:var(--fs-sm);font-weight:700;color:var(--txt-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hubTile .ht-val{font-size:var(--fs-xl);font-weight:800;color:var(--txt-strong);line-height:1.1;font-variant-numeric:tabular-nums}
.hubTile .ht-sub{font-size:var(--fs-2xs);color:var(--txt-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* ── liste de sections (Réglages) ───────────────────────────── */
.navRow{display:flex;align-items:center;gap:var(--s3);width:100%;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3);margin-bottom:var(--s2);
  min-height:var(--tap-lg);text-align:left;cursor:pointer;color:inherit}
.navRow .nr-ico{font-size:var(--fs-xl);flex-shrink:0}
.navRow .nr-body{flex:1;min-width:0}
.navRow .nr-ttl{font-size:var(--fs-md);font-weight:700;color:var(--txt-strong)}
.navRow .nr-sub{font-size:var(--fs-xs);color:var(--txt-dim);margin-top:2px}
.navRow .nr-arw{flex-shrink:0;color:var(--txt-dim);font-size:var(--fs-lg)}

/* ── §13 · la tuile dit son humeur par son bord gauche ──────────
   La couleur ne porte jamais seule : elle double le chiffre et son
   libellé, pour le plein soleil comme pour le daltonisme. */
.hubTile{border-left:3px solid var(--line)}
.hubTile.ok{border-left-color:var(--ok)}
.hubTile.warn{border-left-color:var(--warn)}
.hubTile.bad{border-left-color:var(--danger)}

/* ── §13 · en-tête d'une partie ─────────────────────────────────
   Le retour porte le nom de son parent : on doit savoir où l'on
   retombe avant d'appuyer, pas après. */
.partHead{display:flex;align-items:center;gap:var(--s2);flex-shrink:0;
  padding:var(--s2) var(--gutter);background:var(--surface-2);border-bottom:1px solid var(--line)}
.partHead .ph-back{flex-shrink:0;background:transparent;border:none;cursor:pointer;
  font:inherit;font-size:var(--fs-xs);font-weight:700;color:var(--accent-ink);
  padding:10px 8px 10px 0;min-height:var(--tap-lg)}
.partHead .ph-body{flex:1;min-width:0}
.partHead .ph-ttl{font-size:var(--fs-md);font-weight:800;color:var(--txt-strong);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.partHead .ph-sub{font-size:var(--fs-xs);color:var(--txt-dim);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.partHead .ph-act{flex-shrink:0}

/* ── « Constituer l'équipe » ─────────────────────────────────── */
.bt-row{display:flex;flex-direction:column;gap:0;margin-bottom:var(--s2);
  border-bottom:1px solid var(--line);padding-bottom:var(--s2)}
.bt-row:last-child{border-bottom:none}
.bt-act{display:flex;gap:var(--s2);padding:0 var(--s1) 0 56px}
.bt-act .btn{flex:1;min-height:var(--tap-lg)}
.bt-count{font-size:var(--fs-xs);font-weight:700;color:var(--txt-dim);
  margin:var(--s2) 0;font-variant-numeric:tabular-nums}

/* ── §14 · la campagne, toujours sous les yeux ────────────────
   Tout ce que montre la partie appartient à UNE campagne. La barre le
   dit en permanence, hors du contenu qui défile, et c'est par elle
   qu'on en change : sans elle on trancherait la journée 1 en croyant
   trancher la 2, et aucun écran ne rattrape cette erreur après coup. */
.campBar{display:flex;align-items:center;gap:var(--s2);flex-shrink:0;
  padding:var(--s1) var(--gutter) var(--s2);background:var(--surface);border-bottom:1px solid var(--line)}
.campBar .cb-pick{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s2);
  min-height:var(--tap);background:var(--sunken);border:1.5px solid var(--line-strong);
  border-radius:var(--r-md);padding:var(--s1) var(--s3);cursor:pointer;color:inherit;
  text-align:left;font:inherit}
.campBar .cb-ico{font-size:var(--fs-lg);flex-shrink:0;line-height:1}
.campBar .cb-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.campBar .cb-name{font-size:var(--fs-md);font-weight:800;color:var(--txt-strong);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.campBar .cb-sub{font-size:var(--fs-2xs);color:var(--txt-faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.campBar .cb-arw{flex-shrink:0;color:var(--txt-dim);font-size:var(--fs-md)}

/* ── §14 · cocher dans une liste d'athlètes ───────────────────
   La case remplace le numéro dans le pavé de gauche : deux cibles de
   44 px côte à côte ne tiennent pas dans le budget de la ligne. */
.listRow .lead.pick{cursor:pointer;font-family:inherit;font-weight:800;font-size:var(--fs-lg)}
.listRow .lead.pick.on{background:var(--accent-solid);border-color:var(--accent);color:var(--on-light)}

/* ── §14 · une soumission relue, en lecture seule ─────────────
   Aucun champ, aucun bouton qui écrive : le liseré violet — la teinte
   de tout ce qui vient de l'évaluation — et le jeton « Lecture seule »
   le disent avant qu'on ait cherché où taper. */
.subRO{background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--eval);border-radius:var(--r-md);
  padding:var(--s3);margin-bottom:var(--s2)}
.subRO .sr-head{display:flex;align-items:flex-start;gap:var(--s2);margin-bottom:var(--s2)}
.subRO .sr-head .grow{flex:1;min-width:0}
.subRO .sr-who{font-size:var(--fs-sm);font-weight:800;color:var(--txt-strong);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subRO .sr-when{font-size:var(--fs-xs);color:var(--txt-dim);margin-top:2px;line-height:1.35}
.subRO .sr-grid{display:grid;grid-template-columns:1fr;gap:var(--s1);margin-bottom:var(--s2)}
@media(min-width:430px){.subRO .sr-grid{grid-template-columns:repeat(2,1fr);gap:var(--s1) var(--s2)}}
.subRO .sr-cell{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);
  background:var(--sunken);border-radius:var(--r-xs);padding:5px var(--s2)}
.subRO .sr-lbl{font-size:var(--fs-xs);color:var(--txt-dim);min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subRO .sr-val{font-size:var(--fs-sm);font-weight:800;flex-shrink:0;font-variant-numeric:tabular-nums}
.subRO .sr-toks{display:flex;gap:var(--s1);flex-wrap:wrap;margin-bottom:var(--s2)}

/* ══ fin §12 ══════════════════════════════════════════════════════════ */
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   WonderStats v3 — application mono-fichier, hors-ligne, sans dépendance
   Modèle : base de joueuses → saisons → (roster · équipes · vues
   sélectionneur · soumissions). Toute référence à une joueuse passe
   par un identifiant stable (playerId), jamais par un index.
   ══════════════════════════════════════════════════════════════ */
var APP_VERSION = "7.0";

/* ─── Constantes métier ─────────────────────────────────────── */
var POSITIONS=[{key:"ALL",label:"Toutes"},{key:"NONE",label:"—"},{key:"S",label:"S"},{key:"OH",label:"OH"},{key:"OPP",label:"OPP"},{key:"MB",label:"MB"},{key:"L",label:"L"}];
var POS_LABELS={S:"Passeuse",OH:"Réceptionneuse-attaquante",OPP:"Pointue",MB:"Centrale",L:"Libéro"};
/* Les postes réellement portés par une athlète. POSITIONS porte en plus
   « Toutes » et « — », qui n'appartiennent qu'aux filtres et aux menus. */
var POS_KEYS=POSITIONS.filter(function(p){return p.key!=="ALL"&&p.key!=="NONE"}).map(function(p){return p.key});
var POS_SET={};POS_KEYS.forEach(function(k){POS_SET[k]=true});

var SG={
  services:{name:"Services",color:"#3B82F6",stats:[{key:"srv_ace",label:"Ace"},{key:"srv_in",label:"En jeu"},{key:"srv_err",label:"Erreur"}]},
  reception:{name:"Réception",color:"#10B981",stats:[{key:"rec_in",label:"En jeu"},{key:"rec_out",label:"Hors sys."},{key:"rec_err",label:"Erreur"}]},
  passes:{name:"Passes",color:"#8B5CF6",stats:[{key:"pas_att",label:"Attaquable"},{key:"pas_out",label:"Hors sys."}]},
  attaques:{name:"Attaques",color:"#EF4444",stats:[{key:"atk_kill",label:"Kill"},{key:"atk_ok",label:"Réussie"},{key:"atk_err",label:"Erreur"}]},
  blocs:{name:"Blocs",color:"#F59E0B",stats:[{key:"blk_kill",label:"Kill"},{key:"blk_solo",label:"Solo"},{key:"blk_aid",label:"Aide"},{key:"blk_err",label:"Erreur"}]},
  defense:{name:"Défense",color:"#06B6D4",stats:[{key:"def_ok",label:"Réussie"},{key:"def_out",label:"Hors sys."},{key:"sup_in",label:"Soutien"},{key:"sup_err",label:"Sout. err."}]},
  habiletes:{name:"Habiletés",color:"#EC4899",stats:[{key:"hab_ctrl",label:"Contrôlée"},{key:"hab_appel",label:"Avec appel"},{key:"hab_couv",label:"Couverture"},{key:"hab_free",label:"Gratuite"}]}
};
var SG_KEYS=Object.keys(SG);
var VIEWS=[
  {key:"service",label:"🏐 Service",groups:["services"]},
  {key:"rec_atk",label:"⚡ Réc-Att",groups:["reception","passes","attaques"]},
  {key:"transition",label:"🔄 Relance",groups:["blocs","defense","passes","attaques"]},
  {key:"habiletes",label:"🎯 Habiletés",groups:["habiletes"]},
  {key:"all",label:"📋 Toutes",groups:SG_KEYS.slice()}
];
var ALL_STATS=[];SG_KEYS.forEach(function(k){SG[k].stats.forEach(function(s){ALL_STATS.push(s)})});
var STAT_LABEL={};ALL_STATS.forEach(function(s){STAT_LABEL[s.key]=s.label});

/* ─── Efficacité statistique ─────────────────────────────────
   Un compteur brut ne se compare pas : 12 kills ne disent rien sans le
   nombre de tentatives, et deux sélectionneurs n'ont pas vu la même durée
   de jeu. Chaque famille se ramène donc à une efficacité — la part nette
   de gestes réussis, entre −1 et +1 — et à un volume, qui dit si cette
   efficacité mérite qu'on s'y fie.

   La réception compte `rec_out` comme ni réussi ni manqué : la balle est
   restée en jeu, hors système. Même raison pour `def_out`. */
var STAT_FAMILIES={
  services:{pos:["srv_ace"],neg:["srv_err"]},
  reception:{pos:["rec_in"],neg:["rec_err"]},
  passes:{pos:["pas_att"],neg:["pas_out"]},
  attaques:{pos:["atk_kill"],neg:["atk_err"]},
  blocs:{pos:["blk_kill","blk_solo","blk_aid"],neg:["blk_err"]},
  defense:{pos:["def_ok","sup_in"],neg:["sup_err"]},
  habiletes:{pos:["hab_ctrl","hab_appel","hab_couv"],neg:[]}
};
var FAMILY_KEYS=Object.keys(STAT_FAMILIES);
/* Le volume d'une famille est la somme de tous ses compteurs, pas seulement
   des réussis : c'est le nombre de fois où l'athlète a été mise à l'épreuve. */
function familyVolume(stats,fam){
  var g=SG[fam];if(!g)return 0;
  return g.stats.reduce(function(t,s){return t+((stats&&stats[s.key])||0)},0);
}
/* Efficacité d'une famille, ou null si l'athlète n'y a rien fait. */
function familyEff(stats,fam){
  var def=STAT_FAMILIES[fam],vol=familyVolume(stats,fam);
  if(!def||!vol)return null;
  var pos=0,neg=0;
  def.pos.forEach(function(k){pos+=(stats&&stats[k])||0});
  def.neg.forEach(function(k){neg+=(stats&&stats[k])||0});
  return (pos-neg)/vol;
}
/* Toutes les familles d'un relevé, avec leur volume. */
function statProfile(stats){
  var out={};
  FAMILY_KEYS.forEach(function(f){
    var v=familyVolume(stats,f);
    if(v)out[f]={eff:familyEff(stats,f),volume:v};
  });
  return out;
}
function fmtEff(e){
  if(e==null)return "—";
  return (e>=0?"+":"")+e.toFixed(2);
}
/* Une efficacité se lit mal dans l'absolu : ce qui compte est l'écart aux
   autres athlètes du même moment. On la ramène donc sur la même échelle
   1–5 que les critères, en la situant dans la distribution de la campagne.
   Sans dispersion — tout le monde au même niveau — chacune vaut 3. */
function effToScale(eff,moyenne,ecart){
  if(eff==null)return null;
  if(!(ecart>0.0001))return 3;
  var v=3+(eff-moyenne)/ecart;
  return Math.max(1,Math.min(RATING_MAX,v));
}

/* Critères d'évaluation qualitative utilisés par les sélectionneurs */
var CRITERIA=[
  {key:"tech",label:"Technique",desc:"Qualité et constance des gestes"},
  {key:"phys",label:"Physique",desc:"Détente, vitesse, endurance"},
  {key:"iq",label:"Lecture du jeu",desc:"Anticipation, décisions"},
  {key:"att",label:"Attitude",desc:"Coachabilité, énergie, esprit d'équipe"},
  {key:"pot",label:"Potentiel",desc:"Marge de progression"}
];
var CRIT_BY_KEY={};CRITERIA.forEach(function(c){CRIT_BY_KEY[c.key]=c});
var RATING_MAX=5;

/* ══ §02 SÉMANTIQUE DES COULEURS ════════════════════════════════════
   Teinte = humeur, forme = axe, glyphe = valeur. Une teinte n'est
   jamais propriétaire d'un axe : le vert veut dire « bon / acquis »
   partout, et c'est la FORME du jeton (pastille ronde, jeton carré
   contouré, point, étiquette à barre, pavé de score) qui dit de quel
   axe on parle. Aucune information ne repose sur la couleur seule :
   chaque valeur porte son glyphe, et l'écran reste lisible en
   niveaux de gris.

   Corollaire qui commande les valeurs ci-dessous : les teintes
   CHAUDES (vert, ambre, rouge) sont réservées au jugement — décision,
   offre, appartenance, issue, progression ; les teintes FROIDES
   (ardoise, ciel, indigo, magenta) aux catégories — nature
   d'événement. C'est ce qui libère le vert de « championnat ».

   Toutes les valeurs sont des variantes « encre » (claires), parce
   qu'elles sont écrites SUR un fond sombre : #10B981 en texte sur
   une carte donne 3.4:1, #34D399 donne 7.6:1.                      */
var RECOS=[
  {key:"select",label:"Retenir",short:"Retenir",color:"#34D399",icon:"✅"},
  {key:"recall",label:"Recaller",short:"Recaller",color:"#FBBF24",icon:"🔁"},
  {key:"cut",label:"Non retenue",short:"Couper",color:"#F87171",icon:"⛔"}
];
var RECO_BY_KEY={};RECOS.forEach(function(r){RECO_BY_KEY[r.key]=r});

/* Statuts d'une joueuse dans le roster d'une saison */
var STATUS_ORDER=["selected","recalled","candidate","cut"];
var STATUSES={
  candidate:{label:"Candidate",color:"#94A3B8",icon:"◻️"},
  recalled:{label:"Recallée",color:"#FBBF24",icon:"🔁"},
  selected:{label:"Retenue",color:"#34D399",icon:"✅"},
  cut:{label:"Non retenue",color:"#F87171",icon:"⛔"}
};
/* Recommandation de sélectionneur → statut de roster */
var RECO_TO_STATUS={select:"selected",recall:"recalled",cut:"cut"};

/* Statut d'effectif en cours de saison — indépendant du statut de sélection.
   Une joueuse partie en janvier reste « Retenue » (elle l'a été) et conserve
   ses matchs joués ; seule son appartenance courante change. */
var MEMBERSHIPS={
  active:{label:"Active",color:"#34D399",icon:"●"},
  injured:{label:"Blessée",color:"#FBBF24",icon:"🩹"},
  left:{label:"Partie",color:"#94A3B8",icon:"→"}
};
var MEMBERSHIP_ORDER=["active","injured","left"];

/* Campagnes d'évaluation : une saison en compte plusieurs, chacune datée.
   C'est ce qui permet de comparer la sélection d'août au bilan de mai. */
var CAMPAIGN_KINDS=[
  {key:"tryout",label:"Sélection",icon:"🎯"},
  {key:"mid",label:"Mi-saison",icon:"📈"},
  {key:"final",label:"Fin de saison",icon:"🏁"},
  {key:"custom",label:"Ponctuelle",icon:"📌"}
];
var KIND_BY_KEY={};CAMPAIGN_KINDS.forEach(function(k){KIND_BY_KEY[k.key]=k});

/* Catégories : une donnée du club, pas une constante. Chaque fédération
   a les siennes, et elles changent. Cette liste n'est que le point de
   départ d'un club neuf — l'administrateur la remanie ensuite. */
var CATEGORIES_DEFAUT=["U12","U13","U14","U15","U16","U18","U21","Senior"];

/* Les catégories d'un club, complétées de celles réellement portées par
   ses équipes : retirer une catégorie de la liste ne doit jamais
   reclasser en silence une équipe qui l'utilise encore. */
function categoriesOf(club){
  var base=(club&&club.categories&&club.categories.length)
    ? club.categories.slice() : CATEGORIES_DEFAUT.slice();
  if(club)DB.teams.forEach(function(t){
    if(t.clubId===club.id&&t.category&&base.indexOf(t.category)===-1)base.push(t.category);
  });
  return base;
}
/* Catégories du contexte courant, pour les écrans qui n'ont pas de club
   sous la main. */
function curCategories(){
  var c=ctxClub();
  if(c)return categoriesOf(c);
  if(DB.clubs.length===1)return categoriesOf(DB.clubs[0]);
  var tous=[];
  DB.clubs.forEach(function(cl){
    categoriesOf(cl).forEach(function(x){if(tous.indexOf(x)===-1)tous.push(x)});
  });
  return tous.length?tous:CATEGORIES_DEFAUT.slice();
}
function cleanCategories(list){
  var out=[];
  (list||[]).forEach(function(x){
    x=String(x||"").trim();
    if(x&&out.indexOf(x)===-1)out.push(x);
  });
  return out;
}

/* ─── Rencontres ─────────────────────────────────────────────────────
   Une saison n'est pas une suite de matchs indistincts : elle a des
   amicaux, du championnat et des tournois, et un tournoi est un
   événement qui porte plusieurs matchs. Sans cette entité, tout le
   contexte se réfugiait dans le nom de la session. Voir AUDIT.md § 8. */
/* §02 D — une catégorie n'est ni bonne ni mauvaise : elle n'emprunte
   pas la palette du jugement. `league` quitte le vert #34D399, qui
   entrait en collision avec « Retenue » et avec « Victoire », pour
   l'indigo ; `tournament` quitte l'ambre #F59E0B, qui entrait en
   collision avec « Recallée » et « Blessée », pour le magenta ;
   `friendly` quitte #60A5FA pour un ciel plus franc, qui ne se
   confond plus avec l'accent bleu de l'interface — lequel désigne
   l'action, pas une nature de rencontre. Le magenta n'est pas un
   choix esthétique : c'est la seule teinte franche restante une fois
   le vert, l'ambre et le rouge confisqués par le jugement, le bleu
   par l'interface et le violet par l'évaluation, et elle se distingue
   de l'indigo comme du ciel en vision deutan et protan. */
var EVENT_KINDS={
  friendly:{key:"friendly",label:"Amical",short:"Amical",icon:"🤝",color:"#38BDF8"},
  league:{key:"league",label:"Championnat",short:"Champ.",icon:"🏆",color:"#818CF8"},
  tournament:{key:"tournament",label:"Tournoi",short:"Tournoi",icon:"🎪",color:"#F472B6"},
  training:{key:"training",label:"Entraînement",short:"Entr.",icon:"🎽",color:"#94A3B8"}
};
var EVENT_KEYS=["league","tournament","friendly","training"];
/* Un tournoi porte plusieurs matchs ; les autres natures, un seul en général. */
function kindIsMulti(k){return k==="tournament"}

/* Inverse de RECO_TO_STATUS : un statut de saison redit en décision.
   Sert la montée v7, qui relit les statuts déjà tranchés comme les
   décisions de campagne qu'ils étaient. */
var STATUS_TO_RECO={};
Object.keys(RECO_TO_STATUS).forEach(function(r){STATUS_TO_RECO[RECO_TO_STATUS[r]]=r});

/* ─── Offres ─────────────────────────────────────────────────────────
   Retenir une athlète n'est pas l'avoir dans l'équipe : c'est lui
   proposer d'en être. Tant qu'elle n'a pas répondu, l'offre est en
   attente — et l'équipe n'est pas constituée. Cette distinction est ce
   qui empêche un effectif de paraître complet alors que trois joueuses
   n'ont pas encore dit oui. */
/* §02 B — le statut d'offre reprend forcément les teintes de la
   décision (bon / en suspens / refusé). Ce qui l'en distingue, même
   côte à côte, c'est sa FORME : jeton rectangulaire à contour seul,
   sans fond — voir tok("box"). « Refusée » passe du gris au rouge
   encre : un refus est une issue négative, pas une absence. */
var OFFER_STATUS={
  pending:{key:"pending",label:"En attente",short:"Attente",icon:"⏳",color:"#FBBF24"},
  accepted:{key:"accepted",label:"Acceptée",short:"Acceptée",icon:"🤝",color:"#34D399"},
  declined:{key:"declined",label:"Refusée",short:"Refusée",icon:"✖️",color:"#F87171"}
};

/* ─── §02 · le texte qu'une teinte métier peut porter ────────────────
   Règle d'or : une teinte vive n'est jamais à la fois un fond et un
   texte de la même valeur. Sur un fond plein CLAIR (vert #34D399,
   ambre #F59E0B, magenta #F472B6) on écrit en encre sombre ; sur un
   fond plein PROFOND (bleu #2563EB, violet #6D28D9, rouge #DC2626) on
   écrit en blanc. C'est calculé et non deviné, parce que les couleurs
   métier sont des données : un club qui les remanie ne doit pas
   fabriquer un libellé illisible.                                  */
function onColor(hex){
  var m=/^#?([0-9a-fA-F]{6})/.exec(String(hex||""));
  if(!m)return "#FFFFFF";
  var v=parseInt(m[1],16);
  function lin(c){c=c/255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)}
  var L=0.2126*lin((v>>16)&255)+0.7152*lin((v>>8)&255)+0.0722*lin(v&255);
  /* Seuil 0.18 : au-delà, #0B1220 tient un meilleur contraste que le blanc. */
  return L>0.18?"#0B1220":"#FFFFFF";
}
/* Peindre un contrôle « choisi » d'une teinte métier sans jamais
   laisser son libellé sous 4.5:1. Les trois propriétés vont ensemble :
   les séparer est précisément ce qui produisait du blanc sur vert. */
function paintOn(el,hex){
  if(!el)return el;
  el.style.background=hex;el.style.borderColor=hex;el.style.color=onColor(hex);
  return el;
}

/* ─── Date de naissance ───────────────────────────────────────
   Un club écrit « 26/10/2011 » ; il arrive aussi qu'il ne connaisse que
   l'année, et c'est déjà suffisant pour une catégorie. Les deux formes
   sont acceptées et rangées séparément : `birthDate` porte la date
   complète au format ISO quand on la connaît, `birthYear` l'année seule
   — elle reste ce sur quoi les catégories se décident, et ce qui
   dédoublonne deux homonymes à la fusion d'un export.

   Une date illisible n'est jamais devinée : elle est refusée. Le 31
   février d'une frappe de travers ne doit pas devenir une naissance. */
function mkBirth(y,mo,d){
  if(y<1900||y>2100||mo<1||mo>12||d<1||d>31)return null;
  var dt=new Date(Date.UTC(y,mo-1,d));
  if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d)return null;
  return {date:y+"-"+pad2(mo)+"-"+pad2(d),year:String(y)};
}
function parseBirth(v){
  var t=String(v==null?"":v).trim();
  if(!t)return {date:"",year:""};
  var m=t.match(/^(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4})$/);
  if(m)return mkBirth(+m[3],+m[2],+m[1]);
  var iso=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);   /* ce que portent les sauvegardes */
  if(iso)return mkBirth(+iso[1],+iso[2],+iso[3]);
  if(/^\d{4}$/.test(t)){var y=+t;return (y>=1900&&y<=2100)?{date:"",year:t}:null}
  return null;
}
function hasBirthDate(p){return !!(p&&p.birthDate&&/^\d{4}-\d{2}-\d{2}$/.test(p.birthDate))}
/* Telle qu'on l'écrit : jj/mm/aaaa, ou l'année seule quand c'est tout
   ce qu'on sait d'elle. */
function fmtBirth(p){
  if(hasBirthDate(p)){var x=p.birthDate.split("-");return x[2]+"/"+x[1]+"/"+x[0]}
  return (p&&p.birthYear)||"";
}
/* Ce qui ordonne : l'année, puis le jour lorsqu'il est connu. Une fiche
   qui ne porte que l'année se range avec son année, après celles dont on
   sait le jour — dans un sens comme dans l'autre. Lui prêter un premier
   janvier la ferait passer devant des athlètes réellement plus âgées. */
function birthSortKey(p){
  var y=(p&&/^\d{4}$/.test(p.birthYear))?+p.birthYear:null;
  var md=hasBirthDate(p)?p.birthDate.slice(5):"";
  if(y===null&&md)y=+p.birthDate.slice(0,4);
  return {y:y,md:md};
}
function nowISO(){return new Date().toISOString()}
function pad2(n){return (n<10?"0":"")+n}
function todayISO(){
  var d=new Date();
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}

function fmtDate(iso){try{return new Date(iso).toLocaleDateString("fr-CA",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return iso||""}}
function fmtDay(iso){try{return new Date(iso).toLocaleDateString("fr-CA",{year:"numeric",month:"long",day:"numeric"})}catch(e){return iso||""}}
function fmtShortDay(d){if(!d)return "?";try{return new Date(d+(d.length===10?"T12:00:00":"")).toLocaleDateString("fr-CA",{month:"short",day:"numeric",year:"numeric"})}catch(e){return d}}
function plural(n,s,p){return n+" "+(n>1?(p||s+"s"):s)}

/* Une ligne d'ajout en lot : « Prénom Nom [naissance] [dossard] ».

   Rien n'est deviné à la position : la naissance se reconnaît à sa forme
   — 26/10/2011, ou une année seule à quatre chiffres — et le dossard à
   la sienne, un à trois chiffres en fin de ligne. Quatre chiffres ne
   peuvent pas être un dossard, un dossard ne peut pas être une année :
   les deux ne se confondent jamais. Ce qui reste est le nom.

   Une date de forme juste mais impossible (31/02) rend la ligne
   illisible plutôt que de se glisser dans le nom de famille. */
function parseBulkLine(line){
  var t=String(line||"").trim();
  var brut="",m=t.match(/(^|\s)(\d{1,2}\s*[\/\-.]\s*\d{1,2}\s*[\/\-.]\s*\d{4})(\s|$)/);
  if(m)brut=m[2];
  else {var m2=t.match(/(^|\s)(\d{4})(\s|$)/);if(m2)brut=m2[2]}
  var birth={date:"",year:""};
  if(brut){
    birth=parseBirth(brut);
    if(!birth)return null;
    var i=t.indexOf(brut);
    t=(t.slice(0,i)+" "+t.slice(i+brut.length)).trim();
  }
  var num="",mn=t.match(/\s(\d{1,3})$/);
  if(mn){num=mn[1];t=t.slice(0,mn.index).trim()}
  var parts=t.split(/\s+/).filter(Boolean);
  return {firstName:parts.shift()||"",lastName:parts.join(" "),
    birthDate:birth.date,birthYear:birth.year,number:num};
}

/* ─── Réglages du score ──────────────────────────────────────
   La formule appartient au club, pas à l'application. Elle est tenue au
   niveau de la saison, et non de la campagne : comparer la sélection de
   septembre au bilan de mai n'a de sens que si les deux sont mesurées de
   la même façon. */
function mkScoring(o){
  var cw={},sw={};
  CRITERIA.forEach(function(c){cw[c.key]=1});
  FAMILY_KEYS.forEach(function(f){sw[f]=1});
  return Object.assign({
    critWeights:cw,
    statWeights:sw,
    statShare:0.5,      /* part des statistiques dans le score */
    severity:true,      /* corriger la sévérité propre à chaque sélectionneur */
    reliability:1,      /* amortissement d'un score fondé sur peu de regards */
    minVolume:5         /* gestes au-dessous desquels une famille ne dit rien */
  },o||{});
}
/* Les réglages d'une saison, complétés de leurs valeurs par défaut : une
   sauvegarde antérieure n'en porte aucun, et ne doit pas pour autant
   produire un score vide. */
function scoringOf(squad){
  var base=mkScoring(),s=(squad&&squad.scoring)||{};
  var out=mkScoring();
  CRITERIA.forEach(function(c){
    var v=(s.critWeights||{})[c.key];
    out.critWeights[c.key]=(typeof v==="number"&&v>=0)?v:base.critWeights[c.key];
  });
  FAMILY_KEYS.forEach(function(f){
    var v=(s.statWeights||{})[f];
    out.statWeights[f]=(typeof v==="number"&&v>=0)?v:base.statWeights[f];
  });
  ["statShare","reliability","minVolume"].forEach(function(k){
    if(typeof s[k]==="number"&&s[k]>=0)out[k]=s[k];
  });
  out.statShare=Math.max(0,Math.min(1,out.statShare));
  if(typeof s.severity==="boolean")out.severity=s.severity;
  return out;
}
/* Vrai quand la saison s'en tient à la moyenne simple d'autrefois. */
function scoringIsPlain(sc){
  if(sc.statShare>0||sc.severity||sc.reliability>0)return false;
  var w=null,egal=true;
  CRITERIA.forEach(function(c){
    if(w===null)w=sc.critWeights[c.key];
    else if(sc.critWeights[c.key]!==w)egal=false;
  });
  return egal&&w>0;
}
/* Groupes de compteurs d'une vue. Une liste vide est un choix — le plan de
   séance prévoit une vue d'évaluateur sans aucun compteur — tandis qu'un
   champ absent est une donnée ancienne, d'avant le réglage : elle reçoit
   tous les groupes, comme elle les affichait. */
function normGroups(g){
  if(!Array.isArray(g))return SG_KEYS.slice();
  return g.filter(function(k){return SG[k]});
}
/* Groupes d'athlètes d'une vue. On ne garde que des numéros que la vue
   contient vraiment : un paquet bricolé ou une vue dont on a retiré des
   athlètes ne doit pas laisser des groupes qui désignent le vide. */
function normPlayerGroups(raw,playerIds){
  if(!Array.isArray(raw))return [];
  var connus={};(playerIds||[]).forEach(function(p){connus[p]=1});
  var vus={},out=[];
  raw.forEach(function(g){
    if(!g||!Array.isArray(g.playerIds))return;
    var ids=g.playerIds.filter(function(p){
      if(!connus[p]||vus[p])return false;      /* une athlète n'est que dans un groupe */
      vus[p]=1;return true;
    });
    if(!ids.length)return;

}
/* Découpe une liste déjà ordonnée en groupes de `taille`. L'ordre reçu

function decouperEnGroupes(idsOrdonnes,taille){
  taille=parseInt(taille,10)||0;

function teamById(id){for(var i=0;i<DB.teams.length;i++)if(DB.teams[i].id===id)return DB.teams[i];return null}
function squadFor(teamId,seasonId){
  for(var i=0;i<DB.squads.length;i++)
    if(DB.squads[i].teamId===teamId&&DB.squads[i].seasonId===seasonId)return DB.squads[i];
  return null;
}
/* Le dernier squad connu d'une équipe, saison exclue : celui dont la
   saison a été créée le plus récemment. Sert à reprendre ce qui doit
   survivre d'une saison à l'autre. */
function dernierSquadDe(teamId,saufSeasonId){
  var best=null,bestAt="";
  (DB.squads||[]).forEach(function(sq){
    if(sq.teamId!==teamId||sq.seasonId===saufSeasonId)return;
    var s=seasonById(sq.seasonId);
    if(!s)return;
    var at=String(s.createdAt||"");
    if(!best||at>bestAt){best=sq;bestAt=at}
  });
  return best;
}
/* Crée le squad à la volée : une équipe existe dès qu'on la fait jouer.

   La formule du score suit l'équipe d'une saison à l'autre : un club qui
   a décidé du poids de ses critères ne veut pas le redécider chaque
   septembre, et un retour silencieux aux valeurs par défaut fausserait la
   comparaison avec la saison passée. Tout le reste — roster, campagnes,
   vues, matchs — naît vierge : c'est une nouvelle saison. */
function ensureSquad(teamId,seasonId){
  var sq=squadFor(teamId,seasonId);
  if(sq)return sq;
  var t=teamById(teamId);
  if(!t||!seasonId)return null;
  sq=mkSquad(teamId,seasonId,t.name);
  sq.category=t.category;sq.freeView=!!t.freeView;
  var prec=dernierSquadDe(teamId,seasonId);
  if(prec&&prec.scoring)sq.scoring=clone(prec.scoring);
  DB.squads.push(sq);
  return sq;
}
/* Le squad courant : croisement du contexte (équipe) et de la saison active.
   C'est l'objet que manipulent tous les écrans entraîneur. */

/* ─── Série de dossards ───────────────────────────────────────
   Un club distribue des chasubles numérotées : 1 à 28, ou 4 à 19 pour
   celui qui garde ses maillots de l'an dernier. La série n'est pas une
   règle — on peut toujours saisir un numéro hors d'elle dans le tableau
   de sélection — c'est le jeu qu'on a sous la main ce jour-là.

   Non réglée, elle se devine de l'effectif convoqué : c'est presque
   toujours 1 à autant d'athlètes. */
function numberingOf(squad){
  var n=squad&&squad.numbering;
  var from=n?parseInt(n.from,10):NaN,to=n?parseInt(n.to,10):NaN;
  if(!isFinite(from)||from<0)from=1;
  if(!isFinite(to)||to<from)to=from+Math.max((squad&&squad.roster.length)||12,1)-1;
  if(to-from>199)to=from+199;      /* deux cents tuiles : au-delà, on ne choisit plus, on cherche */
  return {from:from,to:to};
}
function setNumbering(squad,from,to){
  if(!squad)return;
  from=Math.max(0,parseInt(from,10)||0);
  to=parseInt(to,10);
  if(!isFinite(to)||to<from)to=from;
  if(to-from>199)to=from+199;
  squad.numbering={from:from,to:to};
  scheduleAutoSave();
}
function porteurDe(squad,num){
  num=cleanNum(num);
  if(!num)return null;
  var out=null;
  (squad?squad.roster:[]).forEach(function(e){if(!out&&e.number===num)out=e});
  return out;
}
/* Poser un numéro sur une athlète. Rien n'est attribué d'office : ce
   geste vient toujours d'un doigt sur une tuile. Quand le numéro est
   déjà porté, on échange plutôt que de laisser quelqu'un nu — et on le
   demande, parce que deux dossards qui changent de main, ça se dit. */
/* assignNumber(squad, pid, num, apres)
   La confirmation d'un échange de dossard n'est plus bloquante : quand
   le numéro est déjà porté, la fonction ouvre la question et rend
   `false` tout de suite. Le travail se poursuit dans `apres`, appelé
   une fois la pose faite — c'est ce qui permet à l'appelant de
   continuer (enregistrer, passer à la suivante) sans savoir si la
   question a été posée ou non. */
function assignNumber(squad,pid,num,apres){
  var e=rosterEntry(squad,pid);
  if(!e)return false;
  num=cleanNum(num);
  var avant=e.number;
  if(num&&avant===num){                     /* même tuile : on retire */
    e.number="";
    logAct("number",logWho(squad,pid)+" : numéro "+avant+" retiré",
      {teamId:squad.teamId,seasonId:squad.seasonId,playerId:pid});
    scheduleAutoSave();if(apres)apres();return true;
  }
  var autre=null;
  squad.roster.forEach(function(x){if(!autre&&x.number===num&&x.playerId!==pid)autre=x});
  if(autre){
    var qui=fullName(playerById(autre.playerId));
    var libere=avant
      ? "Le "+num+" est porté par "+qui+".\nÉchanger ? "+qui+" prendra le "+avant+"."
      : "Le "+num+" est porté par "+qui+".\nLe lui prendre ? "+qui+" se retrouvera sans numéro.";
    return confirmAct(libere,function(){
      autre.number=avant||"";
      poserNumero(squad,pid,num,avant,autre);
      if(apres)apres();
    },{confirm:avant?"Échanger":"Le lui prendre",tone:"primary"});
  }
  poserNumero(squad,pid,num,avant,null);
  if(apres)apres();
  return true;
}
/* La pose elle-même, une fois toute question tranchée. */
function poserNumero(squad,pid,num,avant,autre){
  var e=rosterEntry(squad,pid);
  if(!e)return false;
  e.number=num;
  logAct("number",logWho(squad,pid)+" : numéro "+(avant||"—")+" → "+(num||"—")+
    (autre?" (échangé avec "+fullName(playerById(autre.playerId))+")":""),
    {teamId:squad.teamId,seasonId:squad.seasonId,playerId:pid});
  /* Une vue déjà partie porte l'ancien numéro : le paquet est figé. */
  var parties=vuesDistribuees(squad,pid);
  if(parties.length)showToast(parties.length===1
    ? "⚠️ Une vue déjà distribuée affiche encore #"+(avant||"—")+" — republiez-la"
    : "⚠️ "+parties.length+" vues déjà distribuées affichent encore #"+(avant||"—")+" — republiez-les",
    {tone:"warn",duree:5000});
  scheduleAutoSave();
  return true;
}

/* Vue "joueuse" consommée par les écrans de saisie : stats par référence */
function teamViewPlayers(team){

/* ══ COFFRE ════════════════════════════════════════════════════
   Les données du club sont chiffrées dans le navigateur : AES-GCM 256,
   clé dérivée de la phrase de passe par PBKDF2-SHA256. La clé ne quitte
   jamais la mémoire — rien de déchiffrable ne touche le disque.

   Ce que cela protège réellement : quelqu'un qui récupère l'appareil ou
   lit localStorage ne voit que du bruit. Ce que cela ne protège pas : la
   séparation des rôles reste côté client (voir ROLES.md §7), et qui
   connaît la phrase voit tout ce que voit son propriétaire.
   ══════════════════════════════════════════════════════════════ */
var SK_VAULT="wonderstats_vault_v1";

/* Jetons d'accès et adresses privées. Rangés à part de DB pour qu'une
   sauvegarde exportée ne les emporte pas, et chiffrés avec le reste. */
var SECRETS={github:null,superKey:null};
var VAULT={key:null,meta:null,unlocked:false,plain:null,noCrypto:false};

function subtle(){
  var c=(typeof crypto!=="undefined")?crypto:null;
  if(!c)return null;
  return c.subtle||c.webkitSubtle||null;   /* vieux Safari : webkitSubtle */
}
/* crypto.subtle exige un contexte sécurisé. En https ou sur localhost il
   est là ; ouvert en file:// il ne l'est pas, et il faut le dire au lieu
   de faire semblant de chiffrer. */
function cryptoAvailable(){return !!subtle()&&typeof TextEncoder!=="undefined"}

function b64(buf){
  var b=new Uint8Array(buf),s="";
  for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
  return btoa(s);
}
function unb64(str){
  var s=atob(str),b=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);
  return b;
}
function randBytes(n){
  var b=new Uint8Array(n);
  (crypto.getRandomValues||crypto.webkitGetRandomValues).call(crypto,b);
  return b;
}
function utf8(str){return new TextEncoder().encode(str)}

function deriveKey(pass,salt,iter){
  var sub=subtle();
  return Promise.resolve(sub.importKey("raw",utf8(pass),{name:"PBKDF2"},false,["deriveKey"]))
    .then(function(base){
      return sub.deriveKey(
        {name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},
        base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
    });
}

/* Le coût du PBKDF2 est calibré sur l'appareil qui crée le coffre : on
   vise une demi-seconde. Un vieil iPad n'est pas puni, un portable récent
   n'est pas sous-protégé. Le nombre retenu est écrit dans le coffre. */
function calibrateIter(){
  if(!cryptoAvailable())return Promise.resolve(200000);
  var probe=100000,salt=randBytes(16),t0=(new Date()).getTime();
  return deriveKey("calibrage",salt,probe).then(function(){
    var ms=(new Date()).getTime()-t0;
    if(ms<1)ms=1;
    var n=Math.round(probe*(500/ms)/10000)*10000;
    return Math.max(100000,Math.min(600000,n));
  }).catch(function(){return 200000});
}

function vaultEncrypt(obj){
  if(!VAULT.key||!VAULT.meta)return Promise.reject(new Error("Coffre verrouillé"));
  var iv=randBytes(12);
  return Promise.resolve(subtle().encrypt({name:"AES-GCM",iv:iv},VAULT.key,utf8(JSON.stringify(obj))))
    .then(function(ct){
      /* Rien d'identifiant hors du chiffré : l'indice est le seul texte
         en clair, et c'est l'utilisateur qui décide de ce qu'il y met. */
      return {v:1,kdf:{salt:VAULT.meta.kdf.salt,iter:VAULT.meta.kdf.iter,hash:"SHA-256"},
        cipher:"AES-GCM",iv:b64(iv),ct:b64(ct),
        hint:VAULT.meta.hint||"",at:nowISO()};
    });
}
/* Une phrase fausse fait échouer l'authentification GCM : le déchiffrement
   lève, il n'y a pas de comparaison à écrire ni à contourner. */
function vaultDecrypt(box,pass){
  var salt=unb64(box.kdf.salt),iter=box.kdf.iter||200000;
  return deriveKey(pass,salt,iter).then(function(key){
    return Promise.resolve(subtle().decrypt({name:"AES-GCM",iv:unb64(box.iv)},key,unb64(box.ct)))
      .then(function(plain){
        return {key:key,data:JSON.parse(new TextDecoder().decode(plain))};
      });
  });
}

/* Déchiffrer avec la clé déjà en mémoire, sans redemander la phrase :
   le journal d'opérations est relu au chargement, coffre déjà ouvert. */
function vaultDecryptWithKey(box){
  if(!VAULT.key)return Promise.reject(new Error("Coffre verrouillé"));
  return Promise.resolve(subtle().decrypt({name:"AES-GCM",iv:unb64(box.iv)},VAULT.key,unb64(box.ct)))
    .then(function(plain){return JSON.parse(new TextDecoder().decode(plain))});
}
function readVaultBox(){
  try{var d=localStorage.getItem(SK_VAULT);return d?JSON.parse(d):null}catch(e){return null}
}
function vaultExists(){return !!readVaultBox()}

/* Poser le verrou sur des données déjà présentes, ou sur un club neuf. */
function vaultCreate(pass,hint,who,payload){
  if(!cryptoAvailable())return Promise.reject(new Error("Chiffrement indisponible sur cet appareil"));
  return calibrateIter().then(function(iter){
    var salt=randBytes(16);
    return deriveKey(pass,salt,iter).then(function(key){
      VAULT.key=key;
      VAULT.meta={kdf:{salt:b64(salt),iter:iter,hash:"SHA-256"},hint:hint||"",who:who||""};
      VAULT.unlocked=true;VAULT.noCrypto=false;
      return vaultEncrypt(payload).then(function(box){
