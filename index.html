defModal("campaigns",renderCampaignsModal,{autofocus:false});
/* ══ fin §14 ══════════════════════════════════════════════════ */

/* ══ §15 PARTIE ENTRAÎNEMENTS ══════════════════════════════════
   Suivi de la performance en séance, athlète par athlète, et
   récap compilé de l'équipe.                                    */
function renderPartTraining(sq){
  return renderEventPart(sq,"training");
}
/* ══ fin §15 ══════════════════════════════════════════════════ */

/* ══ §16 PARTIE MATCHS ═════════════════════════════════════════
   Amicaux et championnat : par set, par match, et sur tous les
   matchs. Le championnat n'a pas d'écran à lui — il se compte et
   s'affiche exactement comme un amical, et lui en donner un aurait
   fait deux écrans jumeaux.                                      */
function renderPartMatches(sq){
  return renderEventPart(sq,"matches");
}
/* ══ fin §16 ══════════════════════════════════════════════════ */

/* ══ §17 PARTIE TOURNOIS ═══════════════════════════════════════
   Tous tournois confondus, par tournoi, par match, par set.      */
function renderPartTournaments(sq){
  return renderEventPart(sq,"tournaments");
}
/* ══ fin §17 ══════════════════════════════════════════════════ */

/* Le tronc commun des trois parties de rencontres. Elles ne
   diffèrent que par les natures qu'elles retiennent et par le
   niveau de lecture le plus haut — le tournoi en a un de plus que
   le match. Une seule fonction, donc, plutôt que trois écrans à
   maintenir en parallèle. */
function renderEventPart(sq,k){
  var s=SECTION_BY_KEY[k]||{};
  var evs=eventsOfSection(sq,k);
  var body=renderSessionsPane(sq,{kinds:sectionKinds(k),section:k});
  var corps=h("div",{className:"content pad","data-scroll-key":"part-"+k},body);
  var sous=evs.length?plural(evs.length,s.key==="tournaments"?"tournoi":"rencontre",
                             s.key==="tournaments"?"tournois":null):null;
  /* Relever, c'est l'acte de la partie : sans ce bouton, la saisie
     n'aurait plus aucune porte d'entrée depuis que la barre du bas ne
     porte plus d'onglet « Saisie ». */
  var relever=h("button",{className:"btn btn-primary sm",type:"button",
    "aria-label":"Relever les statistiques",
    onclick:function(){
      state.inputKind=sectionKinds(k)?sectionKinds(k)[0]:"league";
      navTo(mkRoute("legacy","input"));
    }},"✏️ Relever");
  return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},
    partHeader(s.label||"Rencontres",sous,relever),
    corps);
}

/* ══ §18 PARTIE OBJECTIFS ══════════════════════════════════════
   Objectifs par athlète et pour l'équipe, recalculés à chaque
   modification de données de performance, avec leurs marqueurs
   d'atteinte et de régression.                                   */
function renderPartGoals(sq){
  return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},
    partHeader("Objectifs",null),
    h("div",{className:"content pad","data-scroll-key":"part-goals"},
      emptyState({icon:"📈",title:"Objectifs",
        sub:"Cette partie arrive. Elle proposera à chaque athlète un objectif "+
            "de progression recalculé à chaque relevé, réajusté quand il est "+
            "atteint ou quand la performance recule."})));
}
/* ══ fin §18 ══════════════════════════════════════════════════ */

/* ══ §19 PARTIE RÉCAP GLOBAL ═══════════════════════════════════
   La compilation des cinq autres parties, par athlète et pour
   l'équipe entière. Rien n'y est stocké : tout s'y recalcule.    */
function renderPartRecap(sq){
  return renderSummaryTab();
}
/* ══ fin §19 ══════════════════════════════════════════════════ */

var SECTION_RENDER={
  selection:renderPartSelection,
  training:renderPartTraining,
  matches:renderPartMatches,
  tournaments:renderPartTournaments,
  goals:renderPartGoals,
  recap:renderPartRecap
};

/* ══ RÉGLAGES ══════════════════════════════════════════════════
   Ce qui tient la saison mais n'est pas la saison : les saisons
   elles-mêmes, le journal des décisions, et la sortie des données.
   Rangé ici pour que le tableau de bord ne porte que du jeu.   */
function renderSettingsTab(){
  var sq=curSquad();
  var panes=[{k:"seasons",l:"🗓️ Saisons"},{k:"log",l:"📜 Journal"},{k:"data",l:"💾 Données"}];
  if(!state.setPane||!panes.some(function(p){return p.k===state.setPane}))state.setPane="seasons";
  var row=h("div",{className:"pill-row tight"},panes.map(function(p){
    return h("button",{className:"pill"+(state.setPane===p.k?" active":""),type:"button",
      onclick:function(){state.setPane=p.k;render()}},p.l);
  }));
  var body;
  if(state.setPane==="log")body=renderLogPane(sq?sq.teamId:"");
  else if(state.setPane==="data")body=h("div",null,
    h("div",{className:"hint"},
      "Une sauvegarde exportée est un fichier que vous gardez. Elle ne part "+
      "sur aucun serveur, et ne contient aucun jeton d'accès."),
    h("div",{className:"data-actions"},
      h("button",{className:"btn btn-export",type:"button",onclick:exportMyTeam},
        "📤 Exporter mon équipe")));
  else body=renderSeasonsPane();
  return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},row,
    h("div",{className:"content pad","data-scroll-key":"set-"+state.setPane},body));
}

/* ── Fiche joueuse de saison ────────────────────────────────
   Réunit ce que l'audit avait trouvé séparé : le cumul de match
   (quantitatif) et les évaluations par campagne (qualitatif). */
function renderPlayerSheet(squad,entry,p){
  /* Elle vit désormais dans la feuille d'une athlète (§14), et non plus
     collée sous une ligne de liste : la carte redevient une carte. */
  var box=h("div",{className:"card",style:{marginBottom:"10px"}});

  /* Position */
  box.appendChild(h("div",{className:"field"},h("label",null,"Position"),
    h("div",{className:"pos-btns"},POSITIONS.filter(function(x){return x.key!=="ALL"}).map(function(pos){
      var v=pos.key==="NONE"?"":pos.key;
      return h("button",{className:"pos-btn"+(entry.position===v?" active":""),onclick:function(){entry.position=v;scheduleAutoSave();render()}},pos.label);
    }))));

  /* Statut d'effectif — seulement une fois retenue */
  if(entry.status==="selected"){
    box.appendChild(h("div",{className:"field"},h("label",null,"Dans l'effectif"),
      h("div",{className:"reco-row"},MEMBERSHIP_ORDER.map(function(k){
        var m=MEMBERSHIPS[k],on=entry.membership===k;
        var b=h("button",{className:"reco-btn"+(on?" on":""),onclick:function(){
          if(entry.membership!==k)logAct("membership",
            logWho(squad,entry.playerId)+" : effectif "+(MEMBERSHIPS[entry.membership]||{}).label+" → "+m.label,
            {teamId:squad.teamId,seasonId:squad.seasonId,playerId:entry.playerId});
          entry.membership=k;scheduleAutoSave();render();
        }},m.icon+" "+m.label);
        if(on)paintOn(b,m.color);
        return b;
      })),
      h("div",{className:"muted",style:{marginTop:"6px"}},
        "Une joueuse blessée ou partie reste retenue et conserve ses matchs joués ; elle sort simplement du terrain.")));
  }

  /* Cumul de match sur la saison */
  var ms=playerSeasonStats(squad,entry.playerId);
  box.appendChild(h("div",{className:"section-title"},"Matchs de la saison"));
  if(ms.sessions){
    box.appendChild(h("div",{className:"muted",style:{marginBottom:"6px"}},
      plural(ms.sessions,"match")+" joué(s)"+
      ((ms.record.win||ms.record.loss)?" · "+ms.record.win+"V–"+ms.record.loss+"D":"")+
      " · "+ms.teams.map(function(t){return t.name+" ("+t.sessions+")"}).join(", ")));
    /* Ventilation par nature : « comment se comporte-t-elle en tournoi ? »
       est la question la plus fréquente d'un bilan de fin de saison. */
    var kinds=EVENT_KEYS.filter(function(k){return ms.byKind[k]});
    if(kinds.length>1){
      box.appendChild(h("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap",marginBottom:"8px"}},
        kinds.map(function(k){
          var kk=EVENT_KINDS[k],d=ms.byKind[k];
          var kills=d.stats.atk_kill||0;
          return h("span",{className:"badge",style:{background:kk.color+"1E",color:kk.color,borderColor:kk.color+"55",padding:"5px 9px"}},
            kk.icon+" "+kk.short+" · "+plural(d.sessions,"match")+
            (d.sessions?" · "+(Math.round(kills/d.sessions*10)/10)+" kill/match":""));
        })));
    }
    box.appendChild(renderStatMini(ms.stats));
  } else box.appendChild(h("div",{className:"muted"},"Aucun match enregistré."));

  /* Depuis la sélection — ce que valait son premier relevé, et ce qu'il vaut
     aujourd'hui. C'est la lecture que réclame une athlète retenue. */
  var cmpBase=renderBaselineCompare(squad,entry.playerId);
  if(cmpBase){
    box.appendChild(h("div",{className:"section-title"},"Depuis la sélection"));
    box.appendChild(cmpBase);
  }

  /* Évaluations, campagne par campagne */
  var perCamp=squad.campaigns.map(function(c){
    return {campaign:c,c:compileSubmissions(squad,c.id)[entry.playerId]};
  }).filter(function(x){return x.c&&x.c.n});

  box.appendChild(h("div",{className:"section-title"},"Évaluations par campagne"));
  if(!perCamp.length)box.appendChild(h("div",{className:"muted"},"Aucune évaluation reçue pour cette joueuse."));
  perCamp.forEach(function(x,i){
    var prev=i>0?perCamp[i-1]:null;
    var delta=prev?(x.c.score-prev.c.score):null;
    box.appendChild(h("div",{style:{display:"flex",alignItems:"center",gap:"10px",margin:"10px 0 6px"}},
      h("span",{className:"score-pill",style:{background:scoreColor(x.c.nRatings?x.c.score:0)+"22",color:scoreColor(x.c.nRatings?x.c.score:0)}},
        x.c.nRatings?x.c.score.toFixed(1):"—"),
      h("div",{style:{flex:"1",minWidth:"0"}},
        h("div",{style:{fontSize:"13px",fontWeight:"700",color:"#F8FAFC"}},campaignLabel(x.campaign)+
          (function(){var a=dossardsAutres(x.c,entry);
            return a.length?"  ·  "+(a.length===1?"dossard ":"dossards ")+a.join(", "):"";})()),
        h("div",{className:"psub"},(x.c.nRatings?plural(x.c.nRatings,"note"):"aucune note")+
          (x.c.n>x.c.nRatings?" · "+plural(x.c.n-x.c.nRatings,"relevé"):"")+" · "+x.c.selectors.join(", "))),

  /* Note de l'entraîneur */

  box.appendChild(h("div",{className:"btn-row",style:{marginTop:"6px"}},
    h("button",{className:"btn btn-ghost xs",onclick:function(){openModal("editplayer",p.id)}},"✏️ Fiche joueuse"),
    h("button",{className:"btn btn-danger-o xs",onclick:function(){
      openConfirm({title:"Retirer "+fullName(p)+" de la saison ?",
        body:"Elle sort de l'effectif de « "+squad.name+" » et de toutes les listes de cette saison.",
        detail:"Elle reste dans la base de joueuses, avec son historique. Rien n'est supprimé.",

        onconfirm:function(){

          /* La feuille qui portait cette fiche n'a plus d'objet : la

          if(state.modalType==="selathlete")closeModal();else render();
        }});

  return box;
}

function renderCritBars(c){

/* Depuis la sélection : la première mesure face à celle d'aujourd'hui.
   Les volumes sont rappelés parce qu'ils décident de ce qu'on peut croire :
   une efficacité tirée de six gestes n'est pas une tendance. */
function renderBaselineCompare(squad,pid){

/* D'où vient le score. Un chiffre qui décide d'une sélection doit pouvoir
   être défendu devant l'athlète et ses parents : chaque étape est donc
   montrée, avec ce qu'elle a ajouté ou retiré. */
function renderScoreBreakdown(squad,c){
  var sc=scoringOf(squad);
  var box=h("div",{className:"score-break"});
  function ligne(libelle,valeur,couleur,precision){
    return h("div",{className:"sb-row"},
      h("span",{className:"sb-lbl"},libelle),
      h("span",{className:"sb-val",style:couleur?{color:couleur}:null},valeur),
      precision?h("span",{className:"sb-note"},precision):null);
  }
  if(c.critScore!=null)
    box.appendChild(ligne("Critères",c.critScore.toFixed(2),scoreColor(c.critScore),
      pondLibelle(sc.critWeights,CRITERIA.map(function(x){return {key:x.key,label:x.label}}))));
  if(c.statScore!=null)
    box.appendChild(ligne("Statistiques",c.statScore.toFixed(2),scoreColor(c.statScore),
      Math.round(c.detail.statShare*100)+" % du score"));
  else if(Object.keys(c.statFams).length)
    box.appendChild(ligne("Statistiques","—",null,"volumes trop faibles pour être notés"));
  if(Math.abs(c.detail.severity)>=0.005)
    box.appendChild(ligne("Sévérité corrigée",fmtDelta(c.detail.severity),deltaColor(c.detail.severity),
      c.detail.severity>0?"l'évaluateur notait bas":"l'évaluateur notait haut"));
  if(Math.abs(c.detail.shrink)>=0.005)
    box.appendChild(ligne("Peu de regards",fmtDelta(c.detail.shrink),deltaColor(c.detail.shrink),
      plural(c.nRatings,"regard")+" — ramené vers "+(c.detail.reference||0).toFixed(2)));
  box.appendChild(h("div",{className:"sb-row sb-total"},
    h("span",{className:"sb-lbl"},"Score retenu"),
    h("span",{className:"sb-val",style:{color:scoreColor(c.score)}},c.score.toFixed(2)),
    null));
  return box;
}
function pondLibelle(poids,items){
  var parts=[],tous=true,ref=null;
  items.forEach(function(it){
    var w=poids[it.key];
    if(ref===null)ref=w; else if(w!==ref)tous=false;
    if(w>0&&w!==1)parts.push(it.label+" ×"+w);
    if(w===0)parts.push(it.label+" écarté");
  });
  if(tous&&ref===1)return "à poids égal";
  return parts.join(" · ")||"à poids égal";
}
/* Les familles de compteurs relevées : l'efficacité, le volume qui la
   porte, et la note qui en découle une fois située dans la campagne. */
function renderStatFamilies(c){
  var fams=FAMILY_KEYS.filter(function(f){return c.statFams[f]});
  if(!fams.length)return h("div",{className:"muted"},"Aucun compteur relevé.");

        ? h("span",{className:"badge",style:{background:scoreColor(fam.scale)+"20",color:scoreColor(fam.scale)}},fam.scale.toFixed(1))
        : h("span",{className:"badge",style:{background:"#33415530",color:"#94A3B8"}},"trop peu")));

}

function renderStatMini(stats){

/* Trancher depuis le tableau de sélection, c'est trancher dans la
   campagne active : même geste, et le statut de saison s'en déduit.

   Une athlète retenue ne rejoint plus l'équipe sur-le-champ : elle
   reçoit une OFFRE en attente, et n'entre dans l'effectif qu'une fois
   cette offre confirmée (voir « Constituer l'équipe »). C'est le seul
   changement de comportement de la v7 par rapport à la v6, et il est
   voulu : un effectif ne se remplit pas de joueuses qui n'ont pas dit
   oui. */
function setRosterStatus(squad,entry,status){
  var pid=entry.playerId;
  if(!MEMBERSHIPS[entry.membership])entry.membership="active";
  setCampaignDecision(squad,squad.activeCampaignId,pid,STATUS_TO_RECO[status]||"",state.meId||null);
  if(status!=="selected"){
    /* Écarter quelqu'un qui avait accepté demande d'archiver son offre :
       c'est le seul chemin qui la sorte de l'équipe, et il est tracé. */
    var o=currentOffer(squad,pid);
    if(o&&o.status==="accepted")declineOffer(squad,o.id,state.meId||null);
    else detachFromTeam(squad,pid);
  }
  scheduleAutoSave();
}
function detachFromTeam(team,pid){
  team.playerIds=team.playerIds.filter(function(x){return x!==pid});
  team.lineup=team.lineup.filter(function(x){return x!==pid});
  team.subteams.forEach(function(st){st.playerIds=st.playerIds.filter(function(x){return x!==pid})});
}
/* Retire une joueuse de l'équipe pour cette saison. Elle reste dans la
   base du club, et ses matchs déjà joués restent dans les sessions.

   Le geste unitaire et le retrait en lot effacent exactement la même
   chose : ils partagent ce noyau et ne se distinguent que par la ligne
   qu'ils écrivent au journal. */
function detachRosterEntry(squad,pid){
  squad.roster=squad.roster.filter(function(e){return e.playerId!==pid});
  detachFromTeam(squad,pid);
  delete squad.stats[pid];
  squad.selectorViews.forEach(function(v){
    v.playerIds=v.playerIds.filter(function(x){return x!==pid});delete v.data[pid];
  });
  /* Quitter la saison, c'est quitter toutes ses campagnes. Une
     convocation qui survit à la ligne de roster qu'elle désigne est une
     convocation orpheline — checkV7 la signale, et le récap d'une
     campagne afficherait une athlète dont la fiche de saison n'existe
     plus. Les offres encore EN ATTENTE n'engageaient personne : on les
     annule. Celles déjà tranchées restent, datées : elles ont eu lieu. */
  squad.campaignRoster=(squad.campaignRoster||[]).filter(function(e){return e.playerId!==pid});
  (squad.offers||[]).forEach(function(o){
    if(o.playerId===pid&&o.status==="pending"&&!o.voidedAt)o.voidedAt=nowISO();
  });
}
function removeFromSquad(squad,pid){
  logAct("roster",logWho(squad,pid)+" retirée de l'équipe pour cette saison",
    {teamId:squad.teamId,seasonId:squad.seasonId,playerId:pid});
  detachRosterEntry(squad,pid);
  state.expandedPlayerId=null;
  scheduleAutoSave();
}
/* Retrait en lot. Une convocation se corrige rarement athlète par
   athlète : on annule le groupe B après un tryout, ou on repart de zéro
   parce que la liste a été montée sur la mauvaise saison. Retirer
   vingt-huit fiches d'affilée, avec une confirmation à chaque ✕, n'est
   pas un geste — c'est une punition.

   Le journal n'en garde qu'une ligne, parce que ce fut un seul geste.
   Les noms y sont inscrits tant qu'ils restent lisibles ; au-delà, le
   compte prend le relais. */
function removeManyFromSquad(squad,pids){
  if(!squad||!pids||!pids.length)return 0;
  var qui=[];
  pids.forEach(function(pid){
    if(!rosterEntry(squad,pid))return;
    qui.push(logWho(squad,pid));      /* avant le retrait : le numéro en fait partie */
    detachRosterEntry(squad,pid);
  });
  if(!qui.length)return 0;
  var liste=qui.slice(0,8).join(", ")+(qui.length>8?", et "+plural(qui.length-8,"autre"):"");
  logAct("roster",(squad.roster.length?"":"Convocation vidée — ")+
    plural(qui.length,"joueuse")+(qui.length>1?" retirées":" retirée")+" de la convocation : "+liste,
    {teamId:squad.teamId,seasonId:squad.seasonId});
  state.expandedPlayerId=null;
  scheduleAutoSave();
  return qui.length;
}
/* Ce qu'un retrait emporte vraiment, compté avant de le faire. C'est la
   seule chose qui distingue une correction anodine d'une perte : une
   candidate que personne n'a vue s'efface sans conséquence, une retenue
   qui a joué douze matchs, non. */
function pertesRetrait(squad,pids){
  var out={retenues:0,compteurs:0,vues:0,matchs:0};
  if(!squad)return out;
  (pids||[]).forEach(function(pid){
    var e=rosterEntry(squad,pid);if(!e)return;
    if(e.status==="selected")out.retenues++;
    if(squad.stats[pid]&&hasStats(squad.stats[pid]))out.compteurs++;
    if(vuesDistribuees(squad,pid).length)out.vues++;
    if(playerSeasonStats(squad,pid).sessions)out.matchs++;
  });
  return out;
}
/* Le texte qu'on lit avant de retirer : ce que le geste emporte, dit
   d'avance. Le même pour un vidage complet et pour douze coches. */
function texteRetrait(squad,pids,tout){
  var d=pertesRetrait(squad,pids);
  return (tout?"Vider la convocation de « "+squad.name+" » ?"
              :"Retirer "+plural(pids.length,"joueuse")+" de « "+squad.name+" » ?")+
    (d.retenues?"\n\n• "+(d.retenues===1?"1 retenue sort":d.retenues+" retenues sortent")+" de l'effectif de la saison":"")+
    (d.matchs?"\n• "+(d.matchs===1?"1 joueuse a déjà joué":d.matchs+" joueuses ont déjà joué")+
      " cette saison — leurs matchs restent au cumul, mais leur fiche de saison s'en va":"")+
    (d.compteurs?"\n• "+(d.compteurs===1?"1 joueuse perd ses compteurs":d.compteurs+" joueuses perdent leurs compteurs")+" en cours de saisie":"")+
    (d.vues?"\n• "+(d.vues===1?"1 joueuse figure":d.vues+" joueuses figurent")+" dans une vue déjà distribuée":"")+
    "\n\nLes fiches restent dans la base du club et les matchs enregistrés ne bougent pas.";
}

/* ── La base du club : convoquer, archiver, supprimer en lot ──
   Convoquer ne touche pas aux archivées : une fiche rangée l'a été pour
   ne plus apparaître, la reprendre est un geste à part. */
function convokeMany(squad,pids){
  if(!squad)return 0;
  var n=0;
  (pids||[]).forEach(function(pid){
    var p=playerById(pid);
    if(!p||p.archived||rosterEntry(squad,pid))return;
    squad.roster.push(mkRosterEntry(pid,"",""));n++;
  });
  if(!n)return 0;
  logAct("roster",plural(n,"joueuse")+(n>1?" convoquées":" convoquée"),
    {teamId:squad.teamId,seasonId:squad.seasonId});
  scheduleAutoSave();
  return n;
}
/* Archiver est le filet de la suppression : réversible, et sans toucher
   à rien d'autre — une archivée reste dans les saisons où elle a joué. */
function setArchivedMany(pids,flag){
  var n=0;
  (pids||[]).forEach(function(pid){
    var p=playerById(pid);
    if(!p||!!p.archived===flag)return;
    p.archived=flag;n++;
  });
  if(!n)return 0;
  logAct("player",plural(n,"fiche")+(n>1?(flag?" archivées":" réactivées"):(flag?" archivée":" réactivée")),{});
  scheduleAutoSave();
  return n;
}
/* Ce qu'une suppression détruit, compté avant de la faire : on ne
   supprime pas une fiche vide comme une athlète qui a joué la saison. */
function pertesSuppression(pids){
  var out={fiches:0,noms:[],squads:0,historique:0,convoquees:0};
  var vus={};
  (pids||[]).forEach(function(pid){
    var p=playerById(pid);if(!p)return;
    out.fiches++;out.noms.push(fullName(p));
    var hist=false,convoquee=false;
    DB.squads.forEach(function(sq){
      var touche=!!rosterEntry(sq,pid);
      if(touche)convoquee=true;
      (sq.sessions||[]).forEach(function(se){
        (se.entries||[]).forEach(function(en){
          if(en.playerId===pid&&en.stats&&hasStats(en.stats)){hist=true;touche=true}
        });
      });
      (sq.submissions||[]).forEach(function(sub){
        (sub.entries||[]).forEach(function(en){
          if(en.playerId===pid){hist=true;touche=true}
        });
      });
      if(touche&&!vus[sq.id]){vus[sq.id]=true;out.squads++}
    });
    if(hist)out.historique++;
    if(convoquee)out.convoquees++;
  });
  return out;
}
/* Supprimer une athlète du club, pour de bon : la fiche, ses convocations
   dans toutes les saisons, ses lignes de match et les relevés que les
   évaluateurs ont faits d'elle.

   Ce dernier passage manquait à la suppression d'une fiche isolée, qui
   promettait pourtant que « tout son historique sera perdu » : les lignes
   de match survivaient, et le cumul de la saison continuait d'afficher
   une « Joueuse » sans nom que plus rien ne permettait d'identifier.
   Supprimer efface maintenant ce que la phrase annonçait — et pour garder
   l'historique, il y a Archiver. */
function deletePlayersFromDb(pids){
  var ids={},noms=[];
  (pids||[]).forEach(function(pid){
    var p=playerById(pid);if(!p||ids[pid])return;
    ids[pid]=true;noms.push(fullName(p));
  });
  if(!noms.length)return 0;
  DB.squads.forEach(function(sq){
    Object.keys(ids).forEach(function(pid){detachRosterEntry(sq,pid)});
    (sq.sessions||[]).forEach(function(se){
      se.entries=(se.entries||[]).filter(function(en){return !ids[en.playerId]});
    });
    (sq.submissions||[]).forEach(function(sub){
      sub.entries=(sub.entries||[]).filter(function(en){return !ids[en.playerId]});
    });
  });
  DB.players=DB.players.filter(function(p){return !ids[p.id]});
  var liste=noms.slice(0,8).join(", ")+(noms.length>8?", et "+plural(noms.length-8,"autre"):"");
  logAct("player",plural(noms.length,"fiche")+(noms.length>1?" supprimées":" supprimée")+
    " de la base : "+liste,{});
  state.expandedPlayerId=null;
  scheduleAutoSave();
  return noms.length;
}
/* Le texte qu'on lit avant de supprimer. Il nomme les fiches tant qu'on
   peut les lire, et rappelle qu'Archiver existe : c'est presque toujours
   ce qu'un club veut faire d'une athlète qui s'en va. */
function texteSuppression(pids){
  var d=pertesSuppression(pids);
  var noms=d.noms.slice(0,6).join(", ")+(d.noms.length>6?", et "+plural(d.noms.length-6,"autre"):"");
  return "Supprimer définitivement "+plural(d.fiches,"fiche")+" de la base du club ?"+
    "\n\n• "+noms+
    (d.convoquees?"\n• "+(d.convoquees===1?"1 est convoquée":d.convoquees+" sont convoquées")+
      " dans "+plural(d.squads,"équipe-saison"):"")+
    (d.historique?"\n• "+(d.historique===1?"1 a un historique":d.historique+" ont un historique")+
      " : matchs joués ou évaluations reçues, qui seront effacés eux aussi":"")+
    "\n\nRien ne se récupère. Pour conserver l'historique sans encombrer la liste, archivez plutôt.";
}

/* ── Sélection multiple ───────────────────────────────────────
   Le même geste dans les deux volets : on entre en sélection, on coche
   des lignes, une barre basse dit ce qu'on peut en faire. Les deux
   modales de lot ont disparu avec : elles demandaient un second écran
   pour choisir dans une liste qu'on avait déjà sous les yeux, en perdant
   au passage la recherche et le tri qu'on venait d'y régler. */
function pickStart(pane){state.pickMode=pane;state.picked=[];render()}
function pickStop(){state.pickMode=null;state.picked=[];render()}
function pickIsOn(pane){return state.pickMode===pane}
function pickHas(id){return state.picked.indexOf(id)!==-1}
function pickSet(ids){state.picked=(ids||[]).slice();render()}
/* Une ligne cochable. La case se met à jour sur place : un rendu complet
   à chaque coche ferait clignoter une liste de cinquante fiches, et
   cocher vite est précisément ce qu'on vient faire ici. */
function pickRow(row,id){
  var on=pickHas(id);
  var box=h("span",{className:"pick-box"+(on?" on":"")},on?"✓":"");
  if(on)row.classList.add("picked");
  row.insertBefore(box,row.firstChild);
  row.addEventListener("click",function(){
    var i=state.picked.indexOf(id);
    if(i!==-1)state.picked.splice(i,1);else state.picked.push(id);
    var now=pickHas(id);
    row.classList.toggle("picked",now);
    box.className="pick-box"+(now?" on":"");
    box.textContent=now?"✓":"";
    refreshPickUI();
  });
  return row;
}
function avertissementPick(){
  if(!state.picked.length)return "";
  var bits=[];
  if(state.pickMode==="roster"){
    var d=pertesRetrait(curSquad(),state.picked);
    if(d.retenues)bits.push(d.retenues+(d.retenues>1?" retenues":" retenue"));
    if(d.matchs)bits.push(d.matchs+" ayant déjà joué cette saison");
    if(d.compteurs)bits.push(d.compteurs+" avec des compteurs en cours de saisie");
    if(d.vues)bits.push(d.vues+" dans une vue déjà distribuée");
  } else {
    var s=pertesSuppression(state.picked);
    if(s.historique)bits.push(s.historique+" avec un historique (matchs ou évaluations)");
    if(s.convoquees)bits.push(s.convoquees+(s.convoquees>1?" convoquées":" convoquée")+
      " dans "+plural(s.squads,"équipe-saison"));
  }

/* La barre basse. Elle vit à côté du contenu défilant, comme celle de la
   saisie : on coche en haut, on agit en bas, sans jamais remonter. */
function renderPickBar(season){
  var pane=state.pickMode;
  if(pane!=="db"&&pane!=="roster")return null;
  if(pane==="roster"&&(!season||!season.roster.length))return null;
  var n=state.picked.length,acts=[];
  function act(cls,label,fn){
    return h("button",{className:"btn "+cls+" sm pick-act",disabled:!n,onclick:fn},label);
  }
  if(pane==="db"){
    if(season)acts.push(act("btn-save","📋 Convoquer",function(){
      var pids=state.picked.slice();
      var archivees=pids.filter(function(pid){var p=playerById(pid);return p&&p.archived}).length;
      var ajoutees=convokeMany(season,pids);
      pickStop();saveNow();
      showToast(ajoutees
        ? "✅ "+plural(ajoutees,"joueuse")+(ajoutees>1?" convoquées":" convoquée")+" — saisissez les numéros dans 📋 Convoquées"
        : (archivees?"⚠️ Fiches archivées : réactivez-les d'abord":"Déjà convoquées"),4000);
    }));
    acts.push(act("btn-ghost","📦 Archiver",function(){
      var n2=setArchivedMany(state.picked.slice(),true);
      pickStop();saveNow();showToast(n2?("📦 "+plural(n2,"fiche")+(n2>1?" archivées":" archivée")):"Déjà archivées");
    }));
    if(DB.players.some(function(p){return p.archived}))acts.push(act("btn-ghost","↩ Réactiver",function(){
      var n2=setArchivedMany(state.picked.slice(),false);
      pickStop();saveNow();showToast(n2?("↩ "+plural(n2,"fiche")+(n2>1?" réactivées":" réactivée")):"Déjà actives");
    }));
    acts.push(act("btn-danger-o","🗑️ Supprimer",function(){
      var pids=state.picked.slice();
      confirmAct(texteSuppression(pids),function(){
        var n2=deletePlayersFromDb(pids);
        pickStop();saveNow();
        showToast("🗑️ "+plural(n2,"fiche")+(n2>1?" supprimées":" supprimée"),{tone:"danger"});
      },{confirm:"Supprimer"});
    }));
  } else {
    acts.push(act("btn-danger-o","✕ Retirer de la convocation",function(){
      var pids=state.picked.slice();
      confirmAct(texteRetrait(season,pids,pids.length>=season.roster.length),function(){
        var n2=removeManyFromSquad(season,pids);
        pickStop();saveNow();
        showToast(season.roster.length
          ? "✅ "+plural(n2,"joueuse")+(n2>1?" retirées":" retirée")+" de la convocation"
          : "🗑️ Convocation vidée — "+plural(n2,"joueuse")+(n2>1?" retirées":" retirée"),
          {tone:"ok",action:{label:"Annuler",onclick:doUndo}});
      },{confirm:"Retirer"});
    }));
  }
  var warn=h("div",{id:"pickWarn",className:"pick-warn"});
  var t=avertissementPick();
  warn.textContent=t;if(!t)warn.style.display="none";
  return h("div",{className:"pick-bar"},
    h("div",{className:"pick-head"},
      h("span",{id:"pickCount",style:{fontSize:"13px",fontWeight:"700",color:"#F8FAFC"}},
        n?plural(n,"sélectionnée"):"Aucune sélectionnée"),
      h("span",{style:{flex:"1"}}),
      h("button",{className:"btn btn-ghost xs",onclick:pickStop},"Quitter")),
    warn,h("div",{className:"btn-row"},acts));
}

/* Constituer l'équipe d'un geste : accepter toutes les offres encore en
   attente. C'est ce que faisait l'ancien « Composer l'équipe », mais en
   passant cette fois par les offres — on ne met plus personne dans un
   effectif sans que son offre soit tranchée et datée.

   Conservé pour les appels existants ; le chemin normal est la feuille
   « Constituer l'équipe », qui laisse décider athlète par athlète. */
function promoteSelectedToTeam(squad){
  if(!squad){showToast("⚠️ Aucune équipe");return}
  var n=0;
  (squad.offers||[]).slice().forEach(function(o){
    if(o.status!=="pending"||!offerIsLive(o))return;
    acceptOffer(squad,o.id,state.meId||null);n++;
  });
  saveNow();
  showToast(n?("👕 "+plural(n,"offre")+" acceptée(s) — "+squad.name):"Aucune offre en attente",
    {tone:n?"ok":null});
  render();
}

/* ── Campagnes d'évaluation ────────────────────────────────── */
function renderCampaignsPane(squad){
  var wrap=h("div",null);
  wrap.appendChild(h("div",{className:"hint"},
    "Une ",h("b",null,"campagne")," est un moment d'évaluation daté : la sélection d'août, un point de mi-saison, le bilan de mai. ",
    "Chaque vue appartient à une campagne, et les moyennes ne se mélangent jamais de l'une à l'autre — c'est ce qui rend la progression lisible."));

  if(seasonClosed(squad))wrap.appendChild(h("div",{className:"hint warn"},
    "🔒 Saison clôturée. Les vues n'apparaissent plus côté sélectionneur et aucune nouvelle soumission n'est acceptée."));

  /* La formule appartient à la saison, comme les campagnes : c'est ici
     qu'on prépare une sélection, donc ici qu'on décide sur quoi elle se
     jouera — avant la séance, pas une fois les notes tombées. */
  wrap.appendChild(h("div",{className:"card tight",style:{marginBottom:"12px"}},
    h("div",{className:"row-between"},
      h("div",{style:{minWidth:"0"}},
        h("div",{className:"muted"},"Formule du score — cette équipe, toute la saison"),
        h("div",{style:{fontWeight:"700",color:"#F8FAFC",marginTop:"2px",fontSize:"13px",lineHeight:"1.4"}},
          formuleEnClair(scoringOf(squad)))),
      h("button",{className:"btn btn-ghost xs",style:{flexShrink:"0"},onclick:function(){
        state.modalDraft=null;openModal("scoring");
      }},"⚖️ Régler")),
    h("div",{style:{marginTop:"2px"}},lienGuide("Chaque réglage expliqué","formule"))));

  /* Dans l'ordre métier, pas dans celui des clics : une campagne créée
     après coup pour rattraper la journée 1 se lit avant la journée 2. */
  campaignOrder(squad).forEach(function(c){
    var active=c.id===squad.activeCampaignId;
    var subs=campaignSubs(squad,c.id).length;
    var views=campaignViews(squad,c.id).length;
    var pr=campaignProgress(squad,c.id);
    var open=campaignOpen(squad,c);
    var card=h("div",{className:"card"});
    card.appendChild(h("div",{className:"row-between"},
      h("div",{style:{minWidth:"0"}},
        h("div",{style:{fontSize:"16px",fontWeight:"700",color:active?"#60A5FA":"#F8FAFC"}},
          (active?"● ":"")+campaignLabel(c)+(c.closedAt?" 🔒":"")),
        h("div",{className:"muted",style:{marginTop:"3px"}},campaignProgressText(pr)),
        h("div",{className:"muted",style:{marginTop:"2px"}},
          plural(views,"vue")+" · "+plural(subs,"soumission")),
        h("div",{className:"muted",style:{marginTop:"2px"}},
          "Ouverte le "+fmtDay(c.createdAt)+(c.closedAt?" · close le "+fmtDay(c.closedAt):""))),
      h("div",{className:"btn-row"},
        !active?h("button",{className:"btn btn-primary xs",onclick:function(){
          /* Ouvrir une campagne depuis la feuille la referme : on y
             venait pour changer de moment, pas pour y rester. */
          state.modalType=null;state.modalCtx=null;
          setActiveCampaign(squad,c.id);
        }},"Ouvrir"):null,
        h("button",{className:"btn btn-ghost xs",onclick:function(){openModal("renamecampaign",c.id,c.name)}},"✏️"),
        h("button",{className:"btn btn-ghost xs",onclick:function(){
          c.closedAt=c.closedAt?null:nowISO();
          logAct("campaign","Campagne « "+c.name+" » "+(c.closedAt?"close":"rouverte"),
            {teamId:squad.teamId,seasonId:squad.seasonId});
          saveNow();showToast(c.closedAt?"🔒 Campagne close":"🔓 Campagne rouverte");render();
        }},c.closedAt?"🔓":"🔒"),
        squad.campaigns.length>1?h("button",{className:"btn btn-danger-o xs",onclick:function(){
          /* Ce qu'une campagne emporte : ses vues, ses soumissions, mais
             aussi ses CONVOCATIONS et ses OFFRES. Les laisser derrière
             ferait des convocations orphelines — checkV7 les signale — et
             des offres rattachées à une campagne qui n'existe plus, dont
             « Constituer l'équipe » ne saurait que faire. */
          var entrees=rosterOfCampaign(squad,c.id).length;
          var offres=offersOfCampaign(squad,c.id).length;
          confirmAct("Supprimer la campagne « "+c.name+" » ?\n"+
            plural(entrees,"convocation")+", "+plural(views,"vue")+", "+
            plural(subs,"soumission")+" et "+plural(offres,"offre")+" seront perdues.\n"+
            "Les athlètes entrées dans l'équipe par cette campagne en sortent — "+
            "leur fiche, leurs compteurs et leurs matchs restent intacts.",
            function(){
              squad.selectorViews=squad.selectorViews.filter(function(v){return v.campaignId!==c.id});
              squad.submissions=squad.submissions.filter(function(x){return x.campaignId!==c.id});
              squad.campaignRoster=(squad.campaignRoster||[]).filter(function(x){return x.campaignId!==c.id});
              squad.offers=(squad.offers||[]).filter(function(x){return x.campaignId!==c.id});
              squad.campaigns=squad.campaigns.filter(function(x){return x.id!==c.id});
              if(squad.activeCampaignId===c.id)squad.activeCampaignId=campaignOrder(squad)[0].id;
              /* L'effectif se relit depuis les offres qui restent : une
                 athlète dont l'offre acceptée vient de disparaître n'a
                 plus rien qui la retienne dans l'équipe. */
              squad.playerIds=(squad.playerIds||[]).filter(function(pid){
                var o=currentOffer(squad,pid);
                return !!(o&&o.status==="accepted");
              });
              (squad.subteams||[]).forEach(function(st){
                st.playerIds=(st.playerIds||[]).filter(function(pid){
                  return squad.playerIds.indexOf(pid)!==-1;});
              });
              squad.lineup=(squad.lineup||[]).filter(function(pid){
                return squad.playerIds.indexOf(pid)!==-1;});
              recomputeRosterStatus(squad);
              logAct("campaign","Campagne « "+c.name+" » supprimée — "+
                plural(entrees,"convocation")+", "+plural(subs,"soumission"),
                {teamId:squad.teamId,seasonId:squad.seasonId});
              state.evalCampaignId=squad.activeCampaignId;
              saveNow();render();
            },{confirm:"Supprimer"});
        }},"🗑️"):null)));
    if(!open&&!c.closedAt)card.appendChild(h("div",{className:"muted",style:{marginTop:"8px"}},"Saison clôturée — campagne en lecture seule."));
    wrap.appendChild(card);
  });

  wrap.appendChild(h("button",{className:"btn btn-primary full",style:{marginTop:"6px"},
    disabled:seasonClosed(squad),onclick:function(){openModal("newcampaign")}},"+ Nouvelle campagne"));
  return wrap;
}

/* ── Journal des décisions ─────────────────────────────────────
   teamId vide = tout le club (administration). Les entrées sont
   immuables : on consulte, on ne corrige pas. */
function renderLogPane(teamId){
  var wrap=h("div",null);
  wrap.appendChild(h("div",{className:"hint"},
    teamId?"Qui a tranché quoi, et quand, pour cette équipe. Utile lorsqu'une décision de sélection se rediscute après coup."
          :"Toutes les décisions du club. Les entrées ne sont ni modifiables ni supprimables."));

  /* On n'offre que les filtres qui trouvent quelque chose : une rangée de
     pastilles vides ne renseigne personne. */
  var present={};
  DB.log.forEach(function(l){
    if(teamId&&l.teamId!==teamId)return;
    if(!teamId||l.teamId)present[l.kind]=1;
  });
  var kinds=[{k:"all",l:"Tout"}].concat(Object.keys(LOG_KINDS)
    .filter(function(k){return present[k]})
    .map(function(k){return {k:k,l:LOG_KINDS[k].icon+" "+LOG_KINDS[k].label}}));
  if(!present[state.logFilter]&&state.logFilter!=="all")state.logFilter="all";
  wrap.appendChild(h("div",{className:"sub-pills",style:{marginBottom:"12px"}},kinds.map(function(f){
    var b=h("button",{className:"pill sm"+(state.logFilter===f.k?" active":""),onclick:function(){
      state.logFilter=f.k;render();
    }},f.l);
    if(state.logFilter===f.k)paintOn(b,f.k==="all"?"#2563EB":LOG_KINDS[f.k].color);
    return b;
  })));

  var rows=DB.log.filter(function(l){
    if(teamId&&l.teamId&&l.teamId!==teamId)return false;
    if(teamId&&!l.teamId)return false;
    return state.logFilter==="all"||l.kind===state.logFilter;
  }).slice().reverse();

  if(!rows.length){
    wrap.appendChild(h("div",{className:"empty"},"Aucune décision enregistrée"));
    return wrap;
  }
  /* Regroupement par jour : on relit un journal par dates, pas par lignes. */
  var lastDay="";
  rows.forEach(function(l){
    var day=fmtDay(l.at);
    if(day!==lastDay){lastDay=day;wrap.appendChild(h("div",{className:"section-title"},day))}
    var k=LOG_KINDS[l.kind]||LOG_KINDS.status;
    var t=teamId?null:(l.teamId?(teamById(l.teamId)||{}).name:null);
    wrap.appendChild(h("div",{className:"list-row"},
      h("span",{style:{fontSize:"16px",width:"24px",textAlign:"center",flexShrink:"0"}},k.icon),
      h("div",{className:"body"},
        h("div",{style:{fontSize:"13px",color:"#E2E8F0",lineHeight:"1.45"}},l.text),
        h("div",{className:"psub"},
          l.byName+(l.byRole&&ROLES[l.byRole]?" · "+ROLES[l.byRole].label.toLowerCase():"")+
          (t?" · "+t:"")+" · "+new Date(l.at).toLocaleTimeString("fr-CA",{hour:"2-digit",minute:"2-digit"})))));
  });
  wrap.appendChild(h("div",{className:"muted",style:{textAlign:"center",marginTop:"14px"}},
    plural(rows.length,"entrée")+" · les "+LOG_MAX+" dernières décisions sont conservées"));
  return wrap;
}

/* Signer, c'est ce que seul le propriétaire peut faire. */
function signClub(club){
  signDoc(charterFor(club)).then(function(sig){
    club.charter=sig;
    logAct("season","Club « "+club.name+" » charté",{});
    return verifyAll();
  }).then(function(){
    saveNow();showToast("✅ « "+club.name+" » charté");render();
  }).catch(function(err){showToast("⚠️ "+err.message)});
}
function signGrant(person,club,assignment){
  return signDoc(grantFor(person,club)).then(function(sig){
    assignment.grant=sig;
    logAct("membership",person.name+" nommée administratrice de "+club.name,{});
    return verifyAll();
  });
}

function renderPlayersTab(){
  var season=curSquad();
  var panes=[{k:"db",l:"🗂️ Base de données"},{k:"roster",l:"📋 Convoquées"},
             {k:"numbers",l:"🔢 Numérotation"}];
  var row=h("div",{className:"pill-row"},panes.map(function(p){
    var b=h("button",{className:"pill"+(state.playersPane===p.k?" active":""),onclick:function(){
      state.playersPane=p.k;state.pickMode=null;state.picked=[];render();
    }},p.l);
    if(state.playersPane===p.k)b.style.background="#2563EB";
    return b;
  }));
  /* La barre de l'athlète ne défile pas avec la série : elle vit à côté
     du contenu, comme la barre de saisie. Collée (`sticky`) dans un
     conteneur qui porte du padding, elle laissait les tuiles défiler
     dans la bande du haut — on voyait passer des demi-numéros au-dessus
     d'elle. Le volet la rend donc à part, et l'onglet la pose ici. */
  var head=null,body;
  if(state.playersPane==="roster")body=renderRosterPane(season);
  else if(state.playersPane==="numbers"){
    var np=renderNumberingPane(season);
    if(np&&np.head){head=np.head;body=np.body}else body=np;
  }
  else body=renderDbPane(season);
  /* Deux écrans sous le même volet, deux défilements : sans clé distincte,
     ouvrir la grille la rendait déjà défilée, à la hauteur où l'on avait
     laissé la liste. */
  var cle="players-"+state.playersPane+(head?"-grille":"");
  return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},row,head,
    h("div",{className:"content pad","data-scroll-key":cle},body),
    renderPickBar(season));
}

/* Ordre de la base. « Par date de naissance » se lit ici année par année :
   c'est tout ce que porte une fiche, et c'est aussi tout ce dont un club a
   besoin — une catégorie se décide sur l'année, jamais sur le jour.

   Les fiches sans année tombent en fin de liste dans les deux sens. Les
   placer en tête des plus âgées reviendrait à leur inventer un âge. */
function comparerNoms(a,b){return fullName(a).localeCompare(fullName(b),"fr")}
function sortDbPlayers(list,mode,dir){
  var out=list.slice();
  if(mode!=="birth")return out.sort(comparerNoms);
  return out.sort(function(a,b){
    var ka=birthSortKey(a),kb=birthSortKey(b);
    if((ka.y===null)!==(kb.y===null))return ka.y===null?1:-1;   /* sans naissance : en fin de liste */
    if(ka.y!==null&&ka.y!==kb.y)return dir==="young"?(kb.y-ka.y):(ka.y-kb.y);
    if(!!ka.md!==!!kb.md)return ka.md?-1:1;                     /* jour connu avant année seule */
    if(ka.md&&ka.md!==kb.md)return dir==="young"?(ka.md<kb.md?1:-1):(ka.md<kb.md?-1:1);
    return comparerNoms(a,b);
  });
}

/* Deux ordres, parce qu'on cherche deux choses : un nom qu'on connaît, ou
   une tranche d'âge qu'on compose. Le second bouton porte le sens du tri
   dans son propre libellé — cliquer dessus fait ce qu'il annonce. */
function triBase(){

    pastille("🎂 "+(state.dbSortDir==="young"?"Plus jeunes d'abord":"Plus âgées d'abord"),parAn,function(){
      if(parAn)state.dbSortDir=state.dbSortDir==="young"?"old":"young";

/* Les numéros ne sont jamais attribués par l'application : l'entraîneur les
   saisit, et les corrige ensuite dans le tableau de sélection. On se contente
   de signaler ceux qui sont déjà pris. */
function numberTaken(season,num,exceptPid){
  num=cleanNum(num);
  if(!num)return false;
  return season.roster.some(function(e){return e.number===num&&e.playerId!==exceptPid});
}

var dragPid=null;
function renderRosterPane(squad){
  if(!squad)return h("div",{className:"empty"},"Aucune saison active");
  if(!squad.roster.length)return h("div",null,
    h("div",{className:"hint"},"Aucune joueuse convoquée pour « "+squad.name+" »."),

    : h("div",{className:"hint"},
        "Le ",h("b",null,"numéro d'athlète")," est la seule information transmise aux sélectionneurs. Il doit être unique dans la saison. Glissez ☰ pour réordonner."));
  /* Défaire se fait en lot comme faire : on convoque vingt-huit athlètes
     d'un geste, on doit pouvoir en retirer douze du même. Vider, lui,
     reste à un seul bouton : c'est le geste de la liste montée sur la
     mauvaise saison, et il n'y a rien à y choisir. */
  if(picking){
    var comptes={};squad.roster.forEach(function(e){comptes[e.status]=(comptes[e.status]||0)+1});
    function lot(label,pids){
      return h("button",{className:"pill sm",onclick:function(){pickSet(pids)}},label);
    }
    wrap.appendChild(h("div",{className:"sub-pills",style:{marginBottom:"12px"}},
      lot("Toutes ("+squad.roster.length+")",squad.roster.map(function(e){return e.playerId})),
      /* Non retenues en tête : c'est le lot qu'on retire au lendemain d'un
         tryout, et le seul qu'on ne veut pas aller chercher en défilant. */
      ["cut","candidate","recalled","selected"].filter(function(st){return comptes[st]}).map(function(st){
        return lot(STATUSES[st].icon+" "+STATUSES[st].label+" ("+comptes[st]+")",

      h("button",{className:"btn btn-danger-o sm",onclick:function(){
        var pids=squad.roster.map(function(e){return e.playerId});
        confirmAct(texteRetrait(squad,pids,true),function(){
          var n=removeManyFromSquad(squad,pids);
          saveNow();render();
          showToast("🗑️ Convocation vidée — "+plural(n,"joueuse")+(n>1?" retirées":" retirée"),
            {tone:"danger",action:{label:"Annuler",onclick:doUndo}});
        },{confirm:"Vider"});
      }},"🗑️ Vider la convocation")));

  /* En sélection, la ligne n'est plus qu'une cible : ni glisser-déposer,

     renuméroter au passage. */
  if(picking){
    squad.roster.forEach(function(e){
      var p=playerById(e.playerId);if(!p)return;
      wrap.appendChild(pickRow(h("div",{className:"list-row"},
        h("span",{className:"num-badge"+(e.number&&dup[e.number]?" dup":""),
          style:{display:"inline-flex",alignItems:"center",justifyContent:"center"}},e.number||"—"),
        h("div",{className:"body"},
          h("div",{className:"pname"},fullName(p)),
          h("div",{className:"psub"},(e.position?e.position+" · ":"")+
            (STATUSES[e.status]||STATUSES.candidate).label)),

    });

    var row=h("div",{className:"list-row","data-idx":String(i),draggable:"true"});
    var handle=h("span",{className:"drag-handle"},"☰");
    row.addEventListener("dragstart",function(ev){dragPid=e.playerId;row.classList.add("dragging");ev.dataTransfer.effectAllowed="move"});
    row.addEventListener("dragend",function(){dragPid=null;row.classList.remove("dragging");document.querySelectorAll(".list-row").forEach(function(r){r.classList.remove("drag-over")})});
    row.addEventListener("dragover",function(ev){ev.preventDefault();row.classList.add("drag-over")});
    row.addEventListener("dragleave",function(){row.classList.remove("drag-over")});
    row.addEventListener("drop",function(ev){ev.preventDefault();row.classList.remove("drag-over");moveRoster(squad,dragPid,e.playerId)});
    var touchPid=null;
    handle.addEventListener("touchstart",function(){touchPid=e.playerId;row.classList.add("dragging")},{passive:true});
    handle.addEventListener("touchmove",function(ev){
      ev.preventDefault();
      var t=ev.touches[0];
      document.querySelectorAll(".list-row").forEach(function(r){r.classList.remove("drag-over")});
      var el=document.elementFromPoint(t.clientX,t.clientY);
      var pr=el&&el.closest?el.closest(".list-row"):null;if(pr)pr.classList.add("drag-over");
    },{passive:false});
    handle.addEventListener("touchend",function(ev){

          render();
        },{confirm:"Retirer"});
      }},"✕")));
    wrap.appendChild(row);
  });
  return wrap;

/* ══ NUMÉROTATION ══════════════════════════════════════════════
   Vingt-huit dossards à poser, un par un, le soir avant le tryout.
   Les taper à la main dans le tableau de sélection marche, mais on ne
   voit pas ce qui reste libre, et on se retrouve à trois reprises sur le
   même 12. Ici la série est sous les yeux : on choisit l'athlète, on
   touche un numéro, et l'écran passe à la suivante qui n'en a pas.

   Rien n'est attribué d'office : chaque numéro vient d'un doigt sur une
   tuile. C'est la règle de l'application depuis toujours, et elle tient. */
function renderNumberingPane(squad){
  if(!squad)return h("div",{className:"empty"},"Aucune saison active");
  if(!squad.roster.length)return h("div",null,
    h("div",{className:"hint"},"Aucune joueuse convoquée pour « "+squad.name+" »."),
    h("button",{className:"btn btn-primary full",onclick:function(){
      state.playersPane="db";render();
    }},"Choisir dans la base de données"));

  var serie=numberingOf(squad);
  var sans=missingNumbers(squad).length;
  var liste=squad.roster.filter(function(e){return playerById(e.playerId)});
  if(state.numPlayer&&!rosterEntry(squad,state.numPlayer))state.numPlayer=null;

  /* ── L'athlète choisie : la série remplit l'écran ─────────── */
  if(state.numPlayer){
    var e0=rosterEntry(squad,state.numPlayer),p0=playerById(state.numPlayer);
    var idx=liste.map(function(x){return x.playerId}).indexOf(state.numPlayer);
    function allerA(pid){state.numPlayer=pid;render()}
    /* La suivante sans numéro, en repartant du début si besoin : on ne
       redemande pas à l'entraîneur où il en était. */
    function suivanteSansNumero(depuis){
      for(var i=1;i<=liste.length;i++){
        var x=liste[(depuis+i)%liste.length];
        if(!x.number)return x.playerId;
      }
      return null;
    }
    var tete=h("div",{className:"num-head"},
      h("div",{className:"row-between"},
        h("button",{className:"btn btn-ghost xs",onclick:function(){
          state.numPlayer=null;render();
        }},"← Liste"),
        h("div",{className:"muted"},(liste.length-missingNumbers(squad).length)+"/"+liste.length+" numérotées")),
      h("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginTop:"8px"}},
        h("span",{className:"num-badge",style:{display:"inline-flex",alignItems:"center",
          justifyContent:"center",flexShrink:"0"}},e0.number||"—"),
        h("div",{style:{flex:"1",minWidth:"0"}},
          h("div",{className:"pname"},fullName(p0)),
          h("div",{className:"psub"},e0.number
            ?"Touchez un numéro. Le sien le retire."
            :"Touchez un numéro de la série.")),
        h("div",{className:"btn-row",style:{flexShrink:"0"}},
          h("button",{className:"btn btn-ghost xs",disabled:idx<=0,
            onclick:function(){allerA(liste[idx-1].playerId)}},"←"),
          h("button",{className:"btn btn-ghost xs",disabled:idx>=liste.length-1,
            onclick:function(){allerA(liste[idx+1].playerId)}},"→"))));

    var grille=h("div",{className:"seq-grid"});
    for(var n=serie.from;n<=serie.to;n++)(function(num){
      var t=String(num);
      var porteur=porteurDe(squad,t);
      var mien=porteur&&porteur.playerId===state.numPlayer;
      var pris=porteur&&!mien;
      var tuile=h("button",{className:"seq-tile"+(mien?" mine":"")+(pris?" taken":""),
        onclick:function(){
          if(!assignNumber(squad,state.numPlayer,t))return;
          saveNow();
          var enc=suivanteSansNumero(liste.map(function(x){return x.playerId}).indexOf(state.numPlayer));
          if(porteurDe(squad,t)&&porteurDe(squad,t).playerId===state.numPlayer&&enc)state.numPlayer=enc;
          else if(!enc&&!missingNumbers(squad).length)showToast("✅ Toutes numérotées");
          render();
        }},h("span",null,t));
      if(porteur)tuile.appendChild(h("span",{className:"who"},
        shortName(playerById(porteur.playerId))));
      grille.appendChild(tuile);
    })(n);

    var horsSerie=e0.number&&(parseInt(e0.number,10)<serie.from||parseInt(e0.number,10)>serie.to)
      ?h("div",{className:"hint warn"},"Son numéro ",h("b",null,"#"+e0.number),
        " est hors de la série ",serie.from,"–",serie.to,". Il reste valable : la série n'est qu'un jeu de chasubles.")
      :null;

    return {head:tete,body:h("div",null,horsSerie,grille,
      h("div",{className:"muted",style:{marginTop:"12px"}},
        "Série ",serie.from,"–",serie.to,". ",
        h("button",{className:"linky",onclick:function(){state.numPlayer=null;render()}},
          "Changer la série")))};
  }

  /* ── La liste : qui a quoi, et qui n'a rien ───────────────── */
  var wrap=h("div",null,
    h("div",{className:"hint"},
      "Le ",h("b",null,"numéro d'athlète")," est la seule information transmise aux évaluateurs. ",
      "Posez la série de chasubles que vous avez en main, puis touchez une athlète : ",
      "vous choisirez son numéro dans la série, et l'écran passera à la suivante."));

  /* Réglage de la série */
  var fromInp=h("input",{className:"num-badge",value:String(serie.from),
    inputmode:"numeric",maxlength:"3",style:{width:"58px"}});
  var toInp=h("input",{className:"num-badge",value:String(serie.to),
    inputmode:"numeric",maxlength:"3",style:{width:"58px"}});
  function majSerie(){
    setNumbering(squad,cleanNum(fromInp.value),cleanNum(toInp.value));
    render();
  }
  fromInp.addEventListener("blur",majSerie);
  toInp.addEventListener("blur",majSerie);
  var pris=0;
  for(var k=serie.from;k<=serie.to;k++)if(porteurDe(squad,String(k)))pris++;
  var carte=h("div",{className:"card tight",style:{marginBottom:"12px"}},
    h("div",{style:{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}},
      h("span",{style:{fontWeight:"700",color:"#F8FAFC",fontSize:"14px"}},"Série de dossards"),
      h("span",{style:{flex:"1"}}),
      h("span",{className:"muted"},"du"),fromInp,
      h("span",{className:"muted"},"au"),toInp),
    h("div",{className:"muted",style:{marginTop:"8px"}},
      plural(serie.to-serie.from+1,"numéro")+" · "+pris+" pris · "+
      Math.max(0,(serie.to-serie.from+1)-pris)+" libres"),
    h("div",{className:"btn-row",style:{marginTop:"8px"}},
      [liste.length,20,28,99].filter(function(v,i,a){return v>0&&a.indexOf(v)===i}).map(function(v){
        return h("button",{className:"btn btn-ghost xs",onclick:function(){
          setNumbering(squad,1,v);render();
        }},"1–"+v);
      })));
  wrap.appendChild(carte);

  if(sans)wrap.appendChild(h("div",{className:"hint warn"},
    plural(sans,"joueuse")+" sans numéro. ",
    h("button",{className:"linky",onclick:function(){
      var m=missingNumbers(squad)[0];
      if(m){state.numPlayer=m.playerId;render()}
    }},"Commencer par la première")));

  var filtres=[{k:"all",l:"Toutes ("+liste.length+")"},{k:"none",l:"Sans numéro ("+sans+")"}];
  wrap.appendChild(h("div",{className:"sub-pills",style:{marginBottom:"12px"}},
    filtres.map(function(f){
      var b=h("button",{className:"pill sm"+(state.numFilter===f.k?" active":""),onclick:function(){
        state.numFilter=f.k;render();
      }},f.l);
      if(state.numFilter===f.k)b.style.background="#2563EB";
      return b;
    })));

  var dup=dupNumbers(squad);
  var vues=liste.filter(function(e){return state.numFilter!=="none"||!e.number});
  if(!vues.length)wrap.appendChild(h("div",{className:"empty"},"Toutes les convoquées ont leur numéro."));
  vues.forEach(function(e){
    var p=playerById(e.playerId);
    wrap.appendChild(h("div",{className:"list-row",onclick:function(){
      state.numPlayer=e.playerId;render();
    },style:{cursor:"pointer"}},
      h("span",{className:"num-badge"+(e.number&&dup[e.number]?" dup":""),
        style:{display:"inline-flex",alignItems:"center",justifyContent:"center",
          color:e.number?"#F8FAFC":"#94A3B8"}},e.number||"—"),
      h("div",{className:"body"},
        h("div",{className:"pname"},fullName(p)),
        h("div",{className:"psub"},(e.position?e.position+" · ":"")+
          (STATUSES[e.status]||STATUSES.candidate).label+
          (e.number&&dup[e.number]?" · ⚠️ numéro en double":""))),
      h("span",{className:"muted"},"▸")));
  });
  return wrap;
}

function moveRoster(squad,fromPid,toPid){
  if(!fromPid||fromPid===toPid)return;
  var from=-1,to=-1;
  squad.roster.forEach(function(e,i){if(e.playerId===fromPid)from=i;if(e.playerId===toPid)to=i});
  if(from<0||to<0)return;
  var moved=squad.roster.splice(from,1)[0];
  squad.roster.splice(to,0,moved);
  scheduleAutoSave();render();
}

function renderCourtBar(team){
  var season=team;
  var all=teamViewPlayers(team);

/* Enregistre le match courant puis remet les compteurs à zéro.
   opts : {eventId, name, day, result}. Le second argument peut rester
   une simple chaîne — c'est alors le nom du match, rattaché à une
   rencontre créée à la volée. */
function saveSession(team,opts){
  if(typeof opts==="string")opts={name:opts};
  opts=opts||{};
  var squad=team;
  var entries=team.playerIds.map(function(pid){
    var p=playerById(pid),e=rosterEntry(squad,pid);
    return {playerId:pid,name:p?fullName(p):"",number:e?e.number:"",position:e?e.position:"",stats:clone(statsOf(team,pid))};
  }).filter(function(en){return hasStats(en.stats)});
  if(!entries.length){showToast("⚠️ Aucune statistique à enregistrer");return false}

  var ev=opts.eventId?eventById(squad,opts.eventId):null;
  if(!ev){
    ev=mkEvent({kind:opts.kind||"league",
      name:opts.eventName||opts.name||"Rencontre",
      opponent:opts.opponent||guessOpponent(opts.name||""),
      date:opts.day||todayISO(),location:opts.location||""});
    squad.events.push(ev);
  }
  var day=opts.day||ev.date||todayISO();
  var nom=opts.name||ev.name||"Match";
  var adv=opts.opponent||(opts.eventId?"":ev.opponent)||"";
  team.sessions.unshift({id:uid(),name:nom,
    date:nowISO(),          // horodatage de la saisie, conservé pour l'ordre
    day:day,                // date réelle de la rencontre, saisissable
    opponent:adv,           // propre au match : un tournoi en change à chaque tour
    eventId:ev.id,teamName:team.name,
    result:opts.result&&opts.result.sets?opts.result:mkResult(),
    entries:entries});
  team.stats={};
  var k=EVENT_KINDS[ev.kind]||EVENT_KINDS.league;
  logAct("match",k.label+" « "+nom+" »"+
    (adv?" contre "+adv:"")+
    (hasResult(opts.result)?" — "+resultLabel(opts.result):"")+
    " · "+plural(entries.length,"joueuse"),
    {teamId:squad.teamId,seasonId:squad.seasonId});
  clearUndo();saveNow();
  return true;
}

function renderSummaryTab(){
  var season=curSquad(),team=season;
  if(!season||!team)return emptyBlock("📊","Aucune équipe","Créez une saison et une équipe.",null);
  var modes=[
    {k:"session",l:"📋 Match",c:"#3B82F6"},
    {k:"global",l:"🌐 Cumul",c:"#8B5CF6"},
    {k:"evals",l:"⭐ Évaluations",c:"#F59E0B"},
    {k:"sessions",l:"🏐 Rencontres",c:"#10B981"}
  ];
  var modeRow=h("div",{className:"pill-row tight"},modes.map(function(m){
    var b=h("button",{className:"pill"+(state.summaryMode===m.k?" active":""),onclick:function(){
      if(m.k==="global"&&!team.sessions.length){showToast("Aucune session enregistrée");return}
      state.summaryMode=m.k;state.sortBy=null;render();
    }},m.l);
    if(state.summaryMode===m.k)paintOn(b,m.c);
    return b;
  }));
  if(state.summaryMode==="sessions")
    return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},modeRow,
      h("div",{className:"content pad","data-scroll-key":"sessions"},renderSessionsPane(team)));

      h("div",{className:"content pad","data-scroll-key":"evals"},renderEvalsPane(season)));
  return renderStatsTable(team,modeRow);

function renderStatsTable(team,modeRow){
  var isG=state.summaryMode==="global";
  var players=isG?computeGlobalPlayers(team):teamViewPlayers(team);
  var view=VIEWS[state.viewIdx],gKeys=view.groups,gk=gKeys[state.groupIdx]||gKeys[0],g=SG[gk];
  var filtered=filterPos(players);

  /* En mode « par match », on divise par le nombre de matchs de la joueuse :
     comparer 1 match et 8 matchs sur des totaux bruts n'a pas de sens. */
  function val(p,k){
    var raw=p.stats[k]||0;
    if(state.cumulMode!=="avg"||!isG)return raw;
    var n=p.sessCount||1;
    return raw/n;
  }
  function fmtVal(v){
    if(state.cumulMode!=="avg"||!isG)return String(Math.round(v));
    return (Math.round(v*10)/10).toFixed(1);
  }
  function getT(p){return g.stats.reduce(function(s,st){return s+val(p,st.key)},0)}
  function getPct(p,k){var t=getT(p);return t>0?Math.round((val(p,k)/t)*100):0}
  var sorted=filtered.slice();
  if(state.sortBy)sorted.sort(function(a,b){
    var d=val(b,state.sortBy)-val(a,state.sortBy);
    return state.sortDir==="desc"?d:-d;
  });

  var viewRow=h("div",{className:"pill-row"},VIEWS.map(function(v,i){
    var b=h("button",{className:"pill"+(i===state.viewIdx?" active":""),onclick:function(){
      state.viewIdx=i;state.groupIdx=0;state.sortBy=null;saveNow();render();
    }},v.label);
    if(i===state.viewIdx)b.style.background="#F59E0B";
    return b;
  }));
  var filterBar=h("div",{className:"filter-bar"},renderPosFilter(),
    gKeys.length>1?h("div",{className:"sub-pills"},gKeys.map(function(k,i){
      var b=h("button",{className:"pill sm"+(state.groupIdx===i?" active":""),onclick:function(){state.groupIdx=i;state.sortBy=null;render()}},SG[k].name);
      if(state.groupIdx===i)paintOn(b,SG[k].color);
      return b;
    })):null);

  var thead=h("tr",null,
    h("th",{className:"sticky",style:{textAlign:"left",color:"#94A3B8",fontWeight:"600"}},"Joueuse"),
    g.stats.map(function(s){
      return h("th",{className:"sortable",style:{textAlign:"center",color:g.color,fontWeight:"700",whiteSpace:"nowrap"},onclick:function(){
        if(state.sortBy===s.key)state.sortDir=state.sortDir==="desc"?"asc":"desc";
        else{state.sortBy=s.key;state.sortDir="desc"}
        render();
      }},s.label+(state.sortBy===s.key?(state.sortDir==="desc"?" ▼":" ▲"):""));
    }),
    h("th",{style:{textAlign:"center",color:"#F59E0B",fontWeight:"700"}},"Total"));

  var tbody=sorted.length?sorted.map(function(p){
    return h("tr",{style:{borderBottom:"1px solid #1E293B"}},
      h("td",{className:"sticky",style:{padding:"10px",fontWeight:"600",color:"#F8FAFC",background:"#0F172A",whiteSpace:"nowrap",textAlign:"left"}},
        (p.number?"#"+p.number+" ":"")+p.name,
        h("div",{style:{fontSize:"10px",color:"#94A3B8",fontWeight:"400"}},
          (p.position||"—")+(isG&&p.sessCount?" · "+plural(p.sessCount,"session"):""))),
      g.stats.map(function(s){
        return h("td",null,h("div",{className:"sum-val"},fmtVal(val(p,s.key))),h("div",{className:"sum-pct"},getPct(p,s.key)+"%"));
      }),
      h("td",null,h("div",{className:"sum-val",style:{color:"#F59E0B"}},fmtVal(getT(p)))));
  }):[h("tr",null,h("td",{colspan:String(g.stats.length+2),style:{padding:"30px",textAlign:"center",color:"#94A3B8"}},
    isG?"Aucune donnée cumulée":"Aucune statistique saisie"))];

  var totals=h("div",{className:"totals-bar"},g.stats.map(function(s){
    var t=filtered.reduce(function(sum,p){return sum+val(p,s.key)},0);
    return h("div",{style:{textAlign:"center"}},h("div",{className:"t-lbl"},s.label),
      h("div",{className:"t-val",style:{color:g.color}},fmtVal(t)));
  }));
  var info=null;
  if(isG){
    var used=scopedSessions(team).length;
    var natures=[{k:"all",l:"Toutes"}].concat(EVENT_KEYS.filter(function(k){
      return team.sessions.some(function(se){var ev=eventOf(team,se);return ev&&ev.kind===k});
    }).map(function(k){return {k:k,l:EVENT_KINDS[k].icon+" "+EVENT_KINDS[k].short}}));

    info=h("div",null,
      /* Nature de rencontre — la lecture que le bilan de fin de saison réclamait */
      natures.length>1?h("div",{className:"sub-pills",style:{padding:"0 12px 4px"}},natures.map(function(f){
        var on=!state.cumulEventId&&state.cumulKind===f.k;
        var b=h("button",{className:"pill sm"+(on?" active":""),onclick:function(){
          state.cumulKind=f.k;state.cumulEventId=null;state.sortBy=null;render();
        }},f.l);
        if(on)paintOn(b,f.k==="all"?"#6D28D9":EVENT_KINDS[f.k].color);
        return b;
      })):null,
      /* Combien de matchs, et sous quelle échelle */
      h("div",{className:"sub-pills",style:{padding:"0 12px 4px"}},
        CUMUL_SCOPES.map(function(sc){
          var b=h("button",{className:"pill sm"+(state.cumulScope===sc.k?" active":""),onclick:function(){
            state.cumulScope=sc.k;state.sortBy=null;render();
          }},sc.l);
          if(state.cumulScope===sc.k)b.style.background="#475569";
          return b;
        }).concat([
          h("button",{className:"pill sm"+(state.cumulMode==="avg"?" active":""),
            style:state.cumulMode==="avg"?{background:"#0EA5E9"}:{},onclick:function(){
              state.cumulMode=state.cumulMode==="avg"?"total":"avg";state.sortBy=null;render();
            }},state.cumulMode==="avg"?"÷ Par match":"Σ Totaux")
        ])),
      state.cumulEventId?h("div",{style:{padding:"0 12px 4px"}},
        h("button",{className:"pill sm active",style:{background:"#F59E0B"},onclick:function(){
          state.cumulEventId=null;state.sortBy=null;render();
        }},"✕ "+cumulScopeLabel(team))):null,
      h("div",{className:"sess-count"},
        (state.cumulMode==="avg"?"Moyenne par match sur ":"Cumulé sur ")+plural(used,"match")+
        (used<team.sessions.length?(" sur "+team.sessions.length):"")+" · "+cumulScopeLabel(team)));
  }

  return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},
    modeRow,viewRow,filterBar,info,
    h("div",{className:"content",style:{overflowX:"auto"},"data-scroll-key":"summary-scroll"},
      h("table",{className:"sum-table"},h("thead",null,thead),h("tbody",null,tbody))),
    totals);
}

/* ── Évaluations compilées (vue entraîneur) ──────────────────
   Filtrées par campagne : c'est la correction du constat A1. */
function renderEvalsPane(squad){
  /* Sans soumission, l'écran n'a pas de classement à montrer — mais la
     formule, elle, se règle avant la séance et non après. La laisser
     derrière la première soumission obligeait à découvrir le calcul une
     fois les notes tombées, c'est-à-dire trop tard. */
  if(!squad.submissions.length)return h("div",null,
    h("div",{className:"hint"},"Aucune évaluation reçue. Créez une vue sélectionneur dans l'onglet 🎯 Sélection, faites-la remplir, puis soumettez-la."),
    h("button",{className:"btn btn-primary full",onclick:function(){state.tab="selection";state.selectionPane="views";render()}},"🎯 Créer une vue sélectionneur"),
    h("div",{className:"section-title"},"Formule du score"),
    h("div",{className:"muted",style:{marginBottom:"8px"}},
      formuleEnClair(scoringOf(squad))+" Réglez-la maintenant, avant la séance : "+
      "elle vaut pour cette équipe, sur toute la saison, et pour chacune de ses campagnes."),
    h("div",{className:"btn-row"},
      h("button",{className:"btn btn-ghost sm",onclick:function(){state.modalDraft=null;openModal("scoring")}},"⚖️ Régler la formule")),
    h("div",{style:{marginTop:"4px"}},lienGuide("Comment se calcule le score","formule")));

  var withSubs=squad.campaigns.filter(function(c){return campaignSubs(squad,c.id).length});
  if(state.evalCampaignId&&!campaignById(squad,state.evalCampaignId))state.evalCampaignId=null;
  if(state.evalCampaignId===null&&withSubs.length)state.evalCampaignId=(curCampaign(squad)&&campaignSubs(squad,curCampaign(squad).id).length)
    ?curCampaign(squad).id:withSubs[withSubs.length-1].id;

  var wrap=h("div",null);

  /* Sélecteur de campagne */
  var campRow=h("div",{className:"sub-pills",style:{marginBottom:"10px",paddingBottom:"2px"}},
    withSubs.map(function(c){
      var b=h("button",{className:"pill sm"+(state.evalCampaignId===c.id?" active":""),onclick:function(){
        state.evalCampaignId=c.id;state.expandedPlayerId=null;render();
      }},campaignLabel(c)+" ("+campaignSubs(squad,c.id).length+")");
      if(state.evalCampaignId===c.id)b.style.background="#F59E0B";
      return b;
    }),

/* ── Progression entre deux campagnes ───────────────────────── */
function renderProgressPane(squad,withSubs,wrap){
  if(!campaignById(squad,state.progressFrom)||!campaignSubs(squad,state.progressFrom).length)
    state.progressFrom=withSubs[0].id;
  if(!campaignById(squad,state.progressTo)||!campaignSubs(squad,state.progressTo).length||state.progressTo===state.progressFrom)
    state.progressTo=withSubs[withSubs.length-1].id;

  function picker(label,key){
    var sel=h("select",{className:"txt"},withSubs.map(function(c){return h("option",{value:c.id},campaignLabel(c))}));
    sel.value=state[key];
    sel.addEventListener("change",function(e){state[key]=e.target.value;render()});
    return h("div",{className:"field"},h("label",null,label),sel);
  }
  wrap.appendChild(h("div",{className:"hint"},"Comparaison de deux campagnes, critère par critère. Une joueuse n'apparaît avec un écart que si elle a été évaluée dans les deux."));
  wrap.appendChild(h("div",{className:"grid2"},picker("De","progressFrom"),picker("À","progressTo")));

  var from=campaignById(squad,state.progressFrom),to=campaignById(squad,state.progressTo);
  if(state.progressFrom===state.progressTo){
    wrap.appendChild(h("div",{className:"empty"},"Choisissez deux campagnes différentes"));
    return wrap;
  }
  var rows=compareCampaigns(squad,state.progressFrom,state.progressTo);
  if(!rows.length){wrap.appendChild(h("div",{className:"empty"},"Aucune donnée à comparer"));return wrap}

  wrap.appendChild(h("div",{className:"btn-row",style:{margin:"4px 0 12px"}},
    h("button",{className:"btn btn-export sm",onclick:function(){exportProgressCSV(squad,rows,from,to)}},"📤 Exporter (CSV)")));

  rows.forEach(function(r){
    var p=playerById(r.playerId),e=rosterEntry(squad,r.playerId);
    var open=state.expandedPlayerId===r.playerId;
    wrap.appendChild(h("div",{className:"compile-row",onclick:function(){
      state.expandedPlayerId=open?null:r.playerId;render();
    }},
      h("span",{className:"score-pill",style:{background:deltaColor(r.delta)+"22",color:deltaColor(r.delta)}},fmtDelta(r.delta)),
      h("div",{style:{flex:"1",minWidth:"0"}},
        h("div",{className:"pname"},(e&&e.number?"#"+e.number+" ":"")+fullName(p)),
        h("div",{className:"psub"},
          (r.from!=null?r.from.toFixed(1):"—")+" → "+(r.to!=null?r.to.toFixed(1):"—")+
          (r.delta==null?" · "+missingWhy(squad,r,from,to):""))),
      h("span",{style:{color:"#94A3B8"}},open?"▲":"▼")));
    if(!open)return;
    var box=h("div",{className:"card"});
    CRITERIA.forEach(function(cr){
      var d=r.criteria[cr.key];
      box.appendChild(h("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"6px"}},
        h("span",{style:{fontSize:"12px",color:"#94A3B8",width:"104px",flexShrink:"0"}},cr.label),
        h("span",{style:{fontSize:"12px",color:"#94A3B8",flex:"1"}},
          (d.from!=null?d.from.toFixed(1):"—")+" → "+(d.to!=null?d.to.toFixed(1):"—")),
        h("span",{style:{fontSize:"12px",fontWeight:"800",color:deltaColor(d.delta),width:"48px",textAlign:"right"}},fmtDelta(d.delta))));
    });
    wrap.appendChild(box);
  });
  return wrap;
}
/* Un tiret n'explique rien. On dit laquelle des deux campagnes manque, et
   si la joueuse était simplement absente du club à ce moment-là. */
function missingWhy(squad,row,from,to){
  var e=rosterEntry(squad,row.playerId);
  var manque=(row.from==null)?from:to;
  var base="pas d'évaluation en « "+(manque?manque.name:"?")+" »";
  if(!e)return base;
  if(row.from==null&&e.status==="candidate")return base+" (arrivée après)";
  if(row.to==null&&e.status==="cut")return base+" (écartée avant)";
  if(row.to==null&&e.membership==="left")return base+" (partie en cours de saison)";
  return base;
}
function exportProgressCSV(squad,rows,from,to){
  var head=["Numero","Joueuse",from.name+"_score",to.name+"_score","Delta"]
    .concat(CRITERIA.map(function(c){return "Delta_"+c.label}));
  var lines=[head.join(";")];
  rows.forEach(function(r){
    var p=playerById(r.playerId),e=rosterEntry(squad,r.playerId);
    lines.push([(e&&e.number)||"",fullName(p).replace(/;/g,","),
      r.from!=null?r.from.toFixed(2):"",r.to!=null?r.to.toFixed(2):"",
      r.delta!=null?r.delta.toFixed(2):""]
      .concat(CRITERIA.map(function(c){var d=r.criteria[c.key].delta;return d!=null?d.toFixed(2):""})).join(";"));
  });
  downloadCSV(lines,"Progression_"+safeName(squad.name)+"_"+stamp()+".csv");
}
function countSelectors(squad,campaignId){
  var m={};
  campaignSubs(squad,campaignId).forEach(function(sub){m[(sub.selectorName||sub.viewName||"?").trim()]=1});
  return Object.keys(m).length;
}
function downloadCSV(lines,filename){
  try{
    var blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
    var u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download=filename;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u)},1000);
    showToast("📤 CSV exporté");
  }catch(e){showToast("⚠️ Export impossible")}
}
function exportEvalsCSV(squad,rows,camp){
  /* Les colonnes suivent l'ordre de lecture : ce qui identifie, ce qui
     décide, puis la matière brute. Les colonnes de score sont explicitées
     — un tableur qui recalculerait la moyenne des critères ne retrouverait
     pas le score, puisque celui-ci porte aussi les statistiques, la
     sévérité corrigée et l'amortissement. */
  var head=["Campagne","Numero","Dossard_campagne","Joueuse","Position","Statut","Effectif",
            "Saisies","Notes","Avis","Score","Score_criteres","Score_stats",
            "Corr_severite","Corr_fiabilite","Part_stats"]
    .concat(CRITERIA.map(function(c){return c.label}))
    .concat(["Retenir","Recaller","Non_retenue"])
    .concat(["Poste_propose","Poste_votes"])
    .concat(FAMILY_KEYS.map(function(f){return "Eff_"+f}))
    .concat(ALL_STATS.map(function(st){return st.key}));
  var lines=[head.join(";")];
  rows.forEach(function(c){
    var p=playerById(c.playerId),e=rosterEntry(squad,c.playerId);
    lines.push([camp?camp.name:"toutes",(e&&e.number)||"",
      dossardsAutres(c,e).join("|"),fullName(p).replace(/;/g,","),
      (e&&e.position)||"",(e&&STATUSES[e.status].label)||"",
      (e&&e.status==="selected"&&MEMBERSHIPS[e.membership])?MEMBERSHIPS[e.membership].label:"",
      c.n,c.nRatings,c.nReco,
      c.nRatings||c.statScore!=null?c.score.toFixed(2):"",
      c.critScore!=null?c.critScore.toFixed(2):"",
      c.statScore!=null?c.statScore.toFixed(2):"",
      c.detail.severity.toFixed(2),c.detail.shrink.toFixed(2),
      c.detail.statShare]
      .concat(CRITERIA.map(function(cr){var x=c.ratings[cr.key];return x&&x.n?x.avg.toFixed(2):""}))
      .concat([c.reco.select||0,c.reco.recall||0,c.reco.cut||0])
      .concat([c.topPos||"",c.topPos?(c.pos[c.topPos]+"/"+c.posVotes):""])
      .concat(FAMILY_KEYS.map(function(f){
        var fam=c.statFams[f];return fam&&fam.eff!=null?fam.eff.toFixed(3):"";}))
      .concat(ALL_STATS.map(function(st){return c.stats[st.key]||0})).join(";"));
  });
  downloadCSV(lines,"Evaluations_"+safeName(squad.name)+"_"+safeName(camp?camp.name:"toutes")+"_"+stamp()+".csv");
}

/* ── Rencontres ────────────────────────────────────────────── */
/* Adversaires d'une rencontre : un seul match → « contre X » ; un tournoi →
   la liste, tronquée au-delà de trois, car n'en montrer qu'un serait faux. */
/* Nom d'un match tel qu'il s'affiche sous sa rencontre : on retire le nom de
   la rencontre quand la ligne le répète mot pour mot. */
function matchLabel(ev,se){
  var nom=se.name||"Match",pre=(ev.name||"")+" · ";
  if(ev.name&&nom.indexOf(pre)===0){
    var reste=nom.slice(pre.length).trim();
    if(reste)return reste.charAt(0).toUpperCase()+reste.slice(1);
  }
  return nom;
}

function advLabel(g){
  var vus=[],ev=g.event;
  g.sessions.forEach(function(se){
    var a=se.opponent||"";
    if(a&&vus.indexOf(a)===-1)vus.push(a);
  });
  if(!vus.length&&ev.opponent)vus=[ev.opponent];
  if(!vus.length)return null;
  if(vus.length===1)return "contre "+vus[0];
  if(vus.length<=3)return "contre "+vus.join(", ");
  return "contre "+vus.slice(0,3).join(", ")+" +"+(vus.length-3);
}

function renderSessionsPane(squad,opts){

  if(!groupes.length)wrap.appendChild(h("div",{className:"empty"},
    "Aucun match. Saisissez une rencontre puis « 💾 Enregistrer le match »."));

  groupes.forEach(function(g){

          [k.label,advLabel(g),fmtShortDay(ev.date),ev.location||null]
            .filter(Boolean).join(" · "))),

        h("button",{className:"btn btn-ghost xs",onclick:function(){
          state.modalDraft=null;openModal("editevent",ev.id);
        }},"✏️"),
        h("button",{className:"btn btn-ghost xs",title:"Ne cumuler que cette rencontre",onclick:function(){
          state.cumulEventId=ev.id;state.summaryMode="global";state.sortBy=null;render();
        }},"📊")));
    head.style.borderLeftColor=k.color;
    card.appendChild(head);

    if(g.sessions.length>1){
      var b=g.bilan;
      card.appendChild(h("div",{className:"ev-sub",style:{padding:"0 14px 8px"}},
        plural(g.sessions.length,"match")+
        ((b.win||b.loss)?" · "+(b.win||0)+"V–"+(b.loss||0)+"D":"")));
    }

    g.sessions.forEach(function(se){
      var o=resultOutcome(se.result),jourDeMatch=se.day||dayOf(se.date);
      var actions=h("div",{className:"btn-row"},
        h("button",{className:"btn btn-primary xs",onclick:function(){

            pushUndoStats("Chargement de « "+se.name+" »");

            navTo(mkRoute("legacy","input"));
            showToast("📂 « "+se.name+" » chargée",{tone:"ok"});
          }
          var enCours=Object.keys(squad.stats).some(function(pid){return hasStats(squad.stats[pid])});

          confirmAct("La saisie en cours sera remplacée par « "+se.name+" ».\nContinuer ?",

          onclick:function(){state.modalDraft=null;openModal("editresult",se.id)}},
          hasResult(se.result)?resultLabel(se.result):"—"),
        h("div",{className:"grow"},
          h("div",{style:{fontSize:"13px",fontWeight:"600",color:"#E2E8F0"}},matchLabel(ev,se)),
          h("div",{className:"ev-sub"},[se.opponent?"contre "+se.opponent:null,
            jourDeMatch===ev.date?null:fmtShortDay(jourDeMatch),

  wrap.appendChild(h("div",{className:"data-actions"},
    h("button",{className:"btn btn-export sm",onclick:exportMyTeam},"📤 Exporter mon équipe")));
