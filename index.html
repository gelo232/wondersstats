<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WonderStats">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon.png">
<meta name="theme-color" content="#1E3A5F">
<title>WonderStats</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0F172A;color:#E2E8F0}
button,input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden;background:#0F172A}
@media(min-width:600px){#app{max-width:700px}}
@media(min-width:900px){#app{max-width:1040px}}

/* ── HEADER ───────────────────────────────────────── */
.header{background:linear-gradient(135deg,#1E3A5F,#0F172A);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #334155;flex-shrink:0;padding-top:max(12px,env(safe-area-inset-top));gap:8px}
@media(min-width:600px){.header{padding:16px 24px}}
.header h1{margin:0;font-size:16px;font-weight:700;color:#F8FAFC;letter-spacing:.3px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:600px){.header h1{font-size:20px}}
.header-side{min-width:84px;display:flex;gap:4px;flex-shrink:0}
.header-side.right{justify-content:flex-end}
.role-badge{padding:4px 9px;border-radius:14px;font-size:10px;font-weight:800;border:1.5px solid;cursor:pointer;white-space:nowrap;background:transparent;letter-spacing:.4px}
.role-badge.coach{border-color:#60A5FA;color:#60A5FA}
.role-badge.selector{border-color:#F59E0B;color:#F59E0B}

/* ── CONTEXT BARS ─────────────────────────────────── */
.ctx-bar{background:#162032;border-bottom:1px solid #1E293B;padding:7px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;font-size:12px;color:#94A3B8}
.ctx-bar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-bar button{background:transparent;border:none;color:inherit;font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;min-width:0}
.team-bar{background:#162032;border-bottom:1px solid #1E293B;padding:6px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;overflow-x:auto}
.team-chip{padding:5px 12px;border-radius:16px;border:1.5px solid #334155;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;background:transparent;color:#94A3B8;transition:all .15s}
.team-chip.active{background:#3B82F6;border-color:#60A5FA;color:#fff}
.team-chip.add{border-style:dashed;color:#64748B}

/* ── TABS ─────────────────────────────────────────── */
.tab-bar{display:flex;background:#1E293B;border-top:1px solid #334155;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;padding:10px 2px 8px;border:none;background:none;cursor:pointer;color:#94A3B8;font-weight:400;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid transparent;transition:all .2s;min-width:0}
.tab-btn.active{color:#60A5FA;font-weight:700;border-top-color:#60A5FA}
.tab-btn.sel.active{color:#F59E0B;border-top-color:#F59E0B}
.tab-btn .ico{font-size:17px}
.tab-btn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media(min-width:600px){.tab-btn{padding:14px 4px 12px;font-size:13px}.tab-btn .ico{font-size:22px}}

/* ── BUTTONS ──────────────────────────────────────── */
.btn{padding:10px 18px;border-radius:8px;border:none;font-weight:600;font-size:14px;cursor:pointer;transition:all .15s}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.xs{padding:4px 8px;font-size:11px}
.btn.full{width:100%}
.btn-primary{background:#3B82F6;color:#fff}
.btn-save{background:#10B981;color:#fff}
.btn-warn{background:#F59E0B;color:#0F172A}
.btn-danger-o{background:transparent;border:1.5px solid #EF4444;color:#EF4444}
.btn-ghost{background:transparent;border:1.5px solid #94A3B8;color:#94A3B8}
.btn-export{background:transparent;border:1.5px solid #F59E0B;color:#F59E0B}
.btn-import{background:transparent;border:1.5px solid #8B5CF6;color:#8B5CF6}
.btn-undo{background:transparent;border:1.5px solid #60A5FA;color:#60A5FA}
.btn:disabled{background:#475569;color:#94A3B8;cursor:default;border-color:#475569;opacity:.7}

/* ── PILLS / FILTERS ──────────────────────────────── */
.pill-row{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#0F172A;border-bottom:1px solid #1E293B;flex-shrink:0}
/* Rangée d'onglets principale : quatre entrées doivent tenir sans défilement,
   sinon la dernière passe inaperçue. */
.pill-row.tight{gap:4px;padding-left:8px;padding-right:8px}
.pill-row.tight .pill{padding:9px 10px;font-size:12px}
@media(min-width:430px){.pill-row.tight .pill{padding:10px 14px;font-size:13px}}
@media(min-width:600px){.pill-row{padding:12px 16px;justify-content:center}}
.pill{padding:7px 14px;border-radius:20px;border:none;white-space:nowrap;font-weight:600;font-size:12px;cursor:pointer;transition:all .15s;background:#1E293B;color:#94A3B8}
.pill.sm{padding:5px 10px;font-size:11px}
@media(min-width:600px){.pill{padding:9px 18px;font-size:14px}}
.pill.active{color:#fff}
.filter-bar{padding:6px 12px;background:#0F172A;border-bottom:1px solid #1E293B;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
@media(min-width:600px){.filter-bar{padding:8px 16px;flex-direction:row;align-items:center;justify-content:center;flex-wrap:wrap}}
.pos-row{display:flex;gap:4px;overflow-x:auto}
@media(min-width:600px){.pos-row{gap:6px}}
.sub-pills{display:flex;gap:5px;overflow-x:auto}
@media(min-width:600px){.sub-pills{justify-content:center}}

/* ── LAYOUT ───────────────────────────────────────── */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:14px 12px}
@media(min-width:600px){.pad{padding:20px 24px}}
.card{background:#1E293B;border-radius:12px;padding:14px;border:1px solid #334155;margin-bottom:10px}
.card.tight{padding:10px 12px}
.section-title{font-size:11px;font-weight:800;color:#64748B;letter-spacing:.8px;text-transform:uppercase;margin:18px 0 8px}
.section-title:first-child{margin-top:0}
.muted{color:#64748B;font-size:12px}
.empty{padding:40px 20px;text-align:center;color:#64748B;font-size:13px}
/* Écran de garde : verrouillage et inscription */
.gate{display:flex;flex-direction:column;justify-content:center;min-height:100%;padding:28px 22px;gap:14px;overflow-y:auto}
.gate-logo{font-size:44px;text-align:center;line-height:1}
.gate h1{font-size:21px;font-weight:700;color:#F1F5F9;text-align:center;margin:0}
.gate .sub{font-size:13px;color:#94A3B8;text-align:center;line-height:1.5;margin:0}
.gate .card{background:#1E293B;border:1px solid #334155;border-radius:12px;padding:16px}
.gate .card h2{font-size:15px;font-weight:700;color:#E2E8F0;margin:0 0 4px}
.gate .card p{font-size:12.5px;color:#94A3B8;margin:0 0 12px;line-height:1.5}
.gate input{width:100%;padding:13px 12px;font-size:16px;border-radius:9px;
  border:1px solid #334155;background:#0F172A;color:#F1F5F9;box-sizing:border-box}
.gate input:focus{outline:none;border-color:#3B82F6}
.gate .err{color:#F87171;font-size:12.5px;text-align:center;min-height:16px}
.gate .note{background:#0F172A;border:1px solid #334155;border-left:3px solid #F59E0B;
  border-radius:8px;padding:11px 13px;font-size:12px;color:#CBD5E1;line-height:1.55}
.gate .note b{color:#F1F5F9}
.gate .full{width:100%;padding:14px;font-size:15px}
.linky{background:none;border:none;color:#60A5FA;font-size:12.5px;
  cursor:pointer;padding:6px;text-decoration:underline}
.strength{height:4px;border-radius:2px;background:#334155;overflow:hidden;margin-top:7px}
/* Assistant de mise en place du relais */
.steps{counter-reset:st;margin:0;padding:0;list-style:none}
.steps li{counter-increment:st;position:relative;padding:0 0 13px 30px;font-size:12.5px;
  color:#CBD5E1;line-height:1.55}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:20px;height:20px;
  border-radius:50%;background:#3B82F6;color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.steps li b{color:#F1F5F9}
.steps code{background:#0F172A;border:1px solid #334155;border-radius:4px;padding:1px 5px;
  font-size:11px;word-break:break-all}
.warnbox{background:#3B1D0E;border:1px solid #7C3D12;border-radius:8px;padding:10px 12px;
  font-size:12px;color:#FCD9B6;line-height:1.5;margin-top:10px}
.warnbox b{color:#FDBA74}
.okbox{background:#0C2A20;border:1px solid #15503C;border-radius:8px;padding:10px 12px;
  font-size:12px;color:#A7F3D0;line-height:1.5}
.strength i{display:block;height:100%;transition:width .2s,background .2s}
.hint{background:rgba(59,130,246,.08);border:1px solid rgba(96,165,250,.25);border-radius:10px;padding:10px 12px;font-size:12px;color:#93C5FD;line-height:1.5;margin-bottom:12px}
.hint.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3);color:#FCD34D}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:600px){.grid2{grid-template-columns:1fr 1fr}}

/* ── FORM ─────────────────────────────────────────── */
.txt{width:100%;background:#0F172A;border:1px solid #334155;border-radius:8px;padding:10px 12px;color:#F8FAFC;font-size:14px;outline:none}
.txt:focus{border-color:#60A5FA}
.txt.err{border-color:#EF4444}
textarea.txt{resize:vertical;min-height:64px;line-height:1.5}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:700;color:#64748B;margin-bottom:4px;letter-spacing:.4px}

/* ── PLAYER / ROSTER ROWS ─────────────────────────── */
.list-row{display:flex;gap:10px;align-items:center;background:#1E293B;border-radius:10px;padding:9px 11px;border:1px solid #334155;margin-bottom:6px;transition:opacity .2s,transform .2s}
.list-row.dragging{opacity:.4;transform:scale(.97)}
.list-row.drag-over{border-color:#60A5FA}
.list-row .body{flex:1;min-width:0}
.list-row .pname{font-size:14px;font-weight:600;color:#F8FAFC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .psub{font-size:11px;color:#64748B;margin-top:2px}
.list-row.picked{border-color:#3B82F6;background:#1E3A5F}
.pick-box{width:22px;height:22px;border-radius:6px;border:1.5px solid #475569;background:#0F172A;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pick-box.on{background:#3B82F6;border-color:#3B82F6}
.pick-bar{padding:10px 12px;background:#0F172A;border-top:1px solid #1E293B;flex-shrink:0}
@media(min-width:600px){.pick-bar{padding:12px 24px}}
.pick-bar .pick-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pick-bar .pick-warn{font-size:11px;color:#FCD34D;margin-bottom:8px;line-height:1.35}
.num-badge{width:44px;height:38px;border-radius:8px;background:#0F172A;border:1.5px solid #334155;color:#F8FAFC;font-weight:800;font-size:15px;text-align:center;flex-shrink:0;outline:none}
.num-badge:focus{border-color:#60A5FA}
.num-badge.dup{border-color:#EF4444;color:#FCA5A5}
.drag-handle{cursor:grab;color:#475569;font-size:16px;padding:2px 2px;touch-action:none;user-select:none;flex-shrink:0}
.icon-btn{background:none;border:none;color:#475569;font-size:14px;cursor:pointer;padding:5px;flex-shrink:0}
.icon-btn:hover{color:#EF4444}
.pos-btns{display:flex;gap:3px;flex-wrap:wrap}
.pos-btn{padding:6px 8px;border-radius:7px;border:2px solid #334155;font-size:11px;font-weight:700;cursor:pointer;min-width:34px;text-align:center;background:#0F172A;color:#94A3B8;transition:all .15s}
.pos-btn.active{background:#6366F1;border-color:#818CF8;color:#fff}
@media(min-width:600px){.pos-btn{padding:8px 11px;font-size:13px;min-width:40px}}
.badge{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap;border:1px solid transparent}
.status-btns{display:flex;gap:4px;flex-shrink:0}
.st-btn{width:34px;height:34px;border-radius:8px;border:1.5px solid #334155;background:#0F172A;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0}
.st-btn.on{color:#fff}
.counter{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:#0F172A;color:#94A3B8}

/* ── STAT GRID / QUICK INPUT (saisie) ─────────────── */
.grid-header{display:flex;padding:8px 12px;background:#1E293B;border-bottom:1px solid #334155;align-items:center;position:sticky;top:0;z-index:3}
@media(min-width:600px){.grid-header{padding:10px 16px}}
.grid-header .lbl{font-size:11px;color:#64748B;font-weight:600}
.grid-header .stat-labels{display:flex;flex:1;justify-content:space-around}
.grid-header .stat-lbl{text-align:center;font-size:10px;font-weight:700}
@media(min-width:600px){.grid-header .stat-lbl{font-size:12px}}
.grid-row{display:flex;align-items:center;padding:5px 12px;border-bottom:1px solid #1E293B}
@media(min-width:600px){.grid-row{padding:6px 16px}}
.grid-row .pname{font-size:13px;font-weight:600;color:#F8FAFC}
@media(min-width:600px){.grid-row .pname{font-size:14px}}
.grid-row .ppos{font-size:10px;color:#64748B}
.grid-row .stats-cells{display:flex;flex:1;justify-content:space-around}
.stat-cell{display:flex;flex-direction:column;align-items:center}
.stat-btn{width:44px;height:44px;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
@media(min-width:600px){.stat-btn{width:52px;height:52px;font-size:20px}}
.dec-btn{margin-top:2px;font-size:11px;background:none;border:none;color:#64748B;cursor:pointer;padding:3px 10px}
.cards-grid{display:grid;grid-template-columns:1fr;gap:8px;max-width:700px;margin:0 auto}
@media(min-width:600px){.cards-grid{grid-template-columns:1fr 1fr}}
.p-card{background:#1E293B;border-radius:10px;padding:10px 14px;border:1px solid #334155}
.p-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag-btn{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none}
.side-layout{display:flex;height:100%}
.side-nav{width:110px;background:#1E293B;border-right:1px solid #334155;overflow-y:auto;flex-shrink:0;padding:8px 0}
.side-btn{display:block;width:100%;padding:12px 14px;border:none;text-align:left;background:transparent;border-left:3px solid transparent;color:#94A3B8;font-weight:700;font-size:13px;cursor:pointer}
.side-btn.active{border-left-color:currentColor;background:rgba(255,255,255,.05)}
.player-strip{display:flex;gap:6px;padding:8px 12px;flex-shrink:0;background:#162032;border-bottom:1px solid #1E293B;flex-wrap:wrap;justify-content:center;max-height:132px;overflow-y:auto}
.player-chip{padding:6px 10px;border-radius:12px;border:2px solid #334155;font-size:12px;font-weight:700;min-width:48px;text-align:center;background:#1E293B;color:#94A3B8;cursor:pointer;transition:all .15s;touch-action:manipulation;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.player-chip.active{border-color:#3B82F6;background:#1E3A5F;color:#fff}
.chip-num{font-size:11px;opacity:.7}
.chip-name{font-size:12px;max-width:80px;word-break:break-word}
.court-bar{padding:8px 12px;background:#162032;border-bottom:1px solid #1E293B;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#94A3B8;flex-shrink:0}
.court-panel{padding:10px 12px;background:#0F172A;border-bottom:1px solid #1E293B;flex-shrink:0;max-height:40vh;overflow-y:auto}
.court-toggle-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.court-toggle{padding:6px 10px;border-radius:8px;border:1.5px solid #334155;font-size:12px;font-weight:600;background:#1E293B;color:#64748B;cursor:pointer;transition:all .15s;touch-action:manipulation;text-align:left}
.court-toggle.on{border-color:#3B82F6;background:#1E3A5F;color:#fff}
.subteam-row{display:flex;gap:6px;flex-wrap:wrap}
.subteam-chip{padding:5px 12px;border-radius:16px;border:1.5px solid #334155;font-size:12px;font-weight:600;white-space:nowrap;background:transparent;color:#94A3B8;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.subteam-chip.active{background:#10B981;border-color:#34D399;color:#fff}
.subteam-edit{background:none;border:none;font-size:10px;cursor:pointer;padding:0 2px;color:inherit;opacity:.7}
.quick-panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px}
@media(min-width:600px){.quick-panel{padding:12px 16px}}
.qp-group{margin-bottom:10px}
.qp-group-title{font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;margin-bottom:4px;display:inline-block}
.qp-stats-row{display:flex;gap:6px;flex-wrap:wrap}
.qp-stat-btn{flex:1;min-width:70px;height:56px;min-height:56px;border-radius:12px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:2px solid;transition:all .12s;touch-action:manipulation;-webkit-user-select:none;user-select:none}
@media(min-width:600px){.qp-stat-btn{min-width:90px;height:64px;min-height:64px}}
.qp-stat-btn .count{font-size:20px;font-weight:800;line-height:1}
.qp-stat-btn .lbl{font-size:10px;font-weight:600;opacity:.8;margin-top:2px}
.qp-dec{font-size:11px;background:none;border:none;color:#64748B;cursor:pointer;padding:2px 10px;touch-action:manipulation}
.qp-stat-cell{display:flex;flex-direction:column;align-items:center;flex:1;min-width:70px}
@media(min-width:600px){.qp-stat-cell{min-width:90px}}
.mode-toggle{padding:4px 10px;border-radius:12px;border:1.5px solid #475569;font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:#94A3B8;transition:all .15s}
.mode-toggle.active{border-color:#F59E0B;color:#F59E0B}
.quick-prompt{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#64748B;padding:30px;text-align:center}
.quick-prompt .arrow{font-size:32px;margin-bottom:8px}
.save-bar{padding:10px 16px;background:#0F172A;border-top:1px solid #1E293B;flex-shrink:0}
@media(min-width:600px){.save-bar{padding:12px 24px}}
.save-bar .inner{max-width:460px;margin:0 auto}

/* ── TABLES ───────────────────────────────────────── */
.sum-table{width:100%;border-collapse:collapse;font-size:12px}
@media(min-width:600px){.sum-table{font-size:14px}}
.sum-table thead{position:sticky;top:0;z-index:3}
.sum-table th{padding:8px 6px;user-select:none;background:#1E293B}
@media(min-width:600px){.sum-table th,.sum-table td{padding:12px 10px}}
.sum-table th.sortable{cursor:pointer}
.sum-table td{padding:10px 6px;text-align:center;color:#E2E8F0}
.sum-table .sticky{position:sticky;left:0;z-index:1}
.sum-val{font-weight:700;font-size:16px}
@media(min-width:600px){.sum-val{font-size:18px}}
.sum-pct{font-size:10px;color:#64748B}
.totals-bar{padding:10px 12px;background:#1E293B;border-top:1px solid #334155;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;flex-shrink:0;overflow-x:auto}
@media(min-width:600px){.totals-bar{padding:12px 16px;gap:20px}}

<body>
<div id="app"></div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   WonderStats v3 — application mono-fichier, hors-ligne, sans dépendance
   Modèle : base de joueuses → saisons → (roster · équipes · vues
   sélectionneur · soumissions). Toute référence à une joueuse passe
   par un identifiant stable (playerId), jamais par un index.
   ══════════════════════════════════════════════════════════════ */
var APP_VERSION = "6.3";

/* ─── Constantes métier ─────────────────────────────────────── */
var POSITIONS=[{key:"ALL",label:"Toutes"},{key:"NONE",label:"—"},{key:"S",label:"S"},{key:"OH",label:"OH"},{key:"OPP",label:"OPP"},{key:"MB",label:"MB"},{key:"L",label:"L"}];
var POS_LABELS={S:"Passeuse",OH:"Réceptionneuse-attaquante",OPP:"Pointue",MB:"Centrale",L:"Libéro"};
/* Les postes réellement portés par une athlète. POSITIONS porte en plus
   « Toutes » et « — », qui n'appartiennent qu'aux filtres et aux menus. */
var POS_KEYS=POSITIONS.filter(function(p){return p.key!=="ALL"&&p.key!=="NONE"}).map(function(p){return p.key});
var POS_SET={};POS_KEYS.forEach(function(k){POS_SET[k]=true});

var SG={
  services:{name:"Services",color:"#3B82F6",stats:[{key:"srv_ace",label:"Ace"},{key:"srv_in",label:"En jeu"},{key:"srv_err",label:"Erreur"}]},
  reception:{name:"Réception",color:"#10B981",stats:[{key:"rec_in",label:"En jeu"},{key:"rec_out",label:"Hors sys."},{key:"rec_err",label:"Erreur"}]},
  passes:{name:"Passes",color:"#8B5CF6",stats:[{key:"pas_att",label:"Attaquable"},{key:"pas_out",label:"Hors sys."}]},
  attaques:{name:"Attaques",color:"#EF4444",stats:[{key:"atk_kill",label:"Kill"},{key:"atk_ok",label:"Réussie"},{key:"atk_err",label:"Erreur"}]},
  blocs:{name:"Blocs",color:"#F59E0B",stats:[{key:"blk_kill",label:"Kill"},{key:"blk_solo",label:"Solo"},{key:"blk_aid",label:"Aide"},{key:"blk_err",label:"Erreur"}]},
  defense:{name:"Défense",color:"#06B6D4",stats:[{key:"def_ok",label:"Réussie"},{key:"def_out",label:"Hors sys."},{key:"sup_in",label:"Soutien"},{key:"sup_err",label:"Sout. err."}]},
  habiletes:{name:"Habiletés",color:"#EC4899",stats:[{key:"hab_ctrl",label:"Contrôlée"},{key:"hab_appel",label:"Avec appel"},{key:"hab_couv",label:"Couverture"},{key:"hab_free",label:"Gratuite"}]}
};
var SG_KEYS=Object.keys(SG);
var VIEWS=[
  {key:"service",label:"🏐 Service",groups:["services"]},
  {key:"rec_atk",label:"⚡ Réc-Att",groups:["reception","passes","attaques"]},
  {key:"transition",label:"🔄 Relance",groups:["blocs","defense","passes","attaques"]},
  {key:"habiletes",label:"🎯 Habiletés",groups:["habiletes"]},
  {key:"all",label:"📋 Toutes",groups:SG_KEYS.slice()}
];
var ALL_STATS=[];SG_KEYS.forEach(function(k){SG[k].stats.forEach(function(s){ALL_STATS.push(s)})});
var STAT_LABEL={};ALL_STATS.forEach(function(s){STAT_LABEL[s.key]=s.label});

/* ─── Efficacité statistique ─────────────────────────────────
   Un compteur brut ne se compare pas : 12 kills ne disent rien sans le
   nombre de tentatives, et deux sélectionneurs n'ont pas vu la même durée
   de jeu. Chaque famille se ramène donc à une efficacité — la part nette
   de gestes réussis, entre −1 et +1 — et à un volume, qui dit si cette
   efficacité mérite qu'on s'y fie.

   La réception compte `rec_out` comme ni réussi ni manqué : la balle est
   restée en jeu, hors système. Même raison pour `def_out`. */
var STAT_FAMILIES={
  services:{pos:["srv_ace"],neg:["srv_err"]},
  reception:{pos:["rec_in"],neg:["rec_err"]},
  passes:{pos:["pas_att"],neg:["pas_out"]},
  attaques:{pos:["atk_kill"],neg:["atk_err"]},
  blocs:{pos:["blk_kill","blk_solo","blk_aid"],neg:["blk_err"]},
  defense:{pos:["def_ok","sup_in"],neg:["sup_err"]},
  habiletes:{pos:["hab_ctrl","hab_appel","hab_couv"],neg:[]}
};
var FAMILY_KEYS=Object.keys(STAT_FAMILIES);
/* Le volume d'une famille est la somme de tous ses compteurs, pas seulement
   des réussis : c'est le nombre de fois où l'athlète a été mise à l'épreuve. */
function familyVolume(stats,fam){
  var g=SG[fam];if(!g)return 0;
  return g.stats.reduce(function(t,s){return t+((stats&&stats[s.key])||0)},0);
}
/* Efficacité d'une famille, ou null si l'athlète n'y a rien fait. */
function familyEff(stats,fam){
  var def=STAT_FAMILIES[fam],vol=familyVolume(stats,fam);
  if(!def||!vol)return null;
  var pos=0,neg=0;
  def.pos.forEach(function(k){pos+=(stats&&stats[k])||0});
  def.neg.forEach(function(k){neg+=(stats&&stats[k])||0});
  return (pos-neg)/vol;
}
/* Toutes les familles d'un relevé, avec leur volume. */
function statProfile(stats){
  var out={};
  FAMILY_KEYS.forEach(function(f){
    var v=familyVolume(stats,f);
    if(v)out[f]={eff:familyEff(stats,f),volume:v};
  });
  return out;
}
function fmtEff(e){
  if(e==null)return "—";
  return (e>=0?"+":"")+e.toFixed(2);
}
/* Une efficacité se lit mal dans l'absolu : ce qui compte est l'écart aux
   autres athlètes du même moment. On la ramène donc sur la même échelle
   1–5 que les critères, en la situant dans la distribution de la campagne.
   Sans dispersion — tout le monde au même niveau — chacune vaut 3. */
function effToScale(eff,moyenne,ecart){
  if(eff==null)return null;
  if(!(ecart>0.0001))return 3;
  var v=3+(eff-moyenne)/ecart;
  return Math.max(1,Math.min(RATING_MAX,v));
}

/* Critères d'évaluation qualitative utilisés par les sélectionneurs */
var CRITERIA=[
  {key:"tech",label:"Technique",desc:"Qualité et constance des gestes"},
  {key:"phys",label:"Physique",desc:"Détente, vitesse, endurance"},
  {key:"iq",label:"Lecture du jeu",desc:"Anticipation, décisions"},
  {key:"att",label:"Attitude",desc:"Coachabilité, énergie, esprit d'équipe"},
  {key:"pot",label:"Potentiel",desc:"Marge de progression"}
];
var CRIT_BY_KEY={};CRITERIA.forEach(function(c){CRIT_BY_KEY[c.key]=c});
var RATING_MAX=5;

var RECOS=[
  {key:"select",label:"Retenir",short:"Retenir",color:"#10B981",icon:"✅"},
  {key:"recall",label:"Recaller",short:"Recaller",color:"#F59E0B",icon:"🔁"},
  {key:"cut",label:"Non retenue",short:"Couper",color:"#EF4444",icon:"⛔"}
];
var RECO_BY_KEY={};RECOS.forEach(function(r){RECO_BY_KEY[r.key]=r});

/* Statuts d'une joueuse dans le roster d'une saison */
var STATUS_ORDER=["selected","recalled","candidate","cut"];
var STATUSES={
  candidate:{label:"Candidate",color:"#64748B",icon:"◻️"},
  recalled:{label:"Recallée",color:"#F59E0B",icon:"🔁"},
  selected:{label:"Retenue",color:"#10B981",icon:"✅"},
  cut:{label:"Non retenue",color:"#EF4444",icon:"⛔"}
};
/* Recommandation de sélectionneur → statut de roster */
var RECO_TO_STATUS={select:"selected",recall:"recalled",cut:"cut"};

/* Statut d'effectif en cours de saison — indépendant du statut de sélection.
   Une joueuse partie en janvier reste « Retenue » (elle l'a été) et conserve
   ses matchs joués ; seule son appartenance courante change. */
var MEMBERSHIPS={
  active:{label:"Active",color:"#10B981",icon:"●"},
  injured:{label:"Blessée",color:"#F59E0B",icon:"🩹"},
  left:{label:"Partie",color:"#94A3B8",icon:"→"}
};
var MEMBERSHIP_ORDER=["active","injured","left"];

/* Campagnes d'évaluation : une saison en compte plusieurs, chacune datée.
   C'est ce qui permet de comparer la sélection d'août au bilan de mai. */
var CAMPAIGN_KINDS=[
  {key:"tryout",label:"Sélection",icon:"🎯"},
  {key:"mid",label:"Mi-saison",icon:"📈"},
  {key:"final",label:"Fin de saison",icon:"🏁"},
  {key:"custom",label:"Ponctuelle",icon:"📌"}
];
var KIND_BY_KEY={};CAMPAIGN_KINDS.forEach(function(k){KIND_BY_KEY[k.key]=k});

/* Catégories : une donnée du club, pas une constante. Chaque fédération
   a les siennes, et elles changent. Cette liste n'est que le point de
   départ d'un club neuf — l'administrateur la remanie ensuite. */
var CATEGORIES_DEFAUT=["U12","U13","U14","U15","U16","U18","U21","Senior"];

/* Les catégories d'un club, complétées de celles réellement portées par
   ses équipes : retirer une catégorie de la liste ne doit jamais
   reclasser en silence une équipe qui l'utilise encore. */
function categoriesOf(club){
  var base=(club&&club.categories&&club.categories.length)
    ? club.categories.slice() : CATEGORIES_DEFAUT.slice();
  if(club)DB.teams.forEach(function(t){
    if(t.clubId===club.id&&t.category&&base.indexOf(t.category)===-1)base.push(t.category);
  });
  return base;
}
/* Catégories du contexte courant, pour les écrans qui n'ont pas de club
   sous la main. */
function curCategories(){
  var c=ctxClub();
  if(c)return categoriesOf(c);
  if(DB.clubs.length===1)return categoriesOf(DB.clubs[0]);
  var tous=[];
  DB.clubs.forEach(function(cl){
    categoriesOf(cl).forEach(function(x){if(tous.indexOf(x)===-1)tous.push(x)});
  });
  return tous.length?tous:CATEGORIES_DEFAUT.slice();
}
function cleanCategories(list){
  var out=[];
  (list||[]).forEach(function(x){
    x=String(x||"").trim();
    if(x&&out.indexOf(x)===-1)out.push(x);
  });
  return out;
}

/* ─── Rencontres ─────────────────────────────────────────────────────
   Une saison n'est pas une suite de matchs indistincts : elle a des
   amicaux, du championnat et des tournois, et un tournoi est un
   événement qui porte plusieurs matchs. Sans cette entité, tout le
   contexte se réfugiait dans le nom de la session. Voir AUDIT.md § 8. */
var EVENT_KINDS={
  friendly:{key:"friendly",label:"Amical",short:"Amical",icon:"🤝",color:"#60A5FA"},
  league:{key:"league",label:"Championnat",short:"Champ.",icon:"🏆",color:"#34D399"},
  tournament:{key:"tournament",label:"Tournoi",short:"Tournoi",icon:"🎪",color:"#F59E0B"},
  training:{key:"training",label:"Entraînement",short:"Entr.",icon:"🎽",color:"#94A3B8"}
};
var EVENT_KEYS=["league","tournament","friendly","training"];
/* Un tournoi porte plusieurs matchs ; les autres natures, un seul en général. */
function kindIsMulti(k){return k==="tournament"}

/* ─── Journal des décisions ──────────────────────────────────────────
   On enregistre ce qui engage — un statut tranché, une soumission
   supprimée, une saison close — et rien d'autre. Un journal qui note
   chaque frappe ne se relit pas. Voir AUDIT.md, constat R10.        */
var LOG_KINDS={

/* ─── Date de naissance ───────────────────────────────────────
   Un club écrit « 26/10/2011 » ; il arrive aussi qu'il ne connaisse que
   l'année, et c'est déjà suffisant pour une catégorie. Les deux formes
   sont acceptées et rangées séparément : `birthDate` porte la date
   complète au format ISO quand on la connaît, `birthYear` l'année seule
   — elle reste ce sur quoi les catégories se décident, et ce qui
   dédoublonne deux homonymes à la fusion d'un export.

   Une date illisible n'est jamais devinée : elle est refusée. Le 31
   février d'une frappe de travers ne doit pas devenir une naissance. */
function mkBirth(y,mo,d){
  if(y<1900||y>2100||mo<1||mo>12||d<1||d>31)return null;
  var dt=new Date(Date.UTC(y,mo-1,d));
  if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d)return null;
  return {date:y+"-"+pad2(mo)+"-"+pad2(d),year:String(y)};
}
function parseBirth(v){
  var t=String(v==null?"":v).trim();
  if(!t)return {date:"",year:""};
  var m=t.match(/^(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4})$/);
  if(m)return mkBirth(+m[3],+m[2],+m[1]);
  var iso=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);   /* ce que portent les sauvegardes */
  if(iso)return mkBirth(+iso[1],+iso[2],+iso[3]);
  if(/^\d{4}$/.test(t)){var y=+t;return (y>=1900&&y<=2100)?{date:"",year:t}:null}
  return null;
}
function hasBirthDate(p){return !!(p&&p.birthDate&&/^\d{4}-\d{2}-\d{2}$/.test(p.birthDate))}
/* Telle qu'on l'écrit : jj/mm/aaaa, ou l'année seule quand c'est tout
   ce qu'on sait d'elle. */
function fmtBirth(p){
  if(hasBirthDate(p)){var x=p.birthDate.split("-");return x[2]+"/"+x[1]+"/"+x[0]}
  return (p&&p.birthYear)||"";
}
/* Ce qui ordonne : l'année, puis le jour lorsqu'il est connu. Une fiche
   qui ne porte que l'année se range avec son année, après celles dont on
   sait le jour — dans un sens comme dans l'autre. Lui prêter un premier
   janvier la ferait passer devant des athlètes réellement plus âgées. */
function birthSortKey(p){
  var y=(p&&/^\d{4}$/.test(p.birthYear))?+p.birthYear:null;
  var md=hasBirthDate(p)?p.birthDate.slice(5):"";
  if(y===null&&md)y=+p.birthDate.slice(0,4);
  return {y:y,md:md};
}
function nowISO(){return new Date().toISOString()}
function pad2(n){return (n<10?"0":"")+n}
function todayISO(){
  var d=new Date();

}
function dayOf(iso){return String(iso||"").slice(0,10)}
function fmtDate(iso){try{return new Date(iso).toLocaleDateString("fr-CA",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return iso||""}}
function fmtDay(iso){try{return new Date(iso).toLocaleDateString("fr-CA",{year:"numeric",month:"long",day:"numeric"})}catch(e){return iso||""}}
function fmtShortDay(d){if(!d)return "?";try{return new Date(d+(d.length===10?"T12:00:00":"")).toLocaleDateString("fr-CA",{month:"short",day:"numeric",year:"numeric"})}catch(e){return d}}
function plural(n,s,p){return n+" "+(n>1?(p||s+"s"):s)}

/* Une ligne d'ajout en lot : « Prénom Nom [naissance] [dossard] ».

   Rien n'est deviné à la position : la naissance se reconnaît à sa forme
   — 26/10/2011, ou une année seule à quatre chiffres — et le dossard à
   la sienne, un à trois chiffres en fin de ligne. Quatre chiffres ne
   peuvent pas être un dossard, un dossard ne peut pas être une année :
   les deux ne se confondent jamais. Ce qui reste est le nom.

   Une date de forme juste mais impossible (31/02) rend la ligne
   illisible plutôt que de se glisser dans le nom de famille. */
function parseBulkLine(line){
  var t=String(line||"").trim();
  var brut="",m=t.match(/(^|\s)(\d{1,2}\s*[\/\-.]\s*\d{1,2}\s*[\/\-.]\s*\d{4})(\s|$)/);
  if(m)brut=m[2];
  else {var m2=t.match(/(^|\s)(\d{4})(\s|$)/);if(m2)brut=m2[2]}
  var birth={date:"",year:""};
  if(brut){
    birth=parseBirth(brut);
    if(!birth)return null;
    var i=t.indexOf(brut);
    t=(t.slice(0,i)+" "+t.slice(i+brut.length)).trim();
  }
  var num="",mn=t.match(/\s(\d{1,3})$/);
  if(mn){num=mn[1];t=t.slice(0,mn.index).trim()}
  var parts=t.split(/\s+/).filter(Boolean);
  return {firstName:parts.shift()||"",lastName:parts.join(" "),
    birthDate:birth.date,birthYear:birth.year,number:num};
}

/* Un résultat est une suite de sets. L'issue s'en déduit — on ne stocke
   pas une victoire qu'on pourrait contredire en corrigeant un score. */
function mkResult(){return {sets:[]}}
function setsOf(r){
  var w=0,l=0;
  ((r&&r.sets)||[]).forEach(function(x){
    if(x.us>x.them)w++;else if(x.them>x.us)l++;
  });
  return {won:w,lost:l};
}

function resultLabel(r){
  if(!hasResult(r))return "";
  var s=setsOf(r);
  return s.won+"–"+s.lost;
}
function resultOutcome(r){
  if(!hasResult(r))return null;
  var s=setsOf(r);
  if(s.won>s.lost)return "win";
  if(s.lost>s.won)return "loss";
  return "draw";
}

/* ─── Réglages du score ──────────────────────────────────────
   La formule appartient au club, pas à l'application. Elle est tenue au
   niveau de la saison, et non de la campagne : comparer la sélection de
   septembre au bilan de mai n'a de sens que si les deux sont mesurées de
   la même façon. */
function mkScoring(o){
  var cw={},sw={};
  CRITERIA.forEach(function(c){cw[c.key]=1});
  FAMILY_KEYS.forEach(function(f){sw[f]=1});
  return Object.assign({
    critWeights:cw,
    statWeights:sw,
    statShare:0.5,      /* part des statistiques dans le score */
    severity:true,      /* corriger la sévérité propre à chaque sélectionneur */
    reliability:1,      /* amortissement d'un score fondé sur peu de regards */
    minVolume:5         /* gestes au-dessous desquels une famille ne dit rien */
  },o||{});
}
/* Les réglages d'une saison, complétés de leurs valeurs par défaut : une
   sauvegarde antérieure n'en porte aucun, et ne doit pas pour autant
   produire un score vide. */
function scoringOf(squad){
  var base=mkScoring(),s=(squad&&squad.scoring)||{};
  var out=mkScoring();
  CRITERIA.forEach(function(c){
    var v=(s.critWeights||{})[c.key];
    out.critWeights[c.key]=(typeof v==="number"&&v>=0)?v:base.critWeights[c.key];
  });
  FAMILY_KEYS.forEach(function(f){
    var v=(s.statWeights||{})[f];
    out.statWeights[f]=(typeof v==="number"&&v>=0)?v:base.statWeights[f];
  });
  ["statShare","reliability","minVolume"].forEach(function(k){
    if(typeof s[k]==="number"&&s[k]>=0)out[k]=s[k];
  });
  out.statShare=Math.max(0,Math.min(1,out.statShare));
  if(typeof s.severity==="boolean")out.severity=s.severity;
  return out;
}
/* Vrai quand la saison s'en tient à la moyenne simple d'autrefois. */
function scoringIsPlain(sc){
  if(sc.statShare>0||sc.severity||sc.reliability>0)return false;
  var w=null,egal=true;
  CRITERIA.forEach(function(c){
    if(w===null)w=sc.critWeights[c.key];
    else if(sc.critWeights[c.key]!==w)egal=false;
  });
  return egal&&w>0;
}
/* Groupes de compteurs d'une vue. Une liste vide est un choix — le plan de
   séance prévoit une vue d'évaluateur sans aucun compteur — tandis qu'un
   champ absent est une donnée ancienne, d'avant le réglage : elle reçoit
   tous les groupes, comme elle les affichait. */
function normGroups(g){
  if(!Array.isArray(g))return SG_KEYS.slice();
  return g.filter(function(k){return SG[k]});
}
/* Groupes d'athlètes d'une vue. On ne garde que des numéros que la vue
   contient vraiment : un paquet bricolé ou une vue dont on a retiré des
   athlètes ne doit pas laisser des groupes qui désignent le vide. */
function normPlayerGroups(raw,playerIds){
  if(!Array.isArray(raw))return [];
  var connus={};(playerIds||[]).forEach(function(p){connus[p]=1});
  var vus={},out=[];
  raw.forEach(function(g){
    if(!g||!Array.isArray(g.playerIds))return;
    var ids=g.playerIds.filter(function(p){
      if(!connus[p]||vus[p])return false;      /* une athlète n'est que dans un groupe */
      vus[p]=1;return true;
    });
    if(!ids.length)return;
    out.push({id:String(g.id||uid()),name:String(g.name||("Groupe "+(out.length+1))).slice(0,40),
      playerIds:ids});
  });
  return out;
}
/* Découpe une liste déjà ordonnée en groupes de `taille`. L'ordre reçu
   est celui des numéros — celui des dossards qu'on appelle. */
function nomDeGroupe(n){
  var lettres="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  return "Groupe "+(n<26?lettres.charAt(n):String(n+1));
}
function decouperEnGroupes(idsOrdonnes,taille){
  taille=parseInt(taille,10)||0;
  if(taille<1)return [];
  var out=[],ids=idsOrdonnes||[];
  for(var i=0;i<ids.length;i+=taille)
    out.push({id:uid(),name:nomDeGroupe(out.length),playerIds:ids.slice(i,i+taille)});
  return out;
}

    if(DB.squads[i].teamId===teamId&&DB.squads[i].seasonId===seasonId)return DB.squads[i];

/* Le dernier squad connu d'une équipe, saison exclue : celui dont la
   saison a été créée le plus récemment. Sert à reprendre ce qui doit
   survivre d'une saison à l'autre. */
function dernierSquadDe(teamId,saufSeasonId){
  var best=null,bestAt="";
  (DB.squads||[]).forEach(function(sq){
    if(sq.teamId!==teamId||sq.seasonId===saufSeasonId)return;
    var s=seasonById(sq.seasonId);
    if(!s)return;
    var at=String(s.createdAt||"");
    if(!best||at>bestAt){best=sq;bestAt=at}
  });
  return best;
}
/* Crée le squad à la volée : une équipe existe dès qu'on la fait jouer.

   La formule du score suit l'équipe d'une saison à l'autre : un club qui
   a décidé du poids de ses critères ne veut pas le redécider chaque
   septembre, et un retour silencieux aux valeurs par défaut fausserait la
   comparaison avec la saison passée. Tout le reste — roster, campagnes,
   vues, matchs — naît vierge : c'est une nouvelle saison. */
function ensureSquad(teamId,seasonId){
  var sq=squadFor(teamId,seasonId);
  if(sq)return sq;
  var t=teamById(teamId);
  if(!t||!seasonId)return null;
  sq=mkSquad(teamId,seasonId,t.name);
  sq.category=t.category;sq.freeView=!!t.freeView;
  var prec=dernierSquadDe(teamId,seasonId);
  if(prec&&prec.scoring)sq.scoring=clone(prec.scoring);
  DB.squads.push(sq);
  return sq;
}
/* Le squad courant : croisement du contexte (équipe) et de la saison active.
   C'est l'objet que manipulent tous les écrans entraîneur. */

  var tid=state.ctx&&state.ctx.teamId;
  var s=curSeason();
  if(!tid||!s)return null;
  return ensureSquad(tid,s.id);
}

   dans le modèle v4, ce « team » est le squad. */

function curTeamRecord(){var tid=state.ctx&&state.ctx.teamId;return tid?teamById(tid):null}
function playerById(id){for(var i=0;i<DB.players.length;i++)if(DB.players[i].id===id)return DB.players[i];return null}
function rosterEntry(squad,pid){if(!squad)return null;for(var i=0;i<squad.roster.length;i++)if(squad.roster[i].playerId===pid)return squad.roster[i];return null}
function seasonById(id){for(var i=0;i<DB.seasons.length;i++)if(DB.seasons[i].id===id)return DB.seasons[i];return null}
function viewById(squad,id){if(!squad)return null;for(var i=0;i<squad.selectorViews.length;i++)if(squad.selectorViews[i].id===id)return squad.selectorViews[i];return null}

/* ══ ACCÈS ═══════════════════════════════════════════════════════
   Applique la matrice de ROLES.md. Garde-fou ergonomique : sur un
   appareil, rien n'empêche de modifier ces valeurs — la seule frontière
   réellement tenue est celle du relais (jetons). Voir ROLES.md § 4.   */
function me(){return state.meId?personById(state.meId):null}
/* Cette personne est-elle le propriétaire ? On ne le lit pas d'un
   drapeau : c'est l'identité inscrite au moment de la fondation, et
   seule la détention de la clé la rend effective. */
function personIsSuper(p){return !!(p&&DB.superId&&p.id===DB.superId&&superProof.ok)}
function adminClubsOf(p){
  if(!p)return [];
  var ids={};
  DB.clubAssignments.forEach(function(a){
    if(a.personId===p.id&&a.role==="admin")ids[a.clubId]=1;
  });
  return DB.clubs.filter(function(c){return ids[c.id]&&!c.archived});
}
function clubById(id){for(var i=0;i<DB.clubs.length;i++)if(DB.clubs[i].id===id)return DB.clubs[i];return null}
function clubOfTeam(t){return t?clubById(t.clubId):null}

/* Administrateur d'un club donné — plusieurs personnes peuvent l'être.
   Le propriétaire l'est partout, par construction. */
function isAdminOf(clubId){
  if(isSuper())return true;
  var p=me();if(!p||p.revoked||!clubId)return false;
  return DB.clubAssignments.some(function(a){
    return a.personId===p.id&&a.clubId===clubId&&a.role==="admin";
  });
}
function adminsOfClub(clubId){
  var ids={};
  DB.clubAssignments.forEach(function(a){
    if(a.clubId===clubId&&a.role==="admin")ids[a.personId]=a;
  });
  return DB.people.filter(function(p){return ids[p.id]&&!p.revoked})
    .map(function(p){return {person:p,assignment:ids[p.id]}});
}
/* Clubs que je peux administrer. */
function myClubs(){
  if(isSuper())return DB.clubs.filter(function(c){return !c.archived});
  var p=me();if(!p)return [];
  var ids={};
  DB.clubAssignments.forEach(function(a){
    if(a.personId===p.id&&a.role==="admin")ids[a.clubId]=1;
  });
  return DB.clubs.filter(function(c){return !c.archived&&ids[c.id]});
}
/* Rétrocompatibilité : « suis-je administrateur quelque part ? ». */
function isAdmin(){return isSuper()||myClubs().length>0}

function myAssignments(){
  var p=me();if(!p)return [];
  return DB.assignments.filter(function(a){return a.personId===p.id&&teamById(a.teamId)});
}
function hasRole(teamId,role){
  var t=teamById(teamId);
  if(t&&isAdminOf(t.clubId))return true;
  var p=me();if(!p)return false;
  return DB.assignments.some(function(a){return a.personId===p.id&&a.teamId===teamId&&a.role===role});
}
function canCoach(teamId){return hasRole(teamId,"coach")}
function canSelect(teamId){return hasRole(teamId,"selector")}
/* Équipes visibles dans un rôle donné : celles de mes clubs quand je
   les administre, plus celles où j'ai l'affectation. */
function teamsForRole(role){
  var p=me();
  var clubIds={};myClubs().forEach(function(c){clubIds[c.id]=1});
  var ids={};
  if(p)DB.assignments.forEach(function(a){if(a.personId===p.id&&a.role===role)ids[a.teamId]=1});
  return DB.teams.filter(function(t){
    return !t.archived&&(ids[t.id]||clubIds[t.clubId]);
  });
}
/* Les contextes offerts au sélecteur : la propriété, puis un contexte
   d'administration par club administré, puis une entrée par affectation. */
function myContexts(){
  var out=[];
  if(isSuper())out.push({role:"super"});
  myClubs().forEach(function(c){out.push({role:"admin",clubId:c.id})});
  ROLE_KEYS.forEach(function(role){
    teamsForRole(role).forEach(function(t){out.push({role:role,teamId:t.id})});
  });
  return out;
}
function ctxColor(c){
  if(!c)return "#64748B";
  if(c.role==="super")return SUPER_CTX.color;
  if(c.role==="admin")return ADMIN_CTX.color;
  return (ROLES[c.role]||{color:"#64748B"}).color;
}
function ctxIcon(c){
  if(!c)return "🔑";
  if(c.role==="super")return SUPER_CTX.icon;
  if(c.role==="admin")return ADMIN_CTX.icon;
  return (ROLES[c.role]||{icon:"🔑"}).icon;
}
function ctxLabel(c){
  if(!c)return "Aucun contexte";
  if(c.role==="super")return SUPER_CTX.icon+" "+SUPER_CTX.label;
  if(c.role==="admin"){
    var cl=clubById(c.clubId);
    return ADMIN_CTX.icon+" "+ADMIN_CTX.label+(cl?" · "+cl.name:"");
  }
  var t=teamById(c.teamId);
  return ROLES[c.role].icon+" "+ROLES[c.role].label+" · "+(t?t.name:"—");
}
function sameCtx(a,b){
  if(!a||!b||a.role!==b.role)return false;
  if(a.role==="super")return true;
  if(a.role==="admin")return a.clubId===b.clubId;
  return a.teamId===b.teamId;
}
/* Replace le contexte sur quelque chose de valide après tout changement
   d'affectation, de personne ou d'équipe. */
function normalizeCtx(){
  var all=myContexts();
  if(!all.length){state.ctx=null;return}
  if(!state.ctx||!all.some(function(c){return sameCtx(c,state.ctx)}))state.ctx=all[0];
}
/* Bascule vers le rôle sélectionneur, en s'affectant si nécessaire :
   un entraîneur peut évaluer sa propre équipe. */
function ensureSelectorCtx(teamId){
  var m=me();
  if(teamId&&m&&!DB.assignments.some(function(a){
    return a.personId===m.id&&a.teamId===teamId&&a.role==="selector";}))
    DB.assignments.push(mkAssignment(m.id,teamId,"selector"));
  state.ctx=teamId?{role:"selector",teamId:teamId}:{role:"selector",teamId:(state.ctx||{}).teamId};
  normalizeCtx();
  clearUndo();
}
/* Le nom de l'auteur est figé au moment de l'écriture : renommer une
   personne ne doit pas réécrire l'histoire de ses décisions. */
function logAct(kind,text,opts){
  opts=opts||{};
  var p=me();
  DB.log.push({
    id:uid(),at:nowISO(),kind:LOG_KINDS[kind]?kind:"status",
    byId:p?p.id:null,byName:p?p.name:"—",
    byRole:state.ctx?state.ctx.role:"",
    teamId:opts.teamId||((state.ctx&&state.ctx.teamId)||""),
    seasonId:opts.seasonId||DB.activeSeasonId||"",
    playerId:opts.playerId||"",
    text:text
  });
  if(DB.log.length>LOG_MAX)DB.log.splice(0,DB.log.length-LOG_MAX);
}
/* Désignation d'une joueuse dans le journal : numéro + nom, tels qu'ils
   étaient au moment des faits. */
function logWho(squad,pid){
  var p=playerById(pid),e=squad?rosterEntry(squad,pid):null;
  return (e&&e.number?"#"+e.number+" ":"")+(p?fullName(p):"joueuse inconnue");
}
function isCoachCtx(){return !!state.ctx&&state.ctx.role==="coach"}
function isSelectorCtx(){return !!state.ctx&&state.ctx.role==="selector"}
function isAdminCtx(){return !!state.ctx&&(state.ctx.role==="admin"||state.ctx.role==="super")}
function isSuperCtx(){return !!state.ctx&&state.ctx.role==="super"}
/* Le club sur lequel porte le contexte courant. */
function ctxClub(){
  if(!state.ctx)return null;
  if(state.ctx.role==="admin")return clubById(state.ctx.clubId);
  if(state.ctx.teamId){var t=teamById(state.ctx.teamId);return t?clubById(t.clubId):null}
  return null;
}

function fullName(p){
  if(!p)return "—";
  var n=((p.firstName||"")+" "+(p.lastName||"")).trim();
  return n||"Sans nom";
}
function shortName(p){
  if(!p)return "—";
  var f=(p.firstName||"").trim(),l=(p.lastName||"").trim();
  if(f&&l)return f+" "+l.charAt(0).toUpperCase()+".";
  return f||l||"Sans nom";
}
/* Numéro d'athlète — seule information exposée au rôle sélectionneur */
function numOf(squad,pid){var e=rosterEntry(squad,pid);return e&&e.number?e.number:""}
function numLabel(n){return n?"#"+n:"#?"}

function statsOf(team,pid){
  if(!team.stats[pid])team.stats[pid]=emptyS();
  return team.stats[pid];
}
/* Détecte les numéros en double dans une saison (bloquant pour les vues sélectionneur) */
function dupNumbers(squad){
  var seen={},dup={};
  (squad?squad.roster:[]).forEach(function(e){
    if(!e.number)return;
    if(seen[e.number])dup[e.number]=true;else seen[e.number]=true;
  });
  return dup;
}
function missingNumbers(squad){
  return (squad?squad.roster:[]).filter(function(e){return !e.number});
}

/* ─── Série de dossards ───────────────────────────────────────
   Un club distribue des chasubles numérotées : 1 à 28, ou 4 à 19 pour
   celui qui garde ses maillots de l'an dernier. La série n'est pas une
   règle — on peut toujours saisir un numéro hors d'elle dans le tableau
   de sélection — c'est le jeu qu'on a sous la main ce jour-là.

   Non réglée, elle se devine de l'effectif convoqué : c'est presque
   toujours 1 à autant d'athlètes. */
function numberingOf(squad){
  var n=squad&&squad.numbering;
  var from=n?parseInt(n.from,10):NaN,to=n?parseInt(n.to,10):NaN;
  if(!isFinite(from)||from<0)from=1;
  if(!isFinite(to)||to<from)to=from+Math.max((squad&&squad.roster.length)||12,1)-1;
  if(to-from>199)to=from+199;      /* deux cents tuiles : au-delà, on ne choisit plus, on cherche */
  return {from:from,to:to};
}
function setNumbering(squad,from,to){
  if(!squad)return;
  from=Math.max(0,parseInt(from,10)||0);
  to=parseInt(to,10);
  if(!isFinite(to)||to<from)to=from;
  if(to-from>199)to=from+199;
  squad.numbering={from:from,to:to};
  scheduleAutoSave();
}
function porteurDe(squad,num){
  num=cleanNum(num);
  if(!num)return null;
  var out=null;
  (squad?squad.roster:[]).forEach(function(e){if(!out&&e.number===num)out=e});
  return out;
}
/* Poser un numéro sur une athlète. Rien n'est attribué d'office : ce
   geste vient toujours d'un doigt sur une tuile. Quand le numéro est
   déjà porté, on échange plutôt que de laisser quelqu'un nu — et on le
   demande, parce que deux dossards qui changent de main, ça se dit. */
function assignNumber(squad,pid,num){
  var e=rosterEntry(squad,pid);
  if(!e)return false;
  num=cleanNum(num);
  var avant=e.number;
  if(num&&avant===num){                     /* même tuile : on retire */
    e.number="";
    logAct("number",logWho(squad,pid)+" : numéro "+avant+" retiré",
      {teamId:squad.teamId,seasonId:squad.seasonId,playerId:pid});
    scheduleAutoSave();return true;
  }
  var autre=null;
  squad.roster.forEach(function(x){if(!autre&&x.number===num&&x.playerId!==pid)autre=x});
  if(autre){
    var qui=fullName(playerById(autre.playerId));
    if(avant){
      if(!confirmAct("Le "+num+" est porté par "+qui+".\n\nÉchanger ? "+qui+" prendra le "+avant+"."))return false;
      autre.number=avant;
    } else {
      if(!confirmAct("Le "+num+" est porté par "+qui+".\n\nLe lui prendre ? "+qui+" se retrouvera sans numéro."))return false;
      autre.number="";
    }
  }
  e.number=num;
  logAct("number",logWho(squad,pid)+" : numéro "+(avant||"—")+" → "+(num||"—")+
    (autre?" (échangé avec "+fullName(playerById(autre.playerId))+")":""),
    {teamId:squad.teamId,seasonId:squad.seasonId,playerId:pid});
  /* Une vue déjà partie porte l'ancien numéro : le paquet est figé. */
  var parties=vuesDistribuees(squad,pid);
  if(parties.length)showToast(parties.length===1
    ? "⚠️ Une vue déjà distribuée affiche encore #"+(avant||"—")+" — republiez-la"
    : "⚠️ "+parties.length+" vues déjà distribuées affichent encore #"+(avant||"—")+" — republiez-les",5000);
  scheduleAutoSave();
  return true;
}

/* Vue "joueuse" consommée par les écrans de saisie : stats par référence */
function teamViewPlayers(team){
  var season=team;if(!team)return [];
  var out=[];
  team.playerIds.forEach(function(pid){
    var p=playerById(pid),e=rosterEntry(season,pid);
    if(!p)return;
    out.push({id:pid,name:fullName(p),number:e?e.number:"",position:e?e.position:"",stats:statsOf(team,pid)});
  });
  return out;
}
function lineupPlayers(team){
  var season=team;
  var all=teamViewPlayers(team);
  if(!team.lineup||!team.lineup.length)
    return all.filter(function(p){var e=rosterEntry(season,p.id);return !e||e.membership==="active"});
  return all.filter(function(p){return team.lineup.indexOf(p.id)!==-1});
}
function filterPos(list){
  if(state.posFilter==="ALL")return list;
  if(state.posFilter==="NONE")return list.filter(function(p){return !p.position});
  return list.filter(function(p){return p.position===state.posFilter});
}
function filterP(list){return filterPos(list||lineupPlayers(curTeam()))}

/* ══ COFFRE ════════════════════════════════════════════════════
   Les données du club sont chiffrées dans le navigateur : AES-GCM 256,
   clé dérivée de la phrase de passe par PBKDF2-SHA256. La clé ne quitte
   jamais la mémoire — rien de déchiffrable ne touche le disque.

   Ce que cela protège réellement : quelqu'un qui récupère l'appareil ou
   lit localStorage ne voit que du bruit. Ce que cela ne protège pas : la
   séparation des rôles reste côté client (voir ROLES.md §7), et qui
   connaît la phrase voit tout ce que voit son propriétaire.
   ══════════════════════════════════════════════════════════════ */
var SK_VAULT="wonderstats_vault_v1";

/* Jetons d'accès et adresses privées. Rangés à part de DB pour qu'une
   sauvegarde exportée ne les emporte pas, et chiffrés avec le reste. */
var SECRETS={github:null,superKey:null};
var VAULT={key:null,meta:null,unlocked:false,plain:null,noCrypto:false};

function subtle(){
  var c=(typeof crypto!=="undefined")?crypto:null;
  if(!c)return null;
  return c.subtle||c.webkitSubtle||null;   /* vieux Safari : webkitSubtle */
}
/* crypto.subtle exige un contexte sécurisé. En https ou sur localhost il
   est là ; ouvert en file:// il ne l'est pas, et il faut le dire au lieu
   de faire semblant de chiffrer. */
function cryptoAvailable(){return !!subtle()&&typeof TextEncoder!=="undefined"}

function b64(buf){
  var b=new Uint8Array(buf),s="";
  for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
  return btoa(s);
}
function unb64(str){
  var s=atob(str),b=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);
  return b;
}
function randBytes(n){
  var b=new Uint8Array(n);
  (crypto.getRandomValues||crypto.webkitGetRandomValues).call(crypto,b);
  return b;
}
function utf8(str){return new TextEncoder().encode(str)}

function deriveKey(pass,salt,iter){
  var sub=subtle();
  return Promise.resolve(sub.importKey("raw",utf8(pass),{name:"PBKDF2"},false,["deriveKey"]))
    .then(function(base){
      return sub.deriveKey(
        {name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},
        base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
    });
}

/* Le coût du PBKDF2 est calibré sur l'appareil qui crée le coffre : on
   vise une demi-seconde. Un vieil iPad n'est pas puni, un portable récent
   n'est pas sous-protégé. Le nombre retenu est écrit dans le coffre. */
function calibrateIter(){
  if(!cryptoAvailable())return Promise.resolve(200000);
  var probe=100000,salt=randBytes(16),t0=(new Date()).getTime();
  return deriveKey("calibrage",salt,probe).then(function(){
    var ms=(new Date()).getTime()-t0;
    if(ms<1)ms=1;
    var n=Math.round(probe*(500/ms)/10000)*10000;
    return Math.max(100000,Math.min(600000,n));
  }).catch(function(){return 200000});
}

function vaultEncrypt(obj){
  if(!VAULT.key||!VAULT.meta)return Promise.reject(new Error("Coffre verrouillé"));
  var iv=randBytes(12);
  return Promise.resolve(subtle().encrypt({name:"AES-GCM",iv:iv},VAULT.key,utf8(JSON.stringify(obj))))
    .then(function(ct){
      /* Rien d'identifiant hors du chiffré : l'indice est le seul texte
         en clair, et c'est l'utilisateur qui décide de ce qu'il y met. */
      return {v:1,kdf:{salt:VAULT.meta.kdf.salt,iter:VAULT.meta.kdf.iter,hash:"SHA-256"},
        cipher:"AES-GCM",iv:b64(iv),ct:b64(ct),
        hint:VAULT.meta.hint||"",at:nowISO()};
    });
}
/* Une phrase fausse fait échouer l'authentification GCM : le déchiffrement
   lève, il n'y a pas de comparaison à écrire ni à contourner. */
function vaultDecrypt(box,pass){
  var salt=unb64(box.kdf.salt),iter=box.kdf.iter||200000;
  return deriveKey(pass,salt,iter).then(function(key){
    return Promise.resolve(subtle().decrypt({name:"AES-GCM",iv:unb64(box.iv)},key,unb64(box.ct)))
      .then(function(plain){
        return {key:key,data:JSON.parse(new TextDecoder().decode(plain))};
      });
  });
}

function readVaultBox(){
  try{var d=localStorage.getItem(SK_VAULT);return d?JSON.parse(d):null}catch(e){return null}
}
function vaultExists(){return !!readVaultBox()}

/* Poser le verrou sur des données déjà présentes, ou sur un club neuf. */
function vaultCreate(pass,hint,who,payload){
  if(!cryptoAvailable())return Promise.reject(new Error("Chiffrement indisponible sur cet appareil"));
  return calibrateIter().then(function(iter){
    var salt=randBytes(16);
    return deriveKey(pass,salt,iter).then(function(key){
      VAULT.key=key;
      VAULT.meta={kdf:{salt:b64(salt),iter:iter,hash:"SHA-256"},hint:hint||"",who:who||""};
      VAULT.unlocked=true;VAULT.noCrypto=false;
      return vaultEncrypt(payload).then(function(box){
        localStorage.setItem(SK_VAULT,JSON.stringify(box));
        /* La copie en clair n'a plus lieu d'être. */
        localStorage.removeItem(SK);
        LEGACY_KEYS.forEach(function(k){localStorage.removeItem(k)});
        return true;
      });
    });
  });
}
function vaultUnlock(pass){
  var box=readVaultBox();
  if(!box)return Promise.reject(new Error("Aucun coffre"));
  if(!cryptoAvailable())return Promise.reject(new Error("Chiffrement indisponible sur cet appareil"));
  return vaultDecrypt(box,pass).then(function(r){
    VAULT.key=r.key;
    VAULT.meta={kdf:box.kdf,hint:box.hint||"",who:VAULT.meta&&VAULT.meta.who||""};
    VAULT.unlocked=true;VAULT.plain=r.data;
    return r.data;
  }).catch(function(){throw new Error("Phrase de passe incorrecte")});
}
function vaultChangePass(oldPass,newPass,hint){
  return vaultUnlock(oldPass).then(function(data){
    return vaultCreate(newPass,hint,VAULT.meta.who,data);
  });
}
function vaultLock(){
  VAULT.key=null;VAULT.unlocked=false;VAULT.plain=null;
  DB=emptyDB();INBOX={views:[]};SECRETS={github:null,superKey:null};
  superProof={done:false,ok:false};
  state.meId=null;state.ctx=null;
}

/* ══ PROPRIÉTAIRE ══════════════════════════════════════════════
   Un seul propriétaire dans tout le système. Ce n'est pas un drapeau
   local — chacun pourrait se l'accorder — mais une paire de clés :

     clé privée   dans le coffre chiffré du propriétaire, nulle part ailleurs
     clé publique dans superadmin.json, publié à côté de l'application

   Toutes les installations lisent ce fichier au démarrage. Créer un club
   ou nommer un administrateur produit une pièce signée ; un appareil qui
   ne sait pas signer comme le propriétaire ne peut en fabriquer aucune.

   Portée honnête : la vérification se fait dans le navigateur, donc qui
   modifie sa propre copie de la page peut la contourner. Ce qu'elle
   empêche vraiment, c'est qu'une pièce forgée soit acceptée ailleurs —
   par un autre appareil, ou par le relais, qui applique la même
   vérification hors de portée de celui qu'il contrôle.
   ══════════════════════════════════════════════════════════════ */
var SUPER_FILE="superadmin.json";
var ROOT={loaded:false,key:null,name:"",foundedAt:"",raw:null,error:""};
var ECDSA={name:"ECDSA",namedCurve:"P-256"};
var SIGN_ALG={name:"ECDSA",hash:{name:"SHA-256"}};

/* Lecture de la racine de confiance. Servie par la même origine que
   l'application, donc mise en cache par le service worker avec elle. */
function loadRoot(){
  if(!cryptoAvailable()){ROOT.loaded=true;ROOT.error="Chiffrement indisponible";return Promise.resolve(ROOT)}
  return fetch(SUPER_FILE,{cache:"no-cache"}).then(function(r){
    if(!r.ok)throw new Error("absent");
    return r.json();
  }).then(function(j){
    /* Le fichier livré avec l'application déclare « non fondé » : c'est
       un état normal, pas une erreur. */
    if(!j||j.founded===false||!j.publicKey)throw new Error("absent");
    return subtle().importKey("jwk",j.publicKey,ECDSA,true,["verify"]).then(function(k){
      ROOT.key=k;ROOT.name=j.name||"";ROOT.foundedAt=j.foundedAt||"";ROOT.raw=j;
      ROOT.loaded=true;return ROOT;
    });
  }).catch(function(e){
    ROOT.loaded=true;ROOT.key=null;
    ROOT.error=(e&&e.message==="absent")?"non fondé":"racine illisible";
    return ROOT;
  });
}
function rootExists(){return !!ROOT.key}

/* Repli sur la copie locale quand le fichier publié est injoignable :
   hors ligne, ou pas encore déposé. Cette copie ne vaut que sur cet
   appareil — ce qui empêche une charte forgée d'être acceptée ailleurs,
   c'est le fichier publié, que les autres installations vont chercher. */
function adoptLocalRoot(){
  if(ROOT.key||!DB.rootFile||!DB.rootFile.publicKey)return Promise.resolve(false);
  return subtle().importKey("jwk",DB.rootFile.publicKey,ECDSA,true,["verify"])
    .then(function(k){
      ROOT.key=k;ROOT.name=DB.rootFile.name||"";
      ROOT.foundedAt=DB.rootFile.foundedAt||"";ROOT.raw=DB.rootFile;
      ROOT.error="racine locale";
      return true;
    }).catch(function(){return false});
}

/* ── Signature ─────────────────────────────────────────────── */
function canonical(o){
  /* Clés triées : deux appareils doivent signer et vérifier exactement
     la même suite d'octets. */
  var ks=[];for(var k in o)if(Object.prototype.hasOwnProperty.call(o,k)&&k!=="sig")ks.push(k);
  ks.sort();
  var out={};ks.forEach(function(k){out[k]=o[k]});
  return JSON.stringify(out);
}
function signDoc(doc){
  var priv=SECRETS.superKey;
  if(!priv)return Promise.reject(new Error("Cet appareil ne détient pas la clé du propriétaire"));
  return subtle().importKey("jwk",priv,ECDSA,false,["sign"]).then(function(k){
    return subtle().sign(SIGN_ALG,k,utf8(canonical(doc)));
  }).then(function(sig){
    return Object.assign({},doc,{sig:b64(sig)});
  });
}
function verifyDoc(doc){
  if(!doc||!doc.sig)return Promise.resolve(false);
  if(!ROOT.key)return Promise.resolve(false);
  return subtle().verify(SIGN_ALG,ROOT.key,unb64(doc.sig),utf8(canonical(doc)))
    .catch(function(){return false});
}

/* Cet appareil détient-il la clé du propriétaire, et correspond-elle
   bien à la clé publiée ? On ne se contente pas de la présence : on
   signe un aléa et on vérifie avec la clé publique. */
var superProof={done:false,ok:false};
function proveSuper(){
  if(!SECRETS.superKey||!ROOT.key){superProof={done:true,ok:false};return Promise.resolve(false)}
  var defi={n:b64(randBytes(16)),t:nowISO()};
  return signDoc(defi).then(verifyDoc).then(function(ok){
    superProof={done:true,ok:!!ok};return !!ok;
  }).catch(function(){superProof={done:true,ok:false};return false});
}
/* Être propriétaire demande les deux : que cet appareil détienne la clé,
   et que la personne qui l'utilise soit bien celle de la fondation.
   Changer d'identité sur l'appareil du propriétaire ne transmet donc
   rien à personne. */
function isSuper(){
  return !!(superProof.ok&&DB.superId&&state.meId===DB.superId);
}

/* ── Fondation ─────────────────────────────────────────────── */
function foundSystem(nom){
  if(!cryptoAvailable())return Promise.reject(new Error("Chiffrement indisponible sur cet appareil"));
  return subtle().generateKey(ECDSA,true,["sign","verify"]).then(function(pair){
    return Promise.all([
      subtle().exportKey("jwk",pair.privateKey),
      subtle().exportKey("jwk",pair.publicKey)
    ]);
  }).then(function(r){
    SECRETS.superKey=r[0];
    var pub=r[1];
    delete pub.key_ops;delete pub.ext;
    var fichier={version:1,name:nom||"",foundedAt:nowISO(),publicKey:pub};
    /* La clé publique n'est utile que publiée : on la rend au fondateur
       pour qu'il la dépose, et on l'adopte tout de suite en mémoire. */
    return subtle().importKey("jwk",pub,ECDSA,true,["verify"]).then(function(k){
      ROOT.key=k;ROOT.name=fichier.name;ROOT.foundedAt=fichier.foundedAt;
      ROOT.raw=fichier;ROOT.loaded=true;ROOT.error="";
      return fichier;
    });
  });
}

/* ── Transport de la clé ───────────────────────────────────────
   La clé privée est exclue des sauvegardes et du dépôt : c'est voulu.
   Elle a donc son propre fichier, scellé par une phrase choisie pour
   lui — un porte-clés, pas une sauvegarde de données. */
function sealKey(pass){
  if(!SECRETS.superKey)return Promise.reject(new Error("Cet appareil ne détient pas la clé"));
  var salt=randBytes(16),iv=randBytes(12),iter=200000;
  var charge={superKey:SECRETS.superKey,superId:DB.superId,
    name:(personById(DB.superId)||{}).name||"",publicKey:ROOT.raw?ROOT.raw.publicKey:null};
  return deriveKey(pass,salt,iter).then(function(k){
    return subtle().encrypt({name:"AES-GCM",iv:iv},k,utf8(JSON.stringify(charge)));
  }).then(function(ct){
    return {type:"wonderstats-owner-key",v:1,
      kdf:{salt:b64(salt),iter:iter,hash:"SHA-256"},
      cipher:"AES-GCM",iv:b64(iv),ct:b64(ct),at:nowISO()};
  });
}
function openKey(box,pass){
  if(!box||box.type!=="wonderstats-owner-key")
    return Promise.reject(new Error("Ce fichier n'est pas une clé de propriétaire"));
  return deriveKey(pass,unb64(box.kdf.salt),box.kdf.iter||200000).then(function(k){
    return subtle().decrypt({name:"AES-GCM",iv:unb64(box.iv)},k,unb64(box.ct));
  }).then(function(plain){
    return JSON.parse(new TextDecoder().decode(plain));
  }).catch(function(){throw new Error("Phrase de passe incorrecte pour cette clé")});
}

/* ── Chartes et nominations ────────────────────────────────── */
function charterFor(club){
  return {kind:"club",clubId:club.id,name:club.name,issuedAt:nowISO()};
}
function grantFor(person,club){
  return {kind:"admin",clubId:club.id,personId:person.id,
    name:person.name,issuedAt:nowISO()};
}
function clubIsChartered(club){
  return !!(club&&club.charter&&club.charter.sig);
}

/* Vérifie tout ce qui prétend venir du propriétaire. Un club dont la
   charte ne tient pas est marqué, pas supprimé : on ne détruit pas les
   données d'un club parce qu'une signature manque. */
function verifyAll(){
  if(!ROOT.key)return Promise.resolve({clubs:{},grants:{}});
  var res={clubs:{},grants:{}},jobs=[];
  DB.clubs.forEach(function(c){
    if(!c.charter){res.clubs[c.id]=false;return}
    jobs.push(verifyDoc(c.charter).then(function(ok){
      res.clubs[c.id]=ok&&c.charter.clubId===c.id;
    }));
  });
  DB.clubAssignments.forEach(function(a){
    if(!a.grant){res.grants[a.id]=false;return}
    jobs.push(verifyDoc(a.grant).then(function(ok){
      res.grants[a.id]=ok&&a.grant.clubId===a.clubId&&a.grant.personId===a.personId;
    }));
  });
  return Promise.all(jobs).then(function(){VERIF=res;return res});
}
var VERIF={clubs:{},grants:{}};
function clubVerified(id){return VERIF.clubs[id]===true}
function grantVerified(id){return VERIF.grants[id]===true}

/* ══ SAUVEGARDE GITHUB ═════════════════════════════════════════
   Un dépôt privé sert de coffre distant : sauvegarde, historique, et
   passage d'un appareil à l'autre. Ce qui y est déposé est le même bloc
   chiffré que sur le disque — GitHub n'en voit que du bruit, et la même
   phrase de passe l'ouvre sur l'autre appareil.

   Le jeton appartient à son porteur et n'est jamais dans le code : il est
   saisi à la main, rangé avec les secrets, donc chiffré au repos. Un
   sélectionneur n'en reçoit pas : lui donner le droit d'écrire dans le
   dépôt lui donnerait la lecture de toutes les soumissions, ce que le
   relais à jetons refuse précisément de faire.
   ══════════════════════════════════════════════════════════════ */
var GH_API="https://api.github.com";
var ghBusy=false;

function ghCfg(){return SECRETS.github}
function ghReady(){var g=ghCfg();return !!(g&&g.repo&&g.token)}
function ghPath(){var g=ghCfg();return (g&&g.path)||"wonderstats.vault.json"}

function ghFetch(path,opts){
  var g=ghCfg();
  var o=Object.assign({},opts||{});
  o.headers=Object.assign({
    "Accept":"application/vnd.github+json",
    "Authorization":"Bearer "+g.token,
    "X-GitHub-Api-Version":"2022-11-28"
  },o.headers||{});
  var ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
  var timer=setTimeout(function(){if(ctrl)ctrl.abort()},25000);
  if(ctrl)o.signal=ctrl.signal;
  return fetch(GH_API+path,o).then(function(r){
    clearTimeout(timer);
    return r.text().then(function(txt){
      var data=null;
      try{data=JSON.parse(txt)}catch(e){}
      if(r.status===404)return {missing:true};
      if(r.status===401)throw new Error("Jeton refusé par GitHub. Il a peut-être expiré, ou il a été révoqué.");
      if(r.status===403)throw new Error("GitHub refuse l'accès. Vérifiez que le jeton porte bien la permission « Contents » en lecture et écriture sur ce dépôt.");
      if(r.status===409)throw new Error("conflit");
      if(!r.ok)throw new Error("GitHub a répondu "+r.status+((data&&data.message)?" — "+data.message:""));
      return data;
    });
  }).catch(function(err){
    clearTimeout(timer);
    if(err&&err.name==="AbortError")throw new Error("GitHub injoignable (délai dépassé)");
    if(err&&/Failed to fetch|NetworkError|Load failed/i.test(err.message||""))
      throw new Error("GitHub injoignable. Vérifiez votre connexion.");
    throw err;
  });
}

/* Vérifie que le dépôt existe et que le jeton y donne bien accès. */
function ghCheck(){
  var g=ghCfg();
  return ghFetch("/repos/"+g.repo).then(function(r){
    if(r&&r.missing)throw new Error("Dépôt introuvable. Vérifiez « propriétaire/dépôt », et que le jeton y a accès.");
    if(!r.permissions||!r.permissions.push)
      throw new Error("Le jeton peut lire ce dépôt mais pas y écrire.");
    return {repo:r.full_name,priv:!!r.private};
  });
}

function ghRead(){
  return ghFetch("/repos/"+ghCfg().repo+"/contents/"+encodeURIComponent(ghPath()))
    .then(function(r){
      if(r&&r.missing)return {empty:true};
      var txt=atob((r.content||"").replace(/\n/g,""));
      var box=null;
      try{box=JSON.parse(txt)}catch(e){throw new Error("Le fichier du dépôt n'est pas lisible.")}
      return {box:box,sha:r.sha};
    });
}

/* On dépose le bloc chiffré tel quel : GitHub ne voit jamais les noms. */
function ghWrite(box,sha,msg){
  var body={message:msg||("WonderStats — "+nowISO()),
    content:btoa(unescape(encodeURIComponent(JSON.stringify(box,null,1))))};
  if(sha)body.sha=sha;
  return ghFetch("/repos/"+ghCfg().repo+"/contents/"+encodeURIComponent(ghPath()),
    {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
}

/* Envoi : on relit d'abord le sha distant pour ne pas écraser à l'aveugle
   ce qu'un autre appareil aurait déposé entre-temps. */
function ghPush(force){
  if(!ghReady())return Promise.reject(new Error("Sauvegarde GitHub non configurée"));
  if(!VAULT.unlocked)return Promise.reject(new Error("Le coffre doit être ouvert"));
  return ghRead().then(function(cur){
    var g=ghCfg();
    if(!force&&cur.box&&cur.sha&&g.lastSha&&cur.sha!==g.lastSha)
      throw new Error("conflit-distant");
    return vaultEncrypt({db:DB,inbox:INBOX,secrets:{github:null,superKey:null}}).then(function(box){
      /* Ni le jeton GitHub ni la clé du propriétaire ne partent dans le
         dépôt : ce sont des secrets d'appareil, pas de sauvegarde. */
      return ghWrite(box,cur.sha||null,"Sauvegarde du "+fmtDate(nowISO()));
    }).then(function(res){
      var g2=ghCfg();
      g2.lastSha=(res&&res.content&&res.content.sha)||null;
      g2.lastSyncAt=nowISO();
      saveNow();
      return g2.lastSyncAt;
    });
  });
}

/* Récupération : le bloc distant est chiffré avec la phrase de passe de
   celui qui l'a déposé — c'est elle qu'on redemande, pas un mot de passe
   GitHub. */
function ghPull(pass){
  if(!ghReady())return Promise.reject(new Error("Sauvegarde GitHub non configurée"));
  return ghRead().then(function(cur){
    if(cur.empty||!cur.box)throw new Error("Le dépôt ne contient encore aucune sauvegarde.");
    return vaultDecrypt(cur.box,pass).catch(function(){
      throw new Error("Phrase de passe incorrecte pour cette sauvegarde.");
    }).then(function(r){
      var data=r.data||{};
      if(!data.db)throw new Error("Sauvegarde illisible.");
      DB=normalizeDB(data.db);
      INBOX=data.inbox||{views:[]};
      var g=ghCfg();g.lastSha=cur.sha;g.lastSyncAt=nowISO();
      state.meId=(DB.enrolledId&&personById(DB.enrolledId))?DB.enrolledId:state.meId;
      normalizeCtx();saveNow();
      return true;
    });
  });
}

/* ══ PERSISTANCE ═══════════════════════════════════════════════ */
var SK="wonderstats_v3", SK_UI="wonderstats_ui_v3", SK_INBOX="wonderstats_inbox_v3";
var LEGACY_KEYS=["vball_mt_v2","vball_mt_v1"];
var autoSaveTimer=null, saveFailed=false;

function uiSnapshot(){
  return {meId:state.meId,ctx:state.ctx,tab:state.tab,viewIdx:state.viewIdx,
    posFilter:state.posFilter,inputMode:state.inputMode,svViewId:state.svViewId};
}
function saveAll(){
  /* Rien n'est chargé : il n'y a rien à écrire, et écrire serait pire
     que ne rien faire. L'application enregistre à chaque fois que
     l'onglet passe en arrière-plan — ce qui, sur un téléphone, arrive
     dès qu'on revient à sa messagerie. Un appareil qui n'avait fait
     qu'ouvrir l'écran de garde se retrouvait ainsi avec une base vide
     sur le disque, et cette base prenait ensuite le pas sur le lien
     d'invitation : l'invité était accueilli en propriétaire d'un club
     qui n'existait pas. */
  if(gate.mode&&!gate.loaded)return;
  /* Coffre ouvert : rien ne part en clair sur le disque. L'écriture est
     asynchrone, mais l'ordre est garanti par la file ci-dessous. */
  if(VAULT.unlocked){
    queueVaultWrite();
    try{localStorage.setItem(SK_UI,JSON.stringify(uiSnapshot()))}catch(e){}
    return;
  }
  try{
    localStorage.setItem(SK,JSON.stringify(DB));
    localStorage.setItem(SK_INBOX,JSON.stringify(INBOX));
    localStorage.setItem(SK_UI,JSON.stringify(uiSnapshot()));
    saveFailed=false;
  }catch(e){
    if(!saveFailed){saveFailed=true;showToast("⚠️ Sauvegarde impossible (stockage plein)")}
  }
}

/* Chiffrer prend quelques millisecondes : on sérialise les écritures pour
   qu'une sauvegarde rapide n'en double pas une autre, et on garde une
   demande en attente plutôt que d'en empiler dix. */
var vaultWriting=false,vaultPending=false;
function queueVaultWrite(){
  if(vaultWriting){vaultPending=true;return}
  vaultWriting=true;
  vaultEncrypt({db:DB,inbox:INBOX,secrets:SECRETS}).then(function(box){
    localStorage.setItem(SK_VAULT,JSON.stringify(box));
    saveFailed=false;
  }).catch(function(){
    if(!saveFailed){saveFailed=true;showToast("⚠️ Sauvegarde impossible")}
  }).then(function(){
    vaultWriting=false;
    if(vaultPending){vaultPending=false;queueVaultWrite()}
  });
}
function updateIndicators(saving){
  var els=document.querySelectorAll(".autosave-indicator");
  for(var i=0;i<els.length;i++){
    var el=els[i],txt=el.lastChild;
    if(saving){el.classList.add("saving");if(txt)txt.textContent="Sauvegarde…"}
    else{el.classList.remove("saving");if(txt)txt.textContent=saveFailed?"Non sauvegardé":"Sauvegardé"}
  }
}
function scheduleAutoSave(){
  if(autoSaveTimer)clearTimeout(autoSaveTimer);
  updateIndicators(true);
  autoSaveTimer=setTimeout(function(){saveAll();autoSaveTimer=null;updateIndicators(false)},1200);
}
function saveNow(){if(autoSaveTimer){clearTimeout(autoSaveTimer);autoSaveTimer=null}saveAll();updateIndicators(false)}

/* ── Normalisation défensive (import & rechargement) ───────── */
/* Migration v4 → v5 : les sessions antérieures n'ont pas d'événement.
   On les rattache en devinant la nature depuis leur nom, et on reconstitue
   les tournois d'après la convention « Tournoi X · match N ». Un rattachement
   deviné reste corrigeable : l'événement est éditable. */
function guessKind(name){
  var n=(name||"").toLowerCase();
  if(/tournoi|tourn\.|invitation/.test(n))return "tournament";
  if(/amical|hors.?concours|pr[ée]paration/.test(n))return "friendly";
  if(/entra[îi]nement|pratique/.test(n))return "training";
  return "league";
}
function guessOpponent(name){
  var m=(name||"").match(/\b(?:vs|contre|c\.?)\s+(.+)$/i);
  return m?m[1].trim():"";
}
/* « Tournoi Sherbrooke · match 2 » → « Tournoi Sherbrooke » */
function eventKeyOf(name){
  var m=(name||"").match(/^(.*?)\s*[·:•\-–]\s*match\s*\d+\s*$/i);
  return m?m[1].trim():null;
}
function attachOrphanSessions(sq){
  var byKey={};
  sq.events.forEach(function(ev){if(ev.migratedKey)byKey[ev.migratedKey]=ev});
  var known={};sq.events.forEach(function(ev){known[ev.id]=true});
  /* Les sessions sont empilées récentes en tête : on remonte le temps
     pour que les matchs d'un même tournoi se retrouvent dans l'ordre. */
  sq.sessions.slice().reverse().forEach(function(se){
    if(se.eventId&&known[se.eventId])return;
    var groupe=eventKeyOf(se.name);
    var cle=groupe||("§"+se.id);
    if(byKey[cle]){se.eventId=byKey[cle].id;return}
    var ev=mkEvent({kind:guessKind(se.name),
      name:groupe||se.name,opponent:guessOpponent(se.name),
      date:se.day||dayOf(se.date)});
    ev.migratedKey=cle;
    sq.events.push(ev);known[ev.id]=true;byKey[cle]=ev;
    se.eventId=ev.id;
  });
}

function normalizeSquad(sq,knownPlayers){
  sq=Object.assign(mkSquad(),sq);
  sq.roster=(sq.roster||[]).filter(function(e){return e&&knownPlayers[e.playerId]}).map(function(e){
    return Object.assign(mkRosterEntry(e.playerId),e,{number:cleanNum(e.number),
      status:STATUSES[e.status]?e.status:"candidate",
      membership:MEMBERSHIPS[e.membership]?e.membership:"active"});
  });
  var inRoster={};sq.roster.forEach(function(e){inRoster[e.playerId]=true});

  /* Campagnes — tout squad en possède au moins une. */
  sq.campaigns=(sq.campaigns||[]).map(function(c){
    return Object.assign(mkCampaign(),c,{kind:KIND_BY_KEY[c.kind]?c.kind:"custom"});
  });
  if(!sq.campaigns.length)sq.campaigns.push(mkCampaign({kind:"tryout"}));
  var legacyCampaignId=sq.campaigns[0].id,campKnown={};
  sq.campaigns.forEach(function(c){campKnown[c.id]=c});
  if(!campKnown[sq.activeCampaignId])sq.activeCampaignId=sq.campaigns[sq.campaigns.length-1].id;

  sq.playerIds=(sq.playerIds||[]).filter(function(pid){return inRoster[pid]});
  sq.lineup=(sq.lineup||[]).filter(function(pid){return sq.playerIds.indexOf(pid)!==-1});
  sq.subteams=(sq.subteams||[]).map(function(st){
    return {id:st.id||uid(),name:st.name||"Sous-équipe",
      playerIds:(st.playerIds||[]).filter(function(pid){return sq.playerIds.indexOf(pid)!==-1})};
  });
  var st={};Object.keys(sq.stats||{}).forEach(function(pid){if(inRoster[pid])st[pid]=normStats(sq.stats[pid])});
  sq.stats=st;
  sq.events=(sq.events||[]).map(function(ev){
    return Object.assign(mkEvent(),ev,{kind:EVENT_KINDS[ev.kind]?ev.kind:"league",date:dayOf(ev.date)||todayISO()});
  });
  sq.sessions=(sq.sessions||[]).map(function(se){
    return {id:se.id||uid(),name:se.name||"Session",date:se.date||nowISO(),
      day:dayOf(se.day||se.date)||todayISO(),
      opponent:se.opponent||guessOpponent(se.name||""),
      eventId:se.eventId||"",teamName:se.teamName||sq.name,
      result:(se.result&&se.result.sets)?{sets:se.result.sets.filter(function(x){
        return x&&isFinite(x.us)&&isFinite(x.them)}).map(function(x){
        return {us:Math.max(0,Math.round(x.us)),them:Math.max(0,Math.round(x.them))}})}:mkResult(),
      entries:(se.entries||[]).map(function(en){return {playerId:en.playerId,name:en.name||"",
        number:cleanNum(en.number),position:en.position||"",stats:normStats(en.stats)}})};
  });
  attachOrphanSessions(sq);
  /* Les réglages du score : normalisés une fois ici, pour qu'une sauvegarde
     d'avant leur existence reparte des valeurs par défaut sans rien casser. */
  sq.scoring=scoringOf(sq);
  sq.selectorViews=(sq.selectorViews||[]).map(function(v){
    v=Object.assign(mkSelectorView(),v);
    v.playerIds=(v.playerIds||[]).filter(function(pid){return inRoster[pid]});
