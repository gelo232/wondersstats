/* ══ §12 BIBLIOTHÈQUE DE COMPOSANTS ════════════════════════════════════
   Écrits une fois, ici, et appelés partout. Conventions communes, à
   respecter par tous les écrans qui s'appuient sur eux :

   · ES5 strict, tout le DOM par h(), aucune couleur littérale hors
     des constantes métier (§02) ;
   · AUCUN effet de bord : un composant rend un nœud, il n'écrit pas
     dans `state` et n'appelle jamais render(). Les rappels passés en
     options s'en chargent ;
   · toute cible interactive fait au moins 44 × 44 px, porte un
     aria-label quand son contenu est un emoji ou un chiffre, et ne
     dépend d'aucun :hover — il n'y en a pas au doigt.
   ══════════════════════════════════════════════════════════════════ */

/* ── tok · le jeton, cinq formes pour cinq axes ────────────────────
   tok(forme, def, opts)
     forme : "pill"  décision de sélection   (pastille ronde pleine)
             "box"   statut d'offre          (rectangle contouré, sans fond)
             "dot"   appartenance            (point + libellé, sans cadre)
             "bar"   nature d'événement      (étiquette à barre gauche)
             "score" issue de rencontre      (pavé de score)
     def   : {label, icon, color} — typiquement STATUSES[k],
             OFFER_STATUS[k], MEMBERSHIPS[k], EVENT_KINDS[k]
     opts  : {short:true} n'affiche que le glyphe, l'aria-label reste
   Deux formes différentes ne se confondent jamais, même de même teinte :
   c'est ce qui permet de lire « ✅ Retenue » et « ⏳ En attente » côte à
   côte sans hésiter, et de garder l'écran lisible en niveaux de gris. */
function tok(forme,def,opts){
  if(!def)return null;
  opts=opts||{};
  var c=def.color||"#94A3B8";
  var st={};
  if(forme==="pill"||forme==="score"){st.background=teinte(c);st.color=c;st.borderColor=voile(c)}
  else if(forme==="box"){st.color=c;st.borderColor=c}
  else if(forme==="bar"){st.borderLeftColor=c}
  else if(forme==="dot"){st.color=c}
  var texte=opts.short?null:(def.label||null);
  var kids=(forme==="dot")
    ? [h("i",{style:{background:c}}),texte]
    : [def.icon?h("span",{"aria-hidden":"true"},def.icon):null,texte];
  return h("span",{className:"tok tok-"+forme,style:st,
    "aria-label":def.label||null,title:def.label||null},kids);
}
/* Voiles calculés depuis une couleur métier dynamique. On garde la
   notation hexadécimale à 8 chiffres déjà employée par l'application. */
function teinte(c){return String(c)+"22"}   /* ~13 % — fond de jeton */
function voile(c){return String(c)+"55"}    /* ~33 % — bord de jeton */

/* La correspondance décision → tonalité de chip, une fois pour toutes. */
function toneOfStatus(s){
  return {selected:"ok",recalled:"warn",cut:"danger",candidate:null}[s]||null;
}
function toneOfOffer(s){
  return {pending:"warn",accepted:"ok",declined:"danger"}[s]||null;
}

/* ── chip · le jeton CLIQUABLE (filtre, tri, bascule) ───────────── */
function chip(opts){
  opts=opts||{};
  return h("button",{type:"button",
    className:"chip"+(opts.on?" on":"")+(opts.tone?" tone-"+opts.tone:"")+(opts.add?" add":""),
    "aria-pressed":opts.on?"true":"false",
    "aria-label":opts.ariaLabel||opts.label,
    onclick:opts.onclick||null},
    opts.icon?h("span",{"aria-hidden":"true"},opts.icon):null,opts.label);
}

/* ── card · le conteneur générique d'un bloc ─────────────────────
   card(opts, enfant1, enfant2, …) — enfants variadiques comme h()
   opts : {title, sub, right, tone:"accent|ok|warn|danger|eval",
           tight, flush} */
function card(opts,contenu){
  opts=opts||{};
  var kids=Array.prototype.slice.call(arguments,1);
  var cls="card"+(opts.tight?" tight":"")+(opts.flush?" flush":"")+
          (opts.tone?" is-"+opts.tone:"");
  var head=(opts.title||opts.right)
    ? h("div",{className:"card-head"},
        h("div",{className:"grow"},
          opts.title?h("h3",{className:"ellip"},opts.title):null,
          opts.sub?h("div",{className:"muted ellip"},opts.sub):null),
        opts.right||null)
    : null;
  return h("div",{className:cls},head,kids);
}

/* ── emptyState · un seul écran vide, deux tailles ───────────────
   Règle de rédaction : dire ce qui n'est pas là, pourquoi, et quoi
   faire maintenant — avec le bouton qui le fait. « Aucun résultat »
   tout seul est un défaut. */
function emptyState(opts){
  opts=opts||{};
  return h("div",{className:"empty"+(opts.small?" sm":""),role:"status"},
    opts.icon?h("div",{className:"e-ico","aria-hidden":"true"},opts.icon):null,
    h("h2",null,opts.title),
    opts.sub?h("p",null,opts.sub):null,
    opts.action?h("div",{className:"e-act"},opts.action):null);
}

/* ── kpi · une mesure, sa valeur, son unité, sa tendance ─────────
   La flèche EST l'information ; la couleur ne fait que la confirmer,
   pour le daltonisme comme pour le plein soleil. */
function kpi(opts){
  opts=opts||{};
  var d=opts.delta;
  var sens=(d==null||Math.abs(d)<0.05)?"flat":(d>0?"up":"down");
  var fleche={up:"↗",down:"↘",flat:"→"}[sens];
  var inner=[
    h("div",{className:"k-lbl"},opts.label),
    h("div",{className:"k-val"},String(opts.value),
      opts.unit?h("span",{className:"k-unit"},opts.unit):null),
    (d!=null)?h("div",{className:"k-trend"},fleche," ",fmtDelta(d))
            :(opts.hint?h("div",{className:"muted ellip"},opts.hint):null)];
  var cls="kpi "+sens+(opts.onclick?" is-tap":"");
  if(!opts.onclick)return h("div",{className:cls},inner);
  return h("button",{className:cls,type:"button",onclick:opts.onclick,
    "aria-label":opts.label+" : "+opts.value+(opts.unit||"")+
      (d!=null?(", variation "+fmtDelta(d)):"")},inner);
}
function kpiInline(val,lbl){
  return h("div",{className:"kpiInline"},h("b",null,String(val)),
    lbl?h("span",null,lbl):null);
}

/* ── bar · jauge de progression ──────────────────────────────────
   bar({label, value, max, goal, state:"reached|running|down", text})
   Le repère de cible est un trait clair, pas une couleur de plus ;
   la flèche de tendance et la valeur chiffrée sont solidaires de la
   jauge, jamais laissées à la couleur seule. */
function bar(opts){
  opts=opts||{};
  var max=opts.max||1;
  var pct=Math.max(0,Math.min(100,((opts.value||0)/max)*100));
  var st=opts.state||"running";
  var fleche={reached:"↗",running:"→",down:"↘"}[st]||"→";
  var track=h("span",{className:"b-track"},
    h("i",{className:"b-fill",style:{width:pct+"%"}}),
    (opts.goal!=null)?h("span",{className:"b-goal",
      style:{left:Math.max(0,Math.min(100,(opts.goal/max)*100))+"%"}}):null);
  return h("div",{className:"bar st-"+st,role:"img",
    "aria-label":(opts.label||"")+" : "+(opts.text||(Math.round(pct)+" %"))+
      (opts.goal!=null?(", cible "+opts.goal):"")},
    opts.label?h("span",{className:"b-lbl"},opts.label):null,
    track,
    h("span",{className:"b-val"},opts.text||(Math.round(pct)+" %")),
    h("span",{className:"b-trend","aria-hidden":"true"},fleche));
}

/* ── segmented · 2 à 4 choix exclusifs qui restent visibles ──────
   Au-delà de 4 choix, c'est un filtre de listToolbar, pas un segmented. */
function segmented(opts){
  opts=opts||{};
  return h("div",{className:"seg",role:"tablist","aria-label":opts.label||"Choix"},
    (opts.options||[]).map(function(o){
      var on=opts.value===o.k;
      return h("button",{className:on?"on":"",type:"button",role:"tab",
        "aria-selected":on?"true":"false",
        onclick:function(){if(!on&&opts.onpick)opts.onpick(o.k)}},o.l);
    }));
}

/* ── metaStrip · au plus trois jetons sur la ligne 2 ─────────────
   Sans cette coupe, six badges poussent le nom hors de l'écran sur un
   375 px. Le 4ᵉ et les suivants se replient en « +N ». */
function metaStrip(list){
  var vis=(list||[]).filter(function(x){return !!x});
  if(!vis.length)return null;
  var head=vis.slice(0,3),reste=vis.length-head.length;
  if(reste>0)head.push(h("span",{className:"tok tok-pill tone-neutral"},"+"+reste));
  return h("div",{className:"rmeta"},head);
}

/* ── listRow · l'athlète dans une liste ──────────────────────────
   LE composant le plus répété de l'application, et celui qui décide
   de la lisibilité de la moitié des écrans. Il est figé : aucun écran
   ne s'en écarte.

   Budget de largeur, mesuré à 375 px, qui commande tout le reste :
     375 − 2×12 (gouttière) − 2×12 (padding) − 4 (liseré) − 44 (zone
     gauche) − 10 − 96 (zone droite) − 10  =  163 px pour l'identité.
   Un nom dépasse 163 px dès quinze caractères : le nom occupe donc sa
   ligne, seul, et tout le reste va en ligne 2.

   listRow(opts)
     lead      : nœud OU chaîne/nombre — numéro, case à cocher, initiales.
                 Une chaîne est enveloppée dans le pavé 44×44 `.lead`.
     name      : chaîne, OBLIGATOIRE — le nom complet, seul sur sa ligne.
     meta      : tableau de nœuds (jetons tok). Trois visibles au plus,
                 le reste se replie. Ordre de priorité quand il faut
                 couper : décision, offre (si ≠ acceptée), appartenance
                 (si ≠ active), score, poste, âge.
     trail     : UN nœud — une mesure (kpiInline) OU un bouton de 44 px,
                 jamais les deux.
     decision  : "selected|recalled|candidate|cut" → liseré gauche 4 px.
                 C'est ce liseré qu'on balaie du regard dans une liste
                 de quarante.
     picked    : booléen — ligne cochée.
     dim       : booléen — athlète partie.
     onclick   : ouvre la fiche. Le corps devient alors un <button>.
     ariaLabel : phrase lue par VoiceOver, sinon déduite du nom.
   Les trois boutons de décision ne sont PAS sur la ligne : 3 × 44 px
   = 132 px, soit plus que l'espace du nom. Ils vivent dans la fiche
   dépliée (segmented pleine largeur) ou en décision par lot, via
   l'actionBar du bas. */
function listRow(opts){
  opts=opts||{};
  var cls="listRow"+(opts.picked?" is-picked":"")+(opts.dim?" is-dim":"");
  var lead=null;
  if(opts.lead!=null)
    lead=(typeof opts.lead==="string"||typeof opts.lead==="number")
      ? h("div",{className:"lead"},String(opts.lead))
      : opts.lead;
  var body=h(opts.onclick?"button":"div",
    {className:"body",type:opts.onclick?"button":null,onclick:opts.onclick||null,
     "aria-label":opts.ariaLabel||(opts.onclick?("Ouvrir la fiche de "+opts.name):null)},
    h("div",{className:"rname"},opts.name),
    metaStrip(opts.meta));
  return h("div",{className:cls,"data-decision":opts.decision||null},
    lead,body,opts.trail?h("div",{className:"trail"},opts.trail):null);
}

/* Le champ numéro, tel qu'il doit être partout : 44×44, clavier
   numérique, bord rouge s'il est vide ou en double. */
function numField(entry,dupMap,onchange){
  var mauvais=!entry.number||(dupMap&&dupMap[entry.number]);
  var inp=h("input",{className:"lead"+(mauvais?" dup":""),
    value:entry.number||"",inputmode:"numeric",maxlength:"3",placeholder:"#",
    "aria-label":"Numéro de maillot"});
  inp.addEventListener("input",function(ev){
    entry.number=cleanNum(ev.target.value);ev.target.value=entry.number;
    scheduleAutoSave();
  });
  if(onchange)inp.addEventListener("blur",onchange);
  return inp;
}

/* ══ listToolbar · LE composant central des listes ══════════════════
   Toute liste de l'application passe par lui : recherche, tri (par
   numéro, nom, âge, résultat…) avec son sens, et filtres — dont le
   filtre par décision (STATUSES) et par statut d'offre (OFFER_STATUS).
   C'est le document de référence des six agents de partie : le contrat
   ci-dessous est un engagement, pas une indication.

   ─── Appel ────────────────────────────────────────────────────────
   var tb = listToolbar({
     key      : OBLIGATOIRE. La clé de CETTE liste — "sel-recap",
                "athletes", "training-sessions"… L'état (texte cherché,
                tri, filtres, repli) est mémorisé sous cette clé dans
                state.lists. Deux listes de clés différentes ne se
                contaminent donc jamais ; deux écrans qui partagent une
                clé partagent volontairement leur état.
     items    : le tableau source. Il n'est JAMAIS muté ni trié en place.
     search   : false, ou {placeholder, of:function(item){…}} où `of`
                rend le texte cherchable de l'item (nom + numéro, p.ex.).
                Sans `of`, la recherche est désactivée.
     sorts    : [{key, label, get:function(item){…}, dir:"asc"|"desc"}]
                `get` rend un nombre, une chaîne, ou null/undefined —
                les valeurs absentes ferment toujours la marche, quel
                que soit le sens. `dir` est le sens NATUREL du champ :
                "asc" par défaut pour une chaîne, "desc" pour un nombre.
                Un appui sur le tri actif inverse le sens ; sur un autre
                tri, on repart de son sens naturel — c'est ce que le
                doigt attend.
     filters  : [{key, label, options:[{k,l,icon,tone}],
                  get:function(item){return clé}}]
                L'option « Toutes » (k:"") est ajoutée d'office en tête.
                `get` rend la clé de l'item pour ce filtre. Un filtre à
                valeur "" laisse tout passer.
     count    : false pour masquer la ligne « n sur N ».
     rows     : function(liste){ return nœud | tableau de nœuds }
                MODE RECOMMANDÉ. listToolbar crée alors lui-même le
                conteneur de liste, exposé en `tb.list`, et ne remplace
                que ce conteneur à chaque frappe, chaque tri et chaque
                filtre — sans passer par render(). Sans cela le clavier
                se referme à chaque lettre.
     empty    : nœud ou fonction() → nœud, affiché quand `result` est
                vide alors que `items` ne l'est pas (filtre trop
                restrictif). Par défaut un emptyState court qui porte le
                bouton « Tout effacer ».
     extra    : nœud posé en fin de barre de tri (un segmented de
                portée, p.ex.).
     onchange : rappel(state) après toute modification. Facultatif ;
                sans `rows`, c'est à lui d'appeler render().
   })

   ─── Ce que l'appel rend ──────────────────────────────────────────
     tb          le nœud `.listToolbar` — à placer dans la zone FIXE de
                 l'écran (étages 4-5-6 du gabarit), jamais dans .content
     tb.list     le nœud conteneur des lignes — à placer DANS .content
                 (n'existe que si `rows` a été fourni)
     tb.result   le tableau filtré-cherché-trié, dans l'ordre d'affichage
     tb.lstate   l'état vivant de la liste : {q, sort, dir, filters, open}
     tb.refresh()  redessine la barre et la liste sur place, sans render()

   ─── Ordre d'application, garanti ─────────────────────────────────
     1. recherche (insensible à la casse et aux accents)
     2. filtres (tous doivent passer : ET, jamais OU)
     3. tri, puis sens
   ─── Ce qu'il ne fait pas ─────────────────────────────────────────
     Il n'écrit rien d'autre que state.lists[key], n'appelle jamais
     saveNow(), et ne rend jamais la liste elle-même : les lignes sont
     à l'appelant, via `rows`. Un tri ou un filtre ne change JAMAIS la
     clé de défilement de l'écran : on veut rester à la même hauteur.
   ══════════════════════════════════════════════════════════════════ */
var SORT_NATUREL={name:"asc",number:"asc",age:"asc",score:"desc",result:"desc",date:"desc"};

/* L'état d'une liste, par clé. Volatile : il voyage dans le cadre de
   navigation (§13), pas dans le coffre. */
function listState(key){
  if(!state.lists)state.lists={};
  if(!state.lists[key])state.lists[key]={q:"",sort:null,dir:null,filters:{},open:false};
  return state.lists[key];
}
function listReset(key){
  var st=listState(key);
  st.q="";st.filters={};
  return st;
}
/* Nombre de filtres réellement actifs — sert le compteur du repli. */
function listActiveCount(cfg){
  var st=listState(cfg.key),n=0;
  (cfg.filters||[]).forEach(function(f){if(st.filters[f.key])n++});
  if(st.q)n++;
  return n;
}
/* Comparaison tolérante : accents et casse ignorés, ce qui est la
   seule façon de trouver « Tremblay » en tapant « tremblay ». */
function normTexte(s){
  s=String(s==null?"":s).toLowerCase();
  if(s.normalize)s=s.normalize("NFD").replace(/[̀-ͯ]/g,"");
  return s;
}
/* listApply(cfg) — la même chaîne que listToolbar, sans interface.
   Utile à un écran qui veut le résultat sans barre (liste courte). */
function listApply(cfg){
  cfg=cfg||{};
  var st=listState(cfg.key);
  var out=(cfg.items||[]).slice();
  var of=cfg.search&&cfg.search.of;
  if(st.q&&of){
    var q=normTexte(st.q);
    out=out.filter(function(it){return normTexte(of(it)).indexOf(q)!==-1});
  }
  (cfg.filters||[]).forEach(function(f){
    var v=st.filters[f.key];
    if(!v)return;
    out=out.filter(function(it){return String(f.get(it))===String(v)});
  });
  var sorts=cfg.sorts||[];
  var actif=null;
  for(var i=0;i<sorts.length;i++)if(sorts[i].key===st.sort)actif=sorts[i];
  if(actif){
    var dir=st.dir||actif.dir||SORT_NATUREL[actif.key]||"asc";
    var signe=(dir==="asc")?1:-1;
    /* On indexe avant de trier : Array.prototype.sort n'est stable que
       depuis ES2019, et l'iPad de prêt est plus vieux que ça. */
    var paires=out.map(function(it,idx){return {it:it,idx:idx,v:actif.get(it)}});
    paires.sort(function(a,b){
      var x=a.v,y=b.v;
      var xv=(x==null||x===""),yv=(y==null||y==="");
      if(xv&&yv)return a.idx-b.idx;
      if(xv)return 1;                    /* les absents ferment la marche */
      if(yv)return -1;                   /* dans les deux sens            */
      var c;
      if(typeof x==="number"&&typeof y==="number")c=x-y;
      else c=String(x).localeCompare(String(y),"fr",{numeric:true});
      return c?c*signe:(a.idx-b.idx);
    });
    out=paires.map(function(pp){return pp.it});
  }
  return out;
}
function listToolbar(cfg){
  cfg=cfg||{};
  var key=cfg.key||"liste";
  var st=listState(key);
  var node=h("div",{className:"listToolbar"});
  var liste=cfg.rows?h("div",{className:"lt-list"}):null;
  node.list=liste;
  node.lstate=st;

  function majResultat(){
    node.result=listApply(cfg);
    return node.result;
  }
  function peindreListe(){
    if(!liste)return;
    liste.innerHTML="";
    var res=node.result;
    if(!res.length&&(cfg.items||[]).length){
      var vide=(typeof cfg.empty==="function")?cfg.empty():cfg.empty;
      liste.appendChild(vide||emptyState({icon:"🔍",title:"Aucun résultat",
        small:true,
        sub:"Aucune entrée ne correspond"+(st.q?" à « "+st.q+" »":" aux filtres posés")+
            ". Essayez autre chose, ou effacez les filtres.",
        action:h("button",{className:"btn btn-ghost sm",type:"button",
          onclick:function(){listReset(key);rafraichir()}},"Tout effacer")}));
      return;
    }
    var r=cfg.rows(res);
    (Array.isArray(r)?r:[r]).forEach(function(n){if(n)liste.appendChild(n)});
  }
  /* Le seul chemin de mise à jour : on refait la barre et la liste sur
     place. Un render() complet détruirait le champ de recherche, donc
     le focus, donc le clavier. */
  function rafraichir(){
    majResultat();
    peindre();
    peindreListe();
    if(cfg.onchange)cfg.onchange(st);
  }
  node.refresh=rafraichir;

  function peindre(){
    node.innerHTML="";
    var of=cfg.search&&cfg.search.of;
    if(of){
      var inp=h("input",{type:"search",value:st.q,
        placeholder:(cfg.search.placeholder||"Rechercher un nom ou un numéro…"),
        "aria-label":cfg.search.placeholder||"Rechercher",
        autocomplete:"off",autocorrect:"off",spellcheck:"false"});
      inp.addEventListener("input",function(ev){
        st.q=ev.target.value;
        majResultat();peindreListe();majCompteur();
        if(cfg.onchange)cfg.onchange(st);
      });
      node.appendChild(h("div",{className:"searchBar"},
        h("span",{className:"ico","aria-hidden":"true"},"🔍"),inp,
        st.q?h("button",{className:"clear",type:"button","aria-label":"Effacer la recherche",
          onclick:function(){st.q="";rafraichir()}},"✕"):null));
    }
    /* Filtres. Repliés par défaut dès qu'il y a plus d'un groupe ou
       plus de cinq pastilles : sinon la barre mange un tiers de
       l'écran d'un téléphone. */
    var groupes=cfg.filters||[];
    if(groupes.length){
      var pliable=groupes.length>1||(groupes[0].options||[]).length>5;
      var ouvert=pliable?!!st.open:true;
      var actifs=0;
      groupes.forEach(function(f){if(st.filters[f.key])actifs++});
      var tete=pliable?h("button",{className:"fb-head",type:"button",
        "aria-expanded":ouvert?"true":"false",
        onclick:function(){st.open=!ouvert;rafraichir()}},
        h("span",{"aria-hidden":"true"},"⚙︎"),
        h("span",{className:"grow"},"Filtres"),
        actifs?h("span",{className:"fb-count"},String(actifs)):null,
        h("span",{"aria-hidden":"true"},ouvert?"▴":"▾")):null;
      var corps=ouvert?h("div",{className:"fb-body"},
        groupes.map(function(f){
          var opts=[{k:"",l:"Toutes"}].concat(f.options||[]);
          return h("div",null,
            groupes.length>1?h("div",{className:"fb-lbl"},f.label):null,
            h("div",{className:"fb-group",role:"group","aria-label":f.label},
              opts.map(function(o){
                var on=(st.filters[f.key]||"")===o.k;
                return chip({label:o.l,icon:o.icon,tone:o.tone,on:on,
                  ariaLabel:f.label+" : "+o.l,
                  onclick:function(){st.filters[f.key]=on?"":o.k;rafraichir()}});
              })));
        }),
        actifs?h("button",{className:"fb-reset",type:"button",
          onclick:function(){listReset(key);rafraichir()}},"Tout effacer"):null):null;
      node.appendChild(h("div",{className:"filterBar"},tete,corps));
    }
    /* Tris. La barre n'apparaît pas sous onze entrées : au-dessous, on
       voit toute la liste, et trier ne sert à rien. */
    var sorts=cfg.sorts||[];
    if(sorts.length&&(cfg.items||[]).length>10){
      node.appendChild(h("div",{className:"sortBar",role:"group","aria-label":"Trier la liste"},
        h("span",{className:"sb-lead"},"Trier"),
        sorts.map(function(o){
          var on=st.sort===o.key;
          var dir=st.dir||o.dir||SORT_NATUREL[o.key]||"asc";
          var suivant=on?(dir==="asc"?"desc":"asc"):(o.dir||SORT_NATUREL[o.key]||"asc");
          return h("button",{className:"sortBtn"+(on?" on":""),type:"button",
            "aria-pressed":on?"true":"false",
            "aria-label":"Trier par "+o.label+(on?(dir==="asc"?", croissant":", décroissant"):""),
            onclick:function(){st.sort=o.key;st.dir=suivant;rafraichir()}},
            o.label,on?h("span",{className:"dir","aria-hidden":"true"},dir==="asc"?"↑":"↓"):null);
        }),
        cfg.extra||null));
    } else if(cfg.extra){
      node.appendChild(h("div",{className:"sortBar"},cfg.extra));
    }
    if(cfg.count!==false){
      var cpt=h("div",{className:"lt-count"},
        node.result.length+" sur "+(cfg.items||[]).length);
      cpt.id="lt-count-"+key;
      node.appendChild(cpt);
    }
  }
  function majCompteur(){
    var cpt=node.querySelector(".lt-count");
    if(cpt)cpt.textContent=node.result.length+" sur "+(cfg.items||[]).length;
  }

  majResultat();peindre();peindreListe();
  return node;
}

/* ── bottomActionBar · l'action principale, à portée de pouce ────
   Frère de .content dans la colonne flex, jamais en position:absolute :
   c'est ce qui garantit que la dernière ligne de la liste n'est pas
   cachée derrière elle, sans compensation de padding.
   Une seule action principale, une secondaire au plus. Trois boutons
   en bas d'écran, c'est un menu déguisé : il va dans une feuille. */
function bottomActionBar(opts){
  opts=opts||{};
  return h("div",{className:"actionBar"},
    opts.note?h("div",{className:"ab-note"+(opts.noteTone==="warn"?" warn":"")},opts.note):null,
    h("div",{className:"ab-row"},
      (opts.count!=null)?h("div",{className:"ab-count",
        "aria-label":(opts.countLabel||"Sélection")+" : "+opts.count},String(opts.count)):null,
      opts.actions||null));
}

/* ── sheetShell · feuille du bas, et boîte centrée ───────────────
   sheetShell({title, buttons:[nœuds], variant:"center"|"sheet",
               onclose}, corps)
   La FEUILLE est le défaut pour toute liste, tout contenu qui défile,
   tout ce qui porte des actions de validation : elle monte du bas,
   colle au pouce, garde son titre en haut et ses boutons en bas
   pendant que le contenu défile. La boîte centrée reste pour les
   formulaires courts et les confirmations. */
function sheetShell(opts,corps){
  opts=opts||{};
  var feuille=opts.variant!=="center";
  var fermer=opts.onclose||closeModal;
  return h("div",{className:"scrim "+(feuille?"bottom":"center"),onclick:fermer},
    h("div",{className:"modal "+(feuille?"sheet":"box"),
      role:"dialog","aria-modal":"true","aria-label":opts.title,
      onclick:function(e){e.stopPropagation()}},
      h("div",{className:"m-head"},
        h("h3",{className:"ellip"},opts.title),
        h("button",{className:"m-close",type:"button","aria-label":"Fermer",
          onclick:fermer},"✕")),
      h("div",{className:"m-body"},corps),
      (opts.buttons&&opts.buttons.length)?h("div",{className:"m-foot"},opts.buttons):null));
}

/* ── Registre de modales ────────────────────────────────────────
   renderModal() ne connaît plus les types qu'il ne connaissait pas :
   il les cherche. Une modale neuve se déclare à côté de l'écran qui
   l'ouvre, au lieu d'allonger une fonction de dix-sept cents lignes
   que tout le monde voudrait toucher en même temps. Les types
   hérités continuent de passer par le corps historique.

   Le registre vit ICI, avec les composants, et non plus à côté de
   renderModal() : `defModal` s'appelle à l'exécution du fichier,
   depuis la partie qui déclare sa feuille. Déclaré après elles,
   `var MODALS={}` effaçait en silence ce qu'elles avaient inscrit
   — et la feuille ne s'ouvrait jamais. */
var MODALS={};
/* Les feuilles qui s'ouvrent sur du CONTENU, et non sur un formulaire :
   openModal() donne sinon le focus au premier champ trouvé, et un
   navigateur qui fait défiler jusqu'à lui ouvrirait la fiche d'une
   athlète sur la note de l'entraîneur, tout en bas, plutôt que sur la
   décision à prendre. */
var MODAL_NOFOCUS={};
function defModal(type,fn,opts){
  MODALS[type]=fn;
  if(opts&&opts.autofocus===false)MODAL_NOFOCUS[type]=true;
}

/* ── openConfirm / openPrompt · window.confirm disparaît ─────────
   Défaut B4 de l'AUDIT, et le plus grave de l'application : la boîte
   native est ignorée par plusieurs navigateurs en mode PWA autonome,
   où elle renvoie `false` sans rien afficher. L'action n'a alors
   jamais lieu, en silence — sur le chemin le plus destructeur de
   l'application. On la remplace par une confirmation maison, pilotée
   par `state` et rendue par render() comme les modales.

   openConfirm({
     title    : la question, courte et affirmative
     body     : ce que l'action change
     detail   : ce qu'elle NE change PAS — c'est ce second point qui
                évite les appels paniqués
     confirm  : LE VERBE, jamais « OK » ni « Oui » : au bord d'un
                terrain on lit le bouton avant la question
     tone     : "danger" si l'action détruit, sinon "primary"
     onconfirm: function(){}
   })                                                              */
function openConfirm(opts){state.confirm=opts||null;state.prompt=null;repeindreDialogues();}
function closeConfirm(){state.confirm=null;repeindreDialogues();}
function renderConfirm(){
  var c=state.confirm;if(!c)return null;
  var n=sheetShell({title:c.title,variant:"center",onclose:closeConfirm,
    buttons:[
      h("button",{className:"btn btn-ghost",type:"button",onclick:closeConfirm},c.cancel||"Annuler"),
      h("button",{className:"btn "+(c.tone==="danger"?"btn-danger":"btn-primary"),
        type:"button",id:"confirmOk",onclick:function(){
          var f=c.onconfirm;closeConfirm();if(f)f();
        }},c.confirm||"Confirmer")]},
    h("div",null,
      c.body?h("p",null,c.body):null,
      c.detail?h("p",null,c.detail):null));
  var box=n.querySelector(".modal");if(box)box.className+=" confirm";
  return n;
}
/* Saisie d'une valeur : même principe, un champ dans la boîte.
   Remplace promptAct. Le champ est focalisé hors du cycle de rendu. */
function openPrompt(opts){
  state.prompt=Object.assign({value:""},opts||{});state.confirm=null;
  repeindreDialogues();
  setTimeout(function(){
    var el=document.querySelector(".modal.prompt input");
    if(el&&!("ontouchstart" in window))el.focus();
  },40);
}
function closePrompt(){state.prompt=null;repeindreDialogues();}
function renderPrompt(){
  var p=state.prompt;if(!p)return null;
  var inp=h("input",{type:p.password?"password":"text",value:p.value||"",
    placeholder:p.placeholder||"","aria-label":p.label||p.title,
    autocomplete:"off",autocorrect:"off",spellcheck:"false"});
  inp.addEventListener("input",function(ev){p.value=ev.target.value});
  function valider(){
    var f=p.onconfirm,v=p.value;
    closePrompt();if(f)f(v);
  }
  inp.addEventListener("keydown",function(ev){if(ev.key==="Enter")valider()});
  var n=sheetShell({title:p.title,variant:"center",onclose:closePrompt,
    buttons:[
      h("button",{className:"btn btn-ghost",type:"button",onclick:closePrompt},p.cancel||"Annuler"),
      h("button",{className:"btn btn-primary",type:"button",id:"promptOk",
        onclick:valider},p.confirm||"Valider")]},
    h("div",null,
      p.body?h("p",{className:"muted",style:{marginBottom:"10px"}},p.body):null,
      p.label?h("div",{className:"field"},h("label",null,p.label)):null,
      inp));
  var box=n.querySelector(".modal");if(box)box.className+=" prompt";
  return n;
}
/* Les dialogues vivent hors du cycle de rendu des écrans : on les
   repeint seuls, faute de quoi ouvrir une confirmation depuis un champ
   de saisie détruirait ce champ — et le clavier avec. L'écran de garde
   les accueille aussi : « effacer les données de cet appareil » s'y
   confirme, et sans cela le bouton ne ferait plus rien. */
function repeindreDialogues(){
  var app=document.getElementById("app");if(!app)return;
  var vieux=app.querySelectorAll(".scrim.dlg");
  for(var i=0;i<vieux.length;i++)vieux[i].parentNode.removeChild(vieux[i]);
  var n=renderConfirm()||renderPrompt();
  if(n){n.className+=" dlg";app.appendChild(n)}
}

/* ── showToast · confirmer sans interrompre ──────────────────────
   Il vit hors du cycle de rendu et ne détruit donc pas le focus. Il
   descend au pouce (il était en haut, le plus loin possible du regard
   et de la main) et peut porter une action « Annuler » branchée sur
   doUndo : un geste pour l'utilisateur pressé, là où une confirmation
   en coûte un à chacun, y compris quand tout va bien.
   L'ancienne signature (msg, durée) reste acceptée. */
function showToast(msg,opts){
  if(typeof opts==="number")opts={duree:opts};
  opts=opts||{};
  state.toast=msg;
  var app=document.getElementById("app");if(!app)return;
  var old=app.querySelector(".toast");if(old)old.parentNode.removeChild(old);
  var el=h("div",{className:"toast"+(opts.tone?" "+opts.tone:""),
    role:"status","aria-live":"polite"},
    h("span",{className:"grow"},msg),
    opts.action?h("button",{className:"t-act",type:"button",
      onclick:function(){if(el.parentNode)el.parentNode.removeChild(el);opts.action.onclick()}},
      opts.action.label):null);
  app.appendChild(el);
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){
    state.toast=null;
    var t=app.querySelector(".toast");if(t&&t.parentNode)t.parentNode.removeChild(t);
    toastTimer=null;
  },opts.duree||(opts.action?5200:2600));
}

/* ══════════════════════════════════════════════════════════════
   ONGLET SAISON — sélection · équipes · saisons
   ══════════════════════════════════════════════════════════════ */

/* ── Route ─────────────────────────────────────────────────────
   Une destination se dit en quatre mots : la partie, la section,
   l'objet, le détail. `legacy` désigne les écrans qui n'ont pas
   encore rejoint une partie — la saisie, qui est un mode plein
   écran rattaché à une rencontre, et non un onglet. */
function mkRoute(part,section,id,sub){
  return {part:part||"season",section:section||null,id:id||null,sub:sub||null};
}
function navTo(r){
  if(!r)return;
  if(r.part==="legacy"){
    state.tab=r.section||"season";
    state.seasonSection=null;
  } else {
    state.tab=r.part;
    state.seasonSection=SECTION_BY_KEY[r.section]?r.section:null;
  }
  state.sortBy=null;state.pickMode=null;state.picked=[];
  saveNow();render();
}
/* Remonter d'un cran : d'une partie au tableau de bord, du tableau
   de bord nulle part — la saison est la racine. */
function navUp(){
  if(state.tab!=="season"){navTo(mkRoute("season"));return}
  if(seasonSection()){navBackToHub();return}
}

/* ══════════════════════════════════════════════════════════════
   §13  SAISON — COQUILLE ET TABLEAU DE BORD

   La saison porte six parties. La barre du bas n'en porte aucune :
   elle porte les trois AXES de l'application — la saison, les
   athlètes, les réglages. À 375 px, six onglets font 62 px chacun
   et quatre libellés sur six se tronquent ; et une barre d'onglets
   annonce des axes, pas des contenus.

   Les six parties vivent donc dans un tableau de bord, une tuile
   chacune, portant son chiffre du moment : ce qui reste à trancher,
   ce qui a été joué, où en sont les objectifs. Une tuile qui n'a
   rien à dire le dit aussi — c'est ce qui montre par où commencer.
   ══════════════════════════════════════════════════════════════ */

/* Les anciens onglets entraîneur — saisie, récap, sélection — ne
   paraissent plus dans la barre, mais restent des écrans que l'on
   ouvre : la saisie est un mode plein écran rattaché à une
   rencontre, et les deux autres survivent jusqu'à ce que leur
   partie les reprenne. Le garde-fou de render() doit donc les
   laisser passer, sans quoi state.tab retomberait sur « saison »
   au premier rendu. */
var COACH_MODES={input:true,summary:true,selection:true};

function seasonSection(){
  return SECTION_BY_KEY[state.seasonSection]?state.seasonSection:null;
}
function navToSection(k){
  state.seasonSection=SECTION_BY_KEY[k]?k:null;
  state.tab="season";
  state.sortBy=null;state.pickMode=null;state.picked=[];
  saveNow();render();
}
function navBackToHub(){
  state.seasonSection=null;
  state.sortBy=null;state.pickMode=null;state.picked=[];
  saveNow();render();
}

/* Le chiffre d'une tuile. Ce n'est pas un compteur d'objets : c'est
   ce qu'un entraîneur veut savoir sans ouvrir — ce qui l'attend. */
function sectionSummary(sq,k){
  if(!sq)return {val:"—",sub:"",tone:""};
  var i,n;
  if(k==="selection"){
    var camp=curCampaign(sq);
    /* Aucune convoquée : c'est le premier geste de la saison, et la
       tuile doit le dire — un tableau de bord qui n'indique pas par
       où commencer laisse l'entraîneur devant six portes closes. */
    if(!(sq.roster||[]).length)return {val:"—",sub:"convoquer des athlètes",tone:"warn"};
    var aTrancher=camp?rosterOfCampaign(sq,camp.id).filter(function(e){return !e.decision}).length:0;
    var attente=(sq.offers||[]).filter(function(o){return o.status==="pending"&&offerIsLive(o)}).length;
    if(attente)return {val:String(attente),sub:plural(attente,"offre")+" en attente",tone:"warn"};
    if(aTrancher)return {val:String(aTrancher),sub:plural(aTrancher,"athlète")+" à trancher",tone:"warn"};
    n=(sq.campaigns||[]).length;
    return {val:String(n),sub:plural(n,"campagne"),tone:""};
  }
  if(k==="goals"){
    var actifs=0,atteints=0,recul=0;
    (sq.goals||[]).forEach(function(g){
      if(!g.active)return;
      actifs++;
      if(g.achievedAt)atteints++;
      if(g.regressedAt)recul++;
    });
    if(!actifs)return {val:"—",sub:"aucun objectif fixé",tone:""};
    return {val:atteints+"/"+actifs,sub:recul?plural(recul,"régression"):"objectifs atteints",
            tone:recul?"warn":"ok"};
  }
  if(k==="recap"){
    n=(sq.playerIds||[]).length;
    var joues=(sq.sessions||[]).length;
    return {val:String(n),sub:n?plural(joues,"relevé"):"équipe à constituer",tone:""};
  }
  /* Les trois parties de rencontres se lisent toutes pareil. */
  var evs=eventsOfSection(sq,k),ses=sessionsOfSection(sq,k);
  if(k==="tournaments")
    return {val:String(evs.length),sub:evs.length?plural(ses.length,"match")+" joué(s)":"aucun tournoi",tone:""};
  if(k==="training")
    return {val:String(ses.length),sub:ses.length?"séances relevées":"aucune séance",tone:""};
  /* Matchs : le bilan dit plus que le nombre. */
  var v=0,d=0,nul=0;
  ses.forEach(function(se){
    var o=resultOutcome(se.result);
    if(o==="win")v++;else if(o==="loss")d++;else if(o==="draw")nul++;
  });
  if(!ses.length)return {val:"0",sub:"aucun match",tone:""};
  return {val:v+"–"+d+(nul?"–"+nul:""),sub:plural(ses.length,"match")+" joué(s)",tone:v>d?"ok":(d>v?"bad":"")};
}

function renderSeasonHub(sq){
  var wrap=h("div",null);
  wrap.appendChild(h("div",{className:"hint"},
    "La saison se lit en six temps. Chaque tuile porte ce qui vous attend de son côté — ",
    "ouvrez celle qui a quelque chose à dire."));
  var grille=h("div",{className:"hubGrid"});
  SEASON_SECTIONS.forEach(function(s){
    var r=sectionSummary(sq,s.key);
    var tuile=h("button",{className:"hubTile"+(r.tone?" "+r.tone:""),type:"button",
      "aria-label":s.label+" — "+r.val+" "+(r.sub||""),
      onclick:function(){navToSection(s.key)}},
      h("span",{className:"ht-ico","aria-hidden":"true"},s.icon),
      h("span",{className:"ht-lbl"},s.label),
      h("span",{className:"ht-val"},r.val),
      h("span",{className:"ht-sub"},r.sub||""));
    grille.appendChild(tuile);
  });
  wrap.appendChild(grille);
  return wrap;
}

/* En-tête d'une partie : le retour porte le nom de son parent, et
   non une flèche seule — on doit savoir où l'on retombe avant
   d'appuyer. */
function partHeader(titre,sousTitre,actions){
  return h("div",{className:"partHead"},
    h("button",{className:"ph-back",type:"button","aria-label":"Retour à la saison",
      onclick:navBackToHub},"← Saison"),
    h("div",{className:"ph-body"},
      h("div",{className:"ph-ttl"},titre),
      sousTitre?h("div",{className:"ph-sub"},sousTitre):null),
    actions?h("div",{className:"ph-act"},actions):null);
}

/* L'aiguillage de la saison : le tableau de bord, ou une partie. */
function renderSeasonTab(){
  var sq=curSquad();
  if(!sq)return emptyBlock("🗓️","Aucune saison","Créez une saison pour démarrer : convocation des athlètes, sélection, équipe.",
    h("button",{className:"btn btn-primary",onclick:function(){openModal("newseason")}},"+ Créer une saison"));
  var k=seasonSection();
  if(!k)return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},
    h("div",{className:"content pad","data-scroll-key":"season-hub"},renderSeasonHub(sq)));
  var f=SECTION_RENDER[k];
  return f?f(sq):renderSeasonHub(sq);
}

/* ══════════════════════════════════════════════════════════════
   §14 à §19 — LES SIX PARTIES DE LA SAISON

   Chaque partie a sa zone, bornée par son bandeau. Une partie ne
   lit jamais dans la zone d'une autre : ce qu'elles partagent est
   en §04 (accès et dérivations) et en §12 (composants).

   Les coquilles ci-dessous délèguent aux écrans existants tant
   qu'une partie n'est pas écrite : l'application reste entière à
   chaque étape, et aucune fonction n'est perdue en chemin.
   ══════════════════════════════════════════════════════════════ */

/* ══ §14 PARTIE SÉLECTION ══════════════════════════════════════
   La sélection n'est pas un écran : c'est une suite de CAMPAGNES —
   journée 1, journée 2, extra — et chacune porte SON déroulement.
   Convoquées, vues, soumissions et récap appartiennent à la campagne
   ouverte, et à elle seule : deux campagnes ne mélangent jamais
   leurs listes, pas plus que leurs moyennes.

   FORME RETENUE : un sélecteur de campagne en tête de partie, et non
   une liste de campagnes dont on ouvrirait une. Trois raisons :
     · la navigation reste à DEUX niveaux — tableau de bord, puis
       partie. Une liste à ouvrir en ajouterait un troisième, et
       chaque aller-retour entre le récap et les soumissions coûterait
       deux appuis de plus, vingt fois par soirée de tryout ;
     · la campagne active reste VISIBLE en permanence, sur les quatre
       volets. C'est la seule garantie qu'on ne tranche pas la journée
       1 en croyant trancher la journée 2 — une erreur qu'aucun écran
       ne rattrape après coup ;
     · changer de moment devient un geste : on bascule de campagne
       sans quitter le volet où l'on travaille, et le volet se
       recharge sous la même barre.
   La liste des campagnes n'a pas disparu : elle vit dans la feuille
   qu'ouvre le sélecteur, avec la création, le renommage, la clôture
   et la formule du score. Ce sont des gestes de préparation, faits
   une fois ; leur place n'est pas sur le chemin quotidien.
   ══════════════════════════════════════════════════════════════ */

/* Les quatre volets, dans l'ordre du déroulement d'une campagne :
   on convoque, on fait évaluer, on reçoit, on tranche. Le récap est
   au centre parce que c'est là qu'on passe le plus de temps — et
   c'est lui qui s'ouvre par défaut. */
var SEL_PANES=[{k:"roster",l:"👥 Convoquées"},{k:"recap",l:"⚖️ Récap"},
               {k:"views",l:"🎯 Vues"},{k:"subs",l:"📥 Soumissions"}];
function selPaneKey(){
  for(var i=0;i<SEL_PANES.length;i++)if(SEL_PANES[i].k===state.selPane)return state.selPane;
  return "recap";
}
function selGoPane(k){
  state.selPane=k;state.pickMode=null;state.picked=[];render();
}
/* Changer de campagne active. `evalCampaignId` suit, parce que les
   écrans qui compilent hors de la partie — « Appliquer les avis », le
   récap global — le lisent : deux notions de « campagne courante »
   finiraient par diverger, et personne ne saurait laquelle croire. */
function setActiveCampaign(sq,cid){
  if(!sq||!campaignById(sq,cid))return;
  sq.activeCampaignId=cid;
  state.evalCampaignId=cid;
  state.pickMode=null;state.picked=[];
  state.expandedPlayerId=null;
  saveNow();render();
}

/* L'avancement d'une campagne, en trois chiffres et dans l'ordre du
   travail : combien sont attendues, combien ont été vues, combien
   sont tranchées. C'est ce qu'un entraîneur regarde avant de décider
   s'il peut clore sa soirée. */
function campaignProgress(sq,cid,comp){
  var out={convoquees:0,evaluees:0,tranchees:0,attente:0};
  if(!sq||!cid)return out;
  comp=comp||compileSubmissions(sq,cid);
  rosterOfCampaign(sq,cid).forEach(function(e){
    out.convoquees++;
    var c=comp[e.playerId];
    if(c&&c.n)out.evaluees++;
    if(e.decision)out.tranchees++;
  });
  offersOfCampaign(sq,cid).forEach(function(o){if(o.status==="pending")out.attente++});
  return out;
}
function campaignProgressText(pr){
  return plural(pr.convoquees,"convoquée")+" · "+pr.evaluees+" évaluée"+(pr.evaluees>1?"s":"")+
         " · "+pr.tranchees+" tranchée"+(pr.tranchees>1?"s":"");
}

/* La barre de campagne. Elle n'est pas dans le contenu qui défile :
   elle reste sous les yeux, quel que soit le volet et quelle que soit
   la hauteur de la liste. */
function renderCampaignBar(sq,camp){
  var pr=camp?campaignProgress(sq,camp.id):null;
  var k=camp?(KIND_BY_KEY[camp.kind]||KIND_BY_KEY.custom):null;
  return h("div",{className:"campBar"},
    h("button",{className:"cb-pick",type:"button",
      "aria-label":"Campagne ouverte : "+(camp?camp.name:"aucune")+
        (pr?(", "+campaignProgressText(pr)):"")+". Changer de campagne",
      onclick:function(){openModal("campaigns")}},
      h("span",{className:"cb-ico","aria-hidden":"true"},k?k.icon:"📅"),
      h("span",{className:"cb-body"},
        h("span",{className:"cb-name"},camp?camp.name:"Aucune campagne"),
        h("span",{className:"cb-sub"},pr?campaignProgressText(pr):"à créer")),
      h("span",{className:"cb-arw","aria-hidden":"true"},"▾")),
    (camp&&camp.closedAt)?tok("box",{label:"Close",icon:"🔒",color:"#94A3B8"}):null);
}

/* L'aiguillage de la partie. Chaque volet rend {fixe, corps, barre} :
   la barre de liste doit rester HORS du contenu qui défile (contrat de
   listToolbar), et la barre d'action du bas appartient au volet, parce
   que l'action principale n'est pas la même selon qu'on convoque ou
   qu'on tranche. */
function renderPartSelection(sq){
  var camp=curCampaign(sq);
  var pane=selPaneKey();
  state.selPane=pane;
  var row=h("div",{className:"pill-row tight"},SEL_PANES.map(function(p){
    return h("button",{className:"pill"+(pane===p.k?" active":""),type:"button",
      "aria-label":p.l.replace(/^\S+\s/,"")+(pane===p.k?" (volet ouvert)":""),
      onclick:function(){selGoPane(p.k)}},p.l);
  }));
  var v;
  if(!camp){
    v={corps:emptyState({icon:"📅",title:"Aucune campagne",
      sub:"La sélection se déroule par campagnes : « Journée 1 », « Journée 2 », "+
          "« Extra »… Chacune porte ses convoquées, ses vues et son récap. Ouvrez la première.",
      action:h("button",{className:"btn btn-primary",type:"button",
        onclick:function(){openModal("newcampaign")}},"+ Nouvelle campagne")})};
  }
  else if(pane==="roster")v=renderConvokedPane(sq,camp);
  else if(pane==="views")v={corps:renderViewsPane(sq,camp.id)};
  else if(pane==="subs")v={corps:renderSubmissionsPane(sq,camp.id)};
  else v=renderCampaignRecapPane(sq,camp);

  var n=(sq.campaigns||[]).length;
  return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},
    partHeader("Sélection",n?plural(n,"campagne"):null),
    renderCampaignBar(sq,camp),
    row,
    v.fixe||null,
    h("div",{className:"content pad","data-scroll-key":"part-sel-"+pane},v.corps),
    v.barre||bottomActionBar({actions:[
      h("button",{className:"btn btn-primary full",type:"button",
        onclick:function(){openModal("buildteam")}},"👕 Constituer l'équipe")]}));
}

/* ── Ce que les deux listes d'athlètes de la partie partagent ──
   Convoquées et Récap montrent les mêmes athlètes sous deux angles.
   L'assemblage des lignes, les quatre tris et les deux filtres sont
   donc écrits UNE fois. Les CLÉS de liste, elles, restent distinctes
   — « sel-convoquees » et « sel-recap » — sans quoi trier l'une
   déplacerait l'autre sous le doigt de l'entraîneur. */
function selItems(sq,camp,comp){
  return rosterOfCampaign(sq,camp.id).map(function(ce){
    var pid=ce.playerId,p=playerById(pid),r=rosterEntry(sq,pid);
    var c=comp[pid]||null;
    return {ce:ce,entry:r,player:p,pid:pid,comp:c,
      offer:currentOffer(sq,pid),
      score:(c&&c.nRatings)?c.score:null,
      age:ageOf(p)};
  }).filter(function(x){return !!x.player&&!!x.entry});
}
/* Les quatre tris demandés. `get` peut rendre null : listApply range
   les absents en fin de liste, dans les deux sens. */
function selSorts(){
  return [
    {key:"number",label:"Numéro",get:function(x){
      var n=parseInt(x.entry.number,10);return isFinite(n)?n:null}},
    {key:"name",label:"Nom",get:function(x){return fullName(x.player)}},
    {key:"age",label:"Âge",get:function(x){return x.age}},
    {key:"score",label:"Résultat",get:function(x){return x.score}}
  ];
}
/* Les deux filtres demandés. La décision est celle de CETTE campagne —
   « À trancher » en fait partie, et c'est même le filtre qu'on rouvre
   trois fois par soirée. Le statut d'offre, lui, engage la saison :
   « Aucune » y est une valeur, pas un trou. */
function selFilters(){
  return [
    {key:"decision",label:"Décision",
     get:function(x){return x.ce.decision?RECO_TO_STATUS[x.ce.decision]:"todo"},
     options:[{k:"todo",l:"◻️ À trancher"}].concat(RECOS.map(function(r){
       var s=RECO_TO_STATUS[r.key];
       return {k:s,l:r.icon+" "+STATUSES[s].label,tone:toneOfStatus(s)};
     }))},
    {key:"offre",label:"Offre",
     get:function(x){return x.offer?x.offer.status:"none"},
     options:[{k:"none",l:"— Aucune"}].concat(OFFER_KEYS.map(function(k){
       return {k:k,l:OFFER_STATUS[k].icon+" "+OFFER_STATUS[k].label,tone:toneOfOffer(k)};
     }))}
  ];
}
/* Les jetons de la ligne 2, dans l'ordre de priorité du contrat de
   listRow : décision, offre, résultat, âge. Trois paraissent, le
   reste se replie en « +N ». */
function selMeta(x){
  var m=[];
  if(x.ce.decision&&STATUSES[RECO_TO_STATUS[x.ce.decision]])
    m.push(tok("pill",STATUSES[RECO_TO_STATUS[x.ce.decision]]));
  if(x.offer&&OFFER_STATUS[x.offer.status])m.push(tok("box",OFFER_STATUS[x.offer.status]));
  if(x.score!=null)m.push(tok("dot",{label:"★ "+x.score.toFixed(1),color:scoreColor(x.score)}));
  else if(x.comp&&x.comp.n)m.push(tok("dot",{label:plural(x.comp.n,"relevé"),color:"var(--txt-dim)"}));
  if(x.age!=null)m.push(tok("dot",{label:x.age+" ans",color:"var(--txt-dim)"}));
  return m;
}
function selSearch(){
  return {placeholder:"Rechercher un nom ou un numéro…",
    of:function(x){return fullName(x.player)+" "+(x.entry.number||"")}};
}
function selRowDecision(x){
  return x.ce.decision?RECO_TO_STATUS[x.ce.decision]:"candidate";
}

/* Le numéro se saisit dans la liste des convoquées, et nulle part
   ailleurs : c'est la seule information que verront les sélectionneurs,
   et la corriger depuis un autre écran serait un détour. Le changement
   est journalisé, et les vues DÉJÀ distribuées sont signalées — elles
   portent encore l'ancien dossard, et aucun rendu ne les rattrape. */
function selNumField(sq,entry,onDone){
  var avant=entry.number;
  return numField(entry,dupNumbers(sq),function(){
    if(entry.number!==avant){
      var p=playerById(entry.playerId);
      logAct("number",(p?fullName(p):"joueuse")+" : numéro "+(avant||"—")+" → "+(entry.number||"—"),
        {teamId:sq.teamId,seasonId:sq.seasonId,playerId:entry.playerId});
      var parties=vuesDistribuees(sq,entry.playerId);
      if(parties.length)showToast(parties.length===1
        ? "⚠️ Une vue déjà distribuée affiche encore #"+(avant||"—")+" — republiez-la"
        : "⚠️ "+parties.length+" vues déjà distribuées affichent encore #"+(avant||"—")+" — republiez-les",
        {duree:5000});
      avant=entry.number;
      scheduleAutoSave();
    }
    if(onDone)onDone();
  });
}
/* Cocher pour agir en lot. Une convocation se corrige rarement athlète
   par athlète : on retire le groupe B après un tryout, ou on répare une
   liste montée sur la mauvaise campagne. */
function selTogglePick(pid){
  if(state.pickMode!=="camp"){state.pickMode="camp";state.picked=[]}
  var i=state.picked.indexOf(pid);
  if(i===-1)state.picked.push(pid);else state.picked.splice(i,1);
  render();
}
function selPickLead(x){
  var coche=state.picked.indexOf(x.pid)!==-1;
  return h("button",{className:"lead pick"+(coche?" on":""),type:"button",
    "aria-pressed":coche?"true":"false",
    "aria-label":(coche?"Retirer ":"Choisir ")+fullName(x.player),
    onclick:function(){selTogglePick(x.pid)}},coche?"✓":(x.entry.number||"—"));
}

/* ══ Volet 1 · Convoquées ══════════════════════════════════════
   Qui est attendue au gymnase pour CETTE campagne. */
function renderConvokedPane(sq,camp){
  var comp=compileSubmissions(sq,camp.id);
  var items=selItems(sq,camp,comp);
  var pr=campaignProgress(sq,camp.id,comp);
  var ouverte=campaignOpen(sq,camp);
  var picking=state.pickMode==="camp";
  var corps=h("div",null);

  corps.appendChild(h("div",{className:"hint"},
    "Qui est attendue à ",h("b",null,camp.name),". Chaque campagne a sa propre liste : ",
    "convoquer ou retirer ici ne touche à aucune autre."));

  corps.appendChild(h("div",{className:"kpiGrid",style:{marginBottom:"12px"}},
    kpi({label:"Convoquées",value:pr.convoquees,
      hint:pr.convoquees?"attendues au gymnase":"personne pour l'instant"}),
    kpi({label:"Évaluées",value:pr.evaluees,
      hint:pr.convoquees?(pr.convoquees-pr.evaluees)+" sans relevé":"—"}),
    kpi({label:"Tranchées",value:pr.tranchees,
      hint:pr.convoquees?((pr.convoquees-pr.tranchees)+" à trancher"):"—"})));

  if(!ouverte)corps.appendChild(h("div",{className:"hint warn"},
    camp.closedAt?"🔒 Campagne close — la liste se consulte, elle ne se modifie plus."
                 :"🔒 Saison clôturée — la liste se consulte, elle ne se modifie plus."));

  if(!items.length){
    corps.appendChild(emptyState({icon:"👥",title:"Aucune athlète convoquée",
      sub:"Convoquez vos joueuses à « "+camp.name+" » : elles paraîtront ici, "+
          "avec leur numéro, puis dans le récap dès la première soumission.",
      action:h("button",{className:"btn btn-primary",type:"button",disabled:!ouverte,
        onclick:function(){state.modalSel=[];openModal("convoke")}},"👥 Convoquer des athlètes")}));
    return {corps:corps,barre:renderConvokedBar(sq,camp,items,ouverte)};
  }

  /* Ce qui empêche de distribuer une vue, dit là où on le corrige. */
  var dup=dupNumbers(sq),nDup=Object.keys(dup).length;
  var miss=items.filter(function(x){return !x.entry.number}).length;
  if(miss||nDup)corps.appendChild(h("div",{className:"hint warn"},
    "⚠️ "+(miss?plural(miss,"athlète")+" sans numéro. ":"")+
    (nDup?nDup+" numéro(s) en double. ":"")+
    "Le numéro se saisit dans la case de gauche. Chacun doit être unique : "+
    "c'est la seule information que verront vos sélectionneurs."));

  var tb=listToolbar({
    key:"sel-convoquees",
    items:items,
    search:selSearch(),
    sorts:selSorts(),
    filters:selFilters(),
    empty:function(){
      return emptyState({icon:"🔍",title:"Aucune convoquée ne correspond",small:true,
        sub:"Aucune athlète de cette campagne ne passe les filtres posés.",
        action:h("button",{className:"btn btn-ghost sm",type:"button",
          onclick:function(){listReset("sel-convoquees");tb.refresh()}},"Tout effacer")});
    },
    rows:function(res){
      return res.map(function(x){
        var coche=state.picked.indexOf(x.pid)!==-1;
        return listRow({
          lead:picking?selPickLead(x):selNumField(sq,x.entry,function(){tb.refresh()}),
          name:fullName(x.player),
          meta:selMeta(x),
          decision:selRowDecision(x),
          picked:picking&&coche,
          dim:x.entry.membership==="left",
          ariaLabel:picking?null:("Ouvrir la fiche de "+fullName(x.player)+" pour "+camp.name),
          onclick:picking?function(){selTogglePick(x.pid)}
                         :function(){openModal("selathlete",x.pid)}});
      });
    }
  });
  corps.appendChild(tb.list);
  return {fixe:tb,corps:corps,barre:renderConvokedBar(sq,camp,items,ouverte)};
}
function renderConvokedBar(sq,camp,items,ouverte){
  if(state.pickMode==="camp"){
    var n=state.picked.length;
    return bottomActionBar({
      count:n,countLabel:"Athlètes cochées",
      note:n?"Le retrait emporte la décision prise ici et annule l'offre encore en attente."
            :"Cochez les athlètes à retirer de cette campagne.",
      noteTone:n?"warn":null,
      actions:[
        h("button",{className:"btn btn-ghost",type:"button",onclick:function(){
          state.pickMode=null;state.picked=[];render();
        }},"Quitter"),
        h("button",{className:"btn btn-danger primary",type:"button",disabled:!n,
          onclick:function(){selRetirerConvocations(sq,camp)}},"Retirer la convocation")]});
  }
  return bottomActionBar({actions:[
    h("button",{className:"btn btn-primary full",type:"button",disabled:!ouverte,
      onclick:function(){state.modalSel=[];openModal("convoke")}},"👥 Convoquer des athlètes"),
    (items.length&&ouverte)?h("button",{className:"btn btn-ghost",type:"button",
      onclick:function(){state.pickMode="camp";state.picked=[];render()}},"Choisir"):null]});
}
function selRetirerConvocations(sq,camp){
  var pids=state.picked.slice();
  if(!pids.length)return;
  var tranchees=0;
  pids.forEach(function(pid){
    var e=campaignEntry(sq,camp.id,pid);
    if(e&&e.decision)tranchees++;
  });
  openConfirm({
    title:"Retirer "+plural(pids.length,"convocation")+" de « "+camp.name+" » ?",
    body:"Ces athlètes sortent de cette campagne"+
      (tranchees?" — "+plural(tranchees,"décision")+" prise(s) ici s'en va(vont) avec elles, "+
                 "et les offres encore en attente sont annulées":"")+".",
    detail:"Leur fiche, leurs statistiques, leurs matchs et les autres campagnes où elles "+
           "figurent ne bougent pas. Une offre déjà acceptée ou archivée reste ce qu'elle est.",
    confirm:"Retirer",tone:"danger",
    onconfirm:function(){
      pids.forEach(function(pid){unconvokeFromCampaign(sq,camp.id,pid)});
      logAct("roster",plural(pids.length,"convocation")+" retirée(s) — "+campaignLabel(camp),
        {teamId:sq.teamId,seasonId:sq.seasonId});
      state.pickMode=null;state.picked=[];
      saveNow();
      showToast("👥 "+plural(pids.length,"convocation")+" retirée(s)",{tone:"ok"});
      render();
    }});
}

/* ══ Volet 2 · Récap ═══════════════════════════════════════════
   Le cœur de la partie : ce que les évaluateurs ont rendu, compilé
   athlète par athlète, et la décision qui s'ensuit. */
function renderCampaignRecapPane(sq,camp){
  var comp=compileSubmissions(sq,camp.id);
  var items=selItems(sq,camp,comp);
  var corps=h("div",null);

  corps.appendChild(h("div",{className:"hint"},
    "Le récap de ",h("b",null,camp.name),". Ouvrez une athlète pour lire ses soumissions, ",
    "voir d'où vient son score, et trancher."));

  if(!items.length){
    corps.appendChild(emptyState({icon:"👥",title:"Aucune athlète convoquée",
      sub:"Convoquez vos joueuses à « "+camp.name+" » : le récap se remplit "+
          "dès la première soumission reçue.",
      action:h("button",{className:"btn btn-primary",type:"button",
        onclick:function(){selGoPane("roster")}},"👥 Voir les convoquées")}));
    return {corps:corps,barre:renderRecapBar(sq,camp,items)};
  }

  var tb=listToolbar({
    key:"sel-recap",
    items:items,
    search:selSearch(),
    sorts:selSorts(),
    filters:selFilters(),
    empty:function(){
      return emptyState({icon:"🔍",title:"Aucune athlète ne correspond",small:true,
        sub:"Aucune convoquée de cette campagne ne passe les filtres posés.",
        action:h("button",{className:"btn btn-ghost sm",type:"button",
          onclick:function(){listReset("sel-recap");tb.refresh()}},"Tout effacer")});
    },
    rows:function(res){
      return res.map(function(x){
        var c=x.comp;
        return listRow({
          lead:x.entry.number||"—",
          name:fullName(x.player),
          meta:selMeta(x),
          decision:selRowDecision(x),
          dim:x.entry.membership==="left",
          trail:kpiInline(x.score!=null?x.score.toFixed(1):"—",
                          (c&&c.nRatings)?plural(c.nRatings,"note"):"sans note"),
          ariaLabel:"Ouvrir le récap de "+fullName(x.player)+" pour "+camp.name,
          onclick:function(){openModal("selathlete",x.pid)}});
      });
    }
  });
  corps.appendChild(tb.list);
  return {fixe:tb,corps:corps,barre:renderRecapBar(sq,camp,items)};
}
function renderRecapBar(sq,camp,items){
  var aTrancher=0;
  items.forEach(function(x){if(!x.ce.decision)aTrancher++});
  var nSub=campaignSubs(sq,camp.id).length;
  return bottomActionBar({
    note:aTrancher?(plural(aTrancher,"athlète")+" de cette campagne reste"+(aTrancher>1?"nt":"")+" à trancher"):null,
    noteTone:aTrancher?"warn":null,
    actions:[
      h("button",{className:"btn btn-primary full",type:"button",
        onclick:function(){openModal("buildteam")}},"👕 Constituer l'équipe"),
      nSub?h("button",{className:"btn btn-warn",type:"button",
        "aria-label":"Appliquer les avis majoritaires des sélectionneurs",
        onclick:function(){state.evalCampaignId=camp.id;openModal("applyreco")}},"⚡ Avis"):null]});
}

/* ── Qui a évalué ─────────────────────────────────────────────
   Dit exactement comme compileSubmissions le dit — même repli, même
   ordre. Le récap et la lecture d'une soumission ne doivent jamais se
   contredire sur un nom : c'est sur cette signature que l'entraîneur
   juge du poids d'un avis. L'anonymat, lui, est celui du paquet, et
   n'est ni renforcé ni affaibli ici. */
function submissionWho(sub){
  return (sub&&(sub.selectorName||"").trim())||(sub&&sub.viewName)||"Sélectionneur";
}
/* Les soumissions d'une campagne qui portent sur cette athlète, la plus
   récente d'abord. Celles où elle n'a pas été observée sont gardées : le
   silence d'un évaluateur est une information, et l'entraîneur qui
   cherche « pourquoi une seule note » doit pouvoir le constater. */
function submissionsForPlayer(sq,cid,pid){
  return campaignSubs(sq,cid).filter(function(sub){
    return (sub.entries||[]).some(function(e){return e.playerId===pid});
  }).slice().sort(function(a,b){
    return String(b.submittedAt||"").localeCompare(String(a.submittedAt||""));
  });
}
/* Le contenu d'une soumission, pour une athlète, tel qu'il a été rendu.
   LECTURE SEULE STRICTE : aucun champ, aucun bouton qui écrive. Une
   soumission est un instantané figé ; la retoucher reviendrait à
   réécrire ce qu'un évaluateur a dit, et c'est justement parce qu'on
   ne peut pas la réécrire qu'on peut s'y fier. Ce qu'on peut en faire
   est ailleurs : l'exporter ou la supprimer dans le volet Soumissions,
   ou demander une réévaluation depuis la vue. */
function renderSubmissionEntryRO(sq,sub,pid){
  var e=null;
  (sub.entries||[]).forEach(function(x){if(x.playerId===pid)e=x});
  var box=h("div",{className:"subRO"});
  var dossard=e?cleanNum(e.number):"";
  box.appendChild(h("div",{className:"sr-head"},
    h("div",{className:"grow"},
      h("div",{className:"sr-who"},"👤 "+submissionWho(sub)),
      h("div",{className:"sr-when"},(sub.viewName||"Vue")+" · "+fmtDate(sub.submittedAt)+
        (dossard?" · dossard "+numLabel(dossard):""))),
    tok("box",{label:"Lecture seule",icon:"🔒",color:"#94A3B8"})));
  if(!dataFilled(e)){
    box.appendChild(h("div",{className:"muted"},
      "Athlète non observée dans cette soumission — ni note, ni avis, ni compteur."));
    return box;
  }
  var notes=CRITERIA.filter(function(cr){return (e.ratings||{})[cr.key]>0});
  if(notes.length)box.appendChild(h("div",{className:"sr-grid"},notes.map(function(cr){
    var v=e.ratings[cr.key];
    return h("div",{className:"sr-cell"},
      h("span",{className:"sr-lbl"},cr.label),
      h("span",{className:"sr-val",style:{color:scoreColor(v)}},v+" / "+RATING_MAX));
  })));
  var jetons=[];
  if(e.reco&&RECO_BY_KEY[e.reco])jetons.push(tok("pill",RECO_BY_KEY[e.reco]));
  if(e.pos)jetons.push(tok("dot",{label:"Poste proposé : "+e.pos,color:"var(--eval-ink)"}));
  if(jetons.length)box.appendChild(h("div",{className:"sr-toks"},jetons));
  if(hasStats(e.stats))box.appendChild(renderStatMini(e.stats));
  if((e.note||"").trim())box.appendChild(h("div",{className:"note-item"},
    h("b",null,"Commentaire de "+submissionWho(sub)),e.note.trim()));
  return box;
}

/* ── La feuille d'une athlète dans la campagne ─────────────────
   Trois temps, dans l'ordre où l'on décide : on tranche (le geste est
   en haut, sous le pouce), on relit le récap compilé, puis on descend
   dans chaque soumission telle qu'elle a été rendue. La fiche de
   saison ferme la marche : elle répond à « et le reste de l'année ? »,
   qui est une autre question. */
function renderSelAthleteSheet(){
  var sq=curSquad();if(!sq)return null;
  var camp=curCampaign(sq);if(!camp)return null;
  var pid=state.modalCtx;
  var p=playerById(pid),entry=rosterEntry(sq,pid);
  if(!p||!entry)return null;
  var ce=campaignEntry(sq,camp.id,pid);
  var comp=compileSubmissions(sq,camp.id);
  var c=comp[pid]||null;
  var offre=currentOffer(sq,pid);
  var ouverte=campaignOpen(sq,camp)&&!!ce;
  var corps=h("div",null);

  /* 1 — la décision */
  corps.appendChild(h("div",{className:"section-title"},"Décision · "+camp.name));
  if(!ce){
    corps.appendChild(h("div",{className:"hint warn"},
      "Cette athlète n'est pas convoquée à « "+camp.name+" ». On ne tranche pas le sort "+
      "de quelqu'un qui n'était pas là : convoquez-la d'abord, ou changez de campagne."));
  } else if(!ouverte){
    corps.appendChild(h("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center"}},
      tok("pill",STATUSES[ce.decision?RECO_TO_STATUS[ce.decision]:"candidate"]),
      h("span",{className:"muted"},camp.closedAt?"Campagne close — décision figée."
                                                :"Saison clôturée — décision figée.")));
  } else {
    /* Trois boutons pleine largeur, et non un `segmented` de quatre :
       « Non retenue » tronquerait à 375 px, et on ne demande pas à
       quelqu'un de couper une athlète en lisant « Non rete… ». Le
       quatrième choix — retirer la décision — n'est pas un choix de même
       rang : c'est une marche arrière, et elle ne paraît que s'il y a
       quelque chose à défaire. */
    function trancher(k){
      setCampaignDecision(sq,camp.id,pid,k,state.meId||null);
      saveNow();
      showToast(k?(RECO_BY_KEY[k].icon+" "+shortName(p)+" · "+RECO_BY_KEY[k].label+
                   (k==="select"?" — offre en attente":""))
                 :("Décision retirée pour "+shortName(p)),
        {tone:k==="select"?"ok":null,action:{label:"Annuler",onclick:doUndo}});
      render();
    }
    corps.appendChild(h("div",{className:"reco-row sel-decision",role:"group",
      "aria-label":"Décision de sélection"},
      RECOS.map(function(r){
        var on=ce.decision===r.key;
        var b=h("button",{className:"reco-btn"+(on?" on":""),type:"button",
          "aria-pressed":on?"true":"false",
          onclick:function(){if(!on)trancher(r.key)}},r.icon+" "+r.label);
        if(on)paintOn(b,r.color);
        return b;
      })));
    if(ce.decision)corps.appendChild(h("button",{className:"btn btn-ghost xs",type:"button",
      style:{marginTop:"6px"},onclick:function(){trancher("")}},"↺ Retirer la décision"));
    corps.appendChild(h("div",{className:"muted",style:{marginTop:"6px"}},
      "Retenir n'ajoute personne à l'équipe sur-le-champ : l'athlète reçoit une offre, "+
      "et n'entre dans l'effectif qu'une fois cette offre confirmée."));
  }
  if(offre&&OFFER_STATUS[offre.status]){
    var campOffre=campaignById(sq,offre.campaignId);
    corps.appendChild(h("div",{className:"card tight",style:{marginTop:"10px"}},
      h("div",{className:"row-between"},
        h("div",{style:{minWidth:"0"}},
          h("div",{style:{display:"flex",gap:"6px",alignItems:"center"}},
            tok("box",OFFER_STATUS[offre.status])),
          h("div",{className:"muted",style:{marginTop:"4px"}},
            "Offre ouverte le "+fmtDay(offre.createdAt)+
            (campOffre?" · "+campOffre.name:"")+
            (offre.decidedAt?" · tranchée le "+fmtDay(offre.decidedAt):""))),
        (offre.status==="pending")?h("button",{className:"btn btn-save xs",type:"button",
          onclick:function(){openModal("buildteam")}},"Constituer"):null)));
  }

  /* 2 — le récap compilé */
  corps.appendChild(h("div",{className:"section-title"},"Récap compilé · "+camp.name));
  if(!c||!c.n){
    corps.appendChild(h("div",{className:"muted"},
      "Aucune soumission ne la concerne dans cette campagne. Créez une vue qui la "+
      "contienne, distribuez-la, puis relevez les soumissions."));
  } else {
    corps.appendChild(h("div",{className:"row-between",style:{marginBottom:"8px"}},
      h("span",{className:"score-pill",
        style:{background:scoreColor(c.nRatings?c.score:0)+"22",color:scoreColor(c.nRatings?c.score:0)}},
        c.nRatings?c.score.toFixed(1):"—"),
      h("div",{style:{flex:"1",minWidth:"0",marginLeft:"10px"}},
        h("div",{className:"muted"},
          (c.nRatings?plural(c.nRatings,"note"):"aucune note")+
          (c.n>c.nRatings?" · "+plural(c.n-c.nRatings,"relevé"):"")+
          " · "+c.selectors.join(", ")),
        (function(){var a=dossardsAutres(c,entry);
          return a.length?h("div",{className:"muted",style:{marginTop:"2px"}},
            (a.length===1?"dossard ":"dossards ")+a.join(", ")):null})())));
    corps.appendChild(renderCritBars(c));
    var avis=h("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap",marginTop:"8px"}});
    RECOS.forEach(function(r){
      if(!c.reco[r.key])return;
      avis.appendChild(h("span",{className:"badge",
        style:{background:r.color+"1E",color:r.color,borderColor:r.color+"55"}},
        r.icon+" "+r.short+" "+c.reco[r.key]+"/"+c.nReco));
    });
    var pv=posVoteBadge(c);if(pv)avis.appendChild(pv);
    if(c.recoTie)avis.appendChild(h("span",{className:"badge",
      style:{background:"#F59E0B22",color:"#FBBF24",borderColor:"#F59E0B55"}},
      "⚖ avis partagés — le plus récent tranche"));
    if(avis.childNodes.length)corps.appendChild(avis);
    corps.appendChild(h("div",{className:"section-title"},"Statistiques relevées"));
    corps.appendChild(renderStatFamilies(c));
    corps.appendChild(h("div",{className:"section-title"},"D'où vient le score"));
    corps.appendChild(renderScoreBreakdown(sq,c));
  }

  /* 3 — chaque soumission, telle qu'elle a été rendue */
  var subs=submissionsForPlayer(sq,camp.id,pid);
  corps.appendChild(h("div",{className:"section-title"},
    subs.length?plural(subs.length,"soumission")+" la concernant":"Soumissions la concernant"));
  if(!subs.length)corps.appendChild(h("div",{className:"muted"},
    "Aucune soumission de cette campagne ne la porte."));
  subs.forEach(function(sub){corps.appendChild(renderSubmissionEntryRO(sq,sub,pid))});

  /* 4 — l'athlète, hors de cette campagne */
  corps.appendChild(h("div",{className:"section-title"},"L'athlète, toute la saison"));
  corps.appendChild(renderPlayerSheet(sq,entry,p));

  return sheetShell({title:numLabel(entry.number)+" "+fullName(p),
    buttons:[h("button",{className:"btn btn-ghost full",type:"button",
      onclick:closeModal},"Fermer")]},corps);
}
defModal("selathlete",renderSelAthleteSheet,{autofocus:false});

/* ── Convoquer en lot ─────────────────────────────────────────
   On ne convoque pas une athlète à une campagne en la cherchant dans
   la base du club : elle est déjà de la saison, la question est
   seulement de savoir si on l'attend CE soir-là. La feuille ne
   propose donc que celles qui manquent à cette campagne, et offre de
   reprendre la précédente d'un geste — c'est le cas courant. */
function renderConvokeModal(){
  var sq=curSquad();if(!sq)return null;
  var camp=curCampaign(sq);if(!camp)return null;
  if(!state.modalSel)state.modalSel=[];
  var items=(sq.roster||[]).filter(function(r){
    return !hasCampaignEntry(sq,camp.id,r.playerId)&&!!playerById(r.playerId);
  }).map(function(r){
    var p=playerById(r.playerId);
    return {entry:r,player:p,pid:r.playerId,age:ageOf(p),
      statut:derivedStatus(sq,r.playerId,r.status),
      offer:currentOffer(sq,r.playerId)};
  });

  var boite={};
  var btnOk=h("button",{className:"btn btn-primary full",type:"button",id:"modalOk",
    disabled:!state.modalSel.length,
    onclick:function(){
      var pids=state.modalSel.slice();
      var n=convokeToCampaign(sq,camp.id,pids,state.meId||null);
      closeModal();saveNow();
      showToast(n?("👥 "+plural(n,"athlète")+" convoquée(s) à « "+camp.name+" »")
                 :"Aucune convocation ajoutée",{tone:n?"ok":null});
    }},"Convoquer");
  function majBouton(){
    var n=state.modalSel.length;
    btnOk.textContent=n?("Convoquer ("+n+")"):"Convoquer";
    btnOk.disabled=!n;
  }
  function bascule(pid){
    var i=state.modalSel.indexOf(pid);
    if(i===-1)state.modalSel.push(pid);else state.modalSel.splice(i,1);
    if(boite.tb)boite.tb.refresh();
    majBouton();
  }

  var corps=h("div",null);
  if(!items.length){
    corps.appendChild(emptyState({icon:"✅",title:"Tout le monde est convoqué",
      sub:"Les "+plural((sq.roster||[]).length,"athlète")+" de la saison figurent déjà "+
          "dans « "+camp.name+" ». Pour en ajouter d'autres, passez par la base du club.",
      action:h("button",{className:"btn btn-ghost",type:"button",onclick:function(){
        closeModal();state.tab="players";state.playersPane="db";render();
      }},"Ouvrir la base de joueuses")}));
    return sheetShell({title:"Convoquer à « "+camp.name+" »",
      buttons:[h("button",{className:"btn btn-ghost full",type:"button",onclick:closeModal},"Fermer")]},
      corps);
  }

  corps.appendChild(h("div",{className:"hint"},
    "Cochez celles que vous attendez à ",h("b",null,camp.name),". Elles gardent leur numéro, ",
    "et ce qu'elles ont fait dans les autres campagnes ne bouge pas."));

  /* Reprendre la campagne précédente : le geste le plus fréquent
     d'une journée 2, et celui qu'on ne veut pas faire à la main
     vingt-huit fois. */
  var ordre=campaignOrder(sq),prec=null;
  for(var i=0;i<ordre.length;i++){
    if(ordre[i].id===camp.id)break;
    prec=ordre[i];
  }
  if(prec){
    var dansPrec=items.filter(function(x){return hasCampaignEntry(sq,prec.id,x.pid)});
    if(dansPrec.length)corps.appendChild(h("div",{className:"btn-row",style:{marginBottom:"10px"}},
      h("button",{className:"btn btn-ghost sm",type:"button",onclick:function(){
        dansPrec.forEach(function(x){
          if(state.modalSel.indexOf(x.pid)===-1)state.modalSel.push(x.pid);
        });
        if(boite.tb)boite.tb.refresh();
        majBouton();
      }},"↩︎ Reprendre les "+dansPrec.length+" de « "+prec.name+" »")));
  }

  var tb=listToolbar({
    key:"sel-convoke",
    items:items,
    search:{placeholder:"Rechercher un nom ou un numéro…",
      of:function(x){return fullName(x.player)+" "+(x.entry.number||"")}},
    sorts:[
      {key:"number",label:"Numéro",get:function(x){
        var n=parseInt(x.entry.number,10);return isFinite(n)?n:null}},
      {key:"name",label:"Nom",get:function(x){return fullName(x.player)}},
      {key:"age",label:"Âge",get:function(x){return x.age}}
    ],
    filters:[
      {key:"decision",label:"Décision",get:function(x){return x.statut},
       options:STATUS_ORDER.map(function(k){
         return {k:k,l:STATUSES[k].icon+" "+STATUSES[k].label,tone:toneOfStatus(k)};
       })},
      {key:"offre",label:"Offre",get:function(x){return x.offer?x.offer.status:"none"},
       options:[{k:"none",l:"— Aucune"}].concat(OFFER_KEYS.map(function(k){
         return {k:k,l:OFFER_STATUS[k].icon+" "+OFFER_STATUS[k].label,tone:toneOfOffer(k)};
       }))}
    ],
    rows:function(res){
      return res.map(function(x){
        var coche=state.modalSel.indexOf(x.pid)!==-1;
        var meta=[];
        if(STATUSES[x.statut])meta.push(tok("pill",STATUSES[x.statut]));
        if(x.offer&&OFFER_STATUS[x.offer.status])meta.push(tok("box",OFFER_STATUS[x.offer.status]));
        if(x.age!=null)meta.push(tok("dot",{label:x.age+" ans",color:"var(--txt-dim)"}));
        return listRow({
          lead:h("button",{className:"lead pick"+(coche?" on":""),type:"button",
            "aria-pressed":coche?"true":"false",
            "aria-label":(coche?"Retirer ":"Choisir ")+fullName(x.player),
            onclick:function(){bascule(x.pid)}},coche?"✓":(x.entry.number||"—")),
          name:fullName(x.player),meta:meta,decision:x.statut,picked:coche,
          ariaLabel:(coche?"Retirer ":"Choisir ")+fullName(x.player),
          onclick:function(){bascule(x.pid)}});
      });
    }
  });
  boite.tb=tb;
  corps.appendChild(tb);
  corps.appendChild(tb.list);
  majBouton();

  return sheetShell({title:"Convoquer à « "+camp.name+" »",
    buttons:[
      h("button",{className:"btn btn-ghost",type:"button",onclick:closeModal},"Annuler"),
      btnOk]},corps);
}
defModal("convoke",renderConvokeModal);

/* ── Une soumission entière, relue ────────────────────────────
   Le même rendu en lecture seule, athlète après athlète. C'est la
   porte du volet Soumissions ; celle du récap ouvre la même chose,
   mais pour une seule athlète. */
function renderSubmissionROModal(){
  var sq=curSquad();if(!sq)return null;
  var sub=null;
  (sq.submissions||[]).forEach(function(x){if(x.id===state.modalCtx)sub=x});
  if(!sub)return null;
  var corps=h("div",null);
  corps.appendChild(h("div",{className:"hint"},
    "Ce que « ",h("b",null,submissionWho(sub))," » a rendu le ",fmtDate(sub.submittedAt),
    ", sur la vue « ",sub.viewName||"—","». Figé : on le relit, on ne le corrige pas."));
  var vus=(sub.entries||[]).filter(dataFilled);
  if(!vus.length)corps.appendChild(emptyState({icon:"📄",title:"Aucune athlète évaluée",
    small:true,sub:"Cette soumission ne porte ni note, ni avis, ni compteur."}));
  vus.forEach(function(e){
    var p=playerById(e.playerId);
    corps.appendChild(h("div",{className:"section-title"},
      numLabel(cleanNum(e.number))+" "+(p?fullName(p):"Athlète inconnue")));
    corps.appendChild(renderSubmissionEntryRO(sq,sub,e.playerId));
  });
  return sheetShell({title:"Soumission de "+submissionWho(sub),
    buttons:[h("button",{className:"btn btn-ghost full",type:"button",
      onclick:closeModal},"Fermer")]},corps);
}
defModal("submissionro",renderSubmissionROModal,{autofocus:false});

/* ── Les campagnes, en feuille ────────────────────────────────
