        localStorage.setItem(SK_VAULT,JSON.stringify(box));
        /* La copie en clair n'a plus lieu d'être. */
        localStorage.removeItem(SK);
        LEGACY_KEYS.forEach(function(k){localStorage.removeItem(k)});
        return true;
      });
    });
  });
}
function vaultUnlock(pass){
  var box=readVaultBox();
  if(!box)return Promise.reject(new Error("Aucun coffre"));
  if(!cryptoAvailable())return Promise.reject(new Error("Chiffrement indisponible sur cet appareil"));
  return vaultDecrypt(box,pass).then(function(r){
    VAULT.key=r.key;
    VAULT.meta={kdf:box.kdf,hint:box.hint||"",who:VAULT.meta&&VAULT.meta.who||""};
    VAULT.unlocked=true;VAULT.plain=r.data;
    return r.data;
  }).catch(function(){throw new Error("Phrase de passe incorrecte")});
}
function vaultChangePass(oldPass,newPass,hint){
  return vaultUnlock(oldPass).then(function(data){
    return vaultCreate(newPass,hint,VAULT.meta.who,data);
  });
}
function vaultLock(){
  VAULT.key=null;VAULT.unlocked=false;VAULT.plain=null;
  DB=emptyDB();INBOX={views:[]};SECRETS={github:null,superKey:null};
  superProof={done:false,ok:false};
  state.meId=null;state.ctx=null;
}

/* ══ PROPRIÉTAIRE ══════════════════════════════════════════════
   Un seul propriétaire dans tout le système. Ce n'est pas un drapeau
   local — chacun pourrait se l'accorder — mais une paire de clés :

     clé privée   dans le coffre chiffré du propriétaire, nulle part ailleurs
     clé publique dans superadmin.json, publié à côté de l'application

   Toutes les installations lisent ce fichier au démarrage. Créer un club
   ou nommer un administrateur produit une pièce signée ; un appareil qui
   ne sait pas signer comme le propriétaire ne peut en fabriquer aucune.

   Portée honnête : la vérification se fait dans le navigateur, donc qui
   modifie sa propre copie de la page peut la contourner. Ce qu'elle
   empêche vraiment, c'est qu'une pièce forgée soit acceptée ailleurs —
   par un autre appareil, ou par le relais, qui applique la même
   vérification hors de portée de celui qu'il contrôle.
   ══════════════════════════════════════════════════════════════ */
var SUPER_FILE="superadmin.json";
var ROOT={loaded:false,key:null,name:"",foundedAt:"",raw:null,error:""};
var ECDSA={name:"ECDSA",namedCurve:"P-256"};
var SIGN_ALG={name:"ECDSA",hash:{name:"SHA-256"}};

/* Lecture de la racine de confiance. Servie par la même origine que
   l'application, donc mise en cache par le service worker avec elle. */
function loadRoot(){
  if(!cryptoAvailable()){ROOT.loaded=true;ROOT.error="Chiffrement indisponible";return Promise.resolve(ROOT)}
  return fetch(SUPER_FILE,{cache:"no-cache"}).then(function(r){
    if(!r.ok)throw new Error("absent");
    return r.json();
  }).then(function(j){
    /* Le fichier livré avec l'application déclare « non fondé » : c'est
       un état normal, pas une erreur. */
    if(!j||j.founded===false||!j.publicKey)throw new Error("absent");
    return subtle().importKey("jwk",j.publicKey,ECDSA,true,["verify"]).then(function(k){
      ROOT.key=k;ROOT.name=j.name||"";ROOT.foundedAt=j.foundedAt||"";ROOT.raw=j;
      ROOT.loaded=true;return ROOT;
    });
  }).catch(function(e){
    ROOT.loaded=true;ROOT.key=null;
    ROOT.error=(e&&e.message==="absent")?"non fondé":"racine illisible";
    return ROOT;
  });
}
function rootExists(){return !!ROOT.key}

/* Repli sur la copie locale quand le fichier publié est injoignable :
   hors ligne, ou pas encore déposé. Cette copie ne vaut que sur cet
   appareil — ce qui empêche une charte forgée d'être acceptée ailleurs,
   c'est le fichier publié, que les autres installations vont chercher. */
function adoptLocalRoot(){
  if(ROOT.key||!DB.rootFile||!DB.rootFile.publicKey)return Promise.resolve(false);
  return subtle().importKey("jwk",DB.rootFile.publicKey,ECDSA,true,["verify"])
    .then(function(k){
      ROOT.key=k;ROOT.name=DB.rootFile.name||"";
      ROOT.foundedAt=DB.rootFile.foundedAt||"";ROOT.raw=DB.rootFile;
      ROOT.error="racine locale";
      return true;
    }).catch(function(){return false});
}

/* ── Signature ─────────────────────────────────────────────── */
function canonical(o){
  /* Clés triées : deux appareils doivent signer et vérifier exactement
     la même suite d'octets. */
  var ks=[];for(var k in o)if(Object.prototype.hasOwnProperty.call(o,k)&&k!=="sig")ks.push(k);
  ks.sort();
  var out={};ks.forEach(function(k){out[k]=o[k]});
  return JSON.stringify(out);
}
function signDoc(doc){
  var priv=SECRETS.superKey;
  if(!priv)return Promise.reject(new Error("Cet appareil ne détient pas la clé du propriétaire"));
  return subtle().importKey("jwk",priv,ECDSA,false,["sign"]).then(function(k){
    return subtle().sign(SIGN_ALG,k,utf8(canonical(doc)));
  }).then(function(sig){
    return Object.assign({},doc,{sig:b64(sig)});
  });
}
function verifyDoc(doc){
  if(!doc||!doc.sig)return Promise.resolve(false);
  if(!ROOT.key)return Promise.resolve(false);
  return subtle().verify(SIGN_ALG,ROOT.key,unb64(doc.sig),utf8(canonical(doc)))
    .catch(function(){return false});
}

/* Cet appareil détient-il la clé du propriétaire, et correspond-elle
   bien à la clé publiée ? On ne se contente pas de la présence : on
   signe un aléa et on vérifie avec la clé publique. */
var superProof={done:false,ok:false};
function proveSuper(){
  if(!SECRETS.superKey||!ROOT.key){superProof={done:true,ok:false};return Promise.resolve(false)}
  var defi={n:b64(randBytes(16)),t:nowISO()};
  return signDoc(defi).then(verifyDoc).then(function(ok){
    superProof={done:true,ok:!!ok};return !!ok;
  }).catch(function(){superProof={done:true,ok:false};return false});
}
/* Être propriétaire demande les deux : que cet appareil détienne la clé,
   et que la personne qui l'utilise soit bien celle de la fondation.
   Changer d'identité sur l'appareil du propriétaire ne transmet donc
   rien à personne. */
function isSuper(){
  return !!(superProof.ok&&DB.superId&&state.meId===DB.superId);
}

/* ── Fondation ─────────────────────────────────────────────── */
function foundSystem(nom){
  if(!cryptoAvailable())return Promise.reject(new Error("Chiffrement indisponible sur cet appareil"));
  return subtle().generateKey(ECDSA,true,["sign","verify"]).then(function(pair){
    return Promise.all([
      subtle().exportKey("jwk",pair.privateKey),
      subtle().exportKey("jwk",pair.publicKey)
    ]);
  }).then(function(r){
    SECRETS.superKey=r[0];
    var pub=r[1];
    delete pub.key_ops;delete pub.ext;
    var fichier={version:1,name:nom||"",foundedAt:nowISO(),publicKey:pub};
    /* La clé publique n'est utile que publiée : on la rend au fondateur
       pour qu'il la dépose, et on l'adopte tout de suite en mémoire. */
    return subtle().importKey("jwk",pub,ECDSA,true,["verify"]).then(function(k){
      ROOT.key=k;ROOT.name=fichier.name;ROOT.foundedAt=fichier.foundedAt;
      ROOT.raw=fichier;ROOT.loaded=true;ROOT.error="";
      return fichier;
    });
  });
}

/* ── Transport de la clé ───────────────────────────────────────
   La clé privée est exclue des sauvegardes et du dépôt : c'est voulu.
   Elle a donc son propre fichier, scellé par une phrase choisie pour
   lui — un porte-clés, pas une sauvegarde de données. */
function sealKey(pass){
  if(!SECRETS.superKey)return Promise.reject(new Error("Cet appareil ne détient pas la clé"));
  var salt=randBytes(16),iv=randBytes(12),iter=200000;
  var charge={superKey:SECRETS.superKey,superId:DB.superId,
    name:(personById(DB.superId)||{}).name||"",publicKey:ROOT.raw?ROOT.raw.publicKey:null};
  return deriveKey(pass,salt,iter).then(function(k){
    return subtle().encrypt({name:"AES-GCM",iv:iv},k,utf8(JSON.stringify(charge)));
  }).then(function(ct){
    return {type:"wonderstats-owner-key",v:1,
      kdf:{salt:b64(salt),iter:iter,hash:"SHA-256"},
      cipher:"AES-GCM",iv:b64(iv),ct:b64(ct),at:nowISO()};
  });
}
function openKey(box,pass){
  if(!box||box.type!=="wonderstats-owner-key")
    return Promise.reject(new Error("Ce fichier n'est pas une clé de propriétaire"));
  return deriveKey(pass,unb64(box.kdf.salt),box.kdf.iter||200000).then(function(k){
    return subtle().decrypt({name:"AES-GCM",iv:unb64(box.iv)},k,unb64(box.ct));
  }).then(function(plain){
    return JSON.parse(new TextDecoder().decode(plain));
  }).catch(function(){throw new Error("Phrase de passe incorrecte pour cette clé")});
}

/* ── Chartes et nominations ────────────────────────────────── */
function charterFor(club){
  return {kind:"club",clubId:club.id,name:club.name,issuedAt:nowISO()};
}
function grantFor(person,club){
  return {kind:"admin",clubId:club.id,personId:person.id,
    name:person.name,issuedAt:nowISO()};
}
function clubIsChartered(club){
  return !!(club&&club.charter&&club.charter.sig);
}

/* Vérifie tout ce qui prétend venir du propriétaire. Un club dont la
   charte ne tient pas est marqué, pas supprimé : on ne détruit pas les
   données d'un club parce qu'une signature manque. */
function verifyAll(){
  if(!ROOT.key)return Promise.resolve({clubs:{},grants:{}});
  var res={clubs:{},grants:{}},jobs=[];
  DB.clubs.forEach(function(c){
    if(!c.charter){res.clubs[c.id]=false;return}
    jobs.push(verifyDoc(c.charter).then(function(ok){
      res.clubs[c.id]=ok&&c.charter.clubId===c.id;
    }));
  });
  DB.clubAssignments.forEach(function(a){
    if(!a.grant){res.grants[a.id]=false;return}
    jobs.push(verifyDoc(a.grant).then(function(ok){
      res.grants[a.id]=ok&&a.grant.clubId===a.clubId&&a.grant.personId===a.personId;
    }));
  });
  return Promise.all(jobs).then(function(){VERIF=res;return res});
}
var VERIF={clubs:{},grants:{}};
function clubVerified(id){return VERIF.clubs[id]===true}
function grantVerified(id){return VERIF.grants[id]===true}

/* ══ SAUVEGARDE GITHUB ═════════════════════════════════════════
   Un dépôt privé sert de coffre distant : sauvegarde, historique, et
   passage d'un appareil à l'autre. Ce qui y est déposé est le même bloc
   chiffré que sur le disque — GitHub n'en voit que du bruit, et la même
   phrase de passe l'ouvre sur l'autre appareil.

   Le jeton appartient à son porteur et n'est jamais dans le code : il est
   saisi à la main, rangé avec les secrets, donc chiffré au repos. Un
   sélectionneur n'en reçoit pas : lui donner le droit d'écrire dans le
   dépôt lui donnerait la lecture de toutes les soumissions, ce que le
   relais à jetons refuse précisément de faire.
   ══════════════════════════════════════════════════════════════ */
var GH_API="https://api.github.com";
var ghBusy=false;

function ghCfg(){return SECRETS.github}
function ghReady(){var g=ghCfg();return !!(g&&g.repo&&g.token)}
function ghPath(){var g=ghCfg();return (g&&g.path)||"wonderstats.vault.json"}

function ghFetch(path,opts){
  var g=ghCfg();
  var o=Object.assign({},opts||{});
  o.headers=Object.assign({
    "Accept":"application/vnd.github+json",
    "Authorization":"Bearer "+g.token,
    "X-GitHub-Api-Version":"2022-11-28"
  },o.headers||{});
  var ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
  var timer=setTimeout(function(){if(ctrl)ctrl.abort()},25000);
  if(ctrl)o.signal=ctrl.signal;
  return fetch(GH_API+path,o).then(function(r){
    clearTimeout(timer);
    return r.text().then(function(txt){
      var data=null;
      try{data=JSON.parse(txt)}catch(e){}
      if(r.status===404)return {missing:true};
      if(r.status===401)throw new Error("Jeton refusé par GitHub. Il a peut-être expiré, ou il a été révoqué.");
      if(r.status===403)throw new Error("GitHub refuse l'accès. Vérifiez que le jeton porte bien la permission « Contents » en lecture et écriture sur ce dépôt.");
      if(r.status===409)throw new Error("conflit");
      if(!r.ok)throw new Error("GitHub a répondu "+r.status+((data&&data.message)?" — "+data.message:""));
      return data;
    });
  }).catch(function(err){
    clearTimeout(timer);
    if(err&&err.name==="AbortError")throw new Error("GitHub injoignable (délai dépassé)");
    if(err&&/Failed to fetch|NetworkError|Load failed/i.test(err.message||""))
      throw new Error("GitHub injoignable. Vérifiez votre connexion.");
    throw err;
  });
}

/* Vérifie que le dépôt existe et que le jeton y donne bien accès. */
function ghCheck(){
  var g=ghCfg();
  return ghFetch("/repos/"+g.repo).then(function(r){
    if(r&&r.missing)throw new Error("Dépôt introuvable. Vérifiez « propriétaire/dépôt », et que le jeton y a accès.");
    if(!r.permissions||!r.permissions.push)
      throw new Error("Le jeton peut lire ce dépôt mais pas y écrire.");
    return {repo:r.full_name,priv:!!r.private};
  });
}

function ghRead(){
  return ghFetch("/repos/"+ghCfg().repo+"/contents/"+encodeURIComponent(ghPath()))
    .then(function(r){
      if(r&&r.missing)return {empty:true};
      var txt=atob((r.content||"").replace(/\n/g,""));
      var box=null;
      try{box=JSON.parse(txt)}catch(e){throw new Error("Le fichier du dépôt n'est pas lisible.")}
      return {box:box,sha:r.sha};
    });
}

/* On dépose le bloc chiffré tel quel : GitHub ne voit jamais les noms. */
function ghWrite(box,sha,msg){
  var body={message:msg||("WonderStats — "+nowISO()),
    content:btoa(unescape(encodeURIComponent(JSON.stringify(box,null,1))))};
  if(sha)body.sha=sha;
  return ghFetch("/repos/"+ghCfg().repo+"/contents/"+encodeURIComponent(ghPath()),
    {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
}

/* Envoi : on relit d'abord le sha distant pour ne pas écraser à l'aveugle
   ce qu'un autre appareil aurait déposé entre-temps. */
function ghPush(force){
  if(!ghReady())return Promise.reject(new Error("Sauvegarde GitHub non configurée"));
  if(!VAULT.unlocked)return Promise.reject(new Error("Le coffre doit être ouvert"));
  return ghRead().then(function(cur){
    var g=ghCfg();
    if(!force&&cur.box&&cur.sha&&g.lastSha&&cur.sha!==g.lastSha)
      throw new Error("conflit-distant");
    return vaultEncrypt({db:DB,inbox:INBOX,secrets:{github:null,superKey:null}}).then(function(box){
      /* Ni le jeton GitHub ni la clé du propriétaire ne partent dans le
         dépôt : ce sont des secrets d'appareil, pas de sauvegarde. */
      return ghWrite(box,cur.sha||null,"Sauvegarde du "+fmtDate(nowISO()));
    }).then(function(res){
      var g2=ghCfg();
      g2.lastSha=(res&&res.content&&res.content.sha)||null;
      g2.lastSyncAt=nowISO();
      saveNow();
      return g2.lastSyncAt;
    });
  });
}

/* Récupération : le bloc distant est chiffré avec la phrase de passe de
   celui qui l'a déposé — c'est elle qu'on redemande, pas un mot de passe
   GitHub. */
function ghPull(pass){
  if(!ghReady())return Promise.reject(new Error("Sauvegarde GitHub non configurée"));
  return ghRead().then(function(cur){
    if(cur.empty||!cur.box)throw new Error("Le dépôt ne contient encore aucune sauvegarde.");
    return vaultDecrypt(cur.box,pass).catch(function(){
      throw new Error("Phrase de passe incorrecte pour cette sauvegarde.");
    }).then(function(r){
      var data=r.data||{};
      if(!data.db)throw new Error("Sauvegarde illisible.");
      DB=normalizeDB(data.db);
      INBOX=data.inbox||{views:[]};
      var g=ghCfg();g.lastSha=cur.sha;g.lastSyncAt=nowISO();
      state.meId=(DB.enrolledId&&personById(DB.enrolledId))?DB.enrolledId:state.meId;
      normalizeCtx();saveNow();
      return true;
    });
  });
}

/* ══ PERSISTANCE ═══════════════════════════════════════════════ */
var SK="wonderstats_v3", SK_UI="wonderstats_ui_v3", SK_INBOX="wonderstats_inbox_v3";
var LEGACY_KEYS=["vball_mt_v2","vball_mt_v1"];
var autoSaveTimer=null, saveFailed=false;

function uiSnapshot(){
  return {meId:state.meId,ctx:state.ctx,tab:state.tab,viewIdx:state.viewIdx,
    posFilter:state.posFilter,inputMode:state.inputMode,svViewId:state.svViewId};
}
function saveAll(){
  /* Rien n'est chargé : il n'y a rien à écrire, et écrire serait pire
     que ne rien faire. L'application enregistre à chaque fois que
     l'onglet passe en arrière-plan — ce qui, sur un téléphone, arrive
     dès qu'on revient à sa messagerie. Un appareil qui n'avait fait
     qu'ouvrir l'écran de garde se retrouvait ainsi avec une base vide
     sur le disque, et cette base prenait ensuite le pas sur le lien
     d'invitation : l'invité était accueilli en propriétaire d'un club
     qui n'existait pas. */
  if(gate.mode&&!gate.loaded)return;
  /* Coffre ouvert : rien ne part en clair sur le disque. L'écriture est
     asynchrone, mais l'ordre est garanti par la file ci-dessous. */
  if(VAULT.unlocked){
    queueVaultWrite();
    try{localStorage.setItem(SK_UI,JSON.stringify(uiSnapshot()))}catch(e){}
    return;
  }
  try{
    localStorage.setItem(SK,JSON.stringify(DB));
    localStorage.setItem(SK_INBOX,JSON.stringify(INBOX));
    localStorage.setItem(SK_UI,JSON.stringify(uiSnapshot()));
    saveFailed=false;
  }catch(e){
    if(!saveFailed){saveFailed=true;showToast("⚠️ Sauvegarde impossible (stockage plein)")}
  }
}

/* Chiffrer prend quelques millisecondes : on sérialise les écritures pour
   qu'une sauvegarde rapide n'en double pas une autre, et on garde une
   demande en attente plutôt que d'en empiler dix. */
var vaultWriting=false,vaultPending=false;
function queueVaultWrite(){
  if(vaultWriting){vaultPending=true;return}
  vaultWriting=true;
  vaultEncrypt({db:DB,inbox:INBOX,secrets:SECRETS}).then(function(box){
    localStorage.setItem(SK_VAULT,JSON.stringify(box));
    saveFailed=false;
  }).catch(function(){
    if(!saveFailed){saveFailed=true;showToast("⚠️ Sauvegarde impossible")}
  }).then(function(){
    vaultWriting=false;
    if(vaultPending){vaultPending=false;queueVaultWrite()}
  });
}
function updateIndicators(saving){
  var els=document.querySelectorAll(".autosave-indicator");
  for(var i=0;i<els.length;i++){
    var el=els[i],txt=el.lastChild;
    if(saving){el.classList.add("saving");if(txt)txt.textContent="Sauvegarde…"}
    else{el.classList.remove("saving");if(txt)txt.textContent=saveFailed?"Non sauvegardé":"Sauvegardé"}
  }
}
/* Sauvegarde progressive, à deux vitesses : le journal d'opérations
   part vite parce qu'il est petit, le bloc complet suit. Une fermeture
   brutale ne coûte donc plus qu'une fraction de seconde de frappe. */
function scheduleAutoSave(){
  if(autoSaveTimer)clearTimeout(autoSaveTimer);
  updateIndicators(true);
  scheduleOpsJournal();
  autoSaveTimer=setTimeout(function(){
    saveAll();autoSaveTimer=null;updateIndicators(false);clearOpsJournal();
  },1200);
}
function saveNow(){if(autoSaveTimer){clearTimeout(autoSaveTimer);autoSaveTimer=null}saveAll();updateIndicators(false);clearOpsJournal()}
/* ══════════════════════════════════════════════════════════════
   STORE — une collection, un identifiant, une opération

   Le reste de l'application ignore où les données dorment : coffre
   local aujourd'hui, table SQL sur un serveur demain. Ce qui
   voyagera alors n'est pas la base — c'est le journal des
   opérations que cette couche tient au passage.

   Règle pour tout le code appelant, et elle tient en une phrase :
   LIRE `DB` librement, N'ÉCRIRE que dans un `Store.tx`, par
   `Store.put` / `Store.patch` / `Store.del`. La lecture reste un
   accès mémoire direct parce que neuf mille lignes en dépendent et
   que ce n'est pas elle qui empêche de passer à un serveur : ce qui
   l'empêche, c'est de ne pas savoir ce qui a changé.
   ══════════════════════════════════════════════════════════════ */
var SK_OPS="wonderstats_ops_v1", SK_DEV="wonderstats_dev_v1";

/* Le modèle, décrit une fois. C'est cette table qui permet au Store de
   travailler sur les objets imbriqués existants sans les réécrire, et
   c'est elle qui engendrera la projection SQL. `owner:"squad"` dit que
   l'objet porte un squadId implicite — une colonne, en base. */
var COLLECTIONS={
  clubs:{path:"clubs",key:"id"},
  people:{path:"people",key:"id"},
  teams:{path:"teams",key:"id"},
  players:{path:"players",key:"id"},
  seasons:{path:"seasons",key:"id"},
  squads:{path:"squads",key:"id"},
  assignments:{path:"assignments",key:"id"},
  clubAssignments:{path:"clubAssignments",key:"id"},
  roster:{owner:"squad",path:"roster",key:"playerId"},
  campaigns:{owner:"squad",path:"campaigns",key:"id"},
  campaignRoster:{owner:"squad",path:"campaignRoster",key:"id"},
  offers:{owner:"squad",path:"offers",key:"id"},
  events:{owner:"squad",path:"events",key:"id"},
  sessions:{owner:"squad",path:"sessions",key:"id"},
  goals:{owner:"squad",path:"goals",key:"id"},
  views:{owner:"squad",path:"selectorViews",key:"id"},
  submissions:{owner:"squad",path:"submissions",key:"id"}
};
/* `session.sets[]` et `goal.history[]` ne sont pas des collections : ce
   sont des agrégats, écrits et lus avec leur parent. On ne modifie
   jamais un set sans toucher au total de sa session. */

var OPLOG=[],OPS_MAX=2000,opsTimer=null,opsWriting=false,opsPending=false;
var TX={depth:0,gid:null,before:[],ops:[],seen:{}};

function devId(){
  try{
    var d=localStorage.getItem(SK_DEV);
    if(!d){d=uid();localStorage.setItem(SK_DEV,d)}
    return d;
  }catch(e){return "local"}
}
function collArray(coll,sq){
  var d=COLLECTIONS[coll];
  if(!d)return null;
  if(d.owner==="squad"){
    if(!sq)return null;
    if(!Array.isArray(sq[d.path]))sq[d.path]=[];
    return sq[d.path];
  }
  if(!Array.isArray(DB[d.path]))DB[d.path]=[];
  return DB[d.path];
}
function collFind(coll,id,sq){
  var arr=collArray(coll,sq),d=COLLECTIONS[coll];
  if(!arr)return -1;
  for(var i=0;i<arr.length;i++)if(arr[i]&&arr[i][d.key]===id)return i;
  return -1;
}
function squadById(id){
  for(var i=0;i<DB.squads.length;i++)if(DB.squads[i].id===id)return DB.squads[i];
  return null;
}

/* Instantané pris à la PREMIÈRE écriture de chaque entité, une seule
   fois : cloner toute la base à chaque incrément de compteur coûterait
   plus cher que la sauvegarde qu'on cherche à alléger. */
function snapshotEntity(coll,id,sq){
  var k=coll+"|"+((sq&&sq.id)||"")+"|"+id;
  if(TX.seen[k])return;
  TX.seen[k]=1;
  var i=collFind(coll,id,sq),arr=collArray(coll,sq);
  TX.before.push({coll:coll,id:id,squadId:(sq&&sq.id)||null,
                  value:(i===-1)?null:clone(arr[i]),index:i});
}
function restoreSnapshot(s){
  var sq=s.squadId?squadById(s.squadId):null;
  if(s.squadId&&!sq)return;
  var arr=collArray(s.coll,sq);
  if(!arr)return;
  var i=collFind(s.coll,s.id,sq);
  if(s.value===null){if(i!==-1)arr.splice(i,1);return}
  if(i===-1){
    if(s.index>=0&&s.index<=arr.length)arr.splice(s.index,0,s.value);
    else arr.push(s.value);
  } else arr[i]=s.value;
}
function pushOp(coll,id,op,payload,sq){
  TX.ops.push({id:uid(),at:nowISO(),gid:TX.gid,by:state.meId||null,dev:devId(),
    entity:coll,entityId:id,squadId:(sq&&sq.id)||null,op:op,payload:payload||null});
}

/* Une transaction : un instantané des seules entités touchées, la
   mutation, puis soit la validation, soit la remise en état. Une
   transaction qui lève ne laisse rien à moitié écrit, et ne pousse
   rien sur la pile d'annulation — il n'y a rien à annuler. */
function storeTx(fn,label){
  if(TX.depth>0){TX.depth++;try{return fn()}finally{TX.depth--}}
  TX.depth=1;TX.gid=uid();TX.before=[];TX.ops=[];TX.seen={};
  var before=TX.before,ops=TX.ops;
  try{
    var r=fn();
    OPLOG.push.apply(OPLOG,ops);
    if(OPLOG.length>OPS_MAX)OPLOG.splice(0,OPLOG.length-OPS_MAX);
    if(before.length){
      undoStack.push({kind:"snapshot",label:label||"Modification",
                      gid:TX.gid,before:before});
      trimUndo();
    }
    TX.depth=0;TX.gid=null;
    if(ops.length)scheduleAutoSave();
    return r;
  }catch(e){
    /* Du plus récent au plus ancien : une entité touchée deux fois
       retrouve bien sa valeur d'AVANT la transaction. */
    before.slice().reverse().forEach(function(s){
      try{restoreSnapshot(s)}catch(e2){}
    });
    TX.depth=0;TX.gid=null;
    showToast("⚠️ Opération annulée");
    throw e;
  }
}
function inTx(fn,label){return TX.depth>0?fn():storeTx(fn,label)}

var Store={
  get:function(coll,id,sq){
    var i=collFind(coll,id,sq);
    return i===-1?null:collArray(coll,sq)[i];
  },
  query:function(coll,filtre,sq){
    var arr=collArray(coll,sq)||[];
    if(!filtre)return arr.slice();
    if(typeof filtre==="function")return arr.filter(filtre);
    return arr.filter(function(o){
      for(var k in filtre)if(filtre.hasOwnProperty(k)&&o[k]!==filtre[k])return false;
      return true;
    });
  },
  put:function(coll,obj,sq){
    var d=COLLECTIONS[coll];
    if(!d||!obj)return null;
    var id=obj[d.key];
    return inTx(function(){
      snapshotEntity(coll,id,sq);
      var arr=collArray(coll,sq),i=collFind(coll,id,sq);
      if(i===-1)arr.push(obj);else arr[i]=obj;
      pushOp(coll,id,"put",clone(obj),sq);
      return obj;
    },"Enregistrement");
  },
  patch:function(coll,id,champs,sq){
    return inTx(function(){
      var o=Store.get(coll,id,sq);
      if(!o)return null;
      snapshotEntity(coll,id,sq);
      Object.keys(champs||{}).forEach(function(k){o[k]=champs[k]});
      pushOp(coll,id,"patch",clone(champs||{}),sq);
      return o;
    },"Modification");
  },
  del:function(coll,id,sq){
    return inTx(function(){
      var i=collFind(coll,id,sq);
      if(i===-1)return false;
      snapshotEntity(coll,id,sq);
      collArray(coll,sq).splice(i,1);
      pushOp(coll,id,"del",null,sq);
      return true;
    },"Suppression");
  },
  tx:storeTx,
  /* Ce que le serveur de demain viendra drainer. */
  ops:function(){return OPLOG.slice()},
  opsSince:function(mark){
    if(!mark)return OPLOG.slice();
    return OPLOG.filter(function(o){return o.at>mark});
  },
  flush:function(mode){
    if(mode==="full")saveNow();else scheduleAutoSave();
  }
};

/* ── Journal sur disque ────────────────────────────────────────
   Le blob complet reste la vérité ; le journal n'est qu'un
   accélérateur, écrit bien plus souvent parce qu'il est petit. S'il
   est absent, illisible ou en retard, il est simplement ignoré :
   aucune donnée ne repose sur lui seul. */
function writeOpsJournal(){
  if(opsWriting){opsPending=true;return}
  var pend=OPLOG.slice(-200);
  if(!pend.length){try{localStorage.removeItem(SK_OPS)}catch(e){}return}
  opsWriting=true;
  var done=function(){
    opsWriting=false;
    if(opsPending){opsPending=false;writeOpsJournal()}
  };
  if(VAULT.unlocked){
    vaultEncrypt({ops:pend}).then(function(box){
      try{localStorage.setItem(SK_OPS,JSON.stringify(box))}catch(e){}
    }).catch(function(){}).then(done);
  } else {
    try{localStorage.setItem(SK_OPS,JSON.stringify({plain:true,ops:pend}))}catch(e){}
    done();
  }
}
function scheduleOpsJournal(){
  if(opsTimer)clearTimeout(opsTimer);
  opsTimer=setTimeout(function(){opsTimer=null;writeOpsJournal()},400);
}
function clearOpsJournal(){
  OPLOG=[];
  if(opsTimer){clearTimeout(opsTimer);opsTimer=null}
  try{localStorage.removeItem(SK_OPS)}catch(e){}
}
/* Rejeu au chargement : les opérations postérieures au blob, et elles
   seules. Chaque opération est idempotente par construction — un `put`
   remplace, un `del` supprime, un `patch` fusionne — donc rejouer deux
   fois donne le même état. Au moindre doute, on abandonne l'opération
   plutôt que de deviner. */
function applyOp(op){
  if(!op||!COLLECTIONS[op.entity])return;
  var sq=op.squadId?squadById(op.squadId):null;
  if(op.squadId&&!sq)return;
  var arr=collArray(op.entity,sq);
  if(!arr)return;
  var i=collFind(op.entity,op.entityId,sq);
  if(op.op==="put"){if(i===-1)arr.push(op.payload);else arr[i]=op.payload}
  else if(op.op==="patch"){
    if(i===-1)return;
    Object.keys(op.payload||{}).forEach(function(k){arr[i][k]=op.payload[k]});
  }
  else if(op.op==="del"){if(i!==-1)arr.splice(i,1)}
}
function replayOps(ops,boxAt){
  var n=0;
  (ops||[]).forEach(function(op){
    if(boxAt&&!(String(op.at||"")>String(boxAt)))return;
    try{applyOp(op);n++}catch(e){}
  });
  return n;
}
/* Appelée après loadAll. Asynchrone quand le coffre est en service —
   le déchiffrement l'est — d'où le rappel `apres`. */
function replayPendingOps(boxAt,apres){
  var raw=null;
  try{raw=localStorage.getItem(SK_OPS)}catch(e){}
  var fini=function(n){
    if(n>0){DB=normalizeDB(DB);saveNow()}
    clearOpsJournal();
    if(apres)apres(n);
  };
  if(!raw){if(apres)apres(0);return}
  var box=null;
  try{box=JSON.parse(raw)}catch(e){}
  if(!box){clearOpsJournal();if(apres)apres(0);return}
  if(box.plain){fini(replayOps(box.ops,boxAt));return}
  if(!VAULT.unlocked||!VAULT.key){clearOpsJournal();if(apres)apres(0);return}
  vaultDecryptWithKey(box).then(function(data){
    fini(replayOps(data&&data.ops,boxAt));
  }).catch(function(){clearOpsJournal();if(apres)apres(0)});
}


/* ── Normalisation défensive (import & rechargement) ───────── */
/* Migration v4 → v5 : les sessions antérieures n'ont pas d'événement.
   On les rattache en devinant la nature depuis leur nom, et on reconstitue
   les tournois d'après la convention « Tournoi X · match N ». Un rattachement
   deviné reste corrigeable : l'événement est éditable. */
function guessKind(name){
  var n=(name||"").toLowerCase();
  if(/tournoi|tourn\.|invitation/.test(n))return "tournament";
  if(/amical|hors.?concours|pr[ée]paration/.test(n))return "friendly";
  if(/entra[îi]nement|pratique/.test(n))return "training";
  return "league";
}
function guessOpponent(name){
  var m=(name||"").match(/\b(?:vs|contre|c\.?)\s+(.+)$/i);
  return m?m[1].trim():"";
}
/* « Tournoi Sherbrooke · match 2 » → « Tournoi Sherbrooke » */
function eventKeyOf(name){
  var m=(name||"").match(/^(.*?)\s*[·:•\-–]\s*match\s*\d+\s*$/i);
  return m?m[1].trim():null;
}
function attachOrphanSessions(sq){
  var byKey={};
  sq.events.forEach(function(ev){if(ev.migratedKey)byKey[ev.migratedKey]=ev});
  var known={};sq.events.forEach(function(ev){known[ev.id]=true});
  /* Les sessions sont empilées récentes en tête : on remonte le temps
     pour que les matchs d'un même tournoi se retrouvent dans l'ordre. */
  sq.sessions.slice().reverse().forEach(function(se){
    if(se.eventId&&known[se.eventId])return;
    var groupe=eventKeyOf(se.name);
    var cle=groupe||("§"+se.id);
    if(byKey[cle]){se.eventId=byKey[cle].id;return}
    var ev=mkEvent({kind:guessKind(se.name),
      name:groupe||se.name,opponent:guessOpponent(se.name),
      date:se.day||dayOf(se.date)});
    ev.migratedKey=cle;
    sq.events.push(ev);known[ev.id]=true;byKey[cle]=ev;
    se.eventId=ev.id;
  });
}

function normalizeSquad(sq,knownPlayers){
  sq=Object.assign(mkSquad(),sq);
  sq.roster=(sq.roster||[]).filter(function(e){return e&&knownPlayers[e.playerId]}).map(function(e){
    return Object.assign(mkRosterEntry(e.playerId),e,{number:cleanNum(e.number),
      status:STATUSES[e.status]?e.status:"candidate",
      membership:MEMBERSHIPS[e.membership]?e.membership:"active"});
  });
  var inRoster={};sq.roster.forEach(function(e){inRoster[e.playerId]=true});

  /* Campagnes — tout squad en possède au moins une. */
  sq.campaigns=(sq.campaigns||[]).map(function(c){
    return Object.assign(mkCampaign(),c,{kind:KIND_BY_KEY[c.kind]?c.kind:"custom"});
  });
  if(!sq.campaigns.length)sq.campaigns.push(mkCampaign({kind:"tryout"}));
  var legacyCampaignId=sq.campaigns[0].id,campKnown={};
  sq.campaigns.forEach(function(c){campKnown[c.id]=c});
  if(!campKnown[sq.activeCampaignId])sq.activeCampaignId=sq.campaigns[sq.campaigns.length-1].id;

  sq.playerIds=(sq.playerIds||[]).filter(function(pid){return inRoster[pid]});
  sq.lineup=(sq.lineup||[]).filter(function(pid){return sq.playerIds.indexOf(pid)!==-1});
  sq.subteams=(sq.subteams||[]).map(function(st){
    return {id:st.id||uid(),name:st.name||"Sous-équipe",
      playerIds:(st.playerIds||[]).filter(function(pid){return sq.playerIds.indexOf(pid)!==-1})};
  });
  var st={};Object.keys(sq.stats||{}).forEach(function(pid){if(inRoster[pid])st[pid]=normStats(sq.stats[pid])});
  sq.stats=st;
  sq.events=(sq.events||[]).map(function(ev){
    return Object.assign(mkEvent(),ev,{kind:EVENT_KINDS[ev.kind]?ev.kind:"league",date:dayOf(ev.date)||todayISO()});
  });
  sq.sessions=(sq.sessions||[]).map(function(se){
    return {id:se.id||uid(),name:se.name||"Session",date:se.date||nowISO(),
      day:dayOf(se.day||se.date)||todayISO(),
      opponent:se.opponent||guessOpponent(se.name||""),
      eventId:se.eventId||"",teamName:se.teamName||sq.name,
      result:(se.result&&se.result.sets)?{sets:se.result.sets.filter(function(x){
        return x&&isFinite(x.us)&&isFinite(x.them)}).map(function(x){
        return {us:Math.max(0,Math.round(x.us)),them:Math.max(0,Math.round(x.them))}})}:mkResult(),
      entries:(se.entries||[]).map(function(en){return {playerId:en.playerId,name:en.name||"",
        number:cleanNum(en.number),position:en.position||"",stats:normStats(en.stats)}}),
      /* ⚠ Ce littéral DÉTRUIT toute clé qu'il ne nomme pas. Sans ces deux
         lignes, la ventilation par set disparaîtrait à chaque chargement,
         en silence. */
      sets:Array.isArray(se.sets)?se.sets:[],
      splitAt:se.splitAt||null};
  });
  attachOrphanSessions(sq);
  /* Les réglages du score : normalisés une fois ici, pour qu'une sauvegarde
     d'avant leur existence reparte des valeurs par défaut sans rien casser. */
  sq.scoring=scoringOf(sq);
  sq.selectorViews=(sq.selectorViews||[]).map(function(v){
    v=Object.assign(mkSelectorView(),v);
    v.playerIds=(v.playerIds||[]).filter(function(pid){return inRoster[pid]});
    v.criteria=(v.criteria||[]).filter(function(c){return CRIT_BY_KEY[c]});
    if(!v.criteria.length)v.criteria=CRITERIA.map(function(c){return c.key});
    v.groups=normGroups(v.groups);
    if(!campKnown[v.campaignId])v.campaignId=legacyCampaignId;
    v.campaignName=campKnown[v.campaignId].name;
    v.anonymous=v.anonymous!==false;
    var d={};v.playerIds.forEach(function(pid){
      var src=(v.data||{})[pid]||{};
      d[pid]={stats:normStats(src.stats),ratings:src.ratings||{},
        reco:RECO_BY_KEY[src.reco]?src.reco:"",pos:normPos(src.pos),note:src.note||""};
    });
    v.data=d;
    return v;
  });
  sq.submissions=(sq.submissions||[]).map(function(sub){
    var cid=campKnown[sub.campaignId]?sub.campaignId:legacyCampaignId;
    return {id:sub.id||uid(),viewId:sub.viewId||"",viewName:sub.viewName||"Vue",
      selectorName:sub.selectorName||"",selectorToken:sub.selectorToken||"",
      campaignId:cid,campaignName:campKnown[cid].name,context:sub.context||"",
      submittedAt:sub.submittedAt||nowISO(),criteria:sub.criteria||CRITERIA.map(function(c){return c.key}),
      entries:(sub.entries||[]).filter(function(e){return e&&e.playerId}).map(function(e){
        return {playerId:e.playerId,number:cleanNum(e.number),stats:normStats(e.stats),
          ratings:e.ratings||{},reco:RECO_BY_KEY[e.reco]?e.reco:"",pos:normPos(e.pos),note:e.note||""};
      })};
  });

  /* ── Collections v7 ──────────────────────────────────────────
     Une ligne qui désigne une campagne ou une athlète disparue tombe :
     c'est une arête, exactement comme les affectations de normalizeDB. */
  sq.campaignRoster=(sq.campaignRoster||[]).filter(function(e){
      return e&&campKnown[e.campaignId]&&inRoster[e.playerId];
    }).map(function(e){
      return Object.assign(mkCampaignRosterEntry(e.campaignId,e.playerId),e,{
        decision:RECO_BY_KEY[e.decision]?e.decision:"",
        number:cleanNum(e.number)});
    });
  /* Unicité (campagne, athlète) : la décision la plus récente l'emporte. */
  var vusCR={},crOut=[];
  sq.campaignRoster.forEach(function(e){
    var k=e.campaignId+"|"+e.playerId,prec=vusCR[k];
    if(!prec){vusCR[k]=e;crOut.push(e);return}
    if(String(e.decidedAt||"")>String(prec.decidedAt||"")){
      crOut[crOut.indexOf(prec)]=e;vusCR[k]=e;
    }
  });
  sq.campaignRoster=crOut;

  sq.offers=(sq.offers||[]).filter(function(o){
      return o&&campKnown[o.campaignId]&&inRoster[o.playerId];
    }).map(function(o){
      return Object.assign(mkOffer(o.campaignId,o.playerId),o,{
        status:OFFER_STATUS[o.status]?o.status:"pending"});
    });
  /* Au plus une offre VIVANTE par couple. Les doublons sont annulés,
     jamais supprimés — une offre est un acte, même en double. Une offre
     acceptée l'emporte sur une offre en attente : elle engage, l'autre
     non. */
  var vive={};
  sq.offers.slice().sort(function(a,b){
    var pa=(a.status==="accepted")?1:0,pb=(b.status==="accepted")?1:0;
    if(pa!==pb)return pa-pb;
    return String(a.createdAt||"")<String(b.createdAt||"")?-1:1;
  }).forEach(function(o){
    if(o.voidedAt)return;
    var k=o.campaignId+"|"+o.playerId;
    if(vive[k])vive[k].voidedAt=vive[k].voidedAt||nowISO();
    vive[k]=o;
  });

  /* Un objectif d'athlète sortie du roster est DÉSACTIVÉ, pas supprimé :
     son historique documente une progression qui a bien eu lieu. */
  sq.goals=(sq.goals||[]).map(normalizeGoal).map(function(g){
    if(g.scope==="player"&&!inRoster[g.playerId])g.active=false;
    return g;
  });

  /* Bornes de set : données d'une saisie en cours, nettoyées comme
     sq.stats l'est juste au-dessus. */
  sq.setMarks=(sq.setMarks||[]).map(function(m){
    var mst={};
    Object.keys((m&&m.stats)||{}).forEach(function(pid){
      if(inRoster[pid])mst[pid]=normStats(m.stats[pid]);
    });
    return {at:(m&&m.at)||nowISO(),stats:mst};
  });

  migrateSquadV6(sq);
  return sq;
}

/* ── v6 → v7 ──────────────────────────────────────────────────────
   Trois ajouts, aucun retrait :
     · la convocation devient datée, campagne par campagne ;
     · les décisions déjà prises deviennent des décisions de campagne ;
     · une athlète déjà dans l'équipe reçoit l'offre acceptée qui l'y a mise.

   Idempotente : chaque étape teste l'existence avant de créer et
   n'écrit jamais sur une ligne qu'elle n'a pas créée. Elle n'est donc
   pas conditionnée à un numéro de version — elle tourne à chaque
   chargement et ne produit aucune différence sur une base déjà montée. */
function normalizeGoal(g){
  g=Object.assign(mkGoal(),g||{});
  g.scope=(g.scope==="team")?"team":"player";
  if(g.scope==="team")g.playerId="";
  g.metric=Object.assign({kind:"familyEff",family:"attaques",statKey:"",perMatch:false},g.metric||{});
  g.context=Object.assign({sections:["matches","tournaments"],eventKinds:[],window:"last5"},g.context||{});
  g.context.sections=(g.context.sections||[]).filter(function(s){return SECTION_BY_KEY[s]});
  g.context.eventKinds=(g.context.eventKinds||[]).filter(function(k){return EVENT_KINDS[k]});
  g.history=(g.history||[]).filter(function(h){return h&&h.at}).slice(-GOAL_HISTORY_MAX);
  g.active=g.active!==false;
  g.auto=g.auto!==false;
  return g;
}
function migrateSquadV6(sq){
  if(!Array.isArray(sq.campaignRoster))sq.campaignRoster=[];
  if(!Array.isArray(sq.offers))sq.offers=[];
  if(!Array.isArray(sq.goals))sq.goals=[];
  if(!Array.isArray(sq.setMarks))sq.setMarks=[];

  /* Champs neufs des campagnes. `seq` suit l'ordre existant : il ne
     fabrique aucune hiérarchie qui n'était pas là. */
  var ordre=campaignOrder(sq);
  ordre.forEach(function(c,i){
    if(!(c.seq>0))c.seq=i+1;
    if(c.date===undefined||c.date===null)c.date=dayOf(c.createdAt)||"";
    if(c.note===undefined)c.note="";
    if(c.decisionsClosedAt===undefined)c.decisionsClosedAt=c.closedAt||null;
  });

  /* La campagne d'accueil des décisions héritées : la PREMIÈRE de la
     saison dans l'ordre métier. C'est elle qui a produit l'effectif
     d'aujourd'hui — les porter sur la dernière ferait croire qu'on a
     tranché hier ce qu'on avait tranché en août. */
  var c0=campaignOrder(sq)[0];
  if(!c0)return;

  /* Convocation : toute ligne de roster devient une convoquée de c0,
     avec sa décision si elle en porte une. `candidate` est l'absence
     de décision — on n'en fabrique pas.

     La garde porte sur TOUTES les campagnes, et non sur c0 seule : une
     athlète convoquée à la seule journée 2 a bien une convocation, et
     la migration n'a rien à reprendre pour elle. Avec une garde sur c0,
     elle serait versée à la journée 1 au rechargement suivant — la
     campagne d'août gagnerait en silence des athlètes qui n'y étaient
     pas, ce qui est exactement ce que la lecture par campagne interdit. */
  sq.roster.forEach(function(r){
    if(campaignsOfPlayer(sq,r.playerId).length)return;
    var tranche=(r.status&&r.status!=="candidate");
    sq.campaignRoster.push(mkCampaignRosterEntry(c0.id,r.playerId,{
      convokedAt:c0.date||c0.createdAt||nowISO(),
      decision:STATUS_TO_RECO[r.status]||"",
      decidedAt:tranche?(c0.closedAt||c0.createdAt||nowISO()):null
    }));
  });

  /* Offres : une athlète DANS l'équipe a forcément accepté. On date
     l'acceptation de la clôture de la campagne, ou de sa création —
     une date approchée vaut mieux qu'une date absente, et l'ordre
     relatif reste juste.

     Une athlète coupée ou recallée ne reçoit PAS d'offre refusée :
     ne pas avoir été retenue n'est pas avoir refusé une offre, et on
     ne fabrique pas un fait qui n'a pas eu lieu.

     Là encore la garde couvre toutes les campagnes : une athlète entrée
     dans l'équipe par une offre acceptée en journée 2 en a déjà une.
     Lui en fabriquer une seconde sur c0 lui donnerait deux offres
     vivantes, dont « Constituer l'équipe » ne saurait laquelle trancher. */
  sq.playerIds.forEach(function(pid){
    if(offersOfPlayer(sq,pid).some(offerIsLive))return;
    sq.offers.push(mkOffer(c0.id,pid,{
      status:"accepted",
      createdAt:c0.createdAt||nowISO(),
      decidedAt:c0.closedAt||c0.createdAt||nowISO(),
      note:"Reprise v7 — athlète déjà dans l'équipe"}));
  });

  /* Sessions : la ventilation naît vide. On ne DEVINE pas les sets —
     répartir quarante attaques sur trois manches serait inventer de
     la donnée. `sets:[]` veut dire « non ventilé », et setsOfSession
     sait le lire. */
  sq.sessions.forEach(function(se){
    if(!Array.isArray(se.sets))se.sets=[];
    if(se.splitAt===undefined)se.splitAt=null;
    se.sets.forEach(function(s,i){
      var sc=((se.result&&se.result.sets)||[])[i]||{us:0,them:0};
      s.index=i;s.us=sc.us||0;s.them=sc.them||0;
      s.entries=(s.entries||[]).filter(function(x){return x&&x.playerId})
        .map(function(x){return {playerId:x.playerId,stats:normStats(x.stats)}});
    });
    if(sessionIsSplit(se))reconcileSessionTotals(se);
  });

  /* Aucun objectif n'est créé : un objectif est une décision de
     l'entraîneur, pas un effet de bord d'une migration. */

  recomputeRosterStatus(sq);
  if(!sq.schemaAt)sq.schemaAt=nowISO();
}

/* ══ CONTRÔLE D'INTÉGRITÉ ══════════════════════════════════════
   Appelé par les tests, jamais en production. Rend la liste des
   invariants violés — vide quand tout va bien. */
function checkV7(db){
  var pb=[];
  (db||DB).squads.forEach(function(sq){
    var camp={},ros={};
    (sq.campaigns||[]).forEach(function(c){camp[c.id]=true});
    (sq.roster||[]).forEach(function(r){ros[r.playerId]=true});
    var vus={};
    (sq.campaignRoster||[]).forEach(function(e){
      if(!camp[e.campaignId])pb.push("I8 campagne inconnue "+e.campaignId);
      if(!ros[e.playerId])pb.push("I8 athlète hors roster "+e.playerId);
      var k=e.campaignId+"|"+e.playerId;
      if(vus[k])pb.push("I9 convocation en double "+k);
      vus[k]=1;
    });
    var vivantes={};
    (sq.offers||[]).forEach(function(o){
      if(!camp[o.campaignId])pb.push("I8 offre sur campagne inconnue "+o.campaignId);
      if(!OFFER_STATUS[o.status])pb.push("I8 statut d'offre inconnu "+o.status);
      if(o.voidedAt)return;
      var k=o.campaignId+"|"+o.playerId;
      if(vivantes[k])pb.push("I9 deux offres vivantes "+k);
      vivantes[k]=1;
    });
    (sq.sessions||[]).forEach(function(se){
      if(!sessionIsSplit(se))return;
      var somme=sumBySet(se);
      (se.entries||[]).forEach(function(en){
        var s=somme[en.playerId]||emptyS();
        for(var i=0;i<ALL_STATS.length;i++){
          var k=ALL_STATS[i].key;
          if((en.stats[k]||0)!==(s[k]||0)){
            pb.push("I6 ventilation ≠ total, session "+se.id+" "+k);break;
          }
        }
      });
      se.sets.forEach(function(s,i){
        var sc=((se.result&&se.result.sets)||[])[i]||{us:0,them:0};
        if(s.us!==(sc.us||0)||s.them!==(sc.them||0))
          pb.push("I11 score dédoublé, session "+se.id+" set "+(i+1));
      });
    });
    (sq.roster||[]).forEach(function(r){
      if(r.status!==derivedStatus(sq,r.playerId,r.status))
        pb.push("I4 statut non dérivé "+r.playerId);
    });
  });
  return pb;
}

function normalizeDB(db){
  db=Object.assign(emptyDB(),db);
  db.version=7;
  db.enrolledId=db.enrolledId||null;
  db.superId=db.superId||null;
  db.rootFile=db.rootFile||null;

  db.log=(db.log||[]).filter(function(l){return l&&l.at&&l.text}).map(function(l){
    return {id:l.id||uid(),at:l.at,kind:LOG_KINDS[l.kind]?l.kind:"status",
      byId:l.byId||null,byName:l.byName||"—",byRole:l.byRole||"",
      teamId:l.teamId||"",seasonId:l.seasonId||"",playerId:l.playerId||"",text:String(l.text)};
  }).slice(-LOG_MAX);
  db.people=(db.people||[]).map(function(p){
    var q=Object.assign(mkPerson(),p,{revoked:!!p.revoked});
    if(p.unclaimed)q.unclaimed=true;   /* compte hérité, en attente d'un nom */
    /* L'administration devient une affectation : on retient l'ancien
       drapeau le temps de la migration, puis on l'efface. */
    if(p.isAdmin)q.wasAdmin=true;
    delete q.isAdmin;
    return q;
  });
  db.clubs=(db.clubs||[]).map(function(c){
    var q=Object.assign(mkClub(),c,{archived:!!c.archived});
    q.categories=cleanCategories(q.categories);
    if(!q.categories.length)q.categories=CATEGORIES_DEFAUT.slice();
    return q;
  });
  db.players=(db.players||[]).map(function(p){
    var q=Object.assign(mkDbPlayer(),p,{archived:!!p.archived});
    /* Une base d'avant la date complète ne porte que l'année : elle la
       garde. Une date reçue d'ailleurs redonne son année, pour que le
       dédoublonnage continue de s'y appuyer. */
    var b=parseBirth(q.birthDate||q.birthYear)||parseBirth(q.birthYear);
    if(b){q.birthDate=b.date;q.birthYear=b.year}
    else {q.birthDate="";q.birthYear=cleanNum(q.birthYear).slice(0,4)}
    return q;
  });
  db.teams=(db.teams||[]).map(function(t){return Object.assign(mkTeamRecord(),t,{freeView:!!t.freeView,archived:!!t.archived})});
  db.seasons=(db.seasons||[]).map(function(s){
    return Object.assign({id:uid(),name:"Saison",createdAt:nowISO(),startDate:"",endDate:"",
      notes:"",closedAt:null,archived:false},s);
  });

  /* ── v5 → v6 ────────────────────────────────────────────────
     Une base d'avant les clubs en tient un seul, implicite : on lui
     donne un nom et on y range ses équipes. Les administrateurs
     d'alors — reconnus à leur ancien drapeau isAdmin — en deviennent
     les administrateurs. La charte reste à signer par le propriétaire :
     un club hérité est valide, mais il n'a pas été créé par lui. */
  /* Une équipe appartient toujours à un club : s'il n'en existe aucun,
     c'est une base d'avant les clubs, quelle que soit sa version
     déclarée — les migrations plus anciennes passent aussi par ici. */
  if(db.teams.length&&!db.clubs.length){
    var club0=mkClub({name:"Mon club",charter:null,inherited:true});
    db.clubs.push(club0);
    db.teams.forEach(function(t){if(!t.clubId)t.clubId=club0.id});
    (db.people||[]).forEach(function(p){
      if(p.wasAdmin&&!p.revoked)
        db.clubAssignments.push(mkClubAssignment(p.id,club0.id,"admin"));
    });
  }
  if(db.clubs.length===1){
    /* Une équipe sans club rejoint le seul qui existe, plutôt que de
       devenir invisible. */
    db.teams.forEach(function(t){if(!t.clubId)t.clubId=db.clubs[0].id});
  }
  db.people.forEach(function(p){delete p.wasAdmin});

  var knownClubs={};db.clubs.forEach(function(c){knownClubs[c.id]=c});
  db.teams=db.teams.filter(function(t){return !t.clubId||knownClubs[t.clubId]});
  var knownPlayers={};db.players.forEach(function(p){knownPlayers[p.id]=true});
  var knownPeople={};db.people.forEach(function(p){knownPeople[p.id]=true});
  var knownTeams={};db.teams.forEach(function(t){knownTeams[t.id]=t});
  var knownSeasons={};db.seasons.forEach(function(x){knownSeasons[x.id]=true});

  /* Une affectation ne survit pas à la disparition de sa personne ou de
     son équipe : c'est une arête, elle tombe avec ses extrémités. */
  var seen={};
  db.assignments=(db.assignments||[]).filter(function(a){
    if(!a||!knownPeople[a.personId]||!knownTeams[a.teamId])return false;
    if(!ROLES[a.role])return false;
    var k=a.personId+"|"+a.teamId+"|"+a.role;
    if(seen[k])return false;
    seen[k]=1;return true;
  }).map(function(a){return Object.assign({id:uid(),createdAt:nowISO()},a)});

  /* Affectations de club : mêmes règles d'arête. */
  var vus={};
  db.clubAssignments=(db.clubAssignments||[]).filter(function(a){
    if(!a||!knownPeople[a.personId]||!knownClubs[a.clubId])return false;
    if(!CLUB_ROLES[a.role])return false;
    var k=a.personId+"|"+a.clubId+"|"+a.role;
    if(vus[k])return false;
    vus[k]=1;return true;
  }).map(function(a){return Object.assign({id:uid(),createdAt:nowISO(),grant:null},a)});

  db.squads=(db.squads||[]).filter(function(sq){
    return sq&&knownTeams[sq.teamId]&&knownSeasons[sq.seasonId];
  }).map(function(sq){
    var out=normalizeSquad(sq,knownPlayers);
    var t=knownTeams[out.teamId];
    /* Copies rafraîchies depuis l'équipe durable — jamais la source. */
    out.name=t.name;out.category=t.category;out.freeView=!!t.freeView;
    return out;
  });

  if(!db.seasons.length)db.seasons.push(mkSeason());
  if(!db.seasons.some(function(x){return x.id===db.activeSeasonId}))db.activeSeasonId=db.seasons[0].id;
  return db;
}

/* ── Migration v3 → v4 ──────────────────────────────────────
   season.teams[i] devient une équipe durable plus un squad. Les
   campagnes, jusque-là portées par la saison, descendent dans chaque
   squad : chaque équipe mène désormais ses propres campagnes. */
function migrateV3(old){
  var db=emptyDB();
  db.players=(old.players||[]).slice();
  /* Les versions d'avant les rôles n'avaient pas de personnes. On crée le
     propriétaire sans le nommer : l'écran de garde demandera qui c'est. */
  var admin=mkPerson({name:""});
  admin.unclaimed=true;admin.isAdmin=true;   /* lu par la migration v5→v6 */
  db.people.push(admin);

  (old.seasons||[]).forEach(function(os){
    var season={id:os.id||uid(),name:os.name||"Saison",createdAt:os.createdAt||nowISO(),
      startDate:os.startDate||"",endDate:os.endDate||"",notes:os.notes||"",
      closedAt:os.closedAt||null,archived:!!os.archived};
    db.seasons.push(season);

    (os.teams||[]).forEach(function(ot){
      /* Une équipe portant déjà ce nom est réutilisée : c'est le même
         groupe d'une saison à l'autre. */
      var team=null;
      db.teams.forEach(function(t){if(t.name===(ot.name||"Équipe"))team=t});
      if(!team){
        /* Les bases d'avant les équipes durables rangeaient la catégorie
           sur la saison. Elle descend ici sur l'équipe, à qui elle
           appartient — c'est le seul endroit où `os.category` se lit
           encore, et une saison n'en porte plus. */
        team=mkTeamRecord({name:ot.name||"Équipe",category:os.category||""});
        db.teams.push(team);
        db.assignments.push(mkAssignment(admin.id,team.id,"coach"));
      }
      var sq=mkSquad(team.id,season.id,team.name);
      sq.category=team.category;
      sq.playerIds=(ot.playerIds||[]).slice();
      sq.lineup=(ot.lineup||[]).slice();
      sq.subteams=(ot.subteams||[]).slice();
      sq.stats=Object.assign({},ot.stats||{});
      sq.sessions=(ot.sessions||[]).slice();
      /* Roster, campagnes, vues et soumissions étaient au niveau saison :
         ils appartenaient en réalité à l'équipe qui les a produits. */
      sq.roster=clone(os.roster||[]);
      sq.campaigns=clone(os.campaigns||[]);
      sq.activeCampaignId=os.activeCampaignId||null;
      sq.selectorViews=clone((os.selectorViews||[]));
      sq.submissions=clone((os.submissions||[]));
      db.squads.push(sq);
    });
  });
  if(!db.teams.length){
    var t=mkTeamRecord({name:"Équipe A"});
    db.teams.push(t);
    db.assignments.push(mkAssignment(admin.id,t.id,"coach"));
  }
  if(!db.seasons.length)db.seasons.push(mkSeason());
  db.activeSeasonId=old.activeSeasonId||db.seasons[0].id;
  return db;
}

/* ── Migration v2 → v3 ─────────────────────────────────────── */
function migrateV2(old){
  var db={version:3,players:[],seasons:[],activeSeasonId:null};
  var c0=mkCampaign({kind:"tryout"});
  var season={id:uid(),name:"Saison "+new Date().getFullYear(),createdAt:nowISO(),
    category:"",startDate:"",endDate:"",notes:"",closedAt:null,archived:false,
    campaigns:[c0],activeCampaignId:c0.id,
    roster:[],teams:[],activeTeamId:null,selectorViews:[],submissions:[]};
  function mkV3Team(name){
    return {id:uid(),name:name||"Équipe",playerIds:[],lineup:[],subteams:[],stats:{},sessions:[]};
  }
  var byKey={};
  function ensurePlayer(name,number,position){
    var key=(name||"").trim().toLowerCase()+"#"+cleanNum(number);
    if(byKey[key])return byKey[key];
    var parts=(name||"").trim().split(/\s+/);
    var p=mkDbPlayer({firstName:parts.shift()||"",lastName:parts.join(" ")});
    db.players.push(p);byKey[key]=p.id;
    if(!rosterEntryIn(season,p.id)){
      var e=mkRosterEntry(p.id,number,position);e.status="selected";season.roster.push(e);
    }
    return p.id;
  }
  function rosterEntryIn(s,pid){for(var i=0;i<s.roster.length;i++)if(s.roster[i].playerId===pid)return s.roster[i];return null}

  (old.teams||[]).forEach(function(ot){
    var t=mkV3Team(ot.name||"Équipe");
    var idxToPid=[];
    (ot.players||[]).forEach(function(op,i){
      if(!op||!(op.name||"").trim()){idxToPid[i]=null;return}
      var pid=ensurePlayer(op.name,op.number,op.position);
      idxToPid[i]=pid;
      if(t.playerIds.indexOf(pid)===-1)t.playerIds.push(pid);
      t.stats[pid]=normStats(op.stats);
    });
    t.lineup=(ot.activePlayers||[]).map(function(i){return idxToPid[i]}).filter(Boolean);
    t.subteams=(ot.subteams||[]).map(function(st){
      return {id:st.id||uid(),name:st.name||"Sous-équipe",playerIds:(st.playerIndices||[]).map(function(i){return idxToPid[i]}).filter(Boolean)};
    });
    t.sessions=(ot.sessions||[]).map(function(os){
      return {id:uid(),name:os.name||"Session",date:os.date||nowISO(),teamName:t.name,
        entries:(os.players||[]).filter(function(op){return op&&(op.name||"").trim()}).map(function(op){
          var pid=ensurePlayer(op.name,op.number,op.position);
          if(t.playerIds.indexOf(pid)===-1)t.playerIds.push(pid);
          return {playerId:pid,name:(op.name||"").trim(),number:cleanNum(op.number),position:op.position||"",stats:normStats(op.stats)};
        })};
    });
    season.teams.push(t);
  });
  if(!season.teams.length)season.teams.push(mkV3Team("Équipe A"));
  season.activeTeamId=season.teams[0].id;
  db.seasons.push(season);db.activeSeasonId=season.id;
  return db;
}
/* ── Migration v1 (clés brutes) → structure v2 ─────────────── */
function readLegacyV1(){
  try{
    var oldS=localStorage.getItem("vball_sessions_v5"),oldC=localStorage.getItem("vball_current_v5");
    if(!oldS&&!oldC)return null;
    return {teams:[{id:uid(),name:"Mon équipe",players:oldC?JSON.parse(oldC):[],sessions:oldS?JSON.parse(oldS):[],activePlayers:[],subteams:[]}]};
  }catch(e){return null}
}

function loadAll(fromVault){
  try{
    var raw=fromVault?"vault":localStorage.getItem(SK);
    if(raw){
      var parsed=fromVault?fromVault.db:JSON.parse(raw);
      if(fromVault&&fromVault.inbox)INBOX=fromVault.inbox;
      if(fromVault&&fromVault.secrets)SECRETS=Object.assign({github:null,superKey:null},fromVault.secrets);
      /* Chaîne de migration : v1 → v2 → v3 → v4, sans perte à chaque étape. */
      /* v4 → v5 se fait dans normalizeDB : les sessions orphelines y sont
         rattachées à une rencontre déduite de leur nom. */
      DB=normalizeDB((parsed.version>=4)?parsed:migrateV3(parsed));
      if(parsed.version<7)setTimeout(function(){showToast("✅ Données migrées vers la v7")},400);
    } else {
      var legacy=null;
      for(var i=0;i<LEGACY_KEYS.length&&!legacy;i++){
        var d=localStorage.getItem(LEGACY_KEYS[i]);
        if(d)legacy=JSON.parse(d);
      }
      if(!legacy)legacy=readLegacyV1();
      DB=legacy?normalizeDB(migrateV3(migrateV2(legacy))):emptyDB();
      if(legacy)setTimeout(function(){showToast("✅ Données migrées vers la v7")},400);
    }
  }catch(e){DB=emptyDB()}

  /* Un club a toujours au moins une saison, une équipe et un administrateur :
     sans quoi l'application n'offrirait aucun point d'entrée. */
  if(!DB.seasons.length)DB.seasons.push(mkSeason());
  if(!DB.seasons.some(function(x){return x.id===DB.activeSeasonId}))DB.activeSeasonId=DB.seasons[0].id;
  /* Ni administrateur ni équipe fabriqués d'office : les inventer ici
     revenait à donner l'administration à quiconque ouvrait la page, et
     l'appareil d'un sélectionneur n'a aucune raison d'en recevoir un. */

  try{
    if(!fromVault){var ib=localStorage.getItem(SK_INBOX);if(ib)INBOX=JSON.parse(ib)}
    INBOX.views=(INBOX.views||[]).map(function(v){return Object.assign(mkSelectorView(),v)});
  }catch(e){INBOX={views:[]}}
  try{
    var ui=localStorage.getItem(SK_UI);
    if(ui){var o=JSON.parse(ui);
      if(o.meId&&personById(o.meId))state.meId=o.meId;
      if(o.ctx)state.ctx=o.ctx;
      if(o.viewIdx!=null)state.viewIdx=Math.max(0,Math.min(VIEWS.length-1,o.viewIdx));
      if(o.posFilter)state.posFilter=o.posFilter;
      if(o.inputMode)state.inputMode=o.inputMode;
      if(o.svViewId)state.svViewId=o.svViewId;
      if(o.tab)state.tab=o.tab;
    }
  }catch(e){}

  /* Aucune identité n'est attribuée d'office : ouvrir l'application ne
     donne pas l'administration. Celle-ci se réclame à l'inscription, et
     le coffre en tient la clé. Une base déjà installée garde la sienne :
     on ne met personne dehors de ses propres données. */
  if(!state.meId||!personById(state.meId)){
    state.meId=DB.enrolledId&&personById(DB.enrolledId)?DB.enrolledId:null;
  }
  normalizeCtx();
  if(!tabsForCtx().some(function(t){return t.key===state.tab})&&!(isCoachCtx()&&COACH_MODES[state.tab]))
    state.tab=(tabsForCtx()[0]||{}).key||"season";
}

/* ══ UNDO ══════════════════════════════════════════════════════
   Instantané ciblé : { kind, payload } — restaure exactement la
   portion de modèle touchée, sans dépendre d'un index. */
var undoStack=[],MAX_UNDO=60;
function pushUndoStats(label){
  var t=curTeam();if(!t)return;
  undoStack.push({label:label,kind:"teamStats",teamId:t.id,data:clone(t.stats)});
  trimUndo();
}
function pushUndoView(label,view){
  if(!view)return;
  undoStack.push({label:label,kind:"viewData",viewId:view.id,data:clone(view.data)});
  trimUndo();
}
function trimUndo(){
  if(undoStack.length>MAX_UNDO)undoStack.shift();
  var b=document.getElementById("undoBtn");if(b)b.disabled=false;
}
function clearUndo(){undoStack=[]}
function doUndo(){
  if(!undoStack.length){showToast("Rien à annuler");return}
  var snap=undoStack.pop();
  if(snap.kind==="teamStats"){
    var t=null;
    DB.squads.forEach(function(x){if(x.id===snap.teamId)t=x});
    if(t)t.stats=snap.data;
  } else if(snap.kind==="viewData"){
    var v=findViewAnywhere(snap.viewId);
    if(v)v.data=snap.data;
  } else if(snap.kind==="snapshot"){
    /* Du plus récent au plus ancien : une entité touchée deux fois
       retrouve sa valeur d'avant la transaction. */
    snap.before.slice().reverse().forEach(function(x){
      try{restoreSnapshot(x)}catch(e){}
    });
  }
  scheduleAutoSave();showToast("↩ Annulé : "+snap.label);render();
}
function findViewAnywhere(id){
  for(var i=0;i<DB.seasons.length;i++){var v=viewById(DB.seasons[i],id);if(v)return v}
  for(var j=0;j<INBOX.views.length;j++)if(INBOX.views[j].id===id)return INBOX.views[j];
  return null;
}

/* ══ CUMULS & COMPILATION ══════════════════════════════════════ */
/* Cumul des sessions d'une équipe, agrégé par playerId (identité stable) */
var CUMUL_SCOPES=[{k:"all",l:"Toute la saison"},{k:"last3",l:"3 derniers"},{k:"last5",l:"5 derniers"},{k:"last10",l:"10 derniers"}];
/* Trois filtres qui se composent : combien de matchs, de quelle nature,
   et éventuellement un événement précis. Les sessions sont empilées les
   plus récentes en tête (unshift à l'enregistrement). */
function scopedSessions(team){
  if(!team)return [];
  var list=team.sessions;
  if(state.cumulEventId)list=list.filter(function(se){return se.eventId===state.cumulEventId});
  else if(state.cumulKind!=="all")list=list.filter(function(se){
    var ev=eventOf(team,se);return ev&&ev.kind===state.cumulKind;
  });
  var n={all:0,last3:3,last5:5,last10:10}[state.cumulScope]||0;
  return n?list.slice(0,n):list;
}
function cumulScopeLabel(team){
  if(state.cumulEventId){
    var ev=eventById(team,state.cumulEventId);
    return ev?eventLabel(ev):"Événement";
  }
  var k=state.cumulKind!=="all"?(EVENT_KINDS[state.cumulKind]||{}).label:"Toutes natures";
  var sc=CUMUL_SCOPES.filter(function(x){return x.k===state.cumulScope})[0];
  return k+" · "+(sc?sc.l.toLowerCase():"");
}
function computeGlobalPlayers(team){
  var season=team;if(!team||!team.sessions.length)return [];
  var map={};
  scopedSessions(team).forEach(function(sess){
    sess.entries.forEach(function(en){
      if(!hasStats(en.stats))return;
      var m=map[en.playerId];
      if(!m){
        var p=playerById(en.playerId),e=rosterEntry(season,en.playerId);
        m=map[en.playerId]={id:en.playerId,name:p?fullName(p):(en.name||"Joueuse"),
          number:(e&&e.number)||en.number,position:(e&&e.position)||en.position,
          stats:emptyS(),sessCount:0};
      }
      addStats(m.stats,en.stats);m.sessCount++;
    });
  });
  return Object.keys(map).map(function(k){return map[k]});
}

/* ── Campagnes ─────────────────────────────────────────────── */
function campaignById(squad,id){
  if(!squad)return null;
  for(var i=0;i<squad.campaigns.length;i++)if(squad.campaigns[i].id===id)return squad.campaigns[i];
  return null;
}
function curCampaign(squad){
  squad=squad||curSquad();if(!squad)return null;
  return campaignById(squad,squad.activeCampaignId)||squad.campaigns[squad.campaigns.length-1]||null;
}
function campaignLabel(c){
  if(!c)return "—";
  var k=KIND_BY_KEY[c.kind]||KIND_BY_KEY.custom;
  return k.icon+" "+c.name;
}
function campaignOpen(squad,c){
  return !!c && !c.closedAt && !seasonClosed(squad);
}
/* Accepte indifféremment une saison ou un squad : dans les deux cas la
   question est « la saison est-elle close ? ». */
function seasonClosed(x){
  if(!x)return false;
  var s=x.seasonId?seasonById(x.seasonId):x;
  return !!(s&&(s.closedAt||s.archived));
}
function campaignSubs(squad,campaignId){
  if(!squad)return [];
  return squad.submissions.filter(function(sub){return !campaignId||sub.campaignId===campaignId});
}
function campaignViews(squad,campaignId){
  if(!squad)return [];
  return squad.selectorViews.filter(function(v){return !campaignId||v.campaignId===campaignId});
}
/* Une joueuse compte dans l'effectif courant si elle est retenue et pas partie */
function isInSquad(entry){return entry&&entry.status==="selected"&&entry.membership!=="left"}

/* ── Rencontres ────────────────────────────────────────────── */
function eventById(squad,id){
  if(!squad)return null;
  for(var i=0;i<squad.events.length;i++)if(squad.events[i].id===id)return squad.events[i];
  return null;
}
function eventOf(squad,session){return eventById(squad,session&&session.eventId)}
function sessionsOfEvent(squad,eventId){
  return squad.sessions.filter(function(se){return se.eventId===eventId});
}
/* Les événements du plus récent au plus ancien, chacun avec ses matchs. */
function eventsWithSessions(squad){
  if(!squad)return [];
  return squad.events.map(function(ev){
    var ss=sessionsOfEvent(squad,ev.id);
    return {event:ev,sessions:ss,
      stats:ss.reduce(function(acc,se){
        se.entries.forEach(function(en){addStats(acc,en.stats)});return acc;},emptyS()),
      bilan:ss.reduce(function(acc,se){
        var o=resultOutcome(se.result);
        if(o)acc[o]=(acc[o]||0)+1;
        return acc;},{})};
  }).filter(function(x){return x.sessions.length})
    .sort(function(a,b){return String(b.event.date).localeCompare(String(a.event.date))});
}
function eventLabel(ev){
  if(!ev)return "Rencontre";
  var k=EVENT_KINDS[ev.kind]||EVENT_KINDS.league;
  return k.icon+" "+(ev.name||k.label);
}
/* Bilan victoires/défaites, éventuellement restreint à une nature. */
function squadRecord(squad,kind){
  var out={win:0,loss:0,draw:0,sans:0};
  (squad?squad.sessions:[]).forEach(function(se){
    var ev=eventOf(squad,se);
    if(kind&&(!ev||ev.kind!==kind))return;
    var o=resultOutcome(se.result);
    if(o)out[o]++;else out.sans++;
  });
  return out;
}
/* Les squads où une joueuse est convoquée — la mesure de sa présence au club. */
function squadsOf(pid){return DB.squads.filter(function(sq){return !!rosterEntry(sq,pid)})}

/* Une entrée ne porte de l'information que si le sélectionneur y a réellement touché */

/* ══════════════════════════════════════════════════════════════
   CAMPAGNES · DÉCISIONS · OFFRES · SECTIONS · SETS        (v7)

   Tout ce qui suit est dérivé : aucune de ces fonctions n'invente
   de donnée, elles relisent campaignRoster, offers, events et
   sessions. Les quatre mutateurs de fin (convoquer, décider,
   accepter, archiver) sont les SEULS chemins autorisés pour
   toucher à une décision ou à une offre.
   ══════════════════════════════════════════════════════════════ */

/* L'ordre métier des campagnes : celui que l'entraîneur a voulu (seq),
   puis la date, puis la création. Ce n'est pas l'ordre des clics — une
   campagne créée après coup pour rattraper la journée 1 se lit avant
   la journée 2, sans quoi « la dernière décision » désignerait la
   mauvaise. */
function campaignOrder(sq){
  if(!sq||!sq.campaigns)return [];
  return sq.campaigns.slice().sort(function(a,b){
    var sa=(a.seq>0)?a.seq:9999,sb=(b.seq>0)?b.seq:9999;
    if(sa!==sb)return sa-sb;
    var da=a.date||dayOf(a.createdAt)||"",db=b.date||dayOf(b.createdAt)||"";
    if(da!==db)return da<db?-1:1;
    return String(a.createdAt||"")<String(b.createdAt||"")?-1:1;
  });
}
function campaignEntry(sq,campaignId,pid){
  if(!sq)return null;
  var l=sq.campaignRoster||[];
  for(var i=0;i<l.length;i++)if(l[i].campaignId===campaignId&&l[i].playerId===pid)return l[i];
  return null;
}
function hasCampaignEntry(sq,campaignId,pid){return !!campaignEntry(sq,campaignId,pid)}
function rosterOfCampaign(sq,campaignId){
  if(!sq)return [];
  return (sq.campaignRoster||[]).filter(function(e){return e.campaignId===campaignId});
}
/* Les campagnes qui ont vu cette athlète, dans l'ordre métier. */
function campaignsOfPlayer(sq,pid){
  return campaignOrder(sq).filter(function(c){return hasCampaignEntry(sq,c.id,pid)});
}
function ensureCampaignRosterEntry(sq,campaignId,pid,who){
  var e=campaignEntry(sq,campaignId,pid);
  if(e)return e;
  e=mkCampaignRosterEntry(campaignId,pid,{convokedBy:who||null});
  sq.campaignRoster.push(e);
  return e;
}

/* ── Offres ────────────────────────────────────────────────── */
function offerById(sq,id){
  if(!sq)return null;
  var l=sq.offers||[];
  for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];
  return null;
}
function offerIsLive(o){return !!o&&!o.voidedAt}
function offersOfCampaign(sq,campaignId){
  if(!sq)return [];
  return (sq.offers||[]).filter(function(o){return o.campaignId===campaignId&&offerIsLive(o)});
}
function offersOfPlayer(sq,pid){
  if(!sq)return [];
  return (sq.offers||[]).filter(function(o){return o.playerId===pid});
}
/* L'offre vivante d'un couple (campagne, athlète) — la plus récente s'il
   en traînait plusieurs, ce que normalizeSquad empêche déjà. */
function liveOffer(sq,campaignId,pid){
  var best=null;
  (sq&&sq.offers||[]).forEach(function(o){
    if(o.campaignId!==campaignId||o.playerId!==pid||!offerIsLive(o))return;
    if(!best||String(o.createdAt||"")>String(best.createdAt||""))best=o;
  });
  return best;
}
/* L'offre qui engage une athlète aujourd'hui, toutes campagnes confondues.
   Une acceptation prime : elle est dans l'équipe, la question est close.
   Sinon l'offre vivante la plus récente. */
function currentOffer(sq,pid){
  var acc=null,other=null;
  offersOfPlayer(sq,pid).forEach(function(o){
    if(!offerIsLive(o))return;
    if(o.status==="accepted"){if(!acc||String(o.decidedAt||"")>String(acc.decidedAt||""))acc=o;return}
    if(!other||String(o.createdAt||"")>String(other.createdAt||""))other=o;
  });
  return acc||other;
}
function offerStatusOf(sq,pid){var o=currentOffer(sq,pid);return o?o.status:""}

/* ── Le statut de saison, dérivé ────────────────────────────────
   Une athlète dont l'offre a été acceptée est retenue, point final :
   elle joue, et une campagne ultérieure où elle n'est pas convoquée
   ne la renvoie pas au rang de candidate. C'est la seule
   irréversibilité du modèle, et elle se défait en archivant l'offre.

   Sinon, c'est la DERNIÈRE campagne qui l'a vue qui dit où elle en
   est : convoquée sans décision, elle est candidate — une nouvelle
   campagne rouvre la question, c'est précisément son objet.

   Faute de toute convocation — une base d'avant la v7 dont la
   migration n'aurait pas tourné — le statut déjà inscrit est
   conservé : on ne reclasse jamais une saison sur une absence. */
function derivedStatus(sq,pid,fallback){
  var offers=(sq&&sq.offers)||[];
  for(var i=0;i<offers.length;i++)
    if(offers[i].playerId===pid&&offers[i].status==="accepted"&&offerIsLive(offers[i]))
      return "selected";
  var vues=campaignsOfPlayer(sq,pid);
  if(!vues.length)return STATUSES[fallback]?fallback:"candidate";
  var e=campaignEntry(sq,vues[vues.length-1].id,pid);
  if(e&&e.decision&&RECO_TO_STATUS[e.decision])return RECO_TO_STATUS[e.decision];
  return "candidate";
}
/* Réécrit roster[].status. Appelée par normalizeSquad et par tout
   mutateur de décision ou d'offre : le champ reste donc exact pour la
   quarantaine de lecteurs qui l'interrogent sans rien savoir des
   campagnes. */
function recomputeRosterStatus(sq,pid){
  if(!sq)return;
  (sq.roster||[]).forEach(function(r){
    if(pid&&r.playerId!==pid)return;
    r.status=derivedStatus(sq,r.playerId,r.status);
  });
}

/* ── Sections de saison ────────────────────────────────────── */
function sectionByKey(k){return SECTION_BY_KEY[k]||null}
function sectionKinds(k){
  var s=SECTION_BY_KEY[k];
  return (s&&s.kinds)?s.kinds.slice():null;
}
function eventsOfSection(sq,k){
  var ks=sectionKinds(k);
  if(!sq||!ks)return [];
  return (sq.events||[]).filter(function(ev){return ks.indexOf(ev.kind)!==-1});
}
function sessionsOfSection(sq,k){
  var ks=sectionKinds(k);
  if(!sq||!ks)return [];
  return (sq.sessions||[]).filter(function(se){
    var ev=eventOf(sq,se);
    return ev&&ks.indexOf(ev.kind)!==-1;
  });
}
/* Les natures réellement présentes dans la saison. Sert à n'afficher le
   sélecteur « Amicaux · Championnat » que là où il a un sens. */
function kindsPresent(sq){
  var seen={};
  (sq&&sq.events||[]).forEach(function(ev){seen[ev.kind]=true});
  return EVENT_KEYS.filter(function(k){return seen[k]});
}

/* ── Ventilation par set ───────────────────────────────────────
   Une session d'avant la v7 n'est pas ventilée, et on ne devine pas
   ses sets : répartir quarante attaques sur trois manches serait
   inventer de la donnée. Elle rend donc un bloc unique marqué
   `whole`, que l'interface doit nommer « Match (non ventilé) » et
   jamais « Set 1 ». */
function sessionIsSplit(se){return !!(se&&se.sets&&se.sets.length)}
function setsOfSession(se){
  if(!se)return [];
  if(sessionIsSplit(se))
    return se.sets.map(function(s,i){
      var sc=((se.result&&se.result.sets)||[])[i]||{us:0,them:0};
      return {index:i,us:sc.us||0,them:sc.them||0,entries:s.entries||[],
              whole:false,reconciled:!!s.reconciled,
              label:"Set "+(i+1)};
    });
  return [{index:0,us:0,them:0,entries:se.entries||[],whole:true,reconciled:false,
           label:"Match (non ventilé)"}];
}
function statsOfSessionSet(se,i,pid){
  var blocs=setsOfSession(se),b=blocs[i];
  if(!b)return emptyS();
  for(var j=0;j<b.entries.length;j++)
    if(b.entries[j].playerId===pid)return b.entries[j].stats||emptyS();
  return emptyS();
}
/* Somme des sets d'une session, par athlète. */
function sumBySet(se){
  var out={};
  ((se&&se.sets)||[]).forEach(function(s){
    (s.entries||[]).forEach(function(x){
      if(!x||!x.playerId)return;
      if(!out[x.playerId])out[x.playerId]=emptyS();
      addStats(out[x.playerId],x.stats);
    });
  });
  return out;
}
/* Les scores portés par les sets ne sont que des MIROIRS de
   result.sets : une seule source, sinon un 25-23 corrigé dans un écran
   contredirait l'autre et rien ne dirait lequel a raison. À rafraîchir
   dès qu'un set naît ou qu'un score change — pas seulement au
   chargement, sans quoi un set créé en séance porterait un score vide
   jusqu'au prochain démarrage. */
function refreshSetMirrors(se){
  if(!se||!se.sets)return;
  se.sets.forEach(function(sst,i){
    var sc=((se.result&&se.result.sets)||[])[i]||{us:0,them:0};
    sst.index=i;sst.us=sc.us||0;sst.them=sc.them||0;
  });
}
/* L'unique fonction autorisée à réécrire session.entries[].stats, et
   seulement sur une session déjà ventilée : le total d'un match est
   une donnée historique, il ne se recalcule pas à la légère. */
function recomputeSessionTotals(se){
  if(!sessionIsSplit(se))return;
  refreshSetMirrors(se);
  var somme=sumBySet(se),vus={};
  se.entries.forEach(function(en){
    en.stats=normStats(somme[en.playerId]);
    vus[en.playerId]=true;
  });
  Object.keys(somme).forEach(function(pid){
    if(vus[pid])return;
    var p=playerById(pid);
    se.entries.push({playerId:pid,name:p?fullName(p):"",number:"",position:"",
                     stats:normStats(somme[pid])});
  });
}
/* Garde-fou : une session ventilée dont les sets ne totalisent pas les
   entries est corrompue (import bricolé, fusion, défaut). `entries`
   fait foi — c'est le total historiquement affiché — et l'écart est
   versé dans un set de correction plutôt que jeté. */
function reconcileSessionTotals(se){
  if(!sessionIsSplit(se))return;
  var somme=sumBySet(se),ecart={},reste=false;
  (se.entries||[]).forEach(function(en){
    var d=emptyS(),diff=false,s=somme[en.playerId]||emptyS();
    for(var i=0;i<ALL_STATS.length;i++){
      var k=ALL_STATS[i].key,v=(en.stats[k]||0)-(s[k]||0);
      if(v!==0){d[k]=Math.max(0,v);if(v>0)diff=true}
    }
    if(diff){ecart[en.playerId]=d;reste=true}
  });
  if(!reste)return;
  var entries=[];
  Object.keys(ecart).forEach(function(pid){entries.push({playerId:pid,stats:ecart[pid]})});
  se.sets.push({index:se.sets.length,entries:entries,reconciled:true});
}

/* ── Les quatre gestes qui engagent ────────────────────────────
   Convoquer, décider, confirmer, archiver. Tout passe par une
   transaction : si quoi que ce soit échoue en chemin, rien n'est
   écrit à moitié, et le geste reste annulable. */

/* Convoquer des athlètes à une campagne. Idempotent : une athlète déjà
   convoquée n'est pas convoquée deux fois, et sa décision est intacte. */
function convokeToCampaign(sq,campaignId,pids,who){
  if(!sq||!campaignId||!pids||!pids.length)return 0;
  var n=0;
  Store.tx(function(){
    pids.forEach(function(pid){
      if(!rosterEntry(sq,pid))return;          // pas au roster : rien à convoquer
      if(hasCampaignEntry(sq,campaignId,pid))return;
      Store.put("campaignRoster",mkCampaignRosterEntry(campaignId,pid,{convokedBy:who||null}),sq);
      /* Convoquer DÉPLACE le statut de saison : c'est désormais cette
         campagne-ci qui a vu l'athlète en dernier, et une convocation
         sans décision la remet candidate — rouvrir la question est
         précisément l'objet d'une nouvelle campagne. Sans ce recalcul
         `roster[].status` resterait sur la décision de la campagne
         précédente, et checkV7 signalerait un statut non dérivé. */
      recomputeRosterStatus(sq,pid);
      n++;
    });
    if(n){
      var c=campaignById(sq,campaignId);
      logAct("roster",plural(n,"athlète")+" convoquée(s) — "+(c?campaignLabel(c):"campagne"),
        {teamId:sq.teamId,seasonId:sq.seasonId});
    }
  },"Convocation");
  return n;
}
/* Retirer une convocation. La décision part avec elle — une athlète qui
   n'était pas là n'a pas été jugée. L'offre en attente qu'elle aurait
   values est annulée ; une offre déjà tranchée ne bouge pas. */
function unconvokeFromCampaign(sq,campaignId,pid){
  Store.tx(function(){
    var e=campaignEntry(sq,campaignId,pid);
    if(!e)return;
    voidPendingOffer(sq,campaignId,pid);
    Store.del("campaignRoster",e.id,sq);
    recomputeRosterStatus(sq,pid);
  },"Retrait de convocation");
}

/* Trancher le sort d'une athlète dans une campagne. C'est ici, et
   nulle part ailleurs, qu'une offre naît. */
function setCampaignDecision(sq,campaignId,pid,reco,who){
  if(!sq||!campaignId||!pid)return;
  if(reco&&!RECO_BY_KEY[reco])return;
  Store.tx(function(){
    var e=ensureCampaignRosterEntry(sq,campaignId,pid,who);
    if(e.decision===(reco||""))return;         // idempotent
    /* Le journal dit la transition, pas l'état d'arrivée seul : « Candidate
       → Retenue » se relit six mois plus tard, « Retenue » ne dit rien. Le
       numéro est celui du jour des faits — logWho s'en charge. */
    var r=rosterEntry(sq,pid),avant=(r&&r.status)||"candidate";
    var qui=logWho(sq,pid);
    Store.patch("campaignRoster",e.id,{decision:reco||"",
      decidedAt:reco?nowISO():null,decidedBy:reco?(who||null):null},sq);
    if(reco==="select")ensureOffer(sq,campaignId,pid);
    else voidPendingOffer(sq,campaignId,pid);
    recomputeRosterStatus(sq,pid);
    var apres=(rosterEntry(sq,pid)||{}).status||"candidate",c=campaignById(sq,campaignId);
    if(avant!==apres||reco)logAct("status",
      qui+" : "+STATUSES[avant].label+" → "+STATUSES[apres].label+
      (c?" · "+campaignLabel(c):"")+
      (reco==="select"?" · offre envoyée":""),
      {teamId:sq.teamId,seasonId:sq.seasonId,playerId:pid});
  },"Décision de sélection");
}

/* Une athlète retenue reçoit une offre en attente. Reconfirmer la même
   décision n'en produit pas une seconde. */
function ensureOffer(sq,campaignId,pid){
  var o=liveOffer(sq,campaignId,pid);
  if(o)return o;
  o=mkOffer(campaignId,pid);
  Store.put("offers",o,sq);
  /* Pas d'entrée de journal ici : la décision qui vient de l'engendrer en
     porte la mention. Deux lignes pour un seul geste rendraient le journal
     illisible — c'est le travers que l'audit reprochait déjà. */
  return o;
}
/* Décision retirée : l'offre encore en attente n'a engagé personne, on
   la retire des listes. Elle reste en base, datée — trois octets et une
   trace. Une offre acceptée ou refusée, elle, ne se réécrit jamais. */
function voidPendingOffer(sq,campaignId,pid){
  var o=liveOffer(sq,campaignId,pid);
  if(!o||o.status!=="pending")return;
  Store.patch("offers",o.id,{voidedAt:nowISO()},sq);
}

/* « Confirmer » : l'athlète accepte, elle entre dans l'équipe. */
function acceptOffer(sq,offerId,who){
  Store.tx(function(){
    var o=offerById(sq,offerId);
    if(!o||o.status!=="pending"||!offerIsLive(o))return;
    Store.patch("offers",o.id,{status:"accepted",decidedAt:nowISO(),decidedBy:who||null},sq);
    if(sq.playerIds.indexOf(o.playerId)===-1)sq.playerIds.push(o.playerId);
    var r=rosterEntry(sq,o.playerId);
    if(r&&r.membership==="left")r.membership="active";
    recomputeRosterStatus(sq,o.playerId);
    var p=playerById(o.playerId);
    logAct("roster",(p?fullName(p):"Athlète")+" rejoint l'équipe — offre acceptée",
      {teamId:sq.teamId,seasonId:sq.seasonId});
  },"Offre acceptée");
}
/* « Archiver » : l'offre est refusée. L'athlète sort de l'équipe, mais
