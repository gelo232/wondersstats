function renderSelectionTab(){
  var season=curSquad();
  if(!season)return emptyBlock("🎯","Aucune saison","Créez une saison avant de constituer des vues sélectionneur.",null);
  var panes=[{k:"views",l:"🎯 Vues ("+season.selectorViews.length+")"},{k:"submissions",l:"📥 Soumissions ("+season.submissions.length+")"}];
  var row=h("div",{className:"pill-row"},panes.map(function(p){
    var b=h("button",{className:"pill"+(state.selectionPane===p.k?" active":""),onclick:function(){state.selectionPane=p.k;render()}},p.l);
    if(state.selectionPane===p.k)b.style.background="#F59E0B";
    return b;
  }));
  var body=state.selectionPane==="submissions"?renderSubmissionsPane(season):renderViewsPane(season);
  return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},row,
    h("div",{className:"content pad","data-scroll-key":"selection-"+state.selectionPane},body));
}

/* `campaignId` borne le volet à UNE campagne — c'est ainsi que la
   partie Sélection l'appelle, parce qu'une vue appartient à un moment
   et qu'on ne prépare pas la journée 2 en voyant les vues de la 1.
   Sans argument, le volet garde son ancien comportement : toutes les
   campagnes, groupées — l'écran hérité s'en sert encore. */
function renderViewsPane(squad,campaignId){
  var wrap=h("div",null);
  var camp=campaignId?campaignById(squad,campaignId):curCampaign(squad);
  wrap.appendChild(h("div",{className:"hint"},
    "Une ",h("b",null,"vue sélectionneur")," regroupe les joueuses qu'un évaluateur doit observer",
    campaignId?[" dans ",h("b",null,camp?camp.name:"cette campagne"),". "]
              :[", au sein d'une ",h("b",null,"campagne")," donnée. "],
    "Une même joueuse peut figurer dans plusieurs vues."));

  if(seasonClosed(squad))wrap.appendChild(h("div",{className:"hint warn"},
    "🔒 Saison clôturée — les vues ne sont plus distribuées et les soumissions sont refusées."));

  wrap.appendChild(renderSyncPanel(squad));

  var dup=dupNumbers(squad),miss=missingNumbers(squad).length;
  if(Object.keys(dup).length||miss)
    wrap.appendChild(h("div",{className:"hint warn"},"⚠️ Corrigez d'abord les numéros ("+
      (miss?plural(miss,"manquant"):"")+(miss&&Object.keys(dup).length?", ":"")+
      (Object.keys(dup).length?Object.keys(dup).length+" en double":"")+") — volet 👥 Convoquées."));

  /* Une vue publiée sans destinataire est lisible par tout sélectionneur
     de l'équipe : c'est le mode « qui veut la prend », et il se retourne
     contre celui qui croit avoir réservé ses vues. On le dit là où on
     invite. */
  var ouvertes=squad.selectorViews.filter(function(v){return v.published&&!v.selectorPersonId});
  var invites=DB.people.filter(function(p){
    return p.token&&!p.revoked&&DB.assignments.some(function(a){
      return a.personId===p.id&&a.teamId===squad.teamId&&a.role==="selector";});
  });
  if(ouvertes.length&&invites.length)wrap.appendChild(h("div",{className:"hint warn"},
    "⚠️ "+plural(ouvertes.length,"vue")+" publiée(s) sans destinataire — ",
    h("b",null,"tout sélectionneur invité peut les recevoir"),". Pour en réserver une, ",
    "invitez depuis la vue : le lien n'ouvre alors que celle-là."));

  wrap.appendChild(h("div",{className:"btn-row",style:{marginBottom:"12px"}},
    h("button",{className:"btn btn-primary sm",disabled:seasonClosed(squad),onclick:function(){
      if(!squad.roster.length){showToast("⚠️ Convoquez d'abord des joueuses");return}
      state.editViewId=null;state.modalSel=[];openModal("editview");
    }},"+ Nouvelle vue"),
    h("button",{className:"btn btn-import sm",onclick:function(){importSubmission(squad)}},"📥 Importer une soumission")));

  /* Bornée à la campagne ouverte, ou groupée par campagne : dans les
     deux cas on ne mélange jamais deux moments sous un même titre. */
  if(campaignId){
    var mines=campaignViews(squad,campaignId);
    if(!mines.length)wrap.appendChild(emptyState({icon:"🎯",title:"Aucune vue pour cette campagne",
      sub:"Une vue dit à un évaluateur qui observer ce jour-là. Créez-en une, "+
          "puis distribuez-la par lien ou par fichier.",
      action:h("button",{className:"btn btn-primary",type:"button",disabled:seasonClosed(squad),
        onclick:function(){
          if(!rosterOfCampaign(squad,campaignId).length){
            showToast("⚠️ Convoquez d'abord des athlètes à cette campagne");return;
          }
          state.editViewId=null;state.modalSel=[];openModal("editview");
        }},"+ Nouvelle vue")}));
    mines.forEach(function(v){wrap.appendChild(renderViewCard(squad,camp,v))});
    return wrap;
  }
  var byCamp={};
  squad.selectorViews.forEach(function(v){(byCamp[v.campaignId]=byCamp[v.campaignId]||[]).push(v)});
  if(!squad.selectorViews.length)wrap.appendChild(h("div",{className:"empty"},"Aucune vue sélectionneur"));

  squad.campaigns.forEach(function(c){
    var views=byCamp[c.id]||[];
    if(!views.length)return;
    wrap.appendChild(h("div",{className:"section-title"},
      campaignLabel(c)+(c.id===squad.activeCampaignId?" · active":"")+(c.closedAt?" · close":"")));
    views.forEach(function(v){wrap.appendChild(renderViewCard(squad,c,v))});
  });
  return wrap;
}

function renderViewCard(squad,camp,v){
  var filled=v.playerIds.filter(function(pid){return entryFilled(v,pid)}).length;
  var pct=v.playerIds.length?Math.round(filled/v.playerIds.length*100):0;
  var subs=squad.submissions.filter(function(x){return x.viewId===v.id}).length;
  var open=campaignOpen(squad,camp);
  var card=h("div",{className:"view-card"+(subs?" submitted":"")});
  card.appendChild(h("div",{className:"row-between"},
    h("div",{style:{minWidth:"0"}},
      h("h4",null,v.name),
      h("div",{className:"muted"},(v.selectorName?"👤 "+v.selectorName+" · ":"")+plural(v.playerIds.length,"joueuse")+
        " · "+plural(v.criteria.length,"critère")+(subs?" · "+plural(subs,"soumission"):"")),
      h("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap",marginTop:"5px"}},
        h("span",{className:"badge",style:v.anonymous
          ?{background:"#F59E0B22",color:"#FBBF24",borderColor:"#F59E0B55"}
          :{background:"#33415530",color:"#94A3B8"}},v.anonymous?"🔒 Anonyme":"👁 Nominative"),
        v.published?h("span",{className:"badge",style:{background:"#10B98122",color:"#34D399"}},"📡 Publiée"):null,
        (function(){
          var pv=v.selectorPersonId?personById(v.selectorPersonId):null;
          if(!pv)return null;
          return h("span",{className:"badge",style:pv.token
            ?{background:"#F59E0B22",color:"#FBBF24",borderColor:"#F59E0B55"}
            :{background:"#33415530",color:"#94A3B8"}},
            pv.token?("🔗 réservée à "+pv.name):("👤 "+pv.name+" — sans lien"));
        })(),
        (v.playerGroups||[]).length?h("span",{className:"badge",
          style:{background:"#6366F122",color:"#A5B4FC",borderColor:"#6366F155"}},
          "🧩 "+plural(v.playerGroups.length,"groupe")):null,
        v.context?h("span",{className:"badge",style:{background:"#0F172A",color:"#94A3B8",borderColor:"#334155"}},v.context):null)),
    h("div",{className:"btn-row"},
      h("button",{className:"btn btn-ghost xs",onclick:function(){state.editViewId=v.id;state.modalSel=v.playerIds.slice();openModal("editview")}},"✏️"),
      h("button",{className:"btn btn-danger-o xs",onclick:function(){
        confirmAct("Supprimer la vue « "+v.name+" » ?\nLes soumissions déjà reçues sont conservées.",
          function(){
            squad.selectorViews=squad.selectorViews.filter(function(x){return x.id!==v.id});
            if(state.svViewId===v.id)state.svViewId=null;
            saveNow();render();
          },{confirm:"Supprimer"});
      }},"🗑️"))));
  card.appendChild(h("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap",marginTop:"8px"}},
    v.playerIds.map(function(pid){
      var n=numOf(squad,pid);
      return h("span",{className:"badge",style:{background:"#0F172A",color:entryFilled(v,pid)?"#34D399":(n?"#94A3B8":"#FCA5A5"),borderColor:"#334155",fontSize:"12px",padding:"4px 9px"}},numLabel(n));
    })));
  card.appendChild(h("div",{className:"progress"},h("i",{style:{width:pct+"%"}})));
  card.appendChild(h("div",{className:"muted",style:{marginTop:"5px"}},
    filled+"/"+v.playerIds.length+" joueuses évaluées"+(v.submittedAt?" · dernière soumission le "+fmtDay(v.submittedAt):"")));

  var acts=h("div",{className:"btn-row",style:{marginTop:"10px"}});
  if(open){
    acts.appendChild(h("button",{className:"btn btn-warn sm",onclick:function(){
      ensureSelectorCtx(squad.teamId);
      state.tab="sv_eval";state.svViewId=v.id;state.svPlayerId=null;
      state.svPlayerGroupId=null;state.svTilesOpen=true;saveNow();render();
    }},"🎯 Ouvrir ici"));
    /* Inviter part de la vue : c'est le geste entier — la personne, son
       jeton, et la vue publiée à son nom — et c'est lui qui restreint ce
       que le relais lui remettra. */
    acts.appendChild(h("button",{className:"btn btn-warn xs",onclick:function(){
      state.modalDraft=null;openModal("inviteview",v.id);
    }},v.selectorPersonId?"🔗 Lien du sélectionneur":"🔗 Inviter un sélectionneur"));
    if(syncReady())acts.appendChild(h("button",{className:"btn btn-primary xs",disabled:syncBusy,onclick:function(){
      publishView(squad,v);
    }},syncBusy?"…":(v.published?"📡 Republier":"📡 Publier")));
    acts.appendChild(h("button",{className:"btn btn-export xs",onclick:function(){exportPacket(squad,v)}},"📤 Fichier"));
  }
  /* Correction du constat A2 : on ne resoumet jamais des notes périmées.
     Réévaluer, c'est dupliquer la vue dans une autre campagne, données vierges. */
  if(subs||v.submittedAt)acts.appendChild(h("button",{className:"btn btn-ghost xs",onclick:function(){
    state.modalCtx=v.id;openModal("duplicateview",v.id);
  }},"🔁 Réévaluer"));
  card.appendChild(acts);
  return card;
}

/* ── Panneau de synchronisation (entraîneur) ────────────────── */

  var box=h("div",{className:"card tight",style:{marginBottom:"12px"}});
  if(!syncReady()){
    box.appendChild(h("div",{className:"row-between"},
      h("div",{style:{minWidth:"0"}},
        h("div",{style:{fontWeight:"700",color:"#F8FAFC",fontSize:"14px"}},"📡 Synchronisation désactivée"),
        h("div",{className:"muted",style:{marginTop:"3px"}},"Vos sélectionneurs échangent par fichier. Activez la synchronisation pour qu'ils travaillent sur leur propre appareil.")),
      h("button",{className:"btn btn-primary xs",onclick:function(){openModal("syncconfig")}},"Configurer")));
    return box;
  }
  box.appendChild(h("div",{className:"row-between"},
    h("div",{style:{minWidth:"0"}},
      h("div",{style:{fontWeight:"700",color:"#34D399",fontSize:"14px"}},"📡 Synchronisation active"),
      h("div",{className:"muted",style:{marginTop:"3px",wordBreak:"break-all"}},"Salon "+SYNC.room),
      SYNC.lastSyncAt?h("div",{className:"muted",style:{marginTop:"2px"}},"Dernier échange : "+fmtDate(SYNC.lastSyncAt)):null),
    h("button",{className:"btn btn-ghost xs",onclick:function(){openModal("syncconfig")}},"⚙️")));
  box.appendChild(h("div",{className:"btn-row",style:{marginTop:"10px"}},
    h("button",{className:"btn btn-save sm",disabled:syncBusy,onclick:function(){pullSubmissions(squad)}},
      syncBusy?"⏳ En cours…":"📥 Relever les soumissions"),
    squad&&squad.freeView?h("button",{className:"btn btn-primary xs",disabled:syncBusy,onclick:function(){
      publishCatalog(squad);
    }},"📡 Publier le catalogue"):null,
    h("button",{className:"btn btn-ghost xs",onclick:function(){
      state.ctx={role:"admin"};state.tab="adm_people";saveNow();render();
    }},"🔗 Inviter")));
  return box;

function entryFilled(view,pid){return dataFilled(view.data[pid])}

/* Comme le volet des vues : `campaignId` borne l'écran à la campagne
   ouverte, son absence garde le groupement par campagne de l'écran
   hérité. */
function renderSubmissionsPane(squad,campaignId){
  var wrap=h("div",null);
  wrap.appendChild(h("div",{className:"hint"},"Chaque soumission est un instantané figé, rattaché à sa campagne. Plusieurs avis sur une même joueuse sont moyennés — mais uniquement à l'intérieur d'une même campagne."));
  wrap.appendChild(renderSyncPanel(squad));
  wrap.appendChild(h("div",{className:"btn-row",style:{marginBottom:"12px"}},
    h("button",{className:"btn btn-import sm",onclick:function(){importSubmission(squad)}},"📥 Importer un fichier de soumission")));
  if(campaignId&&!campaignSubs(squad,campaignId).length)
    wrap.appendChild(emptyState({icon:"📥",title:"Aucune soumission reçue",
      sub:"Rien n'est encore rentré pour cette campagne. Distribuez une vue, "+
          "puis relevez les soumissions ou importez le fichier d'un évaluateur."}));
  else if(!campaignId&&!squad.submissions.length)
    wrap.appendChild(h("div",{className:"empty"},"Aucune soumission reçue"));

  (campaignId?[campaignById(squad,campaignId)].filter(Boolean):squad.campaigns).forEach(function(c){
    var subs=campaignSubs(squad,c.id).slice().sort(function(a,b){return (b.submittedAt||"").localeCompare(a.submittedAt||"")});
    if(!subs.length)return;
    wrap.appendChild(h("div",{className:"section-title"},campaignLabel(c)+" · "+plural(subs.length,"soumission")));
    subs.forEach(function(sub){
      var evaluated=sub.entries.filter(dataFilled).length;
      wrap.appendChild(h("div",{className:"card tight"},
        h("div",{className:"row-between"},
          h("div",{style:{minWidth:"0"}},
            h("div",{style:{color:"#F8FAFC",fontWeight:"700",fontSize:"14px"}},sub.viewName),
            h("div",{className:"muted",style:{marginTop:"2px"}},"👤 "+(sub.selectorName||"Anonyme")+" · "+fmtDate(sub.submittedAt)),
            h("div",{className:"muted",style:{marginTop:"2px"}},evaluated+"/"+sub.entries.length+" joueuses évaluées")),
          h("div",{className:"btn-row",style:{flexShrink:"0"}},
            /* Relire avant de juger : le contenu exact de ce qui a été
               rendu, athlète par athlète, et sans un champ modifiable. */
            h("button",{className:"btn btn-ghost xs","aria-label":"Consulter la soumission en lecture seule",
              title:"Consulter en lecture seule",onclick:function(){
              openModal("submissionro",sub.id);
            }},"👁"),
            h("button",{className:"btn btn-export xs",title:"Exporter en fichier",onclick:function(){
              exportReceivedSubmission(squad,sub);
            }},"📤"),
            h("button",{className:"btn btn-danger-o xs",onclick:function(){
              openConfirm({
                title:"Supprimer la soumission de "+(sub.selectorName||"—")+" ?",
                body:"Rien ne la ramènera : ni un nouveau relevé, qui ne redemande que ce qui est plus "+
                     "récent, ni une sauvegarde restaurée, qui n'écrase pas une équipe-saison déjà là. "+
                     "Les moyennes compilées seront recalculées.",
                detail:"Pour pouvoir la réimporter plus tard, annulez et exportez-la d'abord avec 📤. "+
                       "Sinon il faudra demander à "+(sub.selectorName||"l'évaluateur")+" de soumettre à nouveau.",
                confirm:"Supprimer",tone:"danger",
                onconfirm:function(){
                  logAct("submission","Soumission de "+(sub.selectorName||"—")+" sur « "+sub.viewName+" » supprimée",
                    {teamId:squad.teamId,seasonId:squad.seasonId});
                  squad.submissions=squad.submissions.filter(function(x){return x.id!==sub.id});
                  saveNow();render();
                }});
            }},"🗑️"))),
        h("div",{style:{display:"flex",gap:"4px",flexWrap:"wrap",marginTop:"8px"}},sub.entries.map(function(e){
          var r=e.reco?RECO_BY_KEY[e.reco]:null,seen=dataFilled(e);
          return h("span",{className:"badge",style:{background:(r?r.color:"#334155")+"20",color:r?r.color:(seen?"#94A3B8":"#94A3B8"),fontSize:"11px",padding:"3px 7px",opacity:seen?"1":".55"}},
            numLabel(e.number)+(r?" "+r.icon:""));
        }))));
    });
  });
  return wrap;
}

/* ══════════════════════════════════════════════════════════════
   RÔLE SÉLECTIONNEUR
   ⚠️ ANONYMAT : aucune de ces fonctions ne lit fullName / shortName.
   L'unique identifiant affiché est le NUMÉRO D'ATHLÈTE.
   ══════════════════════════════════════════════════════════════ */

/* Une « source » = une vue + le moyen d'obtenir le numéro de chaque joueuse */
function svSources(){
  var out=[];
  /* Vues locales : seulement celles des équipes où je suis affecté comme
     sélectionneur (constat R7 — un appareil partagé n'expose plus tout). */
  DB.squads.forEach(function(sq){
    if(seasonClosed(sq))return;
    if(!canSelect(sq.teamId))return;
    sq.selectorViews.forEach(function(v){
      var c=campaignById(sq,v.campaignId);
      if(c&&c.closedAt)return;
      out.push({view:v,kind:"local",squad:sq,season:sq,seasonName:sq.name,campaign:c});
    });
  });
  INBOX.views.forEach(function(v){
    out.push({view:v,kind:"inbox",squad:null,season:null,seasonName:v.seasonName||v.teamName||"—",campaign:null});
  });
  return out;
}
/* Catalogues reçus : les équipes où je peux composer mes propres vues. */
function svCatalogs(){
  var out=(INBOX.catalogs||[]).slice();
  /* Sur l'appareil de l'entraîneur, une équipe en vue libre est aussi
     proposée sans passer par le relais. */
  DB.squads.forEach(function(sq){
    if(!sq.freeView||seasonClosed(sq)||!canSelect(sq.teamId))return;
    if(out.some(function(c){return c.teamId===sq.teamId&&c.seasonId===sq.seasonId}))return;
    var cat=buildCatalog(sq);
    if(cat.players.length)out.push(cat);
  });
  return out;
}
/* Libellé d'une athlète pour le sélectionneur. Par défaut : le numéro seul.
   Un nom n'apparaît que si l'entraîneur a explicitement levé l'anonymat. */
function svDisplay(src,pid){
  var num=numLabel(svNumber(src,pid));
  if(src.view.anonymous!==false)return num;
  var label=(src.kind==="local")?shortName(playerById(pid)):((src.view.labels||{})[pid]||"");
  return label?(num+" "+label):num;
}
function svCampaignLabel(src){
  if(src.kind==="local"&&src.campaign)return campaignLabel(src.campaign);
  return src.view.campaignName||"";
}
function svFind(id){
  var all=svSources();
  for(var i=0;i<all.length;i++)if(all[i].view.id===id)return all[i];
  return null;
}
function svNumber(src,pid){
  if(!src)return "";
  return src.kind==="local"?numOf(src.squad,pid):((src.view.numbers||{})[pid]||"");
}
function svEntry(view,pid){
  if(!view.data[pid])view.data[pid]=mkEntryData();
  var d=view.data[pid];
  if(!d.stats)d.stats=emptyS();
  if(!d.ratings)d.ratings={};
  d.pos=normPos(d.pos);          /* une vue reçue avant les postes n'en a pas */
  return d;
}
function svProgress(src){
  var v=src.view;
  var done=v.playerIds.filter(function(pid){return entryFilled(v,pid)}).length;
  return {done:done,total:v.playerIds.length,pct:v.playerIds.length?Math.round(done/v.playerIds.length*100):0};
}
/* Numéros triés numériquement — l'ordre d'affichage du sélectionneur */
function svOrderIds(src,ids){
  return (ids||[]).slice().sort(function(a,b){
    var na=parseInt(svNumber(src,a),10),nb=parseInt(svNumber(src,b),10);
    if(isNaN(na))na=9999;if(isNaN(nb))nb=9999;
    return na-nb;
  });
}
function svOrdered(src){return svOrderIds(src,src.view.playerIds)}
/* Les groupes de la vue, tels que le sélectionneur les parcourt : ceux
   du paquet, plus le reliquat s'il en manque — une vue peut avoir gagné
   des athlètes après le découpage. */
function svGroups(src){
  var v=src.view,gs=(v.playerGroups||[]).filter(function(g){return g.playerIds.length});
  if(!gs.length)return [];
  var dans={};gs.forEach(function(g){g.playerIds.forEach(function(p){dans[p]=1})});
  var reste=v.playerIds.filter(function(p){return !dans[p]});
  if(reste.length)gs=gs.concat([{id:"_reste",name:"Autres",playerIds:reste}]);
  return gs;
}
function svGroupCourant(src){
  var gs=svGroups(src);
  if(!gs.length)return null;
  for(var i=0;i<gs.length;i++)if(gs[i].id===state.svPlayerGroupId)return gs[i];
  return null;                       /* null = toutes les athlètes */
}
function svFait(src,ids){
  var v=src.view,n=0;
  (ids||[]).forEach(function(p){if(entryFilled(v,p))n++});
  return n;
}

/* ── Liste des vues ────────────────────────────────────────── */
function renderSvViews(){
  var sources=svSources();
  var wrap=h("div",null);
  wrap.appendChild(h("div",{className:"hint"},
    "Mode ",h("b",null,"sélectionneur"),". Sauf mention contraire de l'entraîneur, vous évaluez les athlètes ",
    h("b",null,"par leur numéro uniquement")," — aucun nom n'est affiché, afin de garder un regard neutre."));

  /* Connexion au salon de l'entraîneur : c'est ce qui permet de travailler
     sur son propre appareil sans échanger de fichiers. */
  var syncBox=h("div",{className:"card tight",style:{marginBottom:"12px"}});
  if(syncReady()){
    syncBox.appendChild(h("div",{className:"row-between"},
      h("div",{style:{minWidth:"0"}},
        h("div",{style:{fontWeight:"700",color:"#34D399",fontSize:"14px"}},"📡 Connecté"),
        h("div",{className:"muted",style:{marginTop:"3px"}},"Salon "+SYNC.room),
        SYNC.lastSyncAt?h("div",{className:"muted",style:{marginTop:"2px"}},"Dernier échange : "+fmtDate(SYNC.lastSyncAt)):null),
      h("button",{className:"btn btn-ghost xs",onclick:function(){openModal("syncconfig")}},"⚙️")));
    syncBox.appendChild(h("div",{className:"btn-row",style:{marginTop:"10px"}},
      h("button",{className:"btn btn-save sm",disabled:syncBusy,onclick:pullForSelector},
        syncBusy?"⏳ En cours…":"📥 Récupérer mes vues")));
  } else {
    syncBox.appendChild(h("div",{className:"row-between"},
      h("div",{style:{minWidth:"0"}},
        h("div",{style:{fontWeight:"700",color:"#F8FAFC",fontSize:"14px"}},"📡 Pas encore connecté"),
        h("div",{className:"muted",style:{marginTop:"3px"}},"Ouvrez le lien que l'entraîneur vous a envoyé, ou saisissez le code de salon à la main.")),
      h("button",{className:"btn btn-primary xs",onclick:function(){openModal("syncconfig")}},"Se connecter")));
  }
  wrap.appendChild(syncBox);

  /* Libre-service : choisir une équipe puis les athlètes à observer. */
  var cats=svCatalogs();
  if(cats.length){
    wrap.appendChild(h("div",{className:"section-title"},"Composer moi-même une observation"));

/* ── Écran d'évaluation ────────────────────────────────────── */
function renderSvEval(){
  var src=state.svViewId?svFind(state.svViewId):null;
  if(!src){
    var all=svSources();
    if(!all.length)return emptyBlock("🎯","Aucune vue","Importez un paquet sélectionneur pour commencer.",
      h("button",{className:"btn btn-import",onclick:importPacket},"📥 Importer un paquet"));
    return emptyBlock("🎯","Choisissez une vue","Sélectionnez la vue que vous devez évaluer.",
      h("button",{className:"btn btn-primary",onclick:function(){state.tab="sv_views";render()}},"Voir mes vues"));
  }
  var v=src.view;
  if(!v.playerIds.length)return emptyBlock("🎯",v.name,"Cette vue ne contient aucune athlète.",null);

  /* Le groupe qui passe, et lui seul. Vingt-huit numéros d'un bloc, on
     ne sait plus où on en est ; sept, c'est la vague qui est sur le
     terrain. Le groupe disparu d'une vue republiée retombe sur « tout ». */
  var groupes=svGroups(src);
  if(state.svPlayerGroupId&&!svGroupCourant(src))state.svPlayerGroupId=null;
  var gCour=svGroupCourant(src);
  var ordered=svOrderIds(src,gCour?gCour.playerIds:v.playerIds);
  if(ordered.indexOf(state.svPlayerId)===-1)state.svPlayerId=null;

  var visibles=ordered.filter(function(pid){
    return !state.svHideDone||!entryFilled(v,pid)||pid===state.svPlayerId;
  });
  var tiles=h("div",{className:"num-grid"},visibles.map(function(pid){
    var on=pid===state.svPlayerId,done=entryFilled(v,pid);
    var d=v.data[pid]||mkEntryData();
    var r=d.reco?RECO_BY_KEY[d.reco]:null;
    var disp=svDisplay(src,pid),anon=src.view.anonymous!==false;
    return h("button",{className:"num-tile"+(on?" active":"")+(done&&!on?" done":""),
      style:anon?null:{fontSize:"14px",lineHeight:"1.15",padding:"0 4px"},onclick:function(){
      state.svPlayerId=pid;state.svGroupIdx=0;render();
    }},h("span",null,disp),
      h("span",{className:"st"},r?r.icon:(done?"•":"")));
  }));

  var faits=svFait(src,ordered);
  var stripKids=[];
  /* La rangée existe même sans groupe : c'est de là qu'on les compose,
     et c'est l'évaluateur qui les compose — lui seul sait dans quel
     ordre les vagues passent devant lui. */
  var pills=h("div",{className:"sub-pills",style:{marginBottom:"8px"}});
  function gPill(id,libelle,ids){
    var on=(state.svPlayerGroupId||null)===id;
    var b=h("button",{className:"pill sm"+(on?" active":""),onclick:function(){
      state.svPlayerGroupId=id;state.svPlayerId=null;state.svTilesOpen=true;render();
    }},libelle+" "+svFait(src,ids)+"/"+ids.length);
    if(on)b.style.background="#2563EB";
    return b;
  }
  pills.appendChild(gPill(null,"Toutes",v.playerIds));
  groupes.forEach(function(g){pills.appendChild(gPill(g.id,g.name,g.playerIds))});
  pills.appendChild(h("button",{className:"pill sm",style:{flexShrink:"0"},onclick:function(){
    state.modalDraft=null;openModal("svgroups");
  }},groupes.length?"⚙️ Groupes":"⚙️ Créer des groupes"));
  stripKids.push(pills);
  /* Replier libère l'écran pour la saisie : sur un téléphone, la grille
     et le panneau ne tiennent pas ensemble. */
  var tete=h("div",{className:"sv-strip-head"},
    h("button",{className:"sv-fold",onclick:function(){
      state.svTilesOpen=!state.svTilesOpen;render();
    }},h("span",null,state.svTilesOpen?"▾":"▸"),
      h("span",null,(gCour?gCour.name:"Toutes les athlètes")+" · "+faits+"/"+ordered.length+" évaluées"),
      h("span",{className:"muted"},state.svTilesOpen?"replier":"déplier")),
    h("button",{className:"pill sm"+(state.svHideDone?" active":""),style:state.svHideDone?{background:"#3B82F6"}:null,
      onclick:function(){state.svHideDone=!state.svHideDone;render()}},
      state.svHideDone?"✓ Faites masquées":"Masquer les faites"));
  stripKids.push(tete);
  if(state.svTilesOpen){
    if(!visibles.length)stripKids.push(h("div",{className:"muted",style:{padding:"6px 2px"}},
      "Tout ce groupe est évalué. Passez au suivant, ou réaffichez les faites."));
    else stripKids.push(tiles);
  }
  var strip=h("div",{style:{padding:"10px 12px",background:"#162032",borderBottom:"1px solid #1E293B",flexShrink:"0",maxHeight:"46vh",overflowY:"auto"},"data-scroll-key":"sv-tiles"},stripKids);

  var body;
  if(!state.svPlayerId){
    body=h("div",{className:"quick-prompt"},h("div",{className:"arrow"},"↑"),
      h("div",{style:{fontSize:"14px"}},state.svTilesOpen
        ?("Choisissez un numéro"+(gCour?" — "+gCour.name:""))
        :"Dépliez la grille pour choisir un numéro"));
  } else {
    body=renderSvPlayerPanel(src,state.svPlayerId,ordered);
  }
  var pr=svProgress(src);
  var bar=h("div",{className:"ctx-bar"},
    h("button",{className:"grow",onclick:function(){state.tab="sv_views";render()}},h("span",null,"🎯"),
      h("span",{style:{fontWeight:"700",color:"#CBD5E1"}},v.name),
      svCampaignLabel(src)?h("span",{className:"muted"},"· "+svCampaignLabel(src)):null,
      h("span",{style:{opacity:".6"}},"▾")),
    h("span",{className:"muted"},pr.done+"/"+pr.total));

  return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},bar,strip,body,
    h("div",{className:"save-bar"},h("div",{className:"inner"},h("div",{style:{display:"flex",gap:"8px",alignItems:"center"}},
      h("button",{className:"btn btn-warn",style:{flex:"1"},onclick:function(){state.tab="sv_submit";render()}},"📤 Soumettre la vue"),
      renderAutoSave()))));
}

function renderSvPlayerPanel(src,pid,ordered){
  var v=src.view,d=svEntry(v,pid),num=svNumber(src,pid);
  var panel=h("div",{className:"quick-panel","data-scroll-key":"sv-panel"});

  /* En-tête : numéro seul */
  var idx=ordered.indexOf(pid);
  panel.appendChild(h("div",{className:"row-between",style:{marginBottom:"12px"}},
    h("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},
      h("span",{style:{fontSize:src.view.anonymous!==false?"30px":"20px",fontWeight:"800",color:"#FDE68A"}},svDisplay(src,pid)),
      h("span",{className:"muted"},"athlète "+(idx+1)+"/"+ordered.length)),
    h("div",{className:"btn-row"},
      h("button",{className:"btn btn-ghost xs",disabled:idx<=0,onclick:function(){state.svPlayerId=ordered[idx-1];render()}},"←"),
      h("button",{className:"btn btn-ghost xs",disabled:idx>=ordered.length-1,onclick:function(){state.svPlayerId=ordered[idx+1];render()}},"→"))));

  /* Critères notés 1–5 */
  var crits=v.criteria.filter(function(k){return CRIT_BY_KEY[k]});
  if(crits.length){
    panel.appendChild(h("div",{className:"section-title"},"Évaluation"));
    crits.forEach(function(k){
      var c=CRIT_BY_KEY[k];
      var valSpan=h("span",null,d.ratings[k]?(d.ratings[k]+"/"+RATING_MAX):c.desc);
      var scale=h("div",{className:"rate-scale"});
      for(var i=1;i<=RATING_MAX;i++)(function(n){
        var dot=h("button",{className:"rate-dot"+(d.ratings[k]===n?" on":""),onclick:function(){
          pushUndoView("Note "+c.label+" · "+numLabel(num),v);
          d.ratings[k]=(d.ratings[k]===n)?0:n;
          valSpan.textContent=d.ratings[k]?(d.ratings[k]+"/"+RATING_MAX):c.desc;
          Array.prototype.forEach.call(scale.children,function(el,j){
            el.className="rate-dot"+(d.ratings[k]===j+1?" on":"");
          });
          scheduleAutoSave();
        }},String(n));
        scale.appendChild(dot);
      })(i);
      panel.appendChild(h("div",{className:"crit-block"},
        h("div",{className:"ttl"},h("b",null,c.label),valSpan),scale));
    });
  }

  /* Statistiques observées */
  var groups=normGroups(v.groups);
  if(groups.length){
    panel.appendChild(h("div",{className:"section-title"},"Statistiques observées"));
    groups.forEach(function(gk){
      var g=SG[gk];
      panel.appendChild(h("div",{className:"qp-group"},
        h("div",{className:"qp-group-title",style:{background:g.color+"20",color:g.color}},g.name),
        h("div",{className:"qp-stats-row"},g.stats.map(function(s){
          var countSpan=h("span",{className:"count"},String(d.stats[s.key]||0));
          var btn=h("button",{className:"qp-stat-btn",style:{borderColor:g.color,background:g.color+"15",color:"#F8FAFC"},onclick:function(){
            pushUndoView(numLabel(num)+" · "+s.label+" +1",v);
            d.stats[s.key]=(d.stats[s.key]||0)+1;
            countSpan.textContent=String(d.stats[s.key]);
            btn.style.background=g.color;btn.style.color=onColor(g.color);btn.style.transform="scale(1.05)";
            setTimeout(function(){btn.style.background=g.color+"15";btn.style.color="#F8FAFC";btn.style.transform="scale(1)"},180);
            scheduleAutoSave();
          }},countSpan,h("span",{className:"lbl"},s.label));
          var dec=h("button",{className:"qp-dec",onclick:function(){
            if(!d.stats[s.key])return;
            pushUndoView(numLabel(num)+" · "+s.label+" −1",v);
            d.stats[s.key]--;countSpan.textContent=String(d.stats[s.key]);scheduleAutoSave();
          }},"−");
          return h("div",{className:"qp-stat-cell"},btn,dec);
        }))));
    });
  }

  /* Recommandation */
  panel.appendChild(h("div",{className:"section-title"},"Recommandation"));
  var recoRow=h("div",{className:"reco-row"});
  RECOS.forEach(function(r){
    var b=h("button",{className:"reco-btn"+(d.reco===r.key?" on":""),onclick:function(){
      pushUndoView("Avis · "+numLabel(num),v);
      d.reco=(d.reco===r.key)?"":r.key;
      Array.prototype.forEach.call(recoRow.children,function(el,j){
        var rr=RECOS[j],on=d.reco===rr.key;
        el.className="reco-btn"+(on?" on":"");
        if(on)paintOn(el,rr.color);else{el.style.background="var(--sunken)";el.style.borderColor="";el.style.color=""}
        el.style.borderColor=on?rr.color:"#334155";
      });
      scheduleAutoSave();
    }},r.icon+" "+r.label);
    if(d.reco===r.key)paintOn(b,r.color);
    recoRow.appendChild(b);
  });
  panel.appendChild(recoRow);

  /* Poste proposé — facultatif, et toujours un avis : rien n'est écrit
     dans l'effectif, que seul l'entraîneur tient. Le « — » est allumé
     tant que rien n'est proposé, pour qu'un choix reste lisible d'un
     coup d'œil, et il sert aussi à revenir en arrière. */
  panel.appendChild(h("div",{className:"section-title"},"Poste proposé"));
  var posChoices=[{key:"",label:"—",title:"Sans avis"}].concat(POS_KEYS.map(function(k){
    return {key:k,label:k,title:POS_LABELS[k]};
  }));
  var posRow=h("div",{className:"pos-vote-row"});
  posChoices.forEach(function(pc){
    posRow.appendChild(h("button",{className:"pos-vote-btn"+((d.pos||"")===pc.key?" on":""),title:pc.title,onclick:function(){
      pushUndoView("Poste · "+numLabel(num),v);
      d.pos=(d.pos===pc.key)?"":pc.key;
      Array.prototype.forEach.call(posRow.children,function(el,j){
        el.className="pos-vote-btn"+((d.pos||"")===posChoices[j].key?" on":"");
      });
      scheduleAutoSave();
    }},pc.label));
  });
  panel.appendChild(posRow);
  panel.appendChild(h("div",{className:"muted",style:{marginTop:"6px"}},
    "Facultatif — "+POS_KEYS.map(function(k){return k+" "+POS_LABELS[k].toLowerCase()}).join(" · ")+"."));

  /* Commentaire */
  panel.appendChild(h("div",{className:"section-title"},"Commentaire"));
  var ta=h("textarea",{className:"txt",placeholder:"Observations sur l'athlète "+svDisplay(src,pid)+"…",rows:"3"});
  ta.value=d.note||"";
  ta.addEventListener("input",function(e){d.note=e.target.value;scheduleAutoSave()});
  panel.appendChild(ta);
  panel.appendChild(h("div",{style:{height:"14px"}}));
  return panel;
}

/* ── Écran de soumission ───────────────────────────────────── */
function renderSvSubmit(){
  var src=state.svViewId?svFind(state.svViewId):null;
  if(!src)return emptyBlock("📤","Aucune vue sélectionnée","Choisissez d'abord une vue à soumettre.",
    h("button",{className:"btn btn-primary",onclick:function(){state.tab="sv_views";render()}},"Voir mes vues"));
  var v=src.view,ordered=svOrdered(src),pr=svProgress(src);

  var nameInp=h("input",{className:"txt",placeholder:"Votre nom (ex. Marie T.)",value:v.selectorName||""});
  nameInp.addEventListener("input",function(e){v.selectorName=e.target.value;scheduleAutoSave()});

  var wrap=h("div",null);
  var canUpload=src.kind==="inbox"&&syncReady();
  wrap.appendChild(h("div",{className:"hint"},"Vérifiez votre saisie, indiquez votre nom, puis soumettez. ",
    src.kind==="local"?"La soumission est transmise directement à l'entraîneur sur cet appareil."
    :(canUpload?"Vos données seront téléversées vers l'entraîneur."
               :"Vous n'êtes pas connecté au salon : un fichier de soumission sera généré, à transmettre à l'entraîneur.")));
  wrap.appendChild(h("div",{className:"field"},h("label",null,"Sélectionneur"),nameInp));
  wrap.appendChild(h("div",{className:"card tight"},
    h("div",{className:"row-between"},
      h("div",null,h("div",{style:{color:"#F8FAFC",fontWeight:"700"}},v.name),
        h("div",{className:"muted",style:{marginTop:"2px"}},pr.done+"/"+pr.total+" athlètes évaluées")),
      h("span",{className:"score-pill",style:{background:(pr.pct===100?"#10B981":"#F59E0B")+"22",color:pr.pct===100?"#34D399":"#FBBF24"}},pr.pct+"%")),
    h("div",{className:"progress"},h("i",{style:{width:pr.pct+"%"}}))));

  wrap.appendChild(h("div",{className:"section-title"},"Récapitulatif"));
  ordered.forEach(function(pid){
    var d=v.data[pid]||mkEntryData();
    var crits=v.criteria.filter(function(k){return CRIT_BY_KEY[k]&&d.ratings[k]>0});
    var avg=crits.length?crits.reduce(function(s,k){return s+d.ratings[k]},0)/crits.length:0;
    var r=d.reco?RECO_BY_KEY[d.reco]:null;
    var nStats=sumStats(d.stats);
    wrap.appendChild(h("div",{className:"compile-row",onclick:function(){
      state.svPlayerId=pid;state.tab="sv_eval";render();
    }},
      h("span",{className:"score-pill",style:{background:scoreColor(avg)+"22",color:scoreColor(avg)}},avg?avg.toFixed(1):"—"),
      h("div",{style:{flex:"1",minWidth:"0"}},
        h("div",{className:"pname"},svDisplay(src,pid)),
        h("div",{className:"psub"},crits.length+"/"+v.criteria.length+" critères · "+plural(nStats,"action")+
          (d.pos?" · "+d.pos:"")+((d.note||"").trim()?" · 💬":""))),
      r?h("span",{className:"badge",style:{background:r.color+"20",color:r.color}},r.icon+" "+r.short):
        h("span",{className:"badge",style:{background:"#33415530",color:"#94A3B8"}},"sans avis")));
  });

  /* Le garde-fou ne peut plus rendre un booléen : la dernière question
     qu'il pose n'est plus bloquante. Il reçoit donc la suite et
     l'appelle lui-même quand la voie est libre. */
  function guard(suite){
    if(!pr.done){showToast("⚠️ Aucune athlète évaluée",{tone:"warn"});return}
    if(!(v.selectorName||"").trim()){showToast("⚠️ Indiquez votre nom",{tone:"warn"});nameInp.focus();return}
    if(src.kind==="local"&&!campaignOpen(src.season,src.campaign)){showToast("⚠️ Campagne close",{tone:"warn"});return}
    if(pr.done<pr.total){
      confirmAct((pr.total-pr.done)+" athlète(s) non évaluée(s).\nSoumettre quand même ?",
        suite,{confirm:"Soumettre",tone:"primary"});
      return;
    }
    suite();
  }
  var submitBtn=h("button",{className:"btn btn-save full",style:{marginTop:"16px"},disabled:syncBusy,onclick:function(){
    guard(function(){
      if(src.kind==="local"){
        submitLocalView(src.season,v);
        showToast("✅ Statistiques soumises à l'entraîneur",{tone:"ok"});
        state.tab="sv_views";render();
      } else if(canUpload){
        uploadSubmission(v);
      } else {
        exportSubmission(v);render();
      }
    });
  }},syncBusy?"⏳ Téléversement…":(src.kind==="local"?"✅ Soumettre les statistiques"
      :(canUpload?"📡 Téléverser ma soumission":"📤 Générer le fichier de soumission")));
  wrap.appendChild(submitBtn);
  if(canUpload)wrap.appendChild(h("button",{className:"btn btn-ghost sm full",style:{marginTop:"8px"},onclick:function(){
    guard(function(){exportSubmission(v);render()});
  }},"📤 Plutôt générer un fichier (secours hors-ligne)"));
  if(v.submittedAt)wrap.appendChild(h("div",{className:"muted",style:{textAlign:"center",marginTop:"8px"}},
    "Dernière soumission : "+fmtDate(v.submittedAt)+" · vous pouvez soumettre à nouveau après correction."));
  wrap.appendChild(h("div",{style:{height:"20px"}}));
  return h("div",{className:"content pad","data-scroll-key":"sv-submit"},wrap);
}

/* ══════════════════════════════════════════════════════════════
   MODALES

function openModal(type,ctx,input,input2){
  state.modalType=type;state.modalCtx=ctx||null;
  state.modalInput=input!=null?input:"";state.modalInput2=input2!=null?input2:"";
  render();
  if(MODAL_NOFOCUS[type])return;
  setTimeout(function(){
    var el=document.querySelector(".modal input,.modal textarea");
    if(el&&!("ontouchstart" in window))el.focus();
  },40);
}
function closeModal(){state.modalType=null;state.modalCtx=null;state.modalInput="";state.modalInput2="";state.modalSel=[];state.modalDraft=null;state.editingSubteamId=null;state.editViewId=null;render()}
function modalShell(title,body,buttons,maxWidth){
  return h("div",{className:"modal-bg",onclick:closeModal},
    h("div",{className:"modal",style:maxWidth?{maxWidth:maxWidth}:null,onclick:function(e){e.stopPropagation()}},
      h("h3",null,title),body,
      h("div",{style:{display:"flex",gap:"8px",marginTop:"6px",flexWrap:"wrap"}},buttons)));
}
/* Le numéro d'une athlète tel qu'il faut le lire pour une campagne : celui
   qu'elle porte aujourd'hui, et celui qu'elle portait alors s'il a changé.
   Une retenue reçoit son maillot après la sélection ; sans ce rappel, le
   classement du tryout afficherait des numéros que personne n'a vus ce
   jour-là, et les commentaires des évaluateurs deviendraient illisibles. */
function dossardsAutres(comp,entry){
  var actuel=cleanNum(entry&&entry.number);
  var autres=(comp&&comp.numeros||[]).filter(function(n){return n&&n!==actuel});
  return autres;
}
function numeroPourCampagne(comp,entry){
  var actuel=cleanNum(entry&&entry.number);
  var autres=dossardsAutres(comp,entry);
  var tete=actuel?"#"+actuel:"";
  if(!autres.length)return tete;
  var d=(autres.length===1?"dossard ":"dossards ")+autres.join(", ");
  return tete?(tete+" · "+d):(d.charAt(0).toUpperCase()+d.slice(1));
}

/* La formule en vigueur, dite en une phrase. Le même texte sert partout
   où l'on rappelle sur quoi le classement repose. */
function formuleEnClair(sc){
  if(scoringIsPlain(sc))return "Score : moyenne simple des critères. Les compteurs relevés ne pèsent pas.";
  return "Score : critères "+(100-Math.round(sc.statShare*100))+" % · statistiques "+
    Math.round(sc.statShare*100)+" %"+
    (sc.severity?" · sévérité des sélectionneurs corrigée":"")+
    (sc.reliability>0?" · amorti selon le nombre de regards":"")+".";
}

/* L'âge d'une athlète, en années révolues. Sans naissance connue,
   rien — et surtout pas zéro, qui se trierait comme un bébé. */
function ageOf(p){
  var k=birthSortKey(p);
  if(k.y===null)return null;
  var d=new Date(),a=d.getFullYear()-k.y;
  if(k.md){
    var mdAuj=pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
    if(mdAuj<k.md)a--;
  }
  return a;
}

/* ── « Constituer l'équipe » ────────────────────────────────────
   La liste des athlètes retenues, et devant chacune les deux seuls
   gestes qui comptent : confirmer — elle accepte, elle entre dans
   l'équipe — ou archiver — elle refuse, elle en sort.

   Ce n'est pas un écran de consultation : c'est le moment où une
   saison se décide. D'où la feuille du bas, qui colle au pouce, et
   le compte tenu à jour en permanence — on constitue une équipe en
   sachant combien on a déjà. */
function retenuesDe(sq){
  var vues={},out=[];
  (sq.roster||[]).forEach(function(r){
    var o=currentOffer(sq,r.playerId);
    if(!o&&r.status!=="selected")return;
    if(o&&o.status==="declined"&&r.status!=="selected")return;
    if(vues[r.playerId])return;
    vues[r.playerId]=1;
    out.push({entry:r,player:playerById(r.playerId),offer:o});
  });
  return out.filter(function(x){return !!x.player});
}

            "chacune recevra alors une offre en attente, et paraîtra ici."});
    },
    rows:function(res){
      return res.map(function(x){
        var pid=x.entry.playerId,o=x.offer,sc=score(x),a=ageOf(x.player);
        var meta=[];

        if(o&&OFFER_STATUS[o.status])meta.push(tok("box",OFFER_STATUS[o.status]));

        var enAttente=!!(o&&o.status==="pending");
        /* Une offre ARCHIVÉE était une impasse : la retenir de nouveau ne
           lui en fabrique pas une seconde — l'épisode reste ouvert en base
           tant qu'on ne le rouvre pas — et les deux boutons restaient
           grisés à jamais. On donne donc le geste que le modèle prévoit,

                  title:"Rouvrir l'offre de "+fullName(x.player)+" ?",
                  body:"Son offre repasse « en attente » : elle pourra de nouveau "+
                       "être confirmée, et entrer dans l'équipe.",
                  detail:"Rien d'autre ne change : ni sa fiche, ni ses compteurs, "+
                         "ni les matchs qu'elle a joués.",
                  confirm:"Rouvrir",
                  onconfirm:function(){
                    reopenOffer(sq,o.id);

                  }});
              }},"↺ Rouvrir l'offre"));
          return h("div",{className:"bt-row"},

              meta:meta,decision:x.entry.status,
              dim:x.entry.membership==="left"}),
            rouvrir);
        }
        var actions=h("div",{className:"bt-act"},
          h("button",{className:"btn btn-save sm",type:"button",disabled:!enAttente,
            "aria-label":"Confirmer "+fullName(x.player),
            onclick:function(){
              acceptOffer(sq,o.id,state.meId||null);
              showToast("🤝 "+shortName(x.player)+" rejoint l'équipe",{tone:"ok"});

                "Son offre passe à « refusée » et elle sort de l'équipe. "+
                "Sa fiche, ses statistiques et ses matchs sont conservés.",
                function(){
                  declineOffer(sq,o.id,state.meId||null);

    h("div",null,

        h("b",null,"Confirmer")," l'accepte et la fait entrer dans l'équipe ; ",
        h("b",null,"Archiver")," la refuse et l'en retire — sans jamais toucher "+
        "à sa fiche ni à ses statistiques."),
      h("div",{className:"bt-count"},
        plural(dansEquipe,"athlète")+" dans l'équipe"+
        (attente?" · "+plural(attente,"offre")+" en attente":"")),

    }

    /* Découper : on repart de zéro, dans l'ordre des numéros. */

      var nomInp=h("input",{placeholder:"Nom du groupe",value:gsel.name,maxlength:"40"});

  /* ── Réglage de la formule du score ── */
  if(T==="scoring"){

  /* ── Application des avis compilés au roster ── */

      [cancel,changes.length?h("button",{id:"modalOk",className:"btn btn-warn full",onclick:function(){
        changes.forEach(function(ch){setRosterStatus(season,ch.entry,ch.target)});
        logAct("status","Avis de la campagne "+(applyCamp?"« "+applyCamp.name+" »":"active")+
          " appliqués : "+plural(changes.length,"statut")+" alignés",
          {teamId:season.teamId,seasonId:season.seasonId});
        closeModal();saveNow();showToast("⚡ "+plural(changes.length,"statut")+" mis à jour");
      }},"Appliquer ("+changes.length+")"):null],"440px");
  }
  return null;
}

var scrollPositions={};
function scrollKeyOf(el){return el.getAttribute("data-scroll-key")||el.className.split(" ")[0]}
function saveScrollPos(){
  var els=document.querySelectorAll(".content,.quick-panel,[data-scroll-key]");
  for(var i=0;i<els.length;i++){var k=scrollKeyOf(els[i]);if(k)scrollPositions[k]=els[i].scrollTop}
}
function restoreScrollPos(){
  requestAnimationFrame(function(){
    var els=document.querySelectorAll(".content,.quick-panel,[data-scroll-key]");
    for(var i=0;i<els.length;i++){
      var k=scrollKeyOf(els[i]);
      if(k&&scrollPositions[k]!=null)els[i].scrollTop=scrollPositions[k];
    }
  });
}

};

  if(gate.mode)return renderGate();

          showToast("🔄 Réinitialisé",{tone:"warn",action:{label:"Annuler",onclick:doUndo}});render();
        },{confirm:"Réinitialiser"});

    }},isQuick?"Grille":"Rapide");

    var ub=h("button",{className:"btn btn-undo xs",disabled:!undoStack.length,onclick:doUndo},"↩");
    ub.id="undoBtn";leftEl=ub;

      h("div",{className:"btn-row",style:{justifyContent:"center",flexWrap:"wrap"}},
        DB.people.length?h("button",{className:"btn btn-primary",onclick:function(){openModal("whoami")}},"Choisir qui je suis"):null,
        (!rootExists()&&cryptoAvailable())
          ?h("button",{className:"btn btn-ghost",onclick:startFounding},"👑 Fonder le système"):null));
  } else if(isSuperCtx()){

    else content=h("div",{className:"content pad","data-scroll-key":"adm-log"},renderLogPane(""));
  } else if(isAdminCtx()){

    else if(state.tab==="adm_seasons")content=renderAdminSeasons();

      isAdmin()?h("button",{className:"btn btn-primary",onclick:function(){openModal("newseason")}},"+ Créer une saison"):null);

/* ══════════════════════════════════════════════════════════════
   ÉCRAN DE GARDE — verrouillage, inscription, pose du verrou

   Trois états seulement : « unlock » quand un coffre existe, « welcome »
   quand l'appareil est vierge, « protect » quand des données sont là mais
   encore en clair. Aucun ne donne l'administration sans qu'on la demande.
   ══════════════════════════════════════════════════════════════ */
var gate={mode:null,busy:false,err:"",pass:"",pass2:"",hint:"",who:"",
  step:null,loaded:false,needsName:false,rootFile:null,keyFile:null,fromApp:false};

/* La fondation depuis l'application : un appareil déjà installé n'a
   jamais vu l'écran d'accueil, et sans cela il ne pourrait jamais
   devenir celui du propriétaire. Le coffre est déjà ouvert, donc la
   phrase n'est pas redemandée, et la base en place est conservée. */
function startFounding(){
  gate.fromApp=true;gate.err="";gate.busy=false;
  gate.who=(me()&&me().name)||"";
  gate.mode="found";renderGate();
}

function passScore(p){
  p=p||"";
  var n=0;
  if(p.length>=8)n++;
  if(p.length>=12)n++;
  if(p.length>=16)n++;
  if(/[^a-zA-Z0-9]/.test(p)&&/[0-9]/.test(p))n++;
  return Math.min(4,n);
}
function passLabel(n){return ["Trop courte","Faible","Correcte","Bonne","Solide"][n]||""}
function passColor(n){return ["#F87171","#F87171","#F59E0B","#34D399","#34D399"][n]||"#F87171"}

function gateField(label,key,ph,type){
  var inp=h("input",{type:type||"password",placeholder:ph||"",value:gate[key]||"",
    autocapitalize:"off",autocorrect:"off",spellcheck:"false"});
  inp.addEventListener("input",function(e){
    gate[key]=e.target.value;
    if(key==="pass"){
      var b=document.getElementById("strengthBar");
      if(b){var n=passScore(gate.pass);b.style.width=(n*25)+"%";b.style.background=passColor(n);
        var lb=document.getElementById("strengthLbl");if(lb){lb.textContent=gate.pass?passLabel(n):"";lb.style.color=passColor(n)}}
    }
  });
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")gateSubmit()});
  return h("div",{className:"field"},h("label",null,label),inp);
}
function gateErr(){return h("div",{className:"err"},gate.err||"")}

function renderGate(){
  var app=document.getElementById("app");if(!app)return;
  app.innerHTML="";
  var wrap=h("div",{className:"gate"});

  if(!cryptoAvailable()&&gate.mode!=="nocrypto"){
    /* Ouvert en file:// ou navigateur trop ancien : le chiffrement du
       navigateur n'est pas disponible. Le dire, plutôt que simuler. */
    wrap.appendChild(h("div",{className:"gate-logo"},"🏐"));
    wrap.appendChild(h("h1",null,"WonderStats"));
    wrap.appendChild(h("div",{className:"note"},
      h("b",null,"Chiffrement indisponible sur cet appareil. "),
      "Le navigateur ne fournit pas les fonctions nécessaires — le plus souvent parce que la page est ouverte depuis un fichier local plutôt que par une adresse https. ",
      "Ouvrez l'application depuis son adresse web pour que vos données soient chiffrées."));
    wrap.appendChild(h("button",{className:"btn btn-primary full",onclick:function(){
      VAULT.noCrypto=true;gateFinishOpen(null);
    }},"Continuer sans chiffrement"));
    app.appendChild(wrap);return;
  }

  if(gate.mode==="unlock"){
    wrap.appendChild(h("div",{className:"gate-logo"},"🔒"));

function gateSubmit(){
  if(gate.busy)return;
  gate.err="";

  if(gate.mode==="unlock"){
    if(!gate.pass){gate.err="Saisissez votre phrase de passe";renderGate();return}
    gate.busy=true;renderGate();
    vaultUnlock(gate.pass).then(function(data){
      gate.pass="";gate.busy=false;
      gateFinishOpen(data);
    }).catch(function(err){
      gate.busy=false;gate.err=err.message;gate.pass="";renderGate();
    });
    return;
  }

  if(gate.mode==="restore"){
    if(!gate.keyFile){gate.err="Choisissez d'abord le fichier";renderGate();return}
    if(!gate.pass){gate.err="Saisissez la phrase de la clé";renderGate();return}
    gate.busy=true;renderGate();
    openKey(gate.keyFile,gate.pass).then(function(charge){
      SECRETS.superKey=charge.superKey;
      DB=normalizeDB(emptyDB());
      var moi=mkPerson({name:charge.name||"Propriétaire",id:charge.superId});
      DB.people.push(moi);DB.enrolledId=moi.id;DB.superId=moi.id;
      state.meId=moi.id;
      return proveSuper().then(function(ok){
        if(!ok)throw new Error("Cette clé ne correspond pas à celle publiée");
        gate.keyFile=null;gate.pass="";gate.busy=false;
        gate.mode="protect";gate.needsName=false;gate.loaded=true;
        gate.who=moi.name;gate.err="";
        renderGate();
      });
    }).catch(function(err){
      gate.busy=false;gate.err=err.message;renderGate();
    });
    return;
  }

  if(gate.mode==="found"){
    if(!(gate.who||"").trim()){gate.err="Indiquez votre nom";renderGate();return}
    if(!gate.fromApp){
      if((gate.pass||"").length<8){gate.err="Au moins 8 caractères";renderGate();return}
      if(gate.pass!==gate.pass2){gate.err="Les deux phrases diffèrent";renderGate();return}
    }
    gate.busy=true;renderGate();
    var fondateur=(gate.who||"").trim();
    foundSystem(fondateur).then(function(fichier){
      if(gate.fromApp){
        /* La base en place est conservée : on ne fonde pas sur des
           ruines. La personne qui fonde est celle qui tient l'appareil. */
        var moi0=me();
        if(!moi0){moi0=mkPerson({name:fondateur});DB.people.unshift(moi0);state.meId=moi0.id}
        moi0.name=fondateur;
        DB.enrolledId=moi0.id;DB.superId=moi0.id;DB.rootFile=fichier;
        return proveSuper().then(function(){
          state.ctx={role:"super"};
          logAct("season","Système fondé par "+fondateur+" depuis une installation existante",{});
          normalizeCtx();saveNow();return fichier;
        });
      }
      DB=emptyDB();
      var moi=mkPerson({name:fondateur});
      DB.people.push(moi);
      DB.enrolledId=moi.id;DB.superId=moi.id;
      DB.seasons.push(mkSeason());
      DB.activeSeasonId=DB.seasons[0].id;
      DB.rootFile=fichier;
      DB=normalizeDB(DB);
      state.meId=moi.id;
      return proveSuper().then(function(){
        state.ctx={role:"super"};
        logAct("season","Système fondé par "+fondateur,{});
        return vaultCreate(gate.pass,(gate.hint||"").trim(),fondateur,
          {db:DB,inbox:INBOX,secrets:SECRETS}).then(function(){return fichier});
      });
    }).then(function(fichier){
      gate.pass="";gate.pass2="";gate.busy=false;
      gate.rootFile=fichier;gate.mode="publish";
      renderGate();
    }).catch(function(err){
      gate.busy=false;gate.err=err.message;renderGate();
    });
    return;
  }

  if(gate.mode==="create"||gate.mode==="protect"){
    if((gate.mode==="create"||gate.needsName)&&!(gate.who||"").trim()){
      gate.err="Indiquez votre nom";renderGate();return}
    if((gate.pass||"").length<8){gate.err="Au moins 8 caractères";renderGate();return}
    if(gate.pass!==gate.pass2){gate.err="Les deux phrases diffèrent";renderGate();return}
    gate.busy=true;renderGate();
    var nom=(gate.who||"").trim();
    if(gate.mode==="create"){
      /* Le club naît ici, et l'administration avec lui — délibérément. */
      DB=emptyDB();
      var admin=mkPerson({name:nom});
      DB.people.push(admin);
      DB.enrolledId=admin.id;
      DB.seasons.push(mkSeason());
      DB.activeSeasonId=DB.seasons[0].id;
      var t0=mkTeamRecord({name:"Équipe A"});
      DB.teams.push(t0);
      DB.assignments.push(mkAssignment(admin.id,t0.id,"coach"));
      DB=normalizeDB(DB);
      state.meId=admin.id;state.ctx={role:"coach",teamId:t0.id};
      logAct("season","Club créé sur cet appareil",{});
    }
    applyOwner(nom);
    var qui=nom||(me()?me().name:"");
    vaultCreate(gate.pass,(gate.hint||"").trim(),qui,{db:DB,inbox:INBOX,secrets:SECRETS}).then(function(){
      gate.pass="";gate.pass2="";gate.busy=false;
      showToast("🔐 Données chiffrées sur cet appareil");
      gateFinishOpen({db:DB,inbox:INBOX,secrets:SECRETS},true);
    }).catch(function(err){
      gate.busy=false;gate.err=err.message;renderGate();
    });
    return;
  }
  gateSubmitJoin();
}

function applyOwner(nom){
    if(gate.needsName){
      var owner=null,admins=[];
      DB.people.forEach(function(p){
        if(!p.revoked&&(p.unclaimed||adminClubsOf(p).length)){admins.push(p);if(!owner&&p.unclaimed)owner=p}
      });
      /* Une base d'avant le verrou porte un administrateur unique, créé
         par l'ancien amorçage. Celui qui est devant l'appareil est cette
         personne : on la renomme au lieu d'en ajouter une seconde. */
      if(!owner&&admins.length===1)owner=admins[0];
      if(owner){owner.name=nom;delete owner.unclaimed}
      else{owner=mkPerson({name:nom});DB.people.unshift(owner)}
      DB.enrolledId=owner.id;
      /* Un club sans équipe est une impasse : on en installe une, comme
         à la création. Les équipes déjà là restent les siennes. */
      if(!DB.teams.length)DB.teams.push(mkTeamRecord({name:"Équipe A"}));
      DB.teams.forEach(function(t){
        if(!DB.assignments.some(function(a){return a.personId===owner.id&&a.teamId===t.id&&a.role==="coach"}))
          DB.assignments.push(mkAssignment(owner.id,t.id,"coach"));
      });
      DB=normalizeDB(DB);
      state.meId=owner.id;
      if(!state.ctx)state.ctx=DB.teams.length?{role:"coach",teamId:DB.teams[0].id}:{role:"admin"};
      normalizeCtx();
      gate.needsName=false;
      saveAll();
    }
}

function gateSubmitJoin(){
  if(gate.mode!=="join")return;
  var cfg=parseShareText(gate.who||"");
  if(!cfg){gate.err="Lien d'invitation non reconnu";renderGate();return}
  gate.busy=true;renderGate();
  joinWithConfig(cfg);
}

/* Le relais est seul juge : c'est lui qui dit qui est le porteur du jeton
   et sur quelle équipe il travaille. Le lien ne fait que transporter. */
function joinWithConfig(cfg){
  /* L'adresse garde son lien tant que le relais n'a pas répondu : si la
     connexion échoue ou si l'appareil se recharge avant d'avoir posé sa
     phrase, recharger la page réessaie l'invitation au lieu de la
     perdre. On ne l'efface qu'une fois l'identité en main. */
  SYNC.url=cfg.url;SYNC.room=cfg.room;SYNC.token=cfg.token;
  SYNC.pulled={packet:"",catalog:"",submission:""};SYNC.identity=null;
  saveSync();
  syncWhoami().then(function(data){
    var g=data&&data.grant;
    if(!g)throw new Error("Jeton inconnu du relais");
    var ecart=ecartInvitation(cfg,g);
    if(ecart)throw new Error(ecart);
    clearHash();
    SYNC.identity=g;saveSync();
    DB=normalizeDB(emptyDB());
    adoptRemoteIdentity(g);
    DB.enrolledId=state.meId;
    gate.loaded=true;gate.needsName=false;gate.busy=false;
    gate.mode="protect";gate.who=g.name||"";gate.err="";
    renderGate();
  }).catch(function(err){
    gate.busy=false;gate.mode="join";
    gate.err=err.message;gate.who=gate.who||"";
    renderGate();
  });
}

/* Sortie de l'écran de garde : on charge, on branche le reste, on rend. */
function gateFinishOpen(data,already){
  if(!already&&!(gate.loaded&&!data))loadAll(data||null);
  gate.loaded=true;
  gate.mode=null;
  bootRest();
  render();
  /* La preuve de possession de la clé et la vérification des signatures
     sont asynchrones : l'application s'affiche d'abord, puis se corrige.
     Rien de ce qui compte n'est accordé avant que la preuve soit faite. */
  adoptLocalRoot().then(proveSuper).then(verifyAll).then(function(){
    normalizeCtx();render();
  }).catch(function(){});
}
/* ══════════════════════════════════════════════════════════════
   DÉMARRAGE
   ══════════════════════════════════════════════════════════════ */
loadSync();

/* L'application ne s'ouvre qu'après l'écran de garde. Trois cas :
   un coffre est là et il faut la phrase ; des données sont là en clair
   et il faut proposer de les protéger ; rien n'est là et il faut
   savoir qui s'inscrit. Aucun ne donne l'administration d'office. */
loadRoot().then(boot);

function boot(){
  var box=readVaultBox();
  if(box){
    VAULT.meta={kdf:box.kdf,hint:box.hint||"",who:""};
    gate.mode="unlock";renderGate();return;
  }
  var enClair=localStorage.getItem(SK)||readAnyLegacy();
  /* Une invitation l'emporte sur une base où il n'y a personne : ce
     n'est pas un club, c'est une trace laissée par une visite. La
     ceinture après les bretelles — saveAll() ne l'écrit plus, mais les
     appareils qui en portent déjà une doivent pouvoir rejoindre. */
  if(enClair&&baseSansPersonne(enClair)&&readShareLink())enClair=null;
  if(enClair){
    loadAll();
    gate.loaded=true;
    /* Une base d'avant les rôles ne contient aucune personne : celui qui
       la migre est son propriétaire, mais il doit se nommer — on ne le
       devine pas, et on ne fabrique plus d'« Administrateur » anonyme. */
    gate.needsName=!(DB.enrolledId&&personById(DB.enrolledId));
    gate.who=me()?me().name:"";
    if(cryptoAvailable()||gate.needsName){gate.mode="protect";renderGate();return}
    gateFinishOpen(null);return;
  }
  /* Un lien d'invitation porte déjà le jeton : on se connecte tout de
     suite, puis on demande au sélectionneur sa propre phrase de passe. */
  var inv=readShareLink();
  if(inv){gate.mode="joining";renderGate();joinWithConfig(inv);return}
  /* Un lien coupé en route — une messagerie qui n'emporte pas ce qui suit
     le « # », un copier-coller à moitié — laissait l'invité devant
     « Je suis le propriétaire », qui n'est pas pour lui. On le dit, et on
     l'amène là où il pourra recoller son lien. */
  if(/[#&]s=/.test(location.hash||"")){
    gate.mode="join";gate.who="";
    gate.err="Ce lien d'invitation est incomplet : recopiez-le en entier, jusqu'au dernier caractère.";
    renderGate();return;
  }
  gate.mode="welcome";renderGate();
}

/* Une base qui ne nomme personne n'a rien à protéger : ni compte, ni
   athlète, ni équipe-saison. */
function baseSansPersonne(brut){
  try{
    var d=JSON.parse(brut);
    if(!d||typeof d!=="object")return true;
    return !(d.people||[]).length&&!(d.players||[]).length&&!(d.squads||[]).length;
  }catch(e){return true}
}
function readAnyLegacy(){
  for(var i=0;i<LEGACY_KEYS.length;i++){
    var d=localStorage.getItem(LEGACY_KEYS[i]);
    if(d)return d;
  }
  return null;
}

/* Ce qui suit le déverrouillage : lien d'invitation, service worker,
   tout ce qui suppose une base chargée. */
function bootRest(){
  /* Le journal d'opérations d'une session interrompue : rejoué s'il est
     en avance sur le bloc, ignoré au moindre doute. */
  try{
    var box=readVaultBox();
    replayPendingOps(box&&box.at,function(n){if(n)render()});
  }catch(e){}
  var cfg=readShareLink();
  if(!cfg)return;
  SYNC.url=cfg.url;SYNC.room=cfg.room;SYNC.token=cfg.token;
  SYNC.pulled={packet:"",catalog:"",submission:""};
  SYNC.identity=null;
  saveSync();clearHash();
  syncWhoami().then(function(data){
    var g=data&&data.grant;
    if(!g)throw new Error("Jeton inconnu du relais");
    var ecart=ecartInvitation(cfg,g);
    if(ecart)throw new Error(ecart);
    SYNC.identity=g;saveSync();
    adoptRemoteIdentity(g);
    showToast("📡 Bonjour "+(g.name||"")+" — "+(g.teamName||""));
    render();
  }).catch(function(err){
    showToast("⚠️ "+err.message);render();
  });
}

/* Reconstitue localement la personne, l'équipe et l'affectation décrites
   par le relais, pour que l'appareil du sélectionneur ait un contexte. */
function adoptRemoteIdentity(g){
  if(!g||!g.token)return;
  var person=null;
  DB.people.forEach(function(p){if(p.token===g.token)person=p});
  if(!person){person=mkPerson({name:g.name||"Sélectionneur",token:g.token});DB.people.push(person)}
  else person.name=g.name||person.name;
  person.revoked=false;
  state.meId=person.id;

  if(g.role==="admin"){
    /* Le relais atteste d'une administration de club : sans club connu,
       on ne peut rien accorder — l'appareil reste sans contexte. */
    var cl=g.clubId?clubById(g.clubId):null;
    if(!cl&&g.clubName){cl=mkClub({id:g.clubId||uid(),name:g.clubName});DB.clubs.push(cl)}
    if(cl&&!DB.clubAssignments.some(function(a){
      return a.personId===person.id&&a.clubId===cl.id&&a.role==="admin";}))
      DB.clubAssignments.push(mkClubAssignment(person.id,cl.id,"admin",g.grant||null));
    if(cl)state.ctx={role:"admin",clubId:cl.id};
    normalizeCtx();saveAll();return;
  }
  if(!g.teamId){normalizeCtx();saveAll();return}

  var team=teamById(g.teamId);
  if(!team){
    team=mkTeamRecord({id:g.teamId,name:g.teamName||"Équipe"});
    DB.teams.push(team);
  } else if(g.teamName)team.name=g.teamName;

  var role=ROLES[g.role]?g.role:"selector";
  var has=DB.assignments.some(function(a){
    return a.personId===person.id&&a.teamId===team.id&&a.role===role;
  });
  if(!has)DB.assignments.push(mkAssignment(person.id,team.id,role));
  state.ctx={role:role,teamId:team.id};
  state.tab=(tabsForCtx()[0]||{}).key;
  normalizeCtx();saveAll();
}

/* Pas de rendu ici : l'écran de garde a la main tant que le coffre est
   fermé, et c'est lui qui appellera render() une fois ouvert. */

/* Re-rendu au redimensionnement uniquement si aucun champ n'a le focus
   (le clavier virtuel déclenche « resize » et détruirait la saisie). */
var resizeTimer=null,lastW=window.innerWidth,lastH=window.innerHeight;
window.addEventListener("resize",function(){
  if(resizeTimer)clearTimeout(resizeTimer);
  resizeTimer=setTimeout(function(){
    resizeTimer=null;
    var a=document.activeElement;
    if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"))return;
    var w=window.innerWidth,h2=window.innerHeight;
    if(w===lastW&&Math.abs(h2-lastH)<120)return;   // simple apparition du clavier
    lastW=w;lastH=h2;render();
  },220);
});
/* Une invitation qui arrive sur une page déjà ouverte. C'est le cas le
   plus courant sur un téléphone : l'application installée ne s'ouvre pas
   une seconde fois, le lien ne change que ce qui suit le « # », et rien
   ne se recharge. Toucher son invitation depuis sa messagerie ne faisait
   alors strictement rien — on restait devant l'écran d'accueil, celui
   qui parle de fonder le système. */
window.addEventListener("hashchange",function(){
  var inv=readShareLink();
  if(!inv)return;
  if(!gate.mode){bootRest();return}                 /* application ouverte : on adopte */
  if(gate.mode==="welcome"||gate.mode==="join"||gate.mode==="found"){
    gate.mode="joining";gate.err="";renderGate();joinWithConfig(inv);
  }
  /* unlock et protect : le lien attend que le coffre soit ouvert, et
     c'est bootRest() qui le lira. On ne jette pas des données pour lui. */
});
window.addEventListener("beforeunload",function(){saveAll()});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")saveAll()});

/* Stockage persistant : évite l'éviction des données par le navigateur */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});

/* iOS standalone : empêche le rebond du body sans bloquer les zones défilables */
var SCROLLABLE=".content,.quick-panel,.court-panel,.player-strip,.court-toggle-grid,.modal,.pill-row,.sub-pills,.pos-row,.team-bar,.sess-grid,.subteam-row,.sum-table,.num-grid,textarea,[data-scroll-key]";
document.body.addEventListener("touchmove",function(e){
  if(!(e.target.closest&&e.target.closest(SCROLLABLE)))e.preventDefault();
},{passive:false});
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    reg.addEventListener("updatefound",function(){
      var w=reg.installing;if(!w)return;
      w.addEventListener("statechange",function(){
        // Ne jamais recharger en pleine saisie : on propose la mise à jour.
        if(w.state==="installed"&&navigator.serviceWorker.controller){
          state.updateReady=true;render();
        }
      });
    });
  }).catch(function(){});
}
</script>
