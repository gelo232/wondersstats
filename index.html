    v.criteria=(v.criteria||[]).filter(function(c){return CRIT_BY_KEY[c]});
    if(!v.criteria.length)v.criteria=CRITERIA.map(function(c){return c.key});
    v.groups=normGroups(v.groups);
    if(!campKnown[v.campaignId])v.campaignId=legacyCampaignId;
    v.campaignName=campKnown[v.campaignId].name;
    v.anonymous=v.anonymous!==false;
    var d={};v.playerIds.forEach(function(pid){
      var src=(v.data||{})[pid]||{};
      d[pid]={stats:normStats(src.stats),ratings:src.ratings||{},
        reco:RECO_BY_KEY[src.reco]?src.reco:"",pos:normPos(src.pos),note:src.note||""};
    });
    v.data=d;
    return v;
  });
  sq.submissions=(sq.submissions||[]).map(function(sub){
    var cid=campKnown[sub.campaignId]?sub.campaignId:legacyCampaignId;
    return {id:sub.id||uid(),viewId:sub.viewId||"",viewName:sub.viewName||"Vue",
      selectorName:sub.selectorName||"",selectorToken:sub.selectorToken||"",
      campaignId:cid,campaignName:campKnown[cid].name,context:sub.context||"",
      submittedAt:sub.submittedAt||nowISO(),criteria:sub.criteria||CRITERIA.map(function(c){return c.key}),
      entries:(sub.entries||[]).filter(function(e){return e&&e.playerId}).map(function(e){
        return {playerId:e.playerId,number:cleanNum(e.number),stats:normStats(e.stats),
          ratings:e.ratings||{},reco:RECO_BY_KEY[e.reco]?e.reco:"",pos:normPos(e.pos),note:e.note||""};
      })};
  });
  return sq;
}

function normalizeDB(db){
  db=Object.assign(emptyDB(),db);
  db.version=6;
  db.enrolledId=db.enrolledId||null;
  db.superId=db.superId||null;
  db.rootFile=db.rootFile||null;

  db.log=(db.log||[]).filter(function(l){return l&&l.at&&l.text}).map(function(l){
    return {id:l.id||uid(),at:l.at,kind:LOG_KINDS[l.kind]?l.kind:"status",
      byId:l.byId||null,byName:l.byName||"—",byRole:l.byRole||"",
      teamId:l.teamId||"",seasonId:l.seasonId||"",playerId:l.playerId||"",text:String(l.text)};
  }).slice(-LOG_MAX);
  db.people=(db.people||[]).map(function(p){
    var q=Object.assign(mkPerson(),p,{revoked:!!p.revoked});
    if(p.unclaimed)q.unclaimed=true;   /* compte hérité, en attente d'un nom */
    /* L'administration devient une affectation : on retient l'ancien
       drapeau le temps de la migration, puis on l'efface. */
    if(p.isAdmin)q.wasAdmin=true;
    delete q.isAdmin;
    return q;
  });
  db.clubs=(db.clubs||[]).map(function(c){
    var q=Object.assign(mkClub(),c,{archived:!!c.archived});
    q.categories=cleanCategories(q.categories);
    if(!q.categories.length)q.categories=CATEGORIES_DEFAUT.slice();
    return q;
  });
  db.players=(db.players||[]).map(function(p){
    var q=Object.assign(mkDbPlayer(),p,{archived:!!p.archived});
    /* Une base d'avant la date complète ne porte que l'année : elle la
       garde. Une date reçue d'ailleurs redonne son année, pour que le
       dédoublonnage continue de s'y appuyer. */
    var b=parseBirth(q.birthDate||q.birthYear)||parseBirth(q.birthYear);
    if(b){q.birthDate=b.date;q.birthYear=b.year}
    else {q.birthDate="";q.birthYear=cleanNum(q.birthYear).slice(0,4)}
    return q;
  });
  db.teams=(db.teams||[]).map(function(t){return Object.assign(mkTeamRecord(),t,{freeView:!!t.freeView,archived:!!t.archived})});
  db.seasons=(db.seasons||[]).map(function(s){
    return Object.assign({id:uid(),name:"Saison",createdAt:nowISO(),startDate:"",endDate:"",
      notes:"",closedAt:null,archived:false},s);
  });

  /* ── v5 → v6 ────────────────────────────────────────────────
     Une base d'avant les clubs en tient un seul, implicite : on lui
     donne un nom et on y range ses équipes. Les administrateurs
     d'alors — reconnus à leur ancien drapeau isAdmin — en deviennent
     les administrateurs. La charte reste à signer par le propriétaire :
     un club hérité est valide, mais il n'a pas été créé par lui. */
  /* Une équipe appartient toujours à un club : s'il n'en existe aucun,
     c'est une base d'avant les clubs, quelle que soit sa version
     déclarée — les migrations plus anciennes passent aussi par ici. */
  if(db.teams.length&&!db.clubs.length){
    var club0=mkClub({name:"Mon club",charter:null,inherited:true});
    db.clubs.push(club0);
    db.teams.forEach(function(t){if(!t.clubId)t.clubId=club0.id});
    (db.people||[]).forEach(function(p){
      if(p.wasAdmin&&!p.revoked)
        db.clubAssignments.push(mkClubAssignment(p.id,club0.id,"admin"));
    });
  }
  if(db.clubs.length===1){
    /* Une équipe sans club rejoint le seul qui existe, plutôt que de
       devenir invisible. */
    db.teams.forEach(function(t){if(!t.clubId)t.clubId=db.clubs[0].id});
  }
  db.people.forEach(function(p){delete p.wasAdmin});

  var knownClubs={};db.clubs.forEach(function(c){knownClubs[c.id]=c});
  db.teams=db.teams.filter(function(t){return !t.clubId||knownClubs[t.clubId]});
  var knownPlayers={};db.players.forEach(function(p){knownPlayers[p.id]=true});
  var knownPeople={};db.people.forEach(function(p){knownPeople[p.id]=true});
  var knownTeams={};db.teams.forEach(function(t){knownTeams[t.id]=t});
  var knownSeasons={};db.seasons.forEach(function(x){knownSeasons[x.id]=true});

  /* Une affectation ne survit pas à la disparition de sa personne ou de
     son équipe : c'est une arête, elle tombe avec ses extrémités. */
  var seen={};
  db.assignments=(db.assignments||[]).filter(function(a){
    if(!a||!knownPeople[a.personId]||!knownTeams[a.teamId])return false;
    if(!ROLES[a.role])return false;
    var k=a.personId+"|"+a.teamId+"|"+a.role;
    if(seen[k])return false;
    seen[k]=1;return true;
  }).map(function(a){return Object.assign({id:uid(),createdAt:nowISO()},a)});

  /* Affectations de club : mêmes règles d'arête. */
  var vus={};
  db.clubAssignments=(db.clubAssignments||[]).filter(function(a){
    if(!a||!knownPeople[a.personId]||!knownClubs[a.clubId])return false;
    if(!CLUB_ROLES[a.role])return false;
    var k=a.personId+"|"+a.clubId+"|"+a.role;
    if(vus[k])return false;
    vus[k]=1;return true;
  }).map(function(a){return Object.assign({id:uid(),createdAt:nowISO(),grant:null},a)});

  db.squads=(db.squads||[]).filter(function(sq){
    return sq&&knownTeams[sq.teamId]&&knownSeasons[sq.seasonId];
  }).map(function(sq){
    var out=normalizeSquad(sq,knownPlayers);
    var t=knownTeams[out.teamId];
    /* Copies rafraîchies depuis l'équipe durable — jamais la source. */
    out.name=t.name;out.category=t.category;out.freeView=!!t.freeView;
    return out;
  });

  if(!db.seasons.length)db.seasons.push(mkSeason());
  if(!db.seasons.some(function(x){return x.id===db.activeSeasonId}))db.activeSeasonId=db.seasons[0].id;
  return db;
}

/* ── Migration v3 → v4 ──────────────────────────────────────
   season.teams[i] devient une équipe durable plus un squad. Les
   campagnes, jusque-là portées par la saison, descendent dans chaque
   squad : chaque équipe mène désormais ses propres campagnes. */
function migrateV3(old){
  var db=emptyDB();
  db.players=(old.players||[]).slice();
  /* Les versions d'avant les rôles n'avaient pas de personnes. On crée le
     propriétaire sans le nommer : l'écran de garde demandera qui c'est. */
  var admin=mkPerson({name:""});
  admin.unclaimed=true;admin.isAdmin=true;   /* lu par la migration v5→v6 */
  db.people.push(admin);

  (old.seasons||[]).forEach(function(os){
    var season={id:os.id||uid(),name:os.name||"Saison",createdAt:os.createdAt||nowISO(),
      startDate:os.startDate||"",endDate:os.endDate||"",notes:os.notes||"",
      closedAt:os.closedAt||null,archived:!!os.archived};
    db.seasons.push(season);

    (os.teams||[]).forEach(function(ot){
      /* Une équipe portant déjà ce nom est réutilisée : c'est le même
         groupe d'une saison à l'autre. */
      var team=null;
      db.teams.forEach(function(t){if(t.name===(ot.name||"Équipe"))team=t});
      if(!team){
        /* Les bases d'avant les équipes durables rangeaient la catégorie
           sur la saison. Elle descend ici sur l'équipe, à qui elle
           appartient — c'est le seul endroit où `os.category` se lit
           encore, et une saison n'en porte plus. */
        team=mkTeamRecord({name:ot.name||"Équipe",category:os.category||""});
        db.teams.push(team);
        db.assignments.push(mkAssignment(admin.id,team.id,"coach"));
      }
      var sq=mkSquad(team.id,season.id,team.name);
      sq.category=team.category;
      sq.playerIds=(ot.playerIds||[]).slice();
      sq.lineup=(ot.lineup||[]).slice();
      sq.subteams=(ot.subteams||[]).slice();
      sq.stats=Object.assign({},ot.stats||{});
      sq.sessions=(ot.sessions||[]).slice();
      /* Roster, campagnes, vues et soumissions étaient au niveau saison :
         ils appartenaient en réalité à l'équipe qui les a produits. */
      sq.roster=clone(os.roster||[]);
      sq.campaigns=clone(os.campaigns||[]);
      sq.activeCampaignId=os.activeCampaignId||null;
      sq.selectorViews=clone((os.selectorViews||[]));
      sq.submissions=clone((os.submissions||[]));
      db.squads.push(sq);
    });
  });
  if(!db.teams.length){
    var t=mkTeamRecord({name:"Équipe A"});
    db.teams.push(t);
    db.assignments.push(mkAssignment(admin.id,t.id,"coach"));
  }
  if(!db.seasons.length)db.seasons.push(mkSeason());
  db.activeSeasonId=old.activeSeasonId||db.seasons[0].id;
  return db;
}

/* ── Migration v2 → v3 ─────────────────────────────────────── */
function migrateV2(old){
  var db={version:3,players:[],seasons:[],activeSeasonId:null};
  var c0=mkCampaign({kind:"tryout"});
  var season={id:uid(),name:"Saison "+new Date().getFullYear(),createdAt:nowISO(),
    category:"",startDate:"",endDate:"",notes:"",closedAt:null,archived:false,
    campaigns:[c0],activeCampaignId:c0.id,
    roster:[],teams:[],activeTeamId:null,selectorViews:[],submissions:[]};
  function mkV3Team(name){
    return {id:uid(),name:name||"Équipe",playerIds:[],lineup:[],subteams:[],stats:{},sessions:[]};
  }
  var byKey={};
  function ensurePlayer(name,number,position){
    var key=(name||"").trim().toLowerCase()+"#"+cleanNum(number);
    if(byKey[key])return byKey[key];
    var parts=(name||"").trim().split(/\s+/);
    var p=mkDbPlayer({firstName:parts.shift()||"",lastName:parts.join(" ")});
    db.players.push(p);byKey[key]=p.id;
    if(!rosterEntryIn(season,p.id)){
      var e=mkRosterEntry(p.id,number,position);e.status="selected";season.roster.push(e);
    }
    return p.id;
  }
  function rosterEntryIn(s,pid){for(var i=0;i<s.roster.length;i++)if(s.roster[i].playerId===pid)return s.roster[i];return null}

  (old.teams||[]).forEach(function(ot){
    var t=mkV3Team(ot.name||"Équipe");
    var idxToPid=[];
    (ot.players||[]).forEach(function(op,i){
      if(!op||!(op.name||"").trim()){idxToPid[i]=null;return}
      var pid=ensurePlayer(op.name,op.number,op.position);
      idxToPid[i]=pid;
      if(t.playerIds.indexOf(pid)===-1)t.playerIds.push(pid);
      t.stats[pid]=normStats(op.stats);
    });
    t.lineup=(ot.activePlayers||[]).map(function(i){return idxToPid[i]}).filter(Boolean);
    t.subteams=(ot.subteams||[]).map(function(st){
      return {id:st.id||uid(),name:st.name||"Sous-équipe",playerIds:(st.playerIndices||[]).map(function(i){return idxToPid[i]}).filter(Boolean)};
    });
    t.sessions=(ot.sessions||[]).map(function(os){
      return {id:uid(),name:os.name||"Session",date:os.date||nowISO(),teamName:t.name,
        entries:(os.players||[]).filter(function(op){return op&&(op.name||"").trim()}).map(function(op){
          var pid=ensurePlayer(op.name,op.number,op.position);
          if(t.playerIds.indexOf(pid)===-1)t.playerIds.push(pid);
          return {playerId:pid,name:(op.name||"").trim(),number:cleanNum(op.number),position:op.position||"",stats:normStats(op.stats)};
        })};
    });
    season.teams.push(t);
  });
  if(!season.teams.length)season.teams.push(mkV3Team("Équipe A"));
  season.activeTeamId=season.teams[0].id;
  db.seasons.push(season);db.activeSeasonId=season.id;
  return db;
}
/* ── Migration v1 (clés brutes) → structure v2 ─────────────── */
function readLegacyV1(){
  try{
    var oldS=localStorage.getItem("vball_sessions_v5"),oldC=localStorage.getItem("vball_current_v5");
    if(!oldS&&!oldC)return null;
    return {teams:[{id:uid(),name:"Mon équipe",players:oldC?JSON.parse(oldC):[],sessions:oldS?JSON.parse(oldS):[],activePlayers:[],subteams:[]}]};
  }catch(e){return null}
}

function loadAll(fromVault){
  try{
    var raw=fromVault?"vault":localStorage.getItem(SK);
    if(raw){
      var parsed=fromVault?fromVault.db:JSON.parse(raw);
      if(fromVault&&fromVault.inbox)INBOX=fromVault.inbox;
      if(fromVault&&fromVault.secrets)SECRETS=Object.assign({github:null,superKey:null},fromVault.secrets);
      /* Chaîne de migration : v1 → v2 → v3 → v4, sans perte à chaque étape. */
      /* v4 → v5 se fait dans normalizeDB : les sessions orphelines y sont
         rattachées à une rencontre déduite de leur nom. */
      DB=normalizeDB((parsed.version>=4)?parsed:migrateV3(parsed));
      if(parsed.version<6)setTimeout(function(){showToast("✅ Données migrées vers la v6")},400);
    } else {
      var legacy=null;
      for(var i=0;i<LEGACY_KEYS.length&&!legacy;i++){
        var d=localStorage.getItem(LEGACY_KEYS[i]);
        if(d)legacy=JSON.parse(d);
      }
      if(!legacy)legacy=readLegacyV1();
      DB=legacy?normalizeDB(migrateV3(migrateV2(legacy))):emptyDB();
      if(legacy)setTimeout(function(){showToast("✅ Données migrées vers la v6")},400);
    }
  }catch(e){DB=emptyDB()}

  /* Un club a toujours au moins une saison, une équipe et un administrateur :
     sans quoi l'application n'offrirait aucun point d'entrée. */
  if(!DB.seasons.length)DB.seasons.push(mkSeason());
  if(!DB.seasons.some(function(x){return x.id===DB.activeSeasonId}))DB.activeSeasonId=DB.seasons[0].id;
  /* Ni administrateur ni équipe fabriqués d'office : les inventer ici
     revenait à donner l'administration à quiconque ouvrait la page, et
     l'appareil d'un sélectionneur n'a aucune raison d'en recevoir un. */

  try{
    if(!fromVault){var ib=localStorage.getItem(SK_INBOX);if(ib)INBOX=JSON.parse(ib)}
    INBOX.views=(INBOX.views||[]).map(function(v){return Object.assign(mkSelectorView(),v)});
  }catch(e){INBOX={views:[]}}
  try{
    var ui=localStorage.getItem(SK_UI);
    if(ui){var o=JSON.parse(ui);
      if(o.meId&&personById(o.meId))state.meId=o.meId;
      if(o.ctx)state.ctx=o.ctx;
      if(o.viewIdx!=null)state.viewIdx=Math.max(0,Math.min(VIEWS.length-1,o.viewIdx));
      if(o.posFilter)state.posFilter=o.posFilter;
      if(o.inputMode)state.inputMode=o.inputMode;
      if(o.svViewId)state.svViewId=o.svViewId;
      if(o.tab)state.tab=o.tab;
    }
  }catch(e){}

  /* Aucune identité n'est attribuée d'office : ouvrir l'application ne
     donne pas l'administration. Celle-ci se réclame à l'inscription, et
     le coffre en tient la clé. Une base déjà installée garde la sienne :
     on ne met personne dehors de ses propres données. */
  if(!state.meId||!personById(state.meId)){
    state.meId=DB.enrolledId&&personById(DB.enrolledId)?DB.enrolledId:null;
  }
  normalizeCtx();
  if(!tabsForCtx().some(function(t){return t.key===state.tab}))state.tab=(tabsForCtx()[0]||{}).key||"season";
}

/* ══ UNDO ══════════════════════════════════════════════════════
   Instantané ciblé : { kind, payload } — restaure exactement la
   portion de modèle touchée, sans dépendre d'un index. */
var undoStack=[],MAX_UNDO=60;
function pushUndoStats(label){
  var t=curTeam();if(!t)return;
  undoStack.push({label:label,kind:"teamStats",teamId:t.id,data:clone(t.stats)});
  trimUndo();
}
function pushUndoView(label,view){
  if(!view)return;
  undoStack.push({label:label,kind:"viewData",viewId:view.id,data:clone(view.data)});
  trimUndo();
}
function trimUndo(){
  if(undoStack.length>MAX_UNDO)undoStack.shift();
  var b=document.getElementById("undoBtn");if(b)b.disabled=false;
}
function clearUndo(){undoStack=[]}
function doUndo(){
  if(!undoStack.length){showToast("Rien à annuler");return}
  var snap=undoStack.pop();
  if(snap.kind==="teamStats"){
    var t=null;
    DB.squads.forEach(function(x){if(x.id===snap.teamId)t=x});
    if(t)t.stats=snap.data;
  } else if(snap.kind==="viewData"){
    var v=findViewAnywhere(snap.viewId);
    if(v)v.data=snap.data;
  }
  scheduleAutoSave();showToast("↩ Annulé : "+snap.label);render();
}
function findViewAnywhere(id){
  for(var i=0;i<DB.seasons.length;i++){var v=viewById(DB.seasons[i],id);if(v)return v}
  for(var j=0;j<INBOX.views.length;j++)if(INBOX.views[j].id===id)return INBOX.views[j];
  return null;
}

/* ══ CUMULS & COMPILATION ══════════════════════════════════════ */
/* Cumul des sessions d'une équipe, agrégé par playerId (identité stable) */
var CUMUL_SCOPES=[{k:"all",l:"Toute la saison"},{k:"last3",l:"3 derniers"},{k:"last5",l:"5 derniers"},{k:"last10",l:"10 derniers"}];
/* Trois filtres qui se composent : combien de matchs, de quelle nature,
   et éventuellement un événement précis. Les sessions sont empilées les
   plus récentes en tête (unshift à l'enregistrement). */
function scopedSessions(team){
  if(!team)return [];
  var list=team.sessions;
  if(state.cumulEventId)list=list.filter(function(se){return se.eventId===state.cumulEventId});
  else if(state.cumulKind!=="all")list=list.filter(function(se){
    var ev=eventOf(team,se);return ev&&ev.kind===state.cumulKind;
  });
  var n={all:0,last3:3,last5:5,last10:10}[state.cumulScope]||0;
  return n?list.slice(0,n):list;
}
function cumulScopeLabel(team){
  if(state.cumulEventId){
    var ev=eventById(team,state.cumulEventId);
    return ev?eventLabel(ev):"Événement";
  }
  var k=state.cumulKind!=="all"?(EVENT_KINDS[state.cumulKind]||{}).label:"Toutes natures";
  var sc=CUMUL_SCOPES.filter(function(x){return x.k===state.cumulScope})[0];
  return k+" · "+(sc?sc.l.toLowerCase():"");
}
function computeGlobalPlayers(team){
  var season=team;if(!team||!team.sessions.length)return [];
  var map={};
  scopedSessions(team).forEach(function(sess){
    sess.entries.forEach(function(en){
      if(!hasStats(en.stats))return;
      var m=map[en.playerId];
      if(!m){
        var p=playerById(en.playerId),e=rosterEntry(season,en.playerId);
        m=map[en.playerId]={id:en.playerId,name:p?fullName(p):(en.name||"Joueuse"),
          number:(e&&e.number)||en.number,position:(e&&e.position)||en.position,
          stats:emptyS(),sessCount:0};
      }
      addStats(m.stats,en.stats);m.sessCount++;
    });
  });
  return Object.keys(map).map(function(k){return map[k]});
}

/* ── Campagnes ─────────────────────────────────────────────── */
function campaignById(squad,id){
  if(!squad)return null;
  for(var i=0;i<squad.campaigns.length;i++)if(squad.campaigns[i].id===id)return squad.campaigns[i];
  return null;
}
function curCampaign(squad){
  squad=squad||curSquad();if(!squad)return null;
  return campaignById(squad,squad.activeCampaignId)||squad.campaigns[squad.campaigns.length-1]||null;
}
function campaignLabel(c){
  if(!c)return "—";
  var k=KIND_BY_KEY[c.kind]||KIND_BY_KEY.custom;
  return k.icon+" "+c.name;
}
function campaignOpen(squad,c){
  return !!c && !c.closedAt && !seasonClosed(squad);
}
/* Accepte indifféremment une saison ou un squad : dans les deux cas la
   question est « la saison est-elle close ? ». */
function seasonClosed(x){
  if(!x)return false;
  var s=x.seasonId?seasonById(x.seasonId):x;
  return !!(s&&(s.closedAt||s.archived));
}
function campaignSubs(squad,campaignId){
  if(!squad)return [];
  return squad.submissions.filter(function(sub){return !campaignId||sub.campaignId===campaignId});
}
function campaignViews(squad,campaignId){
  if(!squad)return [];
  return squad.selectorViews.filter(function(v){return !campaignId||v.campaignId===campaignId});
}
/* Une joueuse compte dans l'effectif courant si elle est retenue et pas partie */
function isInSquad(entry){return entry&&entry.status==="selected"&&entry.membership!=="left"}

/* ── Rencontres ────────────────────────────────────────────── */
function eventById(squad,id){
  if(!squad)return null;
  for(var i=0;i<squad.events.length;i++)if(squad.events[i].id===id)return squad.events[i];
  return null;
}
function eventOf(squad,session){return eventById(squad,session&&session.eventId)}
function sessionsOfEvent(squad,eventId){
  return squad.sessions.filter(function(se){return se.eventId===eventId});
}
/* Les événements du plus récent au plus ancien, chacun avec ses matchs. */
function eventsWithSessions(squad){
  if(!squad)return [];
  return squad.events.map(function(ev){
    var ss=sessionsOfEvent(squad,ev.id);
    return {event:ev,sessions:ss,
      stats:ss.reduce(function(acc,se){
        se.entries.forEach(function(en){addStats(acc,en.stats)});return acc;},emptyS()),
      bilan:ss.reduce(function(acc,se){
        var o=resultOutcome(se.result);
        if(o)acc[o]=(acc[o]||0)+1;
        return acc;},{})};
  }).filter(function(x){return x.sessions.length})
    .sort(function(a,b){return String(b.event.date).localeCompare(String(a.event.date))});
}
function eventLabel(ev){
  if(!ev)return "Rencontre";
  var k=EVENT_KINDS[ev.kind]||EVENT_KINDS.league;
  return k.icon+" "+(ev.name||k.label);
}
/* Bilan victoires/défaites, éventuellement restreint à une nature. */
function squadRecord(squad,kind){
  var out={win:0,loss:0,draw:0,sans:0};
  (squad?squad.sessions:[]).forEach(function(se){
    var ev=eventOf(squad,se);
    if(kind&&(!ev||ev.kind!==kind))return;
    var o=resultOutcome(se.result);
    if(o)out[o]++;else out.sans++;
  });
  return out;
}
/* Les squads où une joueuse est convoquée — la mesure de sa présence au club. */
function squadsOf(pid){return DB.squads.filter(function(sq){return !!rosterEntry(sq,pid)})}

/* Une entrée ne porte de l'information que si le sélectionneur y a réellement touché */
function dataFilled(d){
  if(!d)return false;
  if(d.reco)return true;
  if(d.pos)return true;
  if((d.note||"").trim())return true;
  if(hasStats(d.stats))return true;
  return CRITERIA.some(function(c){return (d.ratings||{})[c.key]>0});
}

/* Compilation multi-sélectionneurs : une entrée par joueuse réellement évaluée.
   campaignId absent ou null → toutes campagnes confondues ; sinon la campagne
   nommée seule, ce qui est la seule lecture ayant du sens pour un bilan daté.

   Le score se construit en cinq temps, et chacun corrige un travers que la
   moyenne simple laissait passer :
     1. on recueille les notes brutes, par sélectionneur ;
     2. on mesure la sévérité propre à chacun, sur les athlètes que
        plusieurs ont vues, et on la retire ;
     3. on moyenne les critères, pondérés ;
     4. on note les statistiques relevées, situées dans la campagne ;
     5. on mélange les deux, puis on amortit ce qui ne repose que sur un
        seul regard.
   Chaque étape est retenue dans `detail`, pour que l'écran puisse montrer
   d'où vient le chiffre plutôt que de l'asséner. */
function compileSubmissions(squad,campaignId){
  var out={};
  if(!squad)return out;
  var sc=scoringOf(squad);
  function bucket(pid){
    if(!out[pid])out[pid]={playerId:pid,n:0,nRatings:0,nReco:0,stats:emptyS(),ratings:{},
      reco:{select:0,recall:0,cut:0},topReco:null,
      pos:emptyPos(),posVotes:0,topPos:null,score:0,notes:[],selectors:[],
      statScore:null,critScore:null,rawScore:0,statFams:{},
      avis:{},recoTie:false,numeros:[],
      detail:{severity:0,shrink:0,statShare:0}};
    return out[pid];
  }

  /* ── 1. les notes brutes, gardées par sélectionneur ─────────── */
  var brut=[];          /* {who, pid, crit, val} */
  squad.submissions.forEach(function(sub){
    if(campaignId&&sub.campaignId!==campaignId)return;
    var who=(sub.selectorName||"").trim()||sub.viewName||"Sélectionneur";
    sub.entries.forEach(function(e){
      if(!dataFilled(e))return;          // athlète non observée : n'entre pas dans les moyennes
      var b=bucket(e.playerId);
      b.n++;
      /* Le numéro porté ce jour-là. En sélection c'est un dossard, que
         l'athlète rendra en sortant du gymnase : il n'a rien à voir avec
         le maillot qu'elle portera la saison durant. Le garder est ce qui
         permet de relire « la 14 » dans un commentaire six mois plus tard. */
      var num=cleanNum(e.number);
      if(num&&b.numeros.indexOf(num)===-1)b.numeros.push(num);
      addStats(b.stats,e.stats);
      /* Une saisie n'est pas une note. Un coach de drill qui ne remplit que
         des compteurs ne doit ni gonfler le nombre de notes, ni peser sur
         le dénominateur des avis — sans quoi « 1/2 » ferait croire à un
         désaccord là où une seule personne s'est prononcée. */
      var aNote=false;
      CRITERIA.forEach(function(c){
        var v=e.ratings&&e.ratings[c.key];
        if(typeof v!=="number"||v<1)return;
        aNote=true;
        brut.push({who:who,pid:e.playerId,crit:c.key,val:v});
      });
      if(aNote)b.nRatings++;
      /* Un avis est une décision, pas une observation : quand le même
         évaluateur revoit une athlète dans la même campagne — deux séances
         de pratique, par exemple — sa seconde parole remplace la première.
         Les notes et les compteurs, eux, s'additionnent : ce sont des
         observations, et deux séances valent mieux qu'une. */
      var quand=String(sub.submittedAt||"");
      var a=b.avis[who]||(b.avis[who]={reco:"",recoAt:"",pos:"",posAt:""});
      /* Recommandation et poste sont deux avis distincts : celui qui se
         prononce sur le poste en septembre et seulement sur la sélection
         en octobre ne doit pas voir son premier avis effacé par le second. */
      if(e.reco&&quand>=a.recoAt){a.reco=e.reco;a.recoAt=quand}
      if(e.pos&&quand>=a.posAt){a.pos=e.pos;a.posAt=quand}
      if((e.note||"").trim())b.notes.push({by:who,at:sub.submittedAt,text:e.note.trim()});
      if(b.selectors.indexOf(who)===-1)b.selectors.push(who);
    });
  });

  /* ── 2. la sévérité de chacun ───────────────────────────────
     On ne compare pas un sélectionneur à la moyenne générale : celui qui
     n'a vu que les meilleures aurait l'air complaisant. On le compare à ce
     que les autres ont mis aux mêmes athlètes, sur les mêmes critères.
     Le biais est amorti quand il repose sur peu de recoupements, et borné :
     une estimation fragile ne doit jamais retourner un classement. */
  var biais={};
  if(sc.severity){
    var parCle={};      /* athlète+critère → [{who,val}] */
    brut.forEach(function(r){
      var k=r.pid+"|"+r.crit;
      (parCle[k]=parCle[k]||[]).push(r);
    });
    var ecarts={};
    Object.keys(parCle).forEach(function(k){
      var lot=parCle[k];
      var noms={};lot.forEach(function(r){noms[r.who]=1});
      if(Object.keys(noms).length<2)return;      // rien à recouper
      lot.forEach(function(r){
        var autres=lot.filter(function(x){return x.who!==r.who});
        if(!autres.length)return;
        var moy=autres.reduce(function(t,x){return t+x.val},0)/autres.length;
        (ecarts[r.who]=ecarts[r.who]||[]).push(r.val-moy);
      });
    });
    Object.keys(ecarts).forEach(function(who){
      var lot=ecarts[who],k=lot.length;
      var moy=lot.reduce(function(t,v){return t+v},0)/k;
      var amorti=moy*(k/(k+5));                  // peu de recoupements → peu de correction
      biais[who]=Math.max(-1.5,Math.min(1.5,amorti));
    });
    /* Recentrage. Sans lui, la correction déplacerait le niveau général :
       un évaluateur qui note seul quatre critères verrait ceux-ci baisser
       d'un biais mesuré sur le cinquième, et le score cesserait d'être
       comparable d'une campagne à l'autre. On répartit donc les biais
       autour de zéro, au prorata du nombre de notes de chacun — ce qui
       corrige les écarts entre évaluateurs sans toucher à l'échelle. */
    var parQui={};
    brut.forEach(function(r){parQui[r.who]=(parQui[r.who]||0)+1});
    var sommeP=0,total=0;
    Object.keys(biais).forEach(function(who){
      var n=parQui[who]||0;sommeP+=n*biais[who];total+=n;
    });
    if(total){
      var centre=sommeP/total;
      Object.keys(biais).forEach(function(who){biais[who]-=centre});
    }
  }

  /* ── 3. les critères, corrigés puis pondérés ────────────────── */
  brut.forEach(function(r){
    var b=out[r.pid];
    var v=r.val-(biais[r.who]||0);
    v=Math.max(1,Math.min(RATING_MAX,v));
    var rr=b.ratings[r.crit]||(b.ratings[r.crit]={sum:0,n:0,min:r.val,max:r.val,avg:0,rawSum:0});
    rr.sum+=v;rr.rawSum+=r.val;rr.n++;
    /* min et max restent les notes telles qu'elles ont été mises : la
       correction de sévérité ajuste la moyenne, elle n'efface pas le
       désaccord. « 4,5 (3–5) » dit le résultat et la divergence ; un
       « 4,5 (4,5–4,5) » laisserait croire à une unanimité qui n'existe pas. */
    rr.min=Math.min(rr.min,r.val);rr.max=Math.max(rr.max,r.val);
  });

  /* ── 4. les statistiques relevées, situées dans la campagne ───
     L'efficacité de chaque famille est d'abord calculée pour toutes les
     athlètes, puis chacune est notée par rapport à la distribution du
     moment : c'est la seule échelle qui vaille pour une catégorie d'âge
     donnée, et elle ne suppose aucun barème importé d'ailleurs. */
  var pids=Object.keys(out);
  var dist={};
  FAMILY_KEYS.forEach(function(f){
    var vals=[];
    pids.forEach(function(pid){
      var b=out[pid],vol=familyVolume(b.stats,f);
      if(vol>=sc.minVolume){
        var e=familyEff(b.stats,f);
        if(e!=null){b.statFams[f]={eff:e,volume:vol,scale:null};vals.push(e)}
      } else if(vol>0){
        b.statFams[f]={eff:familyEff(b.stats,f),volume:vol,scale:null,tropPeu:true};
      }
    });
    if(!vals.length)return;
    var moy=vals.reduce(function(t,v){return t+v},0)/vals.length;
    var varc=vals.reduce(function(t,v){return t+(v-moy)*(v-moy)},0)/vals.length;
    dist[f]={moyenne:moy,ecart:Math.sqrt(varc),n:vals.length};
  });
  pids.forEach(function(pid){
    var b=out[pid];
    FAMILY_KEYS.forEach(function(f){
      var fam=b.statFams[f];
      if(!fam||fam.tropPeu||!dist[f])return;
      fam.scale=effToScale(fam.eff,dist[f].moyenne,dist[f].ecart);
    });
  });

  /* ── 5. le score, et ce qui l'a formé ───────────────────────── */
  pids.forEach(function(pid){
    var b=out[pid];
    /* critères */
    var tot=0,poids=0;
    CRITERIA.forEach(function(c){
      var r=b.ratings[c.key];
      if(!r||!r.n)return;
      r.avg=r.sum/r.n;
      r.rawAvg=r.rawSum/r.n;
      var w=sc.critWeights[c.key];
      if(w>0){tot+=w*r.avg;poids+=w}
    });
    b.critScore=poids?tot/poids:null;
    /* statistiques */
    var st=0,sp=0;
    FAMILY_KEYS.forEach(function(f){
      var fam=b.statFams[f];
      if(!fam||fam.scale==null)return;
      var w=sc.statWeights[f];
      if(w>0){st+=w*fam.scale;sp+=w}
    });
    b.statScore=sp?st/sp:null;
    /* mélange : la part des statistiques ne s'applique que si les deux
       existent ; sinon celle qui est là porte le score entière. */
    var part=(b.critScore!=null&&b.statScore!=null)?sc.statShare:(b.statScore!=null?1:0);
    b.detail.statShare=part;
    if(b.critScore==null&&b.statScore==null)b.rawScore=0;
    else if(b.critScore==null)b.rawScore=b.statScore;
    else if(b.statScore==null)b.rawScore=b.critScore;
    else b.rawScore=(1-part)*b.critScore+part*b.statScore;
    b.score=b.rawScore;
  });

  /* Amortissement : un score tiré d'un seul regard est ramené vers la
     moyenne du groupe, à proportion du peu sur quoi il repose. Une athlète
     vue une fois cesse ainsi de coiffer celles que trois personnes ont
     jugées. La moyenne de référence est celle des athlètes notées. */
  if(sc.reliability>0){
    var somme=0,pds=0;
    pids.forEach(function(pid){
      var b=out[pid];
      if(!b.nRatings||b.critScore==null&&b.statScore==null)return;
      somme+=b.rawScore*b.nRatings;pds+=b.nRatings;
    });
    if(pds){
      var refer=somme/pds;
      pids.forEach(function(pid){
        var b=out[pid],n=b.nRatings;
        if(!n)return;
        var avant=b.rawScore;
        b.score=(n*b.rawScore+sc.reliability*refer)/(n+sc.reliability);
        b.detail.shrink=b.score-avant;
        b.detail.reference=refer;
      });
    }
  }

  /* Ce que la correction de sévérité a déplacé, athlète par athlète. */
  pids.forEach(function(pid){
    var b=out[pid],d=0,k=0;
    CRITERIA.forEach(function(c){
      var r=b.ratings[c.key];
      if(r&&r.n){d+=(r.avg-r.rawAvg);k++}
    });
    b.detail.severity=k?d/k:0;

    /* Dépouillement : une voix par évaluateur, la dernière qu'il a donnée. */
    var derniers=[];
    Object.keys(b.avis).forEach(function(who){derniers.push(b.avis[who])});
    derniers.forEach(function(a){
      if(a.reco&&b.reco[a.reco]!=null){b.reco[a.reco]++;b.nReco++}
      if(a.pos&&b.pos[a.pos]!=null){b.pos[a.pos]++;b.posVotes++}
    });
    /* À égalité, c'est l'avis le plus récent qui l'emporte — et l'écran le
       signale, plutôt que de laisser croire à une majorité qui n'existe pas. */
    var best=null,exaequo=false;
    ["select","recall","cut"].forEach(function(x){
      if(!b.reco[x])return;
      if(best===null||b.reco[x]>b.reco[best]){best=x;exaequo=false}
      else if(b.reco[x]===b.reco[best])exaequo=true;
    });
    if(exaequo){
      var tard=null;
      derniers.forEach(function(a){
        if(a.reco&&b.reco[a.reco]===b.reco[best]&&(!tard||a.recoAt>tard.recoAt))tard=a;
      });
      if(tard&&tard.reco)best=tard.reco;
    }
    b.topReco=best;b.recoTie=exaequo;
    var bestPos=null;
    POS_KEYS.forEach(function(x){if(b.pos[x]>0&&(bestPos===null||b.pos[x]>b.pos[bestPos]))bestPos=x});
    b.topPos=bestPos;
  });
  return out;
}
/* Progression d'une joueuse entre deux campagnes : delta global et par critère.
   C'est la lecture que la moyenne toutes-campagnes rendait impossible. */
function compareCampaigns(squad,fromId,toId){
  var a=compileSubmissions(squad,fromId),b=compileSubmissions(squad,toId);
  var ids={};Object.keys(a).forEach(function(k){ids[k]=1});Object.keys(b).forEach(function(k){ids[k]=1});
  return Object.keys(ids).map(function(pid){
    var ca=a[pid],cb=b[pid];
    var crits={};
    CRITERIA.forEach(function(c){
      var ra=ca&&ca.ratings[c.key],rb=cb&&cb.ratings[c.key];
      crits[c.key]={from:ra&&ra.n?ra.avg:null,to:rb&&rb.n?rb.avg:null,
        delta:(ra&&ra.n&&rb&&rb.n)?(rb.avg-ra.avg):null};
    });
    return {playerId:pid,
      from:ca?ca.score:null,to:cb?cb.score:null,
      delta:(ca&&cb&&ca.n&&cb.n)?(cb.score-ca.score):null,
      nFrom:ca?ca.n:0,nTo:cb?cb.n:0,criteria:crits};
  }).sort(function(x,y){
    if(x.delta==null&&y.delta==null)return (y.to||0)-(x.to||0);
    if(x.delta==null)return 1;
    if(y.delta==null)return -1;
    return y.delta-x.delta;
  });
}
function deltaColor(d){
  if(d==null)return "#64748B";
  if(d>=0.5)return "#10B981";
  if(d>0.05)return "#84CC16";
  if(d<-0.5)return "#EF4444";
  if(d<-0.05)return "#F59E0B";
  return "#64748B";
}
function fmtDelta(d){
  if(d==null)return "—";
  var v=(d>=0?"+":"")+d.toFixed(1);
  return v;
}

/* ─── La sélection comme point de départ ─────────────────────
   Ce que les évaluateurs ont compté le jour de la sélection n'est pas un
   souvenir : c'est la première mesure de l'athlète, celle à laquelle tout
   le reste de la saison se compare. Les volumes n'ont rien de comparable
   — une séance contre vingt matchs — mais les efficacités, si. */
function selectionCampaign(squad){
  if(!squad||!squad.campaigns||!squad.campaigns.length)return null;
  var t=null;
  squad.campaigns.forEach(function(c){if(!t&&c.kind==="tryout")t=c});
  return t||squad.campaigns[0];
}
function selectionBaseline(squad,pid){
  var c=selectionCampaign(squad);
  if(!c)return null;
  var comp=compileSubmissions(squad,c.id)[pid];
  if(!comp||!sumStats(comp.stats))return null;
  return {campaign:c,stats:comp.stats,
          score:comp.nRatings?comp.score:null,
          profile:statProfile(comp.stats)};
}
/* Famille par famille : où elle en était, où elle en est, et l'écart.
   Une famille absente d'un côté se lit « — » plutôt que zéro : ne pas
   avoir servi n'est pas avoir mal servi. */
function baselineCompare(squad,pid,minVolume){
  var base=selectionBaseline(squad,pid);
  if(!base)return null;
  var saison=playerSeasonStats(squad,pid);
  var seuil=minVolume||1;
  var lignes=[];
  FAMILY_KEYS.forEach(function(f){
    var vb=familyVolume(base.stats,f),vs=familyVolume(saison.stats,f);
    if(!vb&&!vs)return;
    var eb=vb>=seuil?familyEff(base.stats,f):null;
    var es=vs>=seuil?familyEff(saison.stats,f):null;
    lignes.push({family:f,
      fromEff:eb,fromVol:vb,toEff:es,toVol:vs,
      delta:(eb!=null&&es!=null)?(es-eb):null});
  });
  return {campaign:base.campaign,sessions:saison.sessions,lignes:lignes};
}

/* Cumul de match d'une joueuse sur toute la saison, toutes équipes confondues.
   Sert la fiche joueuse : le quantitatif que la compilation d'évaluations ignore. */
function playerSeasonStats(squad,pid){
  var out={stats:emptyS(),sessions:0,teams:[],byKind:{},record:{win:0,loss:0,draw:0}};
  if(!squad)return out;
  /* Une athlète peut jouer dans plusieurs équipes d'une même saison
     (surclassement, dépannage) : on additionne tous les squads de la saison. */
  DB.squads.forEach(function(sq){
    if(sq.seasonId!==squad.seasonId)return;
    var n=0;
    sq.sessions.forEach(function(se){
      var joue=false;
      se.entries.forEach(function(en){
        if(en.playerId!==pid||!hasStats(en.stats))return;
        joue=true;
        addStats(out.stats,en.stats);n++;
        var ev=eventOf(sq,se),k=(ev&&ev.kind)||"league";
        if(!out.byKind[k])out.byKind[k]={stats:emptyS(),sessions:0,record:{win:0,loss:0,draw:0}};
        addStats(out.byKind[k].stats,en.stats);
        out.byKind[k].sessions++;
        var o=resultOutcome(se.result);
        if(o){out.byKind[k].record[o]++;out.record[o]++}
      });
      if(joue)return;
    });
    if(n){out.sessions+=n;out.teams.push({name:sq.name,sessions:n})}
  });
  return out;
}

function scoreColor(s){
  if(s>=4.2)return "#10B981";
  if(s>=3.4)return "#84CC16";
  if(s>=2.6)return "#F59E0B";
  if(s>0)return "#EF4444";
  return "#475569";
}

/* ══ IMPORT / EXPORT ═══════════════════════════════════════════ */
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText)
    return navigator.clipboard.writeText(txt).catch(function(){});
  return Promise.resolve();
}
function downloadText(filename,txt){
  try{
    var blob=new Blob([txt],{type:"application/json"});
    var u=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=u;a.download=filename;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u)},1000);
  }catch(e){showToast("⚠️ Téléchargement impossible")}
}
function downloadJSON(obj,filename){
  try{
    var blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
    var u=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=u;a.download=filename;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u)},1000);
    return true;
  }catch(e){showToast("⚠️ Export impossible");return false}
}
function pickJSON(cb){
  var input=document.createElement("input");input.type="file";input.accept=".json,application/json";
  input.onchange=function(e){
    var file=e.target.files&&e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{cb(JSON.parse(ev.target.result),file.name)}
      catch(err){showToast("⚠️ Fichier illisible")}
    };
    reader.onerror=function(){showToast("⚠️ Lecture impossible")};
    reader.readAsText(file);
  };
  input.click();
}
function stamp(){return new Date().toISOString().slice(0,10)}
function safeName(s){return String(s||"").replace(/[^\w\-]+/g,"_").slice(0,40)||"export"}

/* Export limité à une équipe : un entraîneur n'emporte pas les données
   de ses collègues (constat R6). */
function exportMyTeam(){
  var squad=curSquad(),team=curTeamRecord();
  if(!squad||!team){showToast("⚠️ Aucune équipe");return}
  var pids={};squad.roster.forEach(function(e){pids[e.playerId]=1});
  var payload={type:"wonderstats-team",version:5,exportDate:nowISO(),
    team:clone(team),
    seasons:DB.seasons.filter(function(x){return x.id===squad.seasonId}).map(clone),
    squads:[clone(squad)],
    players:DB.players.filter(function(p){return pids[p.id]}).map(clone),
    log:DB.log.filter(function(l){return l.teamId===squad.teamId}).map(clone)};
  if(downloadJSON(payload,"Equipe_"+safeName(team.name)+"_"+stamp()+".json"))
    showToast("📤 Équipe exportée");
}

/* Sauvegarde complète du club — réservée à l'administration */
function exportBackup(){
  if(downloadJSON({type:"wonderstats-backup",version:5,exportDate:nowISO(),db:DB},
    "WonderStats_"+stamp()+".json")) showToast("📤 Sauvegarde exportée");
}
function importBackup(){
  pickJSON(function(data){
    var incoming=null;
    if(data&&data.type==="wonderstats-backup"&&data.db){
      var db=clone(data.db);
      incoming=normalizeDB(db.version>=4?db:migrateV3(db));
    }
    else if(data&&data.type==="wonderstats-team")incoming=normalizeDB(teamExportToDB(clone(data)));
    else if(data&&data.version>=4&&data.squads)incoming=normalizeDB(clone(data));
    else if(data&&data.version===3&&data.seasons)incoming=normalizeDB(migrateV3(clone(data)));
    else if(data&&Array.isArray(data.teams))incoming=normalizeDB(migrateV3(migrateV2(data)));
    else if(data&&(data.currentPlayers||data.sessions))
      incoming=normalizeDB(migrateV3(migrateV2({teams:[{id:uid(),name:"Import",players:data.currentPlayers||[],sessions:data.sessions||[]}]})));
    if(!incoming){showToast("⚠️ Format non reconnu");return}
    if(!confirmAct("Fusionner "+plural(incoming.teams.length,"équipe")+" et "+
      plural(incoming.players.length,"joueuse")+" avec les données actuelles ?"))return;
    mergeDB(incoming);
    normalizeCtx();saveNow();showToast("📥 Import terminé");render();
  });
}
/* Un export d'équipe est un club minuscule : une équipe, une saison. */
function teamExportToDB(data){
  var db=emptyDB();
  db.players=(data.players||[]).slice();
  db.teams=(data.team?[data.team]:[]);
  db.seasons=(data.seasons||[]).slice();
  db.squads=(data.squads||[]).slice();
  db.log=(data.log||[]).slice();
  db.activeSeasonId=db.seasons.length?db.seasons[0].id:null;
  return db;
}
/* Fusion : les joueuses sont dédoublonnées sur id, sinon sur nom + année ;
   les équipes sur id, sinon sur nom. */
function mergeDB(inc){
  var byId={},byName={};
  DB.players.forEach(function(p){byId[p.id]=p;byName[nameKey(p)]=p});
  var remap={};
  inc.players.forEach(function(p){
    if(byId[p.id]){remap[p.id]=p.id;return}
    var ex=byName[nameKey(p)];
    if(ex){
      /* L'existant fait foi — mais une fiche incomplète se complète : un
         export venu d'un autre appareil peut porter le jour de naissance
         que la nôtre n'a jamais eu. Jamais d'écrasement : le
         dédoublonnage s'est fait sur l'année, les deux s'accordent. */
      if(!ex.birthDate&&p.birthDate)ex.birthDate=p.birthDate;
      remap[p.id]=ex.id;return;
    }
    DB.players.push(p);byId[p.id]=p;byName[nameKey(p)]=p;remap[p.id]=p.id;
  });
  function rp(id){return remap[id]||id}

  var teamRemap={},teamById_={},teamByName={};
  DB.teams.forEach(function(t){teamById_[t.id]=t;teamByName[t.name.toLowerCase()]=t});
  inc.teams.forEach(function(t){
    if(teamById_[t.id]){teamRemap[t.id]=t.id;return}
    var ex=teamByName[(t.name||"").toLowerCase()];
    if(ex){teamRemap[t.id]=ex.id;return}
    DB.teams.push(t);teamById_[t.id]=t;teamByName[(t.name||"").toLowerCase()]=t;teamRemap[t.id]=t.id;
  });
  function rt(id){return teamRemap[id]||id}

  var seasonRemap={},seasonByName={};
  DB.seasons.forEach(function(x){seasonByName[x.name.toLowerCase()]=x});
  inc.seasons.forEach(function(x){
    var ex=null;
    DB.seasons.forEach(function(y){if(y.id===x.id)ex=y});
    if(!ex)ex=seasonByName[(x.name||"").toLowerCase()]||null;
    if(ex){seasonRemap[x.id]=ex.id;return}
    DB.seasons.push(x);seasonByName[(x.name||"").toLowerCase()]=x;seasonRemap[x.id]=x.id;
  });
  function rs(id){return seasonRemap[id]||id}

  var peopleByName={};
  DB.people.forEach(function(p){peopleByName[(p.name||"").toLowerCase()]=p});
  var personRemap={};
  inc.people.forEach(function(p){
    var ex=null;DB.people.forEach(function(y){if(y.id===p.id)ex=y});
    if(!ex)ex=peopleByName[(p.name||"").toLowerCase()]||null;
    if(ex){personRemap[p.id]=ex.id;return}
    DB.people.push(p);peopleByName[(p.name||"").toLowerCase()]=p;personRemap[p.id]=p.id;
  });
  function rpe(id){return personRemap[id]||id}

  inc.assignments.forEach(function(a){
    a.personId=rpe(a.personId);a.teamId=rt(a.teamId);
    var dup=DB.assignments.some(function(x){
      return x.personId===a.personId&&x.teamId===a.teamId&&x.role===a.role;});
    if(!dup)DB.assignments.push(a);
  });

  inc.squads.forEach(function(sq){
    sq.teamId=rt(sq.teamId);sq.seasonId=rs(sq.seasonId);
    sq.roster.forEach(function(e){e.playerId=rp(e.playerId)});
    sq.playerIds=sq.playerIds.map(rp);
    sq.lineup=sq.lineup.map(rp);
    sq.subteams.forEach(function(st){st.playerIds=st.playerIds.map(rp)});
    var ns={};Object.keys(sq.stats).forEach(function(pid){ns[rp(pid)]=sq.stats[pid]});sq.stats=ns;
    sq.sessions.forEach(function(se){se.entries.forEach(function(en){en.playerId=rp(en.playerId)})});
    /* Les identifiants d'événement sont locaux au squad importé : ils
       voyagent avec lui, rien à remapper. */
    sq.selectorViews.forEach(function(v){
      v.playerIds=v.playerIds.map(rp);
      var nd={};Object.keys(v.data).forEach(function(pid){nd[rp(pid)]=v.data[pid]});v.data=nd;
    });
    sq.submissions.forEach(function(sub){sub.entries.forEach(function(e){e.playerId=rp(e.playerId)})});
    /* Un squad déjà présent pour ce couple équipe × saison n'est pas écrasé. */
    if(!squadFor(sq.teamId,sq.seasonId))DB.squads.push(sq);
  });

  /* Les journaux se réunissent et se retrient : une entrée déjà connue
     n'est pas dupliquée. */
  var known={};DB.log.forEach(function(l){known[l.id]=1});
  (inc.log||[]).forEach(function(l){
    if(known[l.id])return;
    l.teamId=l.teamId?rt(l.teamId):"";
    l.seasonId=l.seasonId?rs(l.seasonId):"";
    if(l.playerId)l.playerId=rp(l.playerId);
    DB.log.push(l);
  });
  DB.log.sort(function(a,b){return String(a.at).localeCompare(String(b.at))});
  normalizeDB(DB);
}
function nameKey(p){return (fullName(p)+"|"+(p.birthYear||"")).toLowerCase()}

/* ── Paquet sélectionneur ────────────────────────────────────
   Vue anonyme (défaut) : seuls l'identifiant opaque et le dossard
   circulent — aucun nom, ni dans l'interface ni dans le fichier.
   Vue nominative : l'entraîneur a explicitement levé l'anonymat,
   un libellé court accompagne alors chaque numéro. */
function viewNumberIssues(squad,view){
  var dup=dupNumbers(squad);
  return view.playerIds.filter(function(pid){var n=numOf(squad,pid);return !n||dup[n]});
}
function buildPacket(squad,view){
  var camp=campaignById(squad,view.campaignId);
  var anon=view.anonymous!==false;
  return {
    type:"wonderstats-selector-packet",version:3,createdAt:nowISO(),
    seasonId:squad.id,seasonName:squad.name,
    campaignId:view.campaignId||null,campaignName:camp?camp.name:"",
    view:{
      id:view.id,name:view.name,selectorName:view.selectorName,
      criteria:view.criteria.slice(),groups:view.groups.slice(),
      /* Les groupes d'athlètes voyagent avec la vue : composés une fois,
         ils la suivent chez celui qu'on invite, au lieu de le laisser
         devant vingt-huit numéros en vrac. Ils ne portent que des
         identifiants déjà présents dans `players` — rien de nominatif ne
         s'ajoute au paquet.

         Ils restent malgré tout le travail de celui qui évalue : il les
         recompose comme il veut sur son écran, et une republication ne
         les écrase jamais (voir pullForSelector). */
      playerGroups:(view.playerGroups||[]).map(function(g){
        return {id:g.id,name:g.name,playerIds:g.playerIds.slice()};
      }),
      anonymous:anon,context:view.context||"",
      players:view.playerIds.map(function(pid){
        var o={playerId:pid,number:numOf(squad,pid)};
        if(!anon)o.label=shortName(playerById(pid));
        return o;
      })
    }
  };
}
function packetToView(data){
  var v=mkSelectorView({
    id:(data.view&&data.view.id)||uid(),
    name:(data.view&&data.view.name)||"Vue importée",
    selectorName:(data.view&&data.view.selectorName)||"",
    criteria:((data.view&&data.view.criteria)||[]).filter(function(c){return CRIT_BY_KEY[c]}),
    groups:normGroups(data.view&&data.view.groups),
    anonymous:!(data.view&&data.view.anonymous===false),
    context:(data.view&&data.view.context)||"",
    campaignId:data.campaignId||null,campaignName:data.campaignName||"",
    origin:"imported",seasonId:data.seasonId,seasonName:data.seasonName||""
  });
  if(!v.criteria.length)v.criteria=CRITERIA.map(function(c){return c.key});
  v.numbers={};v.labels={};
  ((data.view&&data.view.players)||[]).forEach(function(pl){
    if(!pl||!pl.playerId)return;
    v.playerIds.push(pl.playerId);
    v.numbers[pl.playerId]=cleanNum(pl.number);
    if(pl.label)v.labels[pl.playerId]=String(pl.label);
    v.data[pl.playerId]=mkEntryData();
  });
  v.playerGroups=normPlayerGroups(data.view&&data.view.playerGroups,v.playerIds);
  return v;
}
/* Une vue partie chez quelqu'un emporte les numéros du moment. Les
   renuméroter ensuite ne la rattrape pas : le paquet est figé, c'est ce
   qui le rend lisible hors-ligne. On retient donc qu'elle est partie,
   pour pouvoir prévenir. */
function vuesDistribuees(squad,pid){
  return (squad?squad.selectorViews:[]).filter(function(v){
    if(v.playerIds.indexOf(pid)===-1)return false;
    return !!(v.published||v.exportedAt);
  });
}
function exportPacket(squad,view){
  view.exportedAt=nowISO();
  var bad=viewNumberIssues(squad,view);
  if(bad.length){showToast("⚠️ "+plural(bad.length,"numéro")+" manquant(s) ou en double");return}
  if(downloadJSON(buildPacket(squad,view),"Vue_"+safeName(view.name)+"_"+stamp()+".json"))
    showToast("📤 Paquet sélectionneur exporté");
}
function importPacket(){
  pickJSON(function(data){
    if(!data||data.type!=="wonderstats-selector-packet"||!data.view){showToast("⚠️ Ce n'est pas un paquet sélectionneur");return}
    var v=packetToView(data);
    INBOX.views=INBOX.views.filter(function(x){return x.id!==v.id});
    INBOX.views.push(v);
    ensureSelectorCtx(v.teamId);
    state.tab="sv_views";state.svViewId=v.id;
    saveNow();showToast("📥 Vue « "+v.name+" » importée");render();
  });
}

/* ── Soumission ────────────────────────────────────────────── */
function buildSubmission(view,numberFor){
  return {
    type:"wonderstats-submission",version:3,
    id:uid(),viewId:view.id,viewName:view.name,
    selectorName:(view.selectorName||"").trim(),
    seasonId:view.seasonId||null,
    campaignId:view.campaignId||null,campaignName:view.campaignName||"",
    context:view.context||"",
    submittedAt:nowISO(),
    criteria:view.criteria.slice(),
    entries:view.playerIds.map(function(pid){
      var d=view.data[pid]||mkEntryData();
      return {playerId:pid,number:numberFor(pid),stats:normStats(d.stats),
        ratings:d.ratings||{},reco:d.reco||"",pos:normPos(d.pos),note:(d.note||"").trim()};
    })
  };
}
/* Soumission locale : la vue vit dans la saison, on écrit directement */
function submitLocalView(squad,view){
  var sub=buildSubmission(view,function(pid){return numOf(squad,pid)});
  delete sub.type;delete sub.version;
  var camp=campaignById(squad,view.campaignId);
  sub.campaignId=view.campaignId;sub.campaignName=camp?camp.name:"";
  squad.submissions.push(sub);
  view.submittedAt=sub.submittedAt;
  view.submissionCount=(view.submissionCount||0)+1;
  saveNow();
  return sub;
}
/* Soumission depuis une vue importée : fichier de secours hors-ligne */
function exportSubmission(view){
  var sub=buildSubmission(view,function(pid){return (view.numbers||{})[pid]||""});
  if(downloadJSON(sub,"Soumission_"+safeName(view.name)+"_"+safeName(view.selectorName)+"_"+stamp()+".json")){
    view.submittedAt=sub.submittedAt;view.submissionCount=(view.submissionCount||0)+1;
    saveNow();showToast("📤 Soumission exportée");
  }
}
/* Intégration d'une soumission dans la saison — chemin commun au fichier
   et au relais réseau. Retourne null si elle est refusée. */
function integrateSubmission(squad,data){
  if(!data||!squad)return null;
  if(squad.submissions.some(function(s){return s.id===data.id}))return null;
  var known={};squad.roster.forEach(function(e){known[e.playerId]=true});
  var entries=(data.entries||[]).filter(function(e){return e&&known[e.playerId]});
  if(!entries.length)return null;
  var cid=campaignById(squad,data.campaignId)?data.campaignId:squad.activeCampaignId;
  var camp=campaignById(squad,cid);
  var sub={id:data.id||uid(),viewId:data.viewId||"",viewName:data.viewName||"Vue",
    selectorName:data.selectorName||"",selectorToken:data.selectorToken||"",
    campaignId:cid,campaignName:camp?camp.name:"",
    context:data.context||"",submittedAt:data.submittedAt||nowISO(),
    criteria:data.criteria||CRITERIA.map(function(c){return c.key}),
    entries:entries.map(function(e){return {playerId:e.playerId,number:cleanNum(e.number),
      stats:normStats(e.stats),ratings:e.ratings||{},reco:RECO_BY_KEY[e.reco]?e.reco:"",
      pos:normPos(e.pos),note:e.note||""}})};
  squad.submissions.push(sub);
  return sub;
}
function importSubmission(squad){
  pickJSON(function(data){
    if(!data||data.type!=="wonderstats-submission"){showToast("⚠️ Ce n'est pas une soumission");return}
    if(squad.submissions.some(function(s){return s.id===data.id})){showToast("⚠️ Soumission déjà importée");return}
    var sub=integrateSubmission(squad,data);
    if(!sub){showToast("⚠️ Aucune joueuse de cette saison dans le fichier");return}
    saveNow();showToast("📥 Soumission de "+(sub.selectorName||"—")+" intégrée");render();
  });
}

/* ══════════════════════════════════════════════════════════════
   SYNCHRONISATION RÉSEAU
   Le sélectionneur travaille sur SON appareil : l'entraîneur publie
   ses vues sur un relais, le sélectionneur les récupère et téléverse
   sa soumission. Le relais est choisi par l'entraîneur (voir server/) ;
   l'application ne parle qu'un contrat HTTP minimal :

     POST {url}?action=publish   corps {room, kind, id, payload}
     GET  {url}?action=list&room=…&kind=…&since=…  →  {ok, items:[…]}

   Les corps sont envoyés en text/plain : aucune requête préliminaire
   CORS, donc compatible aussi bien avec un Cloudflare Worker qu'avec
   un script Google Apps Script.
   ══════════════════════════════════════════════════════════════ */
var SYNC={url:"",room:"",token:"",identity:null,pulled:{packet:"",catalog:"",submission:""},lastSyncAt:null};
var SK_SYNC="wonderstats_sync_v4";
var syncBusy=false;

function saveSync(){try{localStorage.setItem(SK_SYNC,JSON.stringify(SYNC))}catch(e){}}
function loadSync(){
  try{
    var d=localStorage.getItem(SK_SYNC);
    if(d)SYNC=Object.assign({url:"",room:"",token:"",identity:null,
      pulled:{packet:"",catalog:"",submission:""},lastSyncAt:null},JSON.parse(d));
    if(!SYNC.pulled)SYNC.pulled={packet:"",catalog:"",submission:""};
  }catch(e){}
}
function syncReady(){return !!(SYNC.url&&SYNC.room&&SYNC.token)}
function mkRoomCode(){
  var abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",out="";
  for(var i=0;i<6;i++)out+=abc.charAt(Math.floor(Math.random()*abc.length));
  return "WNDR-"+out.slice(0,3)+"-"+out.slice(3);
}
/* Un jeton n'est pas un mot de passe : c'est un porte-clé opaque, émis
   par l'administrateur et révocable. Il identifie une personne auprès du
   relais et détermine ce qu'elle peut y lire. */
function mkToken(){
  var abc="abcdefghijklmnopqrstuvwxyz0123456789",out="";
  for(var i=0;i<32;i++)out+=abc.charAt(Math.floor(Math.random()*abc.length));
  return out;
}
function normUrl(u){
  u=(u||"").trim();
  if(!u)return "";
  if(!/^https?:\/\//i.test(u))u="https://"+u;
  return u.replace(/[?#].*$/,"").replace(/\/+$/,"");
}
function syncEndpoint(params){
  var q=[];
  for(var k in params)if(Object.prototype.hasOwnProperty.call(params,k)&&params[k]!=null)
    q.push(encodeURIComponent(k)+"="+encodeURIComponent(params[k]));
  return SYNC.url+(SYNC.url.indexOf("?")===-1?"?":"&")+q.join("&");
}
function syncFetch(url,opts){
  var ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
  var timer=setTimeout(function(){if(ctrl)ctrl.abort()},20000);
  var o=Object.assign({},opts||{});
  if(ctrl)o.signal=ctrl.signal;
  return fetch(url,o).then(function(r){
    clearTimeout(timer);
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.text();
  }).then(function(txt){
    var data;
    try{data=JSON.parse(txt)}catch(e){throw new Error(diagnose(txt))}
    if(data&&data.ok===false)throw new Error(data.error||"Relais en erreur");
    return data;
  }).catch(function(err){
    clearTimeout(timer);
    if(err&&err.name==="AbortError")throw new Error("Relais injoignable (délai dépassé)");
    if(err&&/Failed to fetch|NetworkError|Load failed/i.test(err.message||""))
      throw new Error("Adresse injoignable. Vérifiez l'adresse copiée, et que le déploiement est accessible à « tout le monde ».");
    throw err;
  });
}
/* Le relais a répondu autre chose que du JSON. Les causes sont peu
   nombreuses et toujours les mêmes : autant les nommer. */
function diagnose(txt){
  var t=(txt||"").slice(0,600);
  if(/^\s*</.test(t)){
    if(/accounts\.google\.com|Sign in|Connexion|ServiceLogin/i.test(t))
      return "Google demande une connexion : votre déploiement n'est pas accessible à « tout le monde ». Redéployez en choisissant « Qui a accès : tout le monde ».";
    if(/Moved Temporarily|has moved|redirect/i.test(t))
      return "L'adresse redirige ailleurs. Vérifiez qu'elle se termine bien par /exec.";
    return "Le relais a renvoyé une page web au lieu de données. L'adresse est probablement incomplète — elle doit se terminer par /exec (Apps Script) ou par le nom du Worker.";
  }
  if(!t)return "Le relais a répondu, mais sans rien dire. Vérifiez que le script déployé est bien celui du dossier server/.";
  return "Réponse illisible du relais : "+t.slice(0,120);
}

function syncPost(action,body){
  return syncFetch(syncEndpoint({action:action}),{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({room:SYNC.room,token:SYNC.token},body||{}))
  });
}
function syncPing(){return syncFetch(syncEndpoint({action:"ping",room:SYNC.room,token:SYNC.token}))}
function syncWhoami(){return syncFetch(syncEndpoint({action:"whoami",room:SYNC.room,token:SYNC.token}))}
function syncPublish(kind,id,payload,extra){
  if(!syncReady())return Promise.reject(new Error("Synchronisation non configurée"));
  return syncPost("publish",Object.assign({kind:kind,id:id,payload:payload},extra||{}));
}
function syncList(kind,since,teamId){
  if(!syncReady())return Promise.reject(new Error("Synchronisation non configurée"));
  return syncFetch(syncEndpoint({action:"list",room:SYNC.room,token:SYNC.token,
    kind:kind,since:since||"",teamId:teamId||""}));
}

/* ── Émission et révocation des jetons (administrateur) ────── */
function grantToken(person,teamId,role){
  var fresh=!person.token;
  if(!person.token)person.token=mkToken();
  person.tokenFor={role:role,teamId:teamId||""};
  logAct("access","Jeton "+(fresh?"émis":"réémis")+" pour "+person.name+
    (teamId?" sur « "+((teamById(teamId)||{}).name||"—")+" »":""),{teamId:teamId||""});
  var t=teamId?teamById(teamId):null;
  return syncPost("grant",{grant:{
    token:person.token,name:person.name,
    role:role,
    teamId:teamId||"",teamName:t?t.name:""
  }});
}
function revokeToken(person){
  if(!person||!person.token)return Promise.resolve();
  var tok=person.token;
  person.token="";person.tokenFor=null;
  logAct("access","Jeton de "+person.name+" révoqué");
  if(!syncReady())return Promise.resolve();
  return syncPost("revoke",{target:tok}).catch(function(){});
}

/* ── Lien d'invitation : porte le jeton personnel ──────────── */
function b64urlEncode(str){
  var b=btoa(unescape(encodeURIComponent(str)));
  return b.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64urlDecode(str){
  str=String(str).replace(/-/g,"+").replace(/_/g,"/");
  while(str.length%4)str+="=";
  return decodeURIComponent(escape(atob(str)));
}
/* Le lien porte le rôle et l'équipe pour lesquels le jeton a été émis.
   Non pour les accorder — seul le relais accorde — mais pour que
   l'appareil qui rejoint puisse vérifier que la réponse du relais est
   bien celle qu'on lui a promise. Sans quoi un salon expiré ou réclamé
   par un autre appareil fait d'une sélectionneuse une administratrice,
   puisque le relais répond « Administrateur » à qui arrive le premier
   dans un salon sans propriétaire. */
function inviteLink(person){
  if(!SYNC.url||!SYNC.room||!person||!person.token)return "";
  var base=location.href.replace(/[?#].*$/,"");
  var o={u:SYNC.url,r:SYNC.room,t:person.token};
  var f=person.tokenFor;
  if(f&&f.role){o.ro=f.role;if(f.teamId)o.tm=f.teamId}
  return base+"#s="+b64urlEncode(JSON.stringify(o));
}
function decodeShare(raw){
  try{
    var o=JSON.parse(b64urlDecode(raw));
    if(o&&o.u&&o.r&&o.t)return {url:normUrl(o.u),room:String(o.r),token:String(o.t),
      role:o.ro?String(o.ro):"",teamId:o.tm?String(o.tm):""};
  }catch(e){}
  return null;
}
function readShareLink(){
  var m=(location.hash||"").match(/[#&]s=([A-Za-z0-9_-]+)/);
  return m?decodeShare(m[1]):null;
}
/* Ce que le relais répond doit correspondre à ce que le lien annonçait.
   Un écart n'est pas un détail : c'est la différence entre évaluer une
   équipe et administrer un club. */
function roleEnClair(r){
  if(r==="admin")return "administrateur";
  return ROLES[r]?ROLES[r].label.toLowerCase():(r||"—");
}
function ecartInvitation(cfg,g){
  if(!cfg||!cfg.role||!g)return "";          /* lien d'avant : rien de promis */
  if(g.role!==cfg.role)
    return "Votre invitation est de "+roleEnClair(cfg.role)+", mais le relais vous répond « "+
      roleEnClair(g.role)+" ». Le salon a expiré ou changé de mains : demandez un nouveau lien.";
  if(cfg.teamId&&g.teamId&&g.teamId!==cfg.teamId)
    return "Le relais vous rattache à une autre équipe que celle de votre invitation. Demandez un nouveau lien.";
  return "";
}
/* Un sélectionneur colle ce qu'il a reçu : l'URL entière, ou juste le
   fragment. On accepte les deux plutôt que d'exiger le bon découpage. */
function parseShareText(txt){
  txt=(txt||"").trim();
  if(!txt)return null;
  var m=txt.match(/[#&]s=([A-Za-z0-9_-]+)/)||txt.match(/^([A-Za-z0-9_-]{20,})$/);
  return m?decodeShare(m[1]):null;
}
function clearHash(){
  try{history.replaceState(null,"",location.href.replace(/#.*$/,""))}catch(e){location.hash=""}
}

/* ── Entraîneur : publier, relever ─────────────────────────── */
function publishView(squad,view){
  var bad=viewNumberIssues(squad,view);
  if(bad.length){showToast("⚠️ "+plural(bad.length,"numéro")+" à corriger avant publication");return}
  var target=view.selectorPersonId?personById(view.selectorPersonId):null;
  syncBusy=true;render();
  syncPublish("packet",view.id,buildPacket(squad,view),
      {teamId:squad.teamId,to:(target&&target.token)||""}).then(function(){
    view.published=true;SYNC.lastSyncAt=nowISO();
    syncBusy=false;saveNow();saveSync();
    showToast("📡 « "+view.name+" » publiée"+(target?" pour "+target.name:""));render();
  }).catch(function(err){
    syncBusy=false;showToast("⚠️ "+err.message);render();
  });
}
/* Catalogue d'équipe : ce qui permet à un sélectionneur de choisir
   lui-même ses athlètes. Numéros et positions uniquement. */
function buildCatalog(squad){
  var camp=curCampaign(squad),season=seasonById(squad.seasonId);
  return {

function pullSubmissions(squad){

      /* L'identité vient du jeton, estampillée par le relais — plus du

/* ── Sélectionneur : récupérer, téléverser ─────────────────── */
function pullForSelector(){
  syncBusy=true;render();
  Promise.all([syncList("catalog",""),syncList("packet","")]).then(function(res){
    var cats=(res[0]&&res[0].items)||[],packs=(res[1]&&res[1].items)||[];
    var nCat=0,added=0,updated=0;
    INBOX.catalogs=INBOX.catalogs||[];
    cats.forEach(function(it){
      var c=it.payload;
      if(!c||c.type!=="wonderstats-catalog")return;
      INBOX.catalogs=INBOX.catalogs.filter(function(x){return !(x.teamId===c.teamId&&x.seasonId===c.seasonId)});
      INBOX.catalogs.push(c);nCat++;
    });
    packs.forEach(function(it){
      var pk=it.payload;
      if(!pk||pk.type!=="wonderstats-selector-packet"||!pk.view)return;
      var existing=null;
      INBOX.views.forEach(function(v){if(v.id===pk.view.id)existing=v});
      var fresh=packetToView(pk);
      /* L'équipe voyage avec l'enregistrement du relais, jamais dans le
         paquet — qui est anonyme. Sans elle, la soumission repartirait
         sans équipe et le relais la refuserait : un jeton de
         sélectionneur ne dépose que pour la sienne. */
      fresh.teamId=it.teamId||(SYNC.identity&&SYNC.identity.teamId)||"";
      if(!existing){INBOX.views.push(fresh);added++}
      else{
        /* On ne réécrit jamais un travail en cours : seule la composition
           de la vue est rafraîchie, les évaluations déjà saisies restent. */
        existing.name=fresh.name;existing.criteria=fresh.criteria;existing.groups=fresh.groups;
        existing.anonymous=fresh.anonymous;existing.labels=fresh.labels;
        existing.campaignId=fresh.campaignId;existing.campaignName=fresh.campaignName;
        existing.context=fresh.context;existing.numbers=fresh.numbers;
        existing.playerIds=fresh.playerIds;
        /* Les groupes sont le travail de celui qui évalue : une vue
           republiée ne les remplace pas, elle les recadre sur les
           athlètes encore présentes. Mais s'il n'en avait aucun, ceux qui
           arrivent avec la vue lui servent de point de départ. */
        var siens=normPlayerGroups(existing.playerGroups,fresh.playerIds);
        existing.playerGroups=siens.length?siens:fresh.playerGroups;
        existing.teamId=fresh.teamId||existing.teamId;
        fresh.playerIds.forEach(function(pid){if(!existing.data[pid])existing.data[pid]=mkEntryData()});
        updated++;
      }
    });
    SYNC.lastSyncAt=nowISO();
    syncBusy=false;saveNow();saveSync();
    showToast((nCat||added||updated)
      ?("📥 "+plural(nCat,"équipe")+" · "+added+" nouvelle(s) vue(s), "+updated+" mise(s) à jour")
      :"Rien de nouveau");
    render();
  }).catch(function(err){
    syncBusy=false;showToast("⚠️ "+err.message);render();
  });
}
function uploadSubmission(view){
  var sub=buildSubmission(view,function(pid){return (view.numbers||{})[pid]||""});
  /* Les vues reçues avant que l'équipe ne soit estampillée n'en portent
     pas : celle du jeton fait foi, c'est de toute façon la seule pour
     laquelle le relais acceptera quoi que ce soit. */
  var tid=view.teamId||(SYNC.identity&&SYNC.identity.teamId)||"";
  if(!view.teamId&&tid)view.teamId=tid;
  syncBusy=true;render();
  syncPublish("submission",sub.id,sub,{teamId:tid}).then(function(){
    view.submittedAt=sub.submittedAt;view.submissionCount=(view.submissionCount||0)+1;
    view.uploadedAt=sub.submittedAt;SYNC.lastSyncAt=nowISO();
    syncBusy=false;saveNow();saveSync();
    showToast("✅ Soumission téléversée");
    state.tab="sv_views";render();
  }).catch(function(err){
    syncBusy=false;
    showToast("⚠️ "+err.message+" — utilisez le fichier de secours");
    render();
  });
}

var EVT={onclick:1,oninput:1,onchange:1,onkeydown:1,onblur:1,onfocus:1};
function h(tag,attrs){
  var el=document.createElement(tag),ch=Array.prototype.slice.call(arguments,2);
  if(attrs)for(var k in attrs){
    if(!Object.prototype.hasOwnProperty.call(attrs,k))continue;
    var v=attrs[k];
    if(v==null||v===false)continue;
    if(EVT[k])el[k]=v;
    else if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k==="className")el.className=v;
    else if(k==="value")el.value=v;
    else el.setAttribute(k,v===true?"":v);
  }
  (function add(list){
    list.forEach(function(c){
      if(c==null||c===false)return;
      if(Array.isArray(c))add(c);
      else if(typeof c==="string"||typeof c==="number")el.appendChild(document.createTextNode(String(c)));
      else el.appendChild(c);
    });
  })(ch);
  return el;
}
function bindInput(el,cb){["input","change"].forEach(function(evt){el.addEventListener(evt,cb)})}

/* Toast hors cycle de rendu : ne détruit pas le DOM (donc pas le focus) */
var toastTimer=null;
function showToast(msg,duree){
  state.toast=msg;
  var app=document.getElementById("app");if(!app)return;
  var old=app.querySelector(".toast");if(old)old.remove();
  var el=h("div",{className:"toast"},msg);
  app.appendChild(el);
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){state.toast=null;var t=app.querySelector(".toast");if(t)t.remove();toastTimer=null},
    duree||2600);
}

function renderSelectionBoard(squad){
  var camp=curCampaign(squad);
  var compiled=compileSubmissions(squad,camp?camp.id:null);
  var dup=dupNumbers(squad);
  var counts={candidate:0,recalled:0,selected:0,cut:0};
  squad.roster.forEach(function(e){counts[e.status]=(counts[e.status]||0)+1});

  var filters=[{k:"all",l:"Toutes ("+squad.roster.length+")"}].concat(STATUS_ORDER.map(function(st){
    return {k:st,l:STATUSES[st].icon+" "+STATUSES[st].label+" ("+(counts[st]||0)+")"};
  }));
  var fRow=h("div",{className:"sub-pills",style:{marginBottom:"12px",paddingBottom:"2px"}},filters.map(function(f){
    var b=h("button",{className:"pill sm"+(state.statusFilter===f.k?" active":""),onclick:function(){state.statusFilter=f.k;render()}},f.l);
    if(state.statusFilter===f.k)b.style.background=f.k==="all"?"#3B82F6":STATUSES[f.k].color;
    return b;
  }));

  function visible(){
    var list=squad.roster.filter(function(e){return state.statusFilter==="all"||e.status===state.statusFilter});
    var q=(state.search||"").trim().toLowerCase();
    if(q)list=list.filter(function(e){
      var p=playerById(e.playerId);
      return (fullName(p).toLowerCase().indexOf(q)!==-1)||(e.number.indexOf(q)===0);
    });
    return list.slice().sort(function(a,b){
      var ca=compiled[a.playerId]||{},cb=compiled[b.playerId]||{};
      /* Notées d'abord, par score ; puis celles dont on n'a que des
         compteurs ; puis celles que personne n'a vues. */
      if(!ca.nRatings!==!cb.nRatings)return ca.nRatings?-1:1;
      var sa=ca.score||0,sb=cb.score||0;
      if(sb!==sa)return sb-sa;
      return (parseInt(a.number,10)||999)-(parseInt(b.number,10)||999);
    });
  }

  var searchInp=h("input",{className:"txt",placeholder:"Rechercher une joueuse ou un numéro…",value:state.search,style:{marginBottom:"10px"}});
  searchInp.addEventListener("input",function(e){state.search=e.target.value;refreshList()});

  var listWrap=h("div",{id:"selList"});
  function rowFor(e){
    var p=playerById(e.playerId);if(!p)return null;
    var c=compiled[e.playerId];
    var numI=h("input",{className:"num-badge"+(e.number&&dup[e.number]?" dup":"")+(e.number?"":" dup"),
      value:e.number,inputmode:"numeric",placeholder:"#",maxlength:"3"});

    numI.addEventListener("focus",function(){numBefore=e.number});
    numI.addEventListener("input",function(ev){
      e.number=cleanNum(ev.target.value);ev.target.value=e.number;scheduleAutoSave();
    });
    numI.addEventListener("blur",function(){
      if(e.number!==numBefore){
        var p=playerById(e.playerId);
        logAct("number",(p?fullName(p):"joueuse")+" : numéro "+(numBefore||"—")+" → "+(e.number||"—"),
          {teamId:squad.teamId,seasonId:squad.seasonId,playerId:e.playerId});
        /* Ce que le changement ne rattrape pas : les vues déjà entre les
           mains d'un sélectionneur. Il verrait l'ancien numéro sur son
           écran et le nouveau sur le dossard. */
        var parties=vuesDistribuees(squad,e.playerId);
        if(parties.length)showToast(parties.length===1
          ? "⚠️ Une vue déjà distribuée affiche encore #"+(numBefore||"—")+" — republiez-la"
          : "⚠️ "+parties.length+" vues déjà distribuées affichent encore #"+(numBefore||"—")+" — republiez-les",
          5000);
        numBefore=e.number;
      }

    var stBtns=h("div",{className:"status-btns"},RECOS.map(function(r){
      var target=RECO_TO_STATUS[r.key],on=e.status===target;

        setRosterStatus(squad,e,on?"candidate":target);render();
      }},r.icon);
      if(on){b.style.background=r.color;b.style.borderColor=r.color}
      return b;
    }));

    var meta=[posBadge(e.position),statusBadge(e.status)];
    if(isInSquad(e)===false&&e.status==="selected")meta.push(membershipBadge(e.membership));
    else if(e.status==="selected"&&e.membership!=="active")meta.push(membershipBadge(e.membership));
    if(c&&c.n){
      var sc=c.nRatings?c.score:0;
      meta.push(h("span",{className:"badge",style:{background:scoreColor(sc)+"22",color:scoreColor(sc),borderColor:scoreColor(sc)+"55"}},
        c.nRatings?("★ "+c.score.toFixed(1)+" · "+plural(c.nRatings,"note")):("★ — · "+plural(c.n,"relevé"))));
      if(c.topReco)meta.push(h("span",{className:"badge",style:{background:RECO_BY_KEY[c.topReco].color+"18",color:RECO_BY_KEY[c.topReco].color}},
        "Avis : "+RECO_BY_KEY[c.topReco].short));
      if(c.topPos)meta.push(posVoteBadge(c));
    }
    if(!e.number)meta.push(h("span",{className:"badge",style:{background:"#EF444422",color:"#FCA5A5",borderColor:"#EF444455"}},"numéro à saisir"));

    var row=h("div",{className:"list-row"},numI,
      h("div",{className:"body",onclick:function(){state.expandedPlayerId=state.expandedPlayerId===e.playerId?null:e.playerId;render()}},
        h("div",{className:"pname"},fullName(p)),
        h("div",{style:{display:"flex",gap:"4px",flexWrap:"wrap",marginTop:"4px"}},meta)),
      stBtns);
    if(state.expandedPlayerId!==e.playerId)return row;
    return h("div",null,row,renderPlayerSheet(squad,e,p));
  }
  function refreshList(){
    var nl=h("div",{id:"selList"});
    var fresh=visible();
    if(!fresh.length)nl.appendChild(h("div",{className:"empty"},"Aucun résultat"));
    fresh.forEach(function(x){var r=rowFor(x);if(r)nl.appendChild(r)});
    var cur=document.getElementById("selList");
    if(cur&&cur.parentNode)cur.parentNode.replaceChild(nl,cur);
  }
  var list=visible();
  if(!list.length)listWrap.appendChild(h("div",{className:"empty"},squad.roster.length?"Aucun résultat":"Aucune joueuse convoquée. Onglet Joueuses → Convoquer."));
  list.forEach(function(e){var r=rowFor(e);if(r)listWrap.appendChild(r)});

  var miss=missingNumbers(squad).length,nDup=Object.keys(dup).length;
  var warn=(miss||nDup)?h("div",{className:"hint warn"},
    "⚠️ "+(miss?plural(miss,"joueuse")+" sans numéro. ":"")+(nDup?nDup+" numéro(s) en double. ":"")+
    "Les numéros se saisissent ici, directement dans la case de gauche. Chacun doit être unique : c'est la seule information que verront vos sélectionneurs."):null;

  var campChip=camp?h("div",{className:"card tight",style:{marginBottom:"12px"}},
    h("div",{className:"row-between"},
      h("div",{style:{minWidth:"0"}},
        h("div",{className:"muted"},"Scores affichés pour la campagne"),
        h("div",{style:{fontWeight:"700",color:"#F8FAFC",marginTop:"2px"}},campaignLabel(camp))),
      h("button",{className:"btn btn-ghost xs",onclick:function(){state.seasonPane="campaigns";render()}},"Changer"))):null;

  var nSub=campaignSubs(squad,camp?camp.id:null).length;
  var actions=h("div",{className:"btn-row",style:{marginTop:"14px"}},
    h("button",{className:"btn btn-primary sm",onclick:function(){state.tab="players";state.playersPane="db";render()}},"+ Convoquer des joueuses"),
    nSub?h("button",{className:"btn btn-warn sm",onclick:function(){openModal("applyreco")}},"⚡ Appliquer les avis ("+nSub+")"):null,
    h("button",{className:"btn btn-save sm",onclick:function(){promoteSelectedToTeam(squad)}},"👕 Composer l'équipe"));

  return h("div",null,
    h("div",{className:"hint"},"Convoquez vos joueuses, saisissez leur numéro, faites-les évaluer, puis tranchez : ",
      h("b",null,"✅ Retenir")," (entre dans l'équipe de la saison), ",h("b",null,"🔁 Recaller")," (rappelée pour la suite), ",h("b",null,"⛔ Non retenue"),"."),
    warn,campChip,searchInp,fRow,listWrap,actions);
}

/* ── Fiche joueuse de saison ────────────────────────────────
   Réunit ce que l'audit avait trouvé séparé : le cumul de match
   (quantitatif) et les évaluations par campagne (qualitatif). */
function renderPlayerSheet(squad,entry,p){
  var box=h("div",{className:"card",style:{marginTop:"-2px",marginBottom:"10px",borderTopLeftRadius:"0",borderTopRightRadius:"0"}});

  /* Position */
  box.appendChild(h("div",{className:"field"},h("label",null,"Position"),
    h("div",{className:"pos-btns"},POSITIONS.filter(function(x){return x.key!=="ALL"}).map(function(pos){
      var v=pos.key==="NONE"?"":pos.key;
      return h("button",{className:"pos-btn"+(entry.position===v?" active":""),onclick:function(){entry.position=v;scheduleAutoSave();render()}},pos.label);
    }))));

  /* Statut d'effectif — seulement une fois retenue */
  if(entry.status==="selected"){
    box.appendChild(h("div",{className:"field"},h("label",null,"Dans l'effectif"),
      h("div",{className:"reco-row"},MEMBERSHIP_ORDER.map(function(k){
        var m=MEMBERSHIPS[k],on=entry.membership===k;
        var b=h("button",{className:"reco-btn"+(on?" on":""),onclick:function(){
          if(entry.membership!==k)logAct("membership",
            logWho(squad,entry.playerId)+" : effectif "+(MEMBERSHIPS[entry.membership]||{}).label+" → "+m.label,

    box.appendChild(h("div",{className:"muted",style:{marginBottom:"6px"}},

      ((ms.record.win||ms.record.loss)?" · "+ms.record.win+"V–"+ms.record.loss+"D":"")+
      " · "+ms.teams.map(function(t){return t.name+" ("+t.sessions+")"}).join(", ")));
    /* Ventilation par nature : « comment se comporte-t-elle en tournoi ? »

            kk.icon+" "+kk.short+" · "+plural(d.sessions,"match")+
            (d.sessions?" · "+(Math.round(kills/d.sessions*10)/10)+" kill/match":""));
        })));
    }
    box.appendChild(renderStatMini(ms.stats));
  } else box.appendChild(h("div",{className:"muted"},"Aucun match enregistré."));

  /* Depuis la sélection — ce que valait son premier relevé, et ce qu'il vaut
     aujourd'hui. C'est la lecture que réclame une athlète retenue. */
  var cmpBase=renderBaselineCompare(squad,entry.playerId);
  if(cmpBase){
    box.appendChild(h("div",{className:"section-title"},"Depuis la sélection"));

  /* Évaluations, campagne par campagne */

  box.appendChild(h("div",{className:"section-title"},"Évaluations par campagne"));
  if(!perCamp.length)box.appendChild(h("div",{className:"muted"},"Aucune évaluation reçue pour cette joueuse."));
  perCamp.forEach(function(x,i){
    var prev=i>0?perCamp[i-1]:null;
    var delta=prev?(x.c.score-prev.c.score):null;
