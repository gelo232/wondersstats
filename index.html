function renderSummaryTab(){
  var season=curSeason(),team=curTeam();
  if(!season||!team)return emptyBlock("📊","Aucune équipe","Créez une saison et une équipe.",null);
  var modes=[
    {k:"session",l:"📋 Match",c:"#3B82F6"},
    {k:"global",l:"🌐 Cumul",c:"#8B5CF6"},
    {k:"evals",l:"⭐ Évaluations",c:"#F59E0B"},
    {k:"sessions",l:"💾 Sessions",c:"#10B981"}
  ];
  var modeRow=h("div",{className:"pill-row"},modes.map(function(m){
    var b=h("button",{className:"pill"+(state.summaryMode===m.k?" active":""),onclick:function(){
      if(m.k==="global"&&!team.sessions.length){showToast("Aucune session enregistrée");return}
      state.summaryMode=m.k;state.sortBy=null;render();
    }},m.l);
    if(state.summaryMode===m.k)b.style.background=m.c;
    return b;
  }));
  if(state.summaryMode==="sessions")
    return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},modeRow,
      h("div",{className:"content pad","data-scroll-key":"sessions"},renderSessionsPane(team)));
  if(state.summaryMode==="evals")
    return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},modeRow,
      h("div",{className:"content pad","data-scroll-key":"evals"},renderEvalsPane(season)));
  return renderStatsTable(team,modeRow);
}

function renderStatsTable(team,modeRow){
  var isG=state.summaryMode==="global";
  var players=isG?computeGlobalPlayers(team):teamViewPlayers(team);
  var view=VIEWS[state.viewIdx],gKeys=view.groups,gk=gKeys[state.groupIdx]||gKeys[0],g=SG[gk];
  var filtered=filterPos(players);

  function getT(p){return g.stats.reduce(function(s,st){return s+(p.stats[st.key]||0)},0)}
  function getPct(p,k){var t=getT(p);return t>0?Math.round((p.stats[k]/t)*100):0}
  var sorted=filtered.slice();
  if(state.sortBy)sorted.sort(function(a,b){
    var d=(b.stats[state.sortBy]||0)-(a.stats[state.sortBy]||0);
    return state.sortDir==="desc"?d:-d;
  });

  var viewRow=h("div",{className:"pill-row"},VIEWS.map(function(v,i){
    var b=h("button",{className:"pill"+(i===state.viewIdx?" active":""),onclick:function(){
      state.viewIdx=i;state.groupIdx=0;state.sortBy=null;saveNow();render();
    }},v.label);
    if(i===state.viewIdx)b.style.background="#F59E0B";
    return b;
  }));
  var filterBar=h("div",{className:"filter-bar"},renderPosFilter(),
    gKeys.length>1?h("div",{className:"sub-pills"},gKeys.map(function(k,i){
      var b=h("button",{className:"pill sm"+(state.groupIdx===i?" active":""),onclick:function(){state.groupIdx=i;state.sortBy=null;render()}},SG[k].name);
      if(state.groupIdx===i)b.style.background=SG[k].color;
      return b;
    })):null);

  var thead=h("tr",null,
    h("th",{className:"sticky",style:{textAlign:"left",color:"#94A3B8",fontWeight:"600"}},"Joueuse"),
    g.stats.map(function(s){
      return h("th",{className:"sortable",style:{textAlign:"center",color:g.color,fontWeight:"700",whiteSpace:"nowrap"},onclick:function(){
        if(state.sortBy===s.key)state.sortDir=state.sortDir==="desc"?"asc":"desc";
        else{state.sortBy=s.key;state.sortDir="desc"}
        render();
      }},s.label+(state.sortBy===s.key?(state.sortDir==="desc"?" ▼":" ▲"):""));
    }),
    h("th",{style:{textAlign:"center",color:"#F59E0B",fontWeight:"700"}},"Total"));

  var tbody=sorted.length?sorted.map(function(p){
    return h("tr",{style:{borderBottom:"1px solid #1E293B"}},
      h("td",{className:"sticky",style:{padding:"10px",fontWeight:"600",color:"#F8FAFC",background:"#0F172A",whiteSpace:"nowrap",textAlign:"left"}},
        (p.number?"#"+p.number+" ":"")+p.name,
        h("div",{style:{fontSize:"10px",color:"#64748B",fontWeight:"400"}},
          (p.position||"—")+(isG&&p.sessCount?" · "+plural(p.sessCount,"session"):""))),
      g.stats.map(function(s){
        return h("td",null,h("div",{className:"sum-val"},String(p.stats[s.key]||0)),h("div",{className:"sum-pct"},getPct(p,s.key)+"%"));
      }),
      h("td",null,h("div",{className:"sum-val",style:{color:"#F59E0B"}},String(getT(p)))));
  }):[h("tr",null,h("td",{colspan:String(g.stats.length+2),style:{padding:"30px",textAlign:"center",color:"#64748B"}},
    isG?"Aucune donnée cumulée":"Aucune statistique saisie"))];

  var totals=h("div",{className:"totals-bar"},g.stats.map(function(s){
    var t=filtered.reduce(function(sum,p){return sum+(p.stats[s.key]||0)},0);
    return h("div",{style:{textAlign:"center"}},h("div",{className:"t-lbl"},s.label),h("div",{className:"t-val",style:{color:g.color}},String(t)));
  }));
  var info=isG?h("div",{className:"sess-count"},"Cumulé sur "+plural(team.sessions.length,"session")+" · "+team.name):null;

  return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},
    modeRow,viewRow,filterBar,info,
    h("div",{className:"content",style:{overflowX:"auto"},"data-scroll-key":"summary-scroll"},
      h("table",{className:"sum-table"},h("thead",null,thead),h("tbody",null,tbody))),
    totals);
}

/* ── Évaluations compilées (vue entraîneur) ────────────────── */
function renderEvalsPane(season){
  var compiled=compileSubmissions(season);
  var ids=Object.keys(compiled);
  if(!ids.length)return h("div",null,
    h("div",{className:"hint"},"Aucune évaluation reçue. Créez une vue sélectionneur dans l'onglet 🎯 Sélection, faites-la remplir, puis soumettez-la."),
    h("button",{className:"btn btn-primary full",onclick:function(){state.tab="selection";state.selectionPane="views";render()}},"🎯 Créer une vue sélectionneur"));

  var rows=ids.map(function(pid){return compiled[pid]}).sort(function(a,b){return b.score-a.score});
  var wrap=h("div",null);
  wrap.appendChild(h("div",{className:"hint"},"Synthèse de ",h("b",null,plural(season.submissions.length,"soumission")),
    " provenant de ",plural(countSelectors(season),"sélectionneur"),". Score = moyenne des critères, toutes soumissions confondues."));

  wrap.appendChild(h("div",{className:"btn-row",style:{marginBottom:"12px"}},
    h("button",{className:"btn btn-warn sm",onclick:function(){openModal("applyreco")}},"⚡ Appliquer les avis au roster"),
    h("button",{className:"btn btn-export sm",onclick:function(){exportEvalsCSV(season,rows)}},"📤 Exporter (CSV)")));

  rows.forEach(function(c){
    var p=playerById(c.playerId),e=rosterEntry(season,c.playerId);
    var open=state.expandedPlayerId===c.playerId;
    var head=h("div",{className:"compile-row",onclick:function(){
      state.expandedPlayerId=open?null:c.playerId;render();
    }},
      h("span",{className:"score-pill",style:{background:scoreColor(c.score)+"22",color:scoreColor(c.score)}},c.score.toFixed(1)),
      h("div",{style:{flex:"1",minWidth:"0"}},
        h("div",{className:"pname"},(e&&e.number?"#"+e.number+" ":"")+fullName(p)),
        h("div",{className:"psub"},plural(c.n,"évaluation")+" · "+c.selectors.join(", "))),
      c.topReco?h("span",{className:"badge",style:{background:RECO_BY_KEY[c.topReco].color+"20",color:RECO_BY_KEY[c.topReco].color}},
        RECO_BY_KEY[c.topReco].icon+" "+c.reco[c.topReco]+"/"+c.n):null,
      h("span",{style:{color:"#475569"}},open?"▲":"▼"));
    wrap.appendChild(head);
    if(!open)return;
    var box=h("div",{className:"card"});
    box.appendChild(renderCritBars(c));
    box.appendChild(h("div",{className:"section-title"},"Avis"));
    box.appendChild(h("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap"}},RECOS.map(function(r){
      return h("span",{className:"badge",style:{background:r.color+"18",color:r.color,padding:"5px 10px"}},r.icon+" "+r.label+" : "+(c.reco[r.key]||0));
    })));
    if(e){
      box.appendChild(h("div",{className:"section-title"},"Statut dans la saison"));
      box.appendChild(h("div",{className:"reco-row"},RECOS.map(function(r){
        var target=RECO_TO_STATUS[r.key],on=e.status===target;
        var b=h("button",{className:"reco-btn"+(on?" on":""),onclick:function(){setRosterStatus(season,e,target);render()}},r.icon+" "+r.short);
        if(on){b.style.background=r.color;b.style.borderColor=r.color}
        return b;
      })));
    }
    if(c.notes.length){
      box.appendChild(h("div",{className:"section-title"},"Commentaires"));
      c.notes.forEach(function(n){box.appendChild(h("div",{className:"note-item"},h("b",null,n.by+" · "+fmtDay(n.at)),n.text))});
    }
    box.appendChild(h("div",{className:"section-title"},"Statistiques soumises"));
    box.appendChild(renderStatMini(c.stats));
    wrap.appendChild(box);
  });
  return wrap;
}
function countSelectors(season){
  var s={};season.submissions.forEach(function(sub){s[(sub.selectorName||sub.viewName||"?").trim()]=1});
  return Object.keys(s).length;
}
function exportEvalsCSV(season,rows){
  var head=["Numero","Joueuse","Position","Statut","Evaluations","Score"]
    .concat(CRITERIA.map(function(c){return c.label}))
    .concat(["Retenir","Recaller","Non_retenue"])
    .concat(ALL_STATS.map(function(s){return s.key}));
  var lines=[head.join(";")];
  rows.forEach(function(c){
    var p=playerById(c.playerId),e=rosterEntry(season,c.playerId);
    var r=[(e&&e.number)||"",fullName(p).replace(/;/g,","),(e&&e.position)||"",(e&&STATUSES[e.status].label)||"",c.n,c.score.toFixed(2)]
      .concat(CRITERIA.map(function(cr){var x=c.ratings[cr.key];return x&&x.n?x.avg.toFixed(2):""}))
      .concat([c.reco.select||0,c.reco.recall||0,c.reco.cut||0])
      .concat(ALL_STATS.map(function(s){return c.stats[s.key]||0}));
    lines.push(r.join(";"));
  });
  try{
    var blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
    var u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download="Evaluations_"+safeName(season.name)+"_"+stamp()+".csv";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u)},1000);
    showToast("📤 CSV exporté");
  }catch(e){showToast("⚠️ Export impossible")}
}

/* ══════════════════════════════════════════════════════════════
   RÔLE SÉLECTIONNEUR
   ⚠️ ANONYMAT : aucune de ces fonctions ne lit fullName / shortName.
   L'unique identifiant affiché est le NUMÉRO D'ATHLÈTE.
   ══════════════════════════════════════════════════════════════ */

/* Une « source » = une vue + le moyen d'obtenir le numéro de chaque joueuse */
function svSources(){
  var out=[];
  DB.seasons.forEach(function(s){
    s.selectorViews.forEach(function(v){out.push({view:v,kind:"local",season:s,seasonName:s.name})});
  });
  INBOX.views.forEach(function(v){out.push({view:v,kind:"inbox",season:null,seasonName:v.seasonName||"—"})});
  return out;
}
function svFind(id){
  var all=svSources();
  for(var i=0;i<all.length;i++)if(all[i].view.id===id)return all[i];
  return null;
}
function svNumber(src,pid){
  if(!src)return "";
  return src.kind==="local"?numOf(src.season,pid):((src.view.numbers||{})[pid]||"");
}
function svEntry(view,pid){
  if(!view.data[pid])view.data[pid]=mkEntryData();
  var d=view.data[pid];
  if(!d.stats)d.stats=emptyS();
  if(!d.ratings)d.ratings={};
  return d;
}
function svProgress(src){
  var v=src.view;
  var done=v.playerIds.filter(function(pid){return entryFilled(v,pid)}).length;
  return {done:done,total:v.playerIds.length,pct:v.playerIds.length?Math.round(done/v.playerIds.length*100):0};
}
/* Numéros triés numériquement — l'ordre d'affichage du sélectionneur */
function svOrdered(src){
  return src.view.playerIds.slice().sort(function(a,b){
    var na=parseInt(svNumber(src,a),10),nb=parseInt(svNumber(src,b),10);
    if(isNaN(na))na=9999;if(isNaN(nb))nb=9999;
    return na-nb;
  });
}

/* ── Liste des vues ────────────────────────────────────────── */

  wrap.appendChild(h("div",{className:"btn-row",style:{marginBottom:"12px"}},
    h("button",{className:"btn btn-import sm",onclick:importPacket},"📥 Importer un paquet")));

  if(!sources.length)wrap.appendChild(h("div",{className:"empty"},
    "Aucune vue disponible. Demandez à l'entraîneur un « paquet sélectionneur » (fichier .json) et importez-le ci-dessus."));

  sources.forEach(function(src){
    var v=src.view,pr=svProgress(src);
    var card=h("div",{className:"view-card"+(v.submittedAt?" submitted":"")});
    card.appendChild(h("div",{className:"row-between"},
      h("div",{style:{minWidth:"0"}},
        h("h4",null,v.name||"Vue sans nom"),
        h("div",{className:"muted"},src.seasonName+" · "+plural(v.playerIds.length,"athlète")+
          (src.kind==="inbox"?" · importée":""))),
      v.submittedAt?h("span",{className:"badge",style:{background:"#10B98122",color:"#34D399"}},"✅ Soumise"):null));
    card.appendChild(h("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap",marginTop:"8px"}},
      svOrdered(src).map(function(pid){
        return h("span",{className:"badge",style:{background:"#0F172A",color:entryFilled(v,pid)?"#34D399":"#94A3B8",borderColor:"#334155",fontSize:"12px",padding:"4px 9px"}},
          numLabel(svNumber(src,pid)));
      })));
    card.appendChild(h("div",{className:"progress"},h("i",{style:{width:pr.pct+"%"}})));
    card.appendChild(h("div",{className:"muted",style:{marginTop:"5px"}},pr.done+"/"+pr.total+" évaluées"));
    card.appendChild(h("div",{className:"btn-row",style:{marginTop:"10px"}},
      h("button",{className:"btn btn-warn sm",style:{flex:"1"},onclick:function(){
        state.svViewId=v.id;state.svPlayerId=null;state.tab="sv_eval";saveNow();render();
      }},"✏️ Évaluer"),
      h("button",{className:"btn btn-ghost sm",onclick:function(){
        state.svViewId=v.id;state.tab="sv_submit";saveNow();render();
      }},"📤 Soumettre"),
      src.kind==="inbox"?h("button",{className:"btn btn-danger-o xs",onclick:function(){
        if(!confirmAct("Retirer la vue « "+v.name+" » de cet appareil ?\nLes évaluations non soumises seront perdues."))return;
        INBOX.views=INBOX.views.filter(function(x){return x.id!==v.id});
        if(state.svViewId===v.id)state.svViewId=null;
        saveNow();render();
      }},"🗑️"):null));
    wrap.appendChild(card);
  });
  return h("div",{className:"content pad","data-scroll-key":"sv-views"},wrap);
}

/* ── Écran d'évaluation ────────────────────────────────────── */
function renderSvEval(){
  var src=state.svViewId?svFind(state.svViewId):null;
  if(!src){
    var all=svSources();
    if(!all.length)return emptyBlock("🎯","Aucune vue","Importez un paquet sélectionneur pour commencer.",
      h("button",{className:"btn btn-import",onclick:importPacket},"📥 Importer un paquet"));
    return emptyBlock("🎯","Choisissez une vue","Sélectionnez la vue que vous devez évaluer.",
      h("button",{className:"btn btn-primary",onclick:function(){state.tab="sv_views";render()}},"Voir mes vues"));
  }
  var v=src.view,ordered=svOrdered(src);
  if(!ordered.length)return emptyBlock("🎯",v.name,"Cette vue ne contient aucune athlète.",null);
  if(ordered.indexOf(state.svPlayerId)===-1)state.svPlayerId=null;

  var tiles=h("div",{className:"num-grid"},ordered.map(function(pid){
    var on=pid===state.svPlayerId,done=entryFilled(v,pid);
    var d=v.data[pid]||mkEntryData();
    var r=d.reco?RECO_BY_KEY[d.reco]:null;
    return h("button",{className:"num-tile"+(on?" active":"")+(done&&!on?" done":""),onclick:function(){
      state.svPlayerId=pid;state.svGroupIdx=0;render();
    }},h("span",null,numLabel(svNumber(src,pid))),
      h("span",{className:"st"},r?r.icon:(done?"•":"")));
  }));
  var strip=h("div",{style:{padding:"10px 12px",background:"#162032",borderBottom:"1px solid #1E293B",flexShrink:"0",maxHeight:"36vh",overflowY:"auto"},"data-scroll-key":"sv-tiles"},tiles);

  var body;
  if(!state.svPlayerId){
    body=h("div",{className:"quick-prompt"},h("div",{className:"arrow"},"↑"),
      h("div",{style:{fontSize:"14px"}},"Choisissez un numéro d'athlète"));
  } else {
    body=renderSvPlayerPanel(src,state.svPlayerId,ordered);
  }
  var pr=svProgress(src);
  var bar=h("div",{className:"ctx-bar"},
    h("button",{className:"grow",onclick:function(){state.tab="sv_views";render()}},h("span",null,"🎯"),
      h("span",{style:{fontWeight:"700",color:"#CBD5E1"}},v.name),h("span",{style:{opacity:".6"}},"▾")),
    h("span",{className:"muted"},pr.done+"/"+pr.total));

  return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},bar,strip,body,
    h("div",{className:"save-bar"},h("div",{className:"inner"},h("div",{style:{display:"flex",gap:"8px",alignItems:"center"}},
      h("button",{className:"btn btn-warn",style:{flex:"1"},onclick:function(){state.tab="sv_submit";render()}},"📤 Soumettre la vue"),
      renderAutoSave()))));
}

function renderSvPlayerPanel(src,pid,ordered){
  var v=src.view,d=svEntry(v,pid),num=svNumber(src,pid);
  var panel=h("div",{className:"quick-panel","data-scroll-key":"sv-panel"});

  /* En-tête : numéro seul */
  var idx=ordered.indexOf(pid);
  panel.appendChild(h("div",{className:"row-between",style:{marginBottom:"12px"}},
    h("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},
      h("span",{style:{fontSize:"30px",fontWeight:"800",color:"#FDE68A"}},numLabel(num)),
      h("span",{className:"muted"},"athlète "+(idx+1)+"/"+ordered.length)),
    h("div",{className:"btn-row"},
      h("button",{className:"btn btn-ghost xs",disabled:idx<=0,onclick:function(){state.svPlayerId=ordered[idx-1];render()}},"←"),
      h("button",{className:"btn btn-ghost xs",disabled:idx>=ordered.length-1,onclick:function(){state.svPlayerId=ordered[idx+1];render()}},"→"))));

  /* Critères notés 1–5 */
  var crits=v.criteria.filter(function(k){return CRIT_BY_KEY[k]});
  if(crits.length){
    panel.appendChild(h("div",{className:"section-title"},"Évaluation"));
    crits.forEach(function(k){
      var c=CRIT_BY_KEY[k];
      var valSpan=h("span",null,d.ratings[k]?(d.ratings[k]+"/"+RATING_MAX):c.desc);
      var scale=h("div",{className:"rate-scale"});
      for(var i=1;i<=RATING_MAX;i++)(function(n){
        var dot=h("button",{className:"rate-dot"+(d.ratings[k]===n?" on":""),onclick:function(){
          pushUndoView("Note "+c.label+" · "+numLabel(num),v);
          d.ratings[k]=(d.ratings[k]===n)?0:n;
          valSpan.textContent=d.ratings[k]?(d.ratings[k]+"/"+RATING_MAX):c.desc;
          Array.prototype.forEach.call(scale.children,function(el,j){
            el.className="rate-dot"+(d.ratings[k]===j+1?" on":"");
          });
          scheduleAutoSave();
        }},String(n));
        scale.appendChild(dot);
      })(i);
      panel.appendChild(h("div",{className:"crit-block"},
        h("div",{className:"ttl"},h("b",null,c.label),valSpan),scale));
    });
  }

  /* Statistiques observées */
  var groups=(v.groups&&v.groups.length?v.groups:SG_KEYS).filter(function(g){return SG[g]});
  if(groups.length){
    panel.appendChild(h("div",{className:"section-title"},"Statistiques observées"));
    groups.forEach(function(gk){
      var g=SG[gk];
      panel.appendChild(h("div",{className:"qp-group"},
        h("div",{className:"qp-group-title",style:{background:g.color+"20",color:g.color}},g.name),
        h("div",{className:"qp-stats-row"},g.stats.map(function(s){
          var countSpan=h("span",{className:"count"},String(d.stats[s.key]||0));
          var btn=h("button",{className:"qp-stat-btn",style:{borderColor:g.color,background:g.color+"15",color:"#F8FAFC"},onclick:function(){
            pushUndoView(numLabel(num)+" · "+s.label+" +1",v);
            d.stats[s.key]=(d.stats[s.key]||0)+1;
            countSpan.textContent=String(d.stats[s.key]);
            btn.style.background=g.color;btn.style.color="#fff";btn.style.transform="scale(1.05)";
            setTimeout(function(){btn.style.background=g.color+"15";btn.style.color="#F8FAFC";btn.style.transform="scale(1)"},180);
            scheduleAutoSave();
          }},countSpan,h("span",{className:"lbl"},s.label));
          var dec=h("button",{className:"qp-dec",onclick:function(){
            if(!d.stats[s.key])return;
            pushUndoView(numLabel(num)+" · "+s.label+" −1",v);
            d.stats[s.key]--;countSpan.textContent=String(d.stats[s.key]);scheduleAutoSave();
          }},"−");
          return h("div",{className:"qp-stat-cell"},btn,dec);
        }))));
    });
  }

  /* Recommandation */
  panel.appendChild(h("div",{className:"section-title"},"Recommandation"));
  var recoRow=h("div",{className:"reco-row"});
  RECOS.forEach(function(r){
    var b=h("button",{className:"reco-btn"+(d.reco===r.key?" on":""),onclick:function(){
      pushUndoView("Avis · "+numLabel(num),v);
      d.reco=(d.reco===r.key)?"":r.key;
      Array.prototype.forEach.call(recoRow.children,function(el,j){
        var rr=RECOS[j],on=d.reco===rr.key;
        el.className="reco-btn"+(on?" on":"");
        el.style.background=on?rr.color:"#0F172A";
        el.style.borderColor=on?rr.color:"#334155";
      });
      scheduleAutoSave();
    }},r.icon+" "+r.label);
    if(d.reco===r.key){b.style.background=r.color;b.style.borderColor=r.color}
    recoRow.appendChild(b);
  });
  panel.appendChild(recoRow);

  /* Commentaire */
  panel.appendChild(h("div",{className:"section-title"},"Commentaire"));
  var ta=h("textarea",{className:"txt",placeholder:"Observations sur l'athlète "+numLabel(num)+"…",rows:"3"});
  ta.value=d.note||"";
  ta.addEventListener("input",function(e){d.note=e.target.value;scheduleAutoSave()});
  panel.appendChild(ta);
  panel.appendChild(h("div",{style:{height:"14px"}}));
  return panel;
}

  var submitBtn=h("button",{className:"btn btn-save full",style:{marginTop:"16px"},onclick:function(){

    "Dernière soumission : "+fmtDate(v.submittedAt)+" · vous pouvez soumettre à nouveau après modification."));
  wrap.appendChild(h("div",{style:{height:"20px"}}));
  return h("div",{className:"content pad","data-scroll-key":"sv-submit"},wrap);
}

function openModal(type,ctx,input,input2){

  render();

    var el=document.querySelector(".modal input,.modal textarea");
    if(el&&!("ontouchstart" in window))el.focus();
  },40);
}
function closeModal(){state.modalType=null;state.modalCtx=null;state.modalInput="";state.modalInput2="";state.modalSel=[];state.modalDraft=null;state.editingSubteamId=null;state.editViewId=null;render()}

  return h("div",{className:"modal-bg",onclick:closeModal},
    h("div",{className:"modal",style:maxWidth?{maxWidth:maxWidth}:null,onclick:function(e){e.stopPropagation()}},
      h("h3",null,title),body,

function textField(placeholder,value,onchange,label){

  return label?h("div",{className:"field"},h("label",null,label),inp):inp;

function toggleGrid(items,isOn,onToggle){

    return modalShell("Appliquer les avis des sélectionneurs",
      h("div",null,h("div",{className:"muted",style:{marginBottom:"8px"}},
        "Le statut de chaque joueuse est aligné sur l'avis majoritaire reçu. Vous restez libre de le modifier ensuite."),list),
      [cancel,changes.length?h("button",{id:"modalOk",className:"btn btn-warn full",onclick:function(){
        changes.forEach(function(ch){setRosterStatus(season,ch.entry,ch.target)});
        closeModal();saveNow();showToast("⚡ "+plural(changes.length,"statut")+" mis à jour");
      }},"Appliquer ("+changes.length+")"):null],"440px");
  }
  return null;
}

/* ══════════════════════════════════════════════════════════════
   POSITION DE DÉFILEMENT
   ══════════════════════════════════════════════════════════════ */
var scrollPositions={};
function scrollKeyOf(el){return el.getAttribute("data-scroll-key")||el.className.split(" ")[0]}
function saveScrollPos(){
  var els=document.querySelectorAll(".content,.quick-panel,[data-scroll-key]");
  for(var i=0;i<els.length;i++){var k=scrollKeyOf(els[i]);if(k)scrollPositions[k]=els[i].scrollTop}
}
function restoreScrollPos(){
  requestAnimationFrame(function(){
    var els=document.querySelectorAll(".content,.quick-panel,[data-scroll-key]");
    for(var i=0;i<els.length;i++){
      var k=scrollKeyOf(els[i]);
      if(k&&scrollPositions[k]!=null)els[i].scrollTop=scrollPositions[k];
    }
  });
}

/* ══════════════════════════════════════════════════════════════
   RENDU PRINCIPAL
   ══════════════════════════════════════════════════════════════ */
var TITLES={
  season:"Saison 🗓️",players:"Joueuses 👥",summary:"Récapitulatif",selection:"Vues sélectionneur",
  sv_views:"Mes vues 🎯",sv_eval:"Évaluation",sv_submit:"Soumission"
};
function render(){
  saveScrollPos();
  var app=document.getElementById("app");if(!app)return;
  app.innerHTML="";
  var season=curSeason(),team=curTeam(),isCoach=state.role==="coach";
  var title=TITLES[state.tab]||"WonderStats";
  if(state.tab==="input")title=state.inputMode==="quick"?"Saisie rapide":"Saisie grille";

  /* Boutons d'en-tête */
  var leftEl=null,rightEl=null;
  if(isCoach&&state.tab==="input"&&team){
    var undoBtn=h("button",{className:"btn btn-undo xs",disabled:!undoStack.length,onclick:doUndo},"↩");
    undoBtn.id="undoBtn";
    leftEl=h("div",{style:{display:"flex",gap:"4px"}},undoBtn,
      h("button",{className:"btn btn-danger-o xs",onclick:function(){
        if(!confirmAct("Réinitialiser toutes les statistiques de la saisie en cours ?"))return;
        pushUndoStats("Réinitialisation");team.stats={};scheduleAutoSave();showToast("🔄 Réinitialisé");render();
      }},"Reset"));
    var isQuick=state.inputMode==="quick";
    rightEl=h("button",{className:"mode-toggle"+(isQuick?"":" active"),onclick:function(){
      state.inputMode=isQuick?"grid":"quick";state.quickPlayer=null;saveNow();render();
    }},isQuick?"Grille":"Rapide");
  } else if(!isCoach&&state.tab==="sv_eval"){
    var ub=h("button",{className:"btn btn-undo xs",disabled:!undoStack.length,onclick:doUndo},"↩");
    ub.id="undoBtn";leftEl=ub;
    rightEl=roleBadge();
  }
  if(!rightEl)rightEl=roleBadge();
  if(!leftEl&&isCoach&&state.tab==="summary"&&team)
    leftEl=h("button",{className:"btn btn-save xs",onclick:function(){openModal("savesession")}},"💾");

  app.appendChild(renderHeader(title,leftEl,rightEl));

  /* Barres de contexte */
  if(isCoach){
    app.appendChild(renderSeasonBar());
    if(season&&(state.tab==="input"||state.tab==="summary"||state.tab==="season"))app.appendChild(renderTeamBar());
  }

  /* Contenu */
  var content;
  if(isCoach){
    if(!season)content=emptyBlock("🏐","WonderStats","Créez votre première saison pour démarrer.",
      h("button",{className:"btn btn-primary",onclick:function(){openModal("newseason")}},"+ Créer une saison"));
    else if(state.tab==="season")content=renderSeasonTab();
    else if(state.tab==="players")content=renderPlayersTab();
    else if(state.tab==="input")content=renderInputTab();
    else if(state.tab==="summary")content=renderSummaryTab();
    else if(state.tab==="selection")content=renderSelectionTab();
    else content=renderSeasonTab();
  } else {
    if(state.tab==="sv_eval")content=renderSvEval();
    else if(state.tab==="sv_submit")content=renderSvSubmit();
    else content=renderSvViews();
  }
  app.appendChild(content);
  app.appendChild(renderTabBar());

  var modal=renderModal();if(modal)app.appendChild(modal);
  if(state.toast)app.appendChild(h("div",{className:"toast"},state.toast));
  if(state.updateReady)app.appendChild(h("div",{className:"update-bar"},
    h("span",null,"Une nouvelle version est disponible."),
    h("button",{className:"btn btn-primary xs",onclick:function(){saveNow();location.reload()}},"Mettre à jour")));
  restoreScrollPos();
}

/* ══════════════════════════════════════════════════════════════
   DÉMARRAGE
   ══════════════════════════════════════════════════════════════ */
loadAll();
render();

/* Re-rendu au redimensionnement uniquement si aucun champ n'a le focus
   (le clavier virtuel déclenche « resize » et détruirait la saisie). */
var resizeTimer=null,lastW=window.innerWidth,lastH=window.innerHeight;
window.addEventListener("resize",function(){
  if(resizeTimer)clearTimeout(resizeTimer);
  resizeTimer=setTimeout(function(){
    resizeTimer=null;
    var a=document.activeElement;
    if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"))return;
    var w=window.innerWidth,h2=window.innerHeight;
    if(w===lastW&&Math.abs(h2-lastH)<120)return;   // simple apparition du clavier
    lastW=w;lastH=h2;render();
  },220);
});
window.addEventListener("beforeunload",function(){saveAll()});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")saveAll()});

/* Stockage persistant : évite l'éviction des données par le navigateur */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});

/* iOS standalone : empêche le rebond du body sans bloquer les zones défilables */
var SCROLLABLE=".content,.quick-panel,.court-panel,.player-strip,.court-toggle-grid,.modal,.pill-row,.sub-pills,.pos-row,.team-bar,.sess-grid,.subteam-row,.sum-table,.num-grid,textarea,[data-scroll-key]";
document.body.addEventListener("touchmove",function(e){
  if(!(e.target.closest&&e.target.closest(SCROLLABLE)))e.preventDefault();
},{passive:false});
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    reg.addEventListener("updatefound",function(){
      var w=reg.installing;if(!w)return;
      w.addEventListener("statechange",function(){
        // Ne jamais recharger en pleine saisie : on propose la mise à jour.
        if(w.state==="installed"&&navigator.serviceWorker.controller){
          state.updateReady=true;render();
        }
      });
    });
  }).catch(function(){});
}
</script>
</body>
