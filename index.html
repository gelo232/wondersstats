<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WonderStats">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon.png">
<meta name="theme-color" content="#1E3A5F">
<title>WonderStats</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0F172A;color:#E2E8F0}
button,input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden;background:#0F172A}
@media(min-width:600px){#app{max-width:700px}}
@media(min-width:900px){#app{max-width:1040px}}

/* ── HEADER ───────────────────────────────────────── */
.header{background:linear-gradient(135deg,#1E3A5F,#0F172A);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #334155;flex-shrink:0;padding-top:max(12px,env(safe-area-inset-top));gap:8px}
@media(min-width:600px){.header{padding:16px 24px}}
.header h1{margin:0;font-size:16px;font-weight:700;color:#F8FAFC;letter-spacing:.3px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:600px){.header h1{font-size:20px}}
.header-side{min-width:84px;display:flex;gap:4px;flex-shrink:0}
.header-side.right{justify-content:flex-end}
.role-badge{padding:4px 9px;border-radius:14px;font-size:10px;font-weight:800;border:1.5px solid;cursor:pointer;white-space:nowrap;background:transparent;letter-spacing:.4px}
.role-badge.coach{border-color:#60A5FA;color:#60A5FA}
.role-badge.selector{border-color:#F59E0B;color:#F59E0B}

/* ── CONTEXT BARS ─────────────────────────────────── */
.ctx-bar{background:#162032;border-bottom:1px solid #1E293B;padding:7px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;font-size:12px;color:#94A3B8}
.ctx-bar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-bar button{background:transparent;border:none;color:inherit;font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;min-width:0}
.team-bar{background:#162032;border-bottom:1px solid #1E293B;padding:6px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;overflow-x:auto}
.team-chip{padding:5px 12px;border-radius:16px;border:1.5px solid #334155;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;background:transparent;color:#94A3B8;transition:all .15s}
.team-chip.active{background:#3B82F6;border-color:#60A5FA;color:#fff}
.team-chip.add{border-style:dashed;color:#64748B}

/* ── TABS ─────────────────────────────────────────── */
.tab-bar{display:flex;background:#1E293B;border-top:1px solid #334155;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;padding:10px 2px 8px;border:none;background:none;cursor:pointer;color:#94A3B8;font-weight:400;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid transparent;transition:all .2s;min-width:0}
.tab-btn.active{color:#60A5FA;font-weight:700;border-top-color:#60A5FA}
.tab-btn.sel.active{color:#F59E0B;border-top-color:#F59E0B}
.tab-btn .ico{font-size:17px}
.tab-btn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media(min-width:600px){.tab-btn{padding:14px 4px 12px;font-size:13px}.tab-btn .ico{font-size:22px}}

/* ── BUTTONS ──────────────────────────────────────── */
.btn{padding:10px 18px;border-radius:8px;border:none;font-weight:600;font-size:14px;cursor:pointer;transition:all .15s}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.xs{padding:4px 8px;font-size:11px}
.btn.full{width:100%}
.btn-primary{background:#3B82F6;color:#fff}
.btn-save{background:#10B981;color:#fff}
.btn-warn{background:#F59E0B;color:#0F172A}
.btn-danger-o{background:transparent;border:1.5px solid #EF4444;color:#EF4444}
.btn-ghost{background:transparent;border:1.5px solid #94A3B8;color:#94A3B8}
.btn-export{background:transparent;border:1.5px solid #F59E0B;color:#F59E0B}
.btn-import{background:transparent;border:1.5px solid #8B5CF6;color:#8B5CF6}
.btn-undo{background:transparent;border:1.5px solid #60A5FA;color:#60A5FA}
.btn:disabled{background:#475569;color:#94A3B8;cursor:default;border-color:#475569;opacity:.7}

/* ── PILLS / FILTERS ──────────────────────────────── */
.pill-row{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#0F172A;border-bottom:1px solid #1E293B;flex-shrink:0}
@media(min-width:600px){.pill-row{padding:12px 16px;justify-content:center}}
.pill{padding:7px 14px;border-radius:20px;border:none;white-space:nowrap;font-weight:600;font-size:12px;cursor:pointer;transition:all .15s;background:#1E293B;color:#94A3B8}
.pill.sm{padding:5px 10px;font-size:11px}
@media(min-width:600px){.pill{padding:9px 18px;font-size:14px}}
.pill.active{color:#fff}
.filter-bar{padding:6px 12px;background:#0F172A;border-bottom:1px solid #1E293B;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
@media(min-width:600px){.filter-bar{padding:8px 16px;flex-direction:row;align-items:center;justify-content:center;flex-wrap:wrap}}
.pos-row{display:flex;gap:4px;overflow-x:auto}
@media(min-width:600px){.pos-row{gap:6px}}
.sub-pills{display:flex;gap:5px;overflow-x:auto}
@media(min-width:600px){.sub-pills{justify-content:center}}

/* ── LAYOUT ───────────────────────────────────────── */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:14px 12px}
@media(min-width:600px){.pad{padding:20px 24px}}
.card{background:#1E293B;border-radius:12px;padding:14px;border:1px solid #334155;margin-bottom:10px}
.card.tight{padding:10px 12px}
.section-title{font-size:11px;font-weight:800;color:#64748B;letter-spacing:.8px;text-transform:uppercase;margin:18px 0 8px}
.section-title:first-child{margin-top:0}
.muted{color:#64748B;font-size:12px}
.empty{padding:40px 20px;text-align:center;color:#64748B;font-size:13px}
.hint{background:rgba(59,130,246,.08);border:1px solid rgba(96,165,250,.25);border-radius:10px;padding:10px 12px;font-size:12px;color:#93C5FD;line-height:1.5;margin-bottom:12px}
.hint.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3);color:#FCD34D}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:600px){.grid2{grid-template-columns:1fr 1fr}}

/* ── FORM ─────────────────────────────────────────── */
.txt{width:100%;background:#0F172A;border:1px solid #334155;border-radius:8px;padding:10px 12px;color:#F8FAFC;font-size:14px;outline:none}
.txt:focus{border-color:#60A5FA}
.txt.err{border-color:#EF4444}
textarea.txt{resize:vertical;min-height:64px;line-height:1.5}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:700;color:#64748B;margin-bottom:4px;letter-spacing:.4px}

/* ── PLAYER / ROSTER ROWS ─────────────────────────── */
.list-row{display:flex;gap:10px;align-items:center;background:#1E293B;border-radius:10px;padding:9px 11px;border:1px solid #334155;margin-bottom:6px;transition:opacity .2s,transform .2s}
.list-row.dragging{opacity:.4;transform:scale(.97)}
.list-row.drag-over{border-color:#60A5FA}
.list-row .body{flex:1;min-width:0}
.list-row .pname{font-size:14px;font-weight:600;color:#F8FAFC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .psub{font-size:11px;color:#64748B;margin-top:2px}
.num-badge{width:44px;height:38px;border-radius:8px;background:#0F172A;border:1.5px solid #334155;color:#F8FAFC;font-weight:800;font-size:15px;text-align:center;flex-shrink:0;outline:none}
.num-badge:focus{border-color:#60A5FA}
.num-badge.dup{border-color:#EF4444;color:#FCA5A5}
.drag-handle{cursor:grab;color:#475569;font-size:16px;padding:2px 2px;touch-action:none;user-select:none;flex-shrink:0}
.icon-btn{background:none;border:none;color:#475569;font-size:14px;cursor:pointer;padding:5px;flex-shrink:0}
.icon-btn:hover{color:#EF4444}
.pos-btns{display:flex;gap:3px;flex-wrap:wrap}
.pos-btn{padding:6px 8px;border-radius:7px;border:2px solid #334155;font-size:11px;font-weight:700;cursor:pointer;min-width:34px;text-align:center;background:#0F172A;color:#94A3B8;transition:all .15s}
.pos-btn.active{background:#6366F1;border-color:#818CF8;color:#fff}
@media(min-width:600px){.pos-btn{padding:8px 11px;font-size:13px;min-width:40px}}
.badge{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap;border:1px solid transparent}
.status-btns{display:flex;gap:4px;flex-shrink:0}
.st-btn{width:34px;height:34px;border-radius:8px;border:1.5px solid #334155;background:#0F172A;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0}
.st-btn.on{color:#fff}
.counter{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:#0F172A;color:#94A3B8}

/* ── STAT GRID / QUICK INPUT (saisie) ─────────────── */
.grid-header{display:flex;padding:8px 12px;background:#1E293B;border-bottom:1px solid #334155;align-items:center;position:sticky;top:0;z-index:3}
@media(min-width:600px){.grid-header{padding:10px 16px}}
.grid-header .lbl{font-size:11px;color:#64748B;font-weight:600}
.grid-header .stat-labels{display:flex;flex:1;justify-content:space-around}
.grid-header .stat-lbl{text-align:center;font-size:10px;font-weight:700}
@media(min-width:600px){.grid-header .stat-lbl{font-size:12px}}
.grid-row{display:flex;align-items:center;padding:5px 12px;border-bottom:1px solid #1E293B}
@media(min-width:600px){.grid-row{padding:6px 16px}}
.grid-row .pname{font-size:13px;font-weight:600;color:#F8FAFC}
@media(min-width:600px){.grid-row .pname{font-size:14px}}
.grid-row .ppos{font-size:10px;color:#64748B}
.grid-row .stats-cells{display:flex;flex:1;justify-content:space-around}
.stat-cell{display:flex;flex-direction:column;align-items:center}
.stat-btn{width:44px;height:44px;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
@media(min-width:600px){.stat-btn{width:52px;height:52px;font-size:20px}}
.dec-btn{margin-top:2px;font-size:11px;background:none;border:none;color:#64748B;cursor:pointer;padding:3px 10px}
.cards-grid{display:grid;grid-template-columns:1fr;gap:8px;max-width:700px;margin:0 auto}
@media(min-width:600px){.cards-grid{grid-template-columns:1fr 1fr}}
.p-card{background:#1E293B;border-radius:10px;padding:10px 14px;border:1px solid #334155}
.p-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag-btn{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none}
.side-layout{display:flex;height:100%}
.side-nav{width:110px;background:#1E293B;border-right:1px solid #334155;overflow-y:auto;flex-shrink:0;padding:8px 0}
.side-btn{display:block;width:100%;padding:12px 14px;border:none;text-align:left;background:transparent;border-left:3px solid transparent;color:#94A3B8;font-weight:700;font-size:13px;cursor:pointer}
.side-btn.active{border-left-color:currentColor;background:rgba(255,255,255,.05)}
.player-strip{display:flex;gap:6px;padding:8px 12px;flex-shrink:0;background:#162032;border-bottom:1px solid #1E293B;flex-wrap:wrap;justify-content:center;max-height:132px;overflow-y:auto}
.player-chip{padding:6px 10px;border-radius:12px;border:2px solid #334155;font-size:12px;font-weight:700;min-width:48px;text-align:center;background:#1E293B;color:#94A3B8;cursor:pointer;transition:all .15s;touch-action:manipulation;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.player-chip.active{border-color:#3B82F6;background:#1E3A5F;color:#fff}
.chip-num{font-size:11px;opacity:.7}
.chip-name{font-size:12px;max-width:80px;word-break:break-word}
.court-bar{padding:8px 12px;background:#162032;border-bottom:1px solid #1E293B;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#94A3B8;flex-shrink:0}
.court-panel{padding:10px 12px;background:#0F172A;border-bottom:1px solid #1E293B;flex-shrink:0;max-height:40vh;overflow-y:auto}
.court-toggle-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.court-toggle{padding:6px 10px;border-radius:8px;border:1.5px solid #334155;font-size:12px;font-weight:600;background:#1E293B;color:#64748B;cursor:pointer;transition:all .15s;touch-action:manipulation;text-align:left}
.court-toggle.on{border-color:#3B82F6;background:#1E3A5F;color:#fff}
.subteam-row{display:flex;gap:6px;flex-wrap:wrap}
.subteam-chip{padding:5px 12px;border-radius:16px;border:1.5px solid #334155;font-size:12px;font-weight:600;white-space:nowrap;background:transparent;color:#94A3B8;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.subteam-chip.active{background:#10B981;border-color:#34D399;color:#fff}
.subteam-edit{background:none;border:none;font-size:10px;cursor:pointer;padding:0 2px;color:inherit;opacity:.7}
.quick-panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px}
@media(min-width:600px){.quick-panel{padding:12px 16px}}
.qp-group{margin-bottom:10px}
.qp-group-title{font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;margin-bottom:4px;display:inline-block}
.qp-stats-row{display:flex;gap:6px;flex-wrap:wrap}
.qp-stat-btn{flex:1;min-width:70px;height:56px;border-radius:12px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:2px solid;transition:all .12s;touch-action:manipulation;-webkit-user-select:none;user-select:none}
@media(min-width:600px){.qp-stat-btn{min-width:90px;height:64px}}
.qp-stat-btn .count{font-size:20px;font-weight:800;line-height:1}
.qp-stat-btn .lbl{font-size:10px;font-weight:600;opacity:.8;margin-top:2px}
.qp-dec{font-size:11px;background:none;border:none;color:#64748B;cursor:pointer;padding:2px 10px;touch-action:manipulation}
.qp-stat-cell{display:flex;flex-direction:column;align-items:center;flex:1;min-width:70px}
@media(min-width:600px){.qp-stat-cell{min-width:90px}}
.mode-toggle{padding:4px 10px;border-radius:12px;border:1.5px solid #475569;font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:#94A3B8;transition:all .15s}
.mode-toggle.active{border-color:#F59E0B;color:#F59E0B}
.quick-prompt{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#64748B;padding:30px;text-align:center}
.quick-prompt .arrow{font-size:32px;margin-bottom:8px}
.save-bar{padding:10px 16px;background:#0F172A;border-top:1px solid #1E293B;flex-shrink:0}
@media(min-width:600px){.save-bar{padding:12px 24px}}
.save-bar .inner{max-width:460px;margin:0 auto}

/* ── TABLES ───────────────────────────────────────── */
.sum-table{width:100%;border-collapse:collapse;font-size:12px}
@media(min-width:600px){.sum-table{font-size:14px}}
.sum-table thead{position:sticky;top:0;z-index:3}
.sum-table th{padding:8px 6px;user-select:none;background:#1E293B}
@media(min-width:600px){.sum-table th,.sum-table td{padding:12px 10px}}
.sum-table th.sortable{cursor:pointer}
.sum-table td{padding:10px 6px;text-align:center;color:#E2E8F0}
.sum-table .sticky{position:sticky;left:0;z-index:1}
.sum-val{font-weight:700;font-size:16px}
@media(min-width:600px){.sum-val{font-size:18px}}
.sum-pct{font-size:10px;color:#64748B}
.totals-bar{padding:10px 12px;background:#1E293B;border-top:1px solid #334155;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;flex-shrink:0;overflow-x:auto}
@media(min-width:600px){.totals-bar{padding:12px 16px;gap:20px}}
.totals-bar .t-val{font-size:16px;font-weight:700}
@media(min-width:600px){.totals-bar .t-val{font-size:18px}}
.totals-bar .t-lbl{font-size:10px;color:#64748B}
@media(min-width:600px){.totals-bar .t-lbl{font-size:12px}}
.sess-grid{display:grid;grid-template-columns:1fr;gap:10px;max-width:700px;margin:0 auto}
@media(min-width:600px){.sess-grid{grid-template-columns:1fr 1fr}}
.sess-card{background:#1E293B;border-radius:10px;padding:14px;border:1px solid #334155;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sess-count{font-size:11px;color:#64748B;text-align:center;margin:4px 0 6px}

/* ── SELECTOR (rôle sélectionneur) ────────────────── */
.num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px}
.num-tile{height:62px;border-radius:12px;border:2px solid #334155;background:#1E293B;color:#94A3B8;font-weight:800;font-size:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .15s;touch-action:manipulation;padding:0}
.num-tile.active{border-color:#F59E0B;background:#422006;color:#FDE68A}
.num-tile.done{border-color:#10B981}
.num-tile .st{font-size:9px;font-weight:700;opacity:.8;letter-spacing:.3px}
.rate-scale{display:flex;gap:5px}
.rate-dot{flex:1;height:40px;border-radius:9px;border:1.5px solid #334155;background:#0F172A;color:#64748B;font-weight:800;font-size:14px;cursor:pointer;transition:all .12s;touch-action:manipulation;padding:0}
.rate-dot.on{background:#6366F1;border-color:#818CF8;color:#fff}
.crit-block{margin-bottom:12px}
.crit-block .ttl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.crit-block .ttl b{font-size:13px;color:#F8FAFC;font-weight:700}
.crit-block .ttl span{font-size:10px;color:#64748B}
.reco-row{display:flex;gap:6px}
.reco-btn{flex:1;padding:11px 6px;border-radius:10px;border:2px solid #334155;background:#0F172A;color:#94A3B8;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;touch-action:manipulation}
.reco-btn.on{color:#fff}
.view-card{background:#1E293B;border-radius:12px;padding:14px;border:1px solid #334155;margin-bottom:10px}
.view-card.submitted{border-color:#10B981}
.view-card h4{font-size:15px;color:#F8FAFC;margin:0 0 3px}
.progress{height:6px;border-radius:3px;background:#0F172A;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:#10B981;transition:width .3s}
.stat-mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.stat-mini span{font-size:10px;background:#0F172A;border-radius:5px;padding:2px 6px;color:#94A3B8}
.score-pill{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:4px 8px;border-radius:8px;font-weight:800;font-size:14px}
.bar-mini{height:5px;border-radius:3px;background:#0F172A;overflow:hidden;width:72px}
.bar-mini i{display:block;height:100%}
.compile-row{display:flex;align-items:center;gap:10px;padding:10px 11px;background:#1E293B;border:1px solid #334155;border-radius:10px;margin-bottom:6px;cursor:pointer}
.note-item{background:#0F172A;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12px;color:#CBD5E1;line-height:1.5}
.note-item b{color:#94A3B8;font-size:10px;display:block;margin-bottom:2px;font-weight:700;letter-spacing:.3px}

/* ── MODAL / TOAST ────────────────────────────────── */
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:99;padding:18px}
.modal{background:#1E293B;border-radius:16px;padding:20px;width:100%;max-width:400px;border:1px solid #334155;max-height:86%;overflow-y:auto}
.modal h3{margin:0 0 14px;color:#F8FAFC;font-size:18px}
.modal input,.modal textarea,.modal select{width:100%;background:#0F172A;border:1px solid #334155;border-radius:8px;padding:11px 13px;color:#F8FAFC;font-size:15px;outline:none;margin-bottom:12px}
.toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#334155;color:#F8FAFC;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:fadeIn .2s ease;max-width:88%;text-align:center}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.autosave-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:#64748B;padding:4px 0}
.autosave-indicator .dot{width:6px;height:6px;border-radius:50%;background:#10B981;flex-shrink:0}
.autosave-indicator.saving .dot{background:#F59E0B;animation:pulse .6s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.data-actions{display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.update-bar{position:absolute;bottom:0;left:0;right:0;background:#1E3A5F;border-top:1px solid #3B82F6;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:90;font-size:12px;color:#DBEAFE}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   WonderStats v3 — application mono-fichier, hors-ligne, sans dépendance
   Modèle : base de joueuses → saisons → (roster · équipes · vues
   sélectionneur · soumissions). Toute référence à une joueuse passe
   par un identifiant stable (playerId), jamais par un index.
   ══════════════════════════════════════════════════════════════ */
var APP_VERSION = "3.0";

/* ─── Constantes métier ─────────────────────────────────────── */
var POSITIONS=[{key:"ALL",label:"Toutes"},{key:"NONE",label:"—"},{key:"S",label:"S"},{key:"OH",label:"OH"},{key:"OPP",label:"OPP"},{key:"MB",label:"MB"},{key:"L",label:"L"}];
var POS_LABELS={S:"Passeuse",OH:"Réceptionneuse-attaquante",OPP:"Pointue",MB:"Centrale",L:"Libéro"};

var SG={
  services:{name:"Services",color:"#3B82F6",stats:[{key:"srv_ace",label:"Ace"},{key:"srv_in",label:"En jeu"},{key:"srv_err",label:"Erreur"}]},
  reception:{name:"Réception",color:"#10B981",stats:[{key:"rec_in",label:"En jeu"},{key:"rec_out",label:"Hors sys."}]},
  passes:{name:"Passes",color:"#8B5CF6",stats:[{key:"pas_att",label:"Attaquable"},{key:"pas_out",label:"Hors sys."}]},
  attaques:{name:"Attaques",color:"#EF4444",stats:[{key:"atk_kill",label:"Kill"},{key:"atk_ok",label:"Réussie"},{key:"atk_err",label:"Erreur"}]},
  blocs:{name:"Blocs",color:"#F59E0B",stats:[{key:"blk_kill",label:"Kill"},{key:"blk_solo",label:"Solo"},{key:"blk_aid",label:"Aide"},{key:"blk_err",label:"Erreur"}]},
  defense:{name:"Défense",color:"#06B6D4",stats:[{key:"def_ok",label:"Réussie"},{key:"def_out",label:"Hors sys."},{key:"sup_in",label:"Soutien"},{key:"sup_err",label:"Sout. err."}]},
  habiletes:{name:"Habiletés",color:"#EC4899",stats:[{key:"hab_ctrl",label:"Contrôlée"},{key:"hab_appel",label:"Avec appel"},{key:"hab_couv",label:"Couverture"},{key:"hab_free",label:"Gratuite"}]}
};
var SG_KEYS=Object.keys(SG);
var VIEWS=[
  {key:"service",label:"🏐 Service",groups:["services"]},
  {key:"rec_atk",label:"⚡ Réc-Att",groups:["reception","passes","attaques"]},
  {key:"transition",label:"🔄 Relance",groups:["blocs","defense","passes","attaques"]},
  {key:"habiletes",label:"🎯 Habiletés",groups:["habiletes"]},
  {key:"all",label:"📋 Toutes",groups:SG_KEYS.slice()}
];
var ALL_STATS=[];SG_KEYS.forEach(function(k){SG[k].stats.forEach(function(s){ALL_STATS.push(s)})});
var STAT_LABEL={};ALL_STATS.forEach(function(s){STAT_LABEL[s.key]=s.label});

/* Critères d'évaluation qualitative utilisés par les sélectionneurs */
var CRITERIA=[
  {key:"tech",label:"Technique",desc:"Qualité et constance des gestes"},
  {key:"phys",label:"Physique",desc:"Détente, vitesse, endurance"},
  {key:"iq",label:"Lecture du jeu",desc:"Anticipation, décisions"},
  {key:"att",label:"Attitude",desc:"Coachabilité, énergie, esprit d'équipe"},
  {key:"pot",label:"Potentiel",desc:"Marge de progression"}
];
var CRIT_BY_KEY={};CRITERIA.forEach(function(c){CRIT_BY_KEY[c.key]=c});
var RATING_MAX=5;

var RECOS=[
  {key:"select",label:"Retenir",short:"Retenir",color:"#10B981",icon:"✅"},
  {key:"recall",label:"Recaller",short:"Recaller",color:"#F59E0B",icon:"🔁"},
  {key:"cut",label:"Non retenue",short:"Couper",color:"#EF4444",icon:"⛔"}
];
var RECO_BY_KEY={};RECOS.forEach(function(r){RECO_BY_KEY[r.key]=r});

/* Statuts d'une joueuse dans le roster d'une saison */
var STATUS_ORDER=["selected","recalled","candidate","cut"];
var STATUSES={
  candidate:{label:"Candidate",color:"#64748B",icon:"◻️"},
  recalled:{label:"Recallée",color:"#F59E0B",icon:"🔁"},
  selected:{label:"Retenue",color:"#10B981",icon:"✅"},
  cut:{label:"Non retenue",color:"#EF4444",icon:"⛔"}
};
/* Recommandation de sélectionneur → statut de roster */
var RECO_TO_STATUS={select:"selected",recall:"recalled",cut:"cut"};

/* ─── Utilitaires ───────────────────────────────────────────── */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function emptyS(){var o={};for(var i=0;i<ALL_STATS.length;i++)o[ALL_STATS[i].key]=0;return o}
function normStats(s){var o=emptyS();if(s)for(var i=0;i<ALL_STATS.length;i++){var k=ALL_STATS[i].key;var v=s[k];if(typeof v==="number"&&isFinite(v)&&v>0)o[k]=Math.round(v)}return o}
function sumStats(s){var t=0;for(var i=0;i<ALL_STATS.length;i++)t+=s[ALL_STATS[i].key]||0;return t}
function hasStats(s){return sumStats(s)>0}
function addStats(dst,src){for(var i=0;i<ALL_STATS.length;i++){var k=ALL_STATS[i].key;dst[k]+=(src&&src[k])||0}return dst}
function cleanNum(v){return String(v==null?"":v).replace(/\D/g,"").slice(0,3)}
function nowISO(){return new Date().toISOString()}
function fmtDate(iso){try{return new Date(iso).toLocaleDateString("fr-CA",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return iso||""}}
function fmtDay(iso){try{return new Date(iso).toLocaleDateString("fr-CA",{year:"numeric",month:"long",day:"numeric"})}catch(e){return iso||""}}
function plural(n,s,p){return n+" "+(n>1?(p||s+"s"):s)}
function isTablet(){return window.innerWidth>=600}
function isLand(){return window.innerWidth>window.innerHeight}

/* ─── Fabriques ─────────────────────────────────────────────── */
function mkDbPlayer(o){
  return Object.assign({id:uid(),firstName:"",lastName:"",birthYear:"",notes:"",archived:false,createdAt:nowISO()},o||{});
}
function mkRosterEntry(playerId,number,position){
  return {playerId:playerId,number:cleanNum(number),position:position||"",status:"candidate",note:""};
}
function mkTeam(name){
  return {id:uid(),name:name||"Équipe",playerIds:[],lineup:[],subteams:[],stats:{},sessions:[]};
}
function mkSeason(name){
  var t=mkTeam("Équipe A");
  return {id:uid(),name:name||("Saison "+new Date().getFullYear()),createdAt:nowISO(),archived:false,
          roster:[],teams:[t],activeTeamId:t.id,selectorViews:[],submissions:[]};
}
function mkSelectorView(o){
  return Object.assign({id:uid(),name:"",selectorName:"",playerIds:[],
    criteria:CRITERIA.map(function(c){return c.key}),
    groups:SG_KEYS.slice(),
    data:{},createdAt:nowISO(),submittedAt:null,submissionCount:0,origin:"local",seasonName:""},o||{});
}
function mkEntryData(){return {stats:emptyS(),ratings:{},reco:"",note:""}}

/* ─── Base de données ───────────────────────────────────────── */
var DB={version:3,players:[],seasons:[],activeSeasonId:null};

/* Vues sélectionneur importées d'un autre appareil (rôle sélectionneur autonome) */
var INBOX={views:[]};

/* ─── État de l'interface ───────────────────────────────────── */
var state={
  role:"coach",                 // coach | selector
  tab:"season",                 // onglet actif (rôle courant)
  seasonPane:"selection",       // selection | teams | seasons
  playersPane:"db",             // db | roster
  summaryMode:"session",        // session | global | evals | sessions
  selectionPane:"views",        // views | submissions
  viewIdx:0, groupIdx:0, posFilter:"ALL", expandedGroup:null,
  sortBy:null, sortDir:"desc",
  inputMode:"quick", quickPlayer:null, courtPanelOpen:false,
  statusFilter:"all", search:"",
  toast:null, modalType:null, modalInput:"", modalInput2:"", modalSel:[], modalCtx:null, modalDraft:null,
  editingSubteamId:null, editViewId:null,
  svViewId:null, svPlayerId:null, svGroupIdx:0,
  expandedPlayerId:null,
  updateReady:false
};

/* ─── Accès ─────────────────────────────────────────────────── */
function curSeason(){for(var i=0;i<DB.seasons.length;i++)if(DB.seasons[i].id===DB.activeSeasonId)return DB.seasons[i];return DB.seasons[0]||null}
function curTeam(){var s=curSeason();if(!s)return null;for(var i=0;i<s.teams.length;i++)if(s.teams[i].id===s.activeTeamId)return s.teams[i];return s.teams[0]||null}
function playerById(id){for(var i=0;i<DB.players.length;i++)if(DB.players[i].id===id)return DB.players[i];return null}
function rosterEntry(season,pid){if(!season)return null;for(var i=0;i<season.roster.length;i++)if(season.roster[i].playerId===pid)return season.roster[i];return null}
function seasonById(id){for(var i=0;i<DB.seasons.length;i++)if(DB.seasons[i].id===id)return DB.seasons[i];return null}
function viewById(season,id){if(!season)return null;for(var i=0;i<season.selectorViews.length;i++)if(season.selectorViews[i].id===id)return season.selectorViews[i];return null}

function fullName(p){
  if(!p)return "—";
  var n=((p.firstName||"")+" "+(p.lastName||"")).trim();
  return n||"Sans nom";
}
function shortName(p){
  if(!p)return "—";
  var f=(p.firstName||"").trim(),l=(p.lastName||"").trim();
  if(f&&l)return f+" "+l.charAt(0).toUpperCase()+".";
  return f||l||"Sans nom";
}
/* Numéro d'athlète — seule information exposée au rôle sélectionneur */
function numOf(season,pid){var e=rosterEntry(season,pid);return e&&e.number?e.number:""}
function numLabel(n){return n?"#"+n:"#?"}

function statsOf(team,pid){
  if(!team.stats[pid])team.stats[pid]=emptyS();
  return team.stats[pid];
}
/* Détecte les numéros en double dans une saison (bloquant pour les vues sélectionneur) */
function dupNumbers(season){
  var seen={},dup={};
  (season?season.roster:[]).forEach(function(e){
    if(!e.number)return;
    if(seen[e.number])dup[e.number]=true;else seen[e.number]=true;
  });
  return dup;
}
function missingNumbers(season){
  return (season?season.roster:[]).filter(function(e){return !e.number});
}

/* Vue "joueuse" consommée par les écrans de saisie : stats par référence */
function teamViewPlayers(team){
  var season=curSeason();if(!season||!team)return [];
  var out=[];
  team.playerIds.forEach(function(pid){
    var p=playerById(pid),e=rosterEntry(season,pid);
    if(!p)return;
    out.push({id:pid,name:fullName(p),number:e?e.number:"",position:e?e.position:"",stats:statsOf(team,pid)});
  });
  return out;
}
function lineupPlayers(team){
  var all=teamViewPlayers(team);
  if(!team.lineup||!team.lineup.length)return all;
  return all.filter(function(p){return team.lineup.indexOf(p.id)!==-1});
}
function filterPos(list){
  if(state.posFilter==="ALL")return list;
  if(state.posFilter==="NONE")return list.filter(function(p){return !p.position});
  return list.filter(function(p){return p.position===state.posFilter});
}
function filterP(list){return filterPos(list||lineupPlayers(curTeam()))}

/* ══ PERSISTANCE ═══════════════════════════════════════════════ */
var SK="wonderstats_v3", SK_UI="wonderstats_ui_v3", SK_INBOX="wonderstats_inbox_v3";
var LEGACY_KEYS=["vball_mt_v2","vball_mt_v1"];
var autoSaveTimer=null, saveFailed=false;

function saveAll(){
  try{
    localStorage.setItem(SK,JSON.stringify(DB));
    localStorage.setItem(SK_INBOX,JSON.stringify(INBOX));
    localStorage.setItem(SK_UI,JSON.stringify({role:state.role,tab:state.tab,viewIdx:state.viewIdx,posFilter:state.posFilter,inputMode:state.inputMode,svViewId:state.svViewId}));
    saveFailed=false;
  }catch(e){
    if(!saveFailed){saveFailed=true;showToast("⚠️ Sauvegarde impossible (stockage plein)")}
  }
}
function updateIndicators(saving){
  var els=document.querySelectorAll(".autosave-indicator");
  for(var i=0;i<els.length;i++){
    var el=els[i],txt=el.lastChild;
    if(saving){el.classList.add("saving");if(txt)txt.textContent="Sauvegarde…"}
    else{el.classList.remove("saving");if(txt)txt.textContent=saveFailed?"Non sauvegardé":"Sauvegardé"}
  }
}
function scheduleAutoSave(){
  if(autoSaveTimer)clearTimeout(autoSaveTimer);
  updateIndicators(true);
  autoSaveTimer=setTimeout(function(){saveAll();autoSaveTimer=null;updateIndicators(false)},1200);
}
function saveNow(){if(autoSaveTimer){clearTimeout(autoSaveTimer);autoSaveTimer=null}saveAll();updateIndicators(false)}

/* ── Normalisation défensive (import & rechargement) ───────── */
function normalizeDB(db){
  db.version=3;
  db.players=(db.players||[]).map(function(p){return Object.assign(mkDbPlayer(),p,{archived:!!p.archived})});
  var known={};db.players.forEach(function(p){known[p.id]=true});
  db.seasons=(db.seasons||[]).map(function(s){
    s=Object.assign({id:uid(),name:"Saison",createdAt:nowISO(),archived:false,roster:[],teams:[],selectorViews:[],submissions:[]},s);
    s.roster=(s.roster||[]).filter(function(e){return e&&known[e.playerId]}).map(function(e){
      return Object.assign(mkRosterEntry(e.playerId),e,{number:cleanNum(e.number),status:STATUSES[e.status]?e.status:"candidate"});
    });
    var inRoster={};s.roster.forEach(function(e){inRoster[e.playerId]=true});
    s.teams=(s.teams||[]).map(function(t){
      t=Object.assign(mkTeam(t&&t.name),t);
      t.playerIds=(t.playerIds||[]).filter(function(pid){return inRoster[pid]});
      t.lineup=(t.lineup||[]).filter(function(pid){return t.playerIds.indexOf(pid)!==-1});
      t.subteams=(t.subteams||[]).map(function(st){return {id:st.id||uid(),name:st.name||"Sous-équipe",playerIds:(st.playerIds||[]).filter(function(pid){return t.playerIds.indexOf(pid)!==-1})}});
      var st={};Object.keys(t.stats||{}).forEach(function(pid){if(inRoster[pid])st[pid]=normStats(t.stats[pid])});
      t.stats=st;
      t.sessions=(t.sessions||[]).map(function(se){
        return {id:se.id||uid(),name:se.name||"Session",date:se.date||nowISO(),teamName:se.teamName||t.name,
          entries:(se.entries||[]).map(function(en){return {playerId:en.playerId,name:en.name||"",number:cleanNum(en.number),position:en.position||"",stats:normStats(en.stats)}})};
      });
      return t;
    });
    if(!s.teams.length){var nt=mkTeam("Équipe A");s.teams.push(nt)}
    if(!s.teams.some(function(t){return t.id===s.activeTeamId}))s.activeTeamId=s.teams[0].id;
    s.selectorViews=(s.selectorViews||[]).map(function(v){
      v=Object.assign(mkSelectorView(),v);
      v.playerIds=(v.playerIds||[]).filter(function(pid){return inRoster[pid]});
      v.criteria=(v.criteria||[]).filter(function(c){return CRIT_BY_KEY[c]});
      if(!v.criteria.length)v.criteria=CRITERIA.map(function(c){return c.key});
      v.groups=(v.groups||[]).filter(function(g){return SG[g]});
      var d={};v.playerIds.forEach(function(pid){
        var src=(v.data||{})[pid]||{};
        d[pid]={stats:normStats(src.stats),ratings:src.ratings||{},reco:RECO_BY_KEY[src.reco]?src.reco:"",note:src.note||""};
      });
      v.data=d;
      return v;
    });
    s.submissions=(s.submissions||[]).map(function(sub){
      return {id:sub.id||uid(),viewId:sub.viewId||"",viewName:sub.viewName||"Vue",selectorName:sub.selectorName||"",
        submittedAt:sub.submittedAt||nowISO(),criteria:sub.criteria||CRITERIA.map(function(c){return c.key}),
        entries:(sub.entries||[]).filter(function(e){return e&&e.playerId}).map(function(e){
          return {playerId:e.playerId,number:cleanNum(e.number),stats:normStats(e.stats),ratings:e.ratings||{},reco:RECO_BY_KEY[e.reco]?e.reco:"",note:e.note||""};
        })};
    });
    return s;
  });
  if(!db.seasons.some(function(s){return s.id===db.activeSeasonId}))db.activeSeasonId=db.seasons.length?db.seasons[0].id:null;
  return db;
}

/* ── Migration v2 → v3 ─────────────────────────────────────── */
function migrateV2(old){
  var db={version:3,players:[],seasons:[],activeSeasonId:null};
  var season=mkSeason("Saison "+new Date().getFullYear());
  season.teams=[];
  var byKey={};
  function ensurePlayer(name,number,position){
    var key=(name||"").trim().toLowerCase()+"#"+cleanNum(number);
    if(byKey[key])return byKey[key];
    var parts=(name||"").trim().split(/\s+/);
    var p=mkDbPlayer({firstName:parts.shift()||"",lastName:parts.join(" ")});
    db.players.push(p);byKey[key]=p.id;
    if(!rosterEntryIn(season,p.id)){
      var e=mkRosterEntry(p.id,number,position);e.status="selected";season.roster.push(e);
    }
    return p.id;
  }
  function rosterEntryIn(s,pid){for(var i=0;i<s.roster.length;i++)if(s.roster[i].playerId===pid)return s.roster[i];return null}

  (old.teams||[]).forEach(function(ot){
    var t=mkTeam(ot.name||"Équipe");
    var idxToPid=[];
    (ot.players||[]).forEach(function(op,i){
      if(!op||!(op.name||"").trim()){idxToPid[i]=null;return}
      var pid=ensurePlayer(op.name,op.number,op.position);
      idxToPid[i]=pid;
      if(t.playerIds.indexOf(pid)===-1)t.playerIds.push(pid);
      t.stats[pid]=normStats(op.stats);
    });
    t.lineup=(ot.activePlayers||[]).map(function(i){return idxToPid[i]}).filter(Boolean);
    t.subteams=(ot.subteams||[]).map(function(st){
      return {id:st.id||uid(),name:st.name||"Sous-équipe",playerIds:(st.playerIndices||[]).map(function(i){return idxToPid[i]}).filter(Boolean)};
    });
    t.sessions=(ot.sessions||[]).map(function(os){
      return {id:uid(),name:os.name||"Session",date:os.date||nowISO(),teamName:t.name,
        entries:(os.players||[]).filter(function(op){return op&&(op.name||"").trim()}).map(function(op){
          var pid=ensurePlayer(op.name,op.number,op.position);
          if(t.playerIds.indexOf(pid)===-1)t.playerIds.push(pid);
          return {playerId:pid,name:(op.name||"").trim(),number:cleanNum(op.number),position:op.position||"",stats:normStats(op.stats)};
        })};
    });
    season.teams.push(t);
  });
  if(!season.teams.length)season.teams.push(mkTeam("Équipe A"));
  season.activeTeamId=season.teams[0].id;
  db.seasons.push(season);db.activeSeasonId=season.id;
  return db;
}
/* ── Migration v1 (clés brutes) → structure v2 ─────────────── */
function readLegacyV1(){
  try{
    var oldS=localStorage.getItem("vball_sessions_v5"),oldC=localStorage.getItem("vball_current_v5");
    if(!oldS&&!oldC)return null;
    return {teams:[{id:uid(),name:"Mon équipe",players:oldC?JSON.parse(oldC):[],sessions:oldS?JSON.parse(oldS):[],activePlayers:[],subteams:[]}]};
  }catch(e){return null}
}

function loadAll(){
  try{
    var raw=localStorage.getItem(SK);
    if(raw){DB=normalizeDB(JSON.parse(raw))}
    else{
      var legacy=null;
      for(var i=0;i<LEGACY_KEYS.length&&!legacy;i++){
        var d=localStorage.getItem(LEGACY_KEYS[i]);
        if(d)legacy=JSON.parse(d);
      }
      if(!legacy)legacy=readLegacyV1();
      DB=legacy?normalizeDB(migrateV2(legacy)):{version:3,players:[],seasons:[],activeSeasonId:null};
      if(legacy)setTimeout(function(){showToast("✅ Données migrées vers la v3")},400);
    }
  }catch(e){DB={version:3,players:[],seasons:[],activeSeasonId:null}}
  try{var ib=localStorage.getItem(SK_INBOX);if(ib){INBOX=JSON.parse(ib);INBOX.views=(INBOX.views||[]).map(function(v){return Object.assign(mkSelectorView(),v)})}}catch(e){INBOX={views:[]}}
  try{
    var ui=localStorage.getItem(SK_UI);
    if(ui){var o=JSON.parse(ui);
      if(o.role==="coach"||o.role==="selector")state.role=o.role;
      if(o.viewIdx!=null)state.viewIdx=Math.max(0,Math.min(VIEWS.length-1,o.viewIdx));
      if(o.posFilter)state.posFilter=o.posFilter;
      if(o.inputMode)state.inputMode=o.inputMode;
      if(o.svViewId)state.svViewId=o.svViewId;
      if(o.tab&&tabsFor(state.role).some(function(t){return t.key===o.tab}))state.tab=o.tab;
    }
  }catch(e){}
  if(!DB.seasons.length){
    var s=mkSeason();DB.seasons.push(s);DB.activeSeasonId=s.id;
  }
  if(!DB.activeSeasonId)DB.activeSeasonId=DB.seasons[0].id;
}

/* ══ UNDO ══════════════════════════════════════════════════════
   Instantané ciblé : { kind, payload } — restaure exactement la
   portion de modèle touchée, sans dépendre d'un index. */
var undoStack=[],MAX_UNDO=60;
function pushUndoStats(label){
  var t=curTeam();if(!t)return;
  undoStack.push({label:label,kind:"teamStats",teamId:t.id,data:clone(t.stats)});
  trimUndo();
}
function pushUndoView(label,view){
  if(!view)return;
  undoStack.push({label:label,kind:"viewData",viewId:view.id,data:clone(view.data)});
  trimUndo();
}
function trimUndo(){
  if(undoStack.length>MAX_UNDO)undoStack.shift();
  var b=document.getElementById("undoBtn");if(b)b.disabled=false;
}
function clearUndo(){undoStack=[]}
function doUndo(){
  if(!undoStack.length){showToast("Rien à annuler");return}
  var snap=undoStack.pop();
  if(snap.kind==="teamStats"){
    var s=curSeason(),t=null;
    if(s)s.teams.forEach(function(x){if(x.id===snap.teamId)t=x});
    if(t)t.stats=snap.data;
  } else if(snap.kind==="viewData"){
    var v=findViewAnywhere(snap.viewId);
    if(v)v.data=snap.data;
  }
  scheduleAutoSave();showToast("↩ Annulé : "+snap.label);render();
}
function findViewAnywhere(id){
  for(var i=0;i<DB.seasons.length;i++){var v=viewById(DB.seasons[i],id);if(v)return v}
  for(var j=0;j<INBOX.views.length;j++)if(INBOX.views[j].id===id)return INBOX.views[j];
  return null;
}

/* ══ CUMULS & COMPILATION ══════════════════════════════════════ */
/* Cumul des sessions d'une équipe, agrégé par playerId (identité stable) */
function computeGlobalPlayers(team){
  var season=curSeason();if(!team||!team.sessions.length)return [];
  var map={};
  team.sessions.forEach(function(sess){
    sess.entries.forEach(function(en){
      if(!hasStats(en.stats))return;
      var m=map[en.playerId];
      if(!m){
        var p=playerById(en.playerId),e=rosterEntry(season,en.playerId);
        m=map[en.playerId]={id:en.playerId,name:p?fullName(p):(en.name||"Joueuse"),
          number:(e&&e.number)||en.number,position:(e&&e.position)||en.position,
          stats:emptyS(),sessCount:0};
      }
      addStats(m.stats,en.stats);m.sessCount++;
    });
  });
  return Object.keys(map).map(function(k){return map[k]});
}

/* Une entrée ne porte de l'information que si le sélectionneur y a réellement touché */
function dataFilled(d){
  if(!d)return false;
  if(d.reco)return true;
  if((d.note||"").trim())return true;
  if(hasStats(d.stats))return true;
  return CRITERIA.some(function(c){return (d.ratings||{})[c.key]>0});
}

/* Compilation multi-sélectionneurs : une entrée par joueuse réellement évaluée */
function compileSubmissions(season){
  var out={};
  if(!season)return out;
  function bucket(pid){
    if(!out[pid])out[pid]={playerId:pid,n:0,stats:emptyS(),ratings:{},
      reco:{select:0,recall:0,cut:0},topReco:null,score:0,notes:[],selectors:[]};
    return out[pid];
  }
  season.submissions.forEach(function(sub){
    var who=(sub.selectorName||"").trim()||sub.viewName||"Sélectionneur";
    sub.entries.forEach(function(e){
      if(!dataFilled(e))return;          // athlète non observée : n'entre pas dans les moyennes
      var b=bucket(e.playerId);
      b.n++;
      addStats(b.stats,e.stats);
      CRITERIA.forEach(function(c){
        var v=e.ratings&&e.ratings[c.key];
        if(typeof v!=="number"||v<1)return;
        var r=b.ratings[c.key]||(b.ratings[c.key]={sum:0,n:0,min:v,max:v,avg:0});
        r.sum+=v;r.n++;r.min=Math.min(r.min,v);r.max=Math.max(r.max,v);
      });
      if(e.reco&&b.reco[e.reco]!=null)b.reco[e.reco]++;
      if((e.note||"").trim())b.notes.push({by:who,at:sub.submittedAt,text:e.note.trim()});
      if(b.selectors.indexOf(who)===-1)b.selectors.push(who);
    });
  });
  Object.keys(out).forEach(function(pid){
    var b=out[pid],tot=0,cnt=0;
    CRITERIA.forEach(function(c){
      var r=b.ratings[c.key];
      if(r&&r.n){r.avg=r.sum/r.n;tot+=r.avg;cnt++}
    });
    b.score=cnt?tot/cnt:0;
    var best=null;
    ["select","recall","cut"].forEach(function(k){if(b.reco[k]>0&&(best===null||b.reco[k]>b.reco[best]))best=k});
    b.topReco=best;
  });
  return out;
}
function scoreColor(s){
  if(s>=4.2)return "#10B981";
  if(s>=3.4)return "#84CC16";
  if(s>=2.6)return "#F59E0B";
  if(s>0)return "#EF4444";
  return "#475569";
}

/* ══ IMPORT / EXPORT ═══════════════════════════════════════════ */
function downloadJSON(obj,filename){
  try{
    var blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
    var u=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=u;a.download=filename;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(u)},1000);
    return true;
  }catch(e){showToast("⚠️ Export impossible");return false}
}
function pickJSON(cb){
  var input=document.createElement("input");input.type="file";input.accept=".json,application/json";
  input.onchange=function(e){
    var file=e.target.files&&e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{cb(JSON.parse(ev.target.result),file.name)}
      catch(err){showToast("⚠️ Fichier illisible")}
    };
    reader.onerror=function(){showToast("⚠️ Lecture impossible")};
    reader.readAsText(file);
  };
  input.click();
}
function stamp(){return new Date().toISOString().slice(0,10)}
function safeName(s){return String(s||"").replace(/[^\w\-]+/g,"_").slice(0,40)||"export"}

/* Sauvegarde complète */
function exportBackup(){
  if(downloadJSON({type:"wonderstats-backup",version:3,exportDate:nowISO(),db:DB},
    "WonderStats_"+stamp()+".json")) showToast("📤 Sauvegarde exportée");
}
function importBackup(){
  pickJSON(function(data){
    var incoming=null;
    if(data&&data.type==="wonderstats-backup"&&data.db)incoming=normalizeDB(clone(data.db));
    else if(data&&data.version===3&&data.seasons)incoming=normalizeDB(clone(data));
    else if(data&&Array.isArray(data.teams))incoming=normalizeDB(migrateV2(data));       // export v7 (ancien)
    else if(data&&(data.currentPlayers||data.sessions))incoming=normalizeDB(migrateV2({teams:[{id:uid(),name:"Import",players:data.currentPlayers||[],sessions:data.sessions||[]}]}));
    if(!incoming){showToast("⚠️ Format non reconnu");return}
    if(!confirm("Fusionner "+plural(incoming.seasons.length,"saison")+" et "+plural(incoming.players.length,"joueuse")+" avec les données actuelles ?"))return;
    mergeDB(incoming);
    saveNow();showToast("📥 Import terminé");render();
  });
}
/* Fusion : les joueuses sont dédoublonnées sur id, sinon sur nom+année */
function mergeDB(inc){
  var byId={},byName={};
  DB.players.forEach(function(p){byId[p.id]=p;byName[nameKey(p)]=p});
  var remap={};
  inc.players.forEach(function(p){
    if(byId[p.id]){remap[p.id]=p.id;return}
    var ex=byName[nameKey(p)];
    if(ex){remap[p.id]=ex.id;return}
    DB.players.push(p);byId[p.id]=p;byName[nameKey(p)]=p;remap[p.id]=p.id;
  });
  function rp(id){return remap[id]||id}
  inc.seasons.forEach(function(s){
    s.roster.forEach(function(e){e.playerId=rp(e.playerId)});
    s.teams.forEach(function(t){
      t.playerIds=t.playerIds.map(rp);t.lineup=t.lineup.map(rp);
      t.subteams.forEach(function(st){st.playerIds=st.playerIds.map(rp)});
      var ns={};Object.keys(t.stats).forEach(function(pid){ns[rp(pid)]=t.stats[pid]});t.stats=ns;
      t.sessions.forEach(function(se){se.entries.forEach(function(en){en.playerId=rp(en.playerId)})});
    });
    s.selectorViews.forEach(function(v){
      v.playerIds=v.playerIds.map(rp);
      var nd={};Object.keys(v.data).forEach(function(pid){nd[rp(pid)]=v.data[pid]});v.data=nd;
    });
    s.submissions.forEach(function(sub){sub.entries.forEach(function(e){e.playerId=rp(e.playerId)})});
    if(DB.seasons.some(function(x){return x.id===s.id}))s.id=uid();
    DB.seasons.push(s);
  });
  normalizeDB(DB);
}
function nameKey(p){return (fullName(p)+"|"+(p.birthYear||"")).toLowerCase()}

/* ── Paquet sélectionneur : NUMÉROS UNIQUEMENT, jamais de nom ─ */
function buildPacket(season,view){
  return {
    type:"wonderstats-selector-packet",version:3,createdAt:nowISO(),
    seasonId:season.id,seasonName:season.name,
    view:{
      id:view.id,name:view.name,selectorName:view.selectorName,
      criteria:view.criteria.slice(),groups:view.groups.slice(),
      // aucune donnée nominative : uniquement l'identifiant opaque et le dossard
      players:view.playerIds.map(function(pid){return {playerId:pid,number:numOf(season,pid)}})
    }
  };
}
function exportPacket(season,view){
  var dup=dupNumbers(season);
  var bad=view.playerIds.filter(function(pid){var n=numOf(season,pid);return !n||dup[n]});
  if(bad.length){showToast("⚠️ "+plural(bad.length,"numéro")+" manquant(s) ou en double");return}
  if(downloadJSON(buildPacket(season,view),"Vue_"+safeName(view.name)+"_"+stamp()+".json"))
    showToast("📤 Paquet sélectionneur exporté");
}
function importPacket(){
  pickJSON(function(data){
    if(!data||data.type!=="wonderstats-selector-packet"||!data.view){showToast("⚠️ Ce n'est pas un paquet sélectionneur");return}
    var v=mkSelectorView({
      id:data.view.id||uid(),name:data.view.name||"Vue importée",selectorName:data.view.selectorName||"",
      criteria:(data.view.criteria||[]).filter(function(c){return CRIT_BY_KEY[c]}),
      groups:(data.view.groups||[]).filter(function(g){return SG[g]}),
      origin:"imported",seasonId:data.seasonId,seasonName:data.seasonName||""
    });
    if(!v.criteria.length)v.criteria=CRITERIA.map(function(c){return c.key});
    v.numbers={};
    (data.view.players||[]).forEach(function(pl){
      if(!pl||!pl.playerId)return;
      v.playerIds.push(pl.playerId);
      v.numbers[pl.playerId]=cleanNum(pl.number);
      v.data[pl.playerId]=mkEntryData();
    });
    INBOX.views=INBOX.views.filter(function(x){return x.id!==v.id});
    INBOX.views.push(v);
    state.role="selector";state.tab="sv_views";state.svViewId=v.id;
    saveNow();showToast("📥 Vue « "+v.name+" » importée");render();
  });
}

/* ── Soumission ────────────────────────────────────────────── */
function buildSubmission(view,numberFor){
  return {
    type:"wonderstats-submission",version:3,
    id:uid(),viewId:view.id,viewName:view.name,
    selectorName:(view.selectorName||"").trim(),
    seasonId:view.seasonId||null,submittedAt:nowISO(),
    criteria:view.criteria.slice(),
    entries:view.playerIds.map(function(pid){
      var d=view.data[pid]||mkEntryData();
      return {playerId:pid,number:numberFor(pid),stats:normStats(d.stats),
        ratings:d.ratings||{},reco:d.reco||"",note:(d.note||"").trim()};
    })
  };
}
/* Soumission locale : la vue vit dans la saison, on écrit directement */
function submitLocalView(season,view){
  var sub=buildSubmission(view,function(pid){return numOf(season,pid)});
  delete sub.type;delete sub.version;
  season.submissions.push(sub);
  view.submittedAt=sub.submittedAt;
  view.submissionCount=(view.submissionCount||0)+1;
  saveNow();
  return sub;
}
/* Soumission depuis une vue importée : produit un fichier à remettre au coach */
function exportSubmission(view){
  var sub=buildSubmission(view,function(pid){return (view.numbers||{})[pid]||""});
  if(downloadJSON(sub,"Soumission_"+safeName(view.name)+"_"+safeName(view.selectorName)+"_"+stamp()+".json")){
    view.submittedAt=sub.submittedAt;view.submissionCount=(view.submissionCount||0)+1;
    saveNow();showToast("📤 Soumission exportée");
  }
}
function importSubmission(season){
  pickJSON(function(data){
    if(!data||data.type!=="wonderstats-submission"){showToast("⚠️ Ce n'est pas une soumission");return}
    if(season.submissions.some(function(s){return s.id===data.id})){showToast("⚠️ Soumission déjà importée");return}
    var known={};season.roster.forEach(function(e){known[e.playerId]=true});
    var entries=(data.entries||[]).filter(function(e){return e&&known[e.playerId]});
    if(!entries.length){showToast("⚠️ Aucune joueuse de cette saison dans le fichier");return}
    season.submissions.push({id:data.id||uid(),viewId:data.viewId||"",viewName:data.viewName||"Vue",
      selectorName:data.selectorName||"",submittedAt:data.submittedAt||nowISO(),
      criteria:data.criteria||CRITERIA.map(function(c){return c.key}),
      entries:entries.map(function(e){return {playerId:e.playerId,number:cleanNum(e.number),stats:normStats(e.stats),ratings:e.ratings||{},reco:RECO_BY_KEY[e.reco]?e.reco:"",note:e.note||""}})});
    saveNow();showToast("📥 Soumission de "+(data.selectorName||"—")+" intégrée");render();
  });
}

/* ══ DOM ═══════════════════════════════════════════════════════ */
var EVT={onclick:1,oninput:1,onchange:1,onkeydown:1,onblur:1,onfocus:1};
function h(tag,attrs){
  var el=document.createElement(tag),ch=Array.prototype.slice.call(arguments,2);
  if(attrs)for(var k in attrs){
    if(!Object.prototype.hasOwnProperty.call(attrs,k))continue;
    var v=attrs[k];
    if(v==null||v===false)continue;
    if(EVT[k])el[k]=v;
    else if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k==="className")el.className=v;
    else if(k==="value")el.value=v;
    else el.setAttribute(k,v===true?"":v);
  }
  (function add(list){
    list.forEach(function(c){
      if(c==null||c===false)return;
      if(Array.isArray(c))add(c);
      else if(typeof c==="string"||typeof c==="number")el.appendChild(document.createTextNode(String(c)));
      else el.appendChild(c);
    });
  })(ch);
  return el;
}
function bindInput(el,cb){["input","change"].forEach(function(evt){el.addEventListener(evt,cb)})}

  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){state.toast=null;var t=app.querySelector(".toast");if(t)t.remove();toastTimer=null},2600);
}

/* ── Tableau de sélection : retenir / recaller / couper ─────── */
function renderSelectionBoard(season){
  var compiled=compileSubmissions(season);
  var dup=dupNumbers(season);
  var counts={candidate:0,recalled:0,selected:0,cut:0};
  season.roster.forEach(function(e){counts[e.status]=(counts[e.status]||0)+1});

  var filters=[{k:"all",l:"Toutes ("+season.roster.length+")"}].concat(STATUS_ORDER.map(function(s){
    return {k:s,l:STATUSES[s].icon+" "+STATUSES[s].label+" ("+(counts[s]||0)+")"};
  }));
  var fRow=h("div",{className:"sub-pills",style:{marginBottom:"12px",paddingBottom:"2px"}},filters.map(function(f){
    var b=h("button",{className:"pill sm"+(state.statusFilter===f.k?" active":""),onclick:function(){state.statusFilter=f.k;render()}},f.l);
    if(state.statusFilter===f.k)b.style.background=f.k==="all"?"#3B82F6":STATUSES[f.k].color;
    return b;
  }));

  var list=season.roster.filter(function(e){return state.statusFilter==="all"||e.status===state.statusFilter});
  var q=(state.search||"").trim().toLowerCase();
  if(q)list=list.filter(function(e){
    var p=playerById(e.playerId);
    return (fullName(p).toLowerCase().indexOf(q)!==-1)||(e.number.indexOf(q)===0);
  });
  /* Tri : score compilé décroissant, puis numéro */
  list=list.slice().sort(function(a,b){
    var sa=(compiled[a.playerId]||{}).score||0,sb=(compiled[b.playerId]||{}).score||0;
    if(sb!==sa)return sb-sa;
    return (parseInt(a.number,10)||999)-(parseInt(b.number,10)||999);
  });

  list.forEach(function(e){var r=rowFor(e);if(r)listWrap.appendChild(r)});

  var nSub=season.submissions.length;

    h("button",{className:"btn btn-save sm",onclick:function(){promoteSelectedToTeam(season)}},"👕 Composer l'équipe"));

function setRosterStatus(season,entry,status){
  entry.status=status;
  var team=curTeam();
  if(status==="selected"&&team&&team.playerIds.indexOf(entry.playerId)===-1)team.playerIds.push(entry.playerId);
  if(status!=="selected")season.teams.forEach(function(t){detachFromTeam(t,entry.playerId)});
  scheduleAutoSave();
}
function detachFromTeam(team,pid){
  team.playerIds=team.playerIds.filter(function(x){return x!==pid});
  team.lineup=team.lineup.filter(function(x){return x!==pid});
  team.subteams.forEach(function(st){st.playerIds=st.playerIds.filter(function(x){return x!==pid})});
}
function removeFromSeason(season,pid){
  season.roster=season.roster.filter(function(e){return e.playerId!==pid});
  season.teams.forEach(function(t){detachFromTeam(t,pid);delete t.stats[pid]});
  season.selectorViews.forEach(function(v){
    v.playerIds=v.playerIds.filter(function(x){return x!==pid});delete v.data[pid];
  });
  state.expandedPlayerId=null;
  scheduleAutoSave();
}
function promoteSelectedToTeam(season){
  var team=curTeam();if(!team){showToast("⚠️ Aucune équipe");return}
  var added=0;
  season.roster.forEach(function(e){
    if(e.status!=="selected")return;
    if(team.playerIds.indexOf(e.playerId)===-1){team.playerIds.push(e.playerId);added++}
  });
  saveNow();
  showToast(added?("👕 "+plural(added,"joueuse")+" ajoutée(s) à "+team.name):"Équipe déjà à jour");
  state.seasonPane="teams";render();
}

function suggestNumber(season){
  var used={};season.roster.forEach(function(e){if(e.number)used[e.number]=1});

  return "";
}

var dragPid=null;
function renderRosterPane(season){
  if(!season)return h("div",{className:"empty"},"Aucune saison active");
  if(!season.roster.length)return h("div",null,
    h("div",{className:"hint"},"Aucune joueuse convoquée pour « "+season.name+" »."),
    h("button",{className:"btn btn-primary full",onclick:function(){state.playersPane="db";render()}},"Choisir dans la base de données"));
  var dup=dupNumbers(season);
  var wrap=h("div",null,h("div",{className:"hint"},
    "Le ",h("b",null,"numéro d'athlète")," est la seule information transmise aux sélectionneurs. Il doit être unique dans la saison. Glissez ☰ pour réordonner."));
  season.roster.forEach(function(e,i){
    var p=playerById(e.playerId);if(!p)return;
    var row=h("div",{className:"list-row","data-idx":String(i),draggable:"true"});
    var handle=h("span",{className:"drag-handle"},"☰");
    row.addEventListener("dragstart",function(ev){dragPid=e.playerId;row.classList.add("dragging");ev.dataTransfer.effectAllowed="move"});
    row.addEventListener("dragend",function(){dragPid=null;row.classList.remove("dragging");document.querySelectorAll(".list-row").forEach(function(r){r.classList.remove("drag-over")})});
    row.addEventListener("dragover",function(ev){ev.preventDefault();row.classList.add("drag-over")});
    row.addEventListener("dragleave",function(){row.classList.remove("drag-over")});
    row.addEventListener("drop",function(ev){ev.preventDefault();row.classList.remove("drag-over");moveRoster(season,dragPid,e.playerId)});
    var touchPid=null;
    handle.addEventListener("touchstart",function(){touchPid=e.playerId;row.classList.add("dragging")},{passive:true});
    handle.addEventListener("touchmove",function(ev){
      ev.preventDefault();
      var t=ev.touches[0];
      document.querySelectorAll(".list-row").forEach(function(r){r.classList.remove("drag-over")});
      var el=document.elementFromPoint(t.clientX,t.clientY);
      var pr=el&&el.closest?el.closest(".list-row"):null;if(pr)pr.classList.add("drag-over");
    },{passive:false});
    handle.addEventListener("touchend",function(ev){
      row.classList.remove("dragging");
      document.querySelectorAll(".list-row").forEach(function(r){r.classList.remove("drag-over")});
      if(touchPid===null)return;
      var t=ev.changedTouches[0];
      var el=document.elementFromPoint(t.clientX,t.clientY);
      var pr=el&&el.closest?el.closest(".list-row"):null;
      if(pr){var ti=parseInt(pr.getAttribute("data-idx"),10);
        if(!isNaN(ti)&&season.roster[ti])moveRoster(season,touchPid,season.roster[ti].playerId)}
      touchPid=null;
    });

    var numI=h("input",{className:"num-badge"+(e.number&&dup[e.number]?" dup":""),value:e.number,inputmode:"numeric",maxlength:"3",placeholder:"#"});
    numI.addEventListener("input",function(ev){e.number=cleanNum(ev.target.value);ev.target.value=e.number;scheduleAutoSave()});
    numI.addEventListener("blur",function(){render()});

    row.appendChild(handle);
    row.appendChild(numI);
    row.appendChild(h("div",{className:"body"},
      h("div",{className:"pname"},fullName(p)),
      h("div",{style:{marginTop:"5px"}},h("div",{className:"pos-btns"},POSITIONS.filter(function(x){return x.key!=="ALL"}).map(function(pos){
        var v=pos.key==="NONE"?"":pos.key;
        return h("button",{className:"pos-btn"+(e.position===v?" active":""),onclick:function(){e.position=v;scheduleAutoSave();render()}},pos.label);
      })))));
    row.appendChild(h("div",{style:{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"6px"}},
      statusBadge(e.status),
      h("button",{className:"icon-btn",onclick:function(){
        if(!confirmAct("Retirer "+fullName(p)+" de la saison ?"))return;
        removeFromSeason(season,e.playerId);render();
      }},"✕")));
    wrap.appendChild(row);
  });
  return wrap;
}
function moveRoster(season,fromPid,toPid){
  if(!fromPid||fromPid===toPid)return;
  var from=-1,to=-1;
  season.roster.forEach(function(e,i){if(e.playerId===fromPid)from=i;if(e.playerId===toPid)to=i});
  if(from<0||to<0)return;
  var moved=season.roster.splice(from,1)[0];
  season.roster.splice(to,0,moved);
  scheduleAutoSave();render();
}

/* ══════════════════════════════════════════════════════════════
   ONGLET SAISIE — mode rapide / mode grille (vue entraîneur)

function renderInputTab(){
  var season=curSeason(),team=curTeam();
  if(!season||!team)return emptyBlock("🏐","Aucune équipe","Créez une saison et une équipe pour saisir des statistiques.",null);
  if(!team.playerIds.length)return emptyBlock("👥","Équipe vide",
    "Retenez des joueuses dans l'onglet Sélection, ou composez l'équipe manuellement.",
    h("button",{className:"btn btn-primary",onclick:function(){state.tab="season";state.seasonPane="selection";render()}},"Aller à la sélection"));
  return state.inputMode==="quick"?renderQuickInput(team):renderGridInput(team);
}

function renderCourtBar(team){
  var season=curSeason();
  var all=teamViewPlayers(team);
  var allOn=!team.lineup||!team.lineup.length;
  var count=allOn?all.length:team.lineup.length;
  var bar=h("div",{className:"court-bar",onclick:function(){state.courtPanelOpen=!state.courtPanelOpen;render()}},
    h("span",null,"🏐 Terrain : "+count+"/"+all.length+" joueuses"),
    h("span",null,state.courtPanelOpen?"▲":"▼"));
  if(!state.courtPanelOpen)return bar;

  function sameSet(a,b){
    if(!a||!b||a.length!==b.length)return false;
    var s=a.slice().sort(),t=b.slice().sort();
    return s.every(function(v,i){return v===t[i]});
  }
  var subRow=h("div",{className:"subteam-row"},
    team.subteams.map(function(st){
      var match=sameSet(team.lineup,st.playerIds);
      return h("span",{style:{display:"inline-flex",alignItems:"center"}},
        h("button",{className:"subteam-chip"+(match?" active":""),onclick:function(){
          team.lineup=st.playerIds.slice();state.quickPlayer=null;scheduleAutoSave();render();
        }},st.name),
        h("button",{className:"subteam-edit",onclick:function(ev){
          ev.stopPropagation();state.editingSubteamId=st.id;state.modalSel=st.playerIds.slice();
          openModal("subteam",null,st.name);
        }},"✏️"));
    }),
    h("button",{className:"subteam-chip",style:{borderStyle:"dashed"},onclick:function(){
      state.editingSubteamId=null;state.modalSel=(team.lineup&&team.lineup.length)?team.lineup.slice():[];
      openModal("subteam",null,"");
    }},"+ Sous-équipe"));

  var toggles=h("div",{className:"court-toggle-grid"},all.map(function(p){
    var on=allOn||team.lineup.indexOf(p.id)!==-1;
    return h("button",{className:"court-toggle"+(on?" on":""),onclick:function(){
      if(allOn)team.lineup=all.map(function(x){return x.id});
      var i=team.lineup.indexOf(p.id);
      if(i!==-1)team.lineup.splice(i,1);else team.lineup.push(p.id);
      if(team.lineup.length===all.length)team.lineup=[];
      state.quickPlayer=null;scheduleAutoSave();render();
    }},(p.number?"#"+p.number+" ":"")+shortName(playerById(p.id)));
  }));

  return h("div",null,bar,h("div",{className:"court-panel"},subRow,toggles,
    h("button",{className:"btn btn-ghost xs",style:{marginTop:"8px"},onclick:function(){
      team.lineup=[];state.quickPlayer=null;scheduleAutoSave();render();
    }},"Toutes sur le terrain")));
}

function saveBar(team){
  return h("div",{className:"save-bar"},h("div",{className:"inner"},
    h("div",{style:{display:"flex",gap:"8px",alignItems:"center"}},
      h("button",{className:"btn btn-save",style:{flex:"1"},onclick:function(){openModal("savesession")}},"💾 Enregistrer la session"),
      renderAutoSave())));
}

function renderQuickInput(team){
  var filtered=filterP(lineupPlayers(team));
  var sel=null;
  if(state.quickPlayer)filtered.forEach(function(p){if(p.id===state.quickPlayer)sel=p});
  if(!sel)state.quickPlayer=null;

  var posRow=h("div",{className:"filter-bar",style:{padding:"6px 12px"}},renderPosFilter());
  var strip=h("div",{className:"player-strip"},filtered.map(function(p){
    return h("button",{className:"player-chip"+(p.id===state.quickPlayer?" active":""),onclick:function(){
      state.quickPlayer=p.id;render();
    }},p.number?h("span",{className:"chip-num"},"#"+p.number):null,
      h("span",{className:"chip-name"},shortName(playerById(p.id))));
  }));

  var panel;
  if(!filtered.length)panel=h("div",{className:"empty"},"Aucune joueuse à cette position");
  else if(sel){
    panel=h("div",{className:"quick-panel","data-scroll-key":"quick-panel"},SG_KEYS.map(function(k){
      var g=SG[k];
      return h("div",{className:"qp-group"},
        h("div",{className:"qp-group-title",style:{background:g.color+"20",color:g.color}},g.name),
        h("div",{className:"qp-stats-row"},g.stats.map(function(s){
          var countSpan=h("span",{className:"count"},String(sel.stats[s.key]));
          var btn=h("button",{className:"qp-stat-btn",style:{borderColor:g.color,background:g.color+"15",color:"#F8FAFC"},onclick:function(){
            pushUndoStats(shortName(playerById(sel.id))+" · "+s.label+" +1");
            sel.stats[s.key]++;countSpan.textContent=String(sel.stats[s.key]);
            btn.style.background=g.color;btn.style.color="#fff";btn.style.transform="scale(1.05)";
            setTimeout(function(){btn.style.background=g.color+"15";btn.style.color="#F8FAFC";btn.style.transform="scale(1)"},180);
            scheduleAutoSave();
          }},countSpan,h("span",{className:"lbl"},s.label));
          var dec=h("button",{className:"qp-dec",onclick:function(){
            if(sel.stats[s.key]<=0)return;
            pushUndoStats(shortName(playerById(sel.id))+" · "+s.label+" −1");
            sel.stats[s.key]--;countSpan.textContent=String(sel.stats[s.key]);scheduleAutoSave();
          }},"−");
          return h("div",{className:"qp-stat-cell"},btn,dec);
        })));
    }));
  } else panel=h("div",{className:"quick-prompt"},h("div",{className:"arrow"},"↑"),h("div",{style:{fontSize:"14px"}},"Sélectionnez une joueuse"));

  return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},
    renderCourtBar(team),posRow,strip,panel,saveBar(team));
}

function renderGridInput(team){
  var view=VIEWS[state.viewIdx];
  var groups=view.groups.map(function(k){return Object.assign({},SG[k],{id:k})});
  var filtered=filterP(lineupPlayers(team));
  var visGid=groups.length===1?groups[0].id:state.expandedGroup;
  var useSide=isLand()&&isTablet()&&groups.length>1;

  var viewRow=h("div",{className:"pill-row"},VIEWS.map(function(v,i){
    var b=h("button",{className:"pill"+(i===state.viewIdx?" active":""),onclick:function(){
      state.viewIdx=i;state.expandedGroup=null;saveNow();render();
    }},v.label);
    if(i===state.viewIdx)b.style.background="#F59E0B";
    return b;
  }));
  var filterBar=h("div",{className:"filter-bar"},renderPosFilter(),
    (groups.length>1&&!useSide)?h("div",{className:"sub-pills"},groups.map(function(g){
      var b=h("button",{className:"pill sm"+(visGid===g.id?" active":""),onclick:function(){
        state.expandedGroup=visGid===g.id?null:g.id;render();
      }},g.name);
      if(visGid===g.id)b.style.background=g.color;
      return b;
    })):null);

  function buildGrid(g){
    var nw=isTablet()?"130px":"100px";
    var header=h("div",{className:"grid-header"},
      h("div",{className:"lbl",style:{width:nw}},"JOUEUSE"),
      h("div",{className:"stat-labels"},g.stats.map(function(s){
        return h("div",{className:"stat-lbl",style:{color:g.color,width:(100/g.stats.length)+"%"}},s.label);
      })));
    var rows=filtered.map(function(p){
      return h("div",{className:"grid-row"},
        h("div",{style:{width:nw,flexShrink:"0"}},
          h("div",{className:"pname"},(p.number?"#"+p.number+" ":"")+shortName(playerById(p.id))),
          h("div",{className:"ppos"},p.position||"")),
        h("div",{className:"stats-cells"},g.stats.map(function(s){
          var btn=h("button",{className:"stat-btn",style:{border:"2px solid "+g.color,background:g.color+"15",color:"#F8FAFC"},onclick:function(){
            pushUndoStats(shortName(playerById(p.id))+" · "+s.label+" +1");
            p.stats[s.key]++;btn.textContent=String(p.stats[s.key]);
            btn.style.background=g.color;btn.style.color="#fff";btn.style.transform="scale(1.1)";
            setTimeout(function(){btn.style.background=g.color+"15";btn.style.color="#F8FAFC";btn.style.transform="scale(1)"},220);
            scheduleAutoSave();
          }},String(p.stats[s.key]));
          var dec=h("button",{className:"dec-btn",onclick:function(){
            if(p.stats[s.key]<=0)return;
            pushUndoStats(shortName(playerById(p.id))+" · "+s.label+" −1");
            p.stats[s.key]--;btn.textContent=String(p.stats[s.key]);scheduleAutoSave();
          }},"−");
          return h("div",{className:"stat-cell",style:{width:(100/g.stats.length)+"%"}},btn,dec);
        })));
    });
    return h("div",null,header,rows);
  }

  var main;
  if(!filtered.length)main=h("div",{className:"empty"},"Aucune joueuse à cette position");
  else if(useSide){
    var nav=h("div",{className:"side-nav"},groups.map(function(g){
      var b=h("button",{className:"side-btn"+(visGid===g.id?" active":""),style:{color:visGid===g.id?g.color:"#94A3B8"},onclick:function(){
        state.expandedGroup=g.id;render();
      }},g.name);
      if(visGid===g.id)b.style.background=g.color+"10";
      return b;
    }));
    main=h("div",{className:"side-layout"},nav,
      h("div",{style:{flex:"1",overflowY:"auto"}},visGid?buildGrid(SG[visGid]):h("div",{className:"empty"},"← Sélectionnez")));
  }
  else if(visGid)main=buildGrid(SG[visGid]);
  else main=h("div",{style:{padding:isTablet()?"16px":"10px"}},
    h("p",{style:{color:"#64748B",fontSize:"12px",textAlign:"center",margin:"0 0 10px"}},"Sélectionnez une catégorie"),
    h("div",{className:"cards-grid"},filtered.map(function(p){
      return h("div",{className:"p-card"},
        h("div",{style:{fontSize:"14px",fontWeight:"700",color:"#F8FAFC"}},
          (p.number?"#"+p.number+" ":"")+shortName(playerById(p.id))+" ",
          h("span",{style:{fontWeight:"400",color:"#64748B",fontSize:"11px"}},p.position||"")),
        h("div",{className:"tags"},groups.map(function(g){
          var tot=g.stats.reduce(function(s,st){return s+p.stats[st.key]},0);
          return h("button",{className:"tag-btn",style:{background:g.color+"15",color:g.color,border:"1px solid "+g.color+"40"},onclick:function(){
            state.expandedGroup=g.id;render();
          }},g.name+" "+tot);
        })));
    })));

  return h("div",{style:{display:"flex",flexDirection:"column",flex:"1",overflow:"hidden"}},
    renderCourtBar(team),viewRow,filterBar,
    h("div",{className:"content","data-scroll-key":"grid-content"},main),saveBar(team));
}

/* Enregistre la session courante puis remet les compteurs à zéro */
function saveSession(team,name){
  var season=curSeason();
  var entries=team.playerIds.map(function(pid){
    var p=playerById(pid),e=rosterEntry(season,pid);
    return {playerId:pid,name:p?fullName(p):"",number:e?e.number:"",position:e?e.position:"",stats:clone(statsOf(team,pid))};
  }).filter(function(en){return hasStats(en.stats)});
  if(!entries.length){showToast("⚠️ Aucune statistique à enregistrer");return false}
  team.sessions.unshift({id:uid(),name:name,date:nowISO(),teamName:team.name,entries:entries});
  team.stats={};
  clearUndo();saveNow();
  return true;
}
