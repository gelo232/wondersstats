<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Comprendre le système 6-2 sans libéro : rotations, réception, passe, attaque et soutien, animés sur un terrain.">
<link rel="icon" type="image/png" href="icon.png">
<title>Comprendre le 6-2 — Les Wonders</title>
<style>
/* ══ Comprendre le 6-2 ══════════════════════════════════════════════════
   Page pédagogique à part de WonderStats, pour les athlètes de 12-13 ans.
   Aucune donnée commune : elle n'en partage que les jetons de design et le
   service worker.

   L'écran tient en une boucle : rotation → terrain → une phrase → la barre
   de temps. Tout ce qui s'apprend se montre sur le terrain ; les textes ne
   dépassent pas une phrase.                                             */
:root{
  --bg:#0F172A; --surface:#1E293B; --surface-2:#162032; --sunken:#0B1220;
  --line:#334155; --line-strong:#475569; --focus:#93C5FD;
  --txt:#E2E8F0; --txt-strong:#F8FAFC; --txt-soft:#CBD5E1; --txt-dim:#94A3B8;
  --accent:#3B82F6; --accent-ink:#93C5FD; --accent-solid:#1D4ED8;
  --gold:#FBBF24; --near:#34D399; --far:#60A5FA;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  --ff:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --free:#0F2136; --court:#23487A; --court-opp:#1A3152; --court-line:#F1F5F9;
  /* Une couleur par athlète : elle ne change jamais, même quand le rôle change. */
  --c-OH1:#60A5FA; --c-OH2:#C084FC; --c-MB1:#34D399; --c-MB2:#F472B6; --c-S:#FB923C; --c-Opp:#F87171;
  --ball:#FDE047;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 var(--ff);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── Mise en page : une colonne sur téléphone, le terrain à gauche au-delà ── */
.app{max-width:1240px;margin:0 auto;padding:8px 12px 12px;display:grid;gap:6px;grid-template-columns:minmax(0,1fr);
  grid-template-areas:"barre" "rots" "terrain" "legende" "transport" "postes" "pied"}
.barre{grid-area:barre}.rots{grid-area:rots}.terrain{grid-area:terrain}.legende{grid-area:legende}
.transport{grid-area:transport}.postes{grid-area:postes}.bas{grid-area:pied;min-height:0}
@media (min-width:880px){
  .app{grid-template-columns:minmax(0,1fr) 380px;column-gap:16px;padding:10px 16px;height:100vh;height:100dvh;
    grid-template-rows:auto auto auto auto auto minmax(0,1fr);
    grid-template-areas:"barre barre" "terrain postes" "terrain rots" "terrain legende" "terrain transport" "terrain pied"}
}

/* ── Barre du haut ───────────────────────────────── */
.barre{display:flex;align-items:center;gap:6px}
.logo{margin:0;font-size:20px;font-weight:800;color:var(--txt-strong);padding:0 6px 0 2px;white-space:nowrap}
.logo small{display:none;font-size:13px;font-weight:500;color:var(--txt-dim);margin-left:8px}
@media (max-width:419px){.logo{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0)}}
@media (min-width:640px){.logo small{display:inline}}
.seg{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--sunken);padding:2px;border-radius:var(--r-md);min-width:0;max-width:440px;margin-right:auto}
.seg button{border:0;background:transparent;color:var(--txt-dim);font-weight:700;font-size:15px;min-height:44px;border-radius:10px;padding:0 4px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-solid);color:#fff}
.ico{flex:none;min-width:44px;height:44px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);
  font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
.ico .txt{display:none;font-weight:700}
@media (min-width:520px){.ico .txt{display:inline}.ico{padding:0 12px}}

/* ── Rotations ───────────────────────────────────── */
.rots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.rot{position:relative;min-height:44px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);font-weight:800;font-size:16px;padding:0 0 6px}
.rot i{position:absolute;left:50%;bottom:6px;width:16px;height:4px;margin-left:-8px;border-radius:2px}
.rot[aria-pressed="true"]{background:var(--accent-solid);border-color:var(--accent-ink);color:#fff}

/* ── Terrain ─────────────────────────────────────── */
.terrain{position:relative;background:var(--free);border-radius:var(--r-lg);overflow:hidden;display:flex;justify-content:center;min-height:0}
.terrain svg{display:block;width:100%;height:auto;min-height:260px;max-height:calc(100vh - 274px);max-height:calc(100dvh - 274px);
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
@media (min-width:880px){.terrain svg{height:100%;max-height:none;min-height:0}}
.sur{position:absolute;top:8px;display:flex;gap:6px;pointer-events:none}
.sur.g{left:8px}.sur.d{right:8px;top:auto;bottom:8px}
.puce{pointer-events:auto;min-height:44px;border-radius:var(--r-pill);border:1px solid var(--gold);background:rgba(11,18,32,.9);color:var(--txt-strong);
  font-weight:700;font-size:15px;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
/* Seuls les pions, les cibles et les endroits du quiz se touchent : le ballon, les trajets et les repères laissent passer. */
#g-fond,#g-bases,#g-ombre,#g-couv,#g-chemins,#g-trace,#g-adv,#g-ballon{pointer-events:none}
.zone-num{font:800 .62px var(--ff);fill:#F1F5F9;opacity:.2}
.opp-lbl{font:700 .34px var(--ff);fill:var(--txt-dim);text-anchor:middle;letter-spacing:.04em}
.cible-lbl{font:800 .36px var(--ff);fill:var(--gold);text-anchor:middle}
.base text{font:800 .5px var(--ff);fill:#F1F5F9;text-anchor:middle;dominant-baseline:central;opacity:.75}
.pion{cursor:pointer;outline:none}
.pion:focus-visible .corps{stroke:var(--focus);stroke-width:.12}
.pion .corps{stroke:#0B1220;stroke-width:.06}
.pion .lbl{font:800 .42px var(--ff);fill:#0B1220;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pion .or{fill:none;stroke:var(--gold);stroke-width:.1;display:none}
.pion.passeuse .or{display:block}
.pion .toi{fill:none;stroke:#fff;stroke-width:.09;stroke-dasharray:.2 .13;display:none}
.pion.suivi .toi{display:block}
.pion.suivi .corps{stroke:#fff;stroke-width:.1}
.pion .idc{display:none}
.pion.autre-role .idc{display:block}
.pion .idc rect{fill:#0B1220;stroke:#F1F5F9;stroke-width:.03}
.pion .idc text{font:800 .25px var(--ff);fill:#F1F5F9;text-anchor:middle;dominant-baseline:central}
.pion.flash .lbl{animation:lbl .8s ease-out}
.pion.bon .corps{stroke:var(--near);stroke-width:.16}
.pion.faux{animation:non .4s}
@keyframes lbl{0%{opacity:0}100%{opacity:1}}
@keyframes non{0%,100%{opacity:1}50%{opacity:.25}}
.attenue .pion:not(.suivi){opacity:.8}
.adv circle{fill:#64748B;stroke:#CBD5E1;stroke-width:.04}
.chemin{fill:none;stroke-width:.09;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.chemin.fort{stroke-width:.14;opacity:1}
.fantome{fill:none;stroke-width:.05;stroke-dasharray:.1 .08;opacity:.7}
.trace-ballon{fill:none;stroke:var(--ball);stroke-width:.06;stroke-dasharray:.16 .13;opacity:.9}
.couv circle{stroke-width:.05}
.couv.p circle{fill:rgba(52,211,153,.2);stroke:var(--near)}
.couv.l circle{fill:rgba(96,165,250,.18);stroke:var(--far)}
.but{cursor:pointer;outline:none}
.but .rond{fill:rgba(11,18,32,.82);stroke:var(--gold);stroke-width:.08}
.but .num{font:800 .5px var(--ff);fill:var(--gold);text-anchor:middle;dominant-baseline:central}
.but .qui{font:800 .27px var(--ff);fill:#F8FAFC;text-anchor:middle}
.but:focus-visible .rond{stroke:var(--focus);stroke-width:.14}
.but.pulse .rond{animation:pulse 1.1s ease-in-out infinite}
.but.off{cursor:not-allowed}.but.off .rond{stroke:#64748B;stroke-dasharray:.14 .1}.but.off .num,.but.off .qui{fill:#94A3B8}
.but.choisi .rond{fill:rgba(180,120,10,.9)}
@keyframes pulse{0%,100%{stroke-width:.08}50%{stroke-width:.2}}
.but.adv .num{font-size:.46px}
.ombre{fill:rgba(2,6,16,.42)}
.piscine ellipse{fill:rgba(56,189,248,.13);stroke:#7DD3FC;stroke-width:.05;stroke-dasharray:.16 .12}
.piscine text{font:700 .3px var(--ff);fill:#BAE6FD;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em}
.spot{cursor:pointer}.spot circle{fill:rgba(248,250,252,.14);stroke:#F8FAFC;stroke-width:.07;stroke-dasharray:.2 .14}
.spot text{font:800 .6px var(--ff);fill:#F8FAFC;text-anchor:middle;dominant-baseline:central}

/* ── La phrase ───────────────────────────────────── */
.legende{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:6px 12px;min-height:92px;display:flex;flex-direction:column;justify-content:center}
.legende .etape{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.legende .phrase{margin:0;font-size:18px;font-weight:700;color:var(--txt-strong);line-height:1.25}
.legende .sous{margin:2px 0 0;font-size:16px;color:var(--txt-soft);line-height:1.25}
.legende.ok{border-color:var(--near)}.legende.non{border-color:var(--gold)}

/* ── Transport : lecture, barre de temps, rotation suivante ── */
.transport{display:flex;align-items:center;gap:8px}
.rond-btn{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid var(--accent-ink);background:var(--accent-solid);color:#fff;font-size:20px;font-weight:800;line-height:1}
.suite{flex:none;min-width:66px;height:48px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);font-weight:800;font-size:16px;padding:0 10px;white-space:nowrap}
.suite.appel{background:var(--accent-solid);border-color:var(--accent-ink);color:#fff}
.btn{min-height:48px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);font-weight:700;padding:0 14px}
.btn.primaire{background:var(--accent-solid);border-color:var(--accent-ink);color:#fff}
.temps{position:relative;flex:1;min-width:0;height:48px;display:flex;align-items:center}
.temps input{-webkit-appearance:none;appearance:none;width:100%;height:48px;margin:0;background:transparent;cursor:pointer}
.temps input::-webkit-slider-runnable-track{height:10px;border-radius:5px;border:1px solid var(--line-strong);
  background:linear-gradient(to right,var(--accent) var(--p,0%),var(--sunken) var(--p,0%))}
.temps input::-moz-range-track{height:10px;border-radius:5px;border:1px solid var(--line-strong);background:var(--sunken)}
.temps input::-moz-range-progress{height:10px;border-radius:5px;background:var(--accent)}
.temps input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--accent-solid);margin-top:-10px;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.temps input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent-solid)}
.temps input:disabled{opacity:.45;cursor:default}
.ticks{position:absolute;left:14px;right:14px;top:50%;height:0;pointer-events:none}
.ticks i{position:absolute;top:-17px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--txt-dim)}
.ticks i.choix{background:var(--gold);height:10px;top:-20px}
.quiz-barre{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:18px;min-width:0}
.quiz-barre .et{color:var(--gold);letter-spacing:.1em}

/* ── Je suis… ────────────────────────────────────── */
.postes h2{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--txt-dim)}
.postes .liste{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:4px}
.poste{min-height:46px;border-radius:var(--r-md);border:2px solid var(--line-strong);background:var(--surface);font-weight:800;font-size:14px;padding:0}
.poste[aria-pressed="true"]{color:#0B1220}
.poste.eq[aria-pressed="true"]{background:var(--txt-strong);border-color:#fff}
.pied{color:var(--txt-dim);font-size:13px;margin:0}
.cote{display:none}
@media (min-width:880px){
  .bas{display:flex;flex-direction:column;gap:8px;overflow:auto}
  .cote{display:block}.cote h2{margin:4px 0 6px;font-size:13px;font-weight:700;color:var(--txt-dim)}
  .cote .cartes{grid-template-columns:repeat(2,minmax(0,1fr))}
  #b-decouvrir{display:none}
}

/* ── Feuilles : Découvrir, Réglages ──────────────── */
dialog{border:1px solid var(--line-strong);padding:0;background:var(--surface);color:var(--txt);border-radius:var(--r-lg);
  width:calc(100vw - 16px);max-width:600px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(2,6,16,.72)}
.feuille{padding:12px 14px 16px}
.feuille header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.feuille h2{margin:0;font-size:20px;color:var(--txt-strong)}
.cartes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.cartes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.carte{display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:4px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface-2);padding:8px 8px 10px;min-height:44px}
.carte svg{display:block;width:100%;height:auto;border-radius:8px;background:var(--free)}
.carte b{font-size:16px;color:var(--txt-strong)}
.carte span{font-size:14px;color:var(--txt-soft);line-height:1.25}
.reglage{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer;font-size:16px}
.reglage input{width:24px;height:24px;flex:none}
.reglages .lang{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.reglages .lang button[aria-pressed="true"]{background:var(--accent-solid);border-color:var(--accent-ink);color:#fff}
.note{color:var(--txt-dim);font-size:14px;margin:10px 0 0}
.retour{min-height:22px;margin:6px 0 0;color:var(--near);font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.reduit *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="barre">
    <h1 class="logo">6-2 <small data-t="sousTitre"></small></h1>
    <div class="seg" role="group" data-t-aria="situation">
      <button type="button" data-sit="recoit" data-t="recoit"></button>
      <button type="button" data-sit="sert" data-t="sert"></button>
    </div>
    <button type="button" class="ico" id="b-decouvrir"><span aria-hidden="true">💡</span><span class="txt" data-t="decouvrir"></span></button>
    <button type="button" class="ico" id="b-langue"></button>
    <button type="button" class="ico" id="b-reglages" data-t-aria="reglages"><span aria-hidden="true">⚙</span></button>
  </header>

  <nav class="rots" id="rots" data-t-aria="rotation"></nav>

  <section class="terrain" aria-labelledby="terrain-titre">

    <svg id="terrain" viewBox="-0.6 -2.85 10.2 13.5" role="group" aria-labelledby="terrain-titre terrain-desc">
      <desc id="terrain-desc"></desc>

      <g id="g-fond"></g>
      <g id="g-bases" class="base"></g>

      <g id="g-couv"></g>
      <g id="g-chemins"></g>
      <g id="g-trace"></g>
      <g id="g-adv" class="adv"></g>
      <g id="g-spots"></g>
      <g id="g-joueuses"></g>
      <g id="g-buts"></g>
      <g id="g-advbuts"></g>
      <g id="g-ballon"></g>
    </svg>
    <div class="sur g"><button type="button" class="puce" id="b-exc-fin" hidden></button></div>
    <div class="sur d"><button type="button" class="puce" id="b-contre" hidden></button></div>
  </section>

  <section class="legende" id="legende" aria-live="polite">
    <div class="etape" id="l-etape"></div>

  <section class="transport" aria-labelledby="t-transport">
    <h2 class="vh" id="t-transport" data-t="lecture"></h2>
    <button type="button" class="rond-btn" id="b-voir"></button>
    <div class="temps" id="z-temps">
      <input type="range" id="temps" min="0" max="1000" step="1" value="0">
      <div class="ticks" id="ticks" aria-hidden="true"></div>

    <button type="button" class="suite" id="b-suite"></button>

  <section class="postes" aria-labelledby="t-postes">
    <h2 id="t-postes" data-t="jeSuis"></h2>

  <div class="bas">

</div>

<dialog id="d-decouvrir" aria-labelledby="t-decouvrir">

    <header><h2 id="t-decouvrir" data-t="decouvrir"></h2><button type="button" class="btn" data-fermer data-t="fermer"></button></header>
    <div class="cartes" id="cartes"></div>

</dialog>

      <button type="button" class="btn" data-lang="en">English</button>

</dialog>

<script>
(function(){
"use strict";
var VERSION="2.2.0";

/* ══ 1. Modèle sportif ═══════════════════════════════════════════════════
   Les identités de suivi (OH1, OH2, MB1, MB2, Opp, S) ne changent jamais.
   Le rôle affiché S/Opp se calcule depuis le statut avant/arrière ; les
   rôles de scène (FL, FC, FR, BS, BC, BA) depuis la rotation ET la
   situation. Rien ne se déduit de l'endroit où court un pion.            */
var IDS=["OH1","OH2","MB1","MB2","Opp","S"];
var BASE_R1=["S","OH1","MB1","Opp","OH2","MB2"];            // P1 → P6 en R1
function rotation(r){var a=BASE_R1.slice();for(var i=1;i<r;i++)a.push(a.shift());return a}
function posRot(r,id){return rotation(r).indexOf(id)+1}
function avantP(p){return p>=2&&p<=4}
function estAvant(r,id){return avantP(posRot(r,id))}
function paire(id){return id==="S"||id==="Opp"}
function famille(id){return paire(id)?"SO":id.slice(0,2)}
function roleAffiche(r,id){return paire(id)?(estAvant(r,id)?"Opp":"S"):id}
function passeuseActive(r){return estAvant(r,"S")?"Opp":"S"}
function partenaireAvant(r){return passeuseActive(r)==="S"?"Opp":"S"}      // la dépanneuse
/* La consigne du coach : en réception, passeuse en P1, les ailes ne permutent pas —
   l'Opp avant reste en 4, l'ailière avant reste en 2. */
function garderAiles(r,sit){return sit==="recoit"&&posRot(r,passeuseActive(r))===1}
function rolesScene(r,sit){
  var rot=rotation(r),av=[rot[1],rot[2],rot[3]],ar=[rot[0],rot[4],rot[5]];
  function un(l,f){for(var i=0;i<l.length;i++)if(famille(l[i])===f)return l[i]}
  var k=garderAiles(r,sit),oh=un(av,"OH"),so=un(av,"SO");
  return {FL:k?so:oh,FC:un(av,"MB"),FR:k?oh:so,BS:un(ar,"SO"),BC:un(ar,"MB"),BA:un(ar,"OH")};
}
function baseDefense(r,id){if(estAvant(r,id))return null;return paire(id)?1:famille(id)==="MB"?5:6}
function attaquantes(r,sit){var R=rolesScene(r,sit);return {4:R.FL,3:R.FC,2:R.FR}}

/* ══ 2. Placements (mètres ; x 0 → 9 de gauche à droite, y 0 au filet → 9
   à la ligne de fond ; l'adversaire en y négatif).

   Le 6-2 n'a que TROIS formations de réception — passeuse en 1, en 6 ou
   en 5 — rejouées deux fois. Chacune place déjà les joueuses au plus près
   de leur travail suivant : seule la passeuse court, les attaquantes qui
   ne reçoivent pas sont à leur départ d'élan, les arrières restent où
   elles reçoivent. On se déplace peu.                                    */
function P(x,y){return {x:x,y:y}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var CIBLE=P(6.1,1.1);
var ROLE_ATT={4:"FL",3:"FC",2:"FR"},ATT_ROLE={FL:4,FC:3,FR:2};
var ELAN={4:P(1,3.2),3:P(4.6,2.7),2:P(8,3.2)};              // départs d'élan
var FRAPPE={4:P(0.9,1),3:P(4.5,0.9),2:P(8.1,1)};
var DEST={4:P(6.2,-5),3:P(3.2,-5.5),2:P(2.8,-5)};
var FORMATIONS={                                           // réception, P1 → P6
  1:[[8,5.9],[6.5,5.1],[4.6,2.7],[1,3.2],[1.9,5.6],[4.5,6.2]],
  6:[[7.3,5.6],[7.5,3],[6.4,0.85],[1.9,5],[4.3,6.3],[5.75,1.75]],
  5:[[7.5,5.8],[8,3.2],[2.5,5.2],[1.4,2.4],[4.4,3.7],[5.3,6.2]]};
var RECEPTRICE={1:"MB2",2:"OH2",3:"OH1",4:"MB1",5:"OH1",6:"OH2"};
/* Notre service : les joueuses se serrent près de leur base, la serveuse
   sert du côté où elle défend. P1 → P6 ; P1 est la serveuse.            */
var SERVICE={
  1:[[8.4,9.7],[5.6,2],[4.5,1.2],[3.4,3.3],[1.5,7.2],[2.5,5.3]],
  6:[[4.5,9.7],[6.3,1],[5.3,2.4],[1.8,1.3],[0.3,5.3],[8.7,5.3]],
  5:[[0.6,9.7],[7.3,1.3],[3.4,2.5],[2.5,1],[6.8,5.1],[7.8,7.3]]};
/* Défense de base, après notre service : les arrières partent du périmètre — la centrale (5) et la
   passeuse (1) un pied sur la ligne de côté, l'ailière (6) au fond. De là, chaque zone de défense
   est à un pas, et l'on ne se déplace que vers le centre du terrain.                             */
var BASE={FL:P(1.8,1.3),FC:P(4.5,1.2),FR:P(7.3,1.3),BS:P(8.7,5.3),BC:P(0.3,5.3),BA:P(4.5,7.5)};
var ZONES={5:BASE.BC,6:BASE.BA,1:BASE.BS};
/* L'attaque adverse vient de notre droite (D, le côté de la passeuse), du centre (C) ou de notre
   gauche (G, le côté de l'ailière). Le contre ferme une partie du terrain ; les autres couvrent le
   reste :
   · ligne  — l'arrière du côté de l'attaque, un pied sur la ligne : la ligne, et la « piscine »
              (le milieu du terrain, derrière le contre) ;
   · grande — l'arrière opposée, un pied sur sa ligne : la grande diagonale que le contre laisse ;
   · petite — l'avant qui ne contre pas recule du filet : la petite diagonale ;
   · fond   — l'ailière arrière, au fond, dans l'axe du trou du contre : les ballons touchés par
              le contre et ceux qui passent entre les deux contreuses.
   G est le miroir de D. Au centre, la centrale contre avec l'aide de l'avant de droite.          */
var ADVERSE={
  D:{h:P(7.8,-1),bloc:{FC:P(6.1,0.65),FR:P(7.2,0.65)},def:{FL:P(1.4,3.2),BS:P(8.7,4.6),BC:P(0.3,6),BA:P(5.1,7.8)},ligne:"BS",grande:"BC",petite:"FL"},
  C:{h:P(4.5,-0.9),bloc:{FC:P(4.3,0.65),FR:P(5.4,0.65)},def:{FL:P(1.6,3.1),BS:P(8.7,4.8),BC:P(0.3,5.7),BA:P(5.3,7.8)},ligne:"BS",grande:"BC",petite:"FL"},
  G:{h:P(1.2,-1),bloc:{FC:P(2.9,0.65),FL:P(1.8,0.65)},def:{FR:P(7.6,3.2),BS:P(8.7,6),BC:P(0.3,4.6),BA:P(3.9,7.8)},ligne:"BC",grande:"BS",petite:"FR"}};
/* L'ombre du contre se trace comme au tableau : depuis un point reculé derrière l'attaquante, entre
   les mains extérieures des deux contreuses. La ligne et la grande diagonale restent ouvertes. */
var OMBRE_RECUL=-4.5,MAINS=0.35;
var PISCINE=P(4.5,4.2),RECENTRE=P(2.2,5.6),RECENTRE_6=P(4.7,6.6);
/* Soutien 3-2 : une coupe autour de l'attaquante, vue depuis le ballon. Cinq rayons partent du
   point de frappe, régulièrement espacés : trois places proches (p) et, dans les intervalles,
   deux places plus loin (l). Aucune joueuse n'est derrière une autre par rapport au ballon, et
   il ne reste pas de trou entre deux voisines. Sur son rayon, chacune s'arrête au plus près
   d'où elle vient.
   Les angles se comptent depuis le filet (0°) vers le fond du terrain (90°).
   Chaque place : angle, proche ou loin, distance mini et maxi à l'attaquante (m).               */
var COUPE={aile:[[12,"p",2.1,2.9],[30,"l",4.4,6],[48,"p",2.1,3.2],[66,"l",4.4,6],[84,"p",2.1,3.2]],
  centre:[[25,"p",2.1,3],[57,"l",4.2,5.6],[90,"p",2.1,3],[123,"l",4.2,5.6],[155,"p",2.1,3]]};

/* ══ 3. Scènes ═══════════════════════════════════════════════════════════
   Une scène est une fonction pure du temps : la barre de temps, la pause,
   le retour et le changement d'attaque ne sont que des lectures de cette
   fonction. Chaque joueuse a des déplacements datés, le ballon des vols
   datés ; rien n'est mémorisé d'une image à l'autre.                     */
var EPS=1e-3,SEUIL=1.02;
function lisse(s){s=clamp(s,0,1);return s*s*(3-2*s)}
function duree(d){return clamp(0.45+d/3.1,0.7,2.1)}
function surChemin(pts,s){
  if(pts.length<2)return pts[0];
  var L=0,i,seg=[];
  for(i=1;i<pts.length;i++){var l=dist(pts[i-1],pts[i]);seg.push(l);L+=l}
  var v=s*L;
  for(i=1;i<pts.length;i++){if(v<=seg[i-1]||i===pts.length-1){var u=seg[i-1]?clamp(v/seg[i-1],0,1):1;
    return P(pts[i-1].x+(pts[i].x-pts[i-1].x)*u,pts[i-1].y+(pts[i].y-pts[i-1].y)*u)}v-=seg[i-1]}
  return pts[pts.length-1];
}
function Scene(o){this.o=o;this.start={};this.tr={};this.ballon=[];this.ph=[];this.mk=[];this.contacts=[];this.adv=[]}
Scene.prototype.pos=function(id,t){
  var p=this.start[id],L=this.tr[id]||[];
  for(var i=0;i<L.length;i++){var k=L[i];if(t<k.t0)return p;
    if(t<=k.t1)return surChemin(k.pts,lisse((t-k.t0)/(k.t1-k.t0)));p=k.pts[k.pts.length-1]}
  return p;
};
Scene.prototype.marge=function(id,c,t0){
  var m=99,n=28,self=this;
  for(var i=0;i<=n;i++){var t=t0+(c.t1-t0)*i/n,p=t<c.t0?c.pts[0]:surChemin(c.pts,lisse((t-c.t0)/(c.t1-c.t0)));
    IDS.forEach(function(o){if(o===id)return;var dd=dist(p,self.pos(o,t));if(dd<m)m=dd})}
  return m;
};
/* Un déplacement : départ = où est la joueuse à t0, arrivée imposée. Le
   trajet direct d'abord ; s'il croise une partenaire, un contournement ou
   un départ un peu plus tardif. L'arrivée, elle, ne bouge jamais.        */
Scene.prototype.move=function(id,t0,t1,to,opt){
  opt=opt||{};
  var from=this.pos(id,t0),L=this.tr[id]||(this.tr[id]=[]);
  if(dist(from,to)<0.05)return;
  if(opt.via){L.push({t0:t0,t1:t1,pts:[from].concat(opt.via,[to])});return}
  var dx=to.x-from.x,dy=to.y-from.y,len=Math.hypot(dx,dy),px=-dy/len,py=dx/len,mx=(from.x+to.x)/2,my=(from.y+to.y)/2;
  var delais=opt.fixe?[0]:[0,0.2,0.4],offs=opt.direct?[0]:[0,0.7,-0.7,1.3,-1.3],cands=[];
  delais.forEach(function(dl){if(dl&&t1-t0-dl<0.6)return;offs.forEach(function(k){
    var pts=[from];if(k)pts.push(P(clamp(mx+px*k,-0.3,9.3),clamp(my+py*k,0.45,9.4)));pts.push(to);
    cands.push({t0:t0+dl,t1:t1,pts:pts,cout:Math.abs(k)*1.5+dl})})});
  cands.sort(function(a,b){return a.cout-b.cout});
  var best=cands[0];
  if(cands.length>1){
    var self=this,bord=function(t,p){var m=99;IDS.forEach(function(o){if(o!==id)m=Math.min(m,dist(p,self.pos(o,t)))});return m};
    var seuil=Math.min(SEUIL,bord(t0,from)-0.02,bord(t1,to)-0.02),bm=-99;
    for(var i=0;i<cands.length;i++){var m=this.marge(id,cands[i],t0);if(m>=seuil){best=cands[i];break}
      var note=Math.min(m,seuil)-0.06*cands[i].cout;if(note>bm){bm=note;best=cands[i]}}
  }
  L.push({t0:best.t0,t1:best.t1,pts:best.pts});
};
Scene.prototype.vers=function(id,t0,to,opt){var d=dist(this.pos(id,t0),to);if(d<0.05)return;this.move(id,t0,t0+duree(d),to,opt)};
Scene.prototype.direct=function(id,t0,t1,to){var L=this.tr[id]||(this.tr[id]=[]);L.push({t0:t0,t1:t1,pts:[this.pos(id,t0),to]})};
Scene.prototype.balle=function(t0,t1,a,b,z0,z1,apex,k,par){this.ballon.push({t0:t0,t1:t1,a:a,b:b,z0:z0,z1:z1,apex:apex,k:k,par:par})};
Scene.prototype.balleA=function(t){
  var B=this.ballon;if(!B.length)return null;
  if(t<=B[0].t0)return {x:B[0].a.x,y:B[0].a.y,z:B[0].z0};
  for(var i=0;i<B.length;i++){var b=B[i];
    if(t>=b.t0&&t<=b.t1){var s=(t-b.t0)/(b.t1-b.t0),h=b.apex-(b.z0+b.z1)/2;
      return {x:b.a.x+(b.b.x-b.a.x)*s,y:b.a.y+(b.b.y-b.a.y)*s,z:Math.max(0,b.z0+(b.z1-b.z0)*s+4*h*s*(1-s))}}}
  var d=B[B.length-1];for(i=B.length-1;i>=0;i--)if(B[i].t1<=t){d=B[i];break}
  return {x:d.b.x,y:d.b.y,z:d.z1};
};
Scene.prototype.phase=function(k,t){this.ph.push({k:k,t:t})};
Scene.prototype.repere=function(t,contact){this.mk.push(t);if(contact)this.contacts.push(t)};
Scene.prototype.phaseA=function(t){var k=this.ph[0].k;for(var i=0;i<this.ph.length;i++)if(this.ph[i].t<=t+1e-6)k=this.ph[i].k;return k};
Scene.prototype.reperes=function(){return this.mk.slice().sort(function(a,b){return a-b})};
Scene.prototype.parcours=function(id){var d=0;(this.tr[id]||[]).forEach(function(k){for(var i=1;i<k.pts.length;i++)d+=dist(k.pts[i-1],k.pts[i])});return d};

function indispo(sc,a){return !!sc.o.exc&&sc.R[ROLE_ATT[a]]===sc.backup}
function construire(o){
  var sc=new Scene(o),r=o.r;
  sc.R=rolesScene(r,o.sit);sc.role={};for(var k in sc.R)sc.role[sc.R[k]]=k;
  sc.keep=garderAiles(r,o.sit);sc.passeuse=passeuseActive(r);sc.backup=partenaireAvant(r);
  sc.passeNow=o.exc?sc.backup:sc.passeuse;sc.type=posRot(r,sc.passeuse);
  if(o.sit==="recoit")recoit(sc);else sert(sc);
  sc.a=indispo(sc,o.att)?[4,3,2].filter(function(a){return !indispo(sc,a)})[0]:o.att;
  attaque(sc);
  sc.fin=Math.max.apply(null,sc.mk);
  return sc;
}

/* On reçoit. La passeuse part au contact du service ; les réceptionneuses
   ne bougent pas tant que le ballon n'est pas joué.                      */
function recoit(sc){
  var r=sc.o.r,rot=rotation(r),F=FORMATIONS[sc.type],R=sc.R,exc=sc.o.exc;
  IDS.forEach(function(id){var c=F[rot.indexOf(id)];sc.start[id]=P(c[0],c[1])});
  sc.adv=["A1"];sc.start.A1=P(2.2,-9.9);
  var rec=exc?R.BS:RECEPTRICE[r];sc.rec=rec;
  var T1=1.4,T2=3.2;
  sc.balle(0,T1,sc.start.A1,sc.start[rec],2.6,0.8,4.2,"service","A1");
  sc.balle(T1,T2,sc.start[rec],CIBLE,0.8,2.3,4.4,"reception",rec);
  ["FC","FL","FR"].forEach(function(k){var id=R[k],e=ELAN[ATT_ROLE[k]];
    if(exc&&id===sc.backup)return;
    if(id===rec)sc.vers(id,T1+0.15,e);                     // elle reçoit, puis se dégage vers son élan
    else if(famille(id)==="OH")sc.vers(id,T1,e);           // réceptionneuse non servie : elle attend la réception
    else sc.vers(id,0.1,e,{fixe:true})});
  /* Passeuse en 6 (R2, R5) : S et Opp sont déjà au filet, autour de la cible ; la centrale avant
     est sur la ligne des 3 m côté 2. L'Opp s'écarte vers son élan, la passeuse fait un pas. */
  var pres=dist(sc.start[R.BS],CIBLE)<1.5;
  if(exc){sc.move(sc.backup,T1-0.3,T2-0.2,CIBLE,{fixe:true});
    if(pres)sc.move(R.BS,T1+0.15,T2-0.3,P(7.6,3.4));}    // elle a reçu au pied de la cible : elle la libère
  else if(pres)sc.move(R.BS,0.1,1.3,CIBLE);
  else sc.vers(R.BS,0.1,CIBLE);
  sc.phase("avant",0);sc.phase("service",EPS);sc.phase("reception",T1);sc.phase("choix",T2);
  sc.repere(0);sc.repere(T1,true);sc.repere(T2,true);
  sc.T1=T1;sc.Tc=T2;sc.tBases=-1;
}

/* On sert. Au contact, chacune rejoint sa base : OH avant à gauche, MB au
   centre, S/Opp avant à droite ; MB arrière en 5, OH arrière en 6, passeuse
   en 1. Puis une attaque adverse exemple, à notre droite.                */
function sert(sc){
  var r=sc.o.r,rot=rotation(r),R=sc.R,exc=sc.o.exc,srv=rot[0],S=SERVICE[sc.type];sc.serveuse=srv;
  rot.forEach(function(id,i){sc.start[id]=P(S[i][0],S[i][1])});
  var cote=sc.o.adv||"D",A=ADVERSE[cote],h=A.h;sc.cote=cote;
  sc.adv=["A1","A2","A3"];sc.start.A1=P(4.5,-6.5);sc.start.A2=P(3.2,-1.8);sc.start.A3=P(h.x+0.3,h.y-3.4);
  var T1=1.3,T2=2.5,T3=3.7,T4=4.4,T5=6.5,dig=exc?R.BS:R.BA,pd=A.def[sc.role[dig]];sc.digger=dig;
  sc.balle(0,T1,sc.start[srv],sc.start.A1,2.7,0.8,4.4,"service",srv);
  sc.balle(T1,T2,sc.start.A1,sc.start.A2,0.8,2.3,4.2,"adv","A1");
  sc.balle(T2,T3,sc.start.A2,h,2.3,3,3.8,"adv","A2");
  sc.balle(T3,T4,h,pd,3,0.6,3.1,"attaqueAdv","A3");
  sc.balle(T4,T5,pd,CIBLE,0.6,2.3,4.4,"defense",dig);
  sc.direct("A3",T3-0.9,T3,h);
  /* Passeuse au service (R1, R4) : les deux ailes se croisent, chacune dans son couloir. */
  if(sc.type===1){sc.move(R.FL,0.12,1.8,BASE.FL,{via:[P(4.5,2.25)]});sc.move(R.FR,0.12,1.8,BASE.FR,{via:[P(4.9,3.35)]})}
  ["FC","FR","FL","BC","BA","BS"].forEach(function(k){var id=R[k];
    if(sc.type===1&&(k==="FL"||k==="FR"))return;sc.vers(id,id===srv?0.3:0.12,BASE[k])});
  /* La passe adverse part : le contre se forme, chacune prend sa zone — un pas depuis sa base. */
  ["FC","FR","FL","BS","BC","BA"].forEach(function(k){sc.move(R[k],T2+(A.bloc[k]?0.1:0.25),T3-0.05,A.bloc[k]||A.def[k])});
  if(exc)sc.move(sc.backup,T4+0.1,T5-0.3,CIBLE,{fixe:true});
  else sc.move(R.BS,T4+0.05,T5-0.35,CIBLE);
  ["FC","FR","FL"].forEach(function(k){var id=R[k];if(exc&&id===sc.backup)return;sc.vers(id,T4+0.1,ELAN[ATT_ROLE[k]])});
  /* Le ballon est défendu : la centrale quitte sa ligne et l'ailière arrière remonte du fond — elles se
     recentrent, prêtes pour le soutien quel que soit le côté de notre attaque. */
  sc.move(R.BC,T4+0.3,T4+1.4,RECENTRE);sc.move(R.BA,T4+0.3,T4+1.4,RECENTRE_6);
  sc.phase("avant",0);sc.phase("service",EPS);sc.phase("choixAdv",T2);sc.phase("adverse",T2+EPS);sc.phase("defense",T3);
  sc.phase("relance",T4);sc.phase("choix",T5);
  sc.repere(0);sc.repere(T2);sc.repere(T3,true);sc.repere(T4,true);sc.repere(T5,true);
  sc.T1=T2;sc.Tq=T2;sc.Tadv=T3;sc.Tc=T5;sc.tBases=T2+0.3;
  /* La zone que le contre ferme : du point de frappe, entre les deux bords du contre. */
  var xs=Object.keys(A.bloc).map(function(k){return A.bloc[k].x});
  sc.ombre={h:P(h.x,OMBRE_RECUL),g:Math.min.apply(null,xs)-MAINS,d:Math.max.apply(null,xs)+MAINS,y:0.65};
  sc.zone={ligne:R[A.ligne],grande:R[A.grande],petite:R[A.petite],fond:R.BA};
}

/* Passe, attaque et soutien. Les quatre partenaires libres prennent la
   place de soutien la plus proche d'elles : personne ne traverse le terrain. */
function attaque(sc){
  var a=sc.a,Tc=sc.Tc,R=sc.R,A=R[ROLE_ATT[a]],H=FRAPPE[a],T3=Tc+1.6,T4=T3+1;
  sc.att=A;sc.T3=T3;sc.T4=T4;sc.soutien={};
  sc.balle(Tc,T3,CIBLE,H,2.3,3,{4:4.6,3:3.6,2:4.2}[a],"passe",sc.passeNow);
  sc.direct(A,T3-0.9,T3,H);
  var forme=a===3?"centre":"aile",sens=a===2?-1:1;
  var joueuses=IDS.filter(function(id){return id!==A}),ou=joueuses.map(function(id){return sc.pos(id,Tc)});
  function place(n,q){var c=COUPE[forme][n],th=c[0]*Math.PI/180,ux=Math.cos(th)*sens,uy=Math.sin(th);
    var r=clamp((q.x-H.x)*ux+(q.y-H.y)*uy,c[2],c[3]);return P(clamp(H.x+ux*r,0.6,8.4),clamp(H.y+uy*r,1.3,8.4))}
  /* Chacune garde son côté : on range les joueuses dans l'ordre où elles sont autour de l'attaquante,
     du filet vers le fond, et on leur donne les cinq places dans ce même ordre. Personne ne se croise. */
  var L=joueuses.map(function(id,i){var q=ou[i],dx=(q.x-H.x)*(forme==="aile"?sens:1),dy=Math.max(q.y-H.y,0);
    return {id:id,q:q,a:Math.atan2(dy,dx),d:Math.hypot(dx,dy)}}).sort(function(x,y){return x.a-y.a||x.d-y.d});
  /* Deux voisines presque dans la même direction : la plus proche de l'attaquante prend la place proche. */
  for(var n2=0;n2<4;n2++){var u=L[n2],v=L[n2+1],pu=COUPE[forme][n2][1]==="p";
    if(Math.abs(u.a-v.a)<0.175&&(pu?v.d<u.d-0.5:u.d<v.d-0.5)){L[n2]=v;L[n2+1]=u}}
  L.forEach(function(o,n){sc.soutien[o.id]={p:place(n,o.q),k:COUPE[forme][n][1],angle:COUPE[forme][n][0]};
    if(n===2)sc.releveuse=o.id});                            // la place du milieu de la coupe relève le ballon contré

function action(sc,id,k){
  var o=sc.o,rk=sc.role[id],av=rk.charAt(0)==="F",exc=o.exc,bk=sc.backup,pn=sc.passeNow,n=ATT_ROLE[rk];
  var pret=rk==="FL"&&sc.keep?"m_garde4":rk==="FR"&&sc.keep?"m_garde2":"m_pret"+n;
  var sup=sc.soutien[id]?(sc.soutien[id].k==="p"?"m_soutien_p":"m_soutien_l"):"m_reste_prete";
  var bouge=function(t0,t1){return dist(sc.pos(id,t0),sc.pos(id,t1))>0.3};
  var receptionne=famille(id)==="OH"||rk==="BC";
  switch(k){
  case "avant":
    if(o.sit==="sert")return id===sc.serveuse?"m_sers":"m_attends_service";
    if(rk==="BS")return exc?"m_avant_recois":"m_avant_cible";
    if(exc&&id===bk)return "m_avant_depanne";
    return receptionne?"m_pret_recevoir":pret;
  case "service":
    if(o.sit==="sert")return bouge(0,sc.T1)?{FL:"m_filet4",FC:"m_filet3",FR:"m_filet2",BS:"m_base1",BC:"m_base5",BA:"m_base6"}[rk]:"m_deja";
    if(rk==="BS")return exc?"m_recois":"m_cible";
    if(exc&&id===bk)return "m_depanne";
    if(id===sc.rec)return "m_recois";
    if(receptionne)return "m_pas_toi";
    return bouge(0,sc.T1)?"m_elan"+n:pret;
  case "reception":
    if(rk==="BS")return exc?"m_laisse":"m_attends_cible";
    if(exc&&id===bk)return "m_depanne";
    if(id===sc.rec)return av?"m_recu_elan":"m_recu";
    return av?(bouge(sc.T1,sc.Tc)?"m_elan"+n:pret):"m_reste_prete";
  case "choixAdv":return "m_lis";
  case "adverse":return enDefense(sc,id);
  case "defense":return id===sc.digger?"m_defends":enDefense(sc,id);
  case "relance":
    if(rk==="BS")return exc?"m_laisse":"m_cible";
    if(exc&&id===bk)return "m_depanne";
    return av?"m_recule_elan":"m_recentre";
  case "choix":return id===pn?"m_passe":av?"m_pret_attaque":"m_reste_prete";
  case "passe":return id===sc.att?"m_attaque":sup;
  case "attaque":case "fin":return id===sc.att?"m_retombe":sup;
  default:return id===sc.releveuse?"m_releve":id===sc.att?"m_retombe":"m_pret_retour";
  }
}

}

/* ── Quiz : vingt questions, on répond en touchant le terrain ──
   Chaque question pose sa rotation, sa situation et son instant ; on répond en touchant un pion,
   un endroit ou une des cibles 4 / 3 / 2. La bonne réponse se calcule depuis la scène : aucune
   n'est écrite en dur.                                                                        */
function ohAvant(sc){return famille(sc.R.FL)==="OH"?sc.R.FL:sc.R.FR}
function duSoutien(k){return function(sc){return Object.keys(sc.soutien).filter(function(id){return sc.soutien[id].k===k})}}
var QUIZ=[
  {q:"passeuse",sit:"recoit",r:1,masque:true,type:"pion",bon:function(sc){return [sc.passeuse]}},
  {q:"passeuse",sit:"recoit",r:4,masque:true,type:"pion",bon:function(sc){return [sc.passeuse]}},
  {q:"attaquePaire",sit:"recoit",r:5,masque:true,type:"pion",bon:function(sc){return [sc.backup]}},
  {q:"cible",sit:"recoit",r:1,type:"spot",spots:function(){return [[CIBLE,1],[P(4.5,4.6),0],[P(7.4,7.9),0]]},suite:"passe"},
  {q:"ohAvant",sit:"recoit",r:3,type:"pion",bon:function(sc){return [ohAvant(sc)]}},
  {q:"mbArriere",sit:"recoit",r:6,type:"pion",bon:function(sc){return [sc.R.BC]}},
  {q:"receptionneuse",sit:"recoit",r:2,type:"pion",bon:function(sc){return [ohAvant(sc),sc.R.BA,sc.R.BC]}},
  {q:"attaque4",sit:"recoit",r:1,quand:"passe",att:4,type:"pion",bon:function(sc){return [sc.R.FL]},suite:"fin"},
  {q:"attaque2",sit:"recoit",r:1,quand:"passe",att:2,type:"pion",bon:function(sc){return [sc.R.FR]},suite:"fin"},
  {q:"ouOpp",sit:"recoit",r:4,type:"but",bon:function(sc){return ATT_ROLE[sc.role[sc.backup]]}},
  {q:"ouOpp",sit:"recoit",r:2,type:"but",bon:function(sc){return ATT_ROLE[sc.role[sc.backup]]}},
  {q:"soutienProche",sit:"recoit",r:1,quand:"fin",att:4,type:"pion",bon:duSoutien("p")},
  {q:"soutienLoin",sit:"recoit",r:2,quand:"fin",att:2,type:"pion",bon:duSoutien("l")},
  {q:"ouSoutien",sit:"recoit",r:3,quand:"passe",att:4,type:"spot",spots:function(sc){return [[P(8,7.6),0],[sc.soutien[sc.releveuse].p,1],[P(4.5,8.2),0]]},suite:"fin"},
  {q:"quiSert",sit:"sert",r:3,type:"pion",bon:function(sc){return [sc.serveuse]}},
  {q:"ligne",sit:"sert",r:1,adv:"D",quand:"bloc",type:"pion",bon:function(sc){return [sc.zone.ligne]}},
  {q:"grande",sit:"sert",r:2,adv:"D",quand:"bloc",type:"pion",bon:function(sc){return [sc.zone.grande]}},
  {q:"ligne",sit:"sert",r:3,adv:"G",quand:"bloc",type:"pion",bon:function(sc){return [sc.zone.ligne]}},
  {q:"petite",sit:"sert",r:4,adv:"D",quand:"bloc",type:"pion",bon:function(sc){return [sc.zone.petite]}},
  {q:"basePasseuse",sit:"sert",r:1,type:"spot",spots:function(){return [[ZONES[5],0],[ZONES[6],0],[ZONES[1],1]]},suite:"bases"},
  {q:"bloc",sit:"sert",r:5,quand:"bloc",type:"pion",bon:function(sc){return [sc.R.FC,sc.R.FR]}},
  {q:"depanne",sit:"recoit",r:3,exc:true,quand:"reception",type:"pion",bon:function(sc){return [sc.backup]},suite:"passe"}];
function question(){var Q=etat.quiz;return Q&&Q.etat==="question"?QUIZ[Q.i]:null}
function lancerQuiz(){toutArreter();etat.quiz={i:0,etat:"question",score:0,rate:false,msg:""};quizPoser(0)}
function quizPoser(i){
  var Q=etat.quiz,def=QUIZ[i];Q.i=i;Q.etat="question";Q.rate=false;Q.msg="";
  changerScene(function(){etat.sit=def.sit;etat.r=def.r;etat.exc=!!def.exc;etat.adv=def.adv||"D";if(def.att)etat.att=def.att},{quiz:true,anim:false});
  var sc=etat.sc;etat.t={passe:sc.Tc,fin:sc.fin,bases:sc.T1,bloc:sc.Tadv,reception:sc.T1}[def.quand]||0;etat.choisi=def.quand==="fin";
  majSpots();majUI();
}
function majSpots(){
  var g=$("g-spots"),def=question();g.textContent="";
  if(!def||def.type!=="spot")return;
  def.spots(etat.sc).forEach(function(sp,i){
    var gg=el("g",{"class":"spot",tabindex:"0",role:"button","aria-label":t("spotAria",{n:i+1}),"data-spot":i,transform:"translate("+f(sp[0].x)+" "+f(sp[0].y)+")"},g);
    el("circle",{r:.72},gg);var tx=el("text",{y:.03},gg);tx.textContent="?";activable(gg,function(){quizJuge(!!sp[1],null)})});
}
function quizReponse(id){var def=question();if(def&&def.type==="pion")quizJuge(def.bon(etat.sc).indexOf(id)>=0,id)}
function quizJuge(ok,id,n){
  var Q=etat.quiz,def=QUIZ[Q.i],sc=etat.sc;
  if(!ok){Q.rate=true;Q.msg=t("qz_"+def.q+"_non");if(id){var g=pions[id];g.classList.remove("faux");void g.getBBox();g.classList.add("faux")}phasePrec=null;majUI();return}
  if(!Q.rate)Q.score++;
  Q.etat="ok";Q.msg=t("qz_"+def.q+"_ok",{qui:id?nomJoueuse(etat.r,id):"",n:n||""});
  if(id)pions[id].classList.add("bon");
  majSpots();majUI();
  /* La bonne réponse se voit aussitôt sur le terrain. */
  if(def.suite==="passe")lancer(sc.Tc);
  else if(def.suite==="fin"){etat.choisi=true;lancer(sc.fin)}
  else if(def.suite==="bases")lancer(sc.T1);
}
function quizSuite(){
  var Q=etat.quiz;if(!Q)return;
  if(Q.etat==="fin"){changerScene(function(){},{anim:false});return}
  if(Q.i>=QUIZ.length-1){arreter();Q.etat="fin";IDS.forEach(function(id){pions[id].classList.remove("bon")});majSpots();majUI();return}
  quizPoser(Q.i+1);
}

/* ══ 10. Démarrage ═══════════════════════════════════════════════════════ */
function init(){
  var pr=lirePrefs();valide(pr);if(typeof pr.lent==="boolean")etat.lent=pr.lent;
  var sys=false;try{sys=matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
  etat.reduit=typeof pr.reduit==="boolean"?pr.reduit:sys;
  valide(lireLien());
  reconstruire();creerPions();
  document.querySelectorAll("[data-sit]").forEach(function(b){b.addEventListener("click",function(){if(etat.sit!==b.dataset.sit||etat.quiz)changerScene(function(){etat.sit=b.dataset.sit})})});
  $("b-voir").addEventListener("click",function(){if(etat.quiz){if(etat.quiz.etat==="fin")lancerQuiz();else changerScene(function(){},{anim:false})}else voir()});
  $("b-suite").addEventListener("click",function(){if(etat.quiz)quizSuite();else rotationSuivante()});
  var tp=$("temps");tp.addEventListener("input",function(){glisser(+tp.value)});tp.addEventListener("change",aimanter);
  $("b-contre").addEventListener("click",contre);
  $("b-exc-fin").addEventListener("click",function(){changerScene(function(){etat.exc=false},{anim:false})});
  function langue(l){etat.lang=l;ecrirePrefs();ecrireLien();majTextes()}
  $("b-langue").addEventListener("click",function(){langue(etat.lang==="fr"?"en":"fr")});
  document.querySelectorAll("[data-lang]").forEach(function(b){b.addEventListener("click",function(){langue(b.dataset.lang)})});
  $("b-decouvrir").addEventListener("click",function(){toutArreter();majUI();$("d-decouvrir").showModal()});
  $("b-reglages").addEventListener("click",function(){$("lien-retour").textContent="";$("d-reglages").showModal()});
  document.querySelectorAll("dialog").forEach(function(d){
    d.addEventListener("click",function(e){if(e.target===d)d.close()});
    d.querySelector("[data-fermer]").addEventListener("click",function(){d.close()})});
  $("o-lent").addEventListener("change",function(e){etat.lent=e.target.checked;ecrirePrefs()});
  $("o-trajets").addEventListener("change",function(e){etat.trajets=e.target.checked;cleChemins="";rendre()});
  $("o-reduire").addEventListener("change",function(e){toutArreter();etat.reduit=e.target.checked;ecrirePrefs();cleChemins="";majUI()});
  $("b-lien").addEventListener("click",function(){ecrireLien();var ret=$("lien-retour");
    function ok(){ret.textContent=t("lienCopie")}function non(){ret.textContent=t("lienEchec")}
    try{navigator.clipboard.writeText(location.href).then(ok,non)}catch(e){non()}});
  document.addEventListener("visibilitychange",function(){if(document.hidden){toutArreter();majUI()}});
  /* Au clavier : Espace lance ou arrête, quand aucune commande n'a le focus. */
  document.addEventListener("keydown",function(e){if(e.key===" "&&(e.target===document.body||e.target===document.documentElement)&&!document.querySelector("dialog[open]")){e.preventDefault();voir()}});
  window.addEventListener("hashchange",function(){var a=JSON.stringify([etat.lang,etat.r,etat.sit,etat.poste]),l=etat.lang;valide(lireLien());
    if(JSON.stringify([etat.lang,etat.r,etat.sit,etat.poste])!==a){changerScene(function(){},{anim:false});if(l!==etat.lang)majTextes()}});
  majTextes();ecrireLien();
}

/* Interface de lecture pour la suite de tests : le modèle, sans rien y écrire. */
window.SixDeux={version:VERSION,IDS:IDS,rotation:rotation,posRot:posRot,estAvant:estAvant,roleAffiche:roleAffiche,
  passeuseActive:passeuseActive,partenaireAvant:partenaireAvant,garderAiles:garderAiles,rolesScene:rolesScene,
  baseDefense:baseDefense,attaquantes:attaquantes,construire:construire,indispo:indispo,action:action,
  cles:function(l){return Object.keys(I18N[l])},
  constantes:{CIBLE:CIBLE,ELAN:ELAN,FRAPPE:FRAPPE,COUPE:COUPE,BASE:BASE,ADVERSE:ADVERSE,PISCINE:PISCINE,ZONES:ZONES,RECEPTRICE:RECEPTRICE,ROLE_ATT:ROLE_ATT},
  etat:function(){var sc=etat.sc;return {lang:etat.lang,poste:etat.poste,sit:etat.sit,r:etat.r,exc:etat.exc,att:sc.a,adv:etat.adv,choisiAdv:etat.choisiAdv,Tq:sc.Tq==null?null:sc.Tq,fin:etat.fin,
    t:etat.t,vt:vueT(),joue:etat.joue,choisi:etat.choisi,lent:etat.lent,reduit:etat.reduit,phase:sc.phaseA(vueT()),Tc:sc.Tc,T3:sc.T3,duree:sc.fin,
    trans:!!etat.trans,tour:!!etat.tour,quiz:etat.quiz?{i:etat.quiz.i,etat:etat.quiz.etat,score:etat.quiz.score,total:QUIZ.length}:null}},
  /* Pour la suite de tests : ce qu'attend la question en cours (pions, numéro d'endroit ou cible). */
  quizAttendu:function(){var def=question();if(!def)return null;var sc=etat.sc;
    return {q:def.q,type:def.type,masque:!!def.masque,bons:def.type==="spot"?def.spots(sc).map(function(x){return x[1]}).indexOf(1):def.bon(sc)}},
  position:function(id){return {x:aff[id].x,y:aff[id].y}}};
init();
})();
