<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Comprendre le système 6-2 sans libéro : rotations, réception, passe, attaque et soutien, animés sur un terrain.">
<link rel="icon" type="image/png" href="icon.png">
<title>Comprendre le 6-2 — Les Wonders</title>
<style>
/* ══ Comprendre le 6-2 ══════════════════════════════════════════════════
   Page pédagogique à part de WonderStats, pour les athlètes de 12-13 ans.
   Aucune donnée commune : elle n'en partage que les jetons de design et le
   service worker. Le terrain est un SVG en coordonnées de terrain (mètres),
   une horloge unique anime les six joueuses et le ballon.            */
:root{
  --bg:#0F172A; --surface:#1E293B; --surface-2:#162032; --sunken:#0B1220;
  --line:#334155; --line-strong:#475569; --focus:#93C5FD;
  --txt:#E2E8F0; --txt-strong:#F8FAFC; --txt-soft:#CBD5E1; --txt-dim:#94A3B8;
  --accent:#3B82F6; --accent-ink:#93C5FD; --accent-solid:#1D4ED8;
  --ok:#10B981; --ok-ink:#6EE7B7; --warn-ink:#FBBF24; --danger-ink:#FCA5A5;
  --tint-accent:rgba(59,130,246,.16); --tint-ok:rgba(16,185,129,.16); --tint-warn:rgba(245,158,11,.16);
  --r-sm:8px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --ff:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  /* Terrain */
  --free:#13233A; --court:#1F3B60; --court-opp:#1A2D48; --court-line:#E2E8F0;
  /* Identités : une couleur par athlète, qui ne change jamais */
  --c-OH1:#60A5FA; --c-OH2:#C084FC; --c-MB1:#34D399; --c-MB2:#F472B6; --c-S:#FB923C; --c-Opp:#F87171;
  --ball:#FDE047; --near:#34D399; --far:#60A5FA;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 var(--ff);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ── En-tête ─────────────────────────────────────── */
header.top{background:var(--surface-2);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:8px 12px;padding-block:8px;flex-wrap:wrap}
header.top h1{margin:0;font-size:20px;line-height:1.2;color:var(--txt-strong);flex:1 1 auto;min-width:0}
header.top h1 small{display:block;font-size:13px;font-weight:500;color:var(--txt-dim)}
.lang{display:flex;gap:4px;background:var(--sunken);padding:3px;border-radius:var(--r-md)}
.lang button{border:0;background:transparent;color:var(--txt-dim);font-weight:650;min-height:44px;padding:0 12px;border-radius:var(--r-sm);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--txt-strong)}
.aide-btn{border:1px solid var(--line-strong);background:transparent;border-radius:var(--r-pill);min-height:44px;padding:0 14px;cursor:pointer;color:var(--txt-soft)}
.aide{margin:8px 0 0;background:var(--tint-accent);border:1px solid var(--accent);border-radius:var(--r-md);padding:10px 14px}
.aide ol{margin:0;padding-left:20px}

/* ── Mise en page ────────────────────────────────── */
main.layout{display:grid;gap:12px;padding-block:12px 24px;grid-template-columns:minmax(0,1fr);
  grid-template-areas:"poste" "situation" "terrain" "texte" "commandes" "panneaux"}
.a-poste{grid-area:poste}.a-situation{grid-area:situation}.a-terrain{grid-area:terrain}
.a-texte{grid-area:texte}.a-commandes{grid-area:commandes}.a-panneaux{grid-area:panneaux}
@media (min-width:900px){
  main.layout{grid-template-columns:minmax(0,1fr) minmax(300px,380px);align-items:start;
    grid-template-areas:"terrain poste" "terrain situation" "terrain texte" "commandes panneaux";
    grid-template-rows:auto auto 1fr auto}
  .a-terrain svg{max-height:calc(100vh - 250px);min-height:420px}
  .lecture{grid-template-columns:minmax(170px,1fr) 3fr;align-items:stretch}
  .lecture .rangee .btn{min-height:52px}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px}
.card h2{margin:0 0 8px;font-size:15px;color:var(--txt-dim);font-weight:650;letter-spacing:.01em}

/* ── Sélecteurs ──────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;min-width:48px;padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--line-strong);
  background:var(--surface-2);font-weight:700;cursor:pointer;color:var(--txt)}
.chip[aria-pressed="true"]{background:var(--accent-solid);border-color:var(--accent-ink);color:#fff}
.chip .pastille{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px;border:1px solid #0B1220}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:8px}
.rots .chip{min-width:0;padding:6px 0}
@media (max-width:359px){.rots{grid-template-columns:repeat(3,minmax(0,1fr))}}
.badge{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:var(--r-pill);background:var(--tint-warn);
  border:1px solid rgba(251,191,36,.45);color:var(--txt-strong);font-weight:650;font-size:15px}
.suivi{margin-top:10px}
.suivi .badge{margin-top:0;background:var(--tint-accent);border-color:rgba(147,197,253,.5)}
.note{margin:6px 0 0;color:var(--txt-soft)}
.note.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:rgba(251,191,36,.35)}100%{background:transparent}}

/* ── Terrain ─────────────────────────────────────── */
.a-terrain{position:relative;padding:2px}
.a-terrain svg{display:block;width:100%;height:auto;margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.observer{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(11,18,32,.88);
  border:1px solid var(--warn-ink);color:var(--txt-strong);border-radius:var(--r-pill);padding:4px 12px;font-weight:700;font-size:15px;pointer-events:none;white-space:nowrap}
.pion{cursor:pointer}
.pion .corps{stroke:#0B1220;stroke-width:.05}
.pion text{font:800 .4px var(--ff);fill:#0B1220;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pion.toi .corps{stroke:#F8FAFC;stroke-width:.13}
.pion .anneau{fill:none;stroke:#F8FAFC;stroke-width:.05;stroke-dasharray:.14 .1;display:none}
.pion.toi .anneau{display:block}
.pion .sym{fill:#F8FAFC;stroke:#0B1220;stroke-width:.04;display:none}
.pion.passeuse .sym{display:block}
.pion.flash .lbl{animation:lbl .7s ease-out}
@keyframes lbl{0%{opacity:.1}100%{opacity:1}}
.attenue .pion:not(.toi){opacity:.82}
.tag{font:700 .3px var(--ff);text-anchor:middle;fill:var(--txt-soft);paint-order:stroke;stroke:#0B1220;stroke-width:.09;stroke-linejoin:round;pointer-events:none}
.tag.toi{fill:#F8FAFC;font-size:.32px}
.adv circle{fill:#64748B;stroke:#CBD5E1;stroke-width:.04;stroke-dasharray:.1 .07}
.zone-num{font:800 1.25px var(--ff);fill:#E2E8F0;opacity:.11;text-anchor:middle;dominant-baseline:central}
.court-lbl{font:600 .27px var(--ff);fill:var(--txt-dim)}
.opp-lbl{font:700 .5px var(--ff);fill:var(--txt-dim);text-anchor:middle;opacity:.8}
.repere text{font:700 .3px var(--ff);fill:var(--txt-soft);text-anchor:middle;paint-order:stroke;stroke:#0B1220;stroke-width:.08}
.chemin{fill:none;stroke-width:.075;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.chemin.fort{stroke-width:.13;opacity:1}
.chemin.faible{opacity:.32}
.trace{fill:none;stroke:#F8FAFC;stroke-width:.06;stroke-dasharray:.06 .1;opacity:.55;stroke-linecap:round}
.fantome{fill:none;stroke-width:.05;stroke-dasharray:.1 .08;opacity:.7}
.trace-ballon{fill:none;stroke:var(--ball);stroke-width:.06;stroke-dasharray:.18 .12;opacity:.9}
.soutien-z circle{stroke-width:.04;stroke-dasharray:.12 .08}
.soutien-z.p circle{fill:rgba(52,211,153,.13);stroke:var(--near)}
.soutien-z.l circle{fill:rgba(96,165,250,.12);stroke:var(--far)}
.soutien-z text{font:700 .27px var(--ff);text-anchor:middle;paint-order:stroke;stroke:#0B1220;stroke-width:.08}
.soutien-z.p text{fill:var(--near)}.soutien-z.l text{fill:var(--far)}

/* ── Texte de la scène ───────────────────────────── */
.a-texte h2{margin-bottom:6px}
#consigne p{margin:0 0 6px}
#consigne p:last-child{margin-bottom:0}
#consigne .principal{font-size:18px;font-weight:650;color:var(--txt-strong)}
#consigne .ctx{color:var(--txt-soft)}
.etape{font-size:14px;color:var(--txt-dim);margin-bottom:6px}

/* ── Commandes ───────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 12px;border-radius:var(--r-md);
  border:1px solid var(--line-strong);background:var(--surface-2);color:var(--txt);font-weight:650;cursor:pointer;text-align:center}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.primaire{background:var(--accent-solid);border-color:var(--accent-ink);color:#fff;font-size:17px;min-height:52px}
.btn[aria-pressed="true"]{background:var(--tint-accent);border-color:var(--accent-ink)}
.lecture{display:grid;gap:8px}
.lecture .rangee{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lecture .rangee .btn{padding:6px 4px;font-size:15px;line-height:1.15}
@media (max-width:420px){.lecture .rangee{grid-template-columns:repeat(2,minmax(0,1fr))}}
.attaques{display:grid;gap:8px;margin-top:10px}
@media (min-width:560px){.attaques{grid-template-columns:repeat(3,minmax(0,1fr))}}
.attaques .btn{min-height:56px;font-size:17px;flex-direction:column;gap:0;border-width:2px;border-color:var(--warn-ink);background:var(--tint-warn);color:var(--txt-strong)}
.attaques .btn small{font-size:14px;font-weight:600;color:var(--txt-soft)}
.indice{margin:8px 0 0;color:var(--warn-ink);font-weight:700}
.suites{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.suites .btn{flex:1 1 180px}

/* ── Panneaux repliés ────────────────────────────── */
.a-panneaux{display:grid;gap:8px}
details.pan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
details.pan>summary{min-height:48px;display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--txt-strong);list-style:none}
details.pan>summary::-webkit-details-marker{display:none}
details.pan>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--txt-dim);border-bottom:2px solid var(--txt-dim);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:4px}
details.pan[open]>summary::before{transform:rotate(45deg)}
.pan .corps{padding:0 14px 14px}
.pan .corps p{margin:0 0 8px}
.pan .corps ul{margin:0 0 8px;padding-left:20px}
.pan .corps li{margin-bottom:4px}
.option{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.option input{width:22px;height:22px;flex:none}
.question{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.question:first-child{border-top:0;margin-top:0;padding-top:0}
.question p.q{font-weight:700;color:var(--txt-strong)}
.question .choix{display:flex;flex-wrap:wrap;gap:6px}
.question .choix .btn{flex:1 1 auto}
.retour{margin:8px 0 0}
.retour.ok{color:var(--ok-ink)}.retour.non{color:var(--warn-ink)}
footer{color:var(--txt-dim);font-size:14px;padding-bottom:24px}
footer a{color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1><span data-t="titre">Comprendre le 6-2</span><small data-t="sousTitre">Système 6-2 sans libéro</small></h1>
    <div class="lang" role="group" data-t-aria="langue" aria-label="Langue">
      <button type="button" data-lang="fr" aria-pressed="true">Français</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
    <button type="button" class="aide-btn" id="aide-btn" aria-expanded="false" aria-controls="aide" data-t="aideBtn">Comment ça marche ?</button>
  </div>
  <div class="wrap"><div class="aide" id="aide" hidden><ol><li data-t="aide1"></li><li data-t="aide2"></li><li data-t="aide3"></li></ol></div></div>
</header>

<main class="wrap layout">
  <section class="card a-poste" aria-labelledby="t-poste">
    <h2 id="t-poste" data-t="jeSuis">Je suis…</h2>
    <div class="chips" id="postes" role="group" aria-labelledby="t-poste"></div>
    <div class="suivi" id="suivi" hidden><span class="badge" id="suivi-badge"></span><p class="note" id="note"></p></div>
  </section>

  <section class="card a-situation" aria-labelledby="t-situation">
    <h2 id="t-situation" data-t="situation">Situation</h2>
    <div class="seg" role="group" aria-labelledby="t-situation">
      <button type="button" class="chip" data-sit="recoit" data-t="recoit">On reçoit</button>
      <button type="button" class="chip" data-sit="sert" data-t="sert">On sert</button>
    </div>
    <div class="rots" id="rots" role="group" data-t-aria="rotation" aria-label="Rotation"></div>
    <span class="badge" id="badge-passeuse"></span>
  </section>

  <section class="card a-terrain" aria-labelledby="terrain-titre">
    <h2 class="vh" id="terrain-titre" data-t="terrainTitre">Terrain</h2>
    <svg id="terrain" viewBox="-0.75 -4.95 10.5 15.55" role="img" aria-labelledby="terrain-titre terrain-desc">
      <desc id="terrain-desc"></desc>
      <defs id="defs"></defs>
      <g id="g-fond"></g>
      <g id="g-bases" class="repere"></g>
      <g id="g-soutien"></g>
      <g id="g-chemins"></g>
      <g id="g-trace-ballon"></g>
      <g id="g-adv" class="adv"></g>
      <g id="g-joueuses"></g>
      <g id="g-ballon"></g>
      <g id="g-etiquettes"></g>
    </svg>
    <div class="observer" id="observer" hidden data-t="pauseObserver">Pause pour observer</div>
  </section>

  <section class="card a-texte" aria-labelledby="t-consigne">
    <h2 id="t-consigne"></h2>
    <div class="etape" id="etape"></div>
    <div id="consigne"></div>
  </section>

  <section class="card a-commandes" aria-labelledby="t-commandes">
    <h2 class="vh" id="t-commandes" data-t="commandes">Commandes</h2>
    <div class="lecture">
      <button type="button" class="btn primaire" id="b-voir"></button>
      <div class="rangee">
        <button type="button" class="btn" id="b-prec" data-t="precedente"></button>
        <button type="button" class="btn" id="b-suiv" data-t="suivante"></button>
        <button type="button" class="btn" id="b-recommencer" data-t="recommencer"></button>
        <button type="button" class="btn" id="b-ralenti" aria-pressed="false" data-t="ralenti"></button>
      </div>
    </div>
    <div class="attaques" id="attaques" hidden role="group" data-t-aria="choisis"></div>
    <p class="indice" id="indice" role="status" hidden></p>
    <div class="suites" id="suites"></div>
  </section>

  <section class="a-panneaux" aria-label="Panneaux">
    <details class="pan" id="p-comprendre"><summary data-t="comprendre">Comprendre</summary><div class="corps" id="c-comprendre"></div></details>
    <details class="pan" id="p-etsi"><summary data-t="etSi">Et si…</summary><div class="corps" id="c-etsi"></div></details>
    <details class="pan" id="p-atoi"><summary data-t="aToi">À toi</summary><div class="corps" id="c-atoi"></div></details>
    <details class="pan" id="p-affichage"><summary data-t="affichage">Affichage</summary>
      <div class="corps">
        <label class="option"><input type="checkbox" id="o-trajets" checked> <span data-t="trajets">Voir les trajets</span></label>
        <label class="option"><input type="checkbox" id="o-reduire"> <span data-t="reduire">Réduire les mouvements</span></label>
        <p><button type="button" class="btn" id="b-lien" data-t="lienCopier"></button></p>
        <p class="retour ok" id="lien-retour" role="status"></p>
      </div>
    </details>
  </section>
</main>
<footer class="wrap"><p data-t="pied"></p></footer>
<div class="vh" id="annonce" aria-live="polite"></div>
<noscript><p class="wrap">Cette page a besoin de JavaScript. / This page needs JavaScript.</p></noscript>

<script>
(function(){
"use strict";
var VERSION="1.0.0";

/* ══ 1. Modèle sportif ═══════════════════════════════════════════════════
   Les identités de suivi (OH1, OH2, MB1, MB2, Opp, S) ne changent jamais.
   Le rôle affiché S/Opp se calcule depuis le statut avant/arrière ; les
   rôles de scène (FL, FC, FR, BS, BC, BA) depuis la rotation ET la
   situation. Rien ne se déduit de l'endroit où court un pion.            */
var IDS=["OH1","OH2","MB1","MB2","Opp","S"];
var BASE_R1=["S","OH1","MB1","Opp","OH2","MB2"];            // P1 → P6 en R1
function rotation(r){var a=BASE_R1.slice();for(var i=1;i<r;i++)a.push(a.shift());return a}
function posRot(r,id){return rotation(r).indexOf(id)+1}
function avantP(p){return p>=2&&p<=4}
function estAvant(r,id){return avantP(posRot(r,id))}
function paire(id){return id==="S"||id==="Opp"}
function famille(id){return paire(id)?"SO":id.slice(0,2)}
function roleAffiche(r,id){return paire(id)?(estAvant(r,id)?"Opp":"S"):id}
function passeuseActive(r){return estAvant(r,"S")?"Opp":"S"}
function partenaireAvant(r){return passeuseActive(r)==="S"?"Opp":"S"}      // backupSetterId
function garderAiles(r,sit){return sit==="recoit"&&posRot(r,passeuseActive(r))===1}
function rolesScene(r,sit){
  var rot=rotation(r),av=[rot[1],rot[2],rot[3]],ar=[rot[0],rot[4],rot[5]];
  function un(l,f){for(var i=0;i<l.length;i++)if(famille(l[i])===f)return l[i]}
  var k=garderAiles(r,sit),oh=un(av,"OH"),so=un(av,"SO");
  return {FL:k?so:oh,FC:un(av,"MB"),FR:k?oh:so,BS:un(ar,"SO"),BC:un(ar,"MB"),BA:un(ar,"OH")};
}
function baseDefense(r,id){if(estAvant(r,id))return null;return paire(id)?1:famille(id)==="MB"?5:6}
function attaquantes(r,sit){var R=rolesScene(r,sit);return {4:R.FL,3:R.FC,2:R.FR}}

/* ══ 2. Annexe de placement (mètres ; x 0 → 9 de gauche à droite,
   y 0 au filet → 9 à la ligne de fond ; l'adversaire en y négatif) ══════ */
function P(x,y){return {x:x,y:y}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var CIBLE=P(6.1,1.1),ATTENTE=P(7,5),SERVEUSE=P(7.5,9.7);
var MODELES={                          // réception, par position de la passeuse active
  1:[[8.2,6.6],[7,4.5],[4.5,1.8],[1.2,1.2],[1.5,5.8],[4.5,6.2]],
  6:[[8.2,5.8],[7,1.8],[5.5,1],[4,4.6],[1.5,6.6],[6.2,2.5]],
  5:[[8.2,6],[6.3,1],[4.6,4.5],[0.8,1.3],[1.2,2.8],[2.5,6.5]]};
var RECEPTRICE={1:"MB2",2:"OH2",3:"OH1",4:"MB1",5:"OH1",6:"OH2"};
var PREP={FL:P(1.2,3.8),FC:P(4.3,3),FR:P(7.8,3.8),BS:CIBLE,BC:P(2,5.5),BA:P(4.5,6.2)};
var ROLE_ATT={4:"FL",3:"FC",2:"FR"};
var FRAPPE={4:P(0.8,1),3:P(4.5,0.8),2:P(8.2,1)};
var SOUTIEN={
  4:{FC:[2,1.8,"p"],BS:[3,3.1,"p"],BC:[0.9,3.5,"p"],BA:[4.5,6.3,"l"],FR:[6.7,5.5,"l"]},
  3:{FL:[2.7,1.8,"p"],BS:[5.9,2,"p"],FR:[4.3,3.2,"p"],BC:[1.7,6,"l"],BA:[5.5,6.5,"l"]},
  2:{FC:[6.9,1.8,"p"],BS:[8,3.5,"p"],FL:[5.7,3.1,"p"],BC:[1.7,5.8,"l"],BA:[5.5,6.3,"l"]}};
var RELEVE={4:"BC",3:"FR",2:"BS"};

var BLOC={FC:P(6.8,0.5),FR:P(7.6,0.5),FL:P(2,3),BS:P(7.5,4.4),BC:P(2.1,5.4),BA:P(5,6.5)};

/* ══ 3. Scènes ═══════════════════════════════════════════════════════════
   Une scène est une fonction pure du temps : chaque joueuse a des
   déplacements datés (points de passage), le ballon des segments datés.
   Retour, reprise et changement de branche ne sont que des sauts de temps
   dans une scène reconstruite à l'identique jusqu'au point de choix.     */
var EPS=1e-3,SEUIL=0.95;
function lisse(s){s=clamp(s,0,1);return s*s*(3-2*s)}
function surChemin(pts,s){
  if(pts.length<2)return pts[0];
  var L=0,i,seg=[];
  for(i=1;i<pts.length;i++){var l=dist(pts[i-1],pts[i]);seg.push(l);L+=l}
  var v=s*L;
  for(i=1;i<pts.length;i++){if(v<=seg[i-1]||i===pts.length-1){var u=seg[i-1]?clamp(v/seg[i-1],0,1):1;
    return P(pts[i-1].x+(pts[i].x-pts[i-1].x)*u,pts[i-1].y+(pts[i].y-pts[i-1].y)*u)}v-=seg[i-1]}
  return pts[pts.length-1];
}
function Scene(o){this.o=o;this.start={};this.tr={};this.ballon=[];this.ph=[];this.mk=[];this.contacts=[];this.adv=[];}
Scene.prototype.pos=function(id,t){
  var p=this.start[id],L=this.tr[id]||[];
  for(var i=0;i<L.length;i++){var k=L[i];if(t<k.t0)return p;
    if(t<=k.t1)return surChemin(k.pts,lisse((t-k.t0)/(k.t1-k.t0)));p=k.pts[k.pts.length-1]}
  return p;
};
Scene.prototype.marge=function(id,c,t0){
  var m=99,n=28,self=this;
  for(var i=0;i<=n;i++){var t=t0+(c.t1-t0)*i/n,p=t<c.t0?c.pts[0]:surChemin(c.pts,lisse((t-c.t0)/(c.t1-c.t0)));
    IDS.forEach(function(o){if(o===id)return;var dd=dist(p,self.pos(o,t));if(dd<m)m=dd})}
  return m;
};
/* Un déplacement : départ = position de la joueuse à t0, arrivée imposée.
   Les points de passage évitent les traversées de pions : on essaie le
   trajet direct, puis des contournements de plus en plus larges, puis un
   départ un peu plus tardif — l'arrivée, elle, ne bouge jamais.          */
Scene.prototype.move=function(id,t0,t1,to,opt){
  opt=opt||{};
  var from=this.pos(id,t0),L=this.tr[id]||(this.tr[id]=[]);
  if(dist(from,to)<0.02)return;
  var dx=to.x-from.x,dy=to.y-from.y,len=Math.hypot(dx,dy),px=-dy/len,py=dx/len,mx=(from.x+to.x)/2,my=(from.y+to.y)/2;
  var delais=opt.fixe?[0]:[0,0.3,0.6],offs=opt.direct?[0]:[0,0.8,-0.8,1.5,-1.5,2.3,-2.3,3.1,-3.1],cands=[];
  delais.forEach(function(dl){if(dl&&t1-t0-dl<0.7)return;offs.forEach(function(k){
    var pts=[from];if(k)pts.push(P(clamp(mx+px*k,-0.5,9.5),clamp(my+py*k,0.35,9.6)));pts.push(to);
    cands.push({t0:t0+dl,t1:t1,pts:pts,cout:Math.abs(k)+dl*3})})});
  cands.sort(function(a,b){return a.cout-b.cout});
  var best=cands[0];
  if(!opt.direct||!opt.fixe){
    /* Ce qui est inévitable (départ et arrivée imposés) ne compte pas contre un trajet. */
    var self=this,bord=function(t,p){var m=99;IDS.forEach(function(o){if(o!==id)m=Math.min(m,dist(p,self.pos(o,t)))});return m};
    var seuil=Math.min(SEUIL,bord(t0,from)-0.02,bord(t1,to)-0.02),bm=-99;
    for(var i=0;i<cands.length;i++){var m=this.marge(id,cands[i],t0);if(m>=seuil){best=cands[i];break}
      var note=Math.min(m,seuil)-0.04*cands[i].cout;if(note>bm){bm=note;best=cands[i]}}
  }
  L.push({t0:best.t0,t1:best.t1,pts:best.pts});
};
Scene.prototype.direct=function(id,t0,t1,to){var L=this.tr[id]||(this.tr[id]=[]);L.push({t0:t0,t1:t1,pts:[this.pos(id,t0),to]})};
Scene.prototype.balle=function(t0,t1,a,b,z0,z1,apex,k,par){this.ballon.push({t0:t0,t1:t1,a:a,b:b,z0:z0,z1:z1,apex:apex,k:k,par:par})};
Scene.prototype.balleA=function(t){
  var B=this.ballon;if(!B.length)return null;
  if(t<=B[0].t0)return {x:B[0].a.x,y:B[0].a.y,z:B[0].z0};
  for(var i=0;i<B.length;i++){var b=B[i];
    if(t>=b.t0&&t<=b.t1){var s=(t-b.t0)/(b.t1-b.t0),h=b.apex-(b.z0+b.z1)/2;
      return {x:b.a.x+(b.b.x-b.a.x)*s,y:b.a.y+(b.b.y-b.a.y)*s,z:Math.max(0,b.z0+(b.z1-b.z0)*s+4*h*s*(1-s)),seg:b}}}
  var d=B[B.length-1];for(i=B.length-1;i>=0;i--)if(B[i].t1<=t){d=B[i];break}
  return {x:d.b.x,y:d.b.y,z:d.z1};
};
Scene.prototype.phase=function(k,t){this.ph.push({k:k,t:t})};
Scene.prototype.repere=function(t,contact){this.mk.push(t);if(contact)this.contacts.push(t)};
Scene.prototype.phaseA=function(t){var k=this.ph[0].k;for(var i=0;i<this.ph.length;i++)if(this.ph[i].t<=t+1e-6)k=this.ph[i].k;return k};
Scene.prototype.reperes=function(){return this.mk.slice().sort(function(a,b){return a-b})};

function construire(o){
  var sc=new Scene(o),r=o.r;
  if(o.demo)return demo(sc);
  sc.R=rolesScene(r,o.sit);sc.role={};for(var k in sc.R)sc.role[sc.R[k]]=k;
  sc.keep=garderAiles(r,o.sit);sc.passeuse=passeuseActive(r);sc.backup=partenaireAvant(r);
  sc.passeNow=o.exc?sc.backup:sc.passeuse;
  sc.rotA=function(){return r};
  if(o.sit==="recoit")recoit(sc);else sert(sc);
  if(o.att&&!indispo(sc,o.att))attaque(sc);
  sc.fin=Math.max.apply(null,sc.mk);
  return sc;
}
function indispo(sc,a){return !!sc.o.exc&&sc.R[ROLE_ATT[a]]===sc.backup}

/* On reçoit : service adverse, réception, pénétration de la passeuse. */
function recoit(sc){
  var r=sc.o.r,rot=rotation(r),M=MODELES[posRot(r,sc.passeuse)],R=sc.R,exc=sc.o.exc;
  IDS.forEach(function(id){var c=M[rot.indexOf(id)];sc.start[id]=P(c[0],c[1])});
  sc.adv=["A1"];sc.start.A1=P(1.5,-9.8);
  var rec=exc?R.BS:RECEPTRICE[r];sc.rec=rec;
  var T1=1.5,T2=3.4;
  sc.balle(0,T1,sc.start.A1,sc.start[rec],2.7,0.8,4.4,"service","A1");
  sc.balle(T1,T2,sc.start[rec],CIBLE,0.8,2.4,4.6,"reception",rec);
  if(exc)sc.move(sc.backup,T1-0.4,T2-0.25,CIBLE,{fixe:true});
  else sc.move(R.BS,0.1,2.4,CIBLE);
  if(rec!==R.BS)sc.move(rec,T1+0.15,T2,PREP[sc.role[rec]]);
  /* Les avants préparent leur élan dès le service ; les arrières qui ne
     reçoivent pas se replacent pendant la réception, avec la réceptionneuse. */
  ["FL","FR","FC","BC","BA"].forEach(function(k){var id=R[k];
    if(id===rec||(exc&&id===sc.backup))return;
    if(k.charAt(0)==="B")sc.move(id,T1+0.1,T2+0.1,PREP[k]);else sc.move(id,0.2,2.7,PREP[k])});
  /* En dépannage, la passeuse qui a reçu se dégage en dernier : elle contourne les autres. */
  if(exc)sc.move(R.BS,T1+0.15,T2,ATTENTE);
  sc.phase("avant",0);sc.phase("service",EPS);sc.phase("reception",T1);sc.phase("choix",T2);
  sc.repere(0);sc.repere(T1,true);sc.repere(T2,true);
  sc.T1=T1;sc.Tc=T2;sc.tBases=-1;
}

/* On sert : service, bases de défense, une attaque adverse exemple à notre
   droite, bloc, défense, puis la passeuse rejoint 2,5.                  */
function sert(sc){
  var r=sc.o.r,rot=rotation(r),R=sc.R,exc=sc.o.exc,srv=rot[0];sc.serveuse=srv;
  rot.forEach(function(id,i){sc.start[id]=i===0?SERVEUSE:GRILLE_SERVICE[i+1]});
  sc.adv=["A1","A2","A3"];sc.start.A1=P(4.5,-6.5);sc.start.A2=P(2.9,-1.2);sc.start.A3=P(7.9,-3.6);
  var T1=1.5,T2=3.1,T3=4.4,T4=5.2,T5=7.1,dig=exc?R.BS:R.BA;sc.digger=dig;
  sc.balle(0,T1,SERVEUSE,sc.start.A1,2.8,0.8,4.5,"service",srv);
  sc.balle(T1,T2,sc.start.A1,sc.start.A2,0.8,2.4,4.5,"adv","A1");
  sc.balle(T2,T3,sc.start.A2,HADV,2.4,3,4,"adv","A2");
  sc.balle(T3,T4,HADV,BLOC[sc.role[dig]],3,0.6,3.1,"attaqueAdv","A3");
  sc.balle(T4,T5,BLOC[sc.role[dig]],CIBLE,0.6,2.4,4.6,"defense",dig);
  sc.direct("A3",T3-1,T3,HADV);
  ["FC","FL","FR","BC","BA","BS"].forEach(function(k){var id=R[k];
    if(id===srv)sc.move(id,0.25,2.6,DEF[k]);else sc.move(id,0.1,1.7,DEF[k])});
  sc.move(R.FC,T2+0.1,T3-0.1,BLOC.FC);sc.move(R.FR,T2+0.3,T3-0.1,BLOC.FR);
  sc.move(R.FL,T2+0.2,T3,BLOC.FL);
  sc.move(R.BS,T2+0.2,T3-0.1,BLOC.BS);sc.move(R.BC,T2+0.2,T3-0.1,BLOC.BC);sc.move(R.BA,T2+0.2,T3-0.1,BLOC.BA);
  if(exc){sc.move(sc.backup,T4+0.05,T5-0.3,CIBLE,{fixe:true});sc.move(R.BS,T4+0.15,T5,ATTENTE)}
  else sc.move(R.BS,T4+0.05,T5-0.45,CIBLE);
  ["FC","FL","FR","BC","BA"].forEach(function(k){var id=R[k];
    if(exc&&id===sc.backup)return;sc.move(id,T4+(id===dig?0.2:0.1),T5,PREP[k])});
  sc.phase("avant",0);sc.phase("service",EPS);sc.phase("construction",T1);sc.phase("defense",T3);
  sc.phase("relance",T4);sc.phase("choix",T5);
  sc.repere(0);sc.repere(T1,true);sc.repere(T3,true);sc.repere(T4,true);sc.repere(T5,true);
  sc.T1=T1;sc.Tc=T5;sc.tBases=T4;
}

/* Passe, attaque, soutien ; puis l'une des fins : normale, retour du bloc,
   ou transition défensive. Les rôles de scène restent ceux de la situation. */
function attaque(sc){
  var a=sc.o.att,Tc=sc.Tc,R=sc.R,A=R[ROLE_ATT[a]],H=FRAPPE[a],T3=Tc+VOL[a],T4=T3+1;
  sc.att=A;sc.T3=T3;sc.T4=T4;sc.soutien={};
  sc.balle(Tc,T3,CIBLE,H,2.4,3,APEX[a],"passe",sc.passeNow);
  sc.move(A,Math.max(Tc+0.05,T3-1),T3,H,{fixe:true});
  [sc.passeNow].concat(IDS.filter(function(id){return id!==sc.passeNow&&id!==A})).forEach(function(id){
    var s=SOUTIEN[a][sc.role[id]];sc.soutien[id]={p:P(s[0],s[1]),k:s[2]};
    sc.move(id,id===sc.passeNow?Tc+0.1:Tc+0.2,T3+0.15,P(s[0],s[1]))});
  sc.phase("passe",Tc+EPS);sc.phase("attaque",T3);
  var fin=sc.o.fin;
  if(fin==="bloc"){
    var Tb=T3-0.4,bx=clamp(H.x,0.6,8.4),blk=P(H.x,-0.12);sc.tFin=Tb;
    sc.adv=sc.adv.concat(["B1","B2"]);sc.start.B1=P(bx-0.5,-1.8);sc.start.B2=P(bx+0.5,-1.8);
    sc.direct("B1",T3-0.75,T3-0.1,P(bx-0.42,-0.5));sc.direct("B2",T3-0.75,T3-0.1,P(bx+0.42,-0.5));
    var rr=R[RELEVE[a]],Pr=sc.soutien[rr].p,Q=P((Pr.x+4.5)/2,Math.max(1.8,Pr.y-1.4));sc.releveuse=rr;
    sc.balle(T3,T3+0.2,H,blk,3,3.1,3.2,"frappe",A);
    sc.balle(T3+0.2,T3+1.2,blk,Pr,3.1,0.5,3.4,"bloc","B1");
    sc.balle(T3+1.2,T3+2,Pr,Q,0.5,3.6,3.6,"reprise",rr);
    sc.direct(A,T3+0.05,T3+0.45,P(H.x,H.y+0.45));
    sc.phase("bloc",T3+0.2);sc.phase("reprise",T3+1.2);sc.phase("finbloc",T3+2);
    sc.repere(Tb);sc.repere(T3+1.2,true);sc.repere(T3+2);
  }else{
    sc.balle(T3,T4-0.1,H,DEST[a],3,0.1,3.2,"frappe",A);
    sc.direct(A,T3+0.05,T3+0.45,P(H.x,H.y+0.45));
    sc.phase("fin",T4);sc.repere(T3,true);sc.repere(T4);
    if(fin==="defense"){
      sc.tFin=T4;
      ["FL","FC","FR","BS","BC","BA"].forEach(function(k){sc.move(R[k],T4+0.2,T4+2.2,DEF[k])});
      sc.phase("transition",T4+EPS);sc.phase("endefense",T4+2.4);sc.repere(T4+2.4);
      sc.tBasesDe=T4;
    }
  }
}

/* « Comprendre la rotation » : on gagne le service en recevant, on tourne
   d'un cran dans le sens horaire, la joueuse venue de 2 sert en 1.      */
function demo(sc){
  var r=sc.o.r,n=r%6+1,rot=rotation(r),T=2.4;sc.demo=true;sc.suivante=n;
  sc.rotA=function(t){return t>=T?n:r};
  rot.forEach(function(id,i){sc.start[id]=GRILLE[i+1]});
  rot.forEach(function(id,i){var p=i+1;sc.direct(id,0.6,T,GRILLE[p===1?6:p-1])});
  var srv=rotation(n)[0];sc.serveuse=srv;sc.direct(srv,2.6,4.2,SERVEUSE);
  sc.phase("gain",0);sc.phase("tourne",EPS);sc.phase("serveuse",2.5);sc.phase("findemo",4.3);
  sc.repere(0);sc.repere(2.5);sc.repere(4.3);
  sc.fin=4.3;sc.Tc=null;sc.tBases=-1;sc.R={};sc.role={};
  return sc;
}

function t(k,p){var s=(I18N[etat.lang]||I18N.fr)[k];if(s==null)s=I18N.fr[k];if(s==null)return k;
  if(p)s=s.replace(/\{(\w+)\}/g,function(m,n){return p[n]!=null?p[n]:m});return s}
function minus1(s){return s?s.charAt(0).toLowerCase()+s.slice(1):s}

var CLE="wonders.six-deux";
var etat={lang:"fr",poste:"equipe",sit:"recoit",r:1,exc:false,att:null,fin:null,demo:false,
  t:0,joue:false,cible:0,lent:false,reduit:false,trajets:true,sc:null,indice:false};
function lirePrefs(){try{return JSON.parse(localStorage.getItem(CLE)||"{}")||{}}catch(e){return {}}}
function ecrirePrefs(){try{localStorage.setItem(CLE,JSON.stringify({lang:etat.lang,poste:etat.poste,lent:etat.lent,reduit:etat.reduit}))}catch(e){}}
function lireLien(){
  var q={};(location.hash||"").replace(/^#/,"").split("&").forEach(function(kv){var a=kv.split("=");if(a[0])q[decodeURIComponent(a[0])]=decodeURIComponent(a[1]||"")});
  return {lang:q.lang,r:q.r,sit:q.sit,poste:q.p};
}
function ecrireLien(){
  var h="#lang="+etat.lang+"&r="+etat.r+"&sit="+etat.sit+"&p="+encodeURIComponent(etat.poste);
  try{if(location.hash!==h)history.replaceState(null,"",location.pathname+location.search+h)}catch(e){}
}
function valide(o){
  if(o.lang==="fr"||o.lang==="en")etat.lang=o.lang;
  if(o.poste==="equipe"||IDS.indexOf(o.poste)>=0)etat.poste=o.poste;
  if(/^[1-6]$/.test(String(o.r||"")))etat.r=+o.r;
  if(o.sit==="recoit"||o.sit==="sert")etat.sit=o.sit;
}

function reconstruire(){etat.sc=construire({sit:etat.sit,r:etat.r,exc:etat.exc,att:etat.att,fin:etat.fin,demo:etat.demo})}
function vueT(){
  if(!etat.reduit)return etat.t;
  var m=etat.sc.reperes(),v=0;m.forEach(function(x){if(x<=etat.t+1e-6)v=x});return v;
}
function auRepere(tt){return etat.sc.reperes().some(function(m){return Math.abs(m-tt)<1e-6})}
function enChoix(){var sc=etat.sc;return sc.Tc!=null&&!etat.att&&Math.abs(vueT()-sc.Tc)<1e-6}
function aLaFin(){return Math.abs(vueT()-etat.sc.fin)<1e-6&&!enChoix()}

/* ══ 6. Horloge unique ═══════════════════════════════════════════════════ */
var raf=null,dernier=null;
function vitesse(){return etat.lent?0.5:1}
function boucle(ts){
  raf=null;if(!etat.joue)return;
  var dt=dernier==null?0:Math.min(0.1,(ts-dernier)/1000);dernier=ts;
  etat.t=Math.min(etat.cible,etat.t+dt*vitesse());
  if(etat.t>=etat.cible-1e-9){etat.t=etat.cible;arreter();return}
  rendre();raf=requestAnimationFrame(boucle);
}
function lancer(cible){
  if(cible<=etat.t+1e-6){rendre();majUI();return}
  etat.cible=cible;etat.joue=true;dernier=null;etat.indice=false;
  if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(boucle);majUI();rendre();
}
function arreter(){etat.joue=false;if(raf){cancelAnimationFrame(raf);raf=null}if(etat.reduit)etat.t=vueT();rendre();majUI()}
function prochainArret(){
  var sc=etat.sc,c=[sc.fin];if(sc.Tc!=null&&!etat.att&&sc.Tc>etat.t+1e-6)c.push(sc.Tc);
  return Math.min.apply(null,c);
}
function repereSuivant(){var m=etat.sc.reperes();for(var i=0;i<m.length;i++)if(m[i]>etat.t+1e-6)return m[i];return null}
function reperePrecedent(){var m=etat.sc.reperes(),p=0;m.forEach(function(x){if(x<etat.t-1e-6)p=x});return p}

function voir(){
  if(etat.joue){arreter();return}
  if(enChoix()){etat.indice=true;majUI();return}
  if(aLaFin()){etat.att=null;etat.fin=null;reconstruire();etat.t=0}
  lancer(prochainArret());
}
function suivante(){
  if(etat.joue)arreter();
  if(enChoix()){etat.indice=true;majUI();return}
  var n=repereSuivant();if(n==null){majUI();return}
  if(etat.reduit){etat.t=n;rendre();majUI();return}
  lancer(n);
}
function precedente(){
  if(etat.joue)arreter();
  var p=reperePrecedent(),sc=etat.sc,re=false;
  if(etat.fin&&sc.tFin!=null&&p<sc.tFin-1e-6){etat.fin=null;re=true}
  if(etat.att&&p<=sc.Tc+1e-6){etat.att=null;etat.fin=null;re=true}
  if(re)reconstruire();
  etat.t=p;etat.indice=false;rendre();majUI();
}
function recommencer(){arreter();if(etat.demo){reconstruire()}else{etat.att=null;etat.fin=null;reconstruire()}etat.t=0;etat.indice=false;rendre();majUI()}
function choisirAttaque(a){
  if(indispo(etat.sc,a))return;
  etat.att=a;etat.fin=null;reconstruire();etat.t=etat.sc.Tc;lancer(etat.sc.fin);
}
function autreAttaque(){arreter();etat.att=null;etat.fin=null;reconstruire();etat.t=etat.sc.Tc;rendre();majUI()}
function etSiRevient(){arreter();etat.fin="bloc";reconstruire();etat.t=etat.sc.tFin;lancer(etat.sc.fin)}
function versDefense(){arreter();etat.fin="defense";reconstruire();etat.t=etat.sc.tFin;lancer(etat.sc.fin)}
function reinitialiser(){arreter();etat.att=null;etat.fin=null;etat.demo=false;reconstruire();etat.t=0;etat.indice=false;rendre();majUI();majQuestions();ecrireLien()}

var cleChemins="";
function majChemins(vt){
  var g=document.getElementById("g-chemins"),sc=etat.sc,m=sc.reperes(),a=0,b=sc.fin,i;
  if(etat.reduit){for(i=0;i<m.length;i++)if(m[i]<vt-1e-6)a=m[i];b=vt}
  else{
    var arret=!etat.joue&&auRepere(vt);
    for(i=0;i<m.length;i++)if(m[i]<=vt+1e-6)a=m[i];
    b=sc.fin;for(i=0;i<m.length;i++)if(m[i]>vt+1e-6){b=m[i];break}
    if(arret)a=vt;
  }
  var cle=[etat.trajets,etat.poste,a,b,etat.reduit,etat.sc.o.att,etat.sc.o.fin,etat.sc.o.exc,etat.sc.o.r,etat.sc.o.sit,etat.demo].join("|");
  if(cle===cleChemins)return;cleChemins=cle;g.textContent="";
  if(!etat.trajets||b-a<1e-6)return;
  var suivi=etat.poste!=="equipe";
  IDS.forEach(function(id){
    (sc.tr[id]||[]).forEach(function(k){
      if(k.t1<=a+1e-6||k.t0>=b-1e-6)return;
      var c="chemin"+(suivi?(id===etat.poste?" fort":" faible"):"");
      el("polyline",{points:pts2(k.pts),"class":c,stroke:COUL[id],"marker-end":"url(#fl-"+id+")"},g);
    });
    if(etat.reduit){var p0=sc.pos(id,a);if(dist(p0,sc.pos(id,b))>0.1)
      el("circle",{cx:f(p0.x),cy:f(Y(p0.y)),r:.44,"class":"fantome",stroke:COUL[id]},g)}
  });
}
function majTraceBallon(vt){
  var g=document.getElementById("g-trace-ballon"),sc=etat.sc;g.textContent="";
  if(!etat.trajets)return;
  var seg=null;
  if(etat.reduit){sc.ballon.forEach(function(b){if(b.t1<=vt+1e-6&&b.t1>vt-1e-6)seg=b});
    if(!seg)sc.ballon.forEach(function(b){if(b.t0<=vt+1e-6&&b.t1>vt+1e-6)seg=b})}
  else sc.ballon.forEach(function(b){if(!seg&&b.t0<=vt+1e-6&&b.t1>vt+1e-6)seg=b});
  if(!seg)return;
  var p=[];for(var i=0;i<=18;i++){var s=i/18,h=seg.apex-(seg.z0+seg.z1)/2,z=seg.z0+(seg.z1-seg.z0)*s+4*h*s*(1-s);
    var x=seg.a.x+(seg.b.x-seg.a.x)*s,y=seg.a.y+(seg.b.y-seg.a.y)*s;p.push(f(x)+","+f(Y(y)-z*0.3))}
  el("polyline",{points:p.join(" "),"class":"trace-ballon"},g);
}

var phasePrec=null;
function rendre(){
  try{rendreTerrain()}catch(e){console.warn(e)}
  var sc=etat.sc,vt=vueT(),k=sc.phaseA(vt);
  var ph=k+"|"+sc.o.r+"|"+sc.o.sit+"|"+(sc.o.att||"")+"|"+(sc.o.fin||"")+"|"+sc.o.exc+"|"+etat.demo;
  if(ph!==phasePrec){phasePrec=ph;majConsigne();annoncer()}
  document.getElementById("observer").hidden=!(!etat.joue&&sc.contacts.some(function(c){return Math.abs(c-vt)<1e-6}));

function rendreTerrain(){
  var sc=etat.sc,vt=vueT(),r=sc.rotA(vt),bal=sc.balleA(vt),suivi=etat.poste;
  majAdv();
  svg.classList.toggle("attenue",suivi!=="equipe");
  IDS.forEach(function(id){
    var p=sc.pos(id,vt),g=pions[id],tg=tags[id];
    g.setAttribute("transform","translate("+f(p.x)+" "+f(Y(p.y))+")");
    tg.g.setAttribute("transform","translate("+f(p.x)+" "+f(Y(p.y))+")");
    var cible=bal?P(bal.x,bal.y):P(p.x,-1),ang=Math.atan2(Y(cible.y)-Y(p.y),cible.x-p.x)*180/Math.PI;
    if(dist(cible,p)<0.05)ang=-90;
    g.querySelector(".orient").setAttribute("transform","rotate("+f(ang)+")");
    var lb=libellePion(r,id),lt=g.querySelector(".lbl");
    if(lt.textContent!==lb){lt.textContent=lb;if(labelPrec[id]&&!etat.reduit){g.classList.remove("flash");void g.getBBox();g.classList.add("flash")}}
    labelPrec[id]=lb;
    var estS=roleAffiche(r,id)==="S";
    g.classList.toggle("toi",suivi===id);g.classList.toggle("passeuse",estS);
    var h=[];if(suivi===id)h.push(t("toi"));if(estS)h.push(t("tagPasseuse"));
    if(!sc.demo&&sc.o.exc&&id===sc.backup)h.push(t("tagDepannage"));
    tg.haut.textContent=h.join(" · ");tg.haut.setAttribute("class","tag"+(suivi===id?" toi":""));
    tg.bas.textContent=paire(id)?t("tagSuivie",{id:id}):"";
  });
  /* la joueuse suivie au-dessus des autres */
  if(suivi!=="equipe"){pions[suivi].parentNode.appendChild(pions[suivi])}
  sc.adv.forEach(function(id){var p=sc.pos(id,vt);advEls[id].setAttribute("transform","translate("+f(p.x)+" "+f(Y(p.y))+")")});
  if(bal){balleEls.ombre.style.display="";balleEls.g.style.display="";
    balleEls.ombre.setAttribute("cx",f(bal.x));balleEls.ombre.setAttribute("cy",f(Y(bal.y)));
    var s=1+bal.z*0.06;balleEls.g.setAttribute("transform","translate("+f(bal.x)+" "+f(Y(bal.y)-bal.z*0.3)+") scale("+f(s)+")")}
  else{balleEls.ombre.style.display="none";balleEls.g.style.display="none"}
  majChemins(vt);majTraceBallon(vt);majSoutien(vt);
  document.getElementById("g-bases").style.display=basesVisibles(vt)?"":"none";
  /* la trace du trajet déjà parcouru par la joueuse suivie */
  var gc=document.getElementById("g-chemins"),old=gc.querySelector(".trace");if(old)old.remove();
  if(suivi!=="equipe"&&etat.trajets&&!etat.reduit&&vt>0){var pp=[];for(var i=0;i<=16;i++){var tt=Math.max(0,vt-2.5)+(Math.min(2.5,vt))*i/16;pp.push(sc.pos(suivi,tt))}
    el("polyline",{points:pts2(pp),"class":"trace"},gc)}
}

function prepAction(sc,rk){return {FL:sc.keep?"a_garde4":"a_prep4",FC:"a_prep3",FR:sc.keep?"a_garde2":"a_prep2",BS:"a_cible",BC:"a_arriere_pret",BA:"a_arriere_pret"}[rk]}
function defAction(rk){return {BS:"a_def1",BC:"a_def5",BA:"a_def6"}[rk]||"a_filet"}
function baseAction(rk){return {FL:"a_filet4",FC:"a_filet3",FR:"a_filet2",BS:"a_def1",BC:"a_def5",BA:"a_def6"}[rk]}
function blocAction(sc,rk){var e=sc.o.exc;return {FC:"a_bloc",FR:"a_bloc",FL:"a_recule",BA:e?"a_ajuste6":"a_defend_fond",BS:e?"a_defendre_toi":"a_ajuste1",BC:"a_ajuste5"}[rk]}
function apresBloc(sc,id,rk){var e=sc.o.exc;return {FC:"a_apres_bloc",FR:e&&id===sc.backup?"a_deuxieme":"a_apres_bloc",FL:"a_prep4",
  BA:e?"a_arriere_pret":"a_defendre_passeuse",BS:e?"a_defendre_toi":"a_apres_def_cible",BC:"a_arriere_pret"}[rk]}
function actions(sc,id,k){
  var o=sc.o,rk=sc.role[id],av=!!rk&&rk.charAt(0)==="F",exc=o.exc,bk=sc.backup,pn=sc.passeNow;
  var prep=prepAction(sc,rk),def=defAction(rk),suite=av?"a_pret_attaque":"a_vers_soutien";
  var sup=sc.soutien&&sc.soutien[id]?(sc.soutien[id].k==="p"?"a_proche":"a_loin"):"a_vers_soutien";
  if(sc.demo){
    if(k==="gain")return ["a_regarde_gain","a_tourner"];
    if(id===sc.serveuse)return k==="tourne"?["a_tourner","a_devenir_serveuse"]:["a_devenir_serveuse","a_servir"];
    return k==="tourne"?["a_tourner","a_attendre_service"]:["a_attendre_service","a_pret_adverse"];
  }
  switch(k){
  case "avant":
    if(o.sit==="sert")return id===sc.serveuse?["a_servir","a_entrer"]:["a_attendre_service",baseAction(rk)];
    if(rk==="BS")return exc?["a_recevoir_pret","a_laisser"]:["a_attendre_service","a_penetration"];
    if(exc&&id===bk)return ["a_attendre_service","a_deuxieme"];
    if(id===sc.rec)return ["a_recevoir_pret","a_recevoir"];
    if(famille(id)==="OH"||rk==="BC")return ["a_recevoir_pret",prep];
    return ["a_attendre_service",prep];
  case "service":
    if(o.sit==="sert")return [id===sc.serveuse?"a_entrer":baseAction(rk),blocAction(sc,rk)];
    if(rk==="BS")return exc?["a_recevoir_toi","a_laisser"]:["a_penetration","a_passer"];
    if(exc&&id===bk)return ["a_lire_deuxieme","a_deuxieme"];
    if(id===sc.rec)return ["a_recevoir",prep];
    return [prep,suite];
  case "reception":
    if(rk==="BS")return exc?["a_laisser","a_vers_soutien"]:["a_arrive_cible","a_passer"];
    if(exc&&id===bk)return ["a_deuxieme","a_passer"];
    if(id===sc.rec)return ["a_degage",suite];
    return [prep,suite];
  case "construction":return [blocAction(sc,rk),apresBloc(sc,id,rk)];
  case "defense":
    if(id===sc.digger)return [exc?"a_defendre_toi":"a_defendre_passeuse",exc?"a_laisser":"a_arriere_pret"];
    return [blocAction(sc,rk),apresBloc(sc,id,rk)];
  case "relance":
    if(rk==="BS")return exc?["a_laisser","a_vers_soutien"]:["a_cible","a_passer"];
    if(exc&&id===bk)return ["a_deuxieme","a_passer"];
    return [av?prep:"a_arriere_pret",suite];
  case "choix":
    if(id===pn)return ["a_passer","a_apres_passe"];
    if(av)return ["a_pret_attaque","a_sinon_soutien"];
    return ["a_arriere_pret","a_vers_soutien"];
  case "passe":
    if(id===sc.att)return ["a_elan","a_retombe"];
    if(id===pn)return ["a_apres_passe",sup];
    return ["a_ailleurs",sup];
  case "attaque":case "fin":
    if(id===sc.att)return ["a_retombe","a_rejouer"];
    return [sup,def];
  case "bloc":case "reprise":case "finbloc":
    if(id===sc.releveuse)return ["a_relever","a_continuer"];
    if(id===sc.att)return ["a_retombe","a_rester_soutien"];
    return [sup,"a_rester_soutien"];
  default:return [def,"a_pret_adverse"];
  }
}
function messagePhase(sc,k){
  var o=sc.o;
  if(sc.demo){if(k==="serveuse")return t("ph_serveuse",{qui:sc.serveuse});if(k==="findemo")return t("ph_findemo",{n:sc.suivante});return t("ph_"+k)}
  if(k==="avant"||k==="service")return t("ph_"+k+"_"+o.sit);
  if((k==="reception"||k==="defense"||k==="relance")&&o.exc)return t("ph_"+k+"_exc");
  return t("ph_"+k);
}
function contexte(sc,k,r){
  var c=[],o=sc.o;if(sc.demo)return c;
  if(o.exc)c.push(t("excActive",{qui:libelleJoueuse(r,sc.backup)})+" "+t("memeJoueuse"));
  else if(sc.keep&&k!=="transition"&&k!=="endefense")c.push(t("gardeCote")+" "+t("gardeDetail",{g:libelleJoueuse(r,sc.R.FL),d:libelleJoueuse(r,sc.R.FR)}));
  if(k==="service"&&o.sit==="recoit")c.push(t("defPenetration"));
  if((k==="construction"||k==="defense")&&o.sit==="sert")c.push(t("exempleDef"));
  if(k==="passe"&&sc.att)c.push(t("attaqueDe",{n:o.att,qui:libelleJoueuse(r,sc.att)})+" "+t("defSoutien"));
  return c.slice(0,2);
}
function noteRotation(id,r,sit){
  var s=[],av=estAvant(r,id),k=garderAiles(r,sit),R=rolesScene(r,sit);
  if(paire(id)){
    var entre=(id==="Opp"&&r===1)||(id==="S"&&r===4),sort=(id==="Opp"&&r===4)||(id==="S"&&r===1);
    if(av){s.push(t(entre?(id==="Opp"?"n_versAvantOpp":"n_versAvantS"):"n_opp"));s.push(t(k?"n_garde4":"n_droite"))}
    else s.push(t(sort?"n_versArriere":"n_toujoursS"));
  }else if(famille(id)==="OH")s.push(t(av?(R.FR===id?"n_ohDroite":"n_ohAvant"):"n_ohArriere"));
  else s.push(t(av?"n_mbAvant":"n_mbArriere"));
  return s.join(" ");
}
function nomRole(r,id){var ra=roleAffiche(r,id);if(ra==="S")return t("roleS");if(ra==="Opp")return t("roleOpp");return t(famille(id)==="OH"?"roleOH":"roleMB",{id:id})}
function majConsigne(){
  var sc=etat.sc,vt=vueT(),k=sc.phaseA(vt),r=sc.rotA(vt),box=document.getElementById("consigne"),h=document.getElementById("t-consigne");
  box.textContent="";
  function p(txt,c){var e=document.createElement("p");if(c)e.className=c;e.textContent=txt;box.appendChild(e)}
  var m=sc.reperes(),n=0;m.forEach(function(x,i){if(x<=vt+1e-6)n=i+1});
  var total=m.length+(sc.Tc!=null&&!etat.att&&!sc.demo?2:0);
  document.getElementById("etape").textContent=t("etape",{n:n,total:Math.max(total,n)});
  if(etat.poste==="equipe"){
    h.textContent=t("titreEquipe");
    if(vt===0&&!sc.demo){p(t("invite"),"principal");return}
    p(messagePhase(sc,k),"principal");contexte(sc,k,r).forEach(function(c){p(c,"ctx")});
  }else{
    var id=etat.poste,a=actions(sc,id,k);h.textContent=t("titreMoi");
    p(t("l1",{id:id,role:nomRole(r,id)}));
    p(t("l2",{rang:t(estAvant(r,id)?"rangAvant":"rangArriere"),action:minus1(t(a[0]))}),"principal");
    p(t("l3",{action:minus1(t(a[1]))}),"ctx");
  }
}
function annoncer(){
  var sc=etat.sc,vt=vueT(),k=sc.phaseA(vt),txt=messagePhase(sc,k);
  if(etat.poste!=="equipe"){var a=actions(sc,etat.poste,k);txt+=" "+t(a[0])}
  document.getElementById("annonce").textContent=txt;
  document.getElementById("terrain-desc").textContent=txt;
}

var derniereRot=null;
function choisirPoste(id){etat.poste=id;ecrirePrefs();ecrireLien();phasePrec=null;cleChemins="";rendre();majUI();majQuestions()}
function bouton(txt,cls,fn,parent){var b=document.createElement("button");b.type="button";b.className=cls||"btn";b.textContent=txt;b.addEventListener("click",fn);if(parent)parent.appendChild(b);return b}

function construireSelecteurs(){
  var ps=document.getElementById("postes");ps.textContent="";
  ["equipe"].concat(IDS).forEach(function(id){
    var b=bouton("","chip",function(){choisirPoste(id)},ps);b.dataset.poste=id;
    if(id!=="equipe"){var s=document.createElement("span");s.className="pastille";s.style.background=COUL[id];s.setAttribute("aria-hidden","true");b.appendChild(s)}
    b.appendChild(document.createTextNode(id==="equipe"?t("equipe"):id));
  });
  var rs=document.getElementById("rots");rs.textContent="";
  for(var i=1;i<=6;i++)(function(n){var b=bouton("R"+n,"chip",function(){etat.r=n;reinitialiser()},rs);b.dataset.r=n;b.setAttribute("aria-label",t("rotAria",{n:n}))})(i);
}
function majTextes(){
  document.documentElement.lang=etat.lang;
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.dataset.t,{v:VERSION})});
  document.querySelectorAll("[data-t-aria]").forEach(function(e){e.setAttribute("aria-label",t(e.dataset.tAria))});
  document.title=t("titre")+" — Les Wonders";
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.lang===etat.lang))});
  construireSelecteurs();dessinerFond();cleSoutien="";cleChemins="";phasePrec=null;
  majComprendre();majQuestions();rendre();majUI();
}
function majUI(){
  var sc=etat.sc,vt=vueT(),r=sc.rotA(vt);
  document.querySelectorAll("#postes .chip").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.poste===etat.poste))});
  document.querySelectorAll("[data-sit]").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.sit===etat.sit&&!etat.demo))});
  document.querySelectorAll("#rots .chip").forEach(function(b){b.setAttribute("aria-pressed",String(+b.dataset.r===etat.r&&!etat.demo))});
  var pa=passeuseActive(r);
  document.getElementById("badge-passeuse").textContent=t("badgePasseuse",{r:"S",id:pa});
  /* suivi */
  var sv=document.getElementById("suivi");
  if(etat.poste==="equipe")sv.hidden=true;
  else{sv.hidden=false;var id=etat.poste;
    document.getElementById("suivi-badge").textContent=paire(id)?t("suivi",{id:id,r:roleAffiche(r,id)}):t("suiviSimple",{id:id});
    var note=document.getElementById("note"),nt=noteRotation(id,r,sc.demo?"sert":etat.sit);
    if(note.textContent!==nt){note.textContent=nt;var cle=id+"|"+r;
      if(derniereRot&&derniereRot!==cle&&!etat.reduit){note.classList.remove("flash");void note.offsetWidth;note.classList.add("flash")}derniereRot=cle}}
  /* lecture */
  var bv=document.getElementById("b-voir");
  bv.textContent=etat.joue?t("pause"):(vt>0&&!aLaFin()?t("reprendre"):t("voir"));
  bv.setAttribute("aria-pressed",String(etat.joue));
  document.getElementById("b-ralenti").setAttribute("aria-pressed",String(etat.lent));
  document.getElementById("b-prec").disabled=vt<=1e-6&&!etat.joue;
  document.getElementById("b-suiv").disabled=aLaFin()&&!etat.joue;
  /* attaques */
  var at=document.getElementById("attaques"),ch=enChoix()&&!etat.joue;at.hidden=!ch;at.textContent="";
  if(ch){var A=attaquantes(etat.r,etat.sit);[[4,"gauche"],[3,"centre"],[2,"droite"]].forEach(function(x){
    var a=x[0],qui=libelleJoueuse(r,A[a]),ind=indispo(sc,a),b=bouton("","btn",function(){choisirAttaque(a)},at);
    b.dataset.att=a;b.appendChild(document.createTextNode(a+" · "+t(x[1])));
    var sm=document.createElement("small");sm.textContent=ind?t("indispo",{qui:qui}):qui;b.appendChild(sm);
    if(ind){b.setAttribute("aria-disabled","true");b.disabled=true}})}
  var ind=document.getElementById("indice");ind.hidden=!(etat.indice&&ch);ind.textContent=t("choisis");
  /* suites */
  var su=document.getElementById("suites");su.textContent="";
  if(!etat.joue){
    if(sc.demo){if(aLaFin())bouton(t("continuerRot",{n:sc.suivante}),"btn primaire",finDemo,su);bouton(t("quitterDemo"),"btn",reinitialiser,su)}
    else if(etat.att&&vt>sc.Tc+1e-6){
      bouton(t("autreAttaque"),"btn",autreAttaque,su);
      if(aLaFin()&&etat.fin!=="bloc")bouton(t("etSiRevient"),"btn",etSiRevient,su);
      if(aLaFin()&&!etat.fin)bouton(t("retourDefense"),"btn",versDefense,su);
    }
  }
  majEtSi();
}
function majComprendre(){
  var c=document.getElementById("c-comprendre");c.textContent="";
  var ul=document.createElement("ul");
  ["c_positions","c_passeuses","c_qui","c_penetration","c_cible","c_soutien","c_defense","c_ailes","c_rotation"].forEach(function(k){var li=document.createElement("li");li.textContent=t(k);ul.appendChild(li)});
  c.appendChild(ul);
  bouton(t("comprendreRot"),"btn",lancerDemo,c);
  var p=document.createElement("p");p.className="note";p.textContent=t("c_choix");c.appendChild(p);
}
function majEtSi(){
  var c=document.getElementById("c-etsi");c.textContent="";
  var p=document.createElement("p");p.textContent=t("e_intro");c.appendChild(p);
  if(etat.exc){p=document.createElement("p");p.className="retour non";p.textContent=t("e_actif");c.appendChild(p)}
  var b=bouton(t(etat.exc?"e_off":"e_on"),"btn",function(){etat.exc=!etat.exc;reinitialiser()},c);b.id="b-exception";
  b.setAttribute("aria-pressed",String(etat.exc));
  p=document.createElement("p");p.className="note";p.textContent=t("e_bloc");c.appendChild(p);
}
/* À toi : trois questions de principe, sans score ni minuteur. */
function majQuestions(){
  var c=document.getElementById("c-atoi"),r=etat.r;c.textContent="";
  function q(titre,opts,okTxt,revoir){
    var d=document.createElement("div");d.className="question";c.appendChild(d);
    var p=document.createElement("p");p.className="q";p.textContent=titre;d.appendChild(p);
    var ch=document.createElement("div");ch.className="choix";d.appendChild(ch);
    var ret=document.createElement("p");ret.className="retour";ret.setAttribute("role","status");
    opts.forEach(function(o){bouton(o[0],"btn",function(){
      ret.textContent="";
      if(o[1]){ret.className="retour ok";ret.textContent=okTxt}
      else{ret.className="retour non";ret.textContent=t("qNon")+" ";
        var bb=bouton(t("qRevoir"),"btn",function(){revoir()},null);ret.appendChild(bb)}},ch)});
    d.appendChild(ret);
  }
  if(paire(etat.poste)){var ra=roleAffiche(r,etat.poste);
    q(t("q1role"),[[t("qPasseuse"),ra==="S"],[t("qAttaquante"),ra==="Opp"]],t("q1ok",{id:etat.poste,role:t(ra==="S"?"roleS":"roleOpp")}),function(){reinitialiser()});
  }else{var pa=passeuseActive(r);
    q(t("q1equipe"),IDS.map(function(id){return [libelleJoueuse(r,id),id===pa]}),t("q1okEq",{qui:libelleJoueuse(r,pa)}),function(){reinitialiser()});
  }
  q(t("q2"),[[t("q2c"),false],[t("q2a"),true],[t("q2b"),false]],t("q2ok"),function(){reinitialiser();etat.t=etat.sc.T1;rendre();majUI()});
  q(t("q3"),[[t("q3b"),false],[t("q3c"),false],[t("q3a"),true]],t("q3ok"),function(){reinitialiser();etat.t=etat.sc.Tc;rendre();majUI()});
}

/* ══ 10. Démarrage ═══════════════════════════════════════════════════════ */
function init(){
  var pr=lirePrefs();valide(pr);if(pr.lent===true)etat.lent=true;
  var sys=false;try{sys=matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
  etat.reduit=typeof pr.reduit==="boolean"?pr.reduit:sys;
  valide(lireLien());
  document.getElementById("o-reduire").checked=etat.reduit;
  reconstruire();creerPions();
  document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){etat.lang=b.dataset.lang;ecrirePrefs();ecrireLien();majTextes()})});
  document.querySelectorAll("[data-sit]").forEach(function(b){b.addEventListener("click",function(){etat.sit=b.dataset.sit;reinitialiser()})});
  document.getElementById("b-voir").addEventListener("click",voir);
  document.getElementById("b-suiv").addEventListener("click",suivante);
  document.getElementById("b-prec").addEventListener("click",precedente);
  document.getElementById("b-recommencer").addEventListener("click",recommencer);
  document.getElementById("b-ralenti").addEventListener("click",function(){etat.lent=!etat.lent;ecrirePrefs();majUI()});
  document.getElementById("o-trajets").addEventListener("change",function(e){etat.trajets=e.target.checked;cleChemins="";rendre()});
  document.getElementById("o-reduire").addEventListener("change",function(e){var j=etat.joue;if(j)arreter();etat.reduit=e.target.checked;
    if(etat.reduit)etat.t=vueT();ecrirePrefs();cleChemins="";phasePrec=null;rendre();majUI()});
  document.getElementById("aide-btn").addEventListener("click",function(){var a=document.getElementById("aide"),o=a.hidden;a.hidden=!o;this.setAttribute("aria-expanded",String(o))});
  document.getElementById("b-lien").addEventListener("click",function(){ecrireLien();var ret=document.getElementById("lien-retour");
    function ok(){ret.textContent=t("lienCopie")}function non(){ret.textContent=t("lienEchec")}
    try{navigator.clipboard.writeText(location.href).then(ok,non)}catch(e){non()}});
  document.addEventListener("visibilitychange",function(){if(document.hidden&&etat.joue)arreter()});
  window.addEventListener("hashchange",function(){var a=JSON.stringify([etat.lang,etat.r,etat.sit,etat.poste]);valide(lireLien());
    if(JSON.stringify([etat.lang,etat.r,etat.sit,etat.poste])!==a){reinitialiser();majTextes()}});
  majTextes();ecrireLien();
}

window.SixDeux={version:VERSION,IDS:IDS,rotation:rotation,posRot:posRot,estAvant:estAvant,roleAffiche:roleAffiche,
  passeuseActive:passeuseActive,partenaireAvant:partenaireAvant,garderAiles:garderAiles,rolesScene:rolesScene,
  baseDefense:baseDefense,attaquantes:attaquantes,construire:construire,indispo:indispo,actions:actions,noteRotation:noteRotation,
  cles:function(l){return Object.keys(I18N[l])},
  constantes:{GRILLE_SERVICE:GRILLE_SERVICE,SERVEUSE:SERVEUSE,CIBLE:CIBLE,ATTENTE:ATTENTE,FRAPPE:FRAPPE,SOUTIEN:SOUTIEN,RELEVE:RELEVE,DEF:DEF,BASES:BASES,RECEPTRICE:RECEPTRICE,ROLE_ATT:ROLE_ATT},
  etat:function(){return {lang:etat.lang,poste:etat.poste,sit:etat.sit,r:etat.r,exc:etat.exc,att:etat.att,fin:etat.fin,demo:etat.demo,
    t:etat.t,vt:vueT(),joue:etat.joue,lent:etat.lent,reduit:etat.reduit,phase:etat.sc.phaseA(vueT()),Tc:etat.sc.Tc,fin_t:etat.sc.fin}},
  position:function(id){var p=etat.sc.pos(id,vueT());return {x:p.x,y:p.y}}};
init();
})();
